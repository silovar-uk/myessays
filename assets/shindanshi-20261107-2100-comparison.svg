<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340"><rect width="960" height="340" fill="#f7f9fc"/><text x="40" y="48" font-size="27" font-family="sans-serif" fill="#172b4d">補助金の効果を測るには「導入後」だけでは足りない</text><g font-family="sans-serif" font-size="21"><rect x="45" y="100" width="245" height="112" rx="12" fill="#dceafa"/><text x="67" y="146">採択・導入した企業</text><text x="67" y="181" font-size="17">導入前 → 導入後</text><rect x="365" y="100" width="245" height="112" rx="12" fill="#e3f5e8"/><text x="387" y="146">比較する企業</text><text x="387" y="181" font-size="17">同じ期間の変化</text><rect x="685" y="100" width="235" height="112" rx="12" fill="#fff0d6"/><text x="708" y="146">変化の差を比較</text><text x="708" y="181" font-size="17">条件差に注意</text><text x="310" y="165" font-size="30">→</text><text x="630" y="165" font-size="30">→</text></g><text x="45" y="267" font-size="19" font-family="sans-serif" fill="#344563">単純な前後比較には景気・需要・企業特性の変化も混ざる。</text><text x="45" y="301" font-size="15" font-family="sans-serif" fill="#526579">概念図／数値なし。出典：中小機構2026年10月30日告知を起点とする独自整理。</text></svg>
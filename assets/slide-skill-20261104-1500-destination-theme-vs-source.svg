<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="PowerPointのスライド貼り付けで、貼り付け先のテーマを使う場合と元の書式を保持する場合の比較"><rect width="1200" height="580" fill="#f5f7fb"/><text x="50" y="62" font-family="sans-serif" font-size="32" font-weight="bold" fill="#17253b">コピーしたスライドは「内容」と「書式」を分けて考える</text><rect x="50" y="105" width="335" height="345" rx="16" fill="#fff" stroke="#b7c4d5" stroke-width="3"/><rect x="70" y="125" width="295" height="75" fill="#c83737"/><text x="90" y="173" fill="white" font-family="sans-serif" font-size="25">元資料：赤テーマ</text><text x="82" y="263" fill="#243349" font-family="sans-serif" font-size="23">主張：顧客継続率が上昇</text><rect x="90" y="295" width="72" height="110" fill="#d85b5b"/><rect x="185" y="255" width="72" height="150" fill="#d85b5b"/><text x="75" y="430" font-family="sans-serif" font-size="18">図表と文章をコピー</text><path d="M400 275 H480" stroke="#71839c" stroke-width="7"/><path d="M465 261 L487 275 L465 289" fill="none" stroke="#71839c" stroke-width="7"/><rect x="505" y="105" width="305" height="345" rx="16" fill="#fff" stroke="#2563a5" stroke-width="3"/><rect x="525" y="125" width="265" height="75" fill="#2563a5"/><text x="537" y="173" fill="white" font-family="sans-serif" font-size="22">貼り付け先テーマ</text><text x="535" y="263" fill="#243349" font-family="sans-serif" font-size="21">同じ内容・青テーマ</text><rect x="548" y="295" width="65" height="110" fill="#4384c4"/><rect x="640" y="255" width="65" height="150" fill="#4384c4"/><rect x="835" y="105" width="315" height="345" rx="16" fill="#fff" stroke="#c83737" stroke-width="3"/><rect x="855" y="125" width="275" height="75" fill="#c83737"/><text x="867" y="173" fill="white" font-family="sans-serif" font-size="22">元の書式を保持</text><text x="865" y="263" fill="#243349" font-family="sans-serif" font-size="21">同じ内容・赤テーマ</text><rect x="875" y="295" width="65" height="110" fill="#d85b5b"/><rect x="967" y="255" width="65" height="150" fill="#d85b5b"/><text x="530" y="487" font-family="sans-serif" font-size="21" fill="#2563a5">統一資料に組み込む</text><text x="845" y="487" font-family="sans-serif" font-size="21" fill="#bd3333">原典のデザインを残す</text><text x="50" y="545" font-family="sans-serif" font-size="18" fill="#52627b">模式図（実際のPowerPoint画面ではない）。テーマ依存の要素と手動書式は別途確認。</text></svg>
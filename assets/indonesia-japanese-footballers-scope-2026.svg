  <text x="780" y="245" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#171717">クラブ所属</text>
  <text x="780" y="282" font-family="system-ui, sans-serif" font-size="22" fill="#555">国内1部ロスター外</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280"><rect width="1000" height="280" fill="#f7fafc"/><text x="30" y="42" font-size="25" font-family="sans-serif">増益要因の診断フロー（概念図）</text><rect x="20" y="90" width="175" height="80" rx="10" fill="#315c82"/><text x="107" y="137" font-size="21" text-anchor="middle" font-family="sans-serif" fill="white">売上増</text><text x="185" y="137" font-size="24" font-family="sans-serif">→</text><rect x="218" y="90" width="175" height="80" rx="10" fill="#315c82"/><text x="305" y="137" font-size="17" text-anchor="middle" font-family="sans-serif" fill="white">客数・単価・構成</text><text x="383" y="137" font-size="24" font-family="sans-serif">→</text><rect x="416" y="90" width="175" height="80" rx="10" fill="#315c82"/><text x="503" y="137" font-size="21" text-anchor="middle" font-family="sans-serif" fill="white">変動費</text><text x="581" y="137" font-size="24" font-family="sans-serif">→</text><rect x="614" y="90" width="175" height="80" rx="10" fill="#315c82"/><text x="701" y="137" font-size="21" text-anchor="middle" font-family="sans-serif" fill="white">固定費</text><text x="779" y="137" font-size="24" font-family="sans-serif">→</text><rect x="812" y="90" width="175" height="80" rx="10" fill="#147c70"/><text x="899" y="137" font-size="21" text-anchor="middle" font-family="sans-serif" fill="white">営業利益</text><text x="30" y="232" font-size="18" font-family="sans-serif">各段階の実測値が必要。矢印は因果の実証を意味しない。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="t d"><title id="t">点群データから輪が生まれ、消える尺度の説明</title><desc id="d">8個の点を輪状に配置。尺度が小さいと離れて見え、中くらいだと輪がつながり、尺度が大きいと中央まで埋まって輪が消える。概念図であり実際の計算結果ではない。</desc><rect width="1200" height="550" fill="#f2f5f3"/><text x="55" y="63" font-family="sans-serif" font-size="32" font-weight="700" fill="#183b3a">同じ点群でも、見る尺度で「穴」が生まれたり消えたりする</text><text x="55" y="98" font-family="sans-serif" font-size="18" fill="#607673">持続的ホモロジー：尺度を動かしながら、連結成分や輪の寿命を追跡する</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="133" width="350" height="343" rx="18" fill="#fff"/><rect x="423" y="133" width="350" height="343" rx="18" fill="#fff"/><rect x="801" y="133" width="350" height="343" rx="18" fill="#fff"/><text x="219" y="176" font-size="22" fill="#294d4d" font-weight="700">尺度 小：点がバラバラ</text><text x="598" y="176" font-size="22" fill="#294d4d" font-weight="700">尺度 中：輪が見える</text><text x="975" y="176" font-size="22" fill="#294d4d" font-weight="700">尺度 大：中央まで埋まる</text></g><g fill="#277b78"><circle cx="220" cy="230" r="9"/><circle cx="282" cy="259" r="9"/><circle cx="310" cy="322" r="9"/><circle cx="282" cy="384" r="9"/><circle cx="220" cy="414" r="9"/><circle cx="158" cy="384" r="9"/><circle cx="130" cy="322" r="9"/><circle cx="158" cy="259" r="9"/></g><g fill="#277b78" fill-opacity=".13" stroke="#277b78" stroke-opacity=".5" stroke-width="2"><circle cx="598" cy="230" r="39"/><circle cx="660" cy="259" r="39"/><circle cx="688" cy="322" r="39"/><circle cx="660" cy="384" r="39"/><circle cx="598" cy="414" r="39"/><circle cx="536" cy="384" r="39"/><circle cx="508" cy="322" r="39"/><circle cx="536" cy="259" r="39"/></g><g fill="#277b78" fill-opacity=".2" stroke="#277b78" stroke-opacity=".45" stroke-width="2"><circle cx="976" cy="230" r="105"/><circle cx="1038" cy="259" r="105"/><circle cx="1066" cy="322" r="105"/><circle cx="1038" cy="384" r="105"/><circle cx="976" cy="414" r="105"/><circle cx="914" cy="384" r="105"/><circle cx="886" cy="322" r="105"/><circle cx="914" cy="259" r="105"/></g><text x="58" y="521" font-family="sans-serif" font-size="17" fill="#637773">※円盤の重なりで直観を示す概念図。位相的特徴の誕生・消滅を厳密に判定するには複体の構成と計算が必要。</text></svg>
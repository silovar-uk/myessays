<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title"><title id="title">消化の流れと胆汁の働き</title><rect width="960" height="650" rx="22" fill="#f8f5ee"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#345b75"/></marker><marker id="bile" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7c873d"/></marker></defs><g font-family="sans-serif" fill="#20364c"><text x="480" y="48" text-anchor="middle" font-weight="bold" font-size="30">消化の流れと胆汁が作用する位置</text><text x="480" y="78" text-anchor="middle" font-size="18">Digestive process and the role of bile</text><rect x="42" y="102" width="355" height="76" rx="10" fill="white" stroke="#345b75"/><text x="60" y="131" font-weight="bold" font-size="23">口</text><text x="60" y="158" font-size="19">かみ砕く</text><path d="M219 178 V198" stroke="#345b75" stroke-width="3" marker-end="url(#arr)"/><rect x="42" y="201" width="355" height="76" rx="10" fill="white" stroke="#345b75"/><text x="60" y="230" font-weight="bold" font-size="23">食道</text><text x="60" y="257" font-size="19">胃へ運ぶ</text><path d="M219 277 V297" stroke="#345b75" stroke-width="3" marker-end="url(#arr)"/><rect x="42" y="300" width="355" height="76" rx="10" fill="white" stroke="#345b75"/><text x="60" y="329" font-weight="bold" font-size="23">胃</text><text x="60" y="356" font-size="19">胃液と混ぜる</text><path d="M219 376 V396" stroke="#345b75" stroke-width="3" marker-end="url(#arr)"/><rect x="42" y="399" width="355" height="76" rx="10" fill="#dce5e9" stroke="#345b75"/><text x="60" y="428" font-weight="bold" font-size="23">小腸</text><text x="60" y="455" font-size="19">消化・栄養素の吸収</text><path d="M219 475 V495" stroke="#345b75" stroke-width="3" marker-end="url(#arr)"/><rect x="42" y="498" width="355" height="76" rx="10" fill="white" stroke="#345b75"/><text x="60" y="527" font-weight="bold" font-size="23">大腸</text><text x="60" y="554" font-size="19">水分の吸収など</text><rect x="560" y="112" width="350" height="80" rx="10" fill="#e8ecd8" stroke="#7c873d"/><text x="735" y="145" text-anchor="middle" font-size="24" font-weight="bold">肝臓</text><text x="735" y="174" text-anchor="middle" font-size="19">胆汁を作る</text><path d="M735 192 V226" stroke="#7c873d" stroke-width="3" marker-end="url(#bile)"/><rect x="560" y="231" width="350" height="80" rx="10" fill="#e8ecd8" stroke="#7c873d"/><text x="735" y="263" text-anchor="middle" font-size="24" font-weight="bold">胆嚢</text><text x="735" y="292" text-anchor="middle" font-size="19">胆汁を蓄える</text><path d="M735 311 V437 H407" fill="none" stroke="#7c873d" stroke-width="3" marker-end="url(#bile)"/><text x="560" y="426" text-anchor="middle" font-size="19" fill="#596629">胆汁が小腸へ</text><rect x="468" y="468" width="450" height="107" rx="12" fill="#fff" stroke="#c8d1d5"/><text x="693" y="503" text-anchor="middle" font-size="21" font-weight="bold">脂質を細かな滴に分散</text><text x="693" y="536" text-anchor="middle" font-size="19">脂質分解酵素が働きやすくなる</text><text x="480" y="620" text-anchor="middle" font-size="18">模式図：食べ物の経路と胆汁の経路は別</text></g></svg>
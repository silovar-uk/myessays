<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">構成比と総量を分ける二段グラフ</title><desc id="desc">架空のA事業は総数100から200、B事業は100から120。新規比率はAが30から40パーセント、Bが50から45パーセント。上段に実数棒、下段に構成比の積み上げ棒を置く。</desc><rect width="1000" height="500" fill="#f7f9fc"/><text x="45" y="52" font-size="28" font-family="sans-serif" font-weight="bold" fill="#17324d">総量と構成比は別々の図で読む</text><text x="45" y="94" font-size="18" font-family="sans-serif" fill="#36536d">上段：顧客数（人）／下段：新規・既存の構成（%）｜架空データ</text><text x="45" y="146" font-size="22" font-family="sans-serif" fill="#17324d">① 総量：Aは2倍、Bは1.2倍</text><text x="80" y="193" font-size="18" font-family="sans-serif">A 前</text><rect x="175" y="170" width="240" height="29" fill="#508ac4"/><text x="427" y="192" font-size="18">100</text><text x="80" y="235" font-size="18" font-family="sans-serif">A 後</text><rect x="175" y="212" width="480" height="29" fill="#508ac4"/><text x="667" y="234" font-size="18">200</text><text x="80" y="277" font-size="18" font-family="sans-serif">B 前</text><rect x="175" y="254" width="240" height="29" fill="#8a9db1"/><text x="427" y="276" font-size="18">100</text><text x="80" y="319" font-size="18" font-family="sans-serif">B 後</text><rect x="175" y="296" width="288" height="29" fill="#8a9db1"/><text x="475" y="318" font-size="18">120</text><text x="45" y="363" font-size="22" font-family="sans-serif" fill="#17324d">② 構成比：新規比率はA上昇、B低下</text><text x="78" y="408" font-size="18" font-family="sans-serif">A 前</text><rect x="175" y="386" width="144" height="25" fill="#e18d49"/><rect x="319" y="386" width="336" height="25" fill="#568fb9"/><text x="670" y="406" font-size="17">30% / 70%</text><text x="78" y="443" font-size="18" font-family="sans-serif">A 後</text><rect x="175" y="421" width="192" height="25" fill="#e18d49"/><rect x="367" y="421" width="288" height="25" fill="#568fb9"/><text x="670" y="442" font-size="17">40% / 60%</text><text x="175" y="482" font-size="17" font-family="sans-serif" fill="#555">橙＝新規　青＝既存　棒の全長＝100%</text></svg>
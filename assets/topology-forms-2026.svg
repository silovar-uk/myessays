<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">位相幾何学で同じ形と異なる形を区別する</title><desc id="desc">円周と四角形の輪郭は同相。球面とトーラス面は同相でない。マグカップとドーナツの比較には表面や境界の定義が必要。</desc><rect width="1200" height="590" fill="#f6f2eb"/><text x="58" y="61" font-family="sans-serif" font-size="34" font-weight="700" fill="#172d38">見た目が違う ≠ 位相的に違う</text><text x="58" y="94" font-family="sans-serif" font-size="19" fill="#5d6b72">形を比べる前に「何を対象とするか」を決める</text><rect x="50" y="128" width="530" height="386" rx="22" fill="#fff" stroke="#cbd8db" stroke-width="2"/><text x="78" y="164" font-family="sans-serif" font-size="23" fill="#14685f" font-weight="700">同相：切らず、貼らずに変形できる</text><circle cx="201" cy="303" r="87" fill="none" stroke="#178575" stroke-width="20"/><path d="M371 216L519 216L519 392L371 392Z" fill="none" stroke="#178575" stroke-width="20" stroke-linejoin="round"/><path d="M299 303h57" stroke="#597786" stroke-width="4"/><path d="m345 292 16 11-16 11" fill="none" stroke="#597786" stroke-width="4"/><text x="165" y="443" font-family="sans-serif" font-size="23" fill="#23353c">円周</text><text x="385" y="443" font-family="sans-serif" font-size="23" fill="#23353c">四角形の輪郭</text><text x="81" y="484" font-family="sans-serif" font-size="17" fill="#677982">※中を塗りつぶした円盤と円周は別の対象</text><rect x="612" y="128" width="537" height="386" rx="22" fill="#fff" stroke="#cbd8db" stroke-width="2"/><text x="642" y="164" font-family="sans-serif" font-size="23" fill="#ac5c3a" font-weight="700">非同相：穴の構造が異なる</text><circle cx="771" cy="304" r="93" fill="#dfeaf0" stroke="#496c81" stroke-width="7"/><ellipse cx="1002" cy="303" rx="96" ry="93" fill="#deac71" stroke="#8d5636" stroke-width="7"/><ellipse cx="1002" cy="302" rx="39" ry="43" fill="#fff" stroke="#8d5636" stroke-width="6"/><text x="746" y="442" font-family="sans-serif" font-size="23" fill="#23353c">球面</text><text x="959" y="442" font-family="sans-serif" font-size="23" fill="#23353c">トーラス面</text><text x="660" y="485" font-family="sans-serif" font-size="18" fill="#677982">閉じた曲面として比較：種数 0 ≠ 1</text><text x="58" y="556" font-family="sans-serif" font-size="18" fill="#56666d">図：本記事のために作成した概念図。写真のような遠近表現ではなく、比較する構造を模式化した。</text></svg>
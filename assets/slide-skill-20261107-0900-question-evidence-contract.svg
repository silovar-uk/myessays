<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="意思決定の問いから三つの必要証拠を経由し、試験導入の判定へ進む構造図"><rect width="1200" height="680" fill="#f6f8fc"/><text x="60" y="65" font-family="sans-serif" font-size="31" font-weight="bold" fill="#17304c">問い → 証拠 → 判定条件</text><rect x="60" y="105" width="1080" height="115" rx="16" fill="#183d66"/><text x="90" y="153" font-family="sans-serif" font-size="26" fill="white">意思決定の問い</text><text x="90" y="193" font-family="sans-serif" font-size="27" font-weight="bold" fill="white">3クラブで有償の試験導入をするか？</text><g fill="#e0eaf4" stroke="#9db6cf" stroke-width="2"><rect x="60" y="290" width="335" height="160" rx="14"/><rect x="432" y="290" width="335" height="160" rx="14"/><rect x="804" y="290" width="336" height="160" rx="14"/></g><g font-family="sans-serif" font-size="25" fill="#17304c"><text x="83" y="336">証拠① 支払う理由</text><text x="83" y="388" font-size="21">面談・有償意向</text><text x="455" y="336">証拠② 実行可能性</text><text x="455" y="388" font-size="21">許諾・運用の確認</text><text x="827" y="336">証拠③ 単位採算</text><text x="827" y="388" font-size="21">費用と粗利の試算</text></g><path d="M600 220V267M227 267H972M227 267V290M600 267V290M972 267V290M600 450V505" fill="none" stroke="#41739e" stroke-width="5"/><rect x="150" y="510" width="900" height="108" rx="16" fill="#d6eddf"/><text x="190" y="555" font-family="sans-serif" font-size="25" font-weight="bold" fill="#164b32">判定：必要な証拠が揃うまで全国展開を断定しない</text><text x="190" y="590" font-family="sans-serif" font-size="20" fill="#164b32">※架空の設計例。実績データではない。</text></svg>
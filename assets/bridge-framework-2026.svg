<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">ブリッジ：前提知識の六つの診断軸</title><desc id="desc">既有知識と新しい知識の間にある六つの点検軸。項目は順序を示さない。</desc><rect width="960" height="680" rx="22" fill="#f8f5ee"/><g font-family="sans-serif" fill="#20364c"><text x="480" y="53" text-anchor="middle" font-size="30" font-weight="bold">理解の間に橋を架ける</text><text x="480" y="84" text-anchor="middle" font-size="19">BRIDGE — Diagnostic Framework for Knowledge Gaps</text><rect x="36" y="119" width="188" height="93" rx="12" fill="#dce5e9"/><rect x="736" y="119" width="188" height="93" rx="12" fill="#dce5e9"/><text x="130" y="156" text-anchor="middle" font-size="22" font-weight="bold">既有知識</text><text x="130" y="185" text-anchor="middle" font-size="16">Prior knowledge</text><text x="830" y="156" text-anchor="middle" font-size="22" font-weight="bold">新しい知識</text><text x="830" y="185" text-anchor="middle" font-size="16">New knowledge</text><path d="M224 165 Q480 30 736 165 M224 165 H736" fill="none" stroke="#345b75" stroke-width="5"/><path d="M480 165 V241" stroke="#345b75" stroke-width="3" stroke-dasharray="6 6"/><text x="480" y="264" text-anchor="middle" font-size="23" font-weight="bold">隠れた前提を特定する六つの問い</text><rect x="36" y="285" width="434" height="93" rx="12" fill="#ffffff" stroke="#c8d1d5"/><rect x="50" y="299" width="64" height="64" rx="9" fill="#20364c"/><text x="82" y="344" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">B</text><text x="130" y="324" font-size="23" font-weight="bold">背景・目的</text><text x="130" y="352" font-size="18">Background</text><rect x="490" y="285" width="434" height="93" rx="12" fill="#ffffff" stroke="#c8d1d5"/><rect x="504" y="299" width="64" height="64" rx="9" fill="#20364c"/><text x="536" y="344" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">R</text><text x="584" y="324" font-size="23" font-weight="bold">関係性</text><text x="584" y="352" font-size="18">Relationship</text><rect x="36" y="392" width="434" height="93" rx="12" fill="#ffffff" stroke="#c8d1d5"/><rect x="50" y="406" width="64" height="64" rx="9" fill="#20364c"/><text x="82" y="451" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">I</text><text x="130" y="431" font-size="23" font-weight="bold">全体像・構成要素</text><text x="130" y="459" font-size="18">Inventory</text><rect x="490" y="392" width="434" height="93" rx="12" fill="#ffffff" stroke="#c8d1d5"/><rect x="504" y="406" width="64" height="64" rx="9" fill="#20364c"/><text x="536" y="451" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">D</text><text x="584" y="431" font-size="23" font-weight="bold">定義</text><text x="584" y="459" font-size="18">Definition</text><rect x="36" y="499" width="434" height="93" rx="12" fill="#ffffff" stroke="#c8d1d5"/><rect x="50" y="513" width="64" height="64" rx="9" fill="#20364c"/><text x="82" y="558" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">G</text><text x="130" y="538" font-size="23" font-weight="bold">因果・発生原理</text><text x="130" y="566" font-size="18">Genesis</text><rect x="490" y="499" width="434" height="93" rx="12" fill="#ffffff" stroke="#c8d1d5"/><rect x="504" y="513" width="64" height="64" rx="9" fill="#20364c"/><text x="536" y="558" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">E</text><text x="584" y="538" font-size="23" font-weight="bold">順序・過程</text><text x="584" y="566" font-size="18">Evolution</text><text x="480" y="638" text-anchor="middle" font-size="20">六類型は順序ではなく、理解の欠落を探す点検軸</text></g></svg>
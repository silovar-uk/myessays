<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280"><rect width="900" height="280" fill="#f8fafc"/><text x="24" y="38" font-family="sans-serif" font-size="24" fill="#172554">選択肢は「AI導入の有無」だけではない</text><rect x="24" y="62" width="850" height="59" rx="8" fill="#dbeafe"/><text x="40" y="97" font-size="19" font-family="sans-serif">資料検索</text><text x="295" y="97" font-size="18" font-family="sans-serif">着手が容易</text><text x="555" y="97" font-size="18" font-family="sans-serif">例外の理由が残らない</text><rect x="24" y="130" width="850" height="59" rx="8" fill="#e0f2fe"/><text x="40" y="165" font-size="19" font-family="sans-serif">聞き取り＋判断表</text><text x="295" y="165" font-size="18" font-family="sans-serif">理由を整理できる</text><text x="555" y="165" font-size="18" font-family="sans-serif">更新の負担がある</text><rect x="24" y="198" width="850" height="59" rx="8" fill="#dbeafe"/><text x="40" y="233" font-size="19" font-family="sans-serif">AI支援＋人の検証</text><text x="295" y="233" font-size="18" font-family="sans-serif">再利用しやすい</text><text x="555" y="233" font-size="18" font-family="sans-serif">誤りの拡散に注意</text></svg>
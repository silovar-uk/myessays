<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260"><rect width="960" height="260" fill="#f8fafc"/><text x="30" y="48" font-size="26" font-family="sans-serif" fill="#172554">契約審査：作業と判断を分ける</text><rect x="25" y="100" width="285" height="90" rx="12" fill="#e2e8f0"/><text x="43" y="150" font-size="19" font-family="sans-serif" fill="#0f172a">一次点検：外部サービス</text><text x="300" y="151" font-size="27">→</text><rect x="345" y="100" width="285" height="90" rx="12" fill="#e2e8f0"/><text x="363" y="150" font-size="19" font-family="sans-serif" fill="#0f172a">例外条項：専門家へ相談</text><text x="620" y="151" font-size="27">→</text><rect x="665" y="100" width="285" height="90" rx="12" fill="#dbeafe"/><text x="683" y="150" font-size="19" font-family="sans-serif" fill="#0f172a">取引条件：社内が承認</text><text x="30" y="229" font-size="16" font-family="sans-serif">提案上の役割分担。実際のサービス仕様ではない。</text></svg>
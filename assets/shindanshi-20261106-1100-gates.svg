<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><rect width="900" height="420" fill="#f8fafc"/><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#172033}</style><text x="40" y="55" font-size="28" font-weight="bold">投資判断の三関門（提案）</text><rect x="40" y="135" width="265" height="115" rx="15" fill="#dbeafe" stroke="#2563eb"/><text x="57" y="185" font-size="22">1. 顧客課題との適合</text><text x="145" y="285" font-size="34">↓</text><rect x="332" y="135" width="265" height="115" rx="15" fill="#dbeafe" stroke="#2563eb"/><text x="349" y="185" font-size="22">2. 人材・資金の制約</text><text x="437" y="285" font-size="34">↓</text><rect x="624" y="135" width="265" height="115" rx="15" fill="#dbeafe" stroke="#2563eb"/><text x="641" y="185" font-size="22">3. 小規模実験で検証</text><text x="729" y="285" font-size="34">↓</text><text x="270" y="350" font-size="26">通過した案だけ増額する</text></svg>
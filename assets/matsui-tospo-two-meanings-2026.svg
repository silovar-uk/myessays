<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" role="img" aria-label="一つの祝辞が失礼な内容と親密な冗談の二層の意味を持つ"><rect width="720" height="850" rx="24" fill="#122436"/><g font-family="sans-serif"><text x="35" y="63" font-size="37" fill="#fff" font-weight="700">同じ祝辞に、二つの意味</text><text x="35" y="107" font-size="25" fill="#acc7d2">言葉と関係性の両方を読む</text><rect x="35" y="150" width="650" height="210" rx="19" fill="#ffebe2"/><text x="68" y="207" font-size="28" fill="#9c421e" font-weight="700">表：文字どおりの内容</text><text x="68" y="267" font-size="43" fill="#382c29" font-weight="700">失礼な祝辞</text><text x="68" y="319" font-size="27" fill="#563e33">厚かましさ・取材への皮肉</text><path d="M360 377v35" stroke="#fee8a8" stroke-width="9" stroke-linecap="round"/><path d="M342 396l18 21 18-21" fill="none" stroke="#fee8a8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="434" width="650" height="210" rx="19" fill="#d9f5ed"/><text x="68" y="491" font-size="28" fill="#116654" font-weight="700">裏：二人の関係の意味</text><text x="68" y="551" font-size="43" fill="#1d4038" font-weight="700">親しい冗談</text><text x="68" y="603" font-size="27" fill="#35564d">長年の交流・記者の返答</text><rect x="35" y="692" width="650" height="115" rx="18" fill="#fae9ac"/><text x="360" y="741" text-anchor="middle" font-size="31" fill="#2d3439" font-weight="700">二つが同時に成立すると</text><text x="360" y="782" text-anchor="middle" font-size="31" fill="#2d3439" font-weight="700">笑いが生まれる</text></g></svg>
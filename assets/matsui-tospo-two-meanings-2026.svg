<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-label="祝辞の二重の意味。表の批判と裏の親密さ"><rect width="960" height="465" rx="22" fill="#122436"/><text x="46" y="66" font-family="sans-serif" font-size="29" fill="#fff" font-weight="700">同じ文章に、二つの意味が流れる</text><text x="46" y="101" font-family="sans-serif" font-size="18" fill="#acc7d2">内容の意味と関係の意味は、必ずしも一致しない</text><rect x="45" y="144" width="410" height="185" rx="16" fill="#ffebe2"/><rect x="505" y="144" width="410" height="185" rx="16" fill="#d9f5ed"/><text x="72" y="190" font-size="21" font-family="sans-serif" fill="#9c421e" font-weight="700">表に見える内容</text><text x="72" y="235" font-size="32" font-family="sans-serif" fill="#382c29" font-weight="700">失礼な祝辞</text><text x="72" y="282" font-size="20" font-family="sans-serif" fill="#563e33">厚かましさ・困った取材を指摘</text><text x="532" y="190" font-size="21" font-family="sans-serif" fill="#116654" font-weight="700">関係を示す合図</text><text x="532" y="235" font-size="32" font-family="sans-serif" fill="#1d4038" font-weight="700">親しい冗談</text><text x="532" y="282" font-size="20" font-family="sans-serif" fill="#35564d">快諾・長年の交流・記者の返答</text><path d="M455 236H505" stroke="#e9e6bc" stroke-width="4" stroke-dasharray="8 6"/><rect x="126" y="372" width="710" height="60" rx="14" fill="#fae9ac"/><text x="481" y="411" text-anchor="middle" font-size="26" font-family="sans-serif" fill="#2d3439" font-weight="700">両方を同時に読めるから、笑いになる</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#f8fafc"/><text x="42" y="52" font-family="sans-serif" font-size="27" font-weight="bold" fill="#132b45">投資判断は「採算」と「返済余力」を分ける</text><text x="42" y="84" font-family="sans-serif" font-size="17" fill="#475569">概念的な二軸判断図｜業界共通の数値基準ではない</text><g font-family="sans-serif" text-anchor="middle"><rect x="190" y="125" width="335" height="156" fill="#ffedd5" stroke="#ea580c"/><text x="357" y="181" font-size="22" fill="#9a3412">採算良・返済余力不足</text><text x="357" y="219" font-size="19" fill="#9a3412">融資条件や導入時期を再設計</text><rect x="527" y="125" width="335" height="156" fill="#dcfce7" stroke="#16a34a"/><text x="694" y="181" font-size="22" fill="#166534">採算良・返済余力あり</text><text x="694" y="219" font-size="19" fill="#166534">実行候補として詳細評価</text><rect x="190" y="283" width="335" height="156" fill="#fee2e2" stroke="#dc2626"/><text x="357" y="339" font-size="22" fill="#991b1b">採算弱・返済余力不足</text><text x="357" y="377" font-size="19" fill="#991b1b">原則として計画を再検討</text><rect x="527" y="283" width="335" height="156" fill="#dbeafe" stroke="#2563eb"/><text x="694" y="339" font-size="22" fill="#1e40af">採算弱・返済余力あり</text><text x="694" y="377" font-size="19" fill="#1e40af">資金があっても投資を再検討</text></g><text x="36" y="250" font-family="sans-serif" font-size="19" fill="#334155" transform="rotate(-90 36 250)">事業採算　高い ↑</text><text x="386" y="480" font-family="sans-serif" font-size="19" fill="#334155">返済余力　不足 ← → 十分</text><text x="43" y="523" font-family="sans-serif" font-size="16" fill="#64748b">出典：本記事の仮想企業に対する診断手順として独自作成</text></svg>
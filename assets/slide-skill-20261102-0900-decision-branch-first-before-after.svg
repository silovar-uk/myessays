<svg xmlns="http://www.w3.org/2000/svg" width="960" viewBox="0 0 960 1270" role="img" aria-labelledby="title desc"><title id="title">スライド改善のBeforeとAfter</title><desc id="desc">改善前は市場規模、競合、技術、顧客、リーグ接点、XRを羅列。改善後は判断条件、根拠、次の行動を3列に整理し、暫定結論を示した模式図。</desc><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif}</style><rect x="0" y="0" width="960" height="1270" rx="0" fill="#F5F8FC" stroke="none" stroke-width="1"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#146B81" stroke="none" stroke-width="1"/><text x="54" y="64" font-size="23" font-weight="700" fill="#176E83" >02 / BEFORE → AFTER</text><text x="54" y="116" font-size="38" font-weight="750" fill="#112A42" >「情報の量」から「判断の質」へ</text><rect x="54" y="157" width="852" height="362" rx="24" fill="#FFFFFF" stroke="#D5DFE9" stroke-width="2"/><rect x="75" y="179" width="159" height="45" rx="14" fill="#FBE7E8" stroke="none" stroke-width="1"/><text x="97" y="211" font-size="26" font-weight="750" fill="#A8444A" >BEFORE</text><text x="82" y="278" font-size="32" font-weight="750" fill="#102B46" >スポーツ映像市場の事業機会</text><rect x="82" y="315" width="243" height="57" rx="10" fill="#EDF1F5" stroke="none" stroke-width="1"/><text x="108" y="354" font-size="27" font-weight="700" fill="#506475" >TAM</text><rect x="350" y="315" width="243" height="57" rx="10" fill="#EDF1F5" stroke="none" stroke-width="1"/><text x="376" y="354" font-size="27" font-weight="700" fill="#506475" >競合</text><rect x="618" y="315" width="243" height="57" rx="10" fill="#EDF1F5" stroke="none" stroke-width="1"/><text x="644" y="354" font-size="27" font-weight="700" fill="#506475" >技術</text><rect x="82" y="386" width="243" height="57" rx="10" fill="#EDF1F5" stroke="none" stroke-width="1"/><text x="108" y="425" font-size="27" font-weight="700" fill="#506475" >顧客</text><rect x="350" y="386" width="243" height="57" rx="10" fill="#EDF1F5" stroke="none" stroke-width="1"/><text x="376" y="425" font-size="27" font-weight="700" fill="#506475" >リーグ接点</text><rect x="618" y="386" width="243" height="57" rx="10" fill="#EDF1F5" stroke="none" stroke-width="1"/><text x="644" y="425" font-size="27" font-weight="700" fill="#506475" >XR</text><text x="82" y="493" font-size="26" font-weight="700" fill="#A8444A" >問題：多くの情報があるが、判断対象が不明</text><path d="M 480 531 v 45" stroke="#2D8494" stroke-width="6" stroke-linecap="round"/><path d="M 469 567 l 11 14 11 -14" stroke="#2D8494" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="54" y="598" width="852" height="605" rx="24" fill="#FFFFFF" stroke="#B9D9E0" stroke-width="2"/><rect x="75" y="618" width="149" height="45" rx="14" fill="#DEF3F4" stroke="none" stroke-width="1"/><text x="96" y="651" font-size="26" font-weight="750" fill="#116C77" >AFTER</text><text x="82" y="716" font-size="32" font-weight="750" fill="#102B46" >実証判断に必要な条件を確認する</text><rect x="80" y="751" width="254" height="310" rx="16" fill="#E9F1F8" stroke="none" stroke-width="1"/><text x="98" y="801" font-size="27" font-weight="760" fill="#183A50" >判断条件</text><path d="M 98 819 h 218" stroke="#B7C9D4" stroke-width="2"/><text x="98" y="866" font-size="26" font-weight="650" fill="#183A50" >共通課題は</text><text x="98" y="901" font-size="26" font-weight="650" fill="#183A50" >存在するか</text><path d="M 98 920 h 218" stroke="#CBD8DF" stroke-width="2"/><text x="98" y="967" font-size="26" font-weight="650" fill="#183A50" >導入主体は</text><text x="98" y="1002" font-size="26" font-weight="650" fill="#183A50" >明確か</text><rect x="353" y="751" width="254" height="310" rx="16" fill="#E8F6F1" stroke="none" stroke-width="1"/><text x="371" y="801" font-size="27" font-weight="760" fill="#183A50" >現時点の根拠</text><path d="M 371 819 h 218" stroke="#B7C9D4" stroke-width="2"/><text x="371" y="866" font-size="26" font-weight="650" fill="#183A50" >顧客面談：</text><text x="371" y="901" font-size="26" font-weight="650" fill="#183A50" >未確認</text><path d="M 371 920 h 218" stroke="#CBD8DF" stroke-width="2"/><text x="371" y="967" font-size="26" font-weight="650" fill="#183A50" >予算・権利：</text><text x="371" y="1002" font-size="26" font-weight="650" fill="#183A50" >未確認</text><rect x="626" y="751" width="254" height="310" rx="16" fill="#FFF2DE" stroke="none" stroke-width="1"/><text x="644" y="801" font-size="27" font-weight="760" fill="#183A50" >次の行動</text><path d="M 644 819 h 218" stroke="#B7C9D4" stroke-width="2"/><text x="644" y="866" font-size="26" font-weight="650" fill="#183A50" >利用候補に</text><text x="644" y="901" font-size="26" font-weight="650" fill="#183A50" >聞き取り</text><path d="M 644 920 h 218" stroke="#CBD8DF" stroke-width="2"/><text x="644" y="967" font-size="26" font-weight="650" fill="#183A50" >費用・契約の</text><text x="644" y="1002" font-size="26" font-weight="650" fill="#183A50" >条件を調査</text><rect x="78" y="1081" width="804" height="90" rx="18" fill="#102B46" stroke="none" stroke-width="1"/><text x="107" y="1118" font-size="25" font-weight="700" fill="#A2D9E1" >暫定結論</text><text x="107" y="1152" font-size="31" font-weight="750" fill="#FFFFFF" >追加調査を優先（仮説）</text><text x="54" y="1247" font-size="23" font-weight="500" fill="#5D7184" >※模式図。数字・事業方針・実績を表すものではありません。</text></svg>
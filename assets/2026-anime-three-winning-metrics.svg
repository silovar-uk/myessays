<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="2026年冬アニメの三つのヒット指標を比較。配信視聴人数は呪術廻戦、海外ファン投票は推しの子、3月のカラオケはフリーレンが首位。母集団が異なり順位比較はできない"><rect width="1200" height="570" fill="#f7f5f0"/><text x="60" y="75" font-size="34" fill="#152840" font-weight="bold">2026 WINTER · 3 DIFFERENT WINNERS</text><text x="60" y="116" font-size="25" fill="#41556c">「ヒット」の定義が変わると、先頭を走る作品も変わる</text><rect x="60" y="154" width="1080" height="103" fill="#ffffff" rx="15"/><rect x="60" y="154" width="12" height="103" fill="#186990" rx="6"/><text x="92" y="193" fill="#65717f" font-size="22">国内配信／U-NEXT上半期</text><text x="92" y="231" fill="#152840" font-weight="bold" font-size="31">呪術廻戦 第3期</text><text x="1025" y="213" fill="#186990" font-size="30" font-weight="bold">1位</text><rect x="60" y="276" width="1080" height="103" fill="#ffffff" rx="15"/><rect x="60" y="276" width="12" height="103" fill="#994c76" rx="6"/><text x="92" y="315" fill="#65717f" font-size="22">海外ファン評価／冬季投票</text><text x="92" y="353" fill="#152840" font-weight="bold" font-size="31">【推しの子】第3期</text><text x="1025" y="335" fill="#994c76" font-size="30" font-weight="bold">1位</text><rect x="60" y="398" width="1080" height="103" fill="#ffffff" rx="15"/><rect x="60" y="398" width="12" height="103" fill="#64844b" rx="6"/><text x="92" y="437" fill="#65717f" font-size="22">主題歌カラオケ／DAM 3月</text><text x="92" y="475" fill="#152840" font-weight="bold" font-size="31">葬送のフリーレン 第2期</text><text x="1025" y="457" fill="#64844b" font-size="30" font-weight="bold">1位</text><text x="60" y="549" font-size="18" fill="#67717b">注：異なる指標・集計期間・参加者集団。順位の横比較、総合1位の決定には使えない。</text></svg>
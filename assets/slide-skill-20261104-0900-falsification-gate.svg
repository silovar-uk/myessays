<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f5f7fb"/><text x="50" y="65" font-size="36" font-family="sans-serif" fill="#16334d">反証条件から組み立てる1枚</text><rect x="50" y="105" width="500" height="450" rx="18" fill="#fff" stroke="#e0d4d4"/><rect x="650" y="105" width="500" height="450" rx="18" fill="#fff" stroke="#b5d9c9"/><text x="80" y="160" font-size="28" font-family="sans-serif" fill="#b34c4c">Before｜賛成材料だけ</text><text x="680" y="160" font-size="28" font-family="sans-serif" fill="#16714e">After｜撤回条件も示す</text><text x="80" y="230" font-size="24" font-family="sans-serif">市場が成長している</text><text x="80" y="300" font-size="24" font-family="sans-serif">顧客が興味を示した</text><text x="80" y="370" font-size="24" font-family="sans-serif">AI技術が進歩した</text><text x="80" y="485" font-size="23" font-family="sans-serif" fill="#a43c3c">→ 有望だと断定</text><rect x="680" y="190" width="440" height="90" rx="12" fill="#e4f5ed"/><text x="700" y="242" font-size="24" font-family="sans-serif">仮説：有料導入される</text><rect x="680" y="310" width="440" height="90" rx="12" fill="#e6effb"/><text x="700" y="362" font-size="23" font-family="sans-serif">検証：予算・決裁・代替策</text><rect x="680" y="430" width="440" height="90" rx="12" fill="#fff0d6"/><text x="700" y="467" font-size="22" font-family="sans-serif">撤回：支払条件が成立せず</text><text x="700" y="499" font-size="22" font-family="sans-serif">→ 対象顧客を再設計</text><text x="50" y="595" font-size="18" font-family="sans-serif" fill="#566779">独自作成・架空のスポーツ映像サービスの検証例</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="架空の3店舗の前年と今年の満足度を比較したダンベル図。Aは60から75、Bは70から72、Cは80から76。"><rect width="960" height="470" fill="#ffffff"/><text x="48" y="50" font-size="26" font-family="sans-serif" fill="#17283a" font-weight="bold">店舗別満足度：水準と変化を同時に見る</text><text x="48" y="80" font-size="17" font-family="sans-serif" fill="#596675">架空データ｜単位：点（100点満点）｜前年＝青、今年＝橙</text><g stroke="#e5e9ed" stroke-width="1"><line x1="300" y1="115" x2="300" y2="375"/><line x1="450" y1="115" x2="450" y2="375"/><line x1="600" y1="115" x2="600" y2="375"/><line x1="750" y1="115" x2="750" y2="375"/></g><g font-family="sans-serif" font-size="19" fill="#17283a"><text x="130" y="174">店舗A</text><text x="130" y="254">店舗B</text><text x="130" y="334">店舗C</text></g><g stroke="#9aa7b4" stroke-width="8" stroke-linecap="round"><line x1="450" y1="166" x2="675" y2="166"/><line x1="600" y1="246" x2="630" y2="246"/><line x1="750" y1="326" x2="690" y2="326"/></g><g fill="#2466a8"><circle cx="450" cy="166" r="13"/><circle cx="600" cy="246" r="13"/><circle cx="750" cy="326" r="13"/></g><g fill="#e37b29"><circle cx="675" cy="166" r="13"/><circle cx="630" cy="246" r="13"/><circle cx="690" cy="326" r="13"/></g><g font-family="sans-serif" font-size="18" fill="#17283a" text-anchor="middle"><text x="450" y="142">60</text><text x="675" y="142">75</text><text x="600" y="222">70</text><text x="630" y="286">72</text><text x="750" y="302">80</text><text x="690" y="366">76</text></g><g font-family="sans-serif" font-size="19" fill="#17283a"><text x="800" y="174">+15点</text><text x="800" y="254">+2点</text><text x="800" y="334">−4点</text></g><g font-family="sans-serif" font-size="17" fill="#596675" text-anchor="middle"><text x="300" y="410">50</text><text x="450" y="410">60</text><text x="600" y="410">70</text><text x="750" y="410">80</text></g><text x="48" y="451" font-size="15" font-family="sans-serif" fill="#596675">注：横軸50〜80点。差を読む図のため、棒グラフと異なりゼロ起点は必須ではない。</text></svg>
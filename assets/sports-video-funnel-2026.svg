<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="公式試合から実際の有償受託までの五つの門を示す図"><rect width="1280" height="720" rx="26" fill="#F6F9FC"/><rect x="34" y="31" width="1212" height="658" rx="24" fill="#FFFFFF" stroke="#DCE6F1" stroke-width="2"/><text x="86" y="104" font-family="Noto Sans JP, sans-serif" font-size="39" font-weight="800" fill="#142D50">試合があることと、売上が立つことは別</text><text x="86" y="149" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#526A82">2026/27シーズンのJリーグ＋B.LEAGUE｜定例リーグ戦の推計対象</text><rect x="90" y="187" width="1100" height="104" rx="16" fill="#DCEFFC"/><text x="125" y="231" font-family="Noto Sans JP, sans-serif" font-size="26" fill="#23496F">公式試合の母数</text><text x="1120" y="250" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="55" font-weight="900" fill="#064F91">2,766試合</text><text x="125" y="271" font-family="Noto Sans JP, sans-serif" font-size="19" fill="#40617E">Jリーグ 1,140 ＋ B.LEAGUE 1,626</text><g font-family="Noto Sans JP, sans-serif" text-anchor="middle"><rect x="90" y="344" width="205" height="113" rx="16" fill="#E9F4F6" stroke="#69B5BD"/><text x="193" y="380" font-size="23" font-weight="700" fill="#0B6472">映像対象</text><text x="193" y="420" font-size="18" fill="#476A70">撮影・配信の対象か</text><text x="326" y="407" font-size="30" fill="#7C92A8">→</text><rect x="356" y="344" width="205" height="113" rx="16" fill="#E9F4F6" stroke="#69B5BD"/><text x="459" y="380" font-size="23" font-weight="700" fill="#0B6472">発注可能</text><text x="459" y="420" font-size="18" fill="#476A70">決裁・予算はどこか</text><text x="591" y="407" font-size="30" fill="#7C92A8">→</text><rect x="621" y="344" width="205" height="113" rx="16" fill="#E9F4F6" stroke="#69B5BD"/><text x="723" y="380" font-size="23" font-weight="700" fill="#0B6472">契約・権利</text><text x="723" y="420" font-size="18" fill="#476A70">既存委託・許諾条件</text><text x="855" y="407" font-size="30" fill="#7C92A8">→</text><rect x="885" y="344" width="305" height="113" rx="16" fill="#0E5972"/><text x="1037" y="381" font-size="24" font-weight="700" fill="#FFFFFF">有償受託</text><text x="1037" y="420" font-size="18" fill="#D9F2F6">実際の請求対象</text></g><path d="M640 294 V322" stroke="#94AAC0" stroke-width="5" stroke-linecap="round"/><path d="M628 316 L640 330 L652 316" fill="none" stroke="#94AAC0" stroke-width="5" stroke-linecap="round"/><rect x="90" y="510" width="1100" height="111" rx="16" fill="#FFF3DF" stroke="#E6C88A"/><text x="118" y="555" font-family="Noto Sans JP, sans-serif" font-size="26" font-weight="700" fill="#77511C">試算：2,766試合 × 4万円 ＝ 1億1,064万円</text><text x="118" y="596" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#805F32">※全試合を新規・有償受託できるという非現実的な上限仮定。実績ではない。</text><text x="88" y="665" font-family="Noto Sans JP, sans-serif" font-size="17" fill="#627589">出典：Jリーグ・B.LEAGUEの公式大会方式を基に試算｜2026年10月9日</text></svg>
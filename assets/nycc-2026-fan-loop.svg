<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 720" role="img" aria-label="作品との出会いから、鑑賞、交流、購入、再訪、そして新しい作品との出会いへ続く仮説モデル。観測データではない。">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#59beaf"/></marker></defs>
<rect width="1360" height="720" rx="26" fill="#f5f3ed"/>
<text x="64" y="68" fill="#336e70" font-family="Arial,'Noto Sans JP',sans-serif" font-size="25" letter-spacing="2">HYPOTHESIS / ファンとの関係を育てる循環</text>
<text x="64" y="128" fill="#16313b" font-family="Arial,'Noto Sans JP',sans-serif" font-weight="700" font-size="45">「作品を輸出する」から「出会いを設計する」へ</text>
<g font-family="Arial,'Noto Sans JP',sans-serif">
<rect x="60" y="198" width="232" height="169" rx="18" fill="#ffffff" stroke="#c3dcd6" stroke-width="3"/>
<rect x="316" y="198" width="232" height="169" rx="18" fill="#ffffff" stroke="#c3dcd6" stroke-width="3"/>
<rect x="572" y="198" width="232" height="169" rx="18" fill="#ffffff" stroke="#c3dcd6" stroke-width="3"/>
<rect x="828" y="198" width="232" height="169" rx="18" fill="#ffffff" stroke="#c3dcd6" stroke-width="3"/>
<rect x="1084" y="198" width="216" height="169" rx="18" fill="#173943"/>
<g fill="#173943" text-anchor="middle">
<text x="176" y="249" font-weight="700" font-size="27">発見</text><text x="176" y="288" font-size="20">展示・口コミ</text><text x="176" y="322" font-size="20">別分野からの流入</text>
<text x="432" y="249" font-weight="700" font-size="27">鑑賞</text><text x="432" y="288" font-size="20">読む・見る</text><text x="432" y="322" font-size="20">無料体験</text>
<text x="688" y="249" font-weight="700" font-size="27">交流</text><text x="688" y="288" font-size="20">会う・遊ぶ</text><text x="688" y="322" font-size="20">場を共有する</text>
<text x="944" y="249" font-weight="700" font-size="27">参加</text><text x="944" y="288" font-size="20">買う・創る</text><text x="944" y="322" font-size="20">投稿・再発見</text>
</g><g text-anchor="middle" fill="#ffffff"><text x="1192" y="250" font-weight="700" font-size="27">再訪</text><text x="1192" y="289" font-size="19">次の作品へ</text><text x="1192" y="323" font-size="19">知人を連れてくる</text></g>
</g>
<g stroke="#59beaf" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M292 285H311"/><path d="M548 285H567"/><path d="M804 285H823"/><path d="M1060 285H1079"/><path d="M1192 368V444Q1192 474 1152 474H214Q176 474 176 434V373"/></g>
<text x="684" y="453" fill="#39706a" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="19">リピートと紹介が次の発見を生む可能性</text>
<rect x="65" y="525" width="1235" height="116" rx="15" fill="#e3eee8"/>
<text x="89" y="571" fill="#17424c" font-family="Arial,'Noto Sans JP',sans-serif" font-weight="700" font-size="23">実務で測るなら：</text>
<text x="89" y="608" fill="#17424c" font-family="Arial,'Noto Sans JP',sans-serif" font-size="22">接触 → 読み始め率 → 同意に基づく再接触率 → 購買率 → 継続・紹介率</text>
<text x="68" y="679" fill="#596f75" font-family="Arial,'Noto Sans JP',sans-serif" font-size="19">※ 本図は一次資料をもとに筆者が組み立てた概念モデル。実証済みの行動経路・因果関係ではない。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380"><rect width="960" height="380" fill="#f8fafc"/><text x="30" y="48" font-family="sans-serif" font-size="28" font-weight="bold">市場規模から初年度売上への到達条件</text><text x="30" y="80" font-family="sans-serif" font-size="18">架空データ｜スポーツ施設向け計測サービス</text><rect x="30" y="125" width="210" height="130" rx="12" fill="#bfdbfe"/><text x="42" y="170" font-family="sans-serif" font-size="20" fill="#172033">理論市場</text><text x="42" y="219" font-family="sans-serif" font-size="30" font-weight="bold" fill="#172033">1,000施設</text><rect x="264" y="125" width="210" height="130" rx="12" fill="#bfdbfe"/><text x="276" y="170" font-family="sans-serif" font-size="20" fill="#172033">提供可能</text><text x="276" y="219" font-family="sans-serif" font-size="30" font-weight="bold" fill="#172033">300施設</text><rect x="498" y="125" width="210" height="130" rx="12" fill="#bfdbfe"/><text x="510" y="170" font-family="sans-serif" font-size="20" fill="#172033">初年度接触</text><text x="510" y="219" font-family="sans-serif" font-size="30" font-weight="bold" fill="#172033">60施設</text><rect x="732" y="125" width="210" height="130" rx="12" fill="#2563eb"/><text x="744" y="170" font-family="sans-serif" font-size="20" fill="white">成約見込み</text><text x="744" y="219" font-family="sans-serif" font-size="30" font-weight="bold" fill="white">6契約</text><text x="30" y="300" font-family="sans-serif" font-size="20">検証：対象名簿 → 設置条件 → 営業到達 → 成約率</text><text x="30" y="341" font-family="sans-serif" font-size="20">6契約 × 年額100万円 = 年換算600万円（初年度計上額ではない）</text></svg>
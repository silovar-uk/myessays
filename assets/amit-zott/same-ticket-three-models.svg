<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">同じ3000円のチケットでも活動システムを変えるとビジネスモデルが変わる</title>
  <desc id="desc">架空のスポーツクラブが同じ3000円の観戦チケットを、直販、外部プラットフォーム、公式リセールの三つの活動システムで扱う思考実験。</desc>
  <rect width="1200" height="760" fill="#f7f7f5"/>
  <text x="60" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#171717">同じ「3,000円の1席」でも、配線は変えられる</text>
  <text x="60" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="21" fill="#555">架空クラブの思考実験：商品と表示価格を固定して、活動・接続・担当者だけを変える</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b5b5b"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="55" y="165" width="340" height="500" rx="24" fill="#fff" stroke="#d0d0d0" stroke-width="2"/>
    <text x="225" y="215" text-anchor="middle" font-size="27" font-weight="700" fill="#222">A 直販型</text>
    <rect x="105" y="270" width="240" height="78" rx="15" fill="#f0f0f0"/>
    <text x="225" y="302" text-anchor="middle" font-size="21" font-weight="700" fill="#333">クラブ</text>
    <text x="225" y="330" text-anchor="middle" font-size="16" fill="#666">告知・販売・決済・CS</text>
    <rect x="105" y="455" width="240" height="78" rx="15" fill="#f0f0f0"/>
    <text x="225" y="488" text-anchor="middle" font-size="21" font-weight="700" fill="#333">観客</text>
    <text x="225" y="516" text-anchor="middle" font-size="16" fill="#666">検索・購入・来場</text>
    <line x1="225" y1="348" x2="225" y2="455" stroke="#5b5b5b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="225" y="395" text-anchor="middle" font-size="17" fill="#666">1本の関係</text>
    <text x="225" y="615" text-anchor="middle" font-size="18" font-weight="700" fill="#b6232f">同じ3,000円</text>

    <rect x="430" y="165" width="340" height="500" rx="24" fill="#fff" stroke="#d0d0d0" stroke-width="2"/>
    <text x="600" y="215" text-anchor="middle" font-size="27" font-weight="700" fill="#222">B 外部流通型</text>
    <rect x="480" y="255" width="240" height="70" rx="15" fill="#f0f0f0"/>
    <text x="600" y="287" text-anchor="middle" font-size="20" font-weight="700" fill="#333">クラブ</text>
    <text x="600" y="312" text-anchor="middle" font-size="15" fill="#666">在庫・入場を担う</text>
    <rect x="480" y="370" width="240" height="70" rx="15" fill="#f0f0f0"/>
    <text x="600" y="402" text-anchor="middle" font-size="20" font-weight="700" fill="#333">販売プラットフォーム</text>
    <text x="600" y="427" text-anchor="middle" font-size="15" fill="#666">集客・決済・顧客接点</text>
    <rect x="480" y="485" width="240" height="70" rx="15" fill="#f0f0f0"/>
    <text x="600" y="517" text-anchor="middle" font-size="20" font-weight="700" fill="#333">観客</text>
    <text x="600" y="542" text-anchor="middle" font-size="15" fill="#666">検索・購入・来場</text>
    <line x1="600" y1="325" x2="600" y2="370" stroke="#5b5b5b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="600" y1="440" x2="600" y2="485" stroke="#5b5b5b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="615" text-anchor="middle" font-size="18" font-weight="700" fill="#b6232f">同じ3,000円</text>

    <rect x="805" y="165" width="340" height="500" rx="24" fill="#fff" stroke="#d0d0d0" stroke-width="2"/>
    <text x="975" y="215" text-anchor="middle" font-size="27" font-weight="700" fill="#222">C 公式リセール型</text>
    <rect x="845" y="250" width="260" height="66" rx="15" fill="#f0f0f0"/>
    <text x="975" y="291" text-anchor="middle" font-size="19" font-weight="700" fill="#333">出品する観客</text>
    <rect x="845" y="365" width="260" height="76" rx="15" fill="#f0f0f0"/>
    <text x="975" y="397" text-anchor="middle" font-size="19" font-weight="700" fill="#333">クラブ＋基盤</text>
    <text x="975" y="424" text-anchor="middle" font-size="15" fill="#666">本人確認・無効化・再発券</text>
    <rect x="845" y="490" width="260" height="66" rx="15" fill="#f0f0f0"/>
    <text x="975" y="531" text-anchor="middle" font-size="19" font-weight="700" fill="#333">買い直す観客</text>
    <line x1="975" y1="316" x2="975" y2="365" stroke="#5b5b5b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="975" y1="441" x2="975" y2="490" stroke="#5b5b5b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="975" y="615" text-anchor="middle" font-size="18" font-weight="700" fill="#b6232f">同じ3,000円</text>

    <text x="600" y="713" text-anchor="middle" font-size="23" font-weight="700" fill="#333">価格を変えなくても、Content / Structure / Governanceを変えると「商売の仕組み」は変わる</text>
  </g>
</svg>

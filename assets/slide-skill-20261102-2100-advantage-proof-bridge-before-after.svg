<svg xmlns="http://www.w3.org/2000/svg" width="1440" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc"><style>text{font-family:'Noto Sans JP','Yu Gothic',Meiryo,sans-serif}</style><title id="title">競争優位スライドのBefore After</title><desc id="desc">強みを列挙するBeforeと、事実・仮説・検証条件を示すAfterを比較した独自図解。</desc><rect width="1440" height="910" fill="#F5F8FC"/><text x="54" y="72" fill="#102B46" font-size="40" font-weight="760">BEFORE → AFTER｜何を「言える」のかを変える</text><rect x="48" y="105" width="1344" height="274" rx="20" fill="#FFFFFF" stroke="#E2C6C8" stroke-width="2"/><rect x="72" y="126" width="176" height="46" rx="12" fill="#FCE9EA" stroke="#FCE9EA" stroke-width="2"/><text x="92" y="160" fill="#A33D48" font-size="27" font-weight="750">BEFORE</text><text x="80" y="217" fill="#1C344A" font-size="35" font-weight="750">計測技術 × 映像制作 × スポーツ接点 ＝ 競争優位</text><text x="83" y="278" fill="#9A4550" font-size="29" font-weight="600">問題：接点の事実が未確認。顧客価値・代替案・費用の根拠もない。</text><text x="83" y="334" fill="#5B6C7C" font-size="26" font-weight="500">「強みの数」を「選ばれる理由」に置き換えてしまっている。</text><rect x="48" y="407" width="1344" height="427" rx="20" fill="#FFFFFF" stroke="#BBD8D8" stroke-width="2"/><rect x="72" y="428" width="161" height="46" rx="12" fill="#DDF5F0" stroke="#DDF5F0" stroke-width="2"/><text x="93" y="462" fill="#086E65" font-size="27" font-weight="750">AFTER</text><text x="79" y="521" fill="#14374C" font-size="32" font-weight="760">映像技術と制作の組み合わせは、会場体験の差別化候補（仮説）</text><rect x="80" y="566" width="390" height="159" rx="14" fill="#E5F5EF" stroke="#D6E2E7" stroke-width="2"/><text x="99" y="607" fill="#17394C" font-size="25" font-weight="760">確認済み</text><text x="99" y="656" fill="#17394C" font-size="26" font-weight="600">制作・技術の連携</text><text x="99" y="698" fill="#17394C" font-size="25" font-weight="500">スポーツ映像実証</text><rect x="526" y="566" width="390" height="159" rx="14" fill="#FFF3DC" stroke="#D6E2E7" stroke-width="2"/><text x="545" y="607" fill="#17394C" font-size="25" font-weight="760">仮説</text><text x="545" y="656" fill="#17394C" font-size="26" font-weight="600">会場体験を差別化</text><text x="545" y="698" fill="#17394C" font-size="25" font-weight="500">顧客が価値を認めるか</text><rect x="972" y="566" width="390" height="159" rx="14" fill="#FBE8EB" stroke="#D6E2E7" stroke-width="2"/><text x="991" y="607" fill="#17394C" font-size="25" font-weight="760">要検証</text><text x="991" y="656" fill="#17394C" font-size="26" font-weight="600">支払意思・運用費</text><text x="991" y="698" fill="#17394C" font-size="25" font-weight="500">権利・代替案との比較</text><rect x="82" y="752" width="1276" height="58" rx="12" fill="#102B46" stroke="#102B46" stroke-width="2"/><text x="106" y="792" fill="#FFFFFF" font-size="29" font-weight="720">次の判断：顧客面談と権利・費用確認の結果を見て実証可否を決める</text><text x="54" y="878" fill="#526A7D" font-size="23" font-weight="500">※仮説は例示。企業の公式方針や実際の競争優位を示さない。</text></svg>
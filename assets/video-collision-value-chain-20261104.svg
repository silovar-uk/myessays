<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-label="異分野の衝突から事業仮説と検証へ進む図"><rect width="1200" height="450" fill="#faf8f2"/><text x="58" y="57" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#273143">比喩は証拠ではない。動詞を取り出して、仕事に戻す。</text><g font-family="Arial,sans-serif"><rect x="57" y="120" width="220" height="195" rx="18" fill="#e4e9f6"/><text x="82" y="159" font-size="18" font-weight="bold" fill="#273143">異分野の衝突</text><text x="82" y="204" font-size="17" fill="#43546c">冷蔵庫</text><text x="82" y="235" font-size="17" fill="#43546c">考古学</text><text x="82" y="266" font-size="17" fill="#43546c">試合映像</text><rect x="346" y="120" width="220" height="195" rx="18" fill="#e0f1ef"/><text x="371" y="159" font-size="18" font-weight="bold" fill="#273143">動詞を抽出</text><text x="371" y="208" font-size="19" fill="#176e69">忘れる</text><text x="371" y="241" font-size="19" fill="#176e69">探し出す</text><rect x="635" y="120" width="220" height="195" rx="18" fill="#fae9db"/><text x="660" y="159" font-size="18" font-weight="bold" fill="#273143">映像の仕事</text><text x="660" y="203" font-size="17" fill="#8c5428">過去のシーンを</text><text x="660" y="233" font-size="17" fill="#8c5428">意味から検索する</text><rect x="923" y="120" width="220" height="195" rx="18" fill="#f5e2e9"/><text x="948" y="159" font-size="18" font-weight="bold" fill="#273143">顧客で検証</text><text x="948" y="203" font-size="16" fill="#83445d">探す時間は減る？</text><text x="948" y="235" font-size="16" fill="#83445d">権利は使える？</text><text x="948" y="267" font-size="16" fill="#83445d">対価を払う？</text><path d="M285 216 H335 M325 206 L335 216 L325 226 M575 216 H625 M615 206 L625 216 L615 226 M865 216 H913 M903 206 L913 216 L903 226" stroke="#8794a5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="58" y="354" width="1085" height="52" rx="13" fill="#273143"/><text x="600" y="387" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">発散を大きく、断定を小さく。 Business idea ≠ Validated business.</text></g></svg>
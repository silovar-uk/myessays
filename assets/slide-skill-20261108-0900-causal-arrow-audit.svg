<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="左に根拠不足の因果断定、右に観測事実、仮説、検証項目を分けたスライド構造"><rect width="960" height="400" fill="#f8fafc"/><text x="28" y="43" font-family="sans-serif" font-size="24" font-weight="bold" fill="#102a43">因果の矢印に「根拠の状態」を付ける</text><rect x="26" y="70" width="410" height="274" rx="14" fill="#fff1f2" stroke="#e11d48"/><text x="48" y="106" font-size="22" font-family="sans-serif" font-weight="bold">Before：断定</text><text x="50" y="168" font-size="23" font-family="sans-serif">広告接触が増えた</text><text x="205" y="210" font-size="30">↓</text><text x="50" y="255" font-size="23" font-family="sans-serif">売上が伸びた</text><text x="50" y="307" font-size="16" font-family="sans-serif" fill="#be123c">因果関係は未検証</text><rect x="460" y="70" width="474" height="274" rx="14" fill="#ecfdf5" stroke="#059669"/><text x="480" y="106" font-size="22" font-family="sans-serif" font-weight="bold">After：事実と仮説を分離</text><rect x="483" y="127" width="425" height="55" rx="7" fill="#fff" stroke="#0f766e"/><text x="499" y="161" font-size="20" font-family="sans-serif">事実：広告接触と売上が増加</text><text x="686" y="209" font-size="22" font-family="sans-serif">↓ 仮説</text><rect x="483" y="222" width="425" height="47" rx="7" fill="#fff" stroke="#0f766e"/><text x="499" y="253" font-size="19" font-family="sans-serif">広告が売上増に寄与した可能性</text><text x="490" y="307" font-size="17" font-family="sans-serif" fill="#065f46">検証：非接触群・季節性・販促条件</text><text x="28" y="378" font-size="15" font-family="sans-serif" fill="#475569">架空の構造例。広告効果の実測結果ではない。</text></svg>
<title id="title">Bプレミア選手350人の基本報酬分布（2026-27開幕時点）</title>
<desc id="desc">2,000万円未満128人、2,000万以上4,000万円未満81人、4,000万以上6,000万円未満29人、6,000万以上8,000万円未満21人、8,000万以上1億円未満29人、1億円以上62人。</desc>
<rect width="900" height="380" fill="#fff"/>
<text x="24" y="37" font-size="23" font-family="sans-serif" font-weight="bold" fill="#1c2b37">年俸分布：1億円以上だけが大きいわけではない</text>
<text x="24" y="62" font-size="14" font-family="sans-serif" fill="#526071">Bプレミアのプロ契約選手350人／基本報酬のみ／2026年9月開幕時点</text>

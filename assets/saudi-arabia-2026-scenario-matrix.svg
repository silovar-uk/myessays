<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="サウジアラビアの今後のシナリオ分析：安全保障と非石油民間投資の2軸">
<rect width="1280" height="720" fill="#f6f8f7"/><text x="55" y="68" font-family="Noto Sans JP, sans-serif" font-size="39" font-weight="700" fill="#14313b">未来を当てるのではなく、分岐を監視する</text><text x="57" y="108" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#506973">推測に基づく4シナリオ｜確率や将来実績を示すものではない</text>
<text x="665" y="151" font-family="Noto Sans JP, sans-serif" font-size="25" font-weight="700" fill="#14313b" text-anchor="middle">民間の投資と事業化の進み方 →</text>
<text x="300" y="181" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#506973">弱い</text><text x="1020" y="181" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#506973">強い</text>
<text transform="translate(60 474) rotate(-90)" font-family="Noto Sans JP, sans-serif" font-size="25" font-weight="700" fill="#14313b">安全保障・物流の安定度 →</text>
<text x="115" y="230" font-family="Noto Sans JP, sans-serif" font-size="20" fill="#506973">高い</text><text x="115" y="563" font-family="Noto Sans JP, sans-serif" font-size="20" fill="#506973">低い</text>
<rect x="170" y="200" width="432" height="192" rx="10" fill="#e4eef0" stroke="#acc0c3"/><text x="196" y="245" font-family="Noto Sans JP, sans-serif" font-size="29" font-weight="700" fill="#173947">安定しても、投資が鈍い</text><text x="196" y="296" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#294b56">低成長の安定</text><text x="196" y="340" font-family="Noto Sans JP, sans-serif" font-size="19" fill="#47626a">監視：民間投資・事業収益</text>
<rect x="620" y="200" width="590" height="192" rx="10" fill="#cfeadd" stroke="#9abdae"/><text x="647" y="245" font-family="Noto Sans JP, sans-serif" font-size="29" font-weight="700" fill="#143d35">安全と民間投資が両立</text><text x="647" y="296" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#275348">改革が自走し始める</text><text x="647" y="340" font-family="Noto Sans JP, sans-serif" font-size="19" fill="#456a5f">監視：民間雇用・非石油輸出</text>
<rect x="170" y="410" width="432" height="192" rx="10" fill="#f7d9cc" stroke="#d1a996"/><text x="196" y="455" font-family="Noto Sans JP, sans-serif" font-size="29" font-weight="700" fill="#703d2e">緊張が続き、投資も弱い</text><text x="196" y="506" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#744b3d">計画の大幅見直し</text><text x="196" y="550" font-family="Noto Sans JP, sans-serif" font-size="19" fill="#7d5f55">監視：運航・予算・延期</text>
<rect x="620" y="410" width="590" height="192" rx="10" fill="#f8eccd" stroke="#cbbb96"/><text x="647" y="455" font-family="Noto Sans JP, sans-serif" font-size="29" font-weight="700" fill="#634e21">投資は進むが、緊張は続く</text><text x="647" y="506" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#75612d">運営費・保険費が重荷</text><text x="647" y="550" font-family="Noto Sans JP, sans-serif" font-size="19" fill="#806f43">監視：資本コスト・イベント中止</text>
<text x="56" y="674" font-family="Noto Sans JP, sans-serif" font-size="20" fill="#506973">注：これらは筆者の条件付き仮説。現時点の予測値ではない。</text></svg>
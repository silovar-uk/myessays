<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350"><rect width="960" height="350" fill="#f8fafc"/><text x="36" y="55" font-size="27" font-family="sans-serif" fill="#172554">導入判断は時間だけで決めない</text><rect x="40" y="112" width="280" height="130" rx="16" fill="#e2e8f0"/><text x="55" y="178" font-size="20" font-family="sans-serif" fill="#172554">全工程の時間を測定</text><rect x="345" y="112" width="280" height="130" rx="16" fill="#dbeafe"/><text x="360" y="178" font-size="20" font-family="sans-serif" fill="#172554">品質・再作業を確認</text><rect x="650" y="112" width="280" height="130" rx="16" fill="#e2e8f0"/><text x="665" y="178" font-size="20" font-family="sans-serif" fill="#172554">総費用と利益で判断</text><text x="38" y="302" font-size="17" font-family="sans-serif">概念図・実測値ではない｜出典：本文の理論整理</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">顧客課題から検証までの4段階</title><desc id="d">左から顧客の仕事、未検証の困りごと、提供価値の仮説、検証する証拠を順に示す。全て仮想例。</desc><rect width="1200" height="600" fill="#f5f7fb"/><text x="65" y="85" font-family="sans-serif" font-size="38" font-weight="bold" fill="#172b4d">事業機会は「技術」ではなく「顧客の仕事」から描く</text><text x="65" y="135" font-family="sans-serif" font-size="23" fill="#455a74">仮想例：スポーツ興行の来場者動線分析（実在企業の実績ではない）</text><rect x="50" y="210" width="265" height="250" rx="18" fill="#ffffff" stroke="#a7b7ca" stroke-width="2"/><text x="68" y="270" font-size="24" font-family="sans-serif" font-weight="bold" fill="#17385b">① 顧客の仕事</text><text x="68" y="340" font-size="23" font-family="sans-serif" fill="#203a53">混雑を抑え</text><text x="68" y="379" font-size="23" font-family="sans-serif" fill="#203a53">安全に誘導する</text><path d="M317 330 l20 0 m-8 -8 l8 8 -8 8" stroke="#1c718c" fill="none" stroke-width="4"/><rect x="344" y="210" width="265" height="250" rx="18" fill="#ffffff" stroke="#a7b7ca" stroke-width="2"/><text x="362" y="270" font-size="24" font-family="sans-serif" font-weight="bold" fill="#17385b">② 困りごと［仮説］</text><text x="362" y="340" font-size="23" font-family="sans-serif" fill="#203a53">ピーク時間帯の</text><text x="362" y="379" font-size="23" font-family="sans-serif" fill="#203a53">滞留箇所が不明</text><path d="M611 330 l20 0 m-8 -8 l8 8 -8 8" stroke="#1c718c" fill="none" stroke-width="4"/><rect x="638" y="210" width="265" height="250" rx="18" fill="#ffffff" stroke="#a7b7ca" stroke-width="2"/><text x="656" y="270" font-size="24" font-family="sans-serif" font-weight="bold" fill="#17385b">③ 提供価値［仮説］</text><text x="656" y="340" font-size="23" font-family="sans-serif" fill="#203a53">映像解析で</text><text x="656" y="379" font-size="23" font-family="sans-serif" fill="#203a53">混雑箇所を可視化</text><path d="M905 330 l20 0 m-8 -8 l8 8 -8 8" stroke="#1c718c" fill="none" stroke-width="4"/><rect x="932" y="210" width="265" height="250" rx="18" fill="#d6f4e8" stroke="#a7b7ca" stroke-width="2"/><text x="950" y="270" font-size="24" font-family="sans-serif" font-weight="bold" fill="#17385b">④ 検証する証拠</text><text x="950" y="340" font-size="23" font-family="sans-serif" fill="#203a53">現場ヒアリング</text><text x="950" y="379" font-size="23" font-family="sans-serif" fill="#203a53">計測精度・改善効果</text><text x="65" y="535" font-family="sans-serif" font-size="22" fill="#46576b">判断：課題の実在と導入効果が確かめられるまで「競争優位がある」と断定しない。</text></svg>
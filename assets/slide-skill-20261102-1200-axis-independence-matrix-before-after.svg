<svg xmlns="http://www.w3.org/2000/svg" width="1000" viewBox="0 0 1000 1160" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">2軸マトリクスの改善前後</title><desc id="svgdesc">費用と工数という似た軸を使うと候補が斜めに並びやすい。費用と待ち時間削減への期待を使うと異なるトレードオフが見える。AからDの位置は説明用の仮説で実測ではない。</desc><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif}</style><rect x="0" y="0" width="1000" height="1160" rx="0" fill="#F4F7FB" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1000" height="12" rx="0" fill="#1C7286" stroke="none" stroke-width="1"/><text x="58" y="70" font-size="24" fill="#1C7286" font-weight="750" >VISUAL LESSON / 12:00</text><text x="58" y="127" font-size="40" fill="#142E46" font-weight="750" >2軸は「別の問い」に答えているか</text><rect x="52" y="166" width="896" height="418" rx="22" fill="#FFFFFF" stroke="#DCE4EB" stroke-width="2"/><rect x="74" y="185" width="184" height="45" rx="12" fill="#FFF0ED" stroke="none" stroke-width="1"/><text x="97" y="216" font-size="25" fill="#B35448" font-weight="750" >BEFORE</text><text x="281" y="218" font-size="30" fill="#19364C" font-weight="700" >導入費用 × 導入工数</text><rect x="240" y="274" width="530" height="242" rx="0" fill="#F7FAFD" stroke="#BFCFDA" stroke-width="2"/><path d="M 505 274 v 242 M 240 395 h 530" stroke="#B5C5D1" stroke-width="2" stroke-dasharray="8 8"/><path d="M 240 528 h 540 M 228 516 v -252" stroke="#31566B" stroke-width="3" fill="none"/><text x="395" y="565" font-size="22" fill="#4D6477" font-weight="600" >初期導入費用 → 高</text><text x="76" y="339" font-size="24" fill="#4D6477" font-weight="700" >導入工数</text><text x="77" y="368" font-size="21" fill="#4D6477" font-weight="600" >↑ 高</text><circle cx="325" cy="454" r="21" fill="#BE6255" stroke="#FFFFFF" stroke-width="3"/><text x="325" y="463" font-size="24" fill="#FFFFFF" font-weight="750" text-anchor="middle">A</text><circle cx="690" cy="317" r="21" fill="#BE6255" stroke="#FFFFFF" stroke-width="3"/><text x="690" y="326" font-size="24" fill="#FFFFFF" font-weight="750" text-anchor="middle">B</text><circle cx="440" cy="406" r="21" fill="#BE6255" stroke="#FFFFFF" stroke-width="3"/><text x="440" y="415" font-size="24" fill="#FFFFFF" font-weight="750" text-anchor="middle">C</text><circle cx="620" cy="356" r="21" fill="#BE6255" stroke="#FFFFFF" stroke-width="3"/><text x="620" y="365" font-size="24" fill="#FFFFFF" font-weight="750" text-anchor="middle">D</text><rect x="52" y="603" width="896" height="418" rx="22" fill="#FFFFFF" stroke="#DCE4EB" stroke-width="2"/><rect x="74" y="622" width="184" height="45" rx="12" fill="#E7F4F2" stroke="none" stroke-width="1"/><text x="97" y="653" font-size="25" fill="#137769" font-weight="750" >AFTER</text><text x="281" y="655" font-size="30" fill="#19364C" font-weight="700" >導入費用 × 待ち時間削減効果</text><rect x="240" y="711" width="530" height="242" rx="0" fill="#F7FAFD" stroke="#BFCFDA" stroke-width="2"/><path d="M 505 711 v 242 M 240 832 h 530" stroke="#B5C5D1" stroke-width="2" stroke-dasharray="8 8"/><path d="M 240 965 h 540 M 228 953 v -252" stroke="#31566B" stroke-width="3" fill="none"/><text x="395" y="1002" font-size="22" fill="#4D6477" font-weight="600" >初期導入費用 → 高</text><text x="76" y="776" font-size="24" fill="#4D6477" font-weight="700" >削減効果</text><text x="77" y="805" font-size="21" fill="#4D6477" font-weight="600" >↑ 高</text><circle cx="320" cy="763" r="21" fill="#197E7A" stroke="#FFFFFF" stroke-width="3"/><text x="320" y="772" font-size="24" fill="#FFFFFF" font-weight="750" text-anchor="middle">A</text><circle cx="670" cy="773" r="21" fill="#197E7A" stroke="#FFFFFF" stroke-width="3"/><text x="670" y="782" font-size="24" fill="#FFFFFF" font-weight="750" text-anchor="middle">B</text><circle cx="360" cy="878" r="21" fill="#197E7A" stroke="#FFFFFF" stroke-width="3"/><text x="360" y="887" font-size="24" fill="#FFFFFF" font-weight="750" text-anchor="middle">C</text><circle cx="610" cy="903" r="21" fill="#197E7A" stroke="#FFFFFF" stroke-width="3"/><text x="610" y="912" font-size="24" fill="#FFFFFF" font-weight="750" text-anchor="middle">D</text><rect x="56" y="1038" width="888" height="84" rx="14" fill="#17364F" stroke="none" stroke-width="1"/><text x="80" y="1073" font-size="23" fill="#FFFFFF" font-weight="650" >A：動線改善　B：整理券　C：混雑可視化　D：案内表示</text><text x="80" y="1105" font-size="20" fill="#C8D8E2" font-weight="500" >※点の位置は説明用の仮説。測定値・実績・優先順位ではない。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="年商1億円と5億円を達成する契約構成の例を比較する図"><rect width="1280" height="720" fill="#F6F9FC"/><rect x="32" y="28" width="1216" height="664" rx="23" fill="#FFFFFF" stroke="#DAE4EF" stroke-width="2"/><text x="84" y="99" font-family="Noto Sans JP, sans-serif" font-size="38" font-weight="800" fill="#152E50">事業を大きくする単位は「試合」だけではない</text><text x="84" y="142" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#59718A">年間固定契約の組み合わせによる売上試算｜全金額は未検証の価格仮説</text><g font-family="Noto Sans JP, sans-serif"><rect x="78" y="190" width="542" height="354" rx="18" fill="#E8F3FC"/><rect x="660" y="190" width="542" height="354" rx="18" fill="#E8F5F0"/><text x="112" y="247" font-size="30" font-weight="800" fill="#24568E">初期：年間1億円</text><text x="695" y="247" font-size="30" font-weight="800" fill="#156E64">拡張：年間5億円</text><text x="110" y="306" font-size="22" fill="#2B4765">基幹契約 2件 × 年2,500万円</text><text x="110" y="352" font-size="22" fill="#2B4765">標準契約 10件 × 年500万円</text><rect x="111" y="394" width="475" height="46" rx="9" fill="#BCD7F2"/><rect x="111" y="394" width="238" height="46" rx="9" fill="#2A68A9"/><text x="111" y="483" font-size="23" font-weight="700" fill="#27517B">合計12契約</text><text x="696" y="306" font-size="22" fill="#275249">基幹契約 10件 × 年2,000万円</text><text x="696" y="352" font-size="22" fill="#275249">標準契約 50件 × 年600万円</text><rect x="693" y="394" width="475" height="46" rx="9" fill="#BBDCD2"/><rect x="693" y="394" width="190" height="46" rx="9" fill="#13877A"/><text x="696" y="483" font-size="23" font-weight="700" fill="#176D64">合計60契約</text><rect x="79" y="576" width="1122" height="70" rx="12" fill="#FFF3DF"/><text x="102" y="618" font-size="22" font-weight="700" fill="#77511C">契約数を増やす前に確認：独立した買い手数・支払意思・共通化率・粗利・継続率</text><text x="84" y="674" font-size="17" fill="#64758B">※同一契約に含む試合を従量売上へ二重計上しない。初年度売上は契約開始時期で変わる。</text></g></svg>
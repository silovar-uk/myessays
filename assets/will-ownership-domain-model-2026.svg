<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">当事者感×領域解像度＝Will</title><desc id="d">現場で人に近づき当事者感を高め、本場で水準を知り領域解像度を高める。両方が重なる場所に自分が引き受けたい変化がある。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1730"/><stop offset="1" stop-color="#192741"/></linearGradient><linearGradient id="glow" x2="1"><stop stop-color="#6BEAC3"/><stop offset="1" stop-color="#88A8FF"/></linearGradient></defs><rect width="1200" height="675" rx="24" fill="url(#bg)"/><g fill="none" stroke="#ffffff" opacity=".07"><path d="M0 115h1200M0 225h1200M0 335h1200M0 445h1200M0 555h1200"/><path d="M140 0v675M340 0v675M540 0v675M740 0v675M940 0v675"/></g><text x="64" y="79" font-family="Arial,'Noto Sans JP',sans-serif" font-size="21" fill="#b4c3d9" letter-spacing="3">WILL / A WORKING MODEL</text><text x="62" y="147" font-family="Arial,'Noto Sans JP',sans-serif" font-size="46" font-weight="700" fill="#fff">意思は、理解と関与のあいだで育つ。</text><rect x="72" y="217" width="448" height="215" rx="27" fill="#20354b" stroke="#45dabb" stroke-width="2"/><text x="106" y="278" fill="#80f4d5" font-family="Arial,'Noto Sans JP',sans-serif" font-size="21">OWNERSHIP</text><text x="106" y="346" fill="#fff" font-family="Arial,'Noto Sans JP',sans-serif" font-size="49" font-weight="700">当事者感</text><text x="107" y="391" fill="#b7cde0" font-family="Arial,'Noto Sans JP',sans-serif" font-size="21">この問題を、自分が引き受ける理由</text><text x="552" y="341" fill="#f0d68d" font-family="Arial,sans-serif" font-size="84" font-weight="500">×</text><rect x="648" y="217" width="478" height="215" rx="27" fill="#263552" stroke="#9faaff" stroke-width="2"/><text x="681" y="278" fill="#b6bfff" font-family="Arial,sans-serif" font-size="21">DOMAIN RESOLUTION</text><text x="681" y="346" fill="#fff" font-family="Arial,'Noto Sans JP',sans-serif" font-size="49" font-weight="700">領域解像度</text><text x="681" y="391" fill="#b7cde0" font-family="Arial,'Noto Sans JP',sans-serif" font-size="20">人・仕組み・制約を区別して見抜く力</text><path d="M296 435v55M887 435v55" stroke="#89cdd6" stroke-width="3" stroke-dasharray="6 9"/><rect x="125" y="485" width="344" height="63" rx="16" fill="#116b66"/><text x="297" y="527" fill="#fff" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="30" font-weight="700">現場に足を運ぶ</text><rect x="721" y="485" width="345" height="63" rx="16" fill="#4a4e95"/><text x="893" y="527" fill="#fff" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="30" font-weight="700">本場に足を運ぶ</text><rect x="355" y="580" width="490" height="58" rx="29" fill="url(#glow)"/><text x="600" y="618" fill="#10192d" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="28" font-weight="700">Will ＝ 引き受けたい具体的な変化</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
<title id="title">学生選手への二つの資金経路</title><desc id="desc">第三者とのNIL契約と大学からの直接支払いは別制度。契約価額と現金支払額は同じ指標ではない。</desc>
<rect width="760" height="900" fill="#F7F9FC"/><text x="42" y="68" fill="#142536" font-size="34" font-weight="700" font-family="sans-serif">選手に届く「二つの財布」</text><text x="42" y="110" fill="#50647A" font-size="23" font-family="sans-serif">同じ学生選手に、異なる経路の収益が届く</text>
<rect x="38" y="155" width="684" height="274" rx="24" fill="#E6F3F2" stroke="#8CBDB6" stroke-width="2"/>
<rect x="64" y="177" width="152" height="44" rx="22" fill="#096F68"/><text x="140" y="207" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" font-family="sans-serif">経路 A</text>
<text x="64" y="260" fill="#154441" font-size="30" font-weight="700" font-family="sans-serif">企業・支援者とのNIL契約</text><text x="64" y="303" fill="#154441" font-size="24" font-family="sans-serif">広告出演・商品紹介などの対価</text>
<path d="M 210 362 H 546" stroke="#096F68" stroke-width="5" stroke-linecap="round"/><path d="M 532 350 L 548 362 L 532 374" fill="none" stroke="#096F68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210" y="344" fill="#096F68" font-size="22" font-family="sans-serif">第三者の資金</text>
<text x="68" y="405" fill="#325D57" font-size="20" font-family="sans-serif">契約価額 ≠ 同時点の支払済み金額</text>
<rect x="38" y="460" width="684" height="274" rx="24" fill="#EEF0FA" stroke="#B9C4E7" stroke-width="2"/>
<rect x="64" y="482" width="152" height="44" rx="22" fill="#384E9B"/><text x="140" y="512" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" font-family="sans-serif">経路 B</text>
<text x="64" y="565" fill="#283660" font-size="30" font-weight="700" font-family="sans-serif">大学による直接配分</text><text x="64" y="609" fill="#283660" font-size="24" font-family="sans-serif">和解制度による金銭・給付</text>
<path d="M 210 664 H 546" stroke="#384E9B" stroke-width="5" stroke-linecap="round"/><path d="M 532 652 L 548 664 L 532 676" fill="none" stroke="#384E9B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210" y="646" fill="#384E9B" font-size="22" font-family="sans-serif">大学の予算</text>
<text x="68" y="708" fill="#55638E" font-size="20" font-family="sans-serif">2025–26年度：307大学で約17.7億ドル</text>
<rect x="174" y="755" width="410" height="75" rx="26" fill="#17283B"/>
<text x="379" y="801" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700" font-family="sans-serif">学生アスリート</text>
<text x="380" y="868" text-anchor="middle" fill="#50647A" font-size="19" font-family="sans-serif">出典：NCAA・College Sports Commission</text>
</svg>
<text x="945" y="549" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#6b817f">学びを共通プロダクトへ還流する</text>
<text x="56" y="610" font-family="sans-serif" font-size="15" fill="#6f827e">Source: Palantir Careers (Dev vs Delta) · Conceptual illustration by My Essays · 2026-10-29</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">2014年と2019年の香港デモ、集団学習の説明仮説</title><desc id="d">2014年の占拠、2014年から2019年のつながり、2019年の分散型抗議をつなぐ。因果確定ではなく研究上の説明仮説。</desc><rect width="1200" height="590" rx="26" fill="#f6f4ed"/><text x="58" y="70" font-size="34" font-family="sans-serif" font-weight="700" fill="#202a2a">目に見える運動が終わっても、何が残るのか</text><text x="58" y="110" font-size="19" font-family="sans-serif" fill="#68716e">香港2014 → 2019　研究に基づく「継承」の説明仮説</text><rect x="55" y="155" width="322" height="268" rx="17" fill="#fff" stroke="#e4dfd0" stroke-width="2"/><rect x="440" y="155" width="322" height="268" rx="17" fill="#fff" stroke="#e4dfd0" stroke-width="2"/><rect x="825" y="155" width="322" height="268" rx="17" fill="#fff" stroke="#e4dfd0" stroke-width="2"/><text x="79" y="204" font-size="37" font-family="sans-serif" font-weight="700" fill="#aa7b1d">2014</text><text x="79" y="244" font-size="25" font-family="sans-serif" font-weight="700" fill="#293231">長期の道路占拠</text><text x="79" y="286" font-size="19" font-family="sans-serif" fill="#475451">79日間の占拠と撤収</text><text x="79" y="323" font-size="19" font-family="sans-serif" fill="#475451">集会・交渉・現場の試行</text><text x="79" y="361" font-size="19" font-family="sans-serif" fill="#475451">主要要求は実現せず</text><text x="464" y="204" font-size="28" font-family="sans-serif" font-weight="700" fill="#22706a">2014–2019</text><text x="464" y="244" font-size="25" font-family="sans-serif" font-weight="700" fill="#293231">見えにくい継承</text><circle cx="474" cy="285" r="5" fill="#22706a"/><text x="490" y="292" font-size="19" font-family="sans-serif" fill="#475451">場で試した手法</text><circle cx="474" cy="327" r="5" fill="#22706a"/><text x="490" y="334" font-size="19" font-family="sans-serif" fill="#475451">職業横断的な人脈</text><circle cx="474" cy="369" r="5" fill="#22706a"/><text x="490" y="376" font-size="19" font-family="sans-serif" fill="#475451">過去の失敗からの学習</text><text x="849" y="204" font-size="37" font-family="sans-serif" font-weight="700" fill="#3b5972">2019</text><text x="849" y="244" font-size="25" font-family="sans-serif" font-weight="700" fill="#293231">分散的な大規模抗議</text><text x="849" y="286" font-size="19" font-family="sans-serif" fill="#475451">逃亡犯条例の改正案</text><text x="849" y="323" font-size="19" font-family="sans-serif" fill="#475451">移動・分散する行動</text><text x="849" y="361" font-size="19" font-family="sans-serif" fill="#475451">法案撤回・対立は継続</text><path d="M382 287 H429" stroke="#8f9d99" stroke-width="5" stroke-linecap="round"/><path d="M421 279 L434 287 L421 295" fill="none" stroke="#8f9d99" stroke-width="5"/><path d="M767 287 H814" stroke="#8f9d99" stroke-width="5" stroke-linecap="round"/><path d="M806 279 L819 287 L806 295" fill="none" stroke="#8f9d99" stroke-width="5"/><rect x="55" y="453" width="1092" height="89" rx="14" fill="#e8ece8"/><text x="79" y="488" font-size="20" font-family="sans-serif" font-weight="700" fill="#2f4c49">注意：集団的学習は2019年を説明する一因という仮説</text><text x="79" y="521" font-size="17" font-family="sans-serif" fill="#455d58">新しい法案・政府対応・情報技術などの影響を切り分けなければ、因果関係は確定できない。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350"><rect width="1200" height="350" fill="#fff"/><text x="55" y="62" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">工程Bの停止は、前後の工程へ波及する</text><rect x="65" y="122" width="320" height="110" rx="16" fill="#dbeafe" stroke="#64748b"/><text x="225" y="183" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#0f172a">工程A：仕掛品増</text><path d="M385 178 h60" stroke="#334155" stroke-width="4"/><path d="M431 169 l14 9 -14 9" stroke="#334155" fill="none" stroke-width="4"/><rect x="445" y="122" width="320" height="110" rx="16" fill="#fee2e2" stroke="#64748b"/><text x="605" y="183" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#0f172a">工程B：停止</text><path d="M765 178 h60" stroke="#334155" stroke-width="4"/><path d="M811 169 l14 9 -14 9" stroke="#334155" fill="none" stroke-width="4"/><rect x="825" y="122" width="320" height="110" rx="16" fill="#dbeafe" stroke="#64748b"/><text x="985" y="183" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#0f172a">工程C：材料不足</text><text x="65" y="295" font-family="sans-serif" font-size="19" fill="#475569">説明用の仮想工程。実在工場の生産ラインを示すものではない。</text></svg>
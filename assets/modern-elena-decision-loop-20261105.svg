<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">基本行動から前提の再点検までの判断の順番</title><desc id="desc">基本行動、観察、切り替え、前提の再点検の4段階を示す概念図</desc><rect width="1200" height="500" rx="30" fill="#f4f7fa"/><g font-family="Noto Sans CJK JP,Arial,sans-serif"><text x="56" y="65" font-size="32" font-weight="700" fill="#1b3248">技の一覧より「判断の順番」</text><text x="56" y="104" font-size="18" fill="#506579">初心者向けの足場を、観察と再判断の仕組みにする</text><rect x="56" y="154" width="255" height="212" rx="16" fill="#193e64"/><rect x="337" y="154" width="255" height="212" rx="16" fill="#167a88"/><rect x="618" y="154" width="255" height="212" rx="16" fill="#c97825"/><rect x="899" y="154" width="255" height="212" rx="16" fill="#694986"/><g fill="#fff"><text x="80" y="199" font-size="19">01　基本行動</text><text x="361" y="199" font-size="19">02　観察</text><text x="642" y="199" font-size="19">03　切り替え</text><text x="923" y="199" font-size="19">04　前提の再点検</text><g font-size="31" font-weight="700"><text x="80" y="247">まず動く</text><text x="361" y="247">結果を見る</text><text x="642" y="247">手を変える</text><text x="923" y="247">型を疑う</text></g><g font-size="19"><text x="80" y="303">使いやすい一手を</text><text x="80" y="330">決めておく</text><text x="361" y="303">命中・防御・空振り</text><text x="361" y="330">を識別する</text><text x="642" y="303">条件に応じて</text><text x="642" y="330">次の一手を選ぶ</text><text x="923" y="303">予想外が続けば</text><text x="923" y="330">前提から再確認</text></g></g><g fill="#536c82"><path d="M312 249l22-12v24z"/><path d="M593 249l22-12v24z"/><path d="M874 249l22-12v24z"/></g><path d="M1027 372v43H175v-43" fill="none" stroke="#97a7b8" stroke-width="3" stroke-dasharray="8 8"/><text x="381" y="449" fill="#566b80" font-size="20">学んだ内容を更新して、次の基本行動へ戻る</text></g></svg>
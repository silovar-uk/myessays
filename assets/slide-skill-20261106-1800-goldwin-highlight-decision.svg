<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ハイライトスライドのBeforeとAfter。左は売上、利益、店舗数を同列に置き、右は結論、主要根拠、留意点の順に整理する"><rect width="1200" height="630" fill="#f4f6fa"/><text x="55" y="65" font-size="34" font-family="sans-serif" font-weight="bold" fill="#162a44">ハイライトは「重要な数字」より「判断の順番」</text><text x="60" y="125" font-size="25" font-family="sans-serif" fill="#7b3840">Before｜項目を同列に列挙</text><text x="650" y="125" font-size="25" font-family="sans-serif" fill="#126b60">After｜判断 → 根拠 → 留意点</text><rect x="50" y="150" width="520" height="400" rx="16" fill="white" stroke="#cad2dc"/><rect x="630" y="150" width="520" height="400" rx="16" fill="white" stroke="#cad2dc"/><g font-family="sans-serif" font-size="26" fill="#263b54"><text x="85" y="235">売上高：120</text><text x="85" y="330">営業利益：12</text><text x="85" y="425">店舗数：40</text></g><rect x="660" y="180" width="460" height="92" rx="9" fill="#dcefe9"/><text x="685" y="215" font-family="sans-serif" font-size="21" fill="#145c52">判断（仮説）</text><text x="685" y="249" font-family="sans-serif" font-size="26" font-weight="bold" fill="#145c52">収益性の改善を優先検討</text><rect x="660" y="290" width="460" height="115" rx="9" fill="#e9edf5"/><text x="685" y="328" font-family="sans-serif" font-size="21" fill="#263b54">根拠（架空データ）</text><text x="685" y="365" font-family="sans-serif" font-size="24" fill="#263b54">売上120／営業利益12</text><rect x="660" y="423" width="460" height="95" rx="9" fill="#fff0d9"/><text x="685" y="457" font-family="sans-serif" font-size="21" fill="#80520c">留意点</text><text x="685" y="493" font-family="sans-serif" font-size="23" fill="#80520c">前年比・利益率の検証が必要</text><text x="55" y="595" font-family="sans-serif" font-size="20" fill="#526174">※すべて架空の数値。実在資料の再現ではない。</text></svg>
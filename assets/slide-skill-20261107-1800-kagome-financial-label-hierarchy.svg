<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" fill="#f5f7fa"/><g font-family="sans-serif" fill="#192b3c"><text x="40" y="52" font-size="30" font-weight="bold">財務数値の見せ方：Before → After</text><text x="45" y="100" font-size="23">Before｜意味が曖昧</text><text x="565" y="100" font-size="23">After｜定義と比較条件を近接</text></g><rect x="40" y="125" width="470" height="285" rx="14" fill="#fff" stroke="#d2dce5"/><text x="75" y="255" font-family="sans-serif" font-size="72" font-weight="bold" fill="#c53b45">120　12</text><text x="75" y="325" font-family="sans-serif" font-size="23" fill="#637486">何の数字？ 何年度？ 単位は？</text><rect x="550" y="125" width="510" height="285" rx="14" fill="#fff" stroke="#d2dce5"/><text x="580" y="169" font-family="sans-serif" font-size="22" fill="#192b3c">2026年度（架空データ）</text><rect x="575" y="188" width="220" height="125" rx="8" fill="#f9e9e9"/><rect x="813" y="188" width="220" height="125" rx="8" fill="#e8f1f8"/><g font-family="sans-serif"><text x="595" y="222" font-size="20" fill="#26384a">売上高</text><text x="595" y="279" font-size="38" font-weight="bold" fill="#b82c39">120億円</text><text x="832" y="222" font-size="20" fill="#26384a">営業利益</text><text x="832" y="279" font-size="38" font-weight="bold" fill="#175a80">12億円</text><text x="580" y="352" font-size="22" fill="#192b3c">営業利益率 10％（12 ÷ 120）</text><text x="580" y="386" font-size="18" fill="#637486">前年比・対象範囲は未確認</text></g><text x="40" y="454" font-family="sans-serif" font-size="17" fill="#576b7a">※すべて架空の数値。掲載資料の実際のページではありません。</text></svg>
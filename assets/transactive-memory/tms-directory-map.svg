<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">トランザクティブメモリーの索引</title>
<desc id="desc">自分がすべてを記憶するのではなく、誰が何を知っているかという検索経路を持つ概念図。</desc>
<rect width="1200" height="675" rx="36" fill="#F7F4EE"/>
<text x="64" y="78" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#A51C30">TRANSACTIVE MEMORY / DIRECTORY</text>
<text x="64" y="126" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#1F2328">覚えるのは「答え」だけじゃない。「答えの住所」も覚えられる。</text>
<line x1="600" y1="360" x2="285" y2="250" stroke="#A51C30" stroke-width="8" stroke-linecap="round"/><line x1="600" y1="360" x2="915" y2="250" stroke="#A51C30" stroke-width="8" stroke-linecap="round"/><line x1="600" y1="360" x2="300" y2="500" stroke="#A51C30" stroke-width="8" stroke-linecap="round"/><line x1="600" y1="360" x2="900" y2="500" stroke="#A51C30" stroke-width="8" stroke-linecap="round"/>
<circle cx="600" cy="360" r="112" fill="#1F2328"/><text x="600" y="348" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">自分</text><text x="600" y="394" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" fill="#FFFFFF">全部は覚えない</text>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="105" y="178" width="360" height="140" rx="28" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="3"/><text x="285" y="230" text-anchor="middle" font-size="23" fill="#59636E">Aさん</text><text x="285" y="278" text-anchor="middle" font-size="31" font-weight="800" fill="#1F2328">契約・法務</text><rect x="735" y="178" width="360" height="140" rx="28" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="3"/><text x="915" y="230" text-anchor="middle" font-size="23" fill="#59636E">Bさん</text><text x="915" y="278" text-anchor="middle" font-size="31" font-weight="800" fill="#1F2328">顧客・過去経緯</text><rect x="120" y="438" width="360" height="140" rx="28" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="3"/><text x="300" y="490" text-anchor="middle" font-size="23" fill="#59636E">Cさん</text><text x="300" y="538" text-anchor="middle" font-size="31" font-weight="800" fill="#1F2328">数字・分析</text><rect x="720" y="438" width="360" height="140" rx="28" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="3"/><text x="900" y="490" text-anchor="middle" font-size="23" fill="#59636E">Dさん</text><text x="900" y="538" text-anchor="middle" font-size="31" font-weight="800" fill="#1F2328">システム・復旧</text><rect x="428" y="592" width="344" height="48" rx="24" fill="#F0E4E6"/><text x="600" y="624" text-anchor="middle" font-size="22" font-weight="700" fill="#A51C30">WHO KNOWS WHAT = 検索索引</text></g>
</svg>
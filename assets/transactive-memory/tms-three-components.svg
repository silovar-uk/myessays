<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">TMSの三つの構成要素</title>
<desc id="desc">Lewis 2003で用いられた専門化、信頼性、協調の三要素を三角形で示す。</desc>
<rect width="1200" height="675" rx="36" fill="#F7F4EE"/>
<text x="64" y="76" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#A51C30">LEWIS / 2003</text>
<text x="64" y="124" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#1F2328">「誰が知っているか」だけでは、まだ足りない。</text>
<path d="M600 250 L330 505 L870 505 Z" fill="none" stroke="#C9C2B8" stroke-width="5"/>
<circle cx="600" cy="260" r="92" fill="#1F2328"/>
<circle cx="330" cy="500" r="92" fill="#FFFFFF" stroke="#A51C30" stroke-width="5"/>
<circle cx="870" cy="500" r="92" fill="#FFFFFF" stroke="#A51C30" stroke-width="5"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
<text x="600" y="250" font-size="22" font-weight="900" fill="#FFFFFF">SPECIALIZATION</text><text x="600" y="285" font-size="25" font-weight="800" fill="#FFFFFF">専門化</text><text x="600" y="315" font-size="17" fill="#E8E8E8">違う知識を持つ</text>
<text x="330" y="490" font-size="22" font-weight="900" fill="#A51C30">CREDIBILITY</text><text x="330" y="525" font-size="25" font-weight="800" fill="#1F2328">信頼性</text><text x="330" y="555" font-size="17" fill="#59636E">相手の知識を信用する</text>
<text x="870" y="490" font-size="22" font-weight="900" fill="#A51C30">COORDINATION</text><text x="870" y="525" font-size="25" font-weight="800" fill="#1F2328">協調</text><text x="870" y="555" font-size="17" fill="#59636E">必要なとき組み合わせる</text>
<rect x="430" y="610" width="340" height="44" rx="22" fill="#F0E4E6"/><text x="600" y="639" font-size="20" font-weight="800" fill="#A51C30">知識 × 信頼 × 取り出し方</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">1991年の恋人ペア実験</title><desc id="desc">自然なカップルと即席ペアを比較し、記憶担当を外から割り当てた場合と割り当てなかった場合の群間関係を図示。</desc><rect width="1200" height="675" rx="36" fill="#F7F4EE"/><text x="64" y="76" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#A51C30">WEGNER, ERBER &amp; RAYMOND / 1991</text><text x="64" y="124" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#1F2328">恋人には、すでに「記憶の棚割り」がある？</text><g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="190" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#59636E">条件</text><text x="555" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#59636E">自然なカップル</text><text x="915" y="213" text-anchor="middle" font-size="24" font-weight="700" fill="#59636E">即席ペア</text><rect x="60" y="240" width="1080" height="150" rx="24" fill="#FFFFFF"/><text x="190" y="297" text-anchor="middle" font-size="25" font-weight="800" fill="#1F2328">担当指定なし</text><text x="190" y="336" text-anchor="middle" font-size="19" fill="#59636E">既存の分業を使える</text><rect x="390" y="276" width="330" height="78" rx="20" fill="#E8F0E8"/><text x="555" y="327" text-anchor="middle" font-size="32" font-weight="900" fill="#2E6A3B">より良い</text><rect x="750" y="276" width="330" height="78" rx="20" fill="#EFEDE8"/><text x="915" y="327" text-anchor="middle" font-size="28" font-weight="800" fill="#59636E">比較対象</text><rect x="60" y="414" width="1080" height="150" rx="24" fill="#FFFFFF"/><text x="190" y="471" text-anchor="middle" font-size="25" font-weight="800" fill="#1F2328">担当指定あり</text><text x="190" y="510" text-anchor="middle" font-size="19" fill="#59636E">外部から棚割りを上書き</text><rect x="390" y="450" width="330" height="78" rx="20" fill="#F3E6E8"/><text x="555" y="501" text-anchor="middle" font-size="32" font-weight="900" fill="#A51C30">劣る</text><rect x="750" y="450" width="330" height="78" rx="20" fill="#E8F0E8"/><text x="915" y="501" text-anchor="middle" font-size="32" font-weight="900" fill="#2E6A3B">より良い</text><text x="60" y="615" font-size="19" fill="#59636E">※論文抄録の群間関係を図式化。数値・効果量を再現したグラフではない。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300"><rect width="1120" height="300" rx="24" fill="#f7f9fc"/><text x="42" y="52" font-size="27" fill="#1e293b" font-family="sans-serif" font-weight="bold">棚替えを「前・直後・次回」で見る</text><g font-family="sans-serif" font-size="20"><rect x="42" y="92" width="295" height="95" rx="14" fill="#e2e8f0"/><text x="190" y="131" fill="#243449" text-anchor="middle" font-weight="bold">発売前</text><text x="190" y="163" fill="#475569" text-anchor="middle" font-size="17">既存のサンリオ商品</text><rect x="414" y="92" width="295" height="95" rx="14" fill="#d7eff4"/><text x="561" y="131" fill="#1d5364" text-anchor="middle" font-weight="bold">初弾発売後</text><text x="561" y="163" fill="#366c78" text-anchor="middle" font-size="17">新しい採用・置き換え</text><rect x="786" y="92" width="295" height="95" rx="14" fill="#fce5eb"/><text x="933" y="131" fill="#81394d" text-anchor="middle" font-weight="bold">次の商品投入後</text><text x="933" y="163" fill="#9b4e65" text-anchor="middle" font-size="17">何が残り、何が消えたか</text><path d="M345 140H402 M394 132l9 8-9 8 M717 140H774 M766 132l9 8-9 8" fill="none" stroke="#64748b" stroke-width="3"/></g><text x="42" y="240" font-size="19" fill="#334155" font-family="sans-serif">同じ店舗・同じ棚・できれば同じ時間帯で、SKU／棚幅／価格／配置を比較。</text><text x="42" y="274" font-size="17" fill="#64748b" font-family="sans-serif">実店舗の観察だけでは販売数量・利益は確定できない。</text></svg>
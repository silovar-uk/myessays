<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><rect width="1100" height="330" fill="#f5f8fc"/><text x="35" y="52" font-family="sans-serif" font-size="30" font-weight="bold">委託先事故は「再評価」を組み込む</text><rect x="30" y="115" width="195" height="96" rx="14" fill="#dbeafe" stroke="#2b4a72"/><text x="127" y="170" text-anchor="middle" font-size="22" font-family="sans-serif">事故連絡</text><text x="237" y="170" font-size="24">→</text><rect x="248" y="115" width="195" height="96" rx="14" fill="#dbeafe" stroke="#2b4a72"/><text x="345" y="170" text-anchor="middle" font-size="22" font-family="sans-serif">暫定評価</text><text x="455" y="170" font-size="24">→</text><rect x="466" y="115" width="195" height="96" rx="14" fill="#dbeafe" stroke="#2b4a72"/><text x="563" y="170" text-anchor="middle" font-size="22" font-family="sans-serif">追加証拠</text><text x="673" y="170" font-size="24">→</text><rect x="684" y="115" width="195" height="96" rx="14" fill="#ffe2a9" stroke="#2b4a72"/><text x="781" y="170" text-anchor="middle" font-size="22" font-family="sans-serif">再評価</text><text x="891" y="170" font-size="24">→</text><rect x="902" y="115" width="195" height="96" rx="14" fill="#dbeafe" stroke="#2b4a72"/><text x="999" y="170" text-anchor="middle" font-size="22" font-family="sans-serif">報告・通知判断</text><text x="35" y="277" font-family="sans-serif" font-size="20">暫定情報は確定扱いせず、追加報告ごとに判断を更新する（自作概念図）</text></svg>
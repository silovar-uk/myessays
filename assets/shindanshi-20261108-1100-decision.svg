<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><rect width="900" height="330" rx="20" fill="#f8fafc"/><text x="40" y="50" font-size="25" font-family="sans-serif">客数減少 → 原因を分ける → 小さく検証</text><rect x="30" y="100" width="270" height="135" rx="15" fill="#dbeafe"/><text x="45" y="150" font-size="20" font-family="sans-serif">来店頻度・顧客層</text><text x="45" y="193" font-size="17" font-family="sans-serif">いつ・誰が減ったか</text><rect x="325" y="100" width="270" height="135" rx="15" fill="#dbeafe"/><text x="340" y="150" font-size="20" font-family="sans-serif">単価・購入点数</text><text x="340" y="193" font-size="17" font-family="sans-serif">何を買わなくなったか</text><rect x="620" y="100" width="270" height="135" rx="15" fill="#dbeafe"/><text x="635" y="150" font-size="20" font-family="sans-serif">粗利益・欠品率</text><text x="635" y="193" font-size="17" font-family="sans-serif">値下げに耐えられるか</text><text x="35" y="295" font-size="19" font-family="sans-serif">提案：全品値下げの前に、限定施策と比較で判断する</text></svg>
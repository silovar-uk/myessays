<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 721" width="760" height="721" role="img" aria-label="薬指に頼りすぎない運指設計"><rect width="760" height="721" fill="#f7f7f3"/><style>text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#152c43}.head{font-size:35px;font-weight:800}.sub{font-size:19px;fill:#52657a}.cap{font-size:24px;font-weight:700}.hint{font-size:20px;fill:#4e6072}.seq{font-size:27px;font-weight:800;fill:#145e91}.key{font-size:22px;font-weight:bold}.step{font-size:23px;font-weight:600}.foot{font-size:19px;fill:#415269}</style><text x="30" y="55" class="head">薬指に頼りすぎない運指設計</text><text x="30" y="89" class="sub">基本形：薬指＝左／中指＝下／人差し指＝右／親指＝上</text><text x="30" y="121" class="sub">物理キーの順序：←　↓　→　↑　／　青＝押下中　／　結果は右端</text><rect x="22" y="142" width="716" height="520" rx="20" fill="#fff" stroke="#dce4ea" stroke-width="2"/><text x="44" y="182" class="cap">薬指が苦手なときの優先順位</text><text x="44" y="212" class="hint">まず負担の少ない代替</text><rect x="42" y="227" width="674" height="82" rx="13" fill="#f2f6f9"/><text x="53" y="276" class="seq">1</text><circle cx="124" cy="268" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="124" y="276" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">←</text><circle cx="189" cy="268" r="26" fill="#206a9e" stroke="#206a9e"/><text x="189" y="276" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">↓</text><circle cx="254" cy="268" r="26" fill="#206a9e" stroke="#206a9e"/><text x="254" y="276" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">→</text><circle cx="319" cy="268" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="319" y="276" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↑</text><text x="395" y="260" class="step">人差し指を離し戻す</text><text x="395" y="293" class="seq">→ 323</text><rect x="42" y="321" width="674" height="82" rx="13" fill="#f9fafb"/><text x="53" y="370" class="seq">2</text><circle cx="124" cy="362" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="124" y="370" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">←</text><circle cx="189" cy="362" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="189" y="370" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↓</text><circle cx="254" cy="362" r="26" fill="#206a9e" stroke="#206a9e"/><text x="254" y="370" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">→</text><circle cx="319" cy="362" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="319" y="370" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↑</text><text x="395" y="354" class="step">中指を足し戻す</text><text x="395" y="387" class="seq">→ 636</text><rect x="42" y="415" width="674" height="82" rx="13" fill="#f2f6f9"/><text x="53" y="464" class="seq">3</text><circle cx="124" cy="456" r="26" fill="#206a9e" stroke="#206a9e"/><text x="124" y="464" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">←</text><circle cx="189" cy="456" r="26" fill="#206a9e" stroke="#206a9e"/><text x="189" y="464" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">↓</text><circle cx="254" cy="456" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="254" y="464" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">→</text><circle cx="319" cy="456" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="319" y="464" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↑</text><text x="395" y="448" class="step">左追加はゆっくり</text><text x="395" y="481" class="seq">→ 214</text><rect x="42" y="509" width="674" height="82" rx="13" fill="#f9fafb"/><text x="53" y="558" class="seq">4</text><circle cx="124" cy="550" r="26" fill="#206a9e" stroke="#206a9e"/><text x="124" y="558" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">←</text><circle cx="189" cy="550" r="26" fill="#206a9e" stroke="#206a9e"/><text x="189" y="558" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">↓</text><circle cx="254" cy="550" r="26" fill="#206a9e" stroke="#206a9e"/><text x="254" y="558" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">→</text><circle cx="319" cy="550" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="319" y="558" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↑</text><text x="395" y="542" class="step">先に離す順番を練習</text><text x="395" y="575" class="seq">→ 63214</text><text x="46" y="640" class="foot">痛み・しびれが出るなら中止。指の強制的な開閉は不要。</text><text x="30" y="704" class="sub">出典：カプコン技表／Hit Box Arcade／記事筆者作図・運指提案　｜　2026.10.24</text></svg>
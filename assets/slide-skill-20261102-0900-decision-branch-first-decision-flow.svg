<svg xmlns="http://www.w3.org/2000/svg" width="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc"><title id="title">判断分岐の設計図</title><desc id="desc">実証投資の判断を起点に、進む、追加調査、見送るの3分岐と、その条件・次の行動を並べたオリジナル図解。正式な投資判断基準ではない。</desc><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif}</style><rect x="0" y="0" width="960" height="960" rx="0" fill="#F5F8FC" stroke="none" stroke-width="1"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#146B81" stroke="none" stroke-width="1"/><text x="58" y="68" font-size="23" font-weight="700" fill="#176E83" >01 / DECISION-FIRST DESIGN</text><text x="58" y="126" font-size="38" font-weight="750" fill="#112A42" >判断条件から、スライドを逆算する</text><rect x="56" y="166" width="848" height="146" rx="24" fill="#102B46" stroke="none" stroke-width="1"/><text x="88" y="213" font-size="24" font-weight="700" fill="#99DBE5" >最初に決めること</text><text x="88" y="269" font-size="33" font-weight="750" fill="#FFFFFF" >来期、映像分析基盤の実証を始めるか？</text><path d="M 92 312 V 842" stroke="#9EB8C9" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M 92 431 H 124" stroke="#9EB8C9" stroke-width="4" fill="none"/><rect x="124" y="356" width="778" height="142" rx="20" fill="#FFFFFF" stroke="#D5DFE9" stroke-width="2"/><rect x="144" y="375" width="184" height="44" rx="12" fill="#E6F6EE" stroke="none" stroke-width="1"/><text x="165" y="406" font-size="25" font-weight="750" fill="#14734B" >進む / GO</text><text x="353" y="408" font-size="27" font-weight="700" fill="#102B46" >共通課題と導入主体が明確</text><path d="M 143 438 H 871" stroke="#E2E8EF" stroke-width="2"/><text x="151" y="476" font-size="24" font-weight="500" fill="#425D72" >次の行動：実証計画と費用を具体化</text><path d="M 92 593 H 124" stroke="#9EB8C9" stroke-width="4" fill="none"/><rect x="124" y="518" width="778" height="142" rx="20" fill="#FFFFFF" stroke="#D5DFE9" stroke-width="2"/><rect x="144" y="537" width="184" height="44" rx="12" fill="#FFF4D9" stroke="none" stroke-width="1"/><text x="165" y="568" font-size="25" font-weight="750" fill="#94620B" >追加調査 / CHECK</text><text x="353" y="570" font-size="27" font-weight="700" fill="#102B46" >需要の可能性はあるが主体が不明</text><path d="M 143 600 H 871" stroke="#E2E8EF" stroke-width="2"/><text x="151" y="638" font-size="24" font-weight="500" fill="#425D72" >次の行動：顧客・予算・決裁者を確認</text><path d="M 92 755 H 124" stroke="#9EB8C9" stroke-width="4" fill="none"/><rect x="124" y="680" width="778" height="142" rx="20" fill="#FFFFFF" stroke="#D5DFE9" stroke-width="2"/><rect x="144" y="699" width="184" height="44" rx="12" fill="#FDEBED" stroke="none" stroke-width="1"/><text x="165" y="730" font-size="25" font-weight="750" fill="#AA454B" >見送る / STOP</text><text x="353" y="732" font-size="27" font-weight="700" fill="#102B46" >権利・費用の制約が解消できない</text><path d="M 143 762 H 871" stroke="#E2E8EF" stroke-width="2"/><text x="151" y="800" font-size="24" font-weight="500" fill="#425D72" >次の行動：事業案を見直す</text><text x="56" y="905" font-size="23" font-weight="500" fill="#5D7184" >※説明用の条件例。正式な投資基準・事業実績ではありません。</text></svg>
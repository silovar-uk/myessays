<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Armor versus armor break</title>
  <desc id="desc">Schematic showing Alex Heavy Lariat armor and Marisa OD Gladius armor break, while noting that armor break is not a universal answer to stance.</desc>
  <rect width="1200" height="675" fill="#111318"/>
  <text x="72" y="86" fill="#ffffff" font-size="44" font-family="system-ui, sans-serif" font-weight="700">ARMOR ≠ INVINCIBLE</text>
  <text x="72" y="128" fill="#b8bdc7" font-size="24" font-family="system-ui, sans-serif">Heavy Lariatを読むならArmor Break。構え全体への万能回答ではない</text>

  <rect x="90" y="220" width="420" height="260" rx="32" fill="#18202b" stroke="#60a5fa" stroke-width="5"/>
  <text x="125" y="280" fill="#ffffff" font-size="32" font-family="system-ui, sans-serif" font-weight="700">ALEX</text>
  <text x="125" y="325" fill="#93c5fd" font-size="26" font-family="system-ui, sans-serif" font-weight="700">HEAVY LARIAT</text>
  <path d="M300 365 l70 35 v62 c0 54-70 84-70 84s-70-30-70-84v-62z" fill="#1e3a8a" stroke="#93c5fd" stroke-width="5"/>
  <text x="255" y="445" fill="#ffffff" font-size="22" font-family="system-ui, sans-serif" font-weight="700">ARMOR</text>

  <rect x="690" y="220" width="420" height="260" rx="32" fill="#18202b" stroke="#f59e0b" stroke-width="5"/>
  <text x="725" y="280" fill="#ffffff" font-size="32" font-family="system-ui, sans-serif" font-weight="700">MARISA</text>
  <text x="725" y="325" fill="#fde68a" font-size="26" font-family="system-ui, sans-serif" font-weight="700">OD GLADIUS</text>
  <path d="M760 405 L1030 405" stroke="#f59e0b" stroke-width="24" stroke-linecap="round"/>
  <path d="M1005 372 L1055 405 L1005 438" fill="none" stroke="#fde68a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M900 350 l-38 58 48 0 -28 58 78-82 -47 0 30-34z" fill="#fde68a"/>
  <text x="760" y="455" fill="#ffffff" font-size="22" font-family="system-ui, sans-serif" font-weight="700">ARMOR BREAK</text>

  <path d="M535 360 L665 360" stroke="#6b7280" stroke-width="8" stroke-linecap="round"/>
  <text x="555" y="330" fill="#b8bdc7" font-size="22" font-family="system-ui, sans-serif" font-weight="700">READ</text>

  <text x="72" y="575" fill="#fca5a5" font-size="27" font-family="system-ui, sans-serif" font-weight="700">注意：low profile / throw / distance が変われば別問題</text>
  <text x="72" y="620" fill="#ffffff" font-size="24" font-family="system-ui, sans-serif">属性だけでなく、姿勢と間合いまで一緒に見る。</text>
</svg>
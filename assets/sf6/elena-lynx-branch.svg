<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Lynx Song branch changes after Lynx Whirl</title>
<desc id="desc">Normal and Lynx Whirl enhanced branches show different block advantage values.</desc>
<rect width="1200" height="675" fill="#111318"/>
<text x="70" y="78" fill="#fff" font-family="system-ui,sans-serif" font-size="44" font-weight="700">LYNX SONG: SAME MOVE, DIFFERENT TURN</text>
<text x="70" y="120" fill="#aab2bf" font-family="system-ui,sans-serif" font-size="24">見るべきは派生名より「Whirlを通ったか」</text>
<g font-family="system-ui,sans-serif">
<text x="255" y="184" fill="#cbd5e1" font-size="26" font-weight="700">NORMAL</text>
<text x="760" y="184" fill="#93c5fd" font-size="26" font-weight="700">LYNX WHIRL →</text>
<line x1="600" y1="155" x2="600" y2="595" stroke="#3b4555" stroke-width="3"/>
<text x="85" y="265" fill="#fff" font-size="28" font-weight="700">Leopard Snap</text>
<text x="315" y="265" fill="#fbbf24" font-size="34" font-weight="800">-5</text>
<path d="M430 250 L735 250" stroke="#64748b" stroke-width="5"/><path d="M715 234 L740 250 L715 266" fill="none" stroke="#64748b" stroke-width="5"/>
<text x="830" y="265" fill="#ff7888" font-size="34" font-weight="800">+1</text>
<text x="85" y="380" fill="#fff" font-size="28" font-weight="700">Harvest Circle</text>
<text x="315" y="380" fill="#68e39c" font-size="34" font-weight="800">-9</text>
<path d="M430 365 L735 365" stroke="#64748b" stroke-width="5"/><path d="M715 349 L740 365 L715 381" fill="none" stroke="#64748b" stroke-width="5"/>
<text x="830" y="380" fill="#68e39c" font-size="34" font-weight="800">-4</text>
<text x="85" y="495" fill="#fff" font-size="28" font-weight="700">Mallet Smash</text>
<text x="315" y="495" fill="#fbbf24" font-size="34" font-weight="800">-3</text>
<path d="M430 480 L735 480" stroke="#64748b" stroke-width="5"/><path d="M715 464 L740 480 L715 496" fill="none" stroke="#64748b" stroke-width="5"/>
<text x="830" y="495" fill="#ff7888" font-size="34" font-weight="800">+3</text>
<rect x="70" y="545" width="1060" height="70" rx="18" fill="#172033"/>
<text x="95" y="590" fill="#c9dcff" font-size="25" font-weight="700">同じMallet Smashでも「押していい」→「押さない」に反転する。</text>
</g></svg>
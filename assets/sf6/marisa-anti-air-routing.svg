<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">モダンマリーザ対空ルーティング</title>
  <desc id="desc">飛びに気づいた時刻と位置から、ハーフハート、グラディウス、空対空、ディマカイルス、スーパーアーツ2へ分岐する図</desc>
  <rect width="1200" height="760" rx="36" fill="#f7f4ee"/>
  <text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="700" fill="#171717">飛びを見た。「いつ」「どこ」で気づいた？</text>
  <text x="600" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4b4b4b">Modern Marisa anti-air routing / 2026-09-27</text>

  <line x1="600" y1="150" x2="600" y2="205" stroke="#6b6b6b" stroke-width="4"/>
  <polygon points="600,220 590,200 610,200" fill="#6b6b6b"/>

  <rect x="430" y="225" width="340" height="84" rx="22" fill="#ffffff" stroke="#1d1d1d" stroke-width="3"/>
  <text x="600" y="260" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#171717">かなり早く気づいた？</text>
  <text x="600" y="292" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555">YES → 読み寄り / NO → 反応寄り</text>

  <line x1="430" y1="267" x2="250" y2="267" stroke="#6b6b6b" stroke-width="4"/>
  <polygon points="235,267 255,257 255,277" fill="#6b6b6b"/>
  <line x1="770" y1="267" x2="950" y2="267" stroke="#6b6b6b" stroke-width="4"/>
  <polygon points="965,267 945,257 945,277" fill="#6b6b6b"/>

  <rect x="60" y="225" width="330" height="180" rx="24" fill="#ffffff" stroke="#1d1d1d" stroke-width="3"/>
  <text x="225" y="262" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#171717">早読みできた</text>
  <text x="90" y="305" font-family="sans-serif" font-size="20" fill="#222">飛び込み攻撃まで読む</text>
  <text x="90" y="335" font-family="sans-serif" font-size="27" font-weight="700" fill="#171717">→ グラディウス</text>
  <text x="90" y="373" font-family="sans-serif" font-size="20" fill="#222">専用対空を通す</text>
  <text x="90" y="400" font-family="sans-serif" font-size="27" font-weight="700" fill="#171717">→ 弱 / ODディマ</text>

  <rect x="810" y="225" width="330" height="180" rx="24" fill="#ffffff" stroke="#1d1d1d" stroke-width="3"/>
  <text x="975" y="262" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#171717">見てから返す</text>
  <text x="840" y="305" font-family="sans-serif" font-size="20" fill="#222">正面・前上方</text>
  <text x="840" y="335" font-family="sans-serif" font-size="27" font-weight="700" fill="#171717">→ ハーフハート</text>
  <text x="840" y="373" font-family="sans-serif" font-size="20" fill="#222">頭上・めくり・垂直</text>
  <text x="840" y="400" font-family="sans-serif" font-size="27" font-weight="700" fill="#171717">→ 空対空</text>

  <line x1="600" y1="309" x2="600" y2="455" stroke="#6b6b6b" stroke-width="4" stroke-dasharray="8 10"/>
  <polygon points="600,470 590,450 610,450" fill="#6b6b6b"/>

  <rect x="270" y="478" width="660" height="108" rx="24" fill="#ffffff" stroke="#1d1d1d" stroke-width="3"/>
  <text x="600" y="518" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#171717">ゲージを払ってでも、この飛びを取り切る価値がある？</text>
  <text x="600" y="558" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#171717">YES → スーパーアーツ2「メテオリティス」</text>

  <rect x="145" y="635" width="910" height="74" rx="20" fill="#171717"/>
  <text x="600" y="665" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff">万能技を決めない。担当を決める。</text>
  <text x="600" y="694" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#e9e9e9">正面 / 早読み / 頭上 / 専用対空 / 切り札を別の問題として扱う</text>
</svg>

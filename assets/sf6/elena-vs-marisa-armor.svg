<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Marisa one-hit armor versus Elena multi-hit moves</title>
<desc id="desc">Schematic showing one hit of armor absorbing the first strike while later hits continue.</desc>
<rect width="1200" height="675" fill="#101317"/>
<text x="70" y="80" fill="#fff" font-family="system-ui,sans-serif" font-size="44" font-weight="700">ARMOR ≠ INVINCIBLE</text>
<text x="70" y="124" fill="#aeb6c3" font-family="system-ui,sans-serif" font-size="24">エレナ戦では「何発目まで耐えるか」を見る</text>
<g font-family="system-ui,sans-serif">
<rect x="90" y="220" width="330" height="220" rx="28" fill="#183047" stroke="#69b7ff" stroke-width="4"/>
<text x="130" y="285" fill="#fff" font-size="30" font-weight="700">MARISA</text>
<text x="130" y="335" fill="#bfe0ff" font-size="26">Normal Gladius</text>
<text x="130" y="375" fill="#bfe0ff" font-size="26">Normal Phalanx</text>
<text x="130" y="420" fill="#fff" font-size="32" font-weight="800">1-HIT ARMOR</text>
<path d="M455 330 L675 330" stroke="#f9b64f" stroke-width="9" stroke-linecap="round"/>
<circle cx="515" cy="330" r="28" fill="#66e39b"/><text x="505" y="339" fill="#0b2415" font-size="24" font-weight="800">1</text>
<circle cx="595" cy="330" r="28" fill="#ff7b88"/><text x="585" y="339" fill="#2b0c10" font-size="24" font-weight="800">2</text>
<circle cx="675" cy="330" r="28" fill="#ff7b88"/><text x="665" y="339" fill="#2b0c10" font-size="24" font-weight="800">3</text>
<rect x="730" y="195" width="380" height="275" rx="28" fill="#331d2b" stroke="#f08cc5" stroke-width="4"/>
<text x="775" y="260" fill="#fff" font-size="30" font-weight="700">ELENA MULTI-HIT</text>
<text x="775" y="315" fill="#ffd1e8" font-size="25">Rhino Horn</text>
<text x="775" y="355" fill="#ffd1e8" font-size="25">OD Scratch Wheel</text>
<text x="775" y="395" fill="#ffd1e8" font-size="25">Spinning Scythe</text>
<text x="775" y="442" fill="#fff" font-size="28" font-weight="800">1発耐えた後も来る</text>
<text x="70" y="570" fill="#f7c96f" font-size="27" font-weight="700">使い方：armorで「全部勝つ」ではなく、相手の単発を読む。</text>
<text x="70" y="615" fill="#aab2bf" font-size="23">OD Gladiusはframe 1からarmorだが、multi-hitそのものを消すわけではない。</text>
</g></svg>
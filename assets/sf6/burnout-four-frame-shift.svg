<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">バーンアウトの4フレームシフト</title>
  <desc id="desc">通常時に-4から+1の硬直差が、相手バーンアウト時には0から+5へ4フレーム有利側に移動する。</desc>
  <rect width="1200" height="675" fill="#111318"/>
  <text x="600" y="74" text-anchor="middle" fill="#f3f4f6" font-family="sans-serif" font-size="38" font-weight="700">同じ技でも、ガード後の「時計」が4Fずれる</text>
  <text x="600" y="116" text-anchor="middle" fill="#aeb4be" font-family="sans-serif" font-size="21">バーンアウト側：ガード硬直 +4F</text>
  <text x="235" y="180" text-anchor="middle" fill="#d8dde7" font-family="sans-serif" font-size="24" font-weight="700">通常時の硬直差</text>
  <text x="965" y="180" text-anchor="middle" fill="#ffe1d8" font-family="sans-serif" font-size="24" font-weight="700">相手バーンアウト時</text>
  <g font-family="sans-serif" font-size="29" font-weight="700">
    <text x="235" y="250" text-anchor="middle" fill="#cfd4dc">-4</text><text x="965" y="250" text-anchor="middle" fill="#f5c2b4">0</text>
    <text x="235" y="315" text-anchor="middle" fill="#cfd4dc">-3</text><text x="965" y="315" text-anchor="middle" fill="#f5c2b4">+1</text>
    <text x="235" y="380" text-anchor="middle" fill="#cfd4dc">-2</text><text x="965" y="380" text-anchor="middle" fill="#f5c2b4">+2</text>
    <text x="235" y="445" text-anchor="middle" fill="#cfd4dc">-1</text><text x="965" y="445" text-anchor="middle" fill="#f5c2b4">+3</text>
    <text x="235" y="510" text-anchor="middle" fill="#cfd4dc">0</text><text x="965" y="510" text-anchor="middle" fill="#f5c2b4">+4</text>
    <text x="235" y="575" text-anchor="middle" fill="#cfd4dc">+1</text><text x="965" y="575" text-anchor="middle" fill="#f5c2b4">+5</text>
  </g>
  <g stroke="#747d8b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M320 240 C520 240 680 240 880 240"/><path d="M320 305 C520 305 680 305 880 305"/><path d="M320 370 C520 370 680 370 880 370"/><path d="M320 435 C520 435 680 435 880 435"/><path d="M320 500 C520 500 680 500 880 500"/><path d="M320 565 C520 565 680 565 880 565"/>
  </g>
  <text x="600" y="341" text-anchor="middle" fill="#f3f4f6" font-family="sans-serif" font-size="48" font-weight="800">+4F</text>
  <text x="600" y="388" text-anchor="middle" fill="#aeb4be" font-family="sans-serif" font-size="19">攻撃が速くなるのではない</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#747d8b"/></marker></defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Marisa low attack height and reach</title>
  <desc id="desc">Schematic comparing a fast high attack with slower low attacks and their reach against a low target.</desc>
  <rect width="1200" height="675" fill="#111318"/>
  <text x="72" y="86" fill="#ffffff" font-size="44" font-family="system-ui, sans-serif" font-weight="700">MARISA: FRAME + HEIGHT + REACH</text>
  <text x="72" y="128" fill="#b8bdc7" font-size="24" font-family="system-ui, sans-serif">発生だけでなく「どこを殴るか」で選ぶ</text>

  <rect x="880" y="365" width="210" height="130" rx="36" fill="#2a3441" stroke="#93c5fd" stroke-width="5"/>
  <text x="902" y="535" fill="#93c5fd" font-size="22" font-family="system-ui, sans-serif" font-weight="700">LOW TARGET</text>

  <text x="90" y="235" fill="#fca5a5" font-size="28" font-family="system-ui, sans-serif" font-weight="700">cr.LP 4F / HIGH</text>
  <rect x="90" y="255" width="560" height="54" rx="16" fill="#7f1d1d" stroke="#fca5a5" stroke-width="4"/>
  <line x1="650" y1="282" x2="820" y2="282" stroke="#fca5a5" stroke-width="12" stroke-linecap="round"/>
  <text x="700" y="247" fill="#fca5a5" font-size="21" font-family="system-ui, sans-serif">速いが高い</text>

  <text x="90" y="385" fill="#86efac" font-size="28" font-family="system-ui, sans-serif" font-weight="700">cr.LK 5F / LOW</text>
  <rect x="90" y="405" width="650" height="54" rx="16" fill="#14532d" stroke="#86efac" stroke-width="4"/>
  <line x1="740" y1="432" x2="905" y2="432" stroke="#86efac" stroke-width="12" stroke-linecap="round"/>

  <text x="90" y="535" fill="#fde68a" font-size="28" font-family="system-ui, sans-serif" font-weight="700">cr.MK 9F / LOW</text>
  <rect x="90" y="555" width="760" height="54" rx="16" fill="#713f12" stroke="#fde68a" stroke-width="4"/>
  <line x1="850" y1="582" x2="1010" y2="582" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>

  <text x="770" y="640" fill="#ffffff" font-size="24" font-family="system-ui, sans-serif" font-weight="700">速さだけでなく「当たる技」</text>
</svg>
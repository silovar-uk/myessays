<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">モダン・マリーザの基礎練習ループ</title>
  <desc id="desc">固定練習、混合練習、ランクマッチ、リプレイ修正を循環し、入力から選択と実戦転移へ進む図</desc>
  <rect width="1200" height="620" rx="32" fill="#111318"/>
  <text x="60" y="78" fill="#f5f5f5" font-family="sans-serif" font-size="36" font-weight="700">技を増やす前に、「選べる回答」を増やす</text>
  <text x="60" y="118" fill="#b7bcc7" font-family="sans-serif" font-size="20">モダン・マリーザ｜マスター基礎練習の循環</text>

  <g font-family="sans-serif">
    <rect x="70" y="205" width="235" height="155" rx="24" fill="#202631" stroke="#77839a" stroke-width="2"/>
    <text x="95" y="250" fill="#f5f5f5" font-size="27" font-weight="700">1｜固定練習</text>
    <text x="95" y="294" fill="#d7dbe3" font-size="19">相手行動は1種類</text>
    <text x="95" y="326" fill="#d7dbe3" font-size="19">まず技を迷わず出す</text>

    <rect x="350" y="205" width="235" height="155" rx="24" fill="#202631" stroke="#77839a" stroke-width="2"/>
    <text x="375" y="250" fill="#f5f5f5" font-size="27" font-weight="700">2｜混合練習</text>
    <text x="375" y="294" fill="#d7dbe3" font-size="19">飛び・DI・地上技・待ち</text>
    <text x="375" y="326" fill="#d7dbe3" font-size="19">見て、正しい回答を選ぶ</text>

    <rect x="630" y="205" width="235" height="155" rx="24" fill="#202631" stroke="#77839a" stroke-width="2"/>
    <text x="655" y="250" fill="#f5f5f5" font-size="27" font-weight="700">3｜ランクマッチ</text>
    <text x="655" y="294" fill="#d7dbe3" font-size="19">観測テーマは1つだけ</text>
    <text x="655" y="326" fill="#d7dbe3" font-size="19">実戦で選べるか確認</text>

    <rect x="910" y="205" width="220" height="155" rx="24" fill="#202631" stroke="#77839a" stroke-width="2"/>
    <text x="935" y="250" fill="#f5f5f5" font-size="27" font-weight="700">4｜リプレイ</text>
    <text x="935" y="294" fill="#d7dbe3" font-size="19">入力・認識・選択・知識</text>
    <text x="935" y="326" fill="#d7dbe3" font-size="19">失敗した工程だけ直す</text>

    <path d="M305 282 H338" stroke="#f5f5f5" stroke-width="4" fill="none"/>
    <path d="M332 271 L344 282 L332 293" stroke="#f5f5f5" stroke-width="4" fill="none"/>
    <path d="M585 282 H618" stroke="#f5f5f5" stroke-width="4" fill="none"/>
    <path d="M612 271 L624 282 L612 293" stroke="#f5f5f5" stroke-width="4" fill="none"/>
    <path d="M865 282 H898" stroke="#f5f5f5" stroke-width="4" fill="none"/>
    <path d="M892 271 L904 282 L892 293" stroke="#f5f5f5" stroke-width="4" fill="none"/>

    <path d="M1020 376 C1020 500 190 500 190 376" stroke="#77839a" stroke-width="4" fill="none"/>
    <path d="M178 391 L190 375 L202 391" stroke="#77839a" stroke-width="4" fill="none"/>

    <rect x="200" y="445" width="800" height="92" rx="20" fill="#181d25"/>
    <text x="600" y="484" text-anchor="middle" fill="#f5f5f5" font-size="24" font-weight="700">読む力を捨てない。</text>
    <text x="600" y="517" text-anchor="middle" fill="#d7dbe3" font-size="20">その下に「読めなくても崩れない最低保証」を足す。</text>
  </g>
</svg>
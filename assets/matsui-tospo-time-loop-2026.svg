<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1070" role="img" aria-label="2015年の55周年依頼、2020年の60周年依頼、2025年の65周年予告の時系列"><rect width="720" height="1070" rx="24" fill="#f7f6f1"/><g font-family="sans-serif"><text x="35" y="62" font-size="34" font-weight="700" fill="#202c35">「最後のお願い」は</text><text x="35" y="106" font-size="34" font-weight="700" fill="#202c35">いつ最後になるのか</text><text x="35" y="151" font-size="24" fill="#586976">過去の依頼と未来の予告を分ける</text><path d="M89 226V885" stroke="#afb8bf" stroke-width="10" stroke-linecap="round"/><circle cx="89" cy="265" r="23" fill="#205d73"/><circle cx="89" cy="535" r="23" fill="#205d73"/><circle cx="89" cy="805" r="23" fill="#e39d45"/><rect x="139" y="190" width="545" height="204" rx="18" fill="#dce9ed"/><text x="171" y="252" font-size="44" font-weight="700" fill="#144e62">2015年｜55周年</text><text x="171" y="304" font-size="28" fill="#30434d">背番号55を理由に</text><text x="171" y="350" font-size="29" fill="#30434d">「最後のお願い」</text><rect x="139" y="460" width="545" height="204" rx="18" fill="#dce9ed"/><text x="171" y="522" font-size="44" font-weight="700" fill="#144e62">2020年｜60周年</text><text x="171" y="574" font-size="28" fill="#30434d">また頼まれて</text><text x="171" y="620" font-size="29" fill="#30434d">松井が「後悔」を語る</text><rect x="139" y="730" width="545" height="204" rx="18" fill="#fff0d7"/><text x="171" y="792" font-size="44" font-weight="700" fill="#9e6021">2025年｜65周年</text><text x="171" y="844" font-size="28" fill="#885927">再依頼の予告のみ</text><text x="171" y="890" font-size="28" fill="#885927">実際の掲載は未確認</text><rect x="34" y="972" width="652" height="66" rx="16" fill="#e0e9ed"/><text x="360" y="1015" text-anchor="middle" font-size="26" font-weight="700" fill="#30424c">約束は弱まり、関係の長さは見える</text></g></svg>
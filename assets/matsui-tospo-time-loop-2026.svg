<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="2015、2020、2025の最後のお願いの構成。2025年は予告で未確認"><rect width="960" height="470" rx="22" fill="#f7f6f1"/><text x="42" y="60" font-family="sans-serif" font-size="30" font-weight="700" fill="#202c35">「最後のお願い」は、いつ最後になるのか</text><text x="42" y="96" font-family="sans-serif" font-size="18" fill="#586976">記事で確認できる過去と、当時の未来予告を分ける</text><path d="M132 222H826" stroke="#a8b3bb" stroke-width="7" stroke-linecap="round"/><g font-family="sans-serif"><circle cx="148" cy="222" r="22" fill="#205d73"/><circle cx="470" cy="222" r="22" fill="#205d73"/><circle cx="798" cy="222" r="22" fill="#e39d45" stroke="#fff" stroke-width="5"/><text x="148" y="171" text-anchor="middle" font-size="43" font-weight="700" fill="#144e62">2015</text><text x="470" y="171" text-anchor="middle" font-size="43" font-weight="700" fill="#144e62">2020</text><text x="798" y="171" text-anchor="middle" font-size="43" font-weight="700" fill="#9e6021">2025</text><text x="148" y="278" text-anchor="middle" font-size="23" fill="#24333d" font-weight="700">55周年</text><text x="148" y="313" text-anchor="middle" font-size="19" fill="#42545d">背番号55で依頼</text><text x="148" y="342" text-anchor="middle" font-size="19" fill="#42545d">「最後のお願い」</text><text x="470" y="278" text-anchor="middle" font-size="23" fill="#24333d" font-weight="700">60周年</text><text x="470" y="313" text-anchor="middle" font-size="19" fill="#42545d">再び依頼される</text><text x="470" y="342" text-anchor="middle" font-size="19" fill="#42545d">松井が後悔を語る</text><text x="798" y="278" text-anchor="middle" font-size="23" fill="#9e6021" font-weight="700">65周年</text><text x="798" y="313" text-anchor="middle" font-size="19" fill="#9e6021">記者が再依頼を予告</text><text x="798" y="342" text-anchor="middle" font-size="19" fill="#9e6021">実際の掲載は未確認</text></g><rect x="38" y="392" width="884" height="51" rx="11" fill="#e4ecee"/><text x="480" y="424" text-anchor="middle" font-size="21" font-family="sans-serif" fill="#30424c">「最後」という約束が弱まるほど、付き合いの長さが見えてくる</text></svg>
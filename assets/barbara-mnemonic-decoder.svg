<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Barbaraという記憶術の読み方</title>
<desc id="desc">Barbaraの三つの母音Aが、大前提、小前提、結論の三つすべてが全称肯定命題であることを表す。</desc>
<rect width="1200" height="680" fill="#f8f7f3"/>
<text x="70" y="90" font-family="sans-serif" font-size="36" font-weight="700" fill="#1f2937">BARBARA を読む</text>
<text x="70" y="150" font-family="serif" font-size="76" letter-spacing="8" fill="#1f2937">B<tspan fill="#9a4a35" font-weight="700">A</tspan>RB<tspan fill="#9a4a35" font-weight="700">A</tspan>R<tspan fill="#9a4a35" font-weight="700">A</tspan></text>
<line x1="128" y1="175" x2="210" y2="250" stroke="#9a4a35" stroke-width="3"/>
<line x1="331" y1="175" x2="430" y2="250" stroke="#9a4a35" stroke-width="3"/>
<line x1="489" y1="175" x2="650" y2="250" stroke="#9a4a35" stroke-width="3"/>
<rect x="90" y="270" width="1020" height="285" rx="22" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="140" y="340" font-family="sans-serif" font-size="28" fill="#111827"><tspan font-weight="700">A</tspan>　大前提：すべてのMはPである</text>
<text x="140" y="415" font-family="sans-serif" font-size="28" fill="#111827"><tspan font-weight="700">A</tspan>　小前提：すべてのSはMである</text>
<text x="140" y="490" font-family="sans-serif" font-size="28" fill="#111827"><tspan font-weight="700">A</tspan>　結論　：すべてのSはPである</text>
<text x="140" y="610" font-family="sans-serif" font-size="24" fill="#4b5563">三つのAで「AAA」、中概念の位置が第一格なので「AAA-1」。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DARSの成熟をAI利用から事業変革へ進む階段として捉える概念図</title>
<desc id="desc">レベル1から5へ、基礎利用、定型業務、使い分け、業務再設計、事業変革と進む。</desc>
<rect width="1200" height="720" fill="#fafafa"/>
<text x="70" y="78" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#111">「AIを使う」から「仕事を変える」へ</text>
<text x="70" y="118" font-family="system-ui, sans-serif" font-size="20" fill="#555">公開情報をもとにDARSの進化方向を概念化</text>
<g font-family="system-ui, sans-serif">
<rect x="90" y="525" width="190" height="95" rx="16" fill="#ececec"/>
<text x="185" y="560" text-anchor="middle" font-size="18" fill="#555">LEVEL 1</text><text x="185" y="592" text-anchor="middle" font-size="24" font-weight="700" fill="#111">基礎利用</text>
<rect x="290" y="440" width="190" height="180" rx="16" fill="#e4e4e4"/>
<text x="385" y="477" text-anchor="middle" font-size="18" fill="#555">LEVEL 2</text><text x="385" y="510" text-anchor="middle" font-size="24" font-weight="700" fill="#111">定型業務</text><text x="385" y="545" text-anchor="middle" font-size="16" fill="#444">単一AIでも</text><text x="385" y="570" text-anchor="middle" font-size="16" fill="#444">一連の仕事を回す</text>
<rect x="490" y="350" width="190" height="270" rx="16" fill="#d8d8d8"/>
<text x="585" y="387" text-anchor="middle" font-size="18" fill="#555">LEVEL 3</text><text x="585" y="420" text-anchor="middle" font-size="24" font-weight="700" fill="#111">使い分け</text><text x="585" y="455" text-anchor="middle" font-size="16" fill="#444">用途別ツール</text><text x="585" y="480" text-anchor="middle" font-size="16" fill="#444">＋社内知識</text><text x="585" y="505" text-anchor="middle" font-size="16" fill="#444">→成果へ接続</text>
<rect x="690" y="255" width="190" height="365" rx="16" fill="#c9c9c9"/>
<text x="785" y="292" text-anchor="middle" font-size="18" fill="#555">LEVEL 4</text><text x="785" y="325" text-anchor="middle" font-size="24" font-weight="700" fill="#111">業務再設計</text><text x="785" y="360" text-anchor="middle" font-size="16" fill="#444">再現性</text><text x="785" y="385" text-anchor="middle" font-size="16" fill="#444">標準化</text><text x="785" y="410" text-anchor="middle" font-size="16" fill="#444">チーム展開</text>
<rect x="890" y="155" width="220" height="465" rx="16" fill="#111"/>
<text x="1000" y="194" text-anchor="middle" font-size="18" fill="#ddd">LEVEL 5</text><text x="1000" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">事業変革</text><text x="1000" y="268" text-anchor="middle" font-size="16" fill="#eee">AI前提で</text><text x="1000" y="293" text-anchor="middle" font-size="16" fill="#eee">全体設計</text><text x="1000" y="318" text-anchor="middle" font-size="16" fill="#eee">戦略・資源配分</text>
</g>
<line x1="125" y1="665" x2="1080" y2="665" stroke="#222" stroke-width="3"/>
<polygon points="1080,665 1053,651 1053,679" fill="#222"/>
<text x="125" y="700" font-family="system-ui, sans-serif" font-size="17" fill="#555">操作スキル</text><text x="1080" y="700" font-family="system-ui, sans-serif" font-size="17" fill="#555" text-anchor="end">設計・変革スキル</text>
</svg>
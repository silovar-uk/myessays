<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">DARSを個人レベルと組織レベルの二つの地図として捉える概念図</title>
<desc id="desc">上段に個人レベル、下段に組織レベルの進化を矢印で示し、右端で業務と戦略の再設計へつながる。</desc>
<rect width="1200" height="680" fill="#fafafa"/>
<text x="72" y="78" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#111">DARS = 2つの「現在地」</text>
<text x="72" y="116" font-family="system-ui, sans-serif" font-size="20" fill="#555">AIを使える個人と、AIを前提に動ける組織は別もの</text>
<rect x="72" y="170" width="1056" height="170" rx="24" fill="#fff" stroke="#d7d7d7" stroke-width="2"/>
<text x="104" y="218" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#111">個人レベル</text>
<text x="104" y="253" font-family="system-ui, sans-serif" font-size="18" fill="#555">基礎利用</text>
<line x1="220" y1="248" x2="982" y2="248" stroke="#222" stroke-width="4"/>
<polygon points="982,248 956,234 956,262" fill="#222"/>
<g font-family="system-ui, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<circle cx="300" cy="248" r="22" fill="#efefef" stroke="#222"/><text x="300" y="255">1</text>
<circle cx="465" cy="248" r="22" fill="#efefef" stroke="#222"/><text x="465" y="255">2</text>
<circle cx="630" cy="248" r="22" fill="#efefef" stroke="#222"/><text x="630" y="255">3</text>
<circle cx="795" cy="248" r="22" fill="#efefef" stroke="#222"/><text x="795" y="255">4</text>
<circle cx="960" cy="248" r="22" fill="#111"/><text x="960" y="255" fill="#fff">5</text>
</g>
<text x="1040" y="255" font-family="system-ui, sans-serif" font-size="18" fill="#555" text-anchor="end">全体設計・変革</text>
<text x="104" y="304" font-family="system-ui, sans-serif" font-size="18" fill="#333">「自分がAIを使う」から「AIを軸に仕事を設計する」へ</text>
<rect x="72" y="374" width="1056" height="170" rx="24" fill="#fff" stroke="#d7d7d7" stroke-width="2"/>
<text x="104" y="422" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#111">組織レベル</text>
<text x="104" y="457" font-family="system-ui, sans-serif" font-size="18" fill="#555">試行</text>
<line x1="220" y1="452" x2="982" y2="452" stroke="#222" stroke-width="4"/>
<polygon points="982,452 956,438 956,466" fill="#222"/>
<g font-family="system-ui, sans-serif" font-size="18" fill="#222" text-anchor="middle">
<circle cx="300" cy="452" r="22" fill="#efefef" stroke="#222"/><text x="300" y="459">1</text>
<circle cx="465" cy="452" r="22" fill="#efefef" stroke="#222"/><text x="465" y="459">2</text>
<circle cx="630" cy="452" r="22" fill="#efefef" stroke="#222"/><text x="630" y="459">3</text>
<circle cx="795" cy="452" r="22" fill="#efefef" stroke="#222"/><text x="795" y="459">4</text>
<circle cx="960" cy="452" r="22" fill="#111"/><text x="960" y="459" fill="#fff">5</text>
</g>
<text x="1040" y="459" font-family="system-ui, sans-serif" font-size="18" fill="#555" text-anchor="end">AIだから可能な戦略</text>
<text x="104" y="508" font-family="system-ui, sans-serif" font-size="18" fill="#333">「一部の人が使う」から「組織の標準と戦略になる」へ</text>
<rect x="312" y="582" width="576" height="62" rx="31" fill="#111"/>
<text x="600" y="621" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">目標はスコアではなく、仕事と事業の再設計</text>
</svg>
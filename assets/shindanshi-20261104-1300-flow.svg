<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" fill="#f8fafc"/><text x="55" y="55" font-size="30" fill="#172554" font-family="sans-serif">工程全体の流れを見る（概念図）</text><rect x="55" y="130" width="220" height="110" rx="15" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="165" y="195" text-anchor="middle" font-size="30" font-family="sans-serif">仕分け</text><path d="M280 185 h55" stroke="#334155" stroke-width="5"/><path d="M325 175 l15 10 -15 10" fill="#334155"/><rect x="345" y="130" width="220" height="110" rx="15" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="455" y="195" text-anchor="middle" font-size="30" font-family="sans-serif">順立て</text><path d="M570 185 h55" stroke="#334155" stroke-width="5"/><path d="M615 175 l15 10 -15 10" fill="#334155"/><rect x="635" y="130" width="220" height="110" rx="15" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="745" y="195" text-anchor="middle" font-size="30" font-family="sans-serif">積み付け</text><path d="M860 185 h55" stroke="#334155" stroke-width="5"/><path d="M905 175 l15 10 -15 10" fill="#334155"/><rect x="925" y="130" width="220" height="110" rx="15" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="1035" y="195" text-anchor="middle" font-size="30" font-family="sans-serif">出荷</text><text x="55" y="305" font-size="23" font-family="sans-serif" fill="#334155">待機・手戻り・例外処理を工程間で測る。実測の滞留箇所を示す図ではない。</text></svg>
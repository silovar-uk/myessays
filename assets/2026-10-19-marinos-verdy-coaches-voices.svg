<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-label="コリカ監督と相馬監督の試合後発言要旨。直接引用ではなく要約。">
<title>両監督の発言から読む、次戦の論点</title>
<defs><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09223b"/><stop offset="1" stop-color="#082f2a"/></linearGradient></defs>
<rect width="760" height="650" fill="url(#back)"/>
<text x="40" y="61" font-family="Noto Sans JP, Meiryo" fill="#fff" font-size="40" font-weight="800">監督の言葉を、戦術の問いへ</text>
<text x="42" y="96" font-family="Noto Sans JP, Meiryo" fill="#b9cfd9" font-size="19">公式会見の要旨。直接引用ではなく、編集上の整理。</text>
<rect x="39" y="133" width="680" height="214" rx="22" fill="#142f52" stroke="#547da5" stroke-width="2"/>
<rect x="39" y="133" width="11" height="214" rx="5" fill="#f05571"/>
<text x="68" y="183" fill="#ffb7c6" font-size="27" font-weight="800" font-family="Noto Sans JP, Meiryo">スティーブ・コリカ監督｜マリノス</text>
<text x="69" y="225" fill="#fff" font-size="23" font-family="Noto Sans JP, Meiryo">外側の選手が開きすぎ、相手の中盤が前へ出た</text>
<text x="69" y="260" fill="#fff" font-size="23" font-family="Noto Sans JP, Meiryo">背後の空間を十分に使えなかった。</text>
<text x="69" y="307" fill="#a9c5dc" font-size="18" font-family="Noto Sans JP, Meiryo">出典：横浜F・マリノス公式／10月17日・千葉戦後会見</text>
<rect x="39" y="366" width="680" height="215" rx="22" fill="#123e34" stroke="#4eaa90" stroke-width="2"/>
<rect x="39" y="366" width="11" height="215" rx="5" fill="#41d4a0"/>
<text x="68" y="417" fill="#a6f4d4" font-size="27" font-weight="800" font-family="Noto Sans JP, Meiryo">相馬直樹監督｜東京ヴェルディ</text>
<text x="69" y="459" fill="#fff" font-size="23" font-family="Noto Sans JP, Meiryo">ボールを奪った後、早く敵陣へ入る。</text>
<text x="69" y="494" fill="#fff" font-size="23" font-family="Noto Sans JP, Meiryo">そのための運び方や攻撃の起点を作る必要がある。</text>
<text x="69" y="542" fill="#9bd5c1" font-size="18" font-family="Noto Sans JP, Meiryo">出典：東京ヴェルディ公式／10月17日・FC東京戦後会見</text>
<text x="42" y="623" fill="#b5cdd8" font-size="19" font-family="Noto Sans JP, Meiryo">読み解く問い：空いた場所を使うか、奪ったあと二手目を続けるか。</text>
</svg>
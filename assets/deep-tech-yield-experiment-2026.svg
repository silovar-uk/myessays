<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">成功率90パーセントの工程を10段階通した理論歩留まり</title><desc id="d">独立した10工程すべての成功率を90パーセントと仮定すると100個の材料から平均34.9個が通過する計算を描く</desc><rect width="1200" height="675" rx="30" fill="#f8f7f1"/><g font-family="sans-serif"><text x="64" y="92" font-size="41" font-weight="bold" fill="#1d2d39">「90％成功」が10回続くと？</text><text x="65" y="137" font-size="24" fill="#466173">各工程90％の成功率・互いに独立と仮定した、架空の計算実験</text><line x1="100" y1="505" x2="1110" y2="505" stroke="#b4c0c6" stroke-width="3"/><line x1="100" y1="230" x2="100" y2="505" stroke="#b4c0c6" stroke-width="3"/><line x1="100" y1="230" x2="1100" y2="426" stroke="#1c7fa0" stroke-width="7" opacity=".95"/><polyline points="100,230 200,257.5 300,282.3 400,304.6 500,324.6 600,342.7 700,359 800,373.7 900,386.9 1000,398.8 1100,409.5" fill="none" stroke="#1883a3" stroke-width="9" stroke-linejoin="round"/><g fill="#1883a3"><circle cx="100" cy="230" r="12"/><circle cx="300" cy="282" r="9"/><circle cx="500" cy="325" r="9"/><circle cx="700" cy="359" r="9"/><circle cx="900" cy="387" r="9"/><circle cx="1100" cy="410" r="12"/></g><text x="97" y="202" font-size="32" font-weight="bold" fill="#154764">100個</text><text x="973" y="370" font-size="38" font-weight="bold" fill="#154764">約34.9個</text><text x="99" y="555" font-size="22" fill="#486070">投入時</text><text x="996" y="555" font-size="22" fill="#486070">10工程後</text><rect x="64" y="574" width="1069" height="65" rx="14" fill="#e4eff0"/><text x="83" y="616" font-size="26" font-weight="bold" fill="#174f66">100 × 0.9¹⁰ ≈ 34.9　｜　実測値ではなく、仮定に基づく期待値</text></g></svg>
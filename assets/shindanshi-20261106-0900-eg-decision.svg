<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300"><rect width="900" height="300" fill="#f7f9fc"/><text x="35" y="48" font-family="sans-serif" font-size="26" fill="#162d45">費用増を見つけた後の診断</text><rect x="25" y="95" width="230" height="90" rx="10" fill="#dbeafe"/><text x="40" y="145" font-size="20">費用増を確認</text><text x="270" y="145" font-size="24">→</text><rect x="315" y="95" width="255" height="90" rx="10" fill="#e0f2e9"/><text x="330" y="130" font-size="19">継続／一時／投資</text><text x="330" y="160" font-size="18">費目と案件を検証</text><text x="585" y="145" font-size="24">→</text><rect x="630" y="95" width="245" height="90" rx="10" fill="#fff0d8"/><text x="642" y="130" font-size="18">価格・工程・投資</text><text x="642" y="160" font-size="18">判断と効果検証</text><text x="30" y="245" font-size="18">注：会社固有の費用要因を断定する図ではない。</text></svg>
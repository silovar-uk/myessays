<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 535" width="1200" height="535"><style>text{font-family:Arial,'Noto Sans JP','Yu Gothic',sans-serif}</style><rect width="1200" height="535" fill="#f7f5ef"/><text x="45" y="63" fill="#172536" font-size="35" font-weight="750">「自分が正しい」から「どう確認したか」へ</text><text x="45" y="101" fill="#5a6a78" font-size="20" font-weight="500">市場規模の推計を例にした、判断の校正回路</text><rect x="39" y="162" width="258" height="235" rx="22" fill="#e5efff"/><text x="60" y="214" fill="#d85d55" font-size="25" font-weight="800">01</text><text x="60" y="265" fill="#172536" font-size="28" font-weight="720">仮説</text><text x="60" y="340" fill="#5a6a78" font-size="18" font-weight="500">市場は3類型？</text><rect x="339" y="162" width="258" height="235" rx="22" fill="#fff"/><text x="360" y="214" fill="#d85d55" font-size="25" font-weight="800">02</text><text x="360" y="265" fill="#172536" font-size="28" font-weight="720">外部基準</text><text x="360" y="340" fill="#5a6a78" font-size="18" font-weight="500">契約・顧客・一次資料</text><rect x="639" y="162" width="258" height="235" rx="22" fill="#ffe5e0"/><text x="660" y="214" fill="#d85d55" font-size="25" font-weight="800">03</text><text x="660" y="265" fill="#172536" font-size="28" font-weight="720">反証</text><text x="660" y="340" fill="#5a6a78" font-size="18" font-weight="500">分母と重複を確認</text><rect x="939" y="162" width="258" height="235" rx="22" fill="#ddf3e7"/><text x="960" y="214" fill="#d85d55" font-size="25" font-weight="800">04</text><text x="960" y="265" fill="#172536" font-size="28" font-weight="720">更新</text><text x="960" y="340" fill="#5a6a78" font-size="18" font-weight="500">分類と推計を修正</text><path d="M299 279 H329 m-10 -9 l10 9 -10 9" fill="none" stroke="#3568bb" stroke-width="4" stroke-linecap="round"/><path d="M599 279 H629 m-10 -9 l10 9 -10 9" fill="none" stroke="#3568bb" stroke-width="4" stroke-linecap="round"/><path d="M899 279 H929 m-10 -9 l10 9 -10 9" fill="none" stroke="#3568bb" stroke-width="4" stroke-linecap="round"/><path d="M1063 417 C1060 466 830 479 607 477 S164 461 166 417" fill="none" stroke="#5a6a78" stroke-width="3" stroke-dasharray="9 11"/><text x="45" y="508" fill="#5a6a78" font-size="18" font-weight="500">本稿の独自の実務仮説。1999年の実験で検証された作業手順ではない。</text></svg>

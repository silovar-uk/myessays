<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect width="1000" height="420" fill="#f7fafc"/><text x="45" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#172d45">供給ショックを三つの経営変数へ分解</text><rect x="290" y="85" width="420" height="95" rx="14" fill="#204d70"/><text x="320" y="140" font-size="22" font-family="sans-serif" fill="white">原材料・エネルギー高</text><rect x="50" y="235" width="290" height="95" rx="14" fill="#dcebf4"/><text x="65" y="289" font-size="22" font-family="sans-serif" fill="#172d45">仕入原価 ↑ → 粗利益率</text><rect x="370" y="235" width="290" height="95" rx="14" fill="#dcebf4"/><text x="385" y="289" font-size="22" font-family="sans-serif" fill="#172d45">値上げ → 販売数量</text><rect x="690" y="235" width="290" height="95" rx="14" fill="#dcebf4"/><text x="705" y="289" font-size="22" font-family="sans-serif" fill="#172d45">利上げ → 借入費用</text><text x="470" y="220" font-size="36">↓</text></svg>
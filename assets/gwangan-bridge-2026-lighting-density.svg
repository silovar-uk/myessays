<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">2025年広安大橋の照明器具増設</title><desc id="desc">2013年の7011基から2025年の13465基へ。器具の配置間隔は1mから0.5m。増加率約92パーセント。</desc><rect width="1200" height="540" rx="20" fill="#0d1e34"/><text x="65" y="73" font-family="sans-serif" fill="#fff" font-size="32" font-weight="700">橋が「光の解像度」を上げた</text><text x="66" y="112" fill="#b3c2d7" font-family="sans-serif" font-size="18">BUSAN GWANGAN BRIDGE  |  LIGHTING FIXTURES</text><text x="70" y="197" fill="#d1def0" font-family="sans-serif" font-size="22">更新前</text><rect x="215" y="160" width="427" height="56" rx="8" fill="#567289"/><text x="660" y="199" fill="#fff" font-size="27" font-family="sans-serif" font-weight="700">7,011基</text><text x="70" y="290" fill="#d1def0" font-family="sans-serif" font-size="22">2025年</text><rect x="215" y="251" width="818" height="56" rx="8" fill="#40c7c4"/><text x="1049" y="290" fill="#fff" font-size="29" font-family="sans-serif" font-weight="700">13,465基</text><text x="70" y="382" fill="#e7bd83" font-family="sans-serif" font-size="26" font-weight="700">約 +92% の増設</text><text x="455" y="382" fill="#d4e7f4" font-family="sans-serif" font-size="23">配置間隔 1.0m → 0.5m</text><path d="M66 420H1134" stroke="#58708b"/><text x="70" y="463" fill="#c5d7e8" font-family="sans-serif" font-size="19">増えたのは照明器具の数。観光客・明るさ・売上の増加率ではない。</text><text x="70" y="504" fill="#90a7bb" font-family="sans-serif" font-size="15">出所：釜山市 2025年11月13日発表。比較図は本稿作成。</text></svg>
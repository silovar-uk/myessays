<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-label="得点と選手交代、退場を時間順にまとめたオリジナルタイムライン"><rect width="1200" height="790" rx="24" fill="#0d2523"/><g font-family="sans-serif"><text x="50" y="72" font-size="43" font-weight="700" fill="#fff">４点差は、異なる４つの時間帯からできている</text><text x="52" y="117" font-size="24" fill="#c0d7cd">黄色＝得点　白＝交代　赤＝退場｜0〜95分を横軸で表示</text></g><path d="M89 414H1105" stroke="#69958b" stroke-width="9" stroke-linecap="round"/><g font-family="sans-serif"><path d="M484.70526315789476 414V280" stroke="#f5ce54" stroke-width="3"/><circle cx="484.70526315789476" cy="414" r="10" fill="#f5ce54"/><text x="484.70526315789476" y="200" font-size="22" font-weight="700" fill="#f5ce54" text-anchor="middle">37′</text><text x="484.70526315789476" y="235" font-size="19" fill="#fff" text-anchor="middle">小泉</text><text x="484.70526315789476" y="265" font-size="24" fill="#ffe36c" font-weight="700" text-anchor="middle">1–0</text><path d="M580.957894736842 414V500" stroke="#cce0d6" stroke-width="3"/><circle cx="580.957894736842" cy="414" r="10" fill="#cce0d6"/><text x="580.957894736842" y="542" font-size="22" font-weight="700" fill="#cce0d6" text-anchor="middle">46′</text><text x="580.957894736842" y="578" font-size="19" fill="#fff" text-anchor="middle">久保・細谷投入</text><path d="M645.1263157894737 414V280" stroke="#cce0d6" stroke-width="3"/><circle cx="645.1263157894737" cy="414" r="10" fill="#cce0d6"/><text x="645.1263157894737" y="200" font-size="22" font-weight="700" fill="#cce0d6" text-anchor="middle">52′</text><text x="645.1263157894737" y="235" font-size="19" fill="#fff" text-anchor="middle">古賀・山内投入</text><path d="M816.2421052631579 414V500" stroke="#f5ce54" stroke-width="3"/><circle cx="816.2421052631579" cy="414" r="10" fill="#f5ce54"/><text x="816.2421052631579" y="542" font-size="22" font-weight="700" fill="#f5ce54" text-anchor="middle">68′</text><text x="816.2421052631579" y="578" font-size="19" fill="#fff" text-anchor="middle">弓場</text><text x="
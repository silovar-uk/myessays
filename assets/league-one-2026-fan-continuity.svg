<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680"><rect width="1280" height="680" fill="#F6F8FB"/><text x="55" y="80" font-family="sans-serif" font-size="39" font-weight="700" fill="#14273F">「クラブの継続」は、ひとつのスイッチではない</text><text x="55" y="124" font-family="sans-serif" font-size="23" fill="#64748B">NECグリーンロケッツ東葛 → JR東日本グリーンウォリアーズ東葛｜2026年の告知に基づく整理</text><g font-family="sans-serif"><rect x="55" y="164" width="1170" height="100" rx="17" fill="#E0F1EB"/><text x="85" y="203" font-size="29" font-weight="700" fill="#174B3E">① 競技上の地位</text><text x="85" y="239" font-size="22" fill="#25594A">リーグが審査・承認。所属ディビジョン等を承継</text><rect x="968" y="188" width="223" height="55" rx="26" fill="#187E5F"/><text x="1079" y="225" font-size="23" font-weight="700" text-anchor="middle" fill="#FFFFFF">承継</text><rect x="55" y="278" width="1170" height="100" rx="17" fill="#E7EEF8"/><text x="85" y="317" font-size="29" font-weight="700" fill="#204565">② Japan Rugby ID</text><text x="85" y="353" font-size="22" fill="#3E5E80">共通IDの利用を予定。お気に入り・メール許諾は移行案内あり</text><rect x="968" y="302" width="223" height="55" rx="26" fill="#276A9D"/><text x="1079" y="339" font-size="21" font-weight="700" text-anchor="middle" fill="#FFFFFF">一部移行</text><rect x="55" y="392" width="1170" height="100" rx="17" fill="#F6EBD8"/><text x="85" y="431" font-size="29" font-weight="700" fill="#674518">③ ファンクラブ会員契約</text><text x="85" y="467" font-size="22" fill="#785929">旧CREWは終了。自動更新されず、新たな申込が必要</text><rect x="968" y="416" width="223" height="55" rx="26" fill="#B87921"/><text x="1079" y="453" font-size="21" font-weight="700" text-anchor="middle" fill="#FFFFFF">再入会</text><rect x="55" y="506" width="1170" height="100" rx="17" fill="#EAE9F3"/><text x="85" y="545" font-size="29" font-weight="700" fill="#49436B">④ 個別の購買・来場履歴</text><text x="85" y="581" font-size="22" fill="#676186">今回の公開資料だけでは包括的な移行実績は確認できない</text><rect x="968" y="530" width="223" height="55" rx="26" fill="#817A9B"/><text x="1079" y="567" font-size="21" font-weight="700" text-anchor="middle" fill="#FFFFFF">要確認</text><text x="55" y="647" font-size="18" fill="#52647B">資料：リーグ承認（2025/12）、CREW案内（2026/6/9）、Japan Rugby ID案内（2026/6/22）</text></g></svg>
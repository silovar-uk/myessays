<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">試合中の適応ループ</title>
  <desc id="desc">事前プラン、相手が出す問題、空いた場所の認知、配置とテンポの変更、主導権回復という循環。鹿島の課題として、相手の問題から認知・変更までの区間を短くすることを示す。</desc>
  <rect width="1200" height="560" rx="28" fill="#f7f5f2"/>
  <text x="60" y="70" font-family="sans-serif" font-size="32" font-weight="700" fill="#111827">課題は「正解がない」より、正解へ移るまでの時間</text>
  <text x="60" y="108" font-family="sans-serif" font-size="19" fill="#4b5563">A good team has a plan. A stable team can update it quickly.</text>

  <g font-family="sans-serif">
    <rect x="70" y="220" width="190" height="112" rx="20" fill="#fff" stroke="#9ca3af" stroke-width="2"/>
    <text x="165" y="264" text-anchor="middle" font-size="17" fill="#6b7280">01</text>
    <text x="165" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">事前プラン</text>

    <rect x="300" y="220" width="190" height="112" rx="20" fill="#fff" stroke="#991b1b" stroke-width="3"/>
    <text x="395" y="264" text-anchor="middle" font-size="17" fill="#991b1b">02</text>
    <text x="395" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">相手の新問題</text>

    <rect x="530" y="220" width="190" height="112" rx="20" fill="#fff4f4" stroke="#991b1b" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="625" y="264" text-anchor="middle" font-size="17" fill="#991b1b">03</text>
    <text x="625" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">空きを見つける</text>

    <rect x="760" y="220" width="190" height="112" rx="20" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <text x="855" y="264" text-anchor="middle" font-size="17" fill="#0f766e">04</text>
    <text x="855" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">配置・テンポ変更</text>

    <rect x="990" y="220" width="150" height="112" rx="20" fill="#111827"/>
    <text x="1065" y="264" text-anchor="middle" font-size="17" fill="#d1d5db">05</text>
    <text x="1065" y="298" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">主導権回復</text>
  </g>

  <g stroke="#6b7280" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M260 276 H290"/>
    <path d="M490 276 H520"/>
    <path d="M720 276 H750"/>
    <path d="M950 276 H980"/>
  </g>
  <g fill="#6b7280">
    <polygon points="290,276 277,268 277,284"/>
    <polygon points="520,276 507,268 507,284"/>
    <polygon points="750,276 737,268 737,284"/>
    <polygon points="980,276 967,268 967,284"/>
  </g>

  <path d="M395 190 C470 126 550 126 625 190" fill="none" stroke="#991b1b" stroke-width="6" stroke-linecap="round"/>
  <text x="510" y="145" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#991b1b">ここを短くする</text>
  <text x="510" y="174" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#6b7280">problem → recognition → action</text>

  <path d="M1065 350 C1065 450 185 470 165 350" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 10"/>
  <polygon points="165,350 154,370 178,367" fill="#9ca3af"/>
  <text x="600" y="445" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4b5563">試合は一度解けば終わりではない。相手がまた次の問題を出す。</text>
</svg>
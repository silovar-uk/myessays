<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">鹿島の2連敗で現れた別々の問題</title>
  <desc id="desc">水戸戦ではボールを失った直後の守備とカバー、浦和戦では相手の圧力に対して空いた場所を見つけてテンポを上げるまでの時間が課題として現れた。共通項は局面をまたぐ接続速度。</desc>
  <rect width="1200" height="680" rx="28" fill="#f7f5f2"/>
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700" fill="#111827">2連敗。でも、壊れた場所は同じではない。</text>
  <text x="60" y="108" font-family="sans-serif" font-size="20" fill="#4b5563">Mito attacked the transition. Urawa slowed the answer.</text>

  <rect x="60" y="150" width="510" height="360" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="92" y="198" font-family="sans-serif" font-size="24" font-weight="700" fill="#991b1b">9/2 水戸 4–2 鹿島</text>
  <text x="92" y="232" font-family="sans-serif" font-size="18" fill="#6b7280">Problem: defensive transition / cover</text>
  <circle cx="170" cy="330" r="30" fill="#991b1b"/>
  <circle cx="260" cy="290" r="30" fill="#991b1b"/>
  <circle cx="350" cy="330" r="30" fill="#991b1b"/>
  <text x="151" y="337" font-family="sans-serif" font-size="17" fill="#fff">鹿島</text>
  <text x="241" y="297" font-family="sans-serif" font-size="17" fill="#fff">鹿島</text>
  <text x="331" y="337" font-family="sans-serif" font-size="17" fill="#fff">鹿島</text>
  <path d="M255 335 C255 395 335 420 430 405" fill="none" stroke="#b91c1c" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 10"/>
  <polygon points="430,405 406,388 408,421" fill="#b91c1c"/>
  <circle cx="458" cy="405" r="30" fill="#0f766e"/>
  <text x="440" y="412" font-family="sans-serif" font-size="17" fill="#fff">水戸</text>
  <text x="92" y="462" font-family="sans-serif" font-size="20" font-weight="700" fill="#111827">失った瞬間 → 背後・中央のカバーが遅れる</text>
  <text x="92" y="492" font-family="sans-serif" font-size="17" fill="#4b5563">前へ出た人数と、残る人数の関係がほどけた。</text>

  <rect x="630" y="150" width="510" height="360" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="662" y="198" font-family="sans-serif" font-size="24" font-weight="700" fill="#991b1b">9/6 鹿島 0–1 浦和</text>
  <text x="662" y="232" font-family="sans-serif" font-size="18" fill="#6b7280">Problem: adaptation / tempo under pressure</text>
  <circle cx="735" cy="315" r="28" fill="#991b1b"/>
  <circle cx="840" cy="315" r="28" fill="#991b1b"/>
  <circle cx="945" cy="315" r="28" fill="#991b1b"/>
  <text x="717" y="322" font-family="sans-serif" font-size="16" fill="#fff">鹿島</text>
  <text x="822" y="322" font-family="sans-serif" font-size="16" fill="#fff">鹿島</text>
  <text x="927" y="322" font-family="sans-serif" font-size="16" fill="#fff">鹿島</text>
  <circle cx="770" cy="395" r="25" fill="#111827"/>
  <circle cx="890" cy="395" r="25" fill="#111827"/>
  <circle cx="1010" cy="395" r="25" fill="#111827"/>
  <text x="754" y="401" font-family="sans-serif" font-size="15" fill="#fff">浦和</text>
  <text x="874" y="401" font-family="sans-serif" font-size="15" fill="#fff">浦和</text>
  <text x="994" y="401" font-family="sans-serif" font-size="15" fill="#fff">浦和</text>
  <path d="M770 367 C765 345 752 335 742 331" fill="none" stroke="#111827" stroke-width="5"/>
  <path d="M890 367 C882 345 866 334 849 329" fill="none" stroke="#111827" stroke-width="5"/>
  <path d="M1010 367 C998 345 976 334 955 330" fill="none" stroke="#111827" stroke-width="5"/>
  <text x="662" y="462" font-family="sans-serif" font-size="20" font-weight="700" fill="#111827">相手の形を読む → 空いた場所を使うまでに時間</text>
  <text x="662" y="492" font-family="sans-serif" font-size="17" fill="#4b5563">押し込む量より、次の答えへ移る速度が問われた。</text>

  <rect x="190" y="555" width="820" height="78" rx="39" fill="#111827"/>
  <text x="600" y="589" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#d1d5db">COMMON LAYER</text>
  <text x="600" y="618" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">局面をまたぐ「接続速度」— phase-to-phase connection</text>
</svg>
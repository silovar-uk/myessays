<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">リーグワン2025-26のディビジョン別平均入場者数</title><desc id="desc">D1は8900人、D2は2992人、D3は1103人。レギュラーシーズン1試合あたり平均で、プレーオフと入替戦を除外。</desc><rect width="1200" height="600" fill="#f8fafc"/><text x="60" y="66" font-family="Noto Sans JP, sans-serif" font-size="31" font-weight="700" fill="#193143">「132万人」は成長を示す。でも均一な市場ではない</text><text x="60" y="107" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#5d7180">2025-26 レギュラーシーズン／1試合平均入場者数（PO・入替戦を除く）</text><g font-family="Noto Sans JP, sans-serif"><text x="60" y="202" font-size="22" font-weight="700" fill="#254e62">D1</text><text x="60" y="323" font-size="22" font-weight="700" fill="#254e62">D2</text><text x="60" y="444" font-size="22" font-weight="700" fill="#254e62">D3</text><rect x="151" y="168" width="820" height="59" rx="9" fill="#dce8ed"/><rect x="151" y="289" width="820" height="59" rx="9" fill="#dce8ed"/><rect x="151" y="410" width="820" height="59" rx="9" fill="#dce8ed"/><rect x="151" y="168" width="820" height="59" rx="9" fill="#176b87"/><rect x="151" y="289" width="276" height="59" rx="9" fill="#478da7"/><rect x="151" y="410" width="102" height="59" rx="9" fill="#86b7c8"/><text x="993" y="206" font-size="27" font-weight="700" fill="#193143">8,900人</text><text x="450" y="327" font-size="27" font-weight="700" fill="#193143">2,992人</text><text x="278" y="448" font-size="27" font-weight="700" fill="#193143">1,103人</text><text x="61" y="543" font-size="19" font-weight="700" fill="#174f67">D1 ÷ D3 ≒ 8.1倍</text><text x="328" y="543" font-size="17" fill="#526979">観客規模の差 ≠ クラブの収益性の差。価格・費用・企業支援額は別に要確認。</text><text x="60" y="580" font-size="13" fill="#607383">出典：リーグワン公式試合記録を基にした LEAD RUGBY の集計（2026年11月2日確認）。筆者作成。</text></g></svg>
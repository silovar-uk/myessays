<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="広東語の六声。縦軸は声の相対的な高さ。第一声55、第二声25、第三声33、第四声21、第五声23、第六声22。">
<title>広東語の6声は高さと変化方向で整理できる</title>
<rect width="900" height="450" rx="22" fill="#f7f8fb"/>
<text x="44" y="43" font-size="25" font-weight="700" fill="#17263d" font-family="sans-serif">広東語の6声｜高さ × 動き方</text>
<text x="44" y="68" font-size="14" fill="#58677b" font-family="sans-serif">各線は話者の声域を1（低）〜5（高）に正規化した模式図。実際の音声波形ではない。</text>
<g font-family="sans-serif">
<rect x="38" y="89" width="263" height="145" rx="13" fill="#fff" stroke="#d9e2ec"/>
<text x="58" y="118" font-size="18" font-weight="700" fill="#1b2c43">第1声｜高く平ら</text><text x="265" y="118" text-anchor="end" font-size="15" fill="#758397">55</text>
<path d="M68 139V209M68 209H271" stroke="#b9c4d0" stroke-width="2" fill="none"/><path d="M91 146L251 146" stroke="#2866bd" stroke-width="6" stroke-linecap="round"/><text x="58" y="218" font-size="11" fill="#687991">低</text><text x="61" y="137" font-size="11" fill="#687991">高</text>
<rect x="319" y="89" width="263" height="145" rx="13" fill="#fff" stroke="#d9e2ec"/>
<text x="339" y="118" font-size="18" font-weight="700" fill="#1b2c43">第2声｜高く上がる</text><text x="547" y="118" text-anchor="end" font-size="15" fill="#758397">25</text>
<path d="M349 139V209M349 209H552" stroke="#b9c4d0" stroke-width="2" fill="none"/><path d="M372 193L532 146" stroke="#de7742" stroke-width="6" stroke-linecap="round"/>
<rect x="600" y="89" width="263" height="145" rx="13" fill="#fff" stroke="#d9e2ec"/>
<text x="620" y="118" font-size="18" font-weight="700" fill="#1b2c43">第3声｜中くらいで平ら</text><text x="828" y="118" text-anchor="end" font-size="15" fill="#758397">33</text>
<path d="M630 139V209M630 209H833" stroke="#b9c4d0" stroke-width="2" fill="none"/><path d="M653 177L813 177" stroke="#2c948a" stroke-width="6" stroke-linecap="round"/>
<rect x="38" y="253" width="263" height="145" rx="13" fill="#fff" stroke="#d9e2ec"/>
<text x="58" y="282" font-size="18" font-weight="700" fill="#1b2c43">第4声｜低く下がる</text><text x="265" y="282" text-anchor="end" font-size="15" fill="#758397">21</text>
<path d="M68 303V373M68 373H271" stroke="#b9c4d0" stroke-width="2" fill="none"/><path d="M91 350L251 369" stroke="#865caf" stroke-width="6" stroke-linecap="round"/>
<rect x="319" y="253" width="263" height="145" rx="13" fill="#fff" stroke="#d9e2ec"/>
<text x="339" y="282" font-size="18" font-weight="700" fill="#1b2c43">第5声｜低く上がる</text><text x="547" y="282" text-anchor="end" font-size="15" fill="#758397">23</text>
<path d="M349 303V373M349 373H552" stroke="#b9c4d0" stroke-width="2" fill="none"/><path d="M372 369L532 341" stroke="#bd5a75" stroke-width="6" stroke-linecap="round"/>
<rect x="600" y="253" width="263" height="145" rx="13" fill="#fff" stroke="#d9e2ec"/>
<text x="620" y="282" font-size="18" font-weight="700" fill="#1b2c43">第6声｜低く平ら</text><text x="828" y="282" text-anchor="end" font-size="15" fill="#758397">22</text>
<path d="M630 303V373M630 373H833" stroke="#b9c4d0" stroke-width="2" fill="none"/><path d="M653 353L813 353" stroke="#4e7a61" stroke-width="6" stroke-linecap="round"/>
<text x="44" y="429" font-size="13" fill="#58677b">同じ動きでも高さが違う：1・3・6＝平ら ／ 2・5＝上昇 ／ 4＝下降</text>
</g></svg>
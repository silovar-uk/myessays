<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260"><rect width="1000" height="260" fill="#f6f9fc"/><g font-family="sans-serif" font-size="23" fill="#16324f"><text x="35" y="45" font-weight="bold">投資判断は助成率だけで終わらない</text><rect x="30" y="85" width="260" height="100" rx="12" fill="#dbeafe"/><text x="48" y="125">原材料費の増加</text><text x="48" y="158" font-size="17">単価・不良・廃棄</text><text x="310" y="145">→</text><rect x="360" y="85" width="260" height="100" rx="12" fill="#dcfce7"/><text x="380" y="125">対策の比較</text><text x="380" y="158" font-size="17">値上げ・改善・投資</text><text x="640" y="145">→</text><rect x="690" y="85" width="280" height="100" rx="12" fill="#fef3c7"/><text x="710" y="125">投資採算と資金繰り</text><text x="710" y="158" font-size="17">助成は条件付きで反映</text></g><text x="30" y="228" font-family="sans-serif" font-size="15" fill="#475569">自作概念図｜出典：東京都中小企業振興公社の制度概要を踏まえた分析</text></svg>
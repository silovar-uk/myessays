<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img"><style>text{font-family:Arial,'Noto Sans JP',sans-serif} .muted{fill:#617184;font-size:20px}.num{fill:#102a43;font-size:38px;font-weight:bold}.lab{fill:#102a43;font-size:24px}.small{fill:#617184;font-size:16px}</style><rect width="1100" height="490" rx="26" fill="#f7f9fc"/><text x="50" y="68" class="num">2,848人の観客と、8,000〜10,000席</text><text x="50" y="107" class="muted">2025/26 INAC神戸ホーム平均入場者数 → 新施設の計画収容規模に仮置き</text><text x="50" y="180" class="lab">8,000席の場合</text><rect x="355" y="147" width="660" height="50" rx="10" fill="#dce6ef"/><rect x="355" y="147" width="235" height="50" rx="10" fill="#c52340"/><text x="905" y="183" fill="#102a43" font-size="24" font-weight="bold">35.6%</text><text x="50" y="284" class="lab">10,000席の場合</text><rect x="355" y="248" width="660" height="50" rx="10" fill="#dce6ef"/><rect x="355" y="248" width="188" height="50" rx="10" fill="#c52340"/><text x="905" y="284" fill="#102a43" font-size="24" font-weight="bold">28.5%</text><rect x="50" y="350" width="1000" height="88" rx="15" fill="#eaf0f6"/><text x="73" y="383" class="lab">リーグ全体平均 2,392人 ｜ INAC神戸ホーム合計 31,332人（11試合）</text><text x="73" y="416" class="small">推計稼働率ではなく、現状観客数と将来の計画席数を比較した説明図。出典：WEリーグ、神戸市。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1130" viewBox="0 0 960 1130" role="img" aria-labelledby="t d"><title id="t">名前のない図形と意味で管理した図形の改善比較</title><desc id="d">Beforeは四角形やテキストという自動名だけで重なりを編集しづらい。Afterは根拠カード、注釈、結論カードを名前とまとまりで管理し、編集対象を見つけやすくした図。架空の例。</desc><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif}</style><rect x="0" y="0" width="960" height="1130" rx="0" fill="#F4F8FC" stroke="none" stroke-width="1"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#167E91" stroke="none" stroke-width="1"/><text x="55" y="69" font-size="25" font-weight="780" fill="#167E91" >BEFORE  →  AFTER</text><text x="55" y="124" font-size="38" font-weight="800" fill="#11283F" >複雑な図を「直せる図」に変える</text><rect x="53" y="159" width="854" height="392" rx="22" fill="#FFFFFF" stroke="#E0C7C9" stroke-width="2"/><rect x="74" y="181" width="156" height="45" rx="12" fill="#FCE7E8" stroke="none" stroke-width="1"/><text x="97" y="214" font-size="26" font-weight="800" fill="#9E4249" >BEFORE</text><text x="82" y="265" font-size="30" font-weight="750" fill="#18394D" >編集対象が見つからない</text><rect x="81" y="298" width="463" height="209" rx="12" fill="#F2F5F8" stroke="none" stroke-width="1"/><rect x="102" y="319" width="218" height="94" rx="12" fill="#D5E2EA" stroke="none" stroke-width="1"/><rect x="247" y="344" width="252" height="91" rx="12" fill="#B9D2DE" stroke="none" stroke-width="1"/><rect x="180" y="391" width="270" height="83" rx="12" fill="#9DC2D2" stroke="none" stroke-width="1"/><text x="114" y="352" font-size="24" font-weight="650" fill="#183A4C" >市場規模</text><text x="267" y="383" font-size="24" font-weight="650" fill="#183A4C" >顧客課題</text><text x="201" y="444" font-size="24" font-weight="650" fill="#183A4C" >導入条件</text><rect x="564" y="299" width="312" height="208" rx="12" fill="#FAECEC" stroke="none" stroke-width="1"/><text x="589" y="340" font-size="26" font-weight="700" fill="#714B4F" >四角形 18</text><text x="589" y="390" font-size="26" font-weight="700" fill="#714B4F" >テキスト 13</text><text x="589" y="440" font-size="26" font-weight="700" fill="#714B4F" >四角形 17</text><text x="81" y="528" font-size="24" font-weight="700" fill="#A34D53" >問題：図形の自動名では、何を直すか分からない</text><path d="M 480 559 v 48" stroke="#268DA0" stroke-width="5" fill="none"/><path d="M 468 594 l 12 15 12 -15" stroke="#268DA0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="53" y="626" width="854" height="417" rx="22" fill="#FFFFFF" stroke="#B5D8D6" stroke-width="2"/><rect x="74" y="647" width="142" height="45" rx="12" fill="#DCF4EA" stroke="none" stroke-width="1"/><text x="96" y="679" font-size="26" font-weight="800" fill="#13795C" >AFTER</text><text x="82" y="732" font-size="30" font-weight="750" fill="#18394D" >意味のある単位で編集できる</text><rect x="82" y="760" width="458" height="224" rx="14" fill="#E9F3F7" stroke="none" stroke-width="1"/><rect x="100" y="786" width="422" height="57" rx="10" fill="#163E55" stroke="none" stroke-width="1"/><text x="119" y="825" font-size="25" font-weight="700" fill="#FFFFFF" >結論：まず顧客課題を検証</text><rect x="100" y="856" width="200" height="96" rx="10" fill="#FFFFFF" stroke="#B8D3DF" stroke-width="2"/><rect x="313" y="856" width="208" height="96" rx="10" fill="#FFFFFF" stroke="#B8D3DF" stroke-width="2"/><text x="116" y="902" font-size="25" font-weight="700" fill="#1E4D60" >市場規模</text><text x="328" y="902" font-size="25" font-weight="700" fill="#1E4D60" >導入条件</text><rect x="565" y="759" width="311" height="224" rx="14" fill="#E6F4F1" stroke="none" stroke-width="1"/><text x="587" y="804" font-size="25" font-weight="700" fill="#145B52" >03_注釈</text><line x1="587" y1="818" x2="853" y2="818" stroke="#B7D7CE" stroke-width="2" stroke-linecap="round"/><text x="587" y="861" font-size="25" font-weight="700" fill="#145B52" >02_根拠カード</text><line x1="587" y1="875" x2="853" y2="875" stroke="#B7D7CE" stroke-width="2" stroke-linecap="round"/><text x="587" y="918" font-size="25" font-weight="700" fill="#145B52" >01_結論カード</text><text x="81" y="1021" font-size="24" font-weight="750" fill="#16765D" >改善：修正・差し替えの対象を名前で特定できる</text><text x="54" y="1095" font-size="21" font-weight="500" fill="#59758A" >※両図とも説明用の模式図。実測時間や実際の操作画面ではありません。</text></svg>
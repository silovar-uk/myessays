<circle cx="600" cy="365" r="105" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="538" y="350" font-family="sans-serif" font-size="25" font-weight="700" fill="#222">READER</text>
<text x="548" y="388" font-family="sans-serif" font-size="25" font-weight="700" fill="#222">JOB</text>
<g font-family="sans-serif" fill="#222">
<rect x="115" y="180" width="260" height="105" rx="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="155" y="225" font-size="26" font-weight="700">代入</text><text x="155" y="260" font-size="20">自分の「それ」を入れる</text>

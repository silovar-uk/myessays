<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="架空の3施策の採算ラインと利益率を比較。棒グラフに基準線15パーセントを表示し、A12、B18、C24パーセントの合否を示す"><rect width="1000" height="520" fill="#fff"/><text x="45" y="58" font-size="30" font-family="sans-serif" fill="#182538">採算ラインを越える施策はどれか</text><text x="45" y="95" font-size="18" font-family="sans-serif" fill="#546173">架空データ｜営業利益率（%）｜採用基準 15%</text><line x1="220" y1="420" x2="910" y2="420" stroke="#a7b1bf" stroke-width="2"/><line x1="565" y1="150" x2="565" y2="430" stroke="#d24a3a" stroke-width="3" stroke-dasharray="9 6"/><text x="577" y="143" font-size="20" font-family="sans-serif" fill="#b53b2c">基準 15%</text><g font-family="sans-serif" font-size="25" fill="#182538"><text x="65" y="218">施策A</text><text x="65" y="303">施策B</text><text x="65" y="388">施策C</text></g><rect x="220" y="180" width="276" height="48" rx="4" fill="#8f9fb0"/><rect x="220" y="265" width="414" height="48" rx="4" fill="#247d74"/><rect x="220" y="350" width="552" height="48" rx="4" fill="#247d74"/><g font-family="sans-serif" font-size="23" font-weight="bold"><text x="505" y="211" fill="#344054">12% 未達</text><text x="644" y="296" fill="#247d74">18% 達成</text><text x="783" y="381" fill="#247d74">24% 達成</text></g><g font-family="sans-serif" font-size="18" fill="#566274"><text x="210" y="458">0</text><text x="438" y="458">10</text><text x="668" y="458">20</text><text x="893" y="458">30%</text></g><text x="45" y="498" font-size="18" font-family="sans-serif" fill="#566274">読み方：順位だけでなく、判断基準を越えたかを同時に確認する。</text></svg>
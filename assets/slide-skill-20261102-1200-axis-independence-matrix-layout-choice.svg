<svg xmlns="http://www.w3.org/2000/svg" width="1000" viewBox="0 0 1000 890" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">図解の選び分け早見図</title><desc id="svgdesc">比較する情報の性質によって、2軸マトリクス、散布図、比較表、フロー図を選ぶ。</desc><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif}</style><rect x="0" y="0" width="1000" height="890" rx="0" fill="#F4F7FB" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1000" height="12" rx="0" fill="#1C7286" stroke="none" stroke-width="1"/><text x="58" y="70" font-size="24" fill="#1C7286" font-weight="750" >LAYOUT SELECTION / 12:00</text><text x="58" y="125" font-size="40" fill="#142E46" font-weight="750" >先に「情報の形」を診断する</text><rect x="58" y="160" width="884" height="105" rx="20" fill="#16364F" stroke="none" stroke-width="1"/><text x="95" y="204" font-size="32" fill="#FFFFFF" font-weight="750" >どんな関係を見せたい？</text><text x="95" y="243" font-size="23" fill="#BFD9E4" font-weight="500" >図形の名前ではなく、比較する問いから選ぶ</text><rect x="58" y="302" width="423" height="185" rx="20" fill="#FFFFFF" stroke="#D8E2EA" stroke-width="2"/><rect x="75" y="319" width="389" height="48" rx="12" fill="#E5F5F1" stroke="none" stroke-width="1"/><text x="88" y="352" font-size="24" fill="#116D60" font-weight="700" >2つの定性的な評価軸</text><text x="88" y="414" font-size="35" fill="#18364E" font-weight="750" >2軸マトリクス</text><text x="88" y="459" font-size="22" fill="#526C7D" font-weight="500" >位置の根拠・評価基準を明示</text><rect x="519" y="302" width="423" height="185" rx="20" fill="#FFFFFF" stroke="#D8E2EA" stroke-width="2"/><rect x="536" y="319" width="389" height="48" rx="12" fill="#E8F1FB" stroke="none" stroke-width="1"/><text x="549" y="352" font-size="24" fill="#225E96" font-weight="700" >2つの数値の関係</text><text x="549" y="414" font-size="35" fill="#18364E" font-weight="750" >散布図</text><text x="549" y="459" font-size="22" fill="#526C7D" font-weight="500" >軸の単位・実測値を明示</text><rect x="58" y="514" width="423" height="185" rx="20" fill="#FFFFFF" stroke="#D8E2EA" stroke-width="2"/><rect x="75" y="531" width="389" height="48" rx="12" fill="#FFF2DD" stroke="none" stroke-width="1"/><text x="88" y="564" font-size="24" fill="#90600F" font-weight="700" >3項目以上を横比較</text><text x="88" y="626" font-size="35" fill="#18364E" font-weight="750" >比較表</text><text x="88" y="671" font-size="22" fill="#526C7D" font-weight="500" >列をそろえ、重みも示す</text><rect x="519" y="514" width="423" height="185" rx="20" fill="#FFFFFF" stroke="#D8E2EA" stroke-width="2"/><rect x="536" y="531" width="389" height="48" rx="12" fill="#F3EBFB" stroke="none" stroke-width="1"/><text x="549" y="564" font-size="24" fill="#704B9C" font-weight="700" >順序・条件分岐を説明</text><text x="549" y="626" font-size="35" fill="#18364E" font-weight="750" >フロー図</text><text x="549" y="671" font-size="22" fill="#526C7D" font-weight="500" >矢印の意味を明示</text><rect x="58" y="740" width="884" height="112" rx="16" fill="#E8EEF4" stroke="none" stroke-width="1"/><text x="82" y="785" font-size="27" fill="#17364F" font-weight="750" >選ばない勇気：軸の意味が曖昧なら、まず比較表へ。</text><text x="82" y="824" font-size="24" fill="#496377" font-weight="500" >数値がないのに、点の位置を精密に見せない。</text></svg>
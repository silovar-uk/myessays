<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Active Listening as an observable model-check loop</title>
<desc id="desc">A loop from speaker message to provisional listener model, paraphrase, correction, inquiry and acknowledgment, then updated shared understanding.</desc>
<rect width="1200" height="675" fill="#f7f5ef"/>
<text x="70" y="88" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#171717">ACTIVE LISTENING = MAKE UNDERSTANDING CORRECTABLE</text>
<text x="70" y="132" font-family="Arial, sans-serif" font-size="23" fill="#505050">Listening becomes shared work when the speaker can inspect and edit your model.</text>
<rect x="70" y="205" width="230" height="120" rx="22" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
<text x="185" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#111827">1. SPEAKER</text>
<text x="185" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#374151">message / concern</text>
<path d="M315 265 H385" stroke="#6b7280" stroke-width="4" fill="none"/><path d="M375 252 L395 265 L375 278" fill="#6b7280"/>
<rect x="400" y="205" width="270" height="120" rx="22" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
<text x="535" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#111827">2. PROVISIONAL MODEL</text>
<text x="535" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#374151">private → not testable yet</text>
<path d="M685 265 H755" stroke="#6b7280" stroke-width="4" fill="none"/><path d="M745 252 L765 265 L745 278" fill="#6b7280"/>
<rect x="770" y="205" width="360" height="120" rx="22" fill="#111827"/>
<text x="950" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">3. PARAPHRASE</text>
<text x="950" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#e5e7eb">make the model visible</text>
<rect x="165" y="415" width="250" height="120" rx="22" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
<text x="290" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">4. CORRECT</text>
<text x="290" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#374151">“No, that part is different.”</text>
<rect x="475" y="415" width="250" height="120" rx="22" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
<text x="600" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">5. INQUIRE</text>
<text x="600" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#374151">fill missing variables</text>
<rect x="785" y="415" width="250" height="120" rx="22" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
<text x="910" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">6. ACKNOWLEDGE</text>
<text x="910" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#374151">register concern / weight</text>
<path d="M950 340 C950 375 300 365 290 400" stroke="#6b7280" stroke-width="4" fill="none"/>
<path d="M415 475 H460" stroke="#6b7280" stroke-width="4"/><path d="M450 462 L470 475 L450 488" fill="#6b7280"/>
<path d="M725 475 H770" stroke="#6b7280" stroke-width="4"/><path d="M760 462 L780 475 L760 488" fill="#6b7280"/>
<path d="M910 550 C910 610 535 610 535 345" stroke="#111827" stroke-width="4" fill="none"/><path d="M522 358 L535 338 L548 358" fill="#111827"/>
<text x="600" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#111827">UPDATE → make the next move different</text>
</svg>
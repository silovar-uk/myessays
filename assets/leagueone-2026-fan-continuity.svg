<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">チームの引き継ぎとファン会員の引き継ぎは同じではない</title><desc id="desc">旧運営主体から新運営主体へチームが譲渡されたが、旧ファンクラブ会員資格は自動更新されなかった。一方Japan Rugby IDでのログインが予定された。</desc><rect width="1200" height="560" fill="#f8fafc"/><text x="51" y="64" font-family="Noto Sans JP, sans-serif" font-size="30" font-weight="700" fill="#193143">チームは引き継がれる。会員資格は自動では引き継がれない。</text><text x="51" y="105" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#586f7d">NECグリーンロケッツ東葛 → JR東日本グリーンウォリアーズ東葛（2026年）</text><rect x="48" y="147" width="332" height="240" rx="16" fill="#e7f0f3" stroke="#aac7d3"/><text x="214" y="191" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="#234d60">旧運営主体</text><text x="214" y="239" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#496574">NEC</text><text x="214" y="293" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#496574">旧ファンクラブ</text><text x="214" y="326" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="15" fill="#496574">CREWマイページ</text><rect x="822" y="147" width="332" height="240" rx="16" fill="#e7f0f3" stroke="#aac7d3"/><text x="988" y="191" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="#234d60">新運営主体</text><text x="988" y="239" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#496574">JR東日本</text><text x="988" y="293" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#496574">新ファンクラブ</text><text x="988" y="326" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="15" fill="#496574">改めて申し込み</text><path d="M381 205h433" stroke="#2c8398" stroke-width="7"/><path d="m794 190 25 15-25 15" fill="none" stroke="#2c8398" stroke-width="7"/><text x="603" y="190" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="19" font-weight="700" fill="#176c83">チーム譲渡</text><path d="M380 315h443" stroke="#d19042" stroke-width="5" stroke-dasharray="10 13"/><rect x="453" y="288" width="297" height="55" rx="10" fill="#fff3dd" stroke="#edc083"/><text x="601" y="323" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="19" font-weight="700" fill="#86571b">会員資格は自動更新なし</text><rect x="56" y="419" width="1092" height="76" rx="13" fill="#184c63"/><text x="602" y="450" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="20" font-weight="700" fill="white">Japan Rugby ID：新チームのログインにも利用予定</text><text x="602" y="478" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#d8ecf2">共通のログイン手段 ≠ 会員契約の自動移管 ≠ データ利用への包括的同意</text><text x="51" y="538" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#637481">出典：旧NECグリーンロケッツ東葛 2026年6月9日発表。筆者作成の整理図。</text></svg>
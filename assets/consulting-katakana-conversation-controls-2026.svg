<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">コンサル会議の六つの操作</title><desc id="desc">開始、認識、調査、異議、移管、終結という六つの会議操作とその代表的な言葉を並べた模式図。</desc><rect width="1200" height="640" fill="#f5f7fa"/><text x="64" y="74" fill="#152735" font-family="Noto Sans JP, sans-serif" font-weight="700" font-size="34">会議で飛び交うカタカナは、何を動かしているのか</text><text x="64" y="112" fill="#53697c" font-family="Noto Sans JP, sans-serif" font-size="20">六つの「会話の操作」｜筆者による編集上の分類</text><g font-family="Noto Sans JP, sans-serif"><rect x="64" y="152" width="340" height="172" rx="20" fill="#e3edfa"/><text x="88" y="194" font-size="26" font-weight="700" fill="#1a3a64">01  開始する</text><text x="88" y="240" font-size="21" fill="#25475e">チェックイン</text><text x="88" y="275" font-size="20" fill="#25475e">タッチベース / シンク</text><rect x="430" y="152" width="340" height="172" rx="20" fill="#e6f5ef"/><text x="454" y="194" font-size="26" font-weight="700" fill="#245c4b">02  認識をそろえる</text><text x="454" y="240" font-size="21" fill="#245c4b">アライン</text><text x="454" y="275" font-size="20" fill="#245c4b">レベルセット / アグリー</text><rect x="796" y="152" width="340" height="172" rx="20" fill="#fff1dc"/><text x="820" y="194" font-size="26" font-weight="700" fill="#785126">03  掘り下げる</text><text x="820" y="240" font-size="21" fill="#785126">ディープダイブ</text><text x="820" y="275" font-size="20" fill="#785126">ドリルダウン / ダブルクリック</text><rect x="64" y="350" width="340" height="172" rx="20" fill="#f9e9ef"/><text x="88" y="392" font-size="26" font-weight="700" fill="#813a51">04  異議を出す</text><text x="88" y="438" font-size="21" fill="#813a51">プッシュバック</text><text x="88" y="473" font-size="20" fill="#813a51">チャレンジ / サニティチェック</text><rect x="430" y="350" width="340" height="172" rx="20" fill="#eeeafa"/><text x="454" y="392" font-size="26" font-weight="700" fill="#554178">05  仕事を移す</text><text x="454" y="438" font-size="21" fill="#554178">オフライン</text><text x="454" y="473" font-size="20" fill="#554178">オーナー / エスカレーション</text><rect x="796" y="350" width="340" height="172" rx="20" fill="#e9eeee"/><text x="820" y="392" font-size="26" font-weight="700" fill="#38545a">06  締めくくる</text><text x="820" y="438" font-size="21" fill="#38545a">チェックアウト</text><text x="820" y="473" font-size="20" fill="#38545a">ラップアップ / テイクアウェイ</text></g><text x="64" y="584" fill="#607587" font-family="Noto Sans JP, sans-serif" font-size="17">※ 出現頻度やＢＣＧ固有用語の一覧ではない。会話が行う機能を説明する図解。</text></svg>
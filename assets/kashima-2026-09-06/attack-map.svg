  <g font-family="system-ui, sans-serif"><rect x="64" y="720" width="1072" height="64" rx="20" fill="#fff" opacity=".9"/><text x="92" y="761" font-size="22" fill="#333"><tspan font-weight="800">KEY:</tspan> 中央で前を向く → 2トップへ付ける / サイドへ展開 → SBも追い越す。作り手が一人に固定されない。</text></g>

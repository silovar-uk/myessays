<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">鹿島アントラーズの基準配置と攻撃経路</title>
  <desc id="desc">4-4-2を基準に、レオセアラと鈴木優磨が前線、柴崎岳とマテウスブエノが中央、エウベルと松村優太が両翼、小川諒也と広瀬陸斗がサイドから前進する概念図。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#8c1d2c"/></marker></defs>
  <rect width="1200" height="820" rx="40" fill="#f5f2ea"/>
  <text x="64" y="78" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#222">ATTACK REFERENCE · not a predicted XI</text>
  <rect x="215" y="120" width="770" height="620" rx="24" fill="#dfe9df" stroke="#9baa9b" stroke-width="3"/>
  <line x1="215" y1="430" x2="985" y2="430" stroke="#fff" stroke-width="3"/><circle cx="600" cy="430" r="80" fill="none" stroke="#fff" stroke-width="3"/>
  <rect x="420" y="120" width="360" height="90" fill="none" stroke="#fff" stroke-width="3"/><rect x="470" y="120" width="260" height="42" fill="none" stroke="#fff" stroke-width="3"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g><circle cx="500" cy="245" r="43" fill="#8c1d2c"/><text x="500" y="252" fill="#fff" font-size="20" font-weight="800">LEO</text><text x="500" y="302" fill="#222" font-size="22" font-weight="700">レオ セアラ</text></g>
    <g><circle cx="700" cy="245" r="43" fill="#8c1d2c"/><text x="700" y="252" fill="#fff" font-size="18" font-weight="800">YUMA</text><text x="700" y="302" fill="#222" font-size="22" font-weight="700">鈴木優磨</text></g>
    <g><circle cx="355" cy="405" r="38" fill="#5b6470"/><text x="355" y="412" fill="#fff" font-size="18" font-weight="800">ELBER</text><text x="355" y="460" fill="#222" font-size="20" font-weight="700">エウベル</text></g>
    <g><circle cx="525" cy="455" r="40" fill="#353b43"/><text x="525" y="462" fill="#fff" font-size="17" font-weight="800">GAKU</text><text x="525" y="514" fill="#222" font-size="20" font-weight="700">柴崎岳</text></g>
    <g><circle cx="675" cy="455" r="40" fill="#353b43"/><text x="675" y="462" fill="#fff" font-size="15" font-weight="800">BUENO</text><text x="675" y="514" fill="#222" font-size="20" font-weight="700">マテウス ブエノ</text></g>
    <g><circle cx="845" cy="405" r="38" fill="#5b6470"/><text x="845" y="412" fill="#fff" font-size="16" font-weight="800">YUTA</text><text x="845" y="460" fill="#222" font-size="20" font-weight="700">松村優太</text></g>
    <g><circle cx="340" cy="600" r="34" fill="#788477"/><text x="340" y="607" fill="#fff" font-size="16" font-weight="800">OGAWA</text><text x="340" y="651" fill="#222" font-size="19" font-weight="700">小川諒也</text></g>
    <g><circle cx="500" cy="625" r="34" fill="#788477"/><text x="500" y="632" fill="#fff" font-size="14" font-weight="800">SEKI</text><text x="500" y="676" fill="#222" font-size="19" font-weight="700">関川郁万</text></g>
    <g><circle cx="700" cy="625" r="34" fill="#788477"/><text x="700" y="632" fill="#fff" font-size="15" font-weight="800">UEDA</text><text x="700" y="676" fill="#222" font-size="19" font-weight="700">植田直通</text></g>
    <g><circle cx="860" cy="600" r="34" fill="#788477"/><text x="860" y="607" fill="#fff" font-size="14" font-weight="800">HIROSE</text><text x="860" y="651" fill="#222" font-size="19" font-weight="700">広瀬陸斗</text></g>
  </g>
  <g stroke="#8c1d2c" stroke-width="7" fill="none" marker-end="url(#arrow)" opacity=".9">
    <path d="M525 410 C515 350 510 325 505 295"/><path d="M675 410 C690 350 700 330 700 295"/>
    <path d="M525 425 C450 385 410 390 390 402"/><path d="M675 425 C755 385 800 390 816 402"/>

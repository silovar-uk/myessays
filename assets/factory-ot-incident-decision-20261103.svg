<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" fill="#f8fafc"/><text x="52" y="62" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">工場の異常時：停止と再開の意思決定</text><rect x="40" y="115" width="212" height="100" rx="12" fill="#e0f2fe" stroke="#64748b"/><text x="146" y="170" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#0f172a">異常検知</text><path d="M252 165 h23" stroke="#475569" stroke-width="3"/><path d="M268 159 l8 6 -8 6" fill="none" stroke="#475569" stroke-width="3"/><rect x="275" y="115" width="212" height="100" rx="12" fill="#e0f2fe" stroke="#64748b"/><text x="381" y="170" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#0f172a">安全・影響確認</text><path d="M487 165 h23" stroke="#475569" stroke-width="3"/><path d="M503 159 l8 6 -8 6" fill="none" stroke="#475569" stroke-width="3"/><rect x="510" y="115" width="212" height="100" rx="12" fill="#ffedd5" stroke="#64748b"/><text x="616" y="170" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#0f172a">停止／隔離／代替</text><path d="M722 165 h23" stroke="#475569" stroke-width="3"/><path d="M738 159 l8 6 -8 6" fill="none" stroke="#475569" stroke-width="3"/><rect x="745" y="115" width="212" height="100" rx="12" fill="#e0f2fe" stroke="#64748b"/><text x="851" y="170" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#0f172a">品質確認</text><path d="M957 165 h23" stroke="#475569" stroke-width="3"/><path d="M973 159 l8 6 -8 6" fill="none" stroke="#475569" stroke-width="3"/><rect x="980" y="115" width="212" height="100" rx="12" fill="#e0f2fe" stroke="#64748b"/><text x="1086" y="170" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#0f172a">再開判断</text><text x="52" y="282" font-family="sans-serif" font-size="22" fill="#334155">判断基準：作業者の安全 ／ 製品品質 ／ 生産継続 ／ 顧客納期</text><text x="52" y="324" font-family="sans-serif" font-size="16" fill="#64748b">筆者作成の概念図。実際の演習の手順を示すものではない。</text></svg>
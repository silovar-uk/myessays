<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">TAM・SAM・Target・SOMを四つの問いに分けた図</title>
<desc id="desc">市場規模、提供可能性、戦略上の選択、獲得可能性を、四つの問いとして順に示す。</desc>
<rect width="1400" height="820" rx="40" fill="#f7f5ef"/>
<text x="90" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#191919">三つの円を「四つの問い」にほどく</text>
<text x="90" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#555">市場規模とターゲット選択は、同じ「絞る」でも理由が違う。</text>

<g font-family="system-ui, -apple-system, sans-serif">
  <rect x="85" y="245" width="275" height="330" rx="28" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <text x="115" y="305" font-size="24" font-weight="700" fill="#222">TAM｜総潜在市場</text>
  <text x="115" y="370" font-size="34" font-weight="700" fill="#111">市場は</text>
  <text x="115" y="415" font-size="34" font-weight="700" fill="#111">どれだけある？</text>
  <text x="115" y="505" font-size="21" fill="#666">Market opportunity</text>

  <path d="M380 410 H420" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <path d="M408 397 L424 410 L408 423" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="440" y="245" width="275" height="330" rx="28" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <text x="470" y="305" font-size="24" font-weight="700" fill="#222">SAM｜提供可能市場</text>
  <text x="470" y="370" font-size="34" font-weight="700" fill="#111">今の自社が</text>
  <text x="470" y="415" font-size="34" font-weight="700" fill="#111">提供できる？</text>
  <text x="470" y="505" font-size="21" fill="#666">Can serve</text>

  <path d="M735 410 H775" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <path d="M763 397 L779 410 L763 423" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="795" y="225" width="275" height="370" rx="28" fill="#111"/>
  <text x="825" y="295" font-size="24" font-weight="700" fill="#fff">Target｜標的市場</text>
  <text x="825" y="365" font-size="34" font-weight="700" fill="#fff">その中で</text>
  <text x="825" y="410" font-size="34" font-weight="700" fill="#fff">誰に集中する？</text>
  <text x="825" y="510" font-size="21" fill="#ddd">Choose</text>
  <text x="825" y="550" font-size="18" fill="#bbb">戦略上の意思決定</text>

  <path d="M1090 410 H1130" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <path d="M1118 397 L1134 410 L1118 423" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1150" y="245" width="165" height="330" rx="28" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <text x="1180" y="305" font-size="24" font-weight="700" fill="#222">SOM</text>
  <text x="1180" y="343" font-size="19" fill="#444">獲得可能市場</text>
  <text x="1180" y="400" font-size="29" font-weight="700" fill="#111">どこまで</text>
  <text x="1180" y="440" font-size="29" font-weight="700" fill="#111">獲得</text>
  <text x="1180" y="480" font-size="29" font-weight="700" fill="#111">できる？</text>
  <text x="1180" y="535" font-size="21" fill="#666">Can win</text>
</g>

<line x1="90" y1="665" x2="1310" y2="665" stroke="#d0ccc2" stroke-width="2"/>
<text x="90" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="23" fill="#333">能力（serve）と、選択（target）と、獲得可能性（obtain）は別の境界線。</text>
<text x="90" y="762" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#777">Original diagram for My Essays / 2026-09-26</text>
</svg>
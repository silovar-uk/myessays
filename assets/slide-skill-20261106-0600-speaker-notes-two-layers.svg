<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#f6f8fc"/><text x="48" y="52" font-family="sans-serif" font-size="27" font-weight="bold" fill="#162c49">情報を二層に分ける：判断は画面、説明はノート</text><rect x="48" y="82" width="864" height="272" rx="18" fill="white" stroke="#3067a8" stroke-width="3"/><rect x="48" y="82" width="864" height="56" rx="18" fill="#3067a8"/><text x="72" y="119" fill="white" font-size="24" font-family="sans-serif">スライド：見せる情報</text><text x="78" y="185" fill="#162c49" font-size="27" font-family="sans-serif" font-weight="bold">結論：何を判断してほしいか</text><rect x="78" y="218" width="370" height="98" rx="12" fill="#e8f0fc"/><rect x="468" y="218" width="410" height="98" rx="12" fill="#e8f0fc"/><text x="102" y="275" font-size="23" font-family="sans-serif" fill="#162c49">数値・比較・根拠</text><text x="493" y="275" font-size="23" font-family="sans-serif" fill="#162c49">前提・判断条件</text><path d="M480 355V394" stroke="#3067a8" stroke-width="4" stroke-dasharray="8 7"/><rect x="48" y="400" width="864" height="120" rx="18" fill="#e9f4ee" stroke="#38815b" stroke-width="3"/><text x="75" y="442" font-size="24" font-family="sans-serif" fill="#155436" font-weight="bold">発表者ノート：話す情報</text><text x="75" y="485" font-size="23" font-family="sans-serif" fill="#155436">背景説明　／　話す順番　／　想定質問</text><text x="48" y="546" font-size="16" font-family="sans-serif" fill="#526275">独自作成の概念図・数値なし</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><title>理解と決断は分けて考える</title><desc>誤判断の影響と後から修正できるかの二軸マトリクス</desc><rect width="1200" height="730" fill="#f7f6f2"/><text x="75" y="95" font-family="sans-serif" font-size="37" font-weight="700" fill="#202e40">「まだ不明」と「決められない」は同じではない</text><text x="75" y="132" font-family="sans-serif" font-size="21" fill="#677180">誤判断の影響 × 後から修正できる度合い（筆者の提案）</text><rect x="220" y="193" width="444" height="208" rx="10" fill="#f1d9d4"/><rect x="678" y="193" width="444" height="208" rx="10" fill="#f3e8cc"/><rect x="220" y="415" width="444" height="208" rx="10" fill="#e4e9ef"/><rect x="678" y="415" width="444" height="208" rx="10" fill="#d9ece3"/><text x="248" y="247" font-family="sans-serif" font-size="27" font-weight="700" fill="#763f38">検証を優先する</text><text x="248" y="289" font-family="sans-serif" font-size="22" fill="#684843">間違えると大きな損失</text><text x="248" y="325" font-family="sans-serif" font-size="22" fill="#684843">やり直しが難しい</text><text x="706" y="247" font-family="sans-serif" font-size="27" font-weight="700" fill="#775b1b">中止条件を決めて試す</text><text x="706" y="289" font-family="sans-serif" font-size="22" fill="#6f602f">損失に備えながら</text><text x="706" y="325" font-family="sans-serif" font-size="22" fill="#6f602f">途中で見直す</text><text x="248" y="469" font-family="sans-serif" font-size="27" font-weight="700" fill="#3c556c">期限と確認役を決める</text><text x="248" y="510" font-family="sans-serif" font-size="22" fill="#4b5d70">不可逆でも影響が小さいなら</text><text x="248" y="546" font-family="sans-serif" font-size="22" fill="#4b5d70">確認範囲を絞る</text><text x="706" y="469" font-family="sans-serif" font-size="27" font-weight="700" fill="#296351">小さく試して学ぶ</text><text x="706" y="510" font-family="sans-serif" font-size="22" fill="#376957">誤りの影響が小さく</text><text x="706" y="546" font-family="sans-serif" font-size="22" fill="#376957">容易に修正できる</text><text x="84" y="212" font-family="sans-serif" font-size="19" fill="#526271">大</text><text x="84" y="627" font-family="sans-serif" font-size="19" fill="#526271">小</text><text transform="rotate(-90 44 417)" x="44" y="417" font-family="sans-serif" font-size="21" fill="#526271">誤判断の影響</text><text x="227" y="666" font-family="sans-serif" font-size="18" fill="#526271">修正しにくい</text><text x="998" y="666" font-family="sans-serif" font-size="18" fill="#526271">修正しやすい</text><text x="494" y="701" font-family="sans-serif" font-size="19" fill="#526271">後からの修正可能性 →</text></svg>
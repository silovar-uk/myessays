<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="1100" height="430" rx="22" fill="#f5f8fc"/><text x="45" y="58" font-size="28" font-family="sans-serif" font-weight="bold" fill="#172b4d">再配置の選択肢（定性的な比較）</text><rect x="45" y="95" width="1010" height="77" rx="12" fill="#e8f4ee"/><text x="72" y="143" font-size="24" font-family="sans-serif" fill="#152c40">早期再配置：新事業の人手を確保 ／ 顧客支援の不足リスク</text><rect x="45" y="193" width="1010" height="77" rx="12" fill="#e0ebf6"/><text x="72" y="241" font-size="24" font-family="sans-serif" fill="#152c40">最終日まで維持：顧客支援を確保 ／ 機会費用が増える</text><rect x="45" y="291" width="1010" height="77" rx="12" fill="#e8f4ee"/><text x="72" y="339" font-size="24" font-family="sans-serif" fill="#152c40">段階的再配置：進捗に応じ調整 ／ 状況把握と調整が必要</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-label="RFIDの読み取りと業務イベントの違い。タグ、リーダー、イベント化、意思決定の四段階"><rect width="1200" height="510" rx="28" fill="#f5f8fb"/><text x="52" y="64" font-size="32" font-weight="700" fill="#17263e" font-family="Arial, 'Noto Sans JP',sans-serif">RFIDが読んだのは「ID」。業務が知りたいのは「出来事」。</text><text x="52" y="103" font-size="19" fill="#53647a" font-family="Arial, 'Noto Sans JP',sans-serif">読み取りの成功と、行動・状態の確定は別の段階にある。</text><g font-family="Arial, 'Noto Sans JP',sans-serif"><rect x="52" y="150" width="244" height="230" rx="20" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="77" y="193" font-size="18" fill="#69788f">01｜タグ</text><rect x="101" y="227" width="142" height="72" rx="5" fill="#e7f0f1" stroke="#0f766e" stroke-width="2"/><path d="M113 245h22v36h-22m118-36h-22v36h22M146 253h51v20h-51" fill="none" stroke="#0f766e" stroke-width="4"/><rect x="164" y="254" width="15" height="18" rx="3" fill="#0f766e"/><text x="174" y="350" font-size="21" text-anchor="middle" fill="#17263e">個体ID</text><path d="M303 259h40m-12-10 12 10-12 10" fill="none" stroke="#64748b" stroke-width="3"/><rect x="350" y="150" width="244" height="230" rx="20" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="375" y="193" font-size="18" fill="#69788f">02｜リーダー</text><path d="M453 230v79m-24-59q24-20 48 0m-63-20q39-36 78 0" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="440" y="261" width="26" height="51" rx="6" fill="#2563eb"/><text x="472" y="350" font-size="19" text-anchor="middle" fill="#17263e">「読めた」記録</text><path d="M600 259h40m-12-10 12 10-12 10" fill="none" stroke="#64748b" stroke-width="3"/><rect x="648" y="150" width="244" height="230" rx="20" fill="#e9f5f3" stroke="#0f766e" stroke-width="2"/><text x="673" y="193" font-size="18" fill="#0f766e">03｜イベント化</text><text x="673" y="242" font-size="20" fill="#17263e">何を・いつ</text><text x="673" y="283" font-size="20" fill="#17263e">どこで・何のために</text><text x="673" y="334" font-size="15" fill="#45665f">業務文脈・重複処理が必要</text><path d="M898 259h40m-12-10 12 10-12 10" fill="none" stroke="#64748b" stroke-width="3"/><rect x="946" y="150" width="202" height="230" rx="20" fill="#eaf0fe" stroke="#2563eb" stroke-width="2"/><text x="969" y="193" font-size="18" fill="#2563eb">04｜判断</text><text x="969" y="242" font-size="20" fill="#17263e">補充する</text><text x="969" y="280" font-size="20" fill="#17263e">通知する</text><text x="969" y="318" font-size="20" fill="#17263e">照合する</text></g><rect x="52" y="414" width="1096" height="58" rx="14" fill="#fff0dd"/><text x="78" y="452" font-family="Arial, 'Noto Sans JP',sans-serif" font-size="19" fill="#805116">注意：検知した地点と、現在位置・購入・本人の意図は同義ではない。</text></svg>
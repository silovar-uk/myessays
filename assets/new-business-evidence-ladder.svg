<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t d">
<title id="t">証拠の階段</title><desc id="d">計画から実市場行動まで証拠が強くなる六段階と、発言から行動への境界を示す。</desc>
<rect width="1200" height="780" rx="36" fill="#fafaf9"/>
<text x="70" y="86" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',sans-serif" font-size="42" font-weight="700" fill="#111827">証拠は「量」だけでなく「種類」を強くする</text>
<text x="70" y="126" font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',sans-serif" font-size="22" fill="#6b7280">聞いた → 反応した → 動いた → 賭けた → 実市場で続いた</text>
<g font-family="system-ui,-apple-system,'Hiragino Sans','Yu Gothic',sans-serif">
<rect x="80" y="570" width="160" height="90" rx="14" fill="#e5e7eb"/><text x="105" y="605" font-size="18" fill="#374151">LEVEL 0</text><text x="105" y="638" font-size="23" font-weight="700" fill="#111827">計画・机上</text>
<rect x="245" y="490" width="160" height="170" rx="14" fill="#dbeafe"/><text x="270" y="525" font-size="18" fill="#1d4ed8">LEVEL 1</text><text x="270" y="558" font-size="23" font-weight="700" fill="#111827">発言</text><text x="270" y="590" font-size="17" fill="#4b5563">聞き取り等</text>
<rect x="410" y="410" width="160" height="250" rx="14" fill="#bfdbfe"/><text x="435" y="445" font-size="18" fill="#1d4ed8">LEVEL 2</text><text x="435" y="478" font-size="23" font-weight="700" fill="#111827">具体物への反応</text>
<line x1="585" y1="250" x2="585" y2="690" stroke="#ef4444" stroke-width="4" stroke-dasharray="12 10"/>
<text x="602" y="282" font-size="22" font-weight="700" fill="#dc2626">「言った」→「動いた」</text>
<rect x="600" y="330" width="160" height="330" rx="14" fill="#fde68a"/><text x="625" y="365" font-size="18" fill="#92400e">LEVEL 3</text><text x="625" y="398" font-size="23" font-weight="700" fill="#111827">低負担行動</text>
<rect x="765" y="250" width="160" height="410" rx="14" fill="#fcd34d"/><text x="790" y="285" font-size="18" fill="#92400e">LEVEL 4</text><text x="790" y="318" font-size="23" font-weight="700" fill="#111827">高負担行動</text><text x="790" y="350" font-size="17" fill="#4b5563">予約・LOI等</text>
<rect x="930" y="170" width="190" height="490" rx="14" fill="#86efac"/><text x="955" y="205" font-size="18" fill="#166534">LEVEL 5</text><text x="955" y="238" font-size="23" font-weight="700" fill="#111827">実市場行動</text>
<path d="M100 710H1080" stroke="#111827" stroke-width="3"/><path d="M1080 710l-18-11v22z" fill="#111827"/>
<text x="82" y="748" font-size="18" fill="#6b7280">弱い</text><text x="1015" y="748" font-size="18" fill="#166534">強い</text>
</g></svg>
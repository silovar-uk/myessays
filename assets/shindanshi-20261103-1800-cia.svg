<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320"><rect width="960" height="320" fill="#f7f9fc"/><text x="40" y="55" font-size="30" font-family="sans-serif" fill="#162b45">情報資産を守る3つの観点</text><rect x="35" y="100" width="290" height="135" rx="16" fill="#d8eaff"/><text x="50" y="170" font-size="21" font-family="sans-serif" fill="#162b45">機密性｜誰が見られるか</text><rect x="345" y="100" width="290" height="135" rx="16" fill="#d9f3e7"/><text x="360" y="170" font-size="21" font-family="sans-serif" fill="#162b45">完全性｜正しい状態か</text><rect x="655" y="100" width="290" height="135" rx="16" fill="#fff0d4"/><text x="670" y="170" font-size="21" font-family="sans-serif" fill="#162b45">可用性｜必要時に使えるか</text><text x="40" y="280" font-size="18" font-family="sans-serif" fill="#41536b">三要素は別々に評価する。ひとつの製品ですべてを保証できない。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="架空の営業利益変動。前期100から数量増40、原価増マイナス25、販管費増マイナス10を経て当期105となる滝グラフ"><rect width="1200" height="620" fill="#f8fafc"/><text x="55" y="67" font-size="31" font-family="sans-serif" font-weight="bold" fill="#14263b">営業利益の変化を「差分の理由」で説明する</text><text x="55" y="105" font-size="20" font-family="sans-serif" fill="#475569">架空例・単位：百万円｜100 + 40 − 25 − 10 = 105</text><line x1="80" y1="510" x2="1110" y2="510" stroke="#94a3b8" stroke-width="2"/><rect x="110" y="260" width="130" height="250" fill="#334155"/><rect x="315" y="160" width="130" height="100" fill="#0f766e"/><rect x="520" y="160" width="130" height="62.5" fill="#c2410c"/><rect x="725" y="222.5" width="130" height="25" fill="#c2410c"/><rect x="930" y="247.5" width="130" height="262.5" fill="#334155"/><g stroke="#94a3b8" stroke-dasharray="6 6" stroke-width="2"><line x1="240" y1="260" x2="315" y2="260"/><line x1="445" y1="160" x2="520" y2="160"/><line x1="650" y1="222.5" x2="725" y2="222.5"/><line x1="855" y1="247.5" x2="930" y2="247.5"/></g><g font-family="sans-serif" text-anchor="middle" font-size="23" fill="#0f172a"><text x="175" y="247">100</text><text x="380" y="147">+40</text><text x="585" y="147">−25</text><text x="790" y="210">−10</text><text x="995" y="235">105</text></g><g font-family="sans-serif" text-anchor="middle" font-size="21" fill="#334155"><text x="175" y="548">前期</text><text x="380" y="548">数量増</text><text x="585" y="548">原価増</text><text x="790" y="548">販管費増</text><text x="995" y="548">当期</text></g><text x="80" y="595" font-size="18" font-family="sans-serif" fill="#475569">濃灰：合計値／緑：増益要因／橙：減益要因。実在企業の業績ではありません。</text></svg>
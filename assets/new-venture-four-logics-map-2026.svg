<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">新規事業創出の四つの論理</title><desc id="desc">四つの理論について、起点となる質問、最初の行動、証拠を4行で比較。</desc>
<rect width="1280" height="850" fill="#f7f8f5"/><text x="60" y="76" font-size="33" font-weight="800" fill="#122633" font-family="sans-serif">事業創出の四つの論理</text>
<text x="60" y="110" font-size="18" fill="#4a626d" font-family="sans-serif">同じアイデアでも、最初に投げる質問が違う</text>
<text x="82" y="161" font-size="17" fill="#566972" font-family="sans-serif">方法論</text><text x="374" y="161" font-size="17" fill="#566972" font-family="sans-serif">何を問うか</text><text x="763" y="161" font-size="17" fill="#566972" font-family="sans-serif">最初の一手</text>
<rect x="53" y="185" width="1174" height="128" rx="18" fill="#fff" stroke="#dae0dd"/><rect x="53" y="185" width="9" height="128" rx="4" fill="#086f83"/><text x="82" y="218" font-size="17" font-weight="700" fill="#086f83" font-family="sans-serif">01</text><text x="82" y="251" font-size="23" font-weight="750" fill="#152b34" font-family="sans-serif">リーン・スタートアップ</text><text x="82" y="281" font-size="15" fill="#60727a" font-family="sans-serif">顧客反応 / 検証学習</text><text x="370" y="246" font-size="24" font-weight="650" fill="#19323d" font-family="sans-serif">売れるという仮説は本当か</text><text x="763" y="246" font-size="22" fill="#19323d" font-family="sans-serif">試作品・手動販売 → 購入行動</text><rect x="53" y="333" width="1174" height="128" rx="18" fill="#fff" stroke="#dae0dd"/><rect x="53" y="333" width="9" height="128" rx="4" fill="#8f5d1f"/><text x="82" y="366" font-size="17" font-weight="700" fill="#8f5d1f" font-family="sans-serif">02</text><text x="82" y="399" font-size="23" font-weight="750" fill="#152b34" font-family="sans-serif">エフェクチュエーション</text><text x="82" y="429" font-size="15" fill="#60727a" font-family="sans-serif">許容損失 / 関係者参加</text><text x="370" y="394" font-size="24" font-weight="650" fill="#19323d" font-family="sans-serif">今ある手段で誰と動けるか</text><text x="763" y="394" font-size="22" fill="#19323d" font-family="sans-serif">資源棚卸し → 協力の約束</text><rect x="53" y="481" width="1174" height="128" rx="18" fill="#fff" stroke="#dae0dd"/><rect x="53" y="481" width="9" height="128" rx="4" fill="#7653a6"/><text x="82" y="514" font-size="17" font-weight="700" fill="#7653a6" font-family="sans-serif">03</text><text x="82" y="547" font-size="23" font-weight="750" fill="#152b34" font-family="sans-serif">創造理論</text><text x="82" y="577" font-size="15" fill="#60727a" font-family="sans-serif">合意 / 新たな取引条件</text><text x="370" y="542" font-size="24" font-weight="650" fill="#19323d" font-family="sans-serif">市場は行動で作られるのか</text><text x="763" y="542" font-size="22" fill="#19323d" font-family="sans-serif">障壁を特定 → 制度・取引を共創</text><rect x="53" y="629" width="1174" height="128" rx="18" fill="#fff" stroke="#dae0dd"/><rect x="53" y="629" width="9" height="128" rx="4" fill="#1c6b4c"/><text x="82" y="662" font-size="17" font-weight="700" fill="#1c6b4c" font-family="sans-serif">04</text><text x="82" y="695" font-size="23" font-weight="750" fill="#152b34" font-family="sans-serif">理論に基づく事業創出</text><text x="82" y="725" font-size="15" fill="#60727a" font-family="sans-serif">差別的な見立て / 反証</text><text x="370" y="690" font-size="24" font-weight="650" fill="#19323d" font-family="sans-serif">なぜ未実現の価値が生じるか</text><text x="763" y="690" font-size="22" fill="#19323d" font-family="sans-serif">因果仮説 → 反証する実験</text>
<text x="60" y="805" font-size="16" fill="#67777d" font-family="sans-serif">独自整理｜2024年の四アプローチ比較論文を基礎に再構成。方法論の公式図ではない。</text></svg>
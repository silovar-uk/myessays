<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1260" viewBox="0 0 960 1260" role="img"><style>text{font-family:Meiryo,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}</style><rect x="0" y="0" width="960" height="1260" rx="0" fill="#f7fbff" stroke="none"/><text x="56" y="76" font-size="39" fill="#12344e" font-weight="800">同じ会社を３つの数字で見る</text><text x="56" y="124" font-size="25" fill="#54738c" font-weight="400">オリエンタルランド｜数字ごとに『成長』が違う</text><text x="58" y="163" font-size="26" fill="#314e68" font-weight="600">比較する対象も年度も、明示しなければならない</text><rect x="52" y="193" width="856" height="269" rx="24" fill="#ffffff" stroke="#d9e4ee"/><text x="78" y="241" font-size="33" fill="#183752" font-weight="800">入園者数</text><text x="78" y="275" font-size="23" fill="#5c7288" font-weight="450">万人（年度）</text><text x="77" y="335" font-size="26" fill="#284257" font-weight="650">2018：3,256</text><rect x="275" y="301" width="536.2823529411764" height="41" rx="9" fill="#397da8" stroke="none"/><text x="77" y="396" font-size="26" fill="#284257" font-weight="650">2025：2,753</text><rect x="275" y="361" width="453.43529411764706" height="41" rx="9" fill="#397da8" stroke="none"/><text x="77" y="441" font-size="24" fill="#258679" font-weight="700">ピーク期より約15％少ない</text><rect x="52" y="496" width="856" height="269" rx="24" fill="#ffffff" stroke="#d9e4ee"/><text x="78" y="544" font-size="33" fill="#183752" font-weight="800">連結売上高</text><text x="78" y="578" font-size="23" fill="#5c7288" font-weight="450">億円（3月期）</text><text x="77" y="638" font-size="26" fill="#284257" font-weight="650">2025：6,794</text><rect x="275" y="604" width="507.2853333333333" height="41" rx="9" fill="#359b8b" stroke="none"/><text x="77" y="699" font-size="26" fill="#284257" font-weight="650">2026：7,045</text><rect x="275" y="664" width="526.0266666666666" height="41" rx="9" fill="#359b8b" stroke="none"/><text x="77" y="744" font-size="24" fill="#258679" font-weight="700">前期より増収・過去最高</text><rect x="52" y="799" width="856" height="269" rx="24" fill="#ffffff" stroke="#d9e4ee"/><text x="78" y="847" font-size="33" fill="#183752" font-weight="800">連結営業利益</text><text x="78" y="881" font-size="23" fill="#5c7288" font-weight="450">億円（3月期）</text><text x="77" y="941" font-size="26" fill="#284257" font-weight="650">2025：1,721</text><rect x="275" y="907" width="507.2421052631579" height="41" rx="9" fill="#ad6f49" stroke="none"/><text x="77" y="1002" font-size="26" fill="#284257" font-weight="650">2026：1,684</text><rect x="275" y="967" width="496.33684210526314" height="41" rx="9" fill="#ad6f49" stroke="none"/><text x="77" y="1047" font-size="24" fill="#ac5537" font-weight="700">売上は増えたが利益は減った</text><rect x="52" y="1111" width="856" height="79" rx="17" fill="#e6eff6" stroke="none"/><text x="72" y="1146" font-size="24" fill="#1d465f" font-weight="600">図表の注意：異なる単位を同じ目盛りに重ねない</text><text x="72" y="1178" font-size="22" fill="#345a74" font-weight="450">万人／億円は、それぞれ別の目盛りで表示</text><text x="55" y="1231" font-size="20" fill="#5f7389" font-weight="450">出典：オリエンタルランド公式 IR（数値は丸め表示）</text></svg>
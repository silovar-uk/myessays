<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-label="人的資本投資から価値創造までの論理を抽象化した独自の4段階図"><rect width="960" height="240" fill="#f8fafc"/><text x="30" y="38" font-family="sans-serif" font-size="23" fill="#172554">価値創造の論理を4段階で検証する（独自の抽象図）</text><g font-family="sans-serif" font-size="19" text-anchor="middle"><rect x="25" y="80" width="198" height="95" rx="12" fill="#dbeafe"/><text x="124" y="120">経営課題</text><text x="124" y="149" font-size="15">何を解くか</text><rect x="260" y="80" width="198" height="95" rx="12" fill="#ccfbf1"/><text x="359" y="120">人的資本施策</text><text x="359" y="149" font-size="15">何を変えるか</text><rect x="495" y="80" width="198" height="95" rx="12" fill="#d1fae5"/><text x="594" y="120">事業上の変化</text><text x="594" y="149" font-size="15">何が改善するか</text><rect x="730" y="80" width="205" height="95" rx="12" fill="#fef08a"/><text x="832" y="120">価値・成果</text><text x="832" y="149" font-size="15">何で確かめるか</text></g><g stroke="#334155" stroke-width="4" fill="none"><path d="M226 128h30m-10 -9 10 9-10 9M461 128h30m-10 -9 10 9-10 9M696 128h30m-10 -9 10 9-10 9"/></g><text x="30" y="216" font-family="sans-serif" font-size="15" fill="#475569">注：SmartHRの原図の転載ではなく、分析のために新規作成した構造図。矢印は実証済みの因果関係を意味しない。</text></svg>
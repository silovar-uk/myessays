<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="出典をスライド末尾にまとめる場合と根拠の直下に置く場合の比較"><rect width="1000" height="430" fill="#f4f7fb"/><text x="36" y="42" font-family="sans-serif" font-size="27" font-weight="bold" fill="#182d48">出典は根拠の近くに置く</text><rect x="35" y="72" width="445" height="310" rx="15" fill="white" stroke="#bcc9d8"/><rect x="520" y="72" width="445" height="310" rx="15" fill="white" stroke="#bcc9d8"/><text x="60" y="111" font-family="sans-serif" font-size="22" fill="#b33d3d">Before｜出典が遠い</text><text x="545" y="111" font-family="sans-serif" font-size="22" fill="#17674e">After｜根拠と出典が隣接</text><rect x="65" y="140" width="380" height="100" rx="8" fill="#dbe8f6"/><text x="83" y="179" font-family="sans-serif" font-size="22" fill="#1c3859">調査結果：回答者の60％</text><text x="83" y="213" font-family="sans-serif" font-size="17" fill="#1c3859">（架空データ）</text><rect x="550" y="140" width="380" height="100" rx="8" fill="#dbe8f6"/><text x="568" y="179" font-family="sans-serif" font-size="22" fill="#1c3859">調査結果：回答者の60％</text><text x="568" y="213" font-family="sans-serif" font-size="17" fill="#1c3859">（架空データ）</text><text x="65" y="350" font-family="sans-serif" font-size="16" fill="#58697b">出典：架空調査（遠くの脚注）</text><text x="550" y="272" font-family="sans-serif" font-size="17" fill="#17674e">出典：架空調査／対象・時点を明記</text><text x="550" y="308" font-family="sans-serif" font-size="16" fill="#58697b">根拠と同じ視線の流れで確認できる</text></svg>
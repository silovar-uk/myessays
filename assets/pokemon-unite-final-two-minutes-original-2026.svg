<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-label="10分間の試合時間のうち最後の2分間に得点が2倍になる仕組みを例示した独自図解"><rect width="1200" height="510" fill="#101b27"/><text x="65" y="69" font-family="sans-serif" fill="#f3f6f9" font-size="35" font-weight="bold">最後の2分で、得点の重みが変わる</text><rect x="60" y="111" width="854" height="90" rx="16" fill="#25445a"/><rect x="914" y="111" width="220" height="90" rx="16" fill="#c07833"/><text x="83" y="157" font-family="sans-serif" font-size="25" fill="#f4f8fb">序盤〜中盤：8分間</text><text x="949" y="157" font-family="sans-serif" font-size="25" fill="#fff9ef">終盤：2分間</text><text x="76" y="236" font-family="sans-serif" font-size="18" fill="#d5e3ed">経過 0分</text><text x="854" y="236" font-family="sans-serif" font-size="18" fill="#d5e3ed">8分</text><text x="1052" y="236" font-family="sans-serif" font-size="18" fill="#d5e3ed">10分</text><rect x="70" y="276" width="502" height="143" rx="16" fill="#1c3445"/><rect x="628" y="276" width="502" height="143" rx="16" fill="#5e3e24"/><text x="101" y="322" fill="#cae6fc" font-family="sans-serif" font-size="22">例：エナジー50をゴール</text><text x="104" y="378" fill="#ffffff" font-family="sans-serif" font-size="42" font-weight="bold">50点</text><text x="659" y="322" fill="#ffe0b4" font-family="sans-serif" font-size="22">同じ50を残り2分にゴール</text><text x="659" y="378" fill="#ffffff" font-family="sans-serif" font-size="42" font-weight="bold">100点</text><text x="70" y="470" fill="#afbfcc" font-family="sans-serif" font-size="18">模式例：両方ともゴールが成功した場合。残り2分の倍点は両チームに適用される。</text></svg>
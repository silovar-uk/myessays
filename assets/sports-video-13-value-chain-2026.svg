ont-family="Arial,sans-serif" fill="#53667b">分析を現場で使う</text><rect x="979" y="375" width="242" height="58" rx="13" fill="#fff" stroke="#d6e2ee"/><text x="991" y="412" font-size="24" font-family="Arial,sans-serif" fill="#1e344d" font-weight="600">SPLYZA</text><rect x="979" y="449" width="242" height="58" rx="13" fill="#fff" stroke="#d6e2ee"/><text x="991" y="486" font-size="24" font-family="Arial,sans-serif" fill="#1e344d" font-weight="600">BEPRO</text><rect x="979" y="523" width="242" height="58" rx="13" fill="#fff" stroke="#d6e2ee"/><text x="991" y="560" font-size="24" font-family="Arial,sans-serif" fill="#1e344d" font-weight="600">データスタジアム</text><path d="M1244 448 l8 0" stroke="#7290a7" stroke-width="3"/><path d="M1255 448 l-10 -8 v16 z" fill="#7290a7"/><rect x="1258" y="222" width="275" height="450" rx="20" fill="#f9fbff" stroke="#d4e1ef" stroke-width="2"/><rect x="1258" y="222" width="275" height="16" rx="8" fill="#a87639"/><text x="1278" y="295" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#172c45">05　育てる</text><text x="1278" y="339" font-size="20" font-family="Arial,sans-serif" fill="#53667b">結果と履歴をつなぐ</text><rect x="1274" y="375" width="242" height="58" rx="13" fill="#fff" stroke="#d6e2ee"/><text x="1286" y="412" font-size="24" font-family="Arial,sans-serif" fill="#1e344d" font-weight="600">iDEP</text><rect x="1274" y="449" width="242" height="58" rx="13" fill="#fff" stroke="#d6e2ee"/><text x="1286" y="486" font-size="24" font-family="Arial,sans-serif" fill="#1e344d" font-weight="600">Kitman Labs</text><text x="78" y="776" font-size="29" font-family="Arial,sans-serif" font-weight="700" fill="#194e8d">解釈：自動化は「分析の仕事」を消すより、次の工程へ重心を移動させることがある。</text><text x="80" y="829" font-size="19" font-family="Arial,sans-serif" fill="#5e7386">出典：各社公式沿革・サービス説明を基に筆者作成｜売上構成・競争順位・機能網羅を示すものではない</text></svg>
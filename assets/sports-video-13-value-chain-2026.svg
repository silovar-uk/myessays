<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="映像の価値は「撮れた」だけで終わらない"><rect width="1600" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1600" height="16" fill="#1454a2"/><text x="78" y="92" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#15283f">映像の価値は「撮れた」だけで終わらない</text><text x="80" y="143" font-family="Arial, sans-serif" font-size="23" fill="#486079">競技現場の仕事を5工程に分解。名称は代表的な関連領域への概念的配置。</text><rect x="55" y="183" width="1490" height="539" rx="24" fill="#fff" stroke="#dfe8f3" stroke-width="2"/><rect x="78" y="222" width="275" height="450" rx="20" fill="#f9fbff" stroke="#d4e1ef" stroke-width="2"/><rect x="78" y="222" width="275" height="16" rx="8" fill="#235ea1"/><text x="98" y="295" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#172c45">01　撮る</text><text x="98" y="339" font-size="20" font-family="Arial,sans-serif" fill="#53667b">撮影係がいなくても残る</text><rect x="94" y="375" width="242" height="58" rx="13" fill="#fff" stroke="#d6e2ee"/><text x="106" y="412" font-size="24" font-family="Arial,sans-serif" fill="#1e344d" font-weight="600">Veo</text><rect x="94" y="449" width="242" height="58" rx="13" fill="#fff" stroke="#d6e2ee"/><text x="106" y="486" font-size="24" font-family="Arial,sans-serif" fill="#1e344d" font-weight="600">Spiideo</text><path d="M359 448 l8 0" stroke="#7290a7" stroke-width="3"/><path d="M370 448 l-10 -8 v16 z" fill="#7290a7"/><rect x="373" y="222" width="275" height="450" rx="20" fill="#f9fbff" stroke="#d4e1ef" stroke-width="2"/><rect x="373" y="222" width="275" height="16" rx="8" fill="#1c7e99"/><text x="393" y="295" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#172c45">02　探す・切る</text><text x="393" y="339" font-size="20" font-family="Arial,sans-serif" fill="#53667b">見たい場面へ早く着く</text><rect x="389" y="375" width="242" height="58" rx="13" fill="#fff" stroke="#d6e2ee"/><text x="401" y="412" font-size="24" font-family="
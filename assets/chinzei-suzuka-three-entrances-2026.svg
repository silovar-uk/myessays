<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="t d"><title id="t">鎮西寿々歌の三つの入口</title><desc id="d">2009年のてれび戦士、2022年のアイドル、2026年の映画単独主演。始め直しが表現の範囲を広げたことを示す時系列図。</desc><rect width="1200" height="550" rx="24" fill="#171721"/><text x="64" y="82" font-family="sans-serif" font-size="28" font-weight="bold" fill="#fff">ひとりのキャリアに、入口は一つとは限らない</text><text x="65" y="121" font-family="sans-serif" font-size="16" fill="#c8c6d0">2009 → 2022 → 2026　／　参加から選択へ、選択から再挑戦へ</text><path d="M132 315H1084" stroke="#e9b66b" stroke-width="4" stroke-dasharray="7 10"/><g font-family="sans-serif"><g transform="translate(68 173)"><rect width="330" height="270" rx="21" fill="#292935"/><circle cx="58" cy="143" r="16" fill="#eaa33c"/><text x="28" y="54" font-size="37" font-weight="bold" fill="#f6a73d">2009</text><text x="28" y="99" font-size="21" font-weight="bold" fill="#fff">番組から始まる</text><text x="28" y="179" font-size="20" fill="#f6f4f5">『天才てれびくんMAX』</text><text x="28" y="217" font-size="16" fill="#c9c7d2">子ども時代の出演経験</text></g><g transform="translate(435 173)"><rect width="330" height="270" rx="21" fill="#30303b"/><circle cx="58" cy="143" r="16" fill="#eaa33c"/><text x="28" y="54" font-size="37" font-weight="bold" fill="#f6a73d">2022</text><text x="28" y="99" font-size="21" font-weight="bold" fill="#fff">自分で選んで始める</text><text x="28" y="179" font-size="19" fill="#f6f4f5">フルーツジッパー</text><text x="28" y="217" font-size="16" fill="#c9c7d2">歌とダンスへの復帰</text></g><g transform="translate(802 173)"><rect width="330" height="270" rx="21" fill="#292935"/><circle cx="58" cy="143" r="16" fill="#eaa33c"/><text x="28" y="54" font-size="37" font-weight="bold" fill="#f6a73d">2026</text><text x="28" y="99" font-size="21" font-weight="bold" fill="#fff">避けていた表現に戻る</text><text x="28" y="179" font-size="19" fill="#f6f4f5">ホラー映画単独初主演</text><text x="28" y="217" font-size="16" fill="#c9c7d2">演技への再挑戦</text></g></g><text x="64" y="496" font-family="sans-serif" font-size="15" fill="#c6c3ca">資料：本人プロフィール、TOKYO FM、映画.com。図の「入口」は筆者の整理。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><rect width="1200" height="290" fill="#f8fafc"/><text x="42" y="48" fill="#152d49" font-size="29" font-family="sans-serif" font-weight="700">「おいしい一皿」の前に、六つの仕事がある</text><text x="42" y="82" fill="#56657a" font-size="16" font-family="sans-serif">代表・クラブ遠征における食事提供を構造化した独自模式図</text><g font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#173451"><rect x="38" y="124" width="176" height="95" rx="14" fill="#dce8f4"/><text x="126" y="162">① 栄養計画</text><text x="126" y="194" font-size="13" font-weight="400">必要量を考える</text><rect x="236" y="124" width="176" height="95" rx="14" fill="#dce8f4"/><text x="324" y="162">② 食材調達</text><text x="324" y="194" font-size="13" font-weight="400">現地で確保する</text><rect x="434" y="124" width="176" height="95" rx="14" fill="#dce8f4"/><text x="522" y="162">③ ホテル調整</text><text x="522" y="194" font-size="13" font-weight="400">厨房と交渉する</text><rect x="632" y="124" width="176" height="95" rx="14" fill="#dce8f4"/><text x="720" y="162">④ 調理・衛生</text><text x="720" y="194" font-size="13" font-weight="400">安全に提供する</text><rect x="830" y="124" width="176" height="95" rx="14" fill="#1c4876"/><text x="918" y="162" fill="#fff">⑤ 食欲・摂取</text><text x="918" y="194" font-size="13" font-weight="400" fill="#fff">実際に食べる</text><rect x="1028" y="124" width="145" height="95" rx="14" fill="#dce8f4"/><text x="1100" y="162" font-size="16">⑥ 次の移動</text><text x="1100" y="194" font-size="12" font-weight="400">時間を守る</text></g><path d="M214 173H236 M412 173H434 M610 173H632 M808 173H830 M1006 173H1028" stroke="#5f7690" stroke-width="3"/><text x="42" y="265" fill="#52657b" font-size="16" font-family="sans-serif">食事の「提供量」と選手の「実際の摂取量」は同じではない</text></svg>
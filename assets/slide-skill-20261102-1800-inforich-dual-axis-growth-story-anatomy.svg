<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="810" viewBox="0 0 1160 810" role="img" aria-labelledby="t d"><title id="t">INFORICH成長グラフの4層構造</title><desc id="d">棒で設置台数、線で台あたりレンタル、上に施策、下に成長段階を置いた原典8ページの独自抽象図。値は再現していない。</desc><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif}</style><rect x="0" y="0" width="1160" height="810" rx="0" fill="#F5F8FC" stroke="none"/><rect x="0" y="0" width="1160" height="12" rx="0" fill="#0C849D" stroke="none"/><text x="60" y="65" font-size="24" font-weight="750" fill="#11778C">SLIDE ANATOMY  /  INFORICH 2025  p.8</text><text x="60" y="122" font-size="42" font-weight="800" fill="#152C42">成長の「量」と「効率」を同時に読む</text><text x="60" y="162" font-size="22" font-weight="500" fill="#64788B">※原典の情報設計を抽象化。棒・線の高さは実測値ではない。</text><rect x="58" y="196" width="1044" height="490" rx="20" fill="#FFFFFF" stroke="#DBE5EE"/><text x="85" y="238" font-size="24" font-weight="750" fill="#C27C2B">③ 施策・出来事の注釈</text><rect x="340" y="216" width="184" height="49" rx="8" fill="#FFF1DD" stroke="none"/><text x="360" y="248" font-size="23" font-weight="700" fill="#9E661C">鉄道への展開</text><rect x="646" y="216" width="190" height="49" rx="8" fill="#FFF1DD" stroke="none"/><text x="664" y="248" font-size="23" font-weight="700" fill="#9E661C">コンビニ展開</text><path d="M 430 265 V 332 M 744 265 V 332" stroke="#B77C36" stroke-width="2" stroke-dasharray="5 5"/><text x="85" y="312" font-size="22" font-weight="700" fill="#118EAD">① 棒＝設置台数（左軸）</text><text x="820" y="312" font-size="20" font-weight="700" fill="#243B51">② 線＝台あたりレンタル（右軸）</text><rect x="130" y="542" width="50" height="55" rx="3" fill="#9FDCE8" stroke="none"/><rect x="207" y="525" width="50" height="72" rx="3" fill="#9FDCE8" stroke="none"/><rect x="284" y="501" width="50" height="96" rx="3" fill="#9FDCE8" stroke="none"/><rect x="361" y="477" width="50" height="120" rx="3" fill="#9FDCE8" stroke="none"/><rect x="438" y="453" width="50" height="144" rx="3" fill="#9FDCE8" stroke="none"/><rect x="515" y="426" width="50" height="171" rx="3" fill="#18B3D4" stroke="none"/><rect x="592" y="397" width="50" height="200" rx="3" fill="#18B3D4" stroke="none"/><rect x="669" y="377" width="50" height="220" rx="3" fill="#18B3D4" stroke="none"/><rect x="746" y="352" width="50" height="245" rx="3" fill="#18B3D4" stroke="none"/><rect x="823" y="330" width="50" height="267" rx="3" fill="#18B3D4" stroke="none"/><rect x="900" y="303" width="50" height="294" rx="3" fill="#18B3D4" stroke="none"/><rect x="977" y="286" width="50" height="311" rx="3" fill="#18B3D4" stroke="none"/><polyline points="155,585 232,575 309,567 386,550 463,557 540,527 617,507 694,492 771,475 848,462 925,438 1002,416" fill="none" stroke="#152A3F" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M 105 597 H 1083" stroke="#7F97A9" stroke-width="2"/><text x="112" y="634" font-size="23" font-weight="650" fill="#51677A">2018</text><text x="1003" y="634" font-size="23" font-weight="650" fill="#51677A">2024</text><text x="85" y="674" font-size="22" font-weight="700" fill="#64788B">④ 期間帯（成長局面）</text><rect x="58" y="704" width="340" height="55" rx="4" fill="#C8D8E4" stroke="none"/><rect x="403" y="704" width="340" height="55" rx="4" fill="#B7CEDD" stroke="none"/><rect x="748" y="704" width="354" height="55" rx="4" fill="#9DBED1" stroke="none"/><text x="118" y="739" font-size="25" font-weight="750" fill="#19364A">設置拡大期</text><text x="428" y="739" font-size="24" font-weight="750" fill="#19364A">設置プロトコルの精査期</text><text x="860" y="739" font-size="25" font-weight="750" fill="#19364A">再拡大期</text><text x="58" y="790" font-size="20" font-weight="500" fill="#63788C">出典：INFORICH中期経営計画（2025年3月31日）p.8 を参照した独自模式図</text></svg>
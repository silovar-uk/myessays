<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" fill="#f7fafc"/><text x="44" y="54" font-size="27" font-weight="bold" fill="#132b45">金利変更は、企業の投資判断に直接届くわけではない</text><text x="44" y="87" font-size="17" fill="#475569">金融政策の波及経路｜概念図・効果の大きさは示さない</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><rect x="36" y="150" width="195" height="112" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="133" y="194" fill="#1e3a8a">政策金利</text><text x="133" y="225" font-size="17" fill="#1e3a8a">9月：1.0→1.25％</text><rect x="278" y="150" width="195" height="112" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="375" y="194" fill="#075985">市場・貸出金利</text><text x="375" y="225" font-size="16" fill="#075985">銀行の審査・条件</text><rect x="520" y="150" width="195" height="112" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="617" y="194" fill="#92400e">企業の資金調達</text><text x="617" y="225" font-size="16" fill="#92400e">返済額・資金余力</text><rect x="762" y="150" width="166" height="112" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="845" y="194" fill="#166534">設備投資</text><text x="845" y="225" font-size="16" fill="#166534">採算・需要</text></g><g fill="#334155"><path d="M237 203h34l-10-8v16l10-8" stroke="#334155" stroke-width="3" fill="none"/><path d="M479 203h34l-10-8v16l10-8" stroke="#334155" stroke-width="3" fill="none"/><path d="M721 203h34l-10-8v16l10-8" stroke="#334155" stroke-width="3" fill="none"/></g><text x="45" y="333" font-family="sans-serif" font-size="19" fill="#334155">注：政策金利の上昇幅＝個々の企業の借入金利の上昇幅、ではない。</text><text x="45" y="368" font-family="sans-serif" font-size="16" fill="#64748b">出典：日本銀行 2026年11月5日公表議事要旨を基に独自作成</text></svg>
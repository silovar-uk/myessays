<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" width="1200" height="505"><style>text{font-family:Arial,'Noto Sans JP','Yu Gothic',sans-serif}</style><rect width="1200" height="505" fill="#f7f5ef"/><text x="45" y="64" fill="#172536" font-size="35" font-weight="750">予測の「70％」を、結果と照合する</text><rect x="43" y="119" width="460" height="305" rx="22" fill="#fff"/><rect x="531" y="119" width="625" height="305" rx="22" fill="#fff"/><text x="72" y="181" fill="#5a6a78" font-size="22" font-weight="500">事前に表明した確率</text><text x="85" y="339" fill="#3568bb" font-size="109" font-weight="800">70%</text><text x="563" y="184" fill="#172536" font-size="22" font-weight="700">仮想例：10日中7日で雨が降る</text><circle cx="591" cy="272" r="19" fill="#3568bb"/><circle cx="642" cy="272" r="19" fill="#3568bb"/><circle cx="693" cy="272" r="19" fill="#3568bb"/><circle cx="744" cy="272" r="19" fill="#3568bb"/><circle cx="795" cy="272" r="19" fill="#3568bb"/><circle cx="846" cy="272" r="19" fill="#3568bb"/><circle cx="897" cy="272" r="19" fill="#3568bb"/><circle cx="948" cy="272" r="19" fill="#cdd5d9"/><circle cx="999" cy="272" r="19" fill="#cdd5d9"/><circle cx="1050" cy="272" r="19" fill="#cdd5d9"/><text x="560" y="367" fill="#3568bb" font-size="46" font-weight="750">7 / 10 ＝ 70%</text><text x="44" y="474" fill="#5a6a78" font-size="18" font-weight="500">架空の例：10件だけでは適切な校正の証拠にならない。多数の比較可能な予報が必要。</text></svg>

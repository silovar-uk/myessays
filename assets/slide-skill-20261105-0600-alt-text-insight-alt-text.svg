<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="悪い代替テキストは図の形だけを述べ、良い代替テキストは架空の売上推移の結論を述べる比較"><rect width="1100" height="420" fill="#f7f9fc"/><text x="45" y="55" font-family="sans-serif" font-size="29" font-weight="bold" fill="#15243a">図の説明ではなく、図から分かることを書く</text><rect x="35" y="90" width="500" height="290" rx="18" fill="white" stroke="#ccd4df"/><rect x="565" y="90" width="500" height="290" rx="18" fill="white" stroke="#ccd4df"/><text x="60" y="132" font-size="25" font-family="sans-serif" fill="#a33">Before｜形だけ</text><text x="590" y="132" font-size="25" font-family="sans-serif" fill="#08714b">After｜意味まで</text><g fill="#5476ac"><rect x="85" y="205" width="65" height="110"/><rect x="175" y="175" width="65" height="140"/><rect x="265" y="145" width="65" height="170"/></g><g fill="#5476ac"><rect x="615" y="205" width="65" height="110"/><rect x="705" y="175" width="65" height="140"/><rect x="795" y="145" width="65" height="170"/></g><text x="65" y="350" font-family="sans-serif" font-size="20" fill="#344">「棒グラフが3本ある」</text><text x="590" y="345" font-family="sans-serif" font-size="19" fill="#344">「架空売上は1月→3月で増加」</text><text x="590" y="371" font-family="sans-serif" font-size="16" fill="#667">※概念図・数値を表す棒ではない</text></svg>
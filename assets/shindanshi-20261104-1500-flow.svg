<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270"><rect width="1000" height="270" fill="#f6f8fb"/><text x="40" y="45" font-size="25" font-family="sans-serif" fill="#152b43">発注後の控除を発見する照合経路</text><rect x="30" y="95" width="210" height="88" rx="12" fill="#dbeafe" stroke="#4577a6"/><text x="42" y="145" font-family="sans-serif" font-size="19">発注時の約束額</text><text x="241" y="145" font-size="28">→</text><rect x="275" y="95" width="210" height="88" rx="12" fill="#dbeafe" stroke="#4577a6"/><text x="287" y="145" font-family="sans-serif" font-size="19">検収・請求</text><text x="486" y="145" font-size="28">→</text><rect x="520" y="95" width="210" height="88" rx="12" fill="#dbeafe" stroke="#4577a6"/><text x="532" y="145" font-family="sans-serif" font-size="19">支払明細</text><text x="731" y="145" font-size="28">→</text><rect x="765" y="95" width="210" height="88" rx="12" fill="#ffe5c8" stroke="#4577a6"/><text x="777" y="145" font-family="sans-serif" font-size="19">差異の理由を確認</text><text x="35" y="232" font-size="17" font-family="sans-serif">読み方：控除名目ではなく、発注時の額との差を起点に検証する（概念図）。</text></svg>
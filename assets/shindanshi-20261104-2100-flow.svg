<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" fill="#f5f8fc"/><text x="50" y="65" font-family="sans-serif" font-size="34" font-weight="bold" fill="#16263b">投資の前に、課題を診断する</text><rect x="50" y="150" width="255" height="150" rx="18" fill="#dce7f5" stroke="#6984a2"/><text x="70" y="225" font-family="sans-serif" font-size="26" fill="#16263b">工程を観測</text><text x="310" y="225" font-size="32">→</text><rect x="340" y="150" width="255" height="150" rx="18" fill="#dce7f5" stroke="#6984a2"/><text x="360" y="225" font-family="sans-serif" font-size="26" fill="#16263b">制約を特定</text><text x="600" y="225" font-size="32">→</text><rect x="630" y="150" width="255" height="150" rx="18" fill="#dcefe5" stroke="#6984a2"/><text x="650" y="225" font-family="sans-serif" font-size="26" fill="#16263b">代替策を比較</text><text x="890" y="225" font-size="32">→</text><rect x="920" y="150" width="255" height="150" rx="18" fill="#dce7f5" stroke="#6984a2"/><text x="940" y="225" font-family="sans-serif" font-size="26" fill="#16263b">採算を検証</text><text x="50" y="395" font-family="sans-serif" font-size="23" fill="#344b66">資料：中小機構の制度目的を基にした独自整理。数値がある場合は説明用の仮定。</text></svg>
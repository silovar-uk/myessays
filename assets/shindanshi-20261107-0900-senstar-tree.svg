<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440"><rect width="960" height="440" fill="#f8fafc"/><text x="36" y="45" font-size="25" font-family="sans-serif">粗利益率が低下したときの診断順序</text><rect x="140" y="75" width="680" height="62" rx="12" fill="#e2e8f0"/><text x="170" y="115" font-size="23" font-family="sans-serif">① 売上総利益額は増えたか</text><text x="470" y="158" font-size="22">↓</text><rect x="140" y="163" width="680" height="62" rx="12" fill="#e2e8f0"/><text x="170" y="203" font-size="23" font-family="sans-serif">② 追加営業費用を吸収したか</text><text x="470" y="246" font-size="22">↓</text><rect x="140" y="251" width="680" height="62" rx="12" fill="#e2e8f0"/><text x="170" y="291" font-size="23" font-family="sans-serif">③ 費用と収益は翌期も続くか</text><text x="470" y="334" font-size="22">↓</text><rect x="140" y="339" width="680" height="62" rx="12" fill="#dbeafe"/><text x="170" y="379" font-size="23" font-family="sans-serif">④ 商品別の採算と投資回収を判断</text></svg>
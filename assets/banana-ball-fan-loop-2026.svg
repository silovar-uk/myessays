<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Banana Ballの事業構造、観客接点から有料需要と再来場につなげる循環">
<rect width="1200" height="620" fill="#101923"/><text x="60" y="65" font-size="36" font-weight="700" fill="#fff9d9" font-family="Arial,sans-serif">WHAT IS BANANA BALL ACTUALLY SELLING?</text><text x="60" y="100" font-size="21" fill="#bed0d6" font-family="Arial,sans-serif">「野球の試合」から「何度も参加したくなるショー」への拡張</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="50" y="158" width="245" height="155" rx="22" fill="#284e5e"/><text x="172" y="201" fill="#fff" font-size="25" font-weight="700">01  動画</text><text x="172" y="238" fill="#d5edf5" font-size="18">TikTok / YouTube</text><text x="172" y="273" fill="#d5edf5" font-size="18">来場前に物語と顔を知る</text>
<rect x="335" y="158" width="245" height="155" rx="22" fill="#31545b"/><text x="457" y="201" fill="#fff" font-size="25" font-weight="700">02  需要</text><text x="457" y="238" fill="#d5edf5" font-size="18">抽選・定価再販</text><text x="457" y="273" fill="#d5edf5" font-size="18">入口を自前で設計</text>
<rect x="620" y="158" width="245" height="155" rx="22" fill="#6d6237"/><text x="742" y="201" fill="#fff" font-size="25" font-weight="700">03  現場</text><text x="742" y="238" fill="#fff0c3" font-size="18">2時間＋演出＋参加</text><text x="742" y="273" fill="#fff0c3" font-size="18">誰が勝つかは未定</text>
<rect x="905" y="158" width="245" height="155" rx="22" fill="#624761"/><text x="1027" y="201" fill="#fff" font-size="25" font-weight="700">04  再拡散</text><text x="1027" y="238" fill="#ffe6ff" font-size="18">切り抜き・配信・口コミ</text><text x="1027" y="273" fill="#ffe6ff" font-size="18">新しい観客が次の入口へ</text>
<g fill="#f9d447" font-size="39" font-weight="700"><text x="316" y="242">›</text><text x="602" y="242">›</text><text x="885" y="242">›</text></g>
<path d="M1030 344 V388 H171 V344" fill="none" stroke="#f9d447" stroke-width="4" stroke-dasharray="12 10"/><text x="600" y="420" fill="#ffe381" font-size="19">ショーで作った接点が、次のショーの需要をつくる（分析仮説）</text>
</g><rect x="72" y="465" width="1055" height="94" rx="22" fill="#21343f" stroke="#68818e"/><text x="95" y="503" fill="#fff" font-size="24" font-family="Arial,sans-serif" font-weight="700">検証すべき指標</text><text x="95" y="537" fill="#c6dbe5" font-size="19" font-family="Arial,sans-serif">実来場率 × 初回来場比率 × 満足度 × 再購入意向 × チケット粗利 × 公平性</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f4f1ea"/><g font-family="Arial" fill="#171717"><text x="600" y="74" text-anchor="middle" font-size="36">STATE CONTRACT</text><text x="600" y="112" text-anchor="middle" font-size="20">Define behavior, not only appearance.</text><g font-size="25"><rect x="90" y="190" width="240" height="260" rx="22" fill="white" stroke="#111"/><text x="210" y="245" text-anchor="middle">ENTRY</text><text x="210" y="310" text-anchor="middle" font-size="20">What puts us here?</text><rect x="380" y="190" width="240" height="260" rx="22" fill="white" stroke="#111"/><text x="500" y="245" text-anchor="middle">BEHAVIOR</text><text x="500" y="310" text-anchor="middle" font-size="20">What is possible?</text><rect x="670" y="190" width="240" height="260" rx="22" fill="white" stroke="#111"/><text x="790" y="245" text-anchor="middle">FEEDBACK</text><text x="790" y="310" text-anchor="middle" font-size="20">What is perceived?</text><rect x="960" y="190" width="150" height="260" rx="22" fill="white" stroke="#111"/><text x="1035" y="245" text-anchor="middle">EXIT</text><text x="1035" y="310" text-anchor="middle" font-size="20">What ends it?</text></g><text x="600" y="550" text-anchor="middle" font-size="28">If one box is unknown, the interaction is unfinished.</text></g></svg>
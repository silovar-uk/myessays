<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f4f1ea"/><g font-family="Arial" fill="#171717"><text x="600" y="72" text-anchor="middle" font-size="34">FROM VARIANTS TO TIME</text><text x="250" y="160" text-anchor="middle" font-size="26">STATIC VARIANTS</text><rect x="90" y="215" width="320" height="70" rx="16" fill="white" stroke="#111"/><text x="250" y="260" text-anchor="middle" font-size="23">DEFAULT / HOVER / PRESSED</text><rect x="90" y="315" width="320" height="70" rx="16" fill="white" stroke="#111"/><text x="250" y="360" text-anchor="middle" font-size="23">DISABLED / LOADING</text><text x="600" y="310" text-anchor="middle" font-size="48">→</text><text x="900" y="160" text-anchor="middle" font-size="26">STATE MACHINE</text><g font-size="20"><rect x="760" y="210" width="280" height="58" rx="14" fill="white" stroke="#111"/><text x="900" y="247" text-anchor="middle">DEFAULT</text><rect x="760" y="315" width="280" height="58" rx="14" fill="white" stroke="#111"/><text x="900" y="352" text-anchor="middle">LOADING</text><rect x="650" y="430" width="210" height="58" rx="14" fill="white" stroke="#111"/><text x="755" y="467" text-anchor="middle">SUCCESS</text><rect x="940" y="430" width="210" height="58" rx="14" fill="white" stroke="#111"/><text x="1045" y="467" text-anchor="middle">ERROR</text></g><path d="M900 268 V315" stroke="#111" stroke-width="3" marker-end="url(#a)"/><path d="M865 373 L785 430" stroke="#111" stroke-width="3" marker-end="url(#a)"/><path d="M935 373 L1015 430" stroke="#111" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="600" y="590" text-anchor="middle" font-size="28">A component is not only a set of pictures. It is a sequence of possible futures.</text></g></svg>
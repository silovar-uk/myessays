<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f4f1ea"/><g font-family="Arial" fill="#171717"><text x="600" y="72" text-anchor="middle" font-size="34">GRAMMAR GAINS A TIME AXIS</text><rect x="100" y="165" width="430" height="340" rx="24" fill="white" stroke="#111"/><text x="315" y="225" text-anchor="middle" font-size="29">VISUAL GRAMMAR</text><text x="315" y="290" text-anchor="middle" font-size="22">type ↔ color</text><text x="315" y="335" text-anchor="middle" font-size="22">space ↔ hierarchy</text><text x="315" y="380" text-anchor="middle" font-size="22">image ↔ layout</text><text x="315" y="445" text-anchor="middle" font-size="20">relationships in space</text><rect x="670" y="165" width="430" height="340" rx="24" fill="white" stroke="#111"/><text x="885" y="225" text-anchor="middle" font-size="29">BEHAVIORAL GRAMMAR</text><text x="885" y="290" text-anchor="middle" font-size="22">default → pressed</text><text x="885" y="335" text-anchor="middle" font-size="22">loading → success</text><text x="885" y="380" text-anchor="middle" font-size="22">error → retry</text><text x="885" y="445" text-anchor="middle" font-size="20">relationships in time</text><text x="600" y="590" text-anchor="middle" font-size="28">Design is not only where things are. It is also how they change.</text></g></svg>
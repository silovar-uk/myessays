<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">現場と本場を往復する学習の循環</title><desc id="desc">現場の観察から、本場の比較、仮説形成、小さな実験、再訪問へと学習の循環が続く。</desc><rect width="1200" height="675" rx="22" fill="#f6f7f2"/><path d="M0 0h1200v14H0z" fill="#192f4b"/><text x="62" y="90" font-family="Arial,'Noto Sans JP',sans-serif" font-size="43" fill="#20354c" font-weight="700">現場と本場を往復すると、問いが変わる。</text><text x="66" y="127" fill="#5b6979" font-family="Arial,sans-serif" font-size="20">LEARN BY MOVING • RETURN WITH EVIDENCE</text><path d="M188 307H1020" fill="none" stroke="#bacac5" stroke-width="7" stroke-linecap="round"/><polygon points="1006,291 1034,307 1006,323" fill="#bacac5"/><rect x="75" y="218" width="257" height="190" rx="24" fill="#14675d"/><text x="106" y="271" font-family="Arial,'Noto Sans JP',sans-serif" font-size="23" fill="#b4fff1">01 / FIELD</text><text x="106" y="326" font-family="Arial,'Noto Sans JP',sans-serif" font-size="43" font-weight="700" fill="#fff">現場</text><text x="106" y="365" font-family="Arial,'Noto Sans JP',sans-serif" font-size="21" fill="#e4fbf2">誰が何に困る？</text><rect x="375" y="218" width="255" height="190" rx="24" fill="#355887"/><text x="406" y="271" font-family="Arial,sans-serif" font-size="23" fill="#c8ddfb">02 / EPICENTER</text><text x="406" y="326" font-family="Arial,'Noto Sans JP',sans-serif" font-size="43" font-weight="700" fill="#fff">本場</text><text x="406" y="365" font-family="Arial,'Noto Sans JP',sans-serif" font-size="21" fill="#edf5ff">優れた基準は？</text><rect x="674" y="218" width="210" height="190" rx="24" fill="#544b81"/><text x="704" y="271" font-family="Arial,sans-serif" font-size="22" fill="#dcd4ff">03 / HYPOTHESIS</text><text x="704" y="326" font-family="Arial,'Noto Sans JP',sans-serif" font-size="43" font-weight="700" fill="#fff">仮説</text><text x="704" y="365" font-family="Arial,'Noto Sans JP',sans-serif" font-size="19" fill="#f3ecff">何を変える？</text><rect x="926" y="218" width="207" height="190" rx="24" fill="#a06a32"/><text x="954" y="271" font-family="Arial,sans-serif" font-size="22" fill="#fff0c7">04 / TEST</text><text x="954" y="326" font-family="Arial,'Noto Sans JP',sans-serif" font-size="43" font-weight="700" fill="#fff">試す</text><text x="954" y="365" font-family="Arial,'Noto Sans JP',sans-serif" font-size="19" fill="#ffefd9">本当に効く？</text><path d="M1031 414V492Q1031 518 999 518H195Q164 518 164 487V414" fill="none" stroke="#83aa9f" stroke-width="5" stroke-dasharray="10 12"/><polygon points="150,433 164,405 178,433" fill="#83aa9f"/><text x="605" y="492" fill="#355b56" font-family="Arial,'Noto Sans JP',sans-serif" font-size="25" font-weight="700" text-anchor="middle">学んだら、再び現場へ戻る</text><rect x="240" y="561" width="720" height="67" rx="18" fill="#e2ebe8"/><text x="600" y="603" font-family="Arial,'Noto Sans JP',sans-serif" text-anchor="middle" fill="#20394a" font-size="26" font-weight="700">観察 → 比較 → 解釈 → 小さく検証 → 更新</text></svg>
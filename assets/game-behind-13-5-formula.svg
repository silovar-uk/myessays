<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="#f4f1ea"/>
<text x="70" y="82" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#171717">HOW 13.5 GAMES BEHIND IS MADE</text>
<text x="70" y="125" font-family="system-ui,sans-serif" font-size="22" fill="#555">SoftBank 91–47 vs Seibu 77–60</text>
<rect x="80" y="190" width="430" height="130" rx="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="115" y="235" font-family="system-ui,sans-serif" font-size="24" fill="#555">WIN GAP</text>
<text x="115" y="295" font-family="system-ui,sans-serif" font-size="48" font-weight="800" fill="#171717">91 − 77 = 14</text>
<rect x="690" y="190" width="430" height="130" rx="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="725" y="235" font-family="system-ui,sans-serif" font-size="24" fill="#555">LOSS GAP</text>
<text x="725" y="295" font-family="system-ui,sans-serif" font-size="48" font-weight="800" fill="#171717">60 − 47 = 13</text>
<text x="545" y="275" font-family="system-ui,sans-serif" font-size="54" font-weight="700" fill="#777">+</text>
<line x1="220" y1="375" x2="980" y2="375" stroke="#888" stroke-width="2"/>
<text x="325" y="440" font-family="system-ui,sans-serif" font-size="38" fill="#333">(14 + 13) ÷ 2</text>
<text x="710" y="440" font-family="system-ui,sans-serif" font-size="38" font-weight="800" fill="#171717">= 13.5</text>
<text x="180" y="535" font-family="system-ui,sans-serif" font-size="25" fill="#444">勝数の差だけでなく、敗数の差も合わせて「試合ぶんの距離」にする。</text>
</svg>
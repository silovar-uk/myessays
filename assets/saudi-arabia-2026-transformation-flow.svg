<text x="92" y="605" fill="#b4cbd0" font-size="20" font-family="Noto Sans JP, sans-serif">主な根拠：IMF 2026年対サウジ報告、財務省2027年度予算事前資料、政府系ファンド2026–2030戦略</text>

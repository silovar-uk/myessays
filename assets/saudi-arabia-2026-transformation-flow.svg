<rect width="1280" height="720" fill="url(#bg)"/><text x="60" y="72" fill="#f7f8ef" font-size="40" font-weight="700" font-family="Noto Sans JP, sans-serif">石油の利益を、石油以外の持続的な稼ぐ力へ</text><text x="60" y="112" fill="#b2c9ca" font-size="22" font-family="Noto Sans JP, sans-serif">国家変革の資金循環と、途中で生じる制約｜概念図・実測値ではない</text>

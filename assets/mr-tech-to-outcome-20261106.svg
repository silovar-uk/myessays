<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">MRの技術・体験・事業価値を混同しない</title><desc id="d">現実の空間を測る、空間にひも付ける、反応する体験を作る、判断や行動の変化を測るという階層を示す。</desc>
<rect width="960" height="420" rx="22" fill="#f5f7fb"/><text x="45" y="46" fill="#183154" font-size="25" font-weight="700" font-family="sans-serif">CGを見せるだけなら、MRでなくてもできる</text><text x="45" y="73" fill="#59697d" font-size="16" font-family="sans-serif">重要なのは「空間の認識」から「行動の変化」までのどこに価値があるか</text>
<g font-family="sans-serif">
<rect x="44" y="109" width="194" height="153" rx="16" fill="#e1f3f0" stroke="#0e9287"/><text x="141" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#11645e">① 現実を測る</text><text x="141" y="178" text-anchor="middle" font-size="15" fill="#11645e">位置・姿勢・形状</text><text x="141" y="202" text-anchor="middle" font-size="15" fill="#11645e">カメラ・深度センサー</text><text x="141" y="226" text-anchor="middle" font-size="15" fill="#11645e">自己位置推定</text>
<rect x="270" y="109" width="194" height="153" rx="16" fill="#e1edf9" stroke="#4c84b2"/><text x="367" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#234f77">② 空間に置く</text><text x="367" y="178" text-anchor="middle" font-size="15" fill="#234f77">空間アンカー</text><text x="367" y="202" text-anchor="middle" font-size="15" fill="#234f77">遮蔽・位置合わせ</text><text x="367" y="226" text-anchor="middle" font-size="15" fill="#234f77">立体描画</text>
<rect x="496" y="109" width="194" height="153" rx="16" fill="#ede8f9" stroke="#8561bd"/><text x="593" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#523e8d">③ 操作する</text><text x="593" y="178" text-anchor="middle" font-size="15" fill="#523e8d">視線・手・音声</text><text x="593" y="202" text-anchor="middle" font-size="15" fill="#523e8d">身体・現実物体との</text><text x="593" y="226" text-anchor="middle" font-size="15" fill="#523e8d">相互作用</text>
<rect x="722" y="109" width="194" height="153" rx="16" fill="#fdf0dc" stroke="#cf8a2b"/><text x="819" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#996116">④ 価値を測る</text><text x="819" y="178" text-anchor="middle" font-size="15" fill="#996116">時間・誤り・理解</text><text x="819" y="202" text-anchor="middle" font-size="15" fill="#996116">利用率・負担・売上</text><text x="819" y="226" text-anchor="middle" font-size="15" fill="#996116">従来手法との差</text>
<g stroke="#183154" stroke-width="3" fill="none"><path d="M240 184h27m-8 -7 8 7-8 7"/><path d="M466 184h27m-8 -7 8 7-8 7"/><path d="M692 184h27m-8 -7 8 7-8 7"/></g>
<rect x="45" y="293" width="872" height="87" rx="15" fill="#fff" stroke="#d0d8e4"/><text x="67" y="322" font-size="18" font-weight="700" fill="#183154">検証で忘れないこと</text><text x="67" y="346" font-size="16" fill="#526175">「CGが正しく重なった」は技術テストの結果。</text><text x="67" y="368" font-size="16" fill="#526175">「人の判断が速く、正確になった」は業務改善の結果。二つは別の問い。</text>
</g></svg>
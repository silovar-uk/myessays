<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 405" role="img" aria-label="村上龍の言葉に存在する生産的な矛盾を表す比較図">
<rect width="1000" height="405" rx="20" fill="#202a32"/>
<g font-family="sans-serif">
<text x="43" y="60" fill="#e3b58a" font-size="16" letter-spacing="3" font-weight="700">PRODUCTIVE TENSION / 矛盾を読む</text>
<text x="43" y="102" fill="#f2f2ec" font-size="30" font-weight="700">名言は、いつも正しいから力を持つわけではない</text>
<g fill="#303f49" stroke="#637986" stroke-width="1.5"><rect x="43" y="136" width="425" height="175" rx="16"/><rect x="532" y="136" width="425" height="175" rx="16"/></g>
<text x="70" y="176" fill="#efc28f" font-size="18">個人の責任を突きつける声</text>
<text x="70" y="222" fill="#f5f5ee" font-size="25" font-weight="700">自分が動かなければ始まらない</text>
<text x="70" y="262" fill="#cbd5d7" font-size="18">選択・努力・意志</text>
<text x="559" y="176" fill="#92c9bf" font-size="18">人間の限界を見つめる声</text>
<text x="559" y="222" fill="#f5f5ee" font-size="25" font-weight="700">思い通りにならない現実もある</text>
<text x="559" y="262" fill="#cbd5d7" font-size="18">病気・偶然・環境・他者</text>
<text x="500" y="233" fill="#ffefda" font-size="35" font-weight="700" text-anchor="middle">×</text>
<text x="500" y="348" fill="#f1e5d3" font-size="21" text-anchor="middle" font-weight="700">片方を消すのではなく、両方を見たまま考える</text>
<text x="500" y="378" fill="#aabdc0" font-size="15" text-anchor="middle">作品の登場人物の台詞と、作者自身の思想も分けて読む</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>理解の継ぎ目｜三つの情報層</title><desc>確認された事実、推論、未確認を三色の層として描く独自概念図</desc><rect width="1200" height="650" fill="#f7f4ed"/><text x="74" y="96" font-family="sans-serif" font-size="38" fill="#1f3046" font-weight="700">結論は一つに見えても、材料は同じではない</text><text x="77" y="136" font-family="sans-serif" font-size="23" fill="#506175">Evidence / Inference / Unresolved</text><rect x="75" y="183" width="1050" height="113" rx="15" fill="#dcece7"/><rect x="75" y="314" width="1050" height="113" rx="15" fill="#f8e7c6"/><rect x="75" y="445" width="1050" height="113" rx="15" fill="#e4e6ee"/><circle cx="131" cy="239" r="18" fill="#2b806f"/><circle cx="131" cy="369" r="18" fill="#bd8634"/><circle cx="131" cy="500" r="18" fill="#777e98"/><text x="172" y="236" font-family="sans-serif" font-size="32" font-weight="700" fill="#183e39">確認された事実</text><text x="520" y="236" font-family="sans-serif" font-size="25" fill="#254d47">出典を示して再確認できる</text><text x="172" y="367" font-family="sans-serif" font-size="32" font-weight="700" fill="#62440f">推論・仮説</text><text x="520" y="367" font-family="sans-serif" font-size="25" fill="#765824">前提が変われば結論も変わる</text><text x="172" y="497" font-family="sans-serif" font-size="32" font-weight="700" fill="#454b68">未確認事項</text><text x="520" y="497" font-family="sans-serif" font-size="25" fill="#5d647f">次に何を調べるかが残る</text><text x="76" y="607" font-family="sans-serif" font-size="21" fill="#606c76">概念図｜筆者作成。三層は価値の序列ではなく根拠の状態。</text></svg>
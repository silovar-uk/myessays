<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="左は上端がずれた3枚のカード、右は上端をそろえて等間隔に並べた3枚のカード。整列と均等配置の違い"><rect width="960" height="420" fill="#f7f9fc"/><text x="40" y="48" font-size="28" font-family="sans-serif" font-weight="bold" fill="#14213d">整列と均等配置は別の操作</text><text x="60" y="105" font-size="22" font-family="sans-serif">Before：高さも間隔も不揃い</text><text x="530" y="105" font-size="22" font-family="sans-serif">After：上揃え＋左右に均等配置</text><g fill="#dce7f5" stroke="#3561a1" stroke-width="3"><rect x="50" y="160" width="105" height="130" rx="8"/><rect x="196" y="184" width="105" height="130" rx="8"/><rect x="350" y="145" width="105" height="130" rx="8"/></g><g fill="#c8eadd" stroke="#197d66" stroke-width="3"><rect x="530" y="160" width="105" height="130" rx="8"/><rect x="675" y="160" width="105" height="130" rx="8"/><rect x="820" y="160" width="105" height="130" rx="8"/></g><path d="M525 148H930" stroke="#197d66" stroke-width="2" stroke-dasharray="6 6"/><g font-family="sans-serif" font-size="17" fill="#14213d"><text x="63" y="340">端点も位置もばらばら</text><text x="551" y="340">上端一致・カード間40px</text><text x="40" y="391" font-size="15">独自模式図／架空レイアウト。Microsoft PowerPointの実画面ではありません。</text></g></svg>
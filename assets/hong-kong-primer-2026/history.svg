<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-label="香港の近現代史、1842年から2024年までの主な転換点">
<rect width="1100" height="380" fill="#f4f8fb"/>
<text x="38" y="60" font-family="sans-serif" font-size="32" font-weight="700" fill="#123047">香港の近現代史を一本の線で見る</text>
<line x1="83" y1="192" x2="1024" y2="192" stroke="#5a7e8e" stroke-width="6" stroke-linecap="round"/>
<circle cx="104" cy="192" r="12" fill="#2c6f86" stroke="white" stroke-width="5"/><text x="104" y="131" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#153448">1842</text><text x="104" y="159" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#3e5867">香港島割譲</text><line x1="104" y1="180" x2="104" y2="167" stroke="#9fb4be" stroke-width="2"/><circle cx="282" cy="192" r="12" fill="#2c6f86" stroke="white" stroke-width="5"/><text x="282" y="256" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#153448">1898</text><text x="282" y="283" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#3e5867">新界を租借</text><line x1="282" y1="180" x2="282" y2="226" stroke="#9fb4be" stroke-width="2"/><circle cx="466" cy="192" r="12" fill="#2c6f86" stroke="white" stroke-width="5"/><text x="466" y="131" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#153448">1949</text><text x="466" y="159" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#3e5867">工業都市化</text><line x1="466" y1="180" x2="466" y2="167" stroke="#9fb4be" stroke-width="2"/><circle cx="647" cy="192" r="12" fill="#a96940" stroke="white" stroke-width="5"/><text x="647" y="256" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#153448">1997</text><text x="647" y="283" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#3e5867">中国へ返還</text><line x1="647" y1="180" x2="647" y2="226" stroke="#9fb4be" stroke-width="2"/><circle cx="832" cy="192" r="12" fill="#a96940" stroke="white" stroke-width="5"/><text x="832" y="131" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#153448">2020</text><text x="832" y="159" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#3e5867">国家安全維持法</text><line x1="832" y1="180" x2="832" y2="167" stroke="#9fb4be" stroke-width="2"/><circle cx="1010" cy="192" r="12" fill="#a96940" stroke="white" stroke-width="5"/><text x="1010" y="256" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#153448">2024</text><text x="1010" y="283" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#3e5867">第23条条例</text><line x1="1010" y1="180" x2="1010" y2="226" stroke="#9fb4be" stroke-width="2"/>
<text x="38" y="345" font-family="sans-serif" font-size="17" fill="#435866">主な制度上の節目。経済・社会がその日に一斉に変わったことを意味しない。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">リーグワンの意思決定と商業機能の関係</title><desc id="desc">一般社団法人の社員総会、理事会、執行を区別し、競技団体とマーケティング会社を隣接する別組織として示す。簡略化された筆者作成概念図。</desc><rect width="1200" height="630" fill="#f8fafc"/><text x="52" y="58" font-family="Noto Sans JP, sans-serif" font-size="29" font-weight="700" fill="#193143">「理事長を選ぶ」と「リーグを変える」は別の手続き</text><text x="52" y="92" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#526677">組織図ではなく、意思決定と事業機能の関係を整理した概念図</text><rect x="45" y="116" width="725" height="456" rx="22" fill="#e8f1f4" stroke="#b8d3de"/><text x="70" y="149" font-family="Noto Sans JP, sans-serif" font-size="21" font-weight="700" fill="#23556c">一般社団法人・リーグワン</text><rect x="110" y="171" width="584" height="92" rx="12" fill="#fff" stroke="#9fc4d4"/><text x="402" y="207" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="#183746">社員総会</text><text x="402" y="238" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#5c7180">ここでの「社員」は従業員ではなく法人の構成員</text><path d="M402 264v39" stroke="#2c708d" stroke-width="4"/><path d="m392 293 10 13 10-13" fill="none" stroke="#2c708d" stroke-width="4"/><text x="425" y="290" font-family="Noto Sans JP, sans-serif" font-size="13" fill="#40637a">理事を選任</text><rect x="110" y="309" width="584" height="89" rx="12" fill="#fff" stroke="#9fc4d4"/><text x="402" y="345" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="#183746">理事会</text><text x="402" y="373" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#5c7180">業務執行の決定・監督／代表理事の選定</text><path d="M402 399v35" stroke="#2c708d" stroke-width="4"/><path d="m392 423 10 13 10-13" fill="none" stroke="#2c708d" stroke-width="4"/><rect x="110" y="438" width="584" height="96" rx="12" fill="#194d67"/><text x="402" y="475" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="white">理事長・専務理事など</text><text x="402" y="505" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#d3e7ef">リーグの方針を実装・執行</text><rect x="796" y="166" width="361" height="154" rx="18" fill="#fff" stroke="#c8d1d8"/><text x="817" y="203" font-family="Noto Sans JP, sans-serif" font-size="21" font-weight="700" fill="#193143">日本ラグビー協会</text><text x="817" y="236" font-family="Noto Sans JP, sans-serif" font-size="17" fill="#506473">代表・競技普及・強化</text><text x="817" y="265" font-family="Noto Sans JP, sans-serif" font-size="15" fill="#5b6b77">リーグワンとは別法人</text><rect x="796" y="344" width="361" height="191" rx="18" fill="#fff" stroke="#c8d1d8"/><text x="817" y="381" font-family="Noto Sans JP, sans-serif" font-size="21" font-weight="700" fill="#193143">ジャパンラグビー</text><text x="817" y="410" font-family="Noto Sans JP, sans-serif" font-size="21" font-weight="700" fill="#193143">マーケティング（JRM）</text><text x="817" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#506473">ファン向けサービス・商品・</text><text x="817" y="472" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#506473">デジタル等の事業化</text><text x="817" y="502" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#6b7884">協会・リーグ・ソニーが共同設立</text><text x="49" y="607" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#607383">根拠：法務省の一般社団法人制度解説／リーグワン公式組織情報／JRM公式会社概要　※実際の契約・権限の全容を示すものではない</text></svg>
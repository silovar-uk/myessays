<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" fill="#f7f9fc"/><text x="35" y="50" font-family="sans-serif" font-size="27" font-weight="bold" fill="#182c49">書式の統一：1件ずつ直す → 1つの基準から複数に適用</text><text x="40" y="110" font-family="sans-serif" font-size="22">Before：個別修正</text><text x="510" y="110" font-family="sans-serif" font-size="22">After：書式コピー</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><rect x="35" y="145" width="125" height="80" rx="10" fill="#d5e6f7"/><text x="97" y="192">施策A</text><rect x="180" y="145" width="125" height="80" rx="10" fill="#f6d5d5"/><text x="242" y="192">施策B</text><rect x="325" y="145" width="125" height="80" rx="10" fill="#e6e2c7"/><text x="387" y="192">施策C</text><rect x="510" y="145" width="125" height="80" rx="10" fill="#d5e6f7" stroke="#295a90" stroke-width="3"/><text x="572" y="192">基準A</text><rect x="655" y="145" width="125" height="80" rx="10" fill="#d5e6f7" stroke="#295a90" stroke-width="3"/><text x="717" y="192">施策B</text><rect x="800" y="145" width="125" height="80" rx="10" fill="#d5e6f7" stroke="#295a90" stroke-width="3"/><text x="862" y="192">施策C</text></g><path d="M640 184 H650 M785 184 H795" stroke="#295a90" stroke-width="4"/><text x="35" y="290" font-family="sans-serif" font-size="20" fill="#4d5c70">色・線・文字の書式が不統一</text><text x="510" y="290" font-family="sans-serif" font-size="20" fill="#295a90">基準を選択 → 書式コピーをダブルクリック → 対象を順にクリック</text><text x="35" y="360" font-family="sans-serif" font-size="18" fill="#555">※説明用の独自模式図。PowerPointの実際の画面ではありません。</text></svg>
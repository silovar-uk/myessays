<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
  <title id="title">バリューチェーン分析の実務フロー</title>
  <desc id="desc">分析単位を定め、顧客価値、活動分解、ドライバー比較、活動間連結、打ち手とKPIへ進む6段階。</desc>
  <rect width="760" height="1080" fill="#fbf8f1"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b43e31"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans JP", Inter, "Hiragino Sans", "Yu Gothic UI", sans-serif; fill:#171717; }
    .num { font-size:25px; font-weight:800; fill:#fbf8f1; }
    .head { font-size:32px; font-weight:800; }
    .body { font-size:24px; font-weight:500; fill:#554f47; }
    .step { fill:#f7f2e9; stroke:#c9c0b3; stroke-width:2; }
    .arrow { stroke:#b43e31; stroke-width:4; fill:none; marker-end:url(#arrow); }
    .inverse { fill:#fbf8f1; }
  </style>

  <rect x="54" y="42" width="652" height="84" rx="42" fill="#171717"/>
  <text class="inverse" x="380" y="95" text-anchor="middle" font-size="27" font-weight="700">問い：価値とコストの差は、どこで生まれるか</text>

  <g transform="translate(70 164)">
    <rect class="step" width="620" height="112" rx="16"/>
    <circle cx="54" cy="56" r="31" fill="#b43e31"/><text class="num" x="54" y="65" text-anchor="middle">1</text>
    <text class="head" x="104" y="49">分析単位を定める</text>
    <text class="body" x="104" y="84">企業全体ではなく、顧客・商品・地域を切る</text>
  </g>
  <path class="arrow" d="M380 282 L380 316"/>

  <g transform="translate(70 326)">
    <rect class="step" width="620" height="112" rx="16"/>
    <circle cx="54" cy="56" r="31" fill="#b43e31"/><text class="num" x="54" y="65" text-anchor="middle">2</text>
    <text class="head" x="104" y="49">顧客価値を一文にする</text>
    <text class="body" x="104" y="84">誰が、何を理由に選び、何へ対価を払うか</text>
  </g>
  <path class="arrow" d="M380 444 L380 478"/>

  <g transform="translate(70 488)">
    <rect class="step" width="620" height="112" rx="16"/>
    <circle cx="54" cy="56" r="31" fill="#b43e31"/><text class="num" x="54" y="65" text-anchor="middle">3</text>
    <text class="head" x="104" y="49">活動を競争の粒度で分ける</text>
    <text class="body" x="104" y="84">経済性・差別化要因が変わる境目まで切る</text>
  </g>
  <path class="arrow" d="M380 606 L380 640"/>

  <g transform="translate(70 650)">
    <rect class="step" width="620" height="112" rx="16"/>
    <circle cx="54" cy="56" r="31" fill="#2e5266"/><text class="num" x="54" y="65" text-anchor="middle">4</text>
    <text class="head" x="104" y="49">ドライバーを競合比較する</text>
    <text class="body" x="104" y="84">コスト・品質・速度・体験・資本効率を比べる</text>
  </g>
  <path class="arrow" d="M380 768 L380 802"/>

  <g transform="translate(70 812)">
    <rect class="step" width="620" height="112" rx="16"/>
    <circle cx="54" cy="56" r="31" fill="#2e5266"/><text class="num" x="54" y="65" text-anchor="middle">5</text>
    <text class="head" x="104" y="49">連結とfitを描く</text>
    <text class="body" x="104" y="84">前後工程の因果と相互補強・副作用を見る</text>
  </g>
  <path class="arrow" d="M380 930 L380 964"/>

  <g transform="translate(70 974)">
    <rect width="620" height="78" rx="16" fill="#e5ece8" stroke="#536b5c" stroke-width="2"/>
    <text class="head" x="30" y="49">6　打ち手・責任者・KPIへ変換する</text>
  </g>

  <path d="M706 708 C742 708 742 544 706 544" fill="none" stroke="#8a8379" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text class="body" x="723" y="628" text-anchor="middle" transform="rotate(90 723 628)">粒度を戻して修正</text>
</svg>

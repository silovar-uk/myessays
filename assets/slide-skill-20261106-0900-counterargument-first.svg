<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#f8fafc"/><text x="50" y="65" font-size="33" font-family="sans-serif" fill="#17243a">提案を強くする反論先回り設計（架空例）</text><rect x="45" y="105" width="1110" height="95" rx="15" fill="#173c62"/><text x="75" y="160" font-size="29" fill="white" font-family="sans-serif">条件付き提案：増分粗利 ＞ 広告費なら投資拡大</text><rect x="45" y="235" width="520" height="190" rx="15" fill="#dbeafe"/><text x="72" y="285" font-size="28" font-family="sans-serif">期待効果</text><text x="72" y="338" font-size="24" font-family="sans-serif">新規来場・購買の増加</text><text x="72" y="378" font-size="22" font-family="sans-serif">必要証拠：増分粗利</text><rect x="635" y="235" width="520" height="190" rx="15" fill="#fee2e2"/><text x="662" y="285" font-size="28" font-family="sans-serif">最も強い反論</text><text x="662" y="338" font-size="24" font-family="sans-serif">自然増ではないか？</text><text x="662" y="378" font-size="22" font-family="sans-serif">必要証拠：比較対象群</text><rect x="45" y="455" width="1110" height="100" rx="15" fill="#dcfce7"/><text x="75" y="510" font-size="26" font-family="sans-serif">次の判断：小規模実証 → 増分効果を確認 → 拡大／停止</text></svg>
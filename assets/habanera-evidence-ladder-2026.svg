<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500"><rect width="1120" height="500" rx="26" fill="#111827"/><text x="56" y="72" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="700">「似ている」から「引用された」まで、証拠は同じではない</text><text x="56" y="111" fill="#aebcce" font-family="sans-serif" font-size="18">上ほど意図的な借用を判断する材料が強くなる。どれか一つで必ず確定するわけではない。</text><g font-family="sans-serif"><rect x="88" y="351" width="940" height="66" rx="12" fill="#26364b"/><text x="114" y="392" fill="#e1e9f2" font-size="21">① 聴き手の印象：「あの曲に似ている」</text><rect x="145" y="268" width="825" height="66" rx="12" fill="#31516b"/><text x="171" y="309" fill="#eff6ff" font-size="21">② 音程・リズム・フレーズ長の照合</text><rect x="215" y="185" width="685" height="66" rx="12" fill="#286e76"/><text x="241" y="226" fill="#effffb" font-size="21">③ 楽譜・制作資料などの整合</text><rect x="289" y="122" width="538" height="49" rx="12" fill="#ae793e"/><text x="313" y="154" fill="#fff8e7" font-size="20">④ 作者・制作側の明示的発言</text></g><text x="88" y="453" fill="#ffce87" font-family="sans-serif" font-size="20">本件で確認したのは①まで。正式な引用は未判定。</text></svg>
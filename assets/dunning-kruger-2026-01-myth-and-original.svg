<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><style>text{font-family:Arial,'Noto Sans JP','Yu Gothic',sans-serif}</style><rect width="1200" height="520" fill="#f7f5ef"/><text x="45" y="60" fill="#172536" font-size="35" font-weight="750">図を覚える前に、軸を確認する</text><rect x="42" y="105" width="535" height="360" rx="22" fill="#fff"/><rect x="619" y="105" width="535" height="360" rx="22" fill="#fff"/><text x="76" y="150" fill="#172536" font-size="24" font-weight="700">広く流布する「山型の曲線」</text><text x="76" y="185" fill="#d85d55" font-size="17" font-weight="500">学習と自信の比喩（実測値ではない）</text><path d="M106 405 V235 M106 405 H520" fill="none" stroke="#c6ced2" stroke-width="3"/><path d="M120 380 C205 270 214 215 267 257 S333 432 384 385 S479 286 519 312" fill="none" stroke="#d85d55" stroke-width="7" stroke-linecap="round"/><text x="181" y="243" fill="#d85d55" font-size="18" font-weight="700">自信の山</text><text x="342" y="438" fill="#d85d55" font-size="18" font-weight="700">絶望の谷</text><text x="76" y="453" fill="#5a6a78" font-size="17" font-weight="500">横軸：学習の進み具合</text><text x="654" y="150" fill="#172536" font-size="24" font-weight="700">1999年の原著が報告した数値</text><text x="654" y="185" fill="#5a6a78" font-size="18" font-weight="500">成績下位四分位群の平均順位</text><rect x="730" y="371" width="110" height="34" rx="6" fill="#3568bb"/><rect x="912" y="230" width="110" height="175" rx="6" fill="#d85d55"/><text x="758" y="351" fill="#3568bb" font-size="44" font-weight="800">12</text><text x="940" y="211" fill="#d85d55" font-size="44" font-weight="800">62</text><text x="723" y="436" fill="#172536" font-size="19" font-weight="700">実際の得点</text><text x="901" y="436" fill="#172536" font-size="19" font-weight="700">本人の見積り</text><text x="46" y="499" fill="#5a6a78" font-size="18" font-weight="500">左＝学習体験の比喩／右＝原著の集計値。二つは縦軸も横軸も異なる。</text></svg>

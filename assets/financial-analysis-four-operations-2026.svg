<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1320" viewBox="0 0 960 1320" role="img"><style>text{font-family:Meiryo,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}</style><rect x="0" y="0" width="960" height="1320" rx="0" fill="#091727" stroke="none"/><text x="56" y="76" font-size="39" fill="#ffffff" font-weight="800">決算分析の４つの操作</text><text x="56" y="124" font-size="25" fill="#b9cbdc" font-weight="400">比較 → 図解 → 要素分解 → 起承転結</text><rect x="56" y="162" width="848" height="220" rx="24" fill="#17304b" stroke="#365473"/><rect x="80" y="190" width="104" height="74" rx="18" fill="#71d7ec" stroke="none"/><text x="100" y="242" font-size="40" fill="#0d1c30" font-weight="800">01</text><text x="211" y="219" font-size="34" fill="#ffffff" font-weight="800">並べる</text><text x="213" y="259" font-size="26" fill="#71d7ec" font-weight="700">（比較）</text><text x="211" y="302" font-size="26" fill="#e6eef8" font-weight="500">同じ基準で数字を並べる</text><text x="211" y="336" font-size="25" fill="#c9d8eb" font-weight="500">前年・過去最高・計画・競合</text><text x="211" y="369" font-size="24" fill="#71d7ec" font-weight="600">発見：どこが違う？</text><path d="M480 386 v30 m-10 -10 l10 12 10 -12" stroke="#9fb0c9" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="430" width="848" height="220" rx="24" fill="#17304b" stroke="#365473"/><rect x="80" y="458" width="104" height="74" rx="18" fill="#98e9b8" stroke="none"/><text x="100" y="510" font-size="40" fill="#0d1c30" font-weight="800">02</text><text x="211" y="487" font-size="34" fill="#ffffff" font-weight="800">見えるようにする</text><text x="213" y="527" font-size="26" fill="#98e9b8" font-weight="700">（図解）</text><text x="211" y="570" font-size="26" fill="#e6eef8" font-weight="500">線・棒・構成図で形をつかむ</text><text x="211" y="604" font-size="25" fill="#c9d8eb" font-weight="500">増減・転換点・偏りを見せる</text><text x="211" y="637" font-size="24" fill="#98e9b8" font-weight="600">発見：どこが目立つ？</text><path d="M480 654 v30 m-10 -10 l10 12 10 -12" stroke="#9fb0c9" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="698" width="848" height="220" rx="24" fill="#17304b" stroke="#365473"/><rect x="80" y="726" width="104" height="74" rx="18" fill="#e8c58a" stroke="none"/><text x="100" y="778" font-size="40" fill="#0d1c30" font-weight="800">03</text><text x="211" y="755" font-size="34" fill="#ffffff" font-weight="800">取り出す</text><text x="213" y="795" font-size="26" fill="#e8c58a" font-weight="700">（要素分解）</text><text x="211" y="838" font-size="26" fill="#e6eef8" font-weight="500">全体を構成する数字に分ける</text><text x="211" y="872" font-size="25" fill="#c9d8eb" font-weight="500">人数・単価・事業・費用</text><text x="211" y="905" font-size="24" fill="#e8c58a" font-weight="600">発見：何が動かした？</text><path d="M480 922 v30 m-10 -10 l10 12 10 -12" stroke="#9fb0c9" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="966" width="848" height="220" rx="24" fill="#17304b" stroke="#365473"/><rect x="80" y="994" width="104" height="74" rx="18" fill="#d8b6ff" stroke="none"/><text x="100" y="1046" font-size="40" fill="#0d1c30" font-weight="800">04</text><text x="211" y="1023" font-size="34" fill="#ffffff" font-weight="800">話を組み立てる</text><text x="213" y="1063" font-size="26" fill="#d8b6ff" font-weight="700">（起承転結）</text><text x="211" y="1106" font-size="26" fill="#e6eef8" font-weight="500">問い・事実・ギャップ・答え</text><text x="211" y="1140" font-size="25" fill="#c9d8eb" font-weight="500">証拠に沿って順序を編集</text><text x="211" y="1173" font-size="24" fill="#d8b6ff" font-weight="600">成果：何が分かった？</text><rect x="56" y="1243" width="848" height="45" rx="14" fill="#273950" stroke="none"/><text x="76" y="1274" font-size="22" fill="#f0f4fa" font-weight="500">注意：最初に仮の問いを持ち、途中で必要なら戻る</text><text x="56" y="1308" font-size="20" fill="#a6b9d2" font-weight="400">独自作成｜書籍の図式をそのまま転載したものではない</text></svg>
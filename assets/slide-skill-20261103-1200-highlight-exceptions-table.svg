<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">比較表のBeforeとAfter</title><desc id="desc">全セルを強調する表よりも、判断に必要な差分だけを強調した表の方が比較しやすいことを示す。数値は架空。</desc><rect width="1200" height="650" fill="#f4f7fb"/><text x="40" y="54" font-family="sans-serif" font-size="32" fill="#172c47" font-weight="bold">比較表は「全部を目立たせる」より「差分を見せる」</text><g font-family="sans-serif" font-size="25" fill="#172c47"><text x="44" y="110">BEFORE：全項目を同じ強さで表示</text><text x="634" y="110">AFTER：意思決定の差分だけ強調</text></g><g stroke="#d1dbe8" stroke-width="2"><rect x="40" y="130" width="530" height="390" fill="#fff"/><rect x="630" y="130" width="530" height="390" fill="#fff"/></g><g font-family="sans-serif" font-size="23" fill="#24384d"><rect x="42" y="132" width="526" height="66" fill="#e6edf5"/><rect x="632" y="132" width="526" height="66" fill="#e6edf5"/><text x="64" y="175">候補　費用　導入期間　効果</text><text x="654" y="175">候補　費用　導入期間　効果</text><text x="64" y="259">A　　100万　 2か月　　小</text><text x="64" y="346">B　　120万　 1か月　　大</text><text x="64" y="433">C　　 80万　 3か月　　中</text><text x="654" y="259">A　　100万　 2か月　　小</text><rect x="635" y="290" width="518" height="78" fill="#d5f2e9"/><text x="654" y="346" font-weight="bold">B　　120万　 1か月　　大</text><text x="654" y="433">C　　 80万　 3か月　　中</text></g><g font-family="sans-serif" font-size="21" fill="#5b6b7d"><text x="44" y="555">読者は全行を同じ重みで読む</text><text x="634" y="555">候補Bの差分を起点に検討できる</text><text x="42" y="613">※数値・効果評価は架空。強調は優位性の証明ではなく、検討対象の提示。</text></g></svg>
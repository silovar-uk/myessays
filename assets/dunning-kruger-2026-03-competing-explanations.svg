<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540"><style>text{font-family:Arial,'Noto Sans JP','Yu Gothic',sans-serif}</style><rect width="1200" height="540" fill="#f7f5ef"/><text x="45" y="67" fill="#172536" font-size="34" font-weight="750">グラフの形だけでは、原因は決まらない</text><rect x="261" y="109" width="678" height="100" rx="22" fill="#fff"/><text x="350" y="153" fill="#172536" font-size="29" font-weight="750">観察された自己評価のずれ</text><text x="362" y="186" fill="#5a6a78" font-size="18" font-weight="500">成績と本人の見積りが一致しない</text><path d="M600 210 V250 H301 V274 M600 250 H898 V274" fill="none" stroke="#5a6a78" stroke-width="4"/><rect x="54" y="275" width="493" height="182" rx="22" fill="#e5efff"/><rect x="652" y="275" width="493" height="182" rx="22" fill="#ffe5e0"/><text x="83" y="328" fill="#3568bb" font-size="28" font-weight="750">心理学的な説明</text><text x="83" y="373" fill="#172536" font-size="21" font-weight="500">誤答を見分ける能力の不足</text><text x="83" y="414" fill="#5a6a78" font-size="18" font-weight="500">メタ認知・自己点検の難しさ</text><text x="685" y="328" fill="#d85d55" font-size="28" font-weight="750">統計学的な説明</text><text x="685" y="373" fill="#172536" font-size="21" font-weight="500">平均への回帰・指標の不一致</text><text x="685" y="414" fill="#5a6a78" font-size="18" font-weight="500">得点の上下限などの影響</text><text x="45" y="504" fill="#5a6a78" font-size="18" font-weight="500">両者は単純な二者択一ではない。寄与の大きさには検証が必要。</text></svg>

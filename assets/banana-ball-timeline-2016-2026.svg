<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 555" role="img" aria-label="Banana Ballの2016〜2026年の歩み">
<rect width="1200" height="555" fill="#101923"/><rect x="30" y="28" width="1140" height="500" rx="28" fill="#182633" stroke="#405467"/>
<text x="70" y="79" font-size="37" font-weight="700" fill="#fff9d9" font-family="Arial,sans-serif">BANANA BALL  |  10 YEARS, THREE DIFFERENT BUSINESSES</text><text x="71" y="112" font-size="20" fill="#c7d6df" font-family="Arial,sans-serif">クラブ → 興行ツアー → 競技リーグ ／ 2016—2026</text>
<line x1="105" y1="268" x2="1095" y2="268" stroke="#698392" stroke-width="5"/>
<g font-family="Arial,sans-serif">
<circle cx="145" cy="268" r="22" fill="#f9d447"/><text x="145" y="275" font-size="18" font-weight="700" text-anchor="middle">1</text>
<circle cx="390" cy="268" r="22" fill="#f9d447"/><text x="390" y="275" font-size="18" font-weight="700" text-anchor="middle">2</text>
<circle cx="650" cy="268" r="22" fill="#f9d447"/><text x="650" y="275" font-size="18" font-weight="700" text-anchor="middle">3</text>
<circle cx="895" cy="268" r="22" fill="#f9d447"/><text x="895" y="275" font-size="18" font-weight="700" text-anchor="middle">4</text>
<circle cx="1070" cy="268" r="22" fill="#ff9a69"/><text x="1070" y="275" font-size="18" font-weight="700" text-anchor="middle">5</text>
<g fill="#f9d447" font-size="33" font-weight="700" text-anchor="middle"><text x="145" y="206">2016</text><text x="390" y="357">2020</text><text x="650" y="206">2022</text><text x="895" y="357">2024</text><text x="1070" y="206">2026</text></g>
<g fill="#fff" font-size="20" text-anchor="middle"><text x="145" y="236">大学夏季リーグ</text><text x="390" y="388">公式ルール試合</text><text x="650" y="236">既存リーグ離脱</text><text x="895" y="388">新リーグ構想発表</text><text x="1070" y="236">6チームで開幕</text></g>
<g fill="#b3ccd6" font-size="15" text-anchor="middle"><text x="145" y="307">観客体験の実験</text><text x="390" y="419">独自競技の原型</text><text x="650" y="307">巡業ビジネスへ</text><text x="895" y="419">興行から制度へ</text><text x="1070" y="307">初代王者は</text><text x="1070" y="327">Tailgaters</text></g>
</g><rect x="78" y="453" width="1028" height="48" rx="13" fill="#314a50"/><text x="592" y="483" fill="#f7f7e3" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">変化したのは規則だけでなく、「競争の器」と収益を生む単位だった</text></svg>
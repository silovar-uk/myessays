<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="1100" height="430" rx="22" fill="#f5f8fc"/><text x="45" y="58" font-size="28" font-family="sans-serif" font-weight="bold" fill="#172b4d">撤退の3つの時間軸</text><rect x="45" y="95" width="1010" height="77" rx="12" fill="#e8f4ee"/><text x="72" y="143" font-size="24" font-family="sans-serif" fill="#152c40">顧客：告知 → 代替先の選択 → 移行完了</text><rect x="45" y="193" width="1010" height="77" rx="12" fill="#e0ebf6"/><text x="72" y="241" font-size="24" font-family="sans-serif" fill="#152c40">人材：知識の記録 → 引き継ぎ → 新事業での習熟</text><rect x="45" y="291" width="1010" height="77" rx="12" fill="#e8f4ee"/><text x="72" y="339" font-size="24" font-family="sans-serif" fill="#152c40">費用：契約確認 → 残存費用の把握 → 終了後の精算</text></svg>
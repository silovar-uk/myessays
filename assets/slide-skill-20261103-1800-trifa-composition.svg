<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-label="トリファの年代構成20代59%、30代38%、40代3%、国籍構成日本籍76%、外国籍24%を同じ幅の100%帯で比較"><rect width="1000" height="450" fill="#f8fafc"/><text x="40" y="55" font-size="29" font-family="sans-serif" fill="#152238">属性ごとに100%帯を分ける</text><text x="40" y="100" font-size="21" font-family="sans-serif">年代（2026年5月末）</text><rect x="40" y="125" width="531" height="68" fill="#2563eb"/><rect x="571" y="125" width="342" height="68" fill="#60a5fa"/><rect x="913" y="125" width="27" height="68" fill="#f59e0b"/><text x="58" y="167" font-size="24" font-family="sans-serif" fill="white">20代 59%</text><text x="589" y="167" font-size="24" font-family="sans-serif" fill="#14213d">30代 38%</text><text x="40" y="228" font-size="21" font-family="sans-serif">国籍（2026年5月末）</text><rect x="40" y="253" width="684" height="68" fill="#2563eb"/><rect x="724" y="253" width="216" height="68" fill="#f59e0b"/><text x="58" y="295" font-size="24" font-family="sans-serif" fill="white">日本籍 76%</text><text x="735" y="295" font-size="21" font-family="sans-serif" fill="#14213d">外国籍 24%</text><text x="40" y="365" font-size="19" font-family="sans-serif">※年代40代3%は右端の橙色。対象：直雇用社員と役員。</text><text x="40" y="410" font-size="17" font-family="sans-serif" fill="#475569">出典：trifa Company Deck p.35 ／ 独自再構成・原典の画面再現ではない</text></svg>
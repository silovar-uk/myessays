<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1320" viewBox="0 0 960 1320" role="img"><style>text{font-family:Meiryo,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}</style><rect x="0" y="0" width="960" height="1320" rx="0" fill="#091727" stroke="none"/><text x="56" y="76" font-size="39" fill="#ffffff" font-weight="800">起承転結は『発見』を伝える順番</text><text x="56" y="124" font-size="25" fill="#b9cbdc" font-weight="400">起＝問い ／ 承＝基礎データ ／ 転＝直感とのギャップ ／ 結＝答え</text><rect x="56" y="170" width="848" height="214" rx="22" fill="#15314a" stroke="#37576d"/><rect x="82" y="196" width="94" height="94" rx="20" fill="#74d5ea" stroke="none"/><text x="108" y="264" font-size="57" fill="#101e32" font-weight="800">起</text><text x="200" y="237" font-size="34" fill="#fff" font-weight="750">問いを定める</text><text x="202" y="275" font-size="20" fill="#74d5ea" font-weight="700">QUESTIONS</text><text x="98" y="325" font-size="30" fill="#eef7ff" font-weight="500">なぜ来園者が増えていないのに</text><text x="98" y="364" font-size="29" fill="#eef7ff" font-weight="500">売上高は過去最高なのか？</text><path d="M480 390 v39 m-12 -12 l12 14 12 -14" fill="none" stroke="#95b6ce" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="439" width="848" height="214" rx="22" fill="#15314a" stroke="#37576d"/><rect x="82" y="465" width="94" height="94" rx="20" fill="#9ce1b4" stroke="none"/><text x="108" y="533" font-size="57" fill="#101e32" font-weight="800">承</text><text x="200" y="506" font-size="34" fill="#fff" font-weight="750">基礎データを確認</text><text x="202" y="544" font-size="20" fill="#9ce1b4" font-weight="700">EVIDENCE</text><text x="98" y="594" font-size="30" fill="#eef7ff" font-weight="500">2025年度の連結売上高</text><text x="98" y="633" font-size="29" fill="#eef7ff" font-weight="500">7,045億円（会社の開示）</text><path d="M480 659 v39 m-12 -12 l12 14 12 -14" fill="none" stroke="#95b6ce" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="708" width="848" height="214" rx="22" fill="#15314a" stroke="#37576d"/><rect x="82" y="734" width="94" height="94" rx="20" fill="#ffca91" stroke="none"/><text x="108" y="802" font-size="57" fill="#101e32" font-weight="800">転</text><text x="200" y="775" font-size="34" fill="#fff" font-weight="750">直感と事実の差</text><text x="202" y="813" font-size="20" fill="#ffca91" font-weight="700">GAP</text><text x="98" y="863" font-size="30" fill="#eef7ff" font-weight="500">2018年度より来園者は少ない</text><text x="98" y="902" font-size="29" fill="#eef7ff" font-weight="500">しかも前年度比で営業減益</text><path d="M480 928 v39 m-12 -12 l12 14 12 -14" fill="none" stroke="#95b6ce" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="977" width="848" height="214" rx="22" fill="#15314a" stroke="#37576d"/><rect x="82" y="1003" width="94" height="94" rx="20" fill="#e0c0ff" stroke="none"/><text x="108" y="1071" font-size="57" fill="#101e32" font-weight="800">結</text><text x="200" y="1044" font-size="34" fill="#fff" font-weight="750">問いへの答え</text><text x="202" y="1082" font-size="20" fill="#e0c0ff" font-weight="700">ANSWER</text><text x="98" y="1132" font-size="30" fill="#eef7ff" font-weight="500">客数だけでは売上を説明できない</text><text x="98" y="1171" font-size="29" fill="#eef7ff" font-weight="500">単価と事業構成、費用も調べる</text><rect x="56" y="1249" width="848" height="44" rx="13" fill="#244258" stroke="none"/><text x="75" y="1280" font-size="23" fill="#e5f4ff" font-weight="550">『転』は演出ではなく、検証されたギャップ</text><text x="56" y="1310" font-size="20" fill="#a6b9d2" font-weight="400">数字：オリエンタルランド公開資料／図の構成は独自作成</text></svg>
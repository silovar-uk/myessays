<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330"><rect width="1120" height="330" rx="24" fill="#f7f9fc"/><text x="44" y="62" font-size="27" fill="#1e293b" font-family="sans-serif" font-weight="bold">売れた30万円と、増えた5万円は違う</text><text x="44" y="94" font-size="17" fill="#64748b" font-family="sans-serif">すべて説明用の仮定。実績値ではない。</text><rect x="44" y="130" width="864" height="76" rx="6" fill="#df9bba"/><rect x="764" y="130" width="144" height="76" rx="0" fill="#2b8d9f"/><text x="404" y="178" font-size="24" fill="#562744" text-anchor="middle" font-weight="bold">既存商品からの置き換え 25万円</text><text x="838" y="163" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">新規</text><text x="838" y="189" font-size="23" fill="#fff" text-anchor="middle" font-weight="bold">5万円</text><text x="44" y="250" font-family="sans-serif" font-size="20" fill="#334155">レゴ新商品売上：30万円</text><text x="44" y="290" font-family="sans-serif" font-size="20" fill="#334155">売場全体の増分売上：30 − 25 = 5万円</text></svg>
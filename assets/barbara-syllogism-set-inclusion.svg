<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">バルバラを集合の包含関係で表した図</title>
<desc id="desc">小概念Sが中概念Mに含まれ、中概念Mが大概念Pに含まれるため、小概念Sが大概念Pに含まれることを示す。</desc>
<rect width="1200" height="720" fill="#f8f7f3"/>
<text x="70" y="85" font-family="sans-serif" font-size="34" font-weight="700" fill="#1f2937">Barbara = S ⊆ M ⊆ P</text>
<text x="70" y="128" font-family="sans-serif" font-size="20" fill="#4b5563">「すべてのSはM」「すべてのMはP」なら「すべてのSはP」</text>
<ellipse cx="610" cy="400" rx="430" ry="245" fill="#e7eef7" stroke="#385b7a" stroke-width="4"/>
<ellipse cx="610" cy="420" rx="285" ry="165" fill="#eef3e7" stroke="#536b3e" stroke-width="4"/>
<ellipse cx="610" cy="440" rx="145" ry="85" fill="#f7eee4" stroke="#8a5e3b" stroke-width="4"/>
<text x="985" y="315" font-family="sans-serif" font-size="34" font-weight="700" fill="#385b7a">P</text>
<text x="825" y="415" font-family="sans-serif" font-size="34" font-weight="700" fill="#536b3e">M</text>
<text x="600" y="452" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#8a5e3b">S</text>
<text x="70" y="655" font-family="sans-serif" font-size="22" fill="#374151">例：犬（S）⊆哺乳類（M）⊆動物（P）</text>
</svg>
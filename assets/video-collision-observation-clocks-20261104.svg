<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="観測の時間幅を比較する模式図"><rect width="1200" height="430" fill="#f6f7f9"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#17243a">必要な時間幅は、判断の種類で変わる</text><text x="55" y="90" font-family="Arial,sans-serif" font-size="16" fill="#586476">異なる仕組みを並べた概念比較。高頻度の方が常に優れているわけではない。</text><g font-family="Arial,sans-serif"><rect x="55" y="125" width="340" height="220" rx="18" fill="#ffffff" stroke="#dbe3eb"/><text x="78" y="165" font-size="17" fill="#445365">空港・地上作業の工程</text><text x="78" y="222" font-size="51" fill="#1c7185" font-weight="bold">5秒/枚</text><text x="78" y="273" font-size="17" fill="#1c293c">到着・積込・作業完了</text><text x="78" y="309" font-size="14" fill="#758094">静止画像：スキポール空港の例</text><rect x="430" y="125" width="340" height="220" rx="18" fill="#ffffff" stroke="#dbe3eb"/><text x="453" y="165" font-size="17" fill="#445365">競技・選手の位置追跡</text><text x="453" y="222" font-size="51" fill="#8f5e3e" font-weight="bold">50回/秒</text><text x="453" y="273" font-size="17" fill="#1c293c">選手の身体各部の位置</text><text x="453" y="309" font-size="14" fill="#758094">2022年大会の方式</text><rect x="805" y="125" width="340" height="220" rx="18" fill="#ffffff" stroke="#dbe3eb"/><text x="828" y="165" font-size="17" fill="#445365">競技・ボール接触の瞬間</text><text x="828" y="222" font-size="51" fill="#6b5c99" font-weight="bold">500回/秒</text><text x="828" y="273" font-size="17" fill="#1c293c">ボール内の慣性センサー</text><text x="828" y="309" font-size="14" fill="#758094">カメラのフレームレートではない</text></g><rect x="55" y="370" width="1090" height="40" rx="12" fill="#e8eef3"/><text x="600" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#274457">問い → 必要な時間幅 → センサー → 判断</text></svg>
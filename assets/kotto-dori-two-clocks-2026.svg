<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d">
<title id="t">骨董通りをつくった二つの時間</title><desc id="d">根津美術館、骨董商の集積と通りの命名という文化の歴史。1964年の都市計画決定と2026年の道路事業認可という行政の歴史。</desc>
<rect width="1120" height="560" rx="20" fill="#faf8f3"/><text x="52" y="67" font-family="sans-serif" font-weight="700" font-size="34" fill="#242f36">骨董通りをつくった二つの時間</text><text x="54" y="106" font-family="sans-serif" font-size="19" fill="#55636b">街の名前が育つ時間と、道路の設計が進む時間は同じではない</text>
<text x="54" y="162" font-size="22" font-weight="700" fill="#8f5734" font-family="sans-serif">文化と商売</text><rect x="54" y="191" width="1006" height="112" rx="12" fill="#f0e1d3"/>
<path d="M90 246 H1022" stroke="#b17d53" stroke-width="5" stroke-linecap="round"/>
<g fill="#ad693c"><circle cx="160" cy="246" r="11"/><circle cx="420" cy="246" r="11"/><circle cx="684" cy="246" r="11"/><circle cx="964" cy="246" r="11"/></g>
<g font-family="sans-serif" fill="#573621" font-size="20" text-anchor="middle"><text x="160" y="225" font-weight="700">1941</text><text x="160" y="281" font-size="17">根津美術館開館</text><text x="420" y="225" font-weight="700">1950年代</text><text x="420" y="281" font-size="17">骨董店の集積</text><text x="684" y="225" font-weight="700">1976</text><text x="684" y="281" font-size="17">「からくさ」出店</text><text x="964" y="225" font-weight="700">1980年代</text><text x="964" y="281" font-size="17">呼称が定着</text></g>
<text x="54" y="356" font-size="22" font-weight="700" fill="#2e667e" font-family="sans-serif">道路と制度</text><rect x="54" y="383" width="1006" height="112" rx="12" fill="#dbeaf0"/>
<path d="M90 438 H1022" stroke="#3f7992" stroke-width="5" stroke-linecap="round"/>
<g fill="#316a83"><circle cx="180" cy="438" r="11"/><circle cx="694" cy="438" r="11"/><circle cx="982" cy="438" r="11"/></g>
<g font-family="sans-serif" fill="#204758" font-size="20" text-anchor="middle"><text x="180" y="418" font-weight="700">1964</text><text x="180" y="472" font-size="17">幅25mで計画決定</text><text x="694" y="418" font-weight="700">2026</text><text x="694" y="472" font-size="17">7月に事業認可</text><text x="982" y="418" font-weight="700">2038年3月</text><text x="982" y="472" font-size="17">認可上の事業期限</text></g>
<text x="54" y="533" font-size="14" fill="#69777d" font-family="sans-serif">出典：根津美術館・テレビ東京・港区都市計画情報・港区議会資料。完成時期は確約ではない。</text>
</svg>
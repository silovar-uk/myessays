<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1071" width="760" height="1071" role="img" aria-label="共通操作：ダッシュと同時押し"><rect width="760" height="1071" fill="#f7f7f3"/><style>text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#152c43}.head{font-size:35px;font-weight:800}.sub{font-size:19px;fill:#52657a}.cap{font-size:24px;font-weight:700}.hint{font-size:20px;fill:#4e6072}.seq{font-size:27px;font-weight:800;fill:#145e91}.key{font-size:22px;font-weight:bold}.step{font-size:23px;font-weight:600}.foot{font-size:19px;fill:#415269}</style><text x="30" y="55" class="head">共通操作：ダッシュと同時押し</text><text x="30" y="89" class="sub">同じ66でも、パリィラッシュとキャンセルラッシュは別の技術</text><text x="30" y="121" class="sub">物理キーの順序：←　↓　→　↑　／　青＝押下中　／　結果は右端</text><rect x="22" y="142" width="716" height="426" rx="20" fill="#fff" stroke="#dce4ea" stroke-width="2"/><text x="44" y="182" class="cap">66：前ステップ（1P側）</text><text x="44" y="212" class="hint">前→無入力→前</text><rect x="42" y="227" width="674" height="82" rx="13" fill="#f2f6f9"/><text x="53" y="276" class="seq">1</text><circle cx="124" cy="268" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="124" y="276" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">←</text><circle cx="189" cy="268" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="189" y="276" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↓</text><circle cx="254" cy="268" r="26" fill="#206a9e" stroke="#206a9e"/><text x="254" y="276" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">→</text><circle cx="319" cy="268" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="319" y="276" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↑</text><text x="395" y="260" class="step">右を押す</text><text x="395" y="293" class="seq">→ 6</text><rect x="42" y="321" width="674" height="82" rx="13" fill="#f9fafb"/><text x="53" y="370" class="seq">2</text><circle cx="124" cy="362" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="124" y="370" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">←</text><circle cx="189" cy="362" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="189" y="370" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↓</text><circle cx="254" cy="362" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="254" y="370" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">→</text><circle cx="319" cy="362" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="319" y="370" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↑</text><text x="395" y="354" class="step">一度離す</text><text x="395" y="387" class="seq">→ 5</text><rect x="42" y="415" width="674" height="82" rx="13" fill="#f2f6f9"/><text x="53" y="464" class="seq">3</text><circle cx="124" cy="456" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="124" y="464" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">←</text><circle cx="189" cy="456" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="189" y="464" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↓</text><circle cx="254" cy="456" r="26" fill="#206a9e" stroke="#206a9e"/><text x="254" y="464" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">→</text><circle cx="319" cy="456" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="319" y="464" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↑</text><text x="395" y="448" class="step">右を再び押す</text><text x="395" y="481" class="seq">→ 6</text><text x="46" y="546" class="foot">直前に右を長く保持した場合は、まず離す位置を確認。</text><rect x="22" y="586" width="716" height="426" rx="20" fill="#fff" stroke="#dce4ea" stroke-width="2"/><text x="44" y="626" class="cap">パリィ／インパクト／ラッシュ</text><text x="44" y="656" class="hint">攻撃ボタン側の同時押し</text><rect x="42" y="671" width="674" height="82" rx="13" fill="#f2f6f9"/><text x="53" y="720" class="seq">1</text><circle cx="124" cy="712" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="124" y="720" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">←</text><circle cx="189" cy="712" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="189" y="720" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↓</text><circle cx="254" cy="712" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="254" y="720" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">→</text><circle cx="319" cy="712" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="319" y="720" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↑</text><text x="395" y="704" class="step">ドライブパリィ</text><text x="395" y="737" class="seq">→ 中P＋中K</text><rect x="42" y="765" width="674" height="82" rx="13" fill="#f9fafb"/><text x="53" y="814" class="seq">2</text><circle cx="124" cy="806" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="124" y="814" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">←</text><circle cx="189" cy="806" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="189" y="814" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↓</text><circle cx="254" cy="806" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="254" y="814" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">→</text><circle cx="319" cy="806" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="319" y="814" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↑</text><text x="395" y="798" class="step">ドライブインパクト</text><text x="395" y="831" class="seq">→ 強P＋強K</text><rect x="42" y="859" width="674" height="82" rx="13" fill="#f2f6f9"/><text x="53" y="908" class="seq">3</text><circle cx="124" cy="900" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="124" y="908" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">←</text><circle cx="189" cy="900" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="189" y="908" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↓</text><circle cx="254" cy="900" r="26" fill="#206a9e" stroke="#206a9e"/><text x="254" y="908" text-anchor="middle" class="key" fill="#fff" style="fill:#fff">→</text><circle cx="319" cy="900" r="26" fill="#e8edf0" stroke="#d4dce2"/><text x="319" y="908" text-anchor="middle" class="key" fill="#1b334b" style="fill:#22364a">↑</text><text x="395" y="892" class="step">パリィ中に前を2回</text><text x="395" y="925" class="seq">→ 66</text><text x="46" y="990" class="foot">キャンセルラッシュは通常技からの条件が別。</text><text x="30" y="1054" class="sub">出典：カプコン技表／Hit Box Arcade／記事筆者作図・運指提案　｜　2026.10.24</text></svg>
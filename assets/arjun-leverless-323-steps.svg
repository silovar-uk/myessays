<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1020" viewBox="0 0 780 1020" role="img"><rect width="780" height="1020" fill="#f8f5ef"/><style>text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#1e293b}.sub{font-size:19px;fill:#64748b}.small{font-size:18px}.heading{font-size:36px;font-weight:800}.big{font-size:31px;font-weight:800}.cmd{font-size:31px;font-weight:800;fill:#175e99}.note{font-size:21px}.white{fill:white}</style><text x="36" y="53" class="sub">INPUT LAB / 323</text><text x="36" y="105" class="heading">323を指で作る</text><text x="36" y="145" class="sub">右下を保持して、左を一回だけ押して離す</text><rect x="30" y="173" width="720" height="234" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="58" y="220" class="cmd">STEP 1</text><text x="210" y="220" class="big">まず右＋下を押す</text><circle cx="101" cy="304" r="34" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/><text x="83" y="315" class="big">←</text><circle cx="201" cy="304" r="34" fill="#246fa7" stroke="#246fa7" stroke-width="2"/><text x="183" y="315" class="white">↓</text><circle cx="301" cy="304" r="34" fill="#246fa7" stroke="#246fa7" stroke-width="2"/><text x="283" y="315" class="white">→</text><circle cx="221" cy="396" r="34" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/><text x="203" y="407" class="big">↑</text><text x="66" y="256" class="small">押している方向ボタン</text><text x="530" y="307" class="heading">↘</text><text x="530" y="344" class="small">画面上の方向＝3</text><rect x="30" y="426" width="720" height="234" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="58" y="473" class="cmd">STEP 2</text><text x="210" y="473" class="big">右＋下を保持したまま左を追加</text><circle cx="101" cy="557" r="34" fill="#246fa7" stroke="#246fa7" stroke-width="2"/><text x="83" y="568" class="white">←</text><circle cx="201" cy="557" r="34" fill="#246fa7" stroke="#246fa7" stroke-width="2"/><text x="183" y="568" class="white">↓</text><circle cx="301" cy="557" r="34" fill="#246fa7" stroke="#246fa7" stroke-width="2"/><text x="283" y="568" class="white">→</text><circle cx="221" cy="649" r="34" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/><text x="203" y="660" class="big">↑</text><text x="66" y="509" class="small">押している方向ボタン</text><text x="530" y="560" class="heading">↓</text><text x="530" y="597" class="small">左右が相殺され、下だけ＝2</text><rect x="30" y="679" width="720" height="234" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="58" y="726" class="cmd">STEP 3</text><text x="210" y="726" class="big">左だけ離してパンチ</text><circle cx="101" cy="810" r="34" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/><text x="83" y="821" class="big">←</text><circle cx="201" cy="810" r="34" fill="#246fa7" stroke="#246fa7" stroke-width="2"/><text x="183" y="821" class="white">↓</text><circle cx="301" cy="810" r="34" fill="#246fa7" stroke="#246fa7" stroke-width="2"/><text x="283" y="821" class="white">→</text><circle cx="221" cy="902" r="34" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/><text x="203" y="913" class="big">↑</text><text x="66" y="762" class="small">押している方向ボタン</text><text x="530" y="813" class="heading">↘＋P</text><text x="530" y="850" class="small">下と右が復活＝3。ここで方向完成</text><rect x="30" y="950" width="720" height="51" rx="20" fill="#e7f0f8" stroke="#e7f0f8" stroke-width="2"/><text x="48" y="982" class="note">入力履歴：↘ → ↓ → ↘＋P になっているかを確認</text></svg>
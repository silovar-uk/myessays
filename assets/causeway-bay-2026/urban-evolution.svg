<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="t d"><title id="t">銅鑼湾の都市機能の変遷</title><desc id="d">港湾・産業、娯楽、広域商業、体験・公共空間の4段階。歴史を単純化した概念図であり、各機能は重なって存在する。</desc><rect width="1120" height="300" fill="#f7fafc"/><text x="36" y="39" font-family="sans-serif" font-weight="700" font-size="25" fill="#142e40">銅鑼湾は「買い物の街」として生まれたわけではない</text><text x="36" y="68" font-family="sans-serif" font-size="14" fill="#51616b">時代ごとに主要な来訪目的が加わった｜概念図（機能は現在も重なり合う）</text><g font-family="sans-serif" text-anchor="middle"><rect x="34" y="101" width="244" height="127" rx="14" fill="#d9ebeb"/><text x="156" y="134" font-size="15" fill="#365b63">19世紀まで〜</text><text x="156" y="172" font-size="26" font-weight="700" fill="#123d49">港湾・産業</text><text x="156" y="201" font-size="14" fill="#365b63">漁業／船舶／工場</text><rect x="303" y="101" width="244" height="127" rx="14" fill="#d8e8f5"/><text x="425" y="134" font-size="15" fill="#395a77">1920年代〜</text><text x="425" y="172" font-size="26" font-weight="700" fill="#163e66">娯楽の街</text><text x="425" y="201" font-size="14" fill="#395a77">遊楽場／劇場</text><rect x="572" y="101" width="244" height="127" rx="14" fill="#f5e7d7"/><text x="694" y="134" font-size="15" fill="#76583c">1980〜90年代〜</text><text x="694" y="172" font-size="26" font-weight="700" fill="#815128">広域商業</text><text x="694" y="201" font-size="14" fill="#76583c">百貨店／大型商業施設</text><rect x="841" y="101" width="244" height="127" rx="14" fill="#e7e5f5"/><text x="963" y="134" font-size="15" fill="#625d86">2020年代〜</text><text x="963" y="172" font-size="23" font-weight="700" fill="#494174">体験・公共空間</text><text x="963" y="201" font-size="14" fill="#625d86">催事／水辺の再整備</text><text x="290" y="175" font-size="25" fill="#65737b">→</text><text x="559" y="175" font-size="25" fill="#65737b">→</text><text x="828" y="175" font-size="25" fill="#65737b">→</text></g><text x="36" y="266" font-family="sans-serif" font-size="14" fill="#51616b">出典：香港古物古蹟弁事処、希慎興業、香港政府観光局、香港海濱事務委員会をもとに作成</text></svg>
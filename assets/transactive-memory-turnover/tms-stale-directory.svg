<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">古い知識地図と更新された知識地図</title><desc id="desc">旧担当者に向かう検索経路が、新任者の実際の専門性とずれている状態と、再マッピング後の状態を比較する。</desc><rect width="1200" height="675" rx="36" fill="#F7F4EE"/><text x="64" y="78" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="800" fill="#A51C30">DIRECTORY UPDATE</text><text x="64" y="128" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="900" fill="#1F2328">引き継ぎで直すべきは、資料より先に「矢印」かもしれない。</text><g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="300" y="195" text-anchor="middle" font-size="24" font-weight="900" fill="#59636E">古い地図</text><text x="900" y="195" text-anchor="middle" font-size="24" font-weight="900" fill="#A51C30">更新後</text><rect x="70" y="235" width="460" height="315" rx="28" fill="#FFFFFF" stroke="#D8D1C7" stroke-width="3"/><rect x="670" y="235" width="460" height="315" rx="28" fill="#FFFFFF" stroke="#A51C30" stroke-width="3"/><circle cx="175" cy="390" r="55" fill="#1F2328"/><text x="175" y="398" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">質問者</text><circle cx="425" cy="320" r="58" fill="#C7C1B8"/><text x="425" y="327" text-anchor="middle" font-size="20" font-weight="900" fill="#1F2328">旧担当</text><circle cx="425" cy="470" r="58" fill="#A51C30"/><text x="425" y="477" text-anchor="middle" font-size="20" font-weight="900" fill="#FFFFFF">新任</text><path d="M235 375 C300 340 340 328 365 322" fill="none" stroke="#59636E" stroke-width="9" stroke-linecap="round"/><path d="M350 300 L370 322 L345 338" fill="none" stroke="#59636E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="292" text-anchor="middle" font-size="18" fill="#59636E">契約ならここ</text><line x1="365" y1="460" x2="250" y2="410" stroke="#D8D1C7" stroke-width="5" stroke-dasharray="12 12"/><circle cx="775" cy="390" r="55" fill="#1F2328"/><text x="775" y="398" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">質問者</text><circle cx="1015" cy="320" r="58" fill="#FFFFFF" stroke="#59636E" stroke-width="4"/><text x="1015" y="314" text-anchor="middle" font-size="18" font-weight="900" fill="#1F2328">新任</text><text x="1015" y="339" text-anchor="middle" font-size="16" fill="#59636E">法務・審査</text><circle cx="1015" cy="470" r="58" fill="#FFFFFF" stroke="#A51C30" stroke-width="4"/><text x="1015" y="464" text-anchor="middle" font-size="18" font-weight="900" fill="#A51C30">別メンバー</text><text x="1015" y="489" text-anchor="middle" font-size="16" fill="#59636E">過去経緯</text><path d="M835 375 C900 345 940 328 955 322" fill="none" stroke="#59636E" stroke-width="7" stroke-linecap="round"/><path d="M835 405 C900 442 940 462 955 468" fill="none" stroke="#A51C30" stroke-width="7" stroke-linecap="round"/><text x="900" y="292" text-anchor="middle" font-size="17" fill="#59636E">審査は新任</text><text x="900" y="505" text-anchor="middle" font-size="17" fill="#A51C30">経緯は別ルート</text><text x="600" y="620" text-anchor="middle" font-size="24" font-weight="900" fill="#1F2328">後任は「前任者の空欄を埋める人」ではなく、地図を書き換えるきっかけ。</text></g></svg>
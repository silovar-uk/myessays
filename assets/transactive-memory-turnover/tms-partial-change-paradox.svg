<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">一人だけ交代したチームの逆説</title><desc id="desc">安定チーム、一人だけ交代、全員再編の三条件を並べ、一人だけ交代したチームが古い役割分担を引きずる概念を示す。</desc><rect width="1200" height="675" rx="36" fill="#F7F4EE"/><text x="64" y="78" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="800" fill="#A51C30">LEWIS ET AL. / 2007</text><text x="64" y="128" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="900" fill="#1F2328">一人だけ替えると、古い地図が残る。</text><g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><rect x="60" y="190" width="330" height="380" rx="28" fill="#FFFFFF" stroke="#D8D1C7" stroke-width="3"/><rect x="435" y="190" width="330" height="380" rx="28" fill="#FFF4F1" stroke="#A51C30" stroke-width="5"/><rect x="810" y="190" width="330" height="380" rx="28" fill="#FFFFFF" stroke="#D8D1C7" stroke-width="3"/><text x="225" y="235" text-anchor="middle" font-size="26" font-weight="900" fill="#1F2328">安定</text><text x="600" y="235" text-anchor="middle" font-size="26" font-weight="900" fill="#A51C30">一人だけ交代</text><text x="975" y="235" text-anchor="middle" font-size="26" font-weight="900" fill="#1F2328">全員再編</text><g fill="#1F2328"><circle cx="155" cy="325" r="48"/><circle cx="225" cy="415" r="48"/><circle cx="295" cy="325" r="48"/></g><g fill="#1F2328"><circle cx="530" cy="325" r="48"/><circle cx="600" cy="415" r="48"/></g><circle cx="670" cy="325" r="48" fill="#A51C30"/><g fill="#A51C30"><circle cx="905" cy="325" r="48"/><circle cx="975" cy="415" r="48"/><circle cx="1045" cy="325" r="48"/></g><text x="225" y="500" text-anchor="middle" font-size="21" font-weight="700" fill="#59636E">地図と人が一致</text><text x="600" y="500" text-anchor="middle" font-size="21" font-weight="800" fill="#A51C30">地図だけ旧チームのまま</text><text x="975" y="500" text-anchor="middle" font-size="21" font-weight="700" fill="#59636E">新しい地図を作り直す</text><text x="600" y="625" text-anchor="middle" font-size="24" font-weight="900" fill="#1F2328">問題は「知識が消える」だけでなく、「知識の住所が間違う」こと。</text></g></svg>
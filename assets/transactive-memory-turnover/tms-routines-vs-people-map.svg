<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">ルーティンとトランザクティブメモリーの違い</title><desc id="desc">安定した反復業務はルーティンに、例外や不確実な問題は人の専門性を結ぶトランザクティブメモリーに向くという役割分担を示す。</desc><rect width="1200" height="675" rx="36" fill="#F7F4EE"/><text x="64" y="78" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="800" fill="#A51C30">TWO ORGANIZATIONAL MEMORIES</text><text x="64" y="128" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="900" fill="#1F2328">全部を人に残す必要も、全部を手順書にする必要もない。</text><g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><rect x="70" y="200" width="490" height="360" rx="30" fill="#FFFFFF" stroke="#59636E" stroke-width="3"/><rect x="640" y="200" width="490" height="360" rx="30" fill="#FFF4F1" stroke="#A51C30" stroke-width="3"/><text x="315" y="255" text-anchor="middle" font-size="30" font-weight="900" fill="#1F2328">ROUTINES</text><text x="315" y="292" text-anchor="middle" font-size="22" font-weight="800" fill="#59636E">手順・型・反復</text><text x="885" y="255" text-anchor="middle" font-size="30" font-weight="900" fill="#A51C30">TMS</text><text x="885" y="292" text-anchor="middle" font-size="22" font-weight="800" fill="#A51C30">誰が何を知るか・連携</text><g font-size="21" fill="#1F2328"><text x="115" y="355">✓ 繰り返しが多い</text><text x="115" y="405">✓ 入れ替わりに比較的強い</text><text x="115" y="455">✓ 標準化しやすい</text><text x="685" y="355">✓ 例外・曖昧さが多い</text><text x="685" y="405">✓ 専門性の組合せが効く</text><text x="685" y="455">✓ 新しい問題に適応しやすい</text></g><text x="315" y="515" text-anchor="middle" font-size="20" font-weight="700" fill="#59636E">「どうやるか」を残す</text><text x="885" y="515" text-anchor="middle" font-size="20" font-weight="700" fill="#A51C30">「誰と解くか」を残す</text><text x="600" y="625" text-anchor="middle" font-size="24" font-weight="900" fill="#1F2328">引き継ぎは、知識をコピーする作業ではなく「どちらに残すか」を設計する作業。</text></g></svg>
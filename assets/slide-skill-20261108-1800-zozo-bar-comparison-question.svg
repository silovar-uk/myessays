<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><rect width="960" height="470" fill="#f7f9fc"/><text x="32" y="45" font-size="26" font-family="sans-serif" fill="#182b49">縦棒グラフ：数字より先に比較の問いを置く</text><text x="32" y="78" font-size="16" font-family="sans-serif" fill="#566">架空データ／実在するZOZO資料の再現ではありません</text><rect x="30" y="105" width="420" height="310" rx="12" fill="white" stroke="#cbd5e1"/><rect x="510" y="105" width="420" height="310" rx="12" fill="white" stroke="#cbd5e1"/><text x="55" y="142" font-size="22" font-family="sans-serif">Before：売上</text><text x="535" y="142" font-size="21" font-family="sans-serif">After：どの年度で伸びが鈍化？</text><g fill="#93a4b8"><rect x="105" y="260" width="70" height="110"/><rect x="210" y="225" width="70" height="145"/><rect x="315" y="210" width="70" height="160"/></g><g fill="#2576c5"><rect x="590" y="260" width="70" height="110"/><rect x="695" y="225" width="70" height="145"/></g><rect x="800" y="210" width="70" height="160" fill="#e69534"/><g font-family="sans-serif" font-size="17" fill="#334155"><text x="118" y="395">1年</text><text x="223" y="395">2年</text><text x="328" y="395">3年</text><text x="603" y="395">1年</text><text x="708" y="395">2年</text><text x="813" y="395">3年</text></g><text x="570" y="183" font-size="17" font-family="sans-serif" fill="#9a4b10">増分：+35 → +15（架空）</text><text x="35" y="445" font-size="16" font-family="sans-serif" fill="#475569">比較の問い・増分・注記を追加すると、読者が見る場所を決められる。</text></svg>
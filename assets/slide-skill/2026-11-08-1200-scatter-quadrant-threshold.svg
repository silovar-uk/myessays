<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="散布図で売上規模と成長率を比較し、投資候補を右上に置く。数値は架空。"><rect width="900" height="480" fill="#fff"/><text x="48" y="42" font-size="25" font-family="sans-serif" fill="#172b4d">散布図：規模と成長性を分けて判断</text><text x="48" y="70" font-size="15" font-family="sans-serif">架空データ・閾値は例示（売上10億円、成長率10%）</text><line x1="120" y1="392" x2="828" y2="392" stroke="#334155" stroke-width="3"/><line x1="120" y1="392" x2="120" y2="98" stroke="#334155" stroke-width="3"/><line x1="475" y1="98" x2="475" y2="392" stroke="#94a3b8" stroke-dasharray="8 7"/><line x1="120" y1="245" x2="828" y2="245" stroke="#94a3b8" stroke-dasharray="8 7"/><text x="360" y="447" font-size="19" font-family="sans-serif">市場規模（億円）→</text><text x="23" y="105" font-size="16" font-family="sans-serif">成長率↑</text><text x="488" y="116" font-size="16" fill="#166534" font-family="sans-serif">優先検証候補</text><text x="137" y="116" font-size="16" fill="#475569" font-family="sans-serif">小規模・高成長</text><text x="137" y="374" font-size="16" fill="#475569" font-family="sans-serif">小規模・低成長</text><text x="488" y="374" font-size="16" fill="#475569" font-family="sans-serif">大規模・低成長</text><circle cx="652" cy="160" r="18" fill="#0d9488"/><text x="679" y="164" font-size="19" font-family="sans-serif">A</text><circle cx="316" cy="186" r="18" fill="#f59e0b"/><text x="343" y="190" font-size="19" font-family="sans-serif">B</text><circle cx="708" cy="315" r="18" fill="#64748b"/><text x="735" y="319" font-size="19" font-family="sans-serif">C</text><text x="462" y="415" font-size="14" font-family="sans-serif">10</text><text x="91" y="250" font-size="14" font-family="sans-serif">10%</text><text x="48" y="469" font-size="13" font-family="sans-serif">注：円の大きさは意味を持たない。市場規模・成長率のみを比較。</text></svg>
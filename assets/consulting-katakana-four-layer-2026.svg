<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">「理解した」は「承認した」ではない</title><desc id="d">理解、妥当、同意、承認の区別を示す四つの列の図。</desc><rect width="1200" height="540" fill="#f8fafc"/><text x="64" y="68" fill="#152735" font-family="Noto Sans JP, sans-serif" font-size="36" font-weight="700">「メイクセンスです」で、どこまで決まった？</text><text x="64" y="106" fill="#607487" font-family="Noto Sans JP, sans-serif" font-size="20">似た返事の違いを、四つの状態で見分ける</text><g font-family="Noto Sans JP, sans-serif"><rect x="64" y="158" width="247" height="236" rx="18" fill="#e5effa"/><text x="87" y="209" font-size="28" font-weight="700" fill="#254868">理解</text><text x="87" y="252" font-size="21" fill="#254868">メイクセンス</text><text x="87" y="296" font-size="19" fill="#254868">「説明は分かった」</text><text x="87" y="332" font-size="17" fill="#254868">採用するとは限らない</text><path d="M322 275 l23 0 m-11 -10 l11 10 -11 10" stroke="#7b8998" stroke-width="4" fill="none"/><rect x="351" y="158" width="247" height="236" rx="18" fill="#e8f6ef"/><text x="374" y="209" font-size="28" font-weight="700" fill="#20654d">妥当性</text><text x="374" y="252" font-size="21" fill="#20654d">フェア</text><text x="374" y="296" font-size="19" fill="#20654d">「その指摘はもっとも」</text><text x="374" y="332" font-size="17" fill="#20654d">積極的な賛成と別</text><path d="M609 275 l23 0 m-11 -10 l11 10 -11 10" stroke="#7b8998" stroke-width="4" fill="none"/><rect x="638" y="158" width="247" height="236" rx="18" fill="#fff1df"/><text x="661" y="209" font-size="28" font-weight="700" fill="#855a2a">同意・支持</text><text x="661" y="252" font-size="21" fill="#855a2a">アグリー / バイイン</text><text x="661" y="296" font-size="19" fill="#855a2a">「方向性に賛成」</text><text x="661" y="332" font-size="17" fill="#855a2a">決裁権は別問題</text><path d="M896 275 l23 0 m-11 -10 l11 10 -11 10" stroke="#7b8998" stroke-width="4" fill="none"/><rect x="925" y="158" width="211" height="236" rx="18" fill="#f4e7f7"/><text x="948" y="209" font-size="28" font-weight="700" fill="#674270">正式承認</text><text x="948" y="252" font-size="21" fill="#674270">オーソライズ</text><text x="948" y="296" font-size="19" fill="#674270">「決裁された」</text><text x="948" y="332" font-size="17" fill="#674270">権限・記録が必要</text></g><text x="64" y="447" fill="#425a6d" font-family="Noto Sans JP, sans-serif" font-size="21" font-weight="700">会議後に確認すべきこと：何が理解され、何に同意し、誰が正式に決めたか。</text><text x="64" y="487" fill="#607487" font-family="Noto Sans JP, sans-serif" font-size="17">※ 厳密な承認プロセスの順番ではなく、混同しやすい状態を並べた概念図。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 515" width="1200" height="515"><style>text{font-family:Arial,'Noto Sans JP','Yu Gothic',sans-serif}</style><rect width="1200" height="515" fill="#f7f5ef"/><text x="44" y="64" fill="#172536" font-size="33" font-weight="750">「自信過剰」は、少なくとも三つに分けて考える</text><rect x="43" y="108" width="337" height="327" rx="22" fill="#fff"/><rect x="62" y="132" width="296" height="45" rx="22" fill="#e5efff"/><text x="73" y="162" fill="#172536" font-size="16" font-weight="740">OVERESTIMATION</text><text x="69" y="229" fill="#172536" font-size="26" font-weight="700">過大評価</text><text x="69" y="299" fill="#172536" font-size="19" font-weight="650">「この提案は80点だ」</text><text x="69" y="364" fill="#5a6a78" font-size="17" font-weight="500">実際の出来を高く見積もる</text><rect x="432" y="108" width="337" height="327" rx="22" fill="#fff"/><rect x="451" y="132" width="296" height="45" rx="22" fill="#ddf3e7"/><text x="462" y="162" fill="#172536" font-size="16" font-weight="740">OVERPLACEMENT</text><text x="458" y="229" fill="#172536" font-size="26" font-weight="700">相対的な過大配置</text><text x="458" y="299" fill="#172536" font-size="19" font-weight="650">「同僚より優れている」</text><text x="458" y="364" fill="#5a6a78" font-size="17" font-weight="500">他人との比較で自分を上位に置く</text><rect x="820" y="108" width="337" height="327" rx="22" fill="#fff"/><rect x="839" y="132" width="296" height="45" rx="22" fill="#ffe5e0"/><text x="850" y="162" fill="#172536" font-size="16" font-weight="740">OVERPRECISION</text><text x="846" y="229" fill="#172536" font-size="26" font-weight="700">過剰な確実視</text><text x="846" y="299" fill="#172536" font-size="19" font-weight="650">「結論はほぼ確実だ」</text><text x="846" y="364" fill="#5a6a78" font-size="17" font-weight="500">不確実性を小さく見積もる</text><text x="44" y="485" fill="#5a6a78" font-size="18" font-weight="500">出典：Moore &amp; Healy（2008）の概念分類。発言は説明用の仮想例。</text></svg>

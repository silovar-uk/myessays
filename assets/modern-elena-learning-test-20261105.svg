<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc"><title id="title">教材三種類と場面三種類の概念比較</title><desc id="desc">基本行動のみ、条件による切り替え、前提の再点検という三つの教材を、予想どおり、防御変化、予想外の空振りという三場面に照合した設計上の思考実験</desc><rect width="1200" height="535" rx="28" fill="#f5f8fb"/><g font-family="Noto Sans CJK JP,Arial,sans-serif"><text x="52" y="59" font-size="32" font-weight="700" fill="#19354d">三つの教材 × 三つの場面</text><text x="52" y="95" font-size="18" fill="#51667a">対応できる判断を比較した思考実験。勝率などの実測ではありません。</text><rect x="52" y="133" width="1096" height="68" rx="12" fill="#1f4565"/><g fill="#fff" font-size="22" text-anchor="middle"><text x="220" y="176">教材</text><text x="557" y="176">予想どおり</text><text x="816" y="176">防御が変化</text><text x="1040" y="176">予想外の空振り</text></g><rect x="52" y="208" width="1096" height="75" rx="12" fill="#e4eef6"/><rect x="52" y="291" width="1096" height="75" rx="12" fill="#e4eef6"/><rect x="52" y="374" width="1096" height="75" rx="12" fill="#e4eef6"/><g font-size="22" fill="#1b3d57" font-weight="700"><text x="88" y="254">A｜技だけを教える</text><text x="88" y="337">B｜結果で切り替える</text><text x="88" y="420">C｜前提も点検する</text></g><g font-size="36" text-anchor="middle" font-weight="700"><g fill="#18866c"><text x="557" y="254">●</text><text x="557" y="337">●</text><text x="816" y="337">●</text><text x="557" y="420">●</text><text x="816" y="420">●</text><text x="1040" y="420">●</text></g><g fill="#a6b5c4"><text x="816" y="254">－</text><text x="1040" y="254">－</text><text x="1040" y="337">－</text></g></g><text x="600" y="495" font-size="18" text-anchor="middle" fill="#566b7f">● 判断の入口を教材が示す　　－ 判断の入口を教材が指定しない</text></g></svg>
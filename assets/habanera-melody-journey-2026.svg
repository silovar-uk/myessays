<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460"><rect width="1120" height="460" rx="26" fill="#f8f5ef"/><text x="55" y="69" fill="#1d2939" font-size="33" font-weight="700" font-family="sans-serif">知っていた旋律にも、別の原曲があった</text><text x="55" y="109" fill="#667085" font-size="18" font-family="sans-serif">音楽の移動と再構成。最後の連想は、引用確定を意味しない。</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="170" width="221" height="146" rx="18" fill="#e1ebf6"/><text x="165" y="209" font-size="17" fill="#344054">19世紀のキューバ</text><text x="165" y="250" font-size="22" fill="#101828" font-weight="700">ハバネラの形式</text><text x="165" y="283" font-size="15" fill="#667085">舞曲・リズムの文化</text><rect x="321" y="170" width="221" height="146" rx="18" fill="#e8e2f0"/><text x="431" y="209" font-size="17" fill="#344054">スペイン</text><text x="431" y="250" font-size="22" fill="#101828" font-weight="700">『エル・アレグリート』</text><text x="431" y="283" font-size="15" fill="#667085">セバスティアン・イラディエ</text><rect x="587" y="170" width="221" height="146" rx="18" fill="#f6e2dc"/><text x="697" y="209" font-size="17" fill="#344054">フランス・1875年</text><text x="697" y="250" font-size="22" fill="#101828" font-weight="700">『カルメン』</text><text x="697" y="283" font-size="15" fill="#667085">ビゼーによる再構成</text><rect x="853" y="170" width="221" height="146" rx="18" fill="#f7e8b4"/><text x="963" y="209" font-size="17" fill="#344054">日本・2026年</text><text x="963" y="250" font-size="22" fill="#101828" font-weight="700">「無礼な！」で連想</text><text x="963" y="283" font-size="15" fill="#667085">聴き手の記憶</text></g><g stroke="#7a8699" stroke-width="5" fill="none"><path d="M282 245 H310 M299 236 L310 245 L299 254"/><path d="M548 245 H576 M565 236 L576 245 L565 254"/><path d="M814 245 H842 M831 236 L842 245 L831 254"/></g><text x="56" y="383" fill="#39485a" font-family="sans-serif" font-size="18">史実で確認できる系譜：キューバ由来の様式 → イラディエの歌曲 → ビゼーによる借用。</text><text x="56" y="416" fill="#9a5a37" font-family="sans-serif" font-size="18">未確認：ポルカドットスティングレイが意図的に「ハバネラ」を引用したかどうか。</text></svg>
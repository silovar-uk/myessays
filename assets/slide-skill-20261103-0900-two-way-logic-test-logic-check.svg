<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-labelledby="title desc"><title id="title">結論と根拠をWhy soとSo whatで往復検査する図</title><desc id="desc">中央に暫定結論、下に根拠3つ。結論から根拠に「なぜそう言える」、根拠から結論に「だから何を決める」を問い、両方向に論理の飛躍がないか確かめる。</desc><rect width="1400" height="800" fill="#f3f7fb"/><text x="48" y="61" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="39" font-weight="700" fill="#102d49">結論と根拠は、上下に往復して検査する</text><text x="50" y="104" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#526a7f">論点設計の検算：Why so?（なぜ？）／So what?（だから？）</text><rect x="190" y="145" width="1020" height="136" rx="18" fill="#102e4b" stroke="#102e4b" stroke-width="2"/><text x="231" y="195" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="32" font-weight="700" fill="#ffffff">暫定結論｜全店増員は保留し、混雑2店を再計測する</text><text x="231" y="242" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="400" fill="#c8e7ef">判断：次の2試合で待機人数・待ち時間・処理能力を測る</text><rect x="170" y="338" width="510" height="69" rx="15" fill="#fff1dc" stroke="#f1d49c" stroke-width="2"/><text x="194" y="381" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="25" font-weight="700" fill="#86561c">Why so?｜なぜ、その判断なのか</text><rect x="725" y="338" width="505" height="69" rx="15" fill="#dff5f1" stroke="#b6e4d9" stroke-width="2"/><text x="749" y="381" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="25" font-weight="700" fill="#086a65">So what?｜根拠から何を決めるか</text><path d="M441 300 L441 327" stroke="#c18a36" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M432 315 L441 327 L450 315" stroke="#c18a36" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M978 425 L978 450" stroke="#147c7c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M969 438 L978 450 L987 438" stroke="#147c7c" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="64" y="477" width="406" height="200" rx="16" fill="#ffffff" stroke="#c8dbe9" stroke-width="2"/><rect x="496" y="477" width="406" height="200" rx="16" fill="#ffffff" stroke="#c8dbe9" stroke-width="2"/><rect x="928" y="477" width="406" height="200" rx="16" fill="#ffffff" stroke="#c8dbe9" stroke-width="2"/><text x="89" y="529" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="27" font-weight="700" fill="#17384f">根拠①｜偏りがある</text><text x="89" y="581" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="26" font-weight="400" fill="#19364b">待機人数の68％が</text><text x="89" y="621" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="26" font-weight="400" fill="#19364b">2店舗に集中</text><text x="520" y="529" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="27" font-weight="700" fill="#17384f">根拠②｜原因が未確定</text><text x="520" y="581" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#19364b">人員不足・導線・提供速度</text><text x="520" y="621" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="400" fill="#19364b">の寄与が未検証</text><text x="952" y="529" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="26" font-weight="700" fill="#17384f">根拠③｜全店策は未検証</text><text x="952" y="581" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#19364b">全店増員の効果と費用を</text><text x="952" y="621" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="400" fill="#19364b">比較できていない</text><text x="64" y="729" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="400" fill="#5a6f80">※数値は説明用の架空データ。1試合の観察から恒常的な原因は断定できない。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250"><rect width="900" height="250" fill="#f8fafc"/><text x="30" y="40" font-family="sans-serif" font-size="25" fill="#172554">判断は「記録」だけでは継承されない</text><rect x="25" y="85" width="202" height="95" rx="12" fill="#e0f2fe"/><text x="35" y="139" font-family="sans-serif" font-size="17" fill="#0f172a">共同化｜一緒に経験</text><text x="211" y="135" font-size="24">→</text><rect x="245" y="85" width="202" height="95" rx="12" fill="#dbeafe"/><text x="255" y="139" font-family="sans-serif" font-size="17" fill="#0f172a">表出化｜理由を言語化</text><text x="431" y="135" font-size="24">→</text><rect x="465" y="85" width="202" height="95" rx="12" fill="#e0f2fe"/><text x="475" y="139" font-family="sans-serif" font-size="17" fill="#0f172a">連結化｜判断表に整理</text><text x="651" y="135" font-size="24">→</text><rect x="685" y="85" width="202" height="95" rx="12" fill="#dbeafe"/><text x="695" y="139" font-family="sans-serif" font-size="17" fill="#0f172a">内面化｜実務で試す</text><text x="30" y="220" font-family="sans-serif" font-size="16" fill="#475569">再び経験を共有し、判断基準を更新する（概念図・数値なし）</text></svg>
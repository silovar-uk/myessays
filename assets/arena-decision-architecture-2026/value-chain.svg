<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 525" role="img" aria-label="アリーナ事業の価値と収益の流れ">
<rect width="1100" height="525" rx="22" fill="#f6f4ed"/><g font-family="Arial,'Noto Sans JP','Yu Gothic',sans-serif"><text x="47" y="58" font-size="32" font-weight="700" fill="#172631">建物は一つでも、事業は一つではない</text><text x="47" y="89" font-size="18" fill="#52676f">投資前に「誰が売り、誰が受け取り、誰が負担するか」を分離する</text>
<rect x="45" y="123" width="235" height="245" rx="16" fill="#e0eae7"/><text x="62" y="163" font-size="19" font-weight="700" fill="#146b61">需要をつくる</text><text x="62" y="205" font-size="24" font-weight="700" fill="#182b32">興行主・クラブ</text><text x="62" y="244" font-size="16" fill="#36545c">スポーツ・音楽・催事</text><text x="62" y="276" font-size="16" fill="#36545c">チケット・協賛</text><text x="62" y="308" font-size="16" fill="#36545c">開催の意思・予約</text>
<rect x="304" y="123" width="235" height="245" rx="16" fill="#e9e2d6"/><text x="321" y="163" font-size="19" font-weight="700" fill="#8e6222">施設を動かす</text><text x="321" y="205" font-size="24" font-weight="700" fill="#182b32">運営会社</text><text x="321" y="244" font-size="16" fill="#36545c">貸館・飲食・広告</text><text x="321" y="276" font-size="16" fill="#36545c">警備・転換・営業</text><text x="321" y="308" font-size="16" fill="#36545c">イベントごとの利益</text>
<rect x="563" y="123" width="235" height="245" rx="16" fill="#e4e3ed"/><text x="580" y="163" font-size="19" font-weight="700" fill="#605996">資産を保有する</text><text x="580" y="205" font-size="24" font-weight="700" fill="#182b32">建物・土地所有者</text><text x="580" y="244" font-size="16" fill="#36545c">建設費・借入</text><text x="580" y="276" font-size="16" fill="#36545c">賃料・設備更新</text><text x="580" y="308" font-size="16" fill="#36545c">長期投資回収</text>
<rect x="822" y="123" width="235" height="245" rx="16" fill="#dce6f2"/><text x="839" y="163" font-size="19" font-weight="700" fill="#386c99">公共価値を測る</text><text x="839" y="205" font-size="24" font-weight="700" fill="#182b32">自治体・住民</text><text x="839" y="244" font-size="16" fill="#36545c">市民利用・交通</text><text x="839" y="276" font-size="16" fill="#36545c">公費・騒音・防災</text><text x="839" y="308" font-size="16" fill="#36545c">地域の純増便益</text>
<text x="278" y="254" font-size="27" fill="#58747c">›</text><text x="537" y="254" font-size="27" fill="#58747c">›</text><text x="796" y="254" font-size="27" fill="#58747c">›</text>
<rect x="45" y="395" width="1012" height="75" rx="11" fill="#fff" stroke="#ccd9d7"/><text x="65" y="425" font-size="18" fill="#152d33" font-weight="700">同じ「年間来場者100万人」でも、4者の成果は同じではない</text><text x="65" y="453" font-size="16" fill="#536771">来場者数 ≠ 施設利益 ≠ 投資回収 ≠ 地域の純便益</text><text x="45" y="498" font-size="15" fill="#6c7d83">編集図解｜事業主体は契約によって重なる場合も分かれる場合もある</text></g></svg>
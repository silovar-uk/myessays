<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560"><title>STAR KITCHEN 事業転換の時系列</title><rect width="760" height="560" rx="18" fill="#faf7f0"/><g font-family="system-ui, sans-serif" fill="#292c30"><text x="36" y="47" font-size="25" font-weight="bold">商品と顧客の変化</text><text x="36" y="76" font-size="15" fill="#666">2013–2026 / Chronology</text><path d="M82 112V484" stroke="#a74130" stroke-width="3" fill="none"/><circle cx="82" cy="126" r="7" fill="#a74130"/><text x="105" y="130" font-size="17" fill="#a74130" font-weight="bold">2013</text><rect x="240" y="100" width="480" height="66" rx="9" fill="#fff" stroke="#ded8cb"/><text x="260" y="125" font-size="19" font-weight="bold">料理教室 → ケーキ販売</text><text x="260" y="148" font-size="15" fill="#555">現地顧客・贈答ニーズ</text><circle cx="82" cy="209" r="7" fill="#a74130"/><text x="105" y="213" font-size="17" fill="#a74130" font-weight="bold">2014–18</text><rect x="240" y="183" width="480" height="66" rx="9" fill="#fff" stroke="#ded8cb"/><text x="260" y="208" font-size="19" font-weight="bold">洋菓子卸売・高島屋出店</text><text x="260" y="231" font-size="15" fill="#555">製造能力・法人取引・信用</text><circle cx="82" cy="292" r="7" fill="#a74130"/><text x="105" y="296" font-size="17" fill="#a74130" font-weight="bold">2018</text><rect x="240" y="266" width="480" height="66" rx="9" fill="#fff" stroke="#ded8cb"/><text x="260" y="291" font-size="19" font-weight="bold">バインミーラスク</text><text x="260" y="314" font-size="15" fill="#555">常温・個包装の土産菓子</text><circle cx="82" cy="375" r="7" fill="#a74130"/><text x="105" y="379" font-size="17" fill="#a74130" font-weight="bold">2021</text><rect x="240" y="349" width="480" height="66" rx="9" fill="#fff" stroke="#ded8cb"/><text x="260" y="374" font-size="19" font-weight="bold">土産商品の全国展開</text><text x="260" y="397" font-size="15" fill="#555">観光客向け販路</text><circle cx="82" cy="458" r="7" fill="#a74130"/><text x="105" y="462" font-size="17" fill="#a74130" font-weight="bold">2025–26</text><rect x="240" y="432" width="480" height="66" rx="9" fill="#fff" stroke="#ded8cb"/><text x="260" y="457" font-size="19" font-weight="bold">国内直営店・タイ進出</text><text x="260" y="480" font-size="15" fill="#555">地域文化に合わせた商品企画</text><text x="36" y="535" font-size="13" fill="#666">出典：公式沿革・JETRO・創業者取材に基づく整理。因果を証明する図ではない。</text></g></svg>
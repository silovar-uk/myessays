<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-labelledby="t d"><title id="t">ダマスカス鋼の二つの系統と現代積層包丁の断面</title><desc id="d">左はウーツ鋼の炭化物帯模様、中央は異種鋼材を接合する模様、右は芯材を積層外層で挟む現代の包丁。模式図であり実物の顕微鏡画像ではない。</desc><rect width="1200" height="670" fill="#f8f7f3"/><style>text{font-family:Arial,'Noto Sans JP',sans-serif;fill:#283442}.h{font-size:33px;font-weight:700}.sub{font-size:17px}.card{fill:#fff;stroke:#d4d9d7;stroke-width:2}.ct{font-size:23px;font-weight:700}.cap{font-size:17px}.small{font-size:14px;fill:#59656d}.line{fill:none;stroke-linecap:round}.x{stroke:#2f5058}.y{stroke:#9e8266}.z{stroke:#d1bd8e}</style><text class="h" x="50" y="62">「同じ波模様」でも、仕組みは違う</text><text class="sub" x="50" y="100">図は概念を説明する模式図。断面の縮尺・成分比・実際の製造工程を再現したものではない。</text><g><rect class="card" x="35" y="140" width="357" height="445" rx="20"/><text class="ct" x="58" y="184">① 古典的なウーツ鋼</text><text class="small" x="58" y="216">単一のるつぼ鋼を鍛造</text><rect x="63" y="251" width="301" height="182" rx="15" fill="#314c52"/><g stroke="#c6a478" fill="none" stroke-width="5" opacity=".96"><path d="M70 294 Q110 265 160 302 T262 304 T357 286"/><path d="M70 325 Q137 293 182 335 T289 338 T356 326"/><path d="M70 373 Q145 331 188 380 T283 374 T356 365"/><path d="M70 407 Q127 378 187 413 T298 408 T356 395"/></g><text class="cap" x="58" y="475">炭化物の分布が帯状になる</text><text class="small" x="58" y="508">複数の鋼材の貼り合わせ</text><text class="small" x="58" y="533">そのものではない</text></g><g><rect class="card" x="419" y="140" width="357" height="445" rx="20"/><text class="ct" x="442" y="184">② 現代の模様鍛接鋼</text><text class="small" x="442" y="216">異種の鋼材を重ねて接合</text><rect x="448" y="251" width="301" height="182" rx="15" fill="#314c52"/><g stroke="#dac6a1" fill="none" stroke-width="9"><path d="M452 270 Q505 298 552 270 T653 270 T746 270"/><path d="M452 307 Q505 335 552 307 T653 307 T746 307"/><path d="M452 344 Q505 372 552 344 T653 344 T746 344"/><path d="M452 381 Q505 409 552 381 T653 381 T746 381"/></g><text class="cap" x="442" y="475">異なる層の見え方が模様に</text><text class="small" x="442" y="508">表面を研磨・腐食処理して</text><text class="small" x="442" y="533">濃淡を際立たせる例がある</text></g><g><rect class="card" x="803" y="140" width="362" height="445" rx="20"/><text class="ct" x="826" y="184">③ 現代包丁の断面例</text><text class="small" x="826" y="216">芯材＋模様のある外層</text><g transform="translate(834,245)"><path d="M0 0 L302 0 L267 183 L36 183 Z" fill="#d9d2c6" stroke="#394d54" stroke-width="2"/><path d="M25 0 L278 0 L264 183 L39 183 Z" fill="#d4bd91"/><path d="M95 0 L208 0 L197 183 L105 183 Z" fill="#415a63"/><g stroke="#f3e6d0" stroke-width="4" fill="none"><path d="M38 18 L91 18 M211 18 L264 18"/><path d="M43 41 L91 41 M211 41 L260 41"/><path d="M48 64 L91 64 M211 64 L256 64"/><path d="M53 87 L91 87 M211 87 L251 87"/><path d="M59 110 L91 110 M211 110 L247 110"/><path d="M64 133 L91 133 M211 133 L242 133"/><path d="M69 156 L91 156 M211 156 L238 156"/></g></g><text class="cap" x="826" y="475">刃先の芯材が切断を担う</text><text class="small" x="826" y="508">これは多層クラッド構造の一例</text><text class="small" x="826" y="533">すべてのダマスカス製品に非該当</text></g><text x="40" y="635" class="small">調査・図解：MyEssays（2026）｜出典：The Met / Verhoeven (2002) / TOJIRO / Shun。図は独自制作。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img"><style>text{font-family:Arial,'Noto Sans JP',sans-serif} .muted{fill:#617184;font-size:20px}.num{fill:#102a43;font-size:38px;font-weight:bold}.lab{fill:#102a43;font-size:24px}.small{fill:#617184;font-size:16px}</style><rect width="1100" height="530" rx="26" fill="#f7f9fc"/><text x="50" y="67" class="num">「家賃」と「チケット」を割り算してみる</text><text x="50" y="108" class="muted">単位：百万円／年。左だけが公表額。中央・右は全員有料2,500円という仮定。</text><rect x="65" y="257.892104" width="258" height="135.10789599999998" rx="10" fill="#264962"/><text x="65" y="232.89210400000002" font-size="30" fill="#102a43" font-weight="bold">82.7百万円</text><text x="65" y="427" class="lab">土地の年額賃料</text><rect x="420" y="265.06100000000004" width="258" height="127.939" rx="10" fill="#c52340"/><text x="420" y="240.061" font-size="30" fill="#102a43" font-weight="bold">78.3百万円</text><text x="420" y="427" class="lab">現状観客 × 仮単価</text><rect x="775" y="168.41666666666669" width="258" height="224.58333333333331" rx="10" fill="#4e9c87"/><text x="775" y="143.41666666666669" font-size="30" fill="#102a43" font-weight="bold">137.5百万円</text><text x="775" y="427" class="lab">5,000人 × 仮単価</text><text x="50" y="489" class="small">券面売上は税・手数料・招待・運営費等を考慮しない概念実験。土地賃料の支払主体も未確定。</text></svg>
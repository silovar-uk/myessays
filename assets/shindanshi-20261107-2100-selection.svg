<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340"><rect width="960" height="340" fill="#f7f9fc"/><text x="38" y="46" font-size="27" font-family="sans-serif" fill="#172b4d">回答率が高くても「因果関係」は自動では証明されない</text><g font-family="sans-serif" font-size="21"><rect x="35" y="93" width="270" height="133" rx="12" fill="#e2ecfb"/><text x="57" y="135">対象者の選び方</text><text x="57" y="169" font-size="17">申請者・採択者・販売者</text><rect x="344" y="93" width="270" height="133" rx="12" fill="#fbe9dd"/><text x="366" y="135">回答者の偏り</text><text x="366" y="169" font-size="17">成果が大きい人ほど回答？</text><rect x="653" y="93" width="270" height="133" rx="12" fill="#e5f3e7"/><text x="675" y="135">分析の限界</text><text x="675" y="169" font-size="17">比較可能性を点検</text><text x="314" y="165" font-size="25">→</text><text x="623" y="165" font-size="25">→</text></g><text x="38" y="273" font-size="18" font-family="sans-serif" fill="#344563">質問票の集計と政策の純粋な効果推定は別の作業。</text><text x="38" y="308" font-size="15" font-family="sans-serif" fill="#526579">概念図／数値なし。出典：中小機構の調査対象区分を基に独自作成。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1080" viewBox="0 0 780 1080" role="img"><rect width="780" height="1080" fill="#f8f5ef"/><style>text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#1e293b}.sub{font-size:19px;fill:#64748b}.small{font-size:18px}.heading{font-size:36px;font-weight:800}.big{font-size:31px;font-weight:800}.cmd{font-size:31px;font-weight:800;fill:#175e99}.note{font-size:21px}.white{fill:white}</style><text x="36" y="53" class="sub">STREET FIGHTER 6 / ARJUN</text><text x="36" y="105" class="heading">レバーレス入力地図</text><text x="36" y="145" class="sub">クラシック1P側 ｜ 同時逆方向＝ニュートラル</text><rect x="30" y="177" width="720" height="104" rx="20" fill="#17324c" stroke="#17324c" stroke-width="2"/><text x="56" y="221" class="white" font-size="28" font-weight="800">最初に覚える3つ</text><text x="56" y="255" class="white" font-size="24">323昇竜／236波動／214設置</text><rect x="30" y="300" width="720" height="90" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="44" y="314" width="50" height="58" rx="20" fill="#e7f0f8" stroke="#d5e4ef" stroke-width="2"/><text x="49" y="352" class="cmd">01</text><text x="116" y="335" class="small">波動型</text><text x="116" y="365" class="sub">大義の巨腕 ／ 息吹の円筒</text><text x="478" y="343" class="cmd">236＋P / K</text><text x="116" y="383" class="small">↓・↘・→を順に作る</text><rect x="30" y="400" width="720" height="90" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="44" y="414" width="50" height="58" rx="20" fill="#e7f0f8" stroke="#d5e4ef" stroke-width="2"/><text x="49" y="452" class="cmd">02</text><text x="116" y="435" class="small">昇竜型</text><text x="116" y="465" class="sub">厳酷な岩肩</text><text x="478" y="443" class="cmd">623＋P / 323＋P</text><text x="116" y="483" class="small">↘を保持 → 左を追加 → 左だけ離してP</text><rect x="30" y="500" width="720" height="90" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="44" y="514" width="50" height="58" rx="20" fill="#e7f0f8" stroke="#d5e4ef" stroke-width="2"/><text x="49" y="552" class="cmd">03</text><text x="116" y="535" class="small">逆波動型</text><text x="116" y="565" class="sub">神気の巨巌（設置）</text><text x="478" y="543" class="cmd">214＋K</text><text x="116" y="583" class="small">↓ → ↙ → ←、Kを長押しすればタイミング調整</text><rect x="30" y="600" width="720" height="90" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="44" y="614" width="50" height="58" rx="20" fill="#e7f0f8" stroke="#d5e4ef" stroke-width="2"/><text x="49" y="652" class="cmd">04</text><text x="116" y="635" class="small">半回転型</text><text x="116" y="665" class="sub">鬼気迫る尋問（投げ）</text><text x="478" y="643" class="cmd">63214＋P</text><text x="116" y="683" class="small">右 → 右下 → 下 → 左下 → 左</text><rect x="30" y="700" width="720" height="90" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="44" y="714" width="50" height="58" rx="20" fill="#e7f0f8" stroke="#d5e4ef" stroke-width="2"/><text x="49" y="752" class="cmd">05</text><text x="116" y="735" class="small">下・下型</text><text x="116" y="765" class="sub">不撓の警衛（当身）</text><text x="478" y="743" class="cmd">22＋強K</text><text x="116" y="783" class="small">下を2回。上下相殺式は未検証の応用</text><rect x="30" y="800" width="720" height="90" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="44" y="814" width="50" height="58" rx="20" fill="#e7f0f8" stroke="#d5e4ef" stroke-width="2"/><text x="49" y="852" class="cmd">06</text><text x="116" y="835" class="small">二連コマンド型</text><text x="116" y="865" class="sub">SA1・SA2・SA3</text><text x="478" y="843" class="cmd">236236 / 214214</text><text x="116" y="883" class="small">方向を2セット。SA1だけ最後はK</text><rect x="30" y="900" width="720" height="90" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="44" y="914" width="50" height="58" rx="20" fill="#e7f0f8" stroke="#d5e4ef" stroke-width="2"/><text x="49" y="952" class="cmd">07</text><text x="116" y="935" class="small">共通操作</text><text x="116" y="965" class="sub">ダッシュ・ラッシュ・パリィ</text><text x="478" y="943" class="cmd">66 / 44 / 中P＋中K</text><text x="116" y="983" class="small">ダッシュは方向2回。キャンセルラッシュは別</text><text x="36" y="1040" class="sub">注：技表は2026年10月13日実装版。代替入力は個別に検証状況を明記。</text></svg>
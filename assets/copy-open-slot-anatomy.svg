<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#f7f5f0"/>
<text x="80" y="100" font-family="sans-serif" font-size="42" font-weight="700" fill="#222">余白は、文章の外ではなく意味の中にある</text>
<text x="80" y="145" font-family="sans-serif" font-size="22" fill="#555">COPY = FIXED FRAME + READER-FILLED VARIABLE</text>
<rect x="90" y="220" rx="22" ry="22" width="420" height="250" fill="#ffffff" stroke="#222" stroke-width="3"/>
<text x="130" y="280" font-family="sans-serif" font-size="28" font-weight="700" fill="#222">書き手が固定する</text>
<text x="130" y="330" font-family="sans-serif" font-size="24" fill="#333">・方向</text><text x="130" y="370" font-family="sans-serif" font-size="24" fill="#333">・場面</text><text x="130" y="410" font-family="sans-serif" font-size="24" fill="#333">・ブランドとの接点</text>
<text x="545" y="355" font-family="sans-serif" font-size="58" font-weight="700" fill="#777">＋</text>
<rect x="675" y="220" rx="22" ry="22" width="435" height="250" fill="#ffffff" stroke="#222" stroke-width="3" stroke-dasharray="12 10"/>
<text x="715" y="280" font-family="sans-serif" font-size="28" font-weight="700" fill="#222">読み手が埋める</text>
<text x="715" y="330" font-family="sans-serif" font-size="24" fill="#333">・「それ」は何か</text><text x="715" y="370" font-family="sans-serif" font-size="24" fill="#333">・なぜ今なのか</text><text x="715" y="410" font-family="sans-serif" font-size="24" fill="#333">・自分の記憶／意味</text>
<text x="90" y="555" font-family="sans-serif" font-size="26" fill="#222">短い ≠ 余白がある　／　余白 = 解釈権を一部だけ読者に渡す</text>
</svg>
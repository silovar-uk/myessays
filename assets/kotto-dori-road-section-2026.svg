<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="t d"><title id="t">2026年7月に認可された骨董通りの道路断面構成</title><desc id="d">幅25メートルの一般部について左右各7.75メートルの歩道部、中央9.5メートルの車道部を示す模式図。詳細配置や一部27メートル部分は省略。</desc>
<rect width="1100" height="440" rx="20" fill="#faf8f3"/><text x="44" y="56" font-size="33" font-weight="700" fill="#1d3541" font-family="sans-serif">25mの道路は、車だけのためではない</text><text x="46" y="94" font-size="18" fill="#57666c" font-family="sans-serif">2026年港区資料の「一般部」断面を単純化</text>
<line x1="65" y1="144" x2="1035" y2="144" stroke="#465e6d" stroke-width="3"/><path d="M65 137 v14 M1035 137 v14" stroke="#465e6d" stroke-width="3"/><text x="550" y="133" font-size="27" fill="#233d4b" font-weight="700" font-family="sans-serif" text-anchor="middle">全幅 25m</text>
<rect x="65" y="172" width="301" height="150" rx="6" fill="#c5dbc7"/><rect x="366" y="172" width="368" height="150" fill="#d5dbdf"/><rect x="734" y="172" width="301" height="150" rx="6" fill="#c5dbc7"/>
<g fill="#1a3e40" font-family="sans-serif" text-anchor="middle"><text x="216" y="221" font-size="28" font-weight="700">7.75m</text><text x="216" y="260" font-size="23">歩道・植栽など</text><text x="550" y="221" font-size="28" font-weight="700">9.5m</text><text x="550" y="260" font-size="23">車道・自転車通行帯</text><text x="885" y="221" font-size="28" font-weight="700">7.75m</text><text x="885" y="260" font-size="23">歩道・植栽など</text></g>
<text x="65" y="368" fill="#445860" font-family="sans-serif" font-size="19">※図は縮尺に沿った説明用の模式図。停車帯部では構成が異なる。</text><text x="65" y="404" fill="#66757d" font-family="sans-serif" font-size="17">出典：港区議会 2026年7月29日 建設常任委員会 資料10・2頁</text></svg>
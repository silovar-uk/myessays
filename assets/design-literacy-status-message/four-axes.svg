<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f4f1ea"/><g font-family="sans-serif" fill="#171717"><text x="600" y="70" text-anchor="middle" font-size="36">フィードバックの4軸</text><g font-size="26"><rect x="70" y="170" width="240" height="280" rx="22" fill="#fff" stroke="#111"/><text x="190" y="235" text-anchor="middle">内容</text><text x="190" y="320" text-anchor="middle" font-size="21">何が起きた？</text><rect x="345" y="170" width="240" height="280" rx="22" fill="#fff" stroke="#111"/><text x="465" y="235" text-anchor="middle">場所</text><text x="465" y="320" text-anchor="middle" font-size="21">どこに出す？</text><rect x="620" y="170" width="240" height="280" rx="22" fill="#fff" stroke="#111"/><text x="740" y="235" text-anchor="middle">持続</text><text x="740" y="320" text-anchor="middle" font-size="21">いつまで残す？</text><rect x="895" y="170" width="240" height="280" rx="22" fill="#fff" stroke="#111"/><text x="1015" y="235" text-anchor="middle">通知経路</text><text x="1015" y="305" text-anchor="middle" font-size="21">視覚だけ？</text><text x="1015" y="342" text-anchor="middle" font-size="21">支援技術にも？</text></g><text x="600" y="570" text-anchor="middle" font-size="28">「文言」だけをレビューしても、届き方は分からない。</text></g></svg>
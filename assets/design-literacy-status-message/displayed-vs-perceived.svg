<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f4f1ea"/><g font-family="sans-serif" fill="#171717"><text x="600" y="74" text-anchor="middle" font-size="36">表示された ≠ 伝わった</text><rect x="90" y="160" width="430" height="350" rx="24" fill="#fff" stroke="#111"/><text x="305" y="220" text-anchor="middle" font-size="27">システム側</text><text x="305" y="300" text-anchor="middle" font-size="23">保存成功</text><text x="305" y="355" text-anchor="middle" font-size="23">↓</text><text x="305" y="410" text-anchor="middle" font-size="23">「保存しました」を表示</text><rect x="680" y="160" width="430" height="350" rx="24" fill="#fff" stroke="#111"/><text x="895" y="220" text-anchor="middle" font-size="27">利用者側</text><text x="895" y="300" text-anchor="middle" font-size="23">入力欄を見ている</text><text x="895" y="355" text-anchor="middle" font-size="23">↓</text><text x="895" y="410" text-anchor="middle" font-size="23">「ほんまに保存された？」</text><text x="600" y="590" text-anchor="middle" font-size="28">状態変化が理解されて、はじめてフィードバックは完了する。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f4f1ea"/><g font-family="sans-serif" fill="#171717"><text x="600" y="70" text-anchor="middle" font-size="34">WCAG 2.2｜状態メッセージ 4.1.3</text><rect x="120" y="150" width="960" height="340" rx="28" fill="#fff" stroke="#111"/><text x="600" y="235" text-anchor="middle" font-size="28">状態メッセージを表示するなら、</text><text x="600" y="295" text-anchor="middle" font-size="28">役割やプロパティからプログラム的に判別でき、</text><text x="600" y="355" text-anchor="middle" font-size="28">フォーカスを移さず支援技術にも提示できるようにする。</text><text x="600" y="430" text-anchor="middle" font-size="20">要旨（原文の逐語引用ではありません）</text><text x="600" y="565" text-anchor="middle" font-size="20">出典: W3C WCAG 2.2 — 4.1.3 状態メッセージ</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f4f1ea"/><g font-family="sans-serif" fill="#171717"><text x="600" y="70" text-anchor="middle" font-size="35">システム状態と利用者理解を同期させる</text><rect x="100" y="180" width="270" height="160" rx="22" fill="#fff" stroke="#111"/><text x="235" y="245" text-anchor="middle" font-size="25">システム状態</text><text x="235" y="295" text-anchor="middle" font-size="22">保存成功</text><rect x="465" y="180" width="270" height="160" rx="22" fill="#fff" stroke="#111"/><text x="600" y="245" text-anchor="middle" font-size="25">フィードバック</text><text x="600" y="295" text-anchor="middle" font-size="22">表示・通知・持続</text><rect x="830" y="180" width="270" height="160" rx="22" fill="#fff" stroke="#111"/><text x="965" y="245" text-anchor="middle" font-size="25">利用者理解</text><text x="965" y="295" text-anchor="middle" font-size="22">「保存された」</text><text x="415" y="275" text-anchor="middle" font-size="44">→</text><text x="780" y="275" text-anchor="middle" font-size="44">→</text><text x="600" y="470" text-anchor="middle" font-size="26">成功しただけでは、理解されたとは限らない。</text><text x="600" y="525" text-anchor="middle" font-size="24">状態だけでなく、理解へ渡す橋を設計する。</text></g></svg>
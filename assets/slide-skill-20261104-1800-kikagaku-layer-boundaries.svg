<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#f7f9fc"/><text x="55" y="66" font-size="32" font-family="sans-serif" fill="#172a45">階層図は「役割の境界」を見せる</text><text x="55" y="105" font-size="19" font-family="sans-serif" fill="#596c81">独自教材・架空のサービス構成（上下は優劣を示さない）</text><rect x="90" y="140" width="920" height="118" rx="14" fill="#d9eafb" stroke="#5286b5" stroke-width="2"/><text x="125" y="189" font-size="28" font-family="sans-serif" fill="#123b61">顧客体験</text><text x="430" y="189" font-size="25" font-family="sans-serif" fill="#123b61">アプリ・利用画面</text><rect x="90" y="277" width="920" height="118" rx="14" fill="#d8efe7" stroke="#52927d" stroke-width="2"/><text x="125" y="327" font-size="28" font-family="sans-serif" fill="#174e3b">運用</text><text x="430" y="327" font-size="25" font-family="sans-serif" fill="#174e3b">問い合わせ・分析</text><rect x="90" y="414" width="920" height="118" rx="14" fill="#f9e8ce" stroke="#b58c4e" stroke-width="2"/><text x="125" y="463" font-size="28" font-family="sans-serif" fill="#65451b">基盤</text><text x="430" y="463" font-size="25" font-family="sans-serif" fill="#65451b">会員データ・決済</text><text x="90" y="581" font-size="18" font-family="sans-serif" fill="#596c81">注：この図は原典スライドの再現ではありません。</text></svg>
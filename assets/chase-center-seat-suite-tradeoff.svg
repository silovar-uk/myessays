<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-label="旧オラクル・アリーナとチェイス・センターの収容人数とスイート区画数を比較。総座席数19596から18064へ減少、スイート84から136へ増加。">
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0B1B31"/><stop offset="1" stop-color="#172C48"/></linearGradient></defs><rect width="1600" height="760" fill="url(#g)"/><text x="86" y="90" fill="#F7FBFF" font-family="Arial,'Noto Sans JP',sans-serif" font-weight="bold" font-size="49">MORE PREMIUM, FEWER SEATS</text><text x="88" y="140" fill="#C6D9E9" font-family="Arial,'Noto Sans JP',sans-serif" font-size="27">チェイス・センターは「席数の最大化」とは異なる選択をした</text>
<rect x="85" y="208" rx="24" width="690" height="410" fill="#1A334E" stroke="#41617E"/><text x="130" y="274" fill="#C5D8E9" font-family="Arial,'Noto Sans JP',sans-serif" font-size="25">総座席数（席）</text><text x="130" y="344" fill="#FFF" font-family="Arial,sans-serif" font-size="53" font-weight="bold">19,596</text><text x="505" y="344" fill="#75CFD8" font-family="Arial,sans-serif" font-size="53" font-weight="bold">18,064</text><text x="130" y="388" fill="#C5D8E9" font-family="Arial,'Noto Sans JP',sans-serif" font-size="19">旧オラクル</text><text x="503" y="388" fill="#C5D8E9" font-family="Arial,'Noto Sans JP',sans-serif" font-size="19">新チェイス</text><rect x="130" y="438" width="560" height="45" rx="11" fill="#56708A"/><rect x="130" y="506" width="516" height="45" rx="11" fill="#75CFD8"/><text x="530" y="581" fill="#75CFD8" font-family="Arial,sans-serif" font-size="33" font-weight="bold">−7.8%</text>
<rect x="825" y="208" rx="24" width="690" height="410" fill="#1A334E" stroke="#41617E"/><text x="870" y="274" fill="#C5D8E9" font-family="Arial,'Noto Sans JP',sans-serif" font-size="25">スイート区画数（室）</text><text x="870" y="344" fill="#FFF" font-family="Arial,sans-serif" font-size="53" font-weight="bold">84</text><text x="1235" y="344" fill="#FFCB6B" font-family="Arial,sans-serif" font-size="53" font-weight="bold">136</text><text x="870" y="388" fill="#C5D8E9" font-family="Arial,'Noto Sans JP',sans-serif" font-size="19">旧オラクル</text><text x="1235" y="388" fill="#C5D8E9" font-family="Arial,'Noto Sans JP',sans-serif" font-size="19">新チェイス</text><rect x="870" y="438" width="346" height="45" rx="11" fill="#56708A"/><rect x="870" y="506" width="560" height="45" rx="11" fill="#FFCB6B"/><text x="1273" y="581" fill="#FFCB6B" font-family="Arial,sans-serif" font-size="33" font-weight="bold">+61.9%</text>
<text x="88" y="679" fill="#BBCAD7" font-family="Arial,'Noto Sans JP',sans-serif" font-size="22">注：スイートは個室区画数であり、プレミアム席全体の数や売上を示すものではない。</text><text x="88" y="713" fill="#91A7BA" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18">Source: San Francisco Chronicle (2019) ／ 図：本稿作成</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">スポーツ施設が街とつながるまで</title><desc id="d">試合会場、運営事業、都市経営の三段階の見方を比較する。</desc><rect width="960" height="420" rx="24" fill="#f7f5ee"/><text x="50" y="52" font-family="Arial,'Noto Sans JP',sans-serif" font-size="29" font-weight="700" fill="#1d2832">「箱」をつくる → 「日常」をつくる</text><text x="50" y="81" font-family="Arial,'Noto Sans JP',sans-serif" font-size="16" fill="#586a73">これは歴史の必然ではなく、政策と事業設計の視点を整理した概念図</text><g font-family="Arial,'Noto Sans JP',sans-serif"><rect x="50" y="125" width="260" height="195" rx="17" fill="#e6eae4"/><rect x="350" y="125" width="260" height="195" rx="17" fill="#dbece8"/><rect x="650" y="125" width="260" height="195" rx="17" fill="#e5e4f3"/><text x="72" y="167" font-size="17" font-weight="700" fill="#5a706b">施設整備</text><text x="72" y="211" font-size="24" font-weight="700" fill="#1b3037">試合を開催する</text><text x="72" y="251" font-size="16" fill="#3d555b">安全・競技基準・収容力</text><text x="72" y="277" font-size="16" fill="#3d555b">建てた後の利用は別問題</text><text x="372" y="167" font-size="17" font-weight="700" fill="#18756b">施設経営</text><text x="372" y="211" font-size="24" font-weight="700" fill="#1b3037">通年で稼ぐ</text><text x="372" y="251" font-size="16" fill="#3d555b">興行誘致・飲食・広告</text><text x="372" y="277" font-size="16" fill="#3d555b">固定費と修繕費を負担</text><text x="672" y="167" font-size="17" font-weight="700" fill="#615ca0">エリア経営</text><text x="672" y="211" font-size="24" font-weight="700" fill="#1b3037">街に波及させる</text><text x="672" y="251" font-size="16" fill="#3d555b">交通・商業・不動産</text><text x="672" y="277" font-size="16" fill="#3d555b">公共性・外部効果を評価</text><text x="321" y="232" font-size="29" fill="#637a76">›</text><text x="621" y="232" font-size="29" fill="#637a76">›</text></g><text x="50" y="364" font-family="Arial,'Noto Sans JP',sans-serif" font-size="17" fill="#273e44">問いの変化：「何人入るか」→「何回使えるか」→「誰に価値が残るか」</text></svg>
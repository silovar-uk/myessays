<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">スタジアムの価値を三つに分けて測る</title><desc id="d">施設収支、地域経済、自治体と住民の便益は別々に検証する。</desc><rect width="960" height="360" rx="24" fill="#f7f5ee"/><text x="48" y="55" font-size="28" fill="#1d2832" font-weight="700" font-family="Arial,'Noto Sans JP',sans-serif">同じ来場者数、違う３つの成績表</text><text x="48" y="83" font-size="16" fill="#596b76" font-family="Arial,'Noto Sans JP',sans-serif">「人が来た」だけで、投資が成功したとは言えない</text><g font-family="Arial,'Noto Sans JP',sans-serif"><rect x="48" y="120" width="270" height="170" rx="16" fill="white" stroke="#c9d7d2"/><rect x="345" y="120" width="270" height="170" rx="16" fill="white" stroke="#c9d7d2"/><rect x="642" y="120" width="270" height="170" rx="16" fill="white" stroke="#c9d7d2"/><text x="70" y="155" fill="#0e6b60" font-size="16" font-weight="700">01 / FACILITY</text><text x="70" y="194" fill="#1d2832" font-size="23" font-weight="700">施設の収支</text><text x="70" y="226" fill="#52616a" font-size="16">売上・運営費・修繕</text><text x="70" y="252" fill="#52616a" font-size="16">投資回収・借入返済</text><text x="367" y="155" fill="#a36b21" font-size="16" font-weight="700">02 / LOCAL ECONOMY</text><text x="367" y="194" fill="#1d2832" font-size="23" font-weight="700">地域の純増</text><text x="367" y="226" fill="#52616a" font-size="16">域外消費・雇用・代替</text><text x="367" y="252" fill="#52616a" font-size="16">他施設からの移転</text><text x="664" y="155" fill="#5150a4" font-size="16" font-weight="700">03 / PUBLIC VALUE</text><text x="664" y="194" fill="#1d2832" font-size="23" font-weight="700">公共の費用便益</text><text x="664" y="226" fill="#52616a" font-size="16">住民利用・税収・交通</text><text x="664" y="252" fill="#52616a" font-size="16">公費負担・外部不経済</text></g><text x="48" y="325" font-family="Arial,'Noto Sans JP',sans-serif" font-size="15" fill="#6c7881">編集図解：３つの指標は相互に関連するが、同じ指標ではない</text></svg>
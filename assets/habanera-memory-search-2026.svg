<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500"><rect width="1120" height="500" rx="26" fill="#101827"/><text x="65" y="76" fill="#f5f3eb" font-size="31" font-family="sans-serif" font-weight="700">曲名にたどり着くまでの「誤答」が、実はデータだった</text><text x="65" y="114" fill="#aab9cc" font-size="19" font-family="sans-serif">音程の代わりに、記憶に残った感覚を少しずつ言語化した探索</text><path d="M105 245 H1010" stroke="#61738e" stroke-width="4"/><g font-family="sans-serif" text-anchor="middle"><circle cx="125" cy="245" r="16" fill="#64748b"/><circle cx="343" cy="245" r="16" fill="#64748b"/><circle cx="561" cy="245" r="16" fill="#64748b"/><circle cx="779" cy="245" r="16" fill="#64748b"/><circle cx="997" cy="245" r="19" fill="#f6bb57"/><text x="125" y="198" fill="#ecf2fa" font-size="21">擬音</text><text x="125" y="298" fill="#aab9cc" font-size="16">ちゃっちゃ…</text><text x="343" y="198" fill="#ecf2fa" font-size="21">場面</text><text x="343" y="298" fill="#aab9cc" font-size="16">サーカス？</text><text x="561" y="198" fill="#ecf2fa" font-size="21">印象</text><text x="561" y="298" fill="#aab9cc" font-size="16">明るい＋哀愁</text><text x="779" y="198" fill="#ecf2fa" font-size="21">感情</text><text x="779" y="298" fill="#aab9cc" font-size="16">どこか色気</text><text x="997" y="192" fill="#ffdb9b" font-size="24" font-weight="700">ハバネラ</text><text x="997" y="299" fill="#f6bb57" font-size="16">名前が戻る</text></g><rect x="66" y="361" width="987" height="85" rx="16" fill="#213249"/><text x="92" y="400" fill="#f3f6fb" font-family="sans-serif" font-size="23" font-weight="600">発見：最初の「ジャンル分類」より、後から出た「感覚の記述」が役に立った</text><text x="92" y="427" fill="#b8c9d9" font-family="sans-serif" font-size="16">※一人の会話での探索記録。心理学実験の結果ではない。</text></svg>
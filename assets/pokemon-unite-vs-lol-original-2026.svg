<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="リーグ・オブ・レジェンドは敵拠点を破壊、ポケモンユナイトはゴールで得点する。両者の勝利条件の比較を示す独自模式図"><rect width="1200" height="600" fill="#0b1424"/><text x="60" y="74" font-family="sans-serif" fill="#eaf2fa" font-size="36" font-weight="bold">似ているのは戦場。違うのは勝利の条件。</text><rect x="55" y="114" width="520" height="400" rx="24" fill="#16293b" stroke="#5b84b7" stroke-width="2"/><rect x="625" y="114" width="520" height="400" rx="24" fill="#202e30" stroke="#77bc9b" stroke-width="2"/><text x="85" y="163" fill="#98c9ff" font-family="sans-serif" font-size="26" font-weight="bold">LoL（リーグ・オブ・レジェンド）</text><text x="655" y="163" fill="#9be9b9" font-family="sans-serif" font-size="26" font-weight="bold">ポケモンユナイト</text><circle cx="141" cy="288" r="31" fill="#4d9bd8"/><circle cx="489" cy="288" r="31" fill="#db7563"/><text x="108" y="344" fill="#d5e7f1" font-family="sans-serif" font-size="17">味方本陣</text><text x="456" y="344" fill="#d5e7f1" font-family="sans-serif" font-size="17">敵本陣</text><g stroke="#7290b1" stroke-width="9" fill="none" stroke-linecap="round"><path d="M170 230H460"/><path d="M170 290H460"/><path d="M170 350H460"/></g><g fill="#bbd4ed"><circle cx="248" cy="230" r="13"/><circle cx="370" cy="230" r="13"/><circle cx="248" cy="290" r="13"/><circle cx="370" cy="290" r="13"/><circle cx="248" cy="350" r="13"/><circle cx="370" cy="350" r="13"/></g><text x="95" y="438" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">防衛施設を突破 → 敵本陣を破壊</text><text x="95" y="470" fill="#adbed0" font-family="sans-serif" font-size="17">3本の道と中央の森で戦力を育てる</text><circle cx="710" cy="294" r="31" fill="#4d9bd8"/><circle cx="1061" cy="294" r="31" fill="#db7563"/><g stroke="#77bc9b" stroke-width="10" fill="none" stroke-linecap="round"><path d="M740 235Q887 166 1030 235"/><path d="M740 352Q887 422 1030 352"/></g><g fill="#e9be6e" stroke="#fbe3a5" stroke-width="3"><circle cx="818" cy="219" r="19"/><circle cx="957" cy="219" r="19"/><circle cx="818" cy="370" r="19"/><circle cx="957" cy="370" r="19"/></g><circle cx="887" cy="293" r="41" fill="#3e5d60" stroke="#f1d278" stroke-width="4"/><text x="869" y="303" fill="#f9e0a0" font-family="sans-serif" font-size="25">★</text><text x="661" y="438" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">野生ポケモンを倒す → 敵ゴールへ得点</text><text x="661" y="470" fill="#b6d4c5" font-family="sans-serif" font-size="17">上・下の道と中央。制限時間は10分</text><text x="60" y="565" fill="#90a0b1" font-family="sans-serif" font-size="18">編集部作成の概念図。ゲーム画面の複製ではなく、主要ルールの関係だけを図式化。</text></svg>
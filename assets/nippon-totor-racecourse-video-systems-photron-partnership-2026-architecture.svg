<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">競走場映像の六層と外部技術の差し込み口</title><desc id="d">現場撮影から制作、投票競技情報、配信経路、運用監視、保存活用までの六層構造。日本トーターの既存業務とフォトロンの提案候補を区別する概念図。</desc><rect width="1600" height="900" fill="#101926"/><text x="80" y="100" fill="#f6f7fb" font-family="sans-serif" font-size="49" font-weight="700">競走場の映像は「配信ボタン」では終わらない</text><text x="80" y="155" fill="#b8c5d5" font-family="sans-serif" font-size="25">公開資料をもとにした仮説整理｜個々の現場の実装構成を示すものではない</text><g font-family="sans-serif"><rect x="78" y="218" rx="22" width="460" height="156" fill="#173751" stroke="#397c98" stroke-width="2"/><text x="113" y="270" font-size="27" font-weight="700" fill="#74ddf2">01　現場撮影・制作</text><text x="113" y="315" font-size="24" fill="#eaf2f8">カメラ／切替／実況／CG</text><text x="113" y="350" font-size="20" fill="#a9c8d9">映像の成立と現場判断</text><rect x="571" y="218" rx="22" width="460" height="156" fill="#243652" stroke="#567ca4" stroke-width="2"/><text x="605" y="270" font-size="27" font-weight="700" fill="#9ec8ff">02　投票・競技情報</text><text x="605" y="315" font-size="24" fill="#eaf2f8">オッズ／着順／払戻／選手</text><text x="605" y="350" font-size="20" fill="#b8cbe7">既存連携がある前提</text><rect x="1064" y="218" rx="22" width="460" height="156" fill="#173751" stroke="#397c98" stroke-width="2"/><text x="1098" y="270" font-size="27" font-weight="700" fill="#74ddf2">03　送出・伝送</text><text x="1098" y="315" font-size="24" fill="#eaf2f8">場内／場外／放送／配信</text><text x="1098" y="350" font-size="20" fill="#a9c8d9">経路・遅延・冗長化</text><path d="M538 292H571M1031 292H1064" stroke="#ffcf77" stroke-width="6"/><rect x="78" y="418" rx="22" width="460" height="156" fill="#3b302a" stroke="#c08b54" stroke-width="2"/><text x="113" y="470" font-size="27" font-weight="700" fill="#ffcf77">04　集中監視と復旧</text><text x="113" y="515" font-size="24" fill="#f6f0e4">品質／障害予兆／履歴</text><text x="113" y="550" font-size="20" fill="#e4c8aa">提案候補：運用可視化</text><rect x="571" y="418" rx="22" width="460" height="156" fill="#3b302a" stroke="#c08b54" stroke-width="2"/><text x="605" y="470" font-size="27" font-weight="700" fill="#ffcf77">05　制作の共通基盤</text><text x="605" y="515" font-size="24" fill="#f6f0e4">遠隔操作／雛形／自動化</text><text x="605" y="550" font-size="20" fill="#e4c8aa">提案候補：M2A等の検証</text><rect x="1064" y="418" rx="22" width="460" height="156" fill="#3b302a" stroke="#c08b54" stroke-width="2"/><text x="1098" y="470" font-size="27" font-weight="700" fill="#ffcf77">06　映像資産の再利用</text><text x="1098" y="515" font-size="24" fill="#f6f0e4">検索／権利／切り出し</text><text x="1098" y="550" font-size="20" fill="#e4c8aa">提案候補：映像×メタデータ</text><rect x="78" y="628" rx="20" width="1446" height="149" fill="#1c2936" stroke="#475868" stroke-width="2"/><text x="116" y="678" font-size="28" font-weight="700" fill="#f6f7fb">本当の商談は、機器の置換ではなく「既存業務の残された負荷」の発見から始まる</text><text x="116" y="728" font-size="24" fill="#c3d2df">確認すべき項目：発注主体　／　責任分界　／　現状費用　／　障害履歴　／　映像利用権　／　更新時期</text><text x="81" y="841" font-size="21" fill="#a1b3c4">出典：日本トーター・フォトロン・JLCの公開事業資料をもとに作図。オレンジ部分は提案仮説。</text></g></svg>
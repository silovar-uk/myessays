<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
<title id="title">場面の違いを二つの軸で観察する</title><desc id="desc">横軸は話し始める時刻を自分で選べるか、縦軸は言葉を自由に組み立てるか定型文か。雑談、朗読、チラシ配布、突然の質問を配置。症状の強さを示す実測図ではない。</desc>
<rect width="1120" height="720" fill="#f4f5f1"/><text x="56" y="67" fill="#172b39" font-size="38" font-weight="700" font-family="Noto Sans JP,Meiryo,sans-serif">「話す」を、場面で分解してみる</text><text x="57" y="102" fill="#5b6770" font-size="19" font-family="Noto Sans JP,Meiryo,sans-serif">症状の大小を決めつけず、変わる条件を探すための観察図</text>
<text x="58" y="180" fill="#59636c" font-size="23" font-family="Noto Sans JP,Meiryo,sans-serif">自由な言葉</text><text x="58" y="494" fill="#59636c" font-size="23" font-family="Noto Sans JP,Meiryo,sans-serif">定型の言葉</text>
<line x1="251" y1="170" x2="251" y2="594" stroke="#99a4a8" stroke-width="2"/><line x1="241" y1="380" x2="1044" y2="380" stroke="#99a4a8" stroke-width="2"/>
<rect x="271" y="182" width="345" height="178" rx="17" fill="#dfe9e0"/><text x="296" y="233" fill="#244d3a" font-size="30" font-weight="700" font-family="Noto Sans JP,Meiryo,sans-serif">普段の雑談</text><text x="296" y="278" fill="#263d32" font-size="20" font-family="Noto Sans JP,Meiryo,sans-serif">話し始めるタイミングを選び</text><text x="296" y="311" fill="#263d32" font-size="20" font-family="Noto Sans JP,Meiryo,sans-serif">言葉も自分で組み立てる</text>
<rect x="640" y="182" width="365" height="178" rx="17" fill="#e6e8f2"/><text x="666" y="233" fill="#344668" font-size="30" font-weight="700" font-family="Noto Sans JP,Meiryo,sans-serif">突然の質問</text><text x="666" y="278" fill="#333e55" font-size="20" font-family="Noto Sans JP,Meiryo,sans-serif">相手に開始を促されるが</text><text x="666" y="311" fill="#333e55" font-size="20" font-family="Noto Sans JP,Meiryo,sans-serif">言葉は自分で組み立てる</text>
<rect x="271" y="401" width="345" height="178" rx="17" fill="#e7eee3"/><text x="296" y="452" fill="#244d3a" font-size="30" font-weight="700" font-family="Noto Sans JP,Meiryo,sans-serif">自分の朗読練習</text><text x="296" y="497" fill="#263d32" font-size="20" font-family="Noto Sans JP,Meiryo,sans-serif">開始時刻を選べる</text><text x="296" y="530" fill="#263d32" font-size="20" font-family="Noto Sans JP,Meiryo,sans-serif">言葉は決まっている</text>
<rect x="640" y="401" width="365" height="178" rx="17" fill="#f7e4dd"/><text x="666" y="452" fill="#813d2d" font-size="30" font-weight="700" font-family="Noto Sans JP,Meiryo,sans-serif">チラシ配布の声かけ</text><text x="666" y="497" fill="#663f38" font-size="20" font-family="Noto Sans JP,Meiryo,sans-serif">通行人に合わせて開始</text><text x="666" y="530" fill="#663f38" font-size="20" font-family="Noto Sans JP,Meiryo,sans-serif">定型句の繰り返しになりやすい</text>
<text x="268" y="632" fill="#41515b" font-size="22" font-family="Noto Sans JP,Meiryo,sans-serif">← 自分で開始を選ぶ</text><text x="783" y="632" fill="#41515b" font-size="22" font-family="Noto Sans JP,Meiryo,sans-serif">相手・環境が開始を促す →</text>
<text x="58" y="685" fill="#75818a" font-size="18" font-family="Noto Sans JP,Meiryo,sans-serif">※ 研究結果のグラフではなく、記事で提案する観察枠組み。</text>
</svg>
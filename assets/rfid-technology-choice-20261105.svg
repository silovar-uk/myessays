<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-label="識別と追跡の代替技術を比較する図"><rect width="1200" height="590" rx="28" fill="#f5f8fb"/><text x="52" y="61" font-family="Arial, 'Noto Sans JP',sans-serif" font-size="32" font-weight="700" fill="#17263e">RFIDありきで考えない：先に「問い」を選ぶ</text><text x="52" y="103" font-family="Arial, 'Noto Sans JP',sans-serif" font-size="19" fill="#53647a">技術選定の概念図。範囲・精度・費用は環境と機種で変わる。</text><g font-family="Arial, 'Noto Sans JP',sans-serif"><rect x="52" y="146" width="525" height="167" rx="19" fill="white" stroke="#cbd5e1"/><rect x="73" y="171" width="150" height="39" rx="19" fill="#e5f4ed"/><text x="148" y="198" text-anchor="middle" font-size="18" fill="#0b7156">識別したい</text><text x="76" y="244" font-size="22" font-weight="700" fill="#17263e">1件ずつ手動で読む</text><text x="76" y="278" font-size="21" fill="#50627a">→ QR・バーコードを検討</text><rect x="625" y="146" width="523" height="167" rx="19" fill="white" stroke="#cbd5e1"/><rect x="647" y="171" width="150" height="39" rx="19" fill="#e3edf9"/><text x="722" y="198" text-anchor="middle" font-size="18" fill="#205ba9">まとめて読む</text><text x="650" y="244" font-size="22" font-weight="700" fill="#17263e">多数・非接触・視線不要</text><text x="650" y="278" font-size="21" fill="#50627a">→ UHF RFIDを比較検証</text><rect x="52" y="343" width="525" height="165" rx="19" fill="white" stroke="#cbd5e1"/><rect x="73" y="367" width="150" height="39" rx="19" fill="#f5ebfd"/><text x="148" y="393" text-anchor="middle" font-size="18" fill="#7151a8">位置を知る</text><text x="76" y="441" font-size="22" font-weight="700" fill="#17263e">細かな位置を連続推定</text><text x="76" y="474" font-size="21" fill="#50627a">→ UWB・測位システム</text><rect x="625" y="343" width="523" height="165" rx="19" fill="white" stroke="#cbd5e1"/><rect x="647" y="367" width="150" height="39" rx="19" fill="#fff2dc"/><text x="722" y="393" text-anchor="middle" font-size="18" fill="#9a6318">動作を知る</text><text x="650" y="441" font-size="22" font-weight="700" fill="#17263e">姿勢・状況・動きを観測</text><text x="650" y="474" font-size="21" fill="#50627a">→ 映像解析などを検討</text></g><text x="52" y="554" font-family="Arial, 'Noto Sans JP',sans-serif" font-size="18" fill="#596980">最終判断：業務の損失 × 読み取り精度 × 現場運用 × データ権利 × 総コスト</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650"><rect width="1280" height="650" fill="#F5F7FA"/><text x="66" y="83" font-family="sans-serif" font-size="41" font-weight="700" fill="#14273F">観客数は伸びた。でも、試合数も違う。</text><text x="66" y="128" font-family="sans-serif" font-size="24" fill="#52647B">リーグワン全ディビジョン総入場者数｜リーグ戦・プレーオフ・入替戦の合計</text><g font-family="sans-serif" font-size="22" fill="#334155"><line x1="100" y1="525" x2="1190" y2="525" stroke="#9AA8BA" stroke-width="2"/><g stroke="#DFE5EC" stroke-width="2"><line x1="100" y1="415" x2="1190" y2="415"/><line x1="100" y1="305" x2="1190" y2="305"/><line x1="100" y1="195" x2="1190" y2="195"/></g><text x="43" y="533">0</text><text x="24" y="423">50万</text><text x="12" y="313">100万</text><text x="12" y="203">150万</text></g><g font-family="sans-serif" text-anchor="middle"><rect x="145" y="419" width="135" height="106" rx="9" fill="#91A9C3"/><rect x="350" y="361" width="135" height="164" rx="9" fill="#91A9C3"/><rect x="555" y="274" width="135" height="251" rx="9" fill="#91A9C3"/><rect x="760" y="264" width="135" height="261" rx="9" fill="#91A9C3"/><rect x="965" y="234" width="135" height="291" rx="9" fill="#176A84"/><g font-size="22" fill="#18334A" font-weight="700"><text x="212" y="405">48.4万</text><text x="417" y="347">74.5万</text><text x="622" y="260">114.2万</text><text x="827" y="250">118.7万</text><text x="1032" y="220">132.2万</text></g><g font-size="23" fill="#18334A"><text x="212" y="562">2022</text><text x="417" y="562">22–23</text><text x="622" y="562">23–24</text><text x="827" y="562">24–25</text><text x="1032" y="562">25–26</text></g><g font-size="19" fill="#64748B"><text x="212" y="588">150試合</text><text x="417" y="588">168試合</text><text x="622" y="588">173試合</text><text x="827" y="588">223試合</text><text x="1032" y="588">223試合</text></g></g><text x="66" y="622" font-size="18" font-family="sans-serif" fill="#536275">出典：リーグワン公式／試合記録集計。初年度は中止試合あり。試合数差を無視した単純比較は禁物。</text></svg>
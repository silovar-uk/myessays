<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480"><rect width="1000" height="480" fill="#f8fafc"/><text x="38" y="48" font-size="28" font-family="sans-serif" fill="#102a43">結論と根拠の依存関係を点検する（架空例）</text><rect x="35" y="90" width="430" height="310" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="60" y="132" font-size="25" font-family="sans-serif" fill="#b91c1c">Before｜話題を並べる</text><text x="60" y="190" font-size="22" font-family="sans-serif">市場は成長している</text><text x="60" y="245" font-size="22" font-family="sans-serif">顧客は動画を使っている</text><text x="60" y="300" font-size="22" font-family="sans-serif">AIは進歩している</text><text x="60" y="365" font-size="20" font-family="sans-serif" fill="#b91c1c">→「導入すべき」は未証明</text><rect x="505" y="90" width="460" height="310" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="530" y="132" font-size="25" font-family="sans-serif" fill="#047857">After｜判断から逆算する</text><rect x="530" y="155" width="410" height="65" rx="8" fill="#dbeafe"/><text x="550" y="182" font-size="21" font-family="sans-serif">判断：有償実証に進むか？</text><text x="550" y="207" font-size="17" font-family="sans-serif">必要条件を先に定義</text><path d="M735 223 V246" stroke="#334155" stroke-width="3"/><rect x="530" y="248" width="195" height="94" rx="8" fill="#dcfce7"/><text x="543" y="277" font-size="19" font-family="sans-serif">需要の証拠</text><text x="543" y="308" font-size="17" font-family="sans-serif">予算・決裁者</text><rect x="745" y="248" width="195" height="94" rx="8" fill="#fef3c7"/><text x="758" y="277" font-size="19" font-family="sans-serif">実行の証拠</text><text x="758" y="308" font-size="17" font-family="sans-serif">費用・運用体制</text><text x="530" y="376" font-size="18" font-family="sans-serif" fill="#334155">不足なら「検証継続」と明示</text><text x="35" y="445" font-size="18" font-family="sans-serif" fill="#475569">図の目的：根拠の数ではなく、判断に必要な条件の充足を示す。</text></svg>
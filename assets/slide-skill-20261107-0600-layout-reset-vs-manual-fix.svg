<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" fill="#f8fafc"/><style>text{font-family:Arial,'Noto Sans CJK JP',sans-serif;fill:#172334}.head{font-size:26px;font-weight:bold}.small{font-size:19px}.label{font-size:22px;font-weight:bold}</style><text x="42" y="48" class="head">個別修正とレイアウト再適用</text><text x="70" y="104" class="label">個別修正</text><text x="545" y="104" class="label">共通ルールを再適用</text><g fill="white" stroke="#94a3b8" stroke-width="3"><rect x="55" y="130" width="180" height="125" rx="8"/><rect x="250" y="130" width="180" height="125" rx="8"/><rect x="530" y="130" width="180" height="125" rx="8"/><rect x="725" y="130" width="180" height="125" rx="8"/></g><g fill="#dbeafe"><rect x="73" y="147" width="135" height="20"/><rect x="281" y="170" width="135" height="20"/><rect x="548" y="147" width="135" height="20"/><rect x="743" y="147" width="135" height="20"/></g><g stroke="#64748b" stroke-width="2"><path d="M75 196h130M75 212h120M270 211h130M270 228h120M550 196h130M550 212h120M745 196h130M745 212h120"/></g><text x="70" y="302" class="small">ページごとに位置を直す</text><text x="548" y="302" class="small">同じ定義から揃える</text><text x="54" y="364" class="small">※プレースホルダーが対象。独立図形は別途確認。</text></svg>
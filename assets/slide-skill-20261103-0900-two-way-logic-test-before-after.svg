<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-labelledby="title desc"><title id="title">論理の飛躍を見つけるBefore After</title><desc id="desc">左は1試合の観察結果から全店増員へ飛躍した悪い例。右は根拠から混雑2店の追加計測を提案する改善例。架空データ。</desc><rect width="1400" height="800" fill="#f3f7fb"/><text x="48" y="62" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="39" font-weight="700" fill="#102d49">Before → After｜同じ事実でも結論は変わる</text><rect x="48" y="115" width="630" height="568" rx="18" fill="#fffaf9" stroke="#f0c7c5" stroke-width="2"/><rect x="721" y="115" width="630" height="568" rx="18" fill="#f8fffc" stroke="#b9e1d7" stroke-width="2"/><text x="77" y="168" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="30" font-weight="700" fill="#a44d4d">BEFORE｜根拠と施策が飛躍</text><text x="750" y="168" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="30" font-weight="700" fill="#137466">AFTER｜まず検証する</text><rect x="77" y="202" width="570" height="119" rx="12" fill="#fae6e5" stroke="#f0c7c5" stroke-width="2"/><text x="98" y="252" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="29" font-weight="700" fill="#8d3f42">結論：全店舗で増員すべき</text><text x="98" y="292" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#a55b5c">（増員の有効性は未確認）</text><rect x="750" y="202" width="570" height="119" rx="12" fill="#def5ec" stroke="#b9e1d7" stroke-width="2"/><text x="770" y="252" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="29" font-weight="700" fill="#0b6a60">結論：混雑2店を再計測する</text><text x="770" y="292" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#18786e">（全店増員の判断は保留）</text><text x="82" y="384" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#19364b">観察：待機人数の68％が2店に集中</text><text x="82" y="436" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#a44d4d">飛躍：混雑＝人員不足と断定</text><text x="82" y="488" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#19364b">不足：提供速度や導線を未確認</text><text x="756" y="384" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#19364b">観察：待機人数の68％が2店に集中</text><text x="756" y="436" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#19364b">解釈：原因はまだ複数考えられる</text><text x="756" y="488" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#19364b">次：待ち時間・処理能力を比較</text><rect x="79" y="557" width="564" height="82" rx="12" fill="#f9e4e3" stroke="#f0c7c5" stroke-width="2"/><text x="100" y="606" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="700" fill="#923c3d">× 施策の前提が根拠から導けない</text><rect x="752" y="557" width="564" height="82" rx="12" fill="#dff5ef" stroke="#b9e1d7" stroke-width="2"/><text x="773" y="606" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="700" fill="#0b7066">○ 観察から検証へ、論理がつながる</text><text x="49" y="738" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" font-weight="400" fill="#5a6f80">※68％は説明用の架空データ。実際の施設・店舗・試合の実績ではない。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="730" viewBox="0 0 1160 730" role="img" aria-labelledby="t d"><title id="t">Before After比較</title><desc id="d">別々のグラフで量と効率を示すBeforeと、同じ時間軸に重ね施策注釈と成長段階を付けるAfter。全て架空の形状。</desc><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif}</style><rect x="0" y="0" width="1160" height="730" rx="0" fill="#F5F8FC" stroke="none"/><rect x="0" y="0" width="1160" height="12" rx="0" fill="#0C849D" stroke="none"/><text x="58" y="66" font-size="24" font-weight="750" fill="#11778C">BEFORE → AFTER  /  DECISION-READY CHART</text><text x="58" y="118" font-size="41" font-weight="800" fill="#152C42">「数字の報告」を「経営の説明」に変える</text><rect x="58" y="157" width="495" height="489" rx="18" fill="#FFFFFF" stroke="#D9E3EB"/><rect x="604" y="157" width="498" height="489" rx="18" fill="#FFFFFF" stroke="#B8D8E1"/><rect x="84" y="184" width="145" height="48" rx="10" fill="#FBE9EA" stroke="none"/><text x="107" y="216" font-size="26" font-weight="750" fill="#A7494C">BEFORE</text><rect x="630" y="184" width="135" height="48" rx="10" fill="#E0F5F6" stroke="none"/><text x="652" y="216" font-size="26" font-weight="750" fill="#157B87">AFTER</text><text x="88" y="275" font-size="28" font-weight="700" fill="#243B51">設置台数</text><text x="88" y="468" font-size="28" font-weight="700" fill="#243B51">台あたりレンタル</text><rect x="120" y="360" width="40" height="40" rx="3" fill="#35B6D0" stroke="none"/><rect x="182" y="341" width="40" height="59" rx="3" fill="#35B6D0" stroke="none"/><rect x="244" y="322" width="40" height="78" rx="3" fill="#35B6D0" stroke="none"/><rect x="306" y="303" width="40" height="97" rx="3" fill="#35B6D0" stroke="none"/><rect x="368" y="284" width="40" height="116" rx="3" fill="#35B6D0" stroke="none"/><rect x="430" y="265" width="40" height="135" rx="3" fill="#35B6D0" stroke="none"/><polyline points="122,572 186,560 250,553 314,533 378,523 442,507" fill="none" stroke="#223A50" stroke-width="5" stroke-linecap="round"/><text x="100" y="618" font-size="22" font-weight="700" fill="#A7494C">系列が別々で、時期の説明が弱い</text><text x="631" y="272" font-size="25" font-weight="700" fill="#243B51">供給量＋利用効率＋施策＋期間</text><rect x="774" y="288" width="160" height="44" rx="8" fill="#FFF0DA" stroke="none"/><text x="797" y="318" font-size="23" font-weight="700" fill="#9E671C">施策注釈</text><path d="M 852 332 V 380" stroke="#C28D4A" stroke-width="2" stroke-dasharray="4 4"/><rect x="650" y="479" width="40" height="72" rx="3" fill="#37B9D1" stroke="none"/><rect x="708" y="457" width="40" height="94" rx="3" fill="#37B9D1" stroke="none"/><rect x="766" y="435" width="40" height="116" rx="3" fill="#37B9D1" stroke="none"/><rect x="824" y="413" width="40" height="138" rx="3" fill="#37B9D1" stroke="none"/><rect x="882" y="391" width="40" height="160" rx="3" fill="#37B9D1" stroke="none"/><rect x="940" y="369" width="40" height="182" rx="3" fill="#37B9D1" stroke="none"/><rect x="998" y="347" width="40" height="204" rx="3" fill="#37B9D1" stroke="none"/><polyline points="670,541 728,521 786,520 844,488 902,461 960,442 1018,417" fill="none" stroke="#223A50" stroke-width="5" stroke-linecap="round"/><rect x="643" y="572" width="138" height="44" rx="4" fill="#D9E5EC" stroke="none"/><rect x="786" y="572" width="138" height="44" rx="4" fill="#C4DAE7" stroke="none"/><rect x="929" y="572" width="143" height="44" rx="4" fill="#A9CBDD" stroke="none"/><text x="661" y="601" font-size="23" font-weight="700" fill="#233D51">拡大</text><text x="801" y="601" font-size="23" font-weight="700" fill="#233D51">精査</text><text x="945" y="601" font-size="23" font-weight="700" fill="#233D51">再拡大</text><text x="627" y="641" font-size="21" font-weight="700" fill="#147786">「いつ・何が・どう変わったか」を問える</text><text x="58" y="697" font-size="22" font-weight="500" fill="#63788C">※説明用の架空の曲線・棒。INFORICHの実測値や効果推定ではありません。</text></svg>
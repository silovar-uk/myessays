<svg xmlns="http://www.w3.org/2000/svg" width="760" height="940" viewBox="0 0 760 940" role="img" aria-labelledby="title desc">
<title id="title">大学スポーツの権利整理図</title><desc id="desc">学生本人、学校、競技団体、映像制作会社が関わる権利を契約ごとに確認する概念図。</desc>
<rect width="760" height="940" fill="#F8F9FB"/><text x="42" y="72" font-size="33" fill="#192936" font-weight="700" font-family="sans-serif">広告の前に「誰の権利？」</text><text x="42" y="114" font-size="23" fill="#526579" font-family="sans-serif">一つの映像でも、許諾は一つとは限らない</text>
<g font-family="sans-serif"><rect x="42" y="162" width="676" height="148" rx="23" fill="#E9F5F2" stroke="#A4CEC5"/><text x="74" y="214" fill="#164F46" font-size="29" font-weight="700">本人の氏名・肖像</text><text x="74" y="254" fill="#295E56" font-size="23">広告出演・本人の推薦・SNSでの紹介</text><text x="74" y="286" fill="#295E56" font-size="20">確認：本人の同意、契約期間、用途</text>
<rect x="42" y="330" width="676" height="148" rx="23" fill="#EEF0F9" stroke="#BFC9E9"/><text x="74" y="382" fill="#314478" font-size="29" font-weight="700">大学・チームの表示</text><text x="74" y="422" fill="#4B6088" font-size="23">校名・校章・ユニフォーム・公式性</text><text x="74" y="454" fill="#4B6088" font-size="20">確認：大学・部・権利者の許諾範囲</text>
<rect x="42" y="498" width="676" height="148" rx="23" fill="#FDF1E8" stroke="#E6C3A5"/><text x="74" y="550" fill="#85512B" font-size="29" font-weight="700">大会・競技団体の権利</text><text x="74" y="590" fill="#92643F" font-size="23">大会名・公式協賛・配信の取り扱い</text><text x="74" y="622" fill="#92643F" font-size="20">確認：主催者規則、契約、許諾媒体</text>
<rect x="42" y="666" width="676" height="148" rx="23" fill="#EDF2F6" stroke="#BECBD4"/><text x="74" y="718" fill="#355061" font-size="29" font-weight="700">写真・映像の制作物</text><text x="74" y="758" fill="#526879" font-size="23">撮影者・配信者・制作会社等との契約</text><text x="74" y="790" fill="#526879" font-size="20">確認：著作権、二次利用、素材の再配布</text></g>
<text x="380" y="869" text-anchor="middle" fill="#182B3D" font-size="26" font-weight="700" font-family="sans-serif">許諾を分けて、初めて商品にできる</text>
<text x="380" y="907" text-anchor="middle" fill="#6B7E8C" font-size="18" font-family="sans-serif">筆者作成／法的所有者は個別契約によって異なる</text>
</svg>
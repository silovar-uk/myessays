<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="1000" height="430" fill="#f7fafc"/><text x="42" y="54" font-family="sans-serif" font-size="29">増収減益を見たら、原因を決めつけず分解する</text><g font-family="sans-serif" font-size="23" text-anchor="middle"><rect x="35" y="110" width="260" height="95" rx="12" fill="#d9eaf8"/><text x="165" y="148">売上増・利益減</text><text x="165" y="181">事実を確認</text><rect x="370" y="110" width="260" height="95" rx="12" fill="#f9e5c8"/><text x="500" y="148">費用の内訳</text><text x="500" y="181">変動・固定・一時</text><rect x="705" y="110" width="260" height="95" rx="12" fill="#d9eedb"/><text x="835" y="148">対策を選択</text><text x="835" y="181">品質も検証</text></g><g stroke="#536b80" stroke-width="5"><path d="M300 158 H357"/><path d="M635 158 H692"/></g><g fill="#536b80"><path d="M357 158 l-15 -10 v20z"/><path d="M692 158 l-15 -10 v20z"/></g><text x="45" y="282" font-family="sans-serif" font-size="21">確認するデータ：単価・数量・費目別推移・設備稼働・サービス品質</text><text x="45" y="333" font-family="sans-serif" font-size="19">図は分析手順の例。特定企業の費用増加原因を示すものではない。</text></svg>
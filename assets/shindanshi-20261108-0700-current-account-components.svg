<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440"><rect width="960" height="440" fill="#f8fafc"/><text x="45" y="65" font-size="29" font-family="sans-serif" font-weight="bold" fill="#172554">経常収支を構成する三つの収支</text><rect x="50" y="145" width="260" height="150" rx="15" fill="#e0f2fe" stroke="#2563eb"/><text x="70" y="210" font-family="sans-serif" font-size="21" fill="#172554">貿易・サービス</text><text x="70" y="250" font-family="sans-serif" font-size="17" fill="#334155">財・サービス取引</text><rect x="350" y="145" width="260" height="150" rx="15" fill="#dbeafe" stroke="#2563eb"/><text x="370" y="210" font-family="sans-serif" font-size="21" fill="#172554">第一次所得</text><text x="370" y="250" font-family="sans-serif" font-size="17" fill="#334155">配当・利子など</text><rect x="650" y="145" width="260" height="150" rx="15" fill="#e0f2fe" stroke="#2563eb"/><text x="670" y="210" font-family="sans-serif" font-size="21" fill="#172554">第二次所得</text><text x="670" y="250" font-family="sans-serif" font-size="17" fill="#334155">移転など</text><text x="50" y="360" font-family="sans-serif" font-size="19" fill="#334155">概念図・実測値ではない｜出典：日本銀行講演を基に独自作成</text></svg>
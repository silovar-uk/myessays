<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">ディープテックの三つの関門</title><desc id="d">研究が成功しても、量産と社会での利用という別々の検証が必要になる構造を図解したもの</desc><rect width="1200" height="675" rx="30" fill="#0b1724"/><text x="66" y="92" font-size="42" font-weight="bold" font-family="sans-serif" fill="#f7fafc">「できた」は、まだ「届けられる」ではない。</text><text x="69" y="138" font-size="24" font-family="sans-serif" fill="#c9d6dd">三つの問いは独立している。どれか一つの成功では、事業にならない。</text><g font-family="sans-serif"><rect x="65" y="205" width="332" height="315" rx="19" fill="#17364a" stroke="#62c7db" stroke-width="3"/><text x="95" y="265" font-size="22" fill="#8bdfed">01　研究・技術</text><text x="95" y="324" font-size="36" font-weight="bold" fill="#fff">動くのか？</text><text x="95" y="385" font-size="24" fill="#e6eff2">性能・再現性・耐久性</text><text x="95" y="427" font-size="24" fill="#e6eff2">実験と実環境の差</text><text x="95" y="484" font-size="19" fill="#9edbe6">必要な証拠：試験記録</text><rect x="433" y="205" width="332" height="315" rx="19" fill="#3d304c" stroke="#dfafed" stroke-width="3"/><text x="464" y="265" font-size="22" fill="#ebc4fb">02　製造・供給</text><text x="464" y="324" font-size="36" font-weight="bold" fill="#fff">増やせるのか？</text><text x="464" y="385" font-size="24" fill="#f3ebf4">歩留まり・品質・原価</text><text x="464" y="427" font-size="24" fill="#f3ebf4">設備・材料・安定供給</text><text x="464" y="484" font-size="19" fill="#efc6fa">必要な証拠：生産実績</text><rect x="801" y="205" width="332" height="315" rx="19" fill="#413928" stroke="#e6c57c" stroke-width="3"/><text x="833" y="265" font-size="22" fill="#f8d891">03　市場・社会</text><text x="833" y="324" font-size="36" font-weight="bold" fill="#fff">使われるのか？</text><text x="833" y="385" font-size="24" fill="#f4f0e5">購入・導入・安全性</text><text x="833" y="427" font-size="24" fill="#f4f0e5">制度・運用・継続利用</text><text x="833" y="484" font-size="19" fill="#f8dc98">必要な証拠：顧客行動</text><text x="418" y="372" font-size="30" fill="#fff">→</text><text x="782" y="372" font-size="30" fill="#fff">→</text><rect x="65" y="557" width="1068" height="69" rx="16" fill="#22333b"/><text x="87" y="601" font-size="24" fill="#fff">検証の順序は案件ごとに異なる。最も致命的な未知から先に試す。</text><text x="66" y="655" font-size="16" fill="#a9c0cd">筆者作図｜EIC・NEDO・NASA・FDAの一次資料を踏まえた分析上の整理。公的な公式分類ではない。</text></g></svg>
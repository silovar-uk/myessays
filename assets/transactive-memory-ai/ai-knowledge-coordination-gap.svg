<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AIで知識は広がるが協調は自動では増えない</title><desc id="desc">人間と生成AIの協働で知識の幅と深さは増える一方、知識の協調は自動的に改善するとは限らないという2026年研究の要点を示す。</desc><rect width="1200" height="675" rx="36" fill="#F7F4EE"/><text x="64" y="78" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="800" fill="#A51C30">HUMAN × GENAI / 2026</text><text x="64" y="128" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="900" fill="#1F2328">知識源を増やすことと、チームをつなぐことは別問題。</text><g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><rect x="70" y="205" width="500" height="330" rx="30" fill="#FFFFFF" stroke="#D8D1C7" stroke-width="3"/><rect x="630" y="205" width="500" height="330" rx="30" fill="#FFF4F1" stroke="#A51C30" stroke-width="3"/><text x="320" y="260" text-anchor="middle" font-size="28" font-weight="900" fill="#1F2328">SPECIALIZATION</text><text x="320" y="300" text-anchor="middle" font-size="22" font-weight="800" fill="#59636E">知識の幅・深さ</text><path d="M150 455 L150 365 L230 365 L230 320 L310 320 L310 280 L390 280 L390 245 L470 245" fill="none" stroke="#A51C30" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="495" text-anchor="middle" font-size="24" font-weight="900" fill="#A51C30">増える</text><text x="880" y="260" text-anchor="middle" font-size="28" font-weight="900" fill="#A51C30">COORDINATION</text><text x="880" y="300" text-anchor="middle" font-size="22" font-weight="800" fill="#59636E">誰がいつ何を使うか</text><line x1="735" y1="385" x2="1025" y2="385" stroke="#59636E" stroke-width="10" stroke-linecap="round"/><circle cx="735" cy="385" r="18" fill="#59636E"/><circle cx="1025" cy="385" r="18" fill="#59636E"/><text x="880" y="445" text-anchor="middle" font-size="24" font-weight="900" fill="#59636E">有意な改善は確認されず</text><text x="600" y="620" text-anchor="middle" font-size="24" font-weight="900" fill="#1F2328">AI導入は「知識の追加」ではなく、「検索・検証・責任の再設計」までやって初めてチーム設計になる。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI能力のギザギザした境界</title><desc id="desc">AIが得意な領域では速度と品質が上がる一方、能力境界の外では正答率が下がるというジャギッド・フロンティアの概念を示す。</desc><rect width="1200" height="675" rx="36" fill="#F7F4EE"/><text x="64" y="78" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="800" fill="#A51C30">JAGGED TECHNOLOGICAL FRONTIER</text><text x="64" y="128" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="900" fill="#1F2328">AIの「得意・不得意」は、きれいな一本線ではない。</text><g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><path d="M90 505 C180 320 260 420 345 260 C430 470 520 300 610 400 C700 220 790 455 875 285 C960 425 1030 315 1110 230" fill="none" stroke="#A51C30" stroke-width="10" stroke-linecap="round"/><text x="170" y="555" font-size="22" font-weight="900" fill="#1F2328">AIが強い</text><text x="915" y="555" font-size="22" font-weight="900" fill="#1F2328">AIが弱い</text><circle cx="300" cy="310" r="34" fill="#1F2328"/><text x="300" y="318" text-anchor="middle" font-size="18" font-weight="900" fill="#FFFFFF">速い</text><circle cx="850" cy="360" r="34" fill="#A51C30"/><text x="850" y="368" text-anchor="middle" font-size="18" font-weight="900" fill="#FFFFFF">誤る</text><rect x="690" y="455" width="390" height="80" rx="20" fill="#FFFFFF" stroke="#D8D1C7" stroke-width="3"/><text x="885" y="488" text-anchor="middle" font-size="20" font-weight="800" fill="#59636E">BCG実験：境界外の課題では</text><text x="885" y="520" text-anchor="middle" font-size="22" font-weight="900" fill="#A51C30">AI利用者の正答が平均19pt低下</text><text x="600" y="625" text-anchor="middle" font-size="24" font-weight="900" fill="#1F2328">「AIに聞くか」より、「この仕事はAIのどの能力領域か」を知ることが新しい専門性になる。</text></g></svg>
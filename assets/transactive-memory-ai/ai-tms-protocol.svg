<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">人間とAIのトランザクティブメモリー設計</title><desc id="desc">AI導入時に必要な三つの設計として、得意領域の地図、検証ルール、責任と統合の流れを示す。</desc><rect width="1200" height="675" rx="36" fill="#F7F4EE"/><text x="64" y="78" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="800" fill="#A51C30">HUMAN–AI TMS PROTOCOL</text><text x="64" y="128" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="900" fill="#1F2328">AIを「使う」ではなく、知識システムの役割を決める。</text><g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><rect x="70" y="215" width="310" height="315" rx="28" fill="#FFFFFF" stroke="#59636E" stroke-width="3"/><rect x="445" y="215" width="310" height="315" rx="28" fill="#FFFFFF" stroke="#A51C30" stroke-width="3"/><rect x="820" y="215" width="310" height="315" rx="28" fill="#FFFFFF" stroke="#59636E" stroke-width="3"/><text x="225" y="270" text-anchor="middle" font-size="26" font-weight="900" fill="#1F2328">1. SPECIALIZATION</text><text x="225" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#59636E">何をAIへ振るか</text><text x="225" y="365" text-anchor="middle" font-size="19" fill="#1F2328">発散 / 要約 / 変換</text><text x="225" y="402" text-anchor="middle" font-size="19" fill="#1F2328">調査補助 / 比較</text><text x="225" y="470" text-anchor="middle" font-size="20" font-weight="800" fill="#59636E">能力境界を更新する</text><text x="600" y="270" text-anchor="middle" font-size="26" font-weight="900" fill="#A51C30">2. CREDIBILITY</text><text x="600" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#A51C30">何を疑うか</text><text x="600" y="365" text-anchor="middle" font-size="19" fill="#1F2328">一次情報 / 出典確認</text><text x="600" y="402" text-anchor="middle" font-size="19" fill="#1F2328">高リスク判断は人が再検証</text><text x="600" y="470" text-anchor="middle" font-size="20" font-weight="800" fill="#A51C30">信頼を0/1にしない</text><text x="975" y="270" text-anchor="middle" font-size="26" font-weight="900" fill="#1F2328">3. COORDINATION</text><text x="975" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#59636E">誰が統合するか</text><text x="975" y="365" text-anchor="middle" font-size="19" fill="#1F2328">質問者 / 検証者 / 決裁者</text><text x="975" y="402" text-anchor="middle" font-size="19" fill="#1F2328">最終責任の所在</text><text x="975" y="470" text-anchor="middle" font-size="20" font-weight="800" fill="#59636E">出力より流れを設計する</text><text x="600" y="620" text-anchor="middle" font-size="24" font-weight="900" fill="#1F2328">プロンプト設計の次は、「知る・疑う・決める」の分業設計。</text></g></svg>
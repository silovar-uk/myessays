<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="左のBeforeは写真、表、施策が競合する。右のAfterは結論、根拠、判断の順に整列する。"><rect width="1200" height="590" fill="#f4f6fa"/><text x="55" y="55" font-size="29" font-family="sans-serif" font-weight="bold" fill="#14243a">視線の順番を決める：Before → After</text><rect x="45" y="90" width="530" height="425" rx="16" fill="white" stroke="#ccd5df"/><rect x="625" y="90" width="530" height="425" rx="16" fill="white" stroke="#ccd5df"/><text x="72" y="128" font-size="25" font-family="sans-serif" fill="#ad3840">BEFORE｜どこから読む？</text><rect x="78" y="163" width="285" height="185" rx="9" fill="#cbd6e3"/><text x="165" y="255" font-size="25" font-family="sans-serif" fill="#26394f">大きな写真</text><rect x="382" y="168" width="155" height="76" rx="6" fill="#f9e2ad"/><text x="400" y="211" font-size="20" font-family="sans-serif">施策名</text><rect x="92" y="376" width="250" height="90" rx="6" fill="#d8e7f8"/><text x="143" y="428" font-size="23" font-family="sans-serif">数値表</text><text x="376" y="418" font-size="19" font-family="sans-serif" fill="#8d4450">結論は？</text><text x="653" y="128" font-size="25" font-family="sans-serif" fill="#16705a">AFTER｜読む順番が明確</text><rect x="655" y="155" width="470" height="76" rx="8" fill="#17395b"/><text x="676" y="190" font-size="21" font-family="sans-serif" fill="white">① 結論：法人利用の試験導入を優先</text><rect x="655" y="257" width="470" height="118" rx="8" fill="#e2effb"/><text x="679" y="299" font-size="23" font-family="sans-serif" fill="#17395b">② 根拠：曜日別利用率・顧客の声</text><text x="679" y="340" font-size="17" font-family="sans-serif" fill="#52677c">※架空の構成例／実測値なし</text><rect x="655" y="402" width="470" height="75" rx="8" fill="#e1f3e9"/><text x="679" y="447" font-size="21" font-family="sans-serif" fill="#17614b">③ 判断：4週間の実証を承認するか</text><text x="58" y="557" font-size="18" font-family="sans-serif" fill="#566478">図の目的：読者が「結論→根拠→判断」を迷わず追える配置を理解する。独自作成。</text></svg>
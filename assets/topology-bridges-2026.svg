<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">ケーニヒスベルクの七つの橋のグラフ</title><desc id="d">頂点はA北岸 B中央の島 C東側の島 D南岸。A-Bが2本、B-Dが2本、A-Cが1本、B-Cが1本、C-Dが1本。次数は3,5,3,3で奇数頂点が4つ。</desc><rect width="1200" height="560" fill="#f5f4f0"/><text x="55" y="62" font-family="sans-serif" font-size="33" font-weight="700" fill="#263946">町の地図を捨てると、不可能である理由が残る</text><text x="55" y="99" font-family="sans-serif" font-size="19" fill="#64757e">七つの橋の問題（1736年）：距離・角度を捨て、接続関係だけを残す</text><rect x="50" y="139" width="700" height="348" rx="20" fill="#fff" stroke="#d3dee0" stroke-width="2"/><g stroke="#ba8855" stroke-width="11" fill="none" stroke-linecap="round"><path d="M242 249 Q328 128 398 247"/><path d="M242 249 Q328 346 398 247"/><path d="M398 247 Q502 349 398 417"/><path d="M398 247 Q304 355 398 417"/><path d="M242 249 Q399 70 575 249"/><path d="M398 247 L575 249"/><path d="M575 249 Q570 397 398 417"/></g><g font-family="sans-serif" text-anchor="middle"><circle cx="242" cy="249" r="39" fill="#35687b"/><text x="242" y="259" font-size="25" fill="#fff">A</text><circle cx="398" cy="247" r="44" fill="#af4f3c"/><text x="398" y="257" font-size="25" fill="#fff">B</text><circle cx="575" cy="249" r="39" fill="#35687b"/><text x="575" y="259" font-size="25" fill="#fff">C</text><circle cx="398" cy="417" r="39" fill="#35687b"/><text x="398" y="426" font-size="25" fill="#fff">D</text></g><rect x="780" y="139" width="370" height="348" rx="20" fill="#e7f0ef"/><text x="810" y="188" font-family="sans-serif" font-size="22" font-weight="700" fill="#1e544c">頂点につながる橋の本数</text><g font-family="sans-serif" font-size="25" fill="#263946"><text x="820" y="239">A（北岸）= 3本</text><text x="820" y="285">B（中央島）= 5本</text><text x="820" y="331">C（東側島）= 3本</text><text x="820" y="377">D（南岸）= 3本</text></g><text x="813" y="428" font-family="sans-serif" font-size="21" font-weight="700" fill="#a24a34">奇数が4つ → 一筆書き不可</text><text x="56" y="536" font-family="sans-serif" font-size="17" fill="#66757e">図：本記事のための模式図。元の地形配置は再現せず、橋の本数・接続先を正確に表した。</text></svg>
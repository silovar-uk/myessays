<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><rect width="1200" height="580" fill="#f7f9fc"/><text x="55" y="62" font-size="32" font-family="sans-serif" font-weight="bold">売上ではなく、1顧客あたりの採算から検証する</text><text x="55" y="100" font-size="19" font-family="sans-serif">仮想例｜年間契約100万円、変動費60万円、獲得費30万円</text><g font-family="sans-serif" font-size="25" text-anchor="middle"><rect x="60" y="160" width="300" height="125" rx="16" fill="#dceafb"/><text x="210" y="215">売上 100万円</text><text x="210" y="250" font-size="18">顧客1社・年間</text><rect x="450" y="160" width="300" height="125" rx="16" fill="#ffe4d9"/><text x="600" y="215">変動費 60万円</text><text x="600" y="250" font-size="18">配信・運用・制作</text><rect x="840" y="160" width="300" height="125" rx="16" fill="#d9f2e3"/><text x="990" y="215">限界利益 40万円</text><text x="990" y="250" font-size="18">固定費控除前</text></g><g stroke="#39495a" stroke-width="4" fill="none"><path d="M360 223H450"/><path d="M750 223H840"/></g><text x="395" y="206" font-size="28">−</text><text x="788" y="206" font-size="28">＝</text><rect x="65" y="355" width="1070" height="135" rx="16" fill="white" stroke="#aab8c6"/><text x="95" y="402" font-size="25" font-family="sans-serif">初年度：限界利益40万円 − 顧客獲得費30万円 ＝ 10万円</text><text x="95" y="447" font-size="21" font-family="sans-serif">判断：継続率・初期開発費・共通固定費を確認するまで「儲かる」と断定しない</text><text x="65" y="543" font-size="17" font-family="sans-serif" fill="#526171">※説明用の架空データ。限界利益は固定費や税を控除する前の金額。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f4f1ea"/><g font-family="Arial" fill="#171717"><text x="600" y="80" text-anchor="middle" font-size="34">FREEDOM IS A BUDGET</text><text x="600" y="120" text-anchor="middle" font-size="20">Do not spend attention equally on every variable.</text><rect x="100" y="190" width="430" height="310" rx="24" fill="white" stroke="#222"/><text x="315" y="245" text-anchor="middle" font-size="25">EVERYTHING OPEN</text><text x="150" y="310" font-size="22">font · color · spacing</text><text x="150" y="355" font-size="22">radius · shadow · grid</text><text x="150" y="400" font-size="22">image · copy · CTA</text><text x="315" y="465" text-anchor="middle" font-size="21">attention fragments</text><rect x="670" y="190" width="430" height="310" rx="24" fill="white" stroke="#222"/><text x="885" y="245" text-anchor="middle" font-size="25">EDITED FREEDOM</text><text x="720" y="310" font-size="22">FIX: type · color · spacing</text><text x="720" y="365" font-size="22">EXPLORE: image · copy</text><text x="720" y="410" font-size="22">EXPLORE: hierarchy · CTA</text><text x="885" y="465" text-anchor="middle" font-size="21">attention concentrates</text><text x="600" y="585" text-anchor="middle" font-size="28">Constraint can move creativity instead of deleting it.</text></g></svg>
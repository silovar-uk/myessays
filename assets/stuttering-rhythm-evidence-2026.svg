<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="t d"><title id="t">斉読とリズムの研究結果を対照する</title><desc id="d">2022年の脳機能研究は聴覚と運動領域の協調を示唆。2025年の音声リズム比較では、吃音のある人とない人は斉読によってリズムが逆向きに変化した。外部リズムひとつですべてを説明できない。</desc><rect width="1120" height="590" fill="#f7f5f2"/><text x="62" y="72" font-size="38" font-weight="700" fill="#1e313c" font-family="Noto Sans JP,Meiryo,sans-serif">「リズムで話せる」＝「原因はリズム」？</text><text x="63" y="113" font-size="19" fill="#57656e" font-family="Noto Sans JP,Meiryo,sans-serif">似た現象を、異なる測定方法で調べた二つの研究を対照</text>
<rect x="60" y="157" width="484" height="288" rx="22" fill="#e2ebe5"/><text x="91" y="212" font-size="32" font-weight="700" fill="#235445" font-family="Noto Sans JP,Meiryo,sans-serif">2022年｜脳機能画像</text><text x="91" y="263" font-size="21" fill="#274c40" font-family="Noto Sans JP,Meiryo,sans-serif">一人で読む ／ 声を合わせて読む</text><path d="M126 320 L485 320" stroke="#7aab8d" stroke-width="5" stroke-linecap="round"/><circle cx="152" cy="320" r="16" fill="#2b785b"/><circle cx="460" cy="320" r="16" fill="#2b785b"/><text x="91" y="380" font-size="22" fill="#274c40" font-family="Noto Sans JP,Meiryo,sans-serif">聴覚系と発話運動系の協調が</text><text x="91" y="414" font-size="22" fill="#274c40" font-family="Noto Sans JP,Meiryo,sans-serif">流暢性に関わる可能性を示唆</text>
<rect x="575" y="157" width="485" height="288" rx="22" fill="#ebe5f3"/><text x="606" y="212" font-size="32" font-weight="700" fill="#503d70" font-family="Noto Sans JP,Meiryo,sans-serif">2025年｜音声リズム測定</text><text x="606" y="263" font-size="21" fill="#493b5f" font-family="Noto Sans JP,Meiryo,sans-serif">吃音のある成人20人 ／ 対照20人</text><text x="606" y="320" font-size="23" fill="#493b5f" font-family="Noto Sans JP,Meiryo,sans-serif">吃音のある群　→ 主な変調周波数 ↑</text><text x="606" y="358" font-size="23" fill="#493b5f" font-family="Noto Sans JP,Meiryo,sans-serif">対照群　　　　→ 主な変調周波数 ↓</text><text x="606" y="411" font-size="20" fill="#493b5f" font-family="Noto Sans JP,Meiryo,sans-serif">同じリズムを模倣する説には限定的支持</text>
<rect x="64" y="473" width="993" height="70" rx="14" fill="#202f3a"/><text x="96" y="517" font-size="26" fill="#ffffff" font-weight="700" font-family="Noto Sans JP,Meiryo,sans-serif">分かったのは効果の存在。機序はまだ一つに決まっていない。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270"><rect width="900" height="270" fill="#f7f9fc"/><text x="30" y="42" font-size="26" fill="#17283e">共同配送の導入判断（提案）</text><rect x="25" y="91" width="264" height="95" rx="12" fill="#24598e"/><text x="39" y="144" font-size="19" fill="white">1. 納品条件が両立するか</text><rect x="320" y="91" width="264" height="95" rx="12" fill="#24598e"/><text x="334" y="144" font-size="19" fill="white">2. 積載余力があるか</text><rect x="615" y="91" width="264" height="95" rx="12" fill="#176c65"/><text x="629" y="144" font-size="19" fill="white">3. 総費用と品質が改善するか</text><text x="30" y="236" font-size="17">各段階で条件を満たさなければ対象区間を再検討。出典：本稿の実務提案</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f3f0e8"/><g font-family="Arial" fill="#161616"><text x="600" y="75" text-anchor="middle" font-size="34">FROM PROHIBITION TO RANGE OF MOTION</text><rect x="80" y="155" width="460" height="370" rx="24" fill="#fff" stroke="#111"/><rect x="660" y="155" width="460" height="370" rx="24" fill="#fff" stroke="#111"/><text x="310" y="215" text-anchor="middle" font-size="28">BEFORE</text><text x="890" y="215" text-anchor="middle" font-size="28">AFTER</text><text x="310" y="295" text-anchor="middle" font-size="22">“Follow the guideline.”</text><text x="310" y="350" text-anchor="middle" font-size="20">What can I change?</text><text x="310" y="400" text-anchor="middle" font-size="20">What will get rejected?</text><text x="890" y="285" text-anchor="middle" font-size="22">KEEP: semantic roles</text><text x="890" y="335" text-anchor="middle" font-size="22">RANGE: grid / scale</text><text x="890" y="385" text-anchor="middle" font-size="22">EXPLORE: photo / copy</text><text x="890" y="450" text-anchor="middle" font-size="20">The designer sees the playable field.</text><text x="600" y="605" text-anchor="middle" font-size="27">A useful guideline shows where movement is safe.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f3f0e8"/><g font-family="Arial" fill="#161616"><text x="600" y="72" text-anchor="middle" font-size="34">IDENTITY STRESS TEST</text><text x="600" y="112" text-anchor="middle" font-size="20">Remove one cue at a time. Find the breaking point.</text><g font-size="22"><text x="130" y="205">1  REMOVE LOGO</text><text x="130" y="265">2  REMOVE COLOR</text><text x="130" y="325">3  CHANGE TYPEFACE</text><text x="130" y="385">4  BREAK THE GRID</text><text x="130" y="445">5  CHANGE PHOTOGRAPHY</text><text x="130" y="505">6  KEEP ONLY VOICE</text></g><line x1="650" y1="190" x2="650" y2="510" stroke="#111" stroke-width="3"/><circle cx="650" cy="220" r="10"/><circle cx="650" cy="280" r="10"/><circle cx="650" cy="340" r="10"/><circle cx="650" cy="400" r="10"/><circle cx="650" cy="460" r="10"/><text x="770" y="280" font-size="24">STILL RECOGNIZABLE?</text><text x="770" y="345" font-size="24">WHEN DOES IT BREAK?</text><text x="770" y="430" font-size="21">The answer reveals</text><text x="770" y="465" font-size="21">what actually carries identity.</text><text x="600" y="610" text-anchor="middle" font-size="26">Test the boundary instead of memorizing the rule.</text></g></svg>
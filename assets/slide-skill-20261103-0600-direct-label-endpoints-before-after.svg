<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 730" width="1400" height="730" role="img" aria-labelledby="t d"><title id="t">凡例と直接ラベルのBefore After比較</title><desc id="d">架空の2023年から2026年の席種別来場率を示す折れ線グラフ。左は下部の凡例と線の色を照合する形式。右は線の終点に一般席35％、ファミリー席32％、企画席20％と直接書いた形式。数値は説明用の架空データ。</desc><rect x="0" y="0" width="1400" height="730" rx="0" fill="#f3f7fb" stroke="none"/><text x="34" y="58" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="41" fill="#122c49" font-weight="700">凡例を読む → 線の近くで読む</text><text x="35" y="94" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" fill="#50657a" font-weight="400">図1｜色と名前を往復せず、グラフの中で系列を特定する</text><rect x="35" y="112" width="650" height="540" rx="20" fill="#ffffff" stroke="#dce6ef"/><rect x="55" y="132" width="132" height="42" rx="11" fill="#fce5e4" stroke="none"/><text x="78" y="161" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="23" fill="#9e363a" font-weight="700">BEFORE</text><text x="55" y="202" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="27" fill="#172c45" font-weight="700">凡例を探して色を照合</text><line x1="107" y1="547" x2="490" y2="547" stroke="#e5eaf0" stroke-width="2"/><text x="59" y="554" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="19" fill="#617183" font-weight="400">0</text><line x1="107" y1="472.25" x2="490" y2="472.25" stroke="#e5eaf0" stroke-width="2"/><text x="59" y="479.25" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="19" fill="#617183" font-weight="400">10</text><line x1="107" y1="397.5" x2="490" y2="397.5" stroke="#e5eaf0" stroke-width="2"/><text x="59" y="404.5" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="19" fill="#617183" font-weight="400">20</text><line x1="107" y1="322.75" x2="490" y2="322.75" stroke="#e5eaf0" stroke-width="2"/><text x="59" y="329.75" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-s
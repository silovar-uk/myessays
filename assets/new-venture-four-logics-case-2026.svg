<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="995" viewBox="0 0 1160 995" role="img" aria-labelledby="title desc">
<title id="title">同じスポーツ映像事業を四つの手法で試す</title><desc id="desc">映像保管庫の収益化という架空の題材に対して、四つの方法論が求める行動と証拠を示す。</desc>
<rect width="1160" height="995" fill="#f6f7f5"/><text x="52" y="65" font-size="32" font-weight="800" fill="#132b36" font-family="sans-serif">同じ保管庫。四つの「最初の一手」。</text>
<text x="52" y="102" font-size="19" fill="#4a646d" font-family="sans-serif">仮想テーマ：試合映像の保存を、継続的な収益へ変えたい</text>
<rect x="45" y="143" width="1070" height="160" rx="19" fill="white" stroke="#dce1de"/><rect x="45" y="143" width="11" height="160" rx="5" fill="#086f83"/><text x="77" y="177" font-size="16" font-weight="800" fill="#086f83" font-family="sans-serif">LEAN</text><text x="77" y="212" font-size="28" font-weight="760" fill="#112a36" font-family="sans-serif">① 売れるか</text><text x="77" y="248" font-size="21" fill="#2c4c58" font-family="sans-serif">行動：権利処理済み映像を手動で販売</text><text x="77" y="278" font-size="19" fill="#5c6f75" font-family="sans-serif">証拠：実発注・再購入</text><rect x="45" y="328" width="1070" height="160" rx="19" fill="white" stroke="#dce1de"/><rect x="45" y="328" width="11" height="160" rx="5" fill="#8f5d1f"/><text x="77" y="362" font-size="16" font-weight="800" fill="#8f5d1f" font-family="sans-serif">EFFECTUATION</text><text x="77" y="397" font-size="28" font-weight="760" fill="#112a36" font-family="sans-serif">② 誰と始められるか</text><text x="77" y="433" font-size="21" fill="#2c4c58" font-family="sans-serif">行動：クラブ・制作会社の協力を取り付ける</text><text x="77" y="463" font-size="19" fill="#5c6f75" font-family="sans-serif">証拠：時間・資源・費用の拠出</text><rect x="45" y="513" width="1070" height="160" rx="19" fill="white" stroke="#dce1de"/><rect x="45" y="513" width="11" height="160" rx="5" fill="#7653a6"/><text x="77" y="547" font-size="16" font-weight="800" fill="#7653a6" font-family="sans-serif">CREATION</text><text x="77" y="582" font-size="28" font-weight="760" fill="#112a36" font-family="sans-serif">③ 買える市場を作れるか</text><text x="77" y="618" font-size="21" fill="#2c4c58" font-family="sans-serif">行動：許諾窓口と取引条件を共同設計</text><text x="77" y="648" font-size="19" fill="#5c6f75" font-family="sans-serif">証拠：有効な合意・取引成立</text><rect x="45" y="698" width="1070" height="160" rx="19" fill="white" stroke="#dce1de"/><rect x="45" y="698" width="11" height="160" rx="5" fill="#1c6b4c"/><text x="77" y="732" font-size="16" font-weight="800" fill="#1c6b4c" font-family="sans-serif">THEORY-BASED</text><text x="77" y="767" font-size="28" font-weight="760" fill="#112a36" font-family="sans-serif">④ なぜ利益が生まれるか</text><text x="77" y="803" font-size="21" fill="#2c4c58" font-family="sans-serif">行動：検索費・権利処理費の因果を検証</text><text x="77" y="833" font-size="19" fill="#5c6f75" font-family="sans-serif">証拠：費用低下と小口需要の成立</text>
<rect x="45" y="902" width="1070" height="64" rx="14" fill="#183541"/><text x="70" y="942" font-size="20" font-weight="720" fill="#ffffff" font-family="sans-serif">結論：どれか一つが成功しても、他の成立条件を免除しない。</text>
</svg>
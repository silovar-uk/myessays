<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="THE LIVE 事業構造の分析図">
<rect width="1200" height="590" fill="#0b1930"/><rect x="36" y="36" width="1128" height="518" rx="24" fill="#142642" stroke="#395174"/>
<text x="66" y="89" font-size="34" font-weight="700" fill="#f7f9fc" font-family="sans-serif">THE LIVE ── どこで価値と費用が生まれるか</text>
<text x="68" y="122" font-size="18" fill="#afc5da" font-family="sans-serif">公開資料に基づく分析上の分類（事業者の会計区分ではない）</text>
<rect x="66" y="173" width="200" height="146" rx="17" fill="#1d5270" stroke="#5e899e"/><text x="82" y="213" font-size="23" font-weight="700" fill="white" font-family="sans-serif">観戦席予約</text><text x="82" y="249" font-size="17" fill="#d2e8ef" font-family="sans-serif">座席と時間を販売</text><path d="M 166 319 V 365" stroke="#87a7bd" stroke-width="3"/><path d="M 158 353 L 166 365 L 174 353" fill="none" stroke="#87a7bd" stroke-width="3"/><rect x="284" y="173" width="200" height="146" rx="17" fill="#234b66" stroke="#5e899e"/><text x="300" y="213" font-size="23" font-weight="700" fill="white" font-family="sans-serif">飲食</text><text x="300" y="249" font-size="17" fill="#d2e8ef" font-family="sans-serif">客単価と滞在時間</text><path d="M 384 319 V 365" stroke="#87a7bd" stroke-width="3"/><path d="M 376 353 L 384 365 L 392 353" fill="none" stroke="#87a7bd" stroke-width="3"/><rect x="502" y="173" width="200" height="146" rx="17" fill="#1d5270" stroke="#5e899e"/><text x="518" y="213" font-size="23" font-weight="700" fill="white" font-family="sans-serif">グッズ</text><text x="518" y="249" font-size="17" fill="#d2e8ef" font-family="sans-serif">試合外の購買機会</text><path d="M 602 319 V 365" stroke="#87a7bd" stroke-width="3"/><path d="M 594 353 L 602 365 L 610 353" fill="none" stroke="#87a7bd" stroke-width="3"/><rect x="720" y="173" width="200" height="146" rx="17" fill="#234b66" stroke="#5e899e"/><text x="736" y="213" font-size="23" font-weight="700" fill="white" font-family="sans-serif">協賛・命名権</text><text x="736" y="249" font-size="17" fill="#d2e8ef" font-family="sans-serif">施設露出を提供</text><path d="M 820 319 V 365" stroke="#87a7bd" stroke-width="3"/><path d="M 812 353 L 820 365 L 828 353" fill="none" stroke="#87a7bd" stroke-width="3"/><rect x="938" y="173" width="200" height="146" rx="17" fill="#1d5270" stroke="#5e899e"/><text x="954" y="213" font-size="23" font-weight="700" fill="white" font-family="sans-serif">法人イベント</text><text x="954" y="249" font-size="17" fill="#d2e8ef" font-family="sans-serif">空き時間を活用</text><path d="M 1038 319 V 365" stroke="#87a7bd" stroke-width="3"/><path d="M 1030 353 L 1038 365 L 1046 353" fill="none" stroke="#87a7bd" stroke-width="3"/>
<rect x="66" y="375" width="1070" height="106" rx="16" fill="#f1f5f9"/><text x="90" y="415" font-size="25" font-weight="700" fill="#1b304c" font-family="sans-serif">共通の運営基盤</text><text x="90" y="454" font-size="22" fill="#325474" font-family="sans-serif">施設・映像設備 ｜ 権利処理 ｜ 人員・警備 ｜ 音響 ｜ 注文・受け取り ｜ 顧客対応</text>
<text x="70" y="527" font-size="17" fill="#afc5da" font-family="sans-serif">注意：来場者の店頭支出と、球団・施設運営者に帰属する売上は同じではない。</text>
</svg>
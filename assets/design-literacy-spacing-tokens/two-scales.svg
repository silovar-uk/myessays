<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f5f3ee"/><text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="30">THERE IS NO UNIVERSAL SPACING NUMBER</text><g font-family="Arial"><text x="130" y="190" font-size="27">USWDS: 8px-based + smaller units</text><text x="130" y="255" font-size="28">4  8  12  16  20  24  32…</text><text x="130" y="405" font-size="27">GOV.UK: 5px-based + responsive scale</text><text x="130" y="470" font-size="28">5  10  15  20  25  30  40…</text><text x="600" y="585" text-anchor="middle" font-size="24">The scale matters more than a sacred base number.</text></g></svg>
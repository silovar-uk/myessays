<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><rect width="1200" height="300" fill="#f8fafc"/><g font-family="sans-serif" font-size="27" text-anchor="middle"><rect x="35" y="75" width="320" height="130" rx="16" fill="#dbeafe"/><text x="195" y="126">当事者を確認</text><text x="195" y="167" font-size="20">受託者・発注者の属性</text><text x="390" y="151">→</text><rect x="440" y="75" width="320" height="130" rx="16" fill="#dcfce7"/><text x="600" y="126">取引を確認</text><text x="600" y="167" font-size="20">業務内容・委託期間</text><text x="795" y="151">→</text><rect x="845" y="75" width="320" height="130" rx="16" fill="#fef3c7"/><text x="1005" y="126">義務を照合</text><text x="1005" y="167" font-size="20">明示・支払・禁止行為</text></g><text x="40" y="265" font-size="19" font-family="sans-serif" fill="#334155">概念図：法的な適用判定は公式資料・専門家による確認が必要</text></svg>
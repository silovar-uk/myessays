<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 425" width="1400" height="425" role="img" aria-labelledby="t d"><title id="t">直接ラベルの採用判断</title><desc id="d">折れ線の終点が離れているなら直接ラベル、線が近いなら引出線、系列が多く重なるなら図の分割または表を選ぶ、という三つの判断基準。</desc><rect x="0" y="0" width="1400" height="425" rx="0" fill="#f3f7fb" stroke="none"/><text x="34" y="58" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="37" fill="#122c49" font-weight="700">ラベルは万能ではない。3つの分岐で選ぶ</text><text x="36" y="100" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="22" fill="#52667b" font-weight="400">図2｜情報の混み具合で、表現手段を切り替える</text><rect x="32" y="145" width="437" height="205" rx="17" fill="#ffffff" stroke="#d9e4ed"/><rect x="52" y="165" width="397" height="50" rx="12" fill="#e0f4ee" stroke="none"/><text x="67" y="198" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="25" fill="#0a7465" font-weight="700">1. 線が離れている</text><text x="65" y="264" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="28" fill="#20374c" font-weight="700">終点に直接ラベル</text><text x="66" y="316" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="19" fill="#617185" font-weight="400">最も速く系列を見分ける</text><rect x="495" y="145" width="437" height="205" rx="17" fill="#ffffff" stroke="#d9e4ed"/><rect x="515" y="165" width="397" height="50" rx="12" fill="#fff0d8" stroke="none"/><text x="530" y="198" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="25" fill="#8a5b08" font-weight="700">2. 線が近接・交差する</text><text x="528" y="264" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="28" fill="#20374c" font-weight="700">引出線で対応づける</text><text x="529" y="316" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="19" fill="#617185" font-weight="400">誤認しない対応関係を示す</text><rect x="958" y="145" width="437" height="205" rx="17" fill="#ffffff" stroke="#d9e4ed"/><rect x="978" y="165" width="397" height="50" rx="12" fill="#fce8e8" stroke="none"/><text x="993" y="198" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="25" fill="#9c4141" font-weight="700">3. 系列が多く混み合う</text><text x="991" y="264" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="28" fill="#20374c" font-weight="700">図を分割／表へ戻す</text><text x="992" y="316" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="19" fill="#617185" font-weight="400">密集した線を無理に読ませない</text><text x="35" y="395" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="21" fill="#53677b" font-weight="400">注意：数値の単位・時点・出典の明記は、どの表現でも省略しない。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><style>text{font-family:'Noto Sans JP','Yu Gothic',Meiryo,sans-serif}</style><title id="title">競争優位を検証する4段階の論理橋</title><desc id="desc">確認済みの企業資産から顧客課題、価値仮説、成立条件まで4段階に分けた独自模式図。事実と仮説を色で区別。</desc><rect width="1440" height="760" fill="#F5F8FC"/><rect x="36" y="32" width="1368" height="98" rx="20" fill="#102B46" stroke="#102B46" stroke-width="2"/><text x="68" y="88" fill="#FFFFFF" font-size="43" font-weight="750">強みを「勝てる理由」に飛躍させない</text><text x="48" y="174" fill="#087B71" font-size="26" font-weight="750">確認済みの資産</text><text x="396" y="174" fill="#A66B16" font-size="26" font-weight="750">仮説① 顧客課題</text><text x="744" y="174" fill="#A66B16" font-size="26" font-weight="750">仮説② 提供価値</text><text x="1092" y="174" fill="#9B4658" font-size="26" font-weight="750">要検証の条件</text><rect x="42" y="197" width="304" height="268" rx="18" fill="#E5F5EF" stroke="#CFD9E3" stroke-width="2"/><text x="65" y="277" fill="#16374C" font-size="27" font-weight="750">映像制作・技術の</text><text x="65" y="335" fill="#16374C" font-size="27" font-weight="500">グループ連携</text><text x="65" y="393" fill="#16374C" font-size="27" font-weight="500">スポーツ映像の実証</text><rect x="391" y="197" width="304" height="268" rx="18" fill="#FFF3DC" stroke="#CFD9E3" stroke-width="2"/><text x="414" y="277" fill="#16374C" font-size="27" font-weight="750">会場運営者が</text><text x="414" y="335" fill="#16374C" font-size="27" font-weight="500">観戦体験の差別化を</text><text x="414" y="393" fill="#16374C" font-size="27" font-weight="500">必要としているか</text><rect x="740" y="197" width="304" height="268" rx="18" fill="#FFF3DC" stroke="#CFD9E3" stroke-width="2"/><text x="763" y="277" fill="#16374C" font-size="27" font-weight="750">多視点体験で</text><text x="763" y="335" fill="#16374C" font-size="27" font-weight="500">来場者の体験価値を</text><text x="763" y="393" fill="#16374C" font-size="27" font-weight="500">高められるか</text><rect x="1089" y="197" width="304" height="268" rx="18" fill="#FBE8EB" stroke="#CFD9E3" stroke-width="2"/><text x="1112" y="277" fill="#16374C" font-size="27" font-weight="750">支払意思・費用</text><text x="1112" y="335" fill="#16374C" font-size="27" font-weight="500">映像権利・設営</text><text x="1112" y="393" fill="#16374C" font-size="27" font-weight="500">代替案との差</text><path d="M350 328h29m-10 -11l10 11 -10 11" fill="none" stroke="#60879A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M699 328h29m-10 -11l10 11 -10 11" fill="none" stroke="#60879A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1048 328h29m-10 -11l10 11 -10 11" fill="none" stroke="#60879A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="506" width="1344" height="150" rx="20" fill="#102B46" stroke="#102B46" stroke-width="2"/><text x="83" y="555" fill="#99DAE3" font-size="28" font-weight="700">経営層に伝える暫定結論</text><text x="83" y="614" fill="#FFFFFF" font-size="34" font-weight="730">技術の組み合わせは候補。競争優位は顧客検証の後に判断する。</text><text x="52" y="710" fill="#526A7D" font-size="23" font-weight="500">※企業の契約・優位性・事業収益を示す図ではない。J/Bリーグとの接点は未確認。</text></svg>
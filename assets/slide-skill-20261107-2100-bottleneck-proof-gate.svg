<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="480" viewBox="0 0 1500 480" role="img" aria-label="資産から顧客課題、提供価値、成立条件、証拠へと進む5段階の検証ゲート"><rect width="1500" height="480" fill="#f8fafc"/><text x="64" y="72" font-family="sans-serif" font-size="35" font-weight="700" fill="#102a43">「できる」から「売れる」までの証拠ゲート</text><text x="64" y="116" font-family="sans-serif" font-size="21" fill="#475569">スポーツ施設向け計測サービス｜架空の検討例・すべて未検証</text><rect x="60" y="170" width="256" height="165" rx="14" fill="#e7eff8" stroke="#7b9bb7" stroke-width="3"/><text x="76" y="216" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">資産［要確認］</text><text x="76" y="260" font-family="sans-serif" font-size="19" fill="#334155">計測・制作・接点</text><path d="M 321 250 h 21" stroke="#64748b" stroke-width="4"/><path d="M 335 241 l 10 9 -10 9" fill="none" stroke="#64748b" stroke-width="4"/><rect x="348" y="170" width="256" height="165" rx="14" fill="#e7eff8" stroke="#7b9bb7" stroke-width="3"/><text x="364" y="216" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">課題［仮説］</text><text x="364" y="260" font-family="sans-serif" font-size="19" fill="#334155">安全判断を早く</text><path d="M 609 250 h 21" stroke="#64748b" stroke-width="4"/><path d="M 623 241 l 10 9 -10 9" fill="none" stroke="#64748b" stroke-width="4"/><rect x="636" y="170" width="256" height="165" rx="14" fill="#e7eff8" stroke="#7b9bb7" stroke-width="3"/><text x="652" y="216" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">価値［仮説］</text><text x="652" y="260" font-family="sans-serif" font-size="19" fill="#334155">判断支援サービス</text><path d="M 897 250 h 21" stroke="#64748b" stroke-width="4"/><path d="M 911 241 l 10 9 -10 9" fill="none" stroke="#64748b" stroke-width="4"/><rect x="924" y="170" width="256" height="165" rx="14" fill="#fff1e6" stroke="#dc6b32" stroke-width="3"/><text x="940" y="216" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">成立条件</text><text x="940" y="260" font-family="sans-serif" font-size="19" fill="#334155">精度・費用・許諾</text><path d="M 1185 250 h 21" stroke="#64748b" stroke-width="4"/><path d="M 1199 241 l 10 9 -10 9" fill="none" stroke="#64748b" stroke-width="4"/><rect x="1212" y="170" width="256" height="165" rx="14" fill="#e7eff8" stroke="#7b9bb7" stroke-width="3"/><text x="1228" y="216" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">必要な証拠</text><text x="1228" y="260" font-family="sans-serif" font-size="19" fill="#334155">現場面談・実証</text><text x="65" y="398" font-family="sans-serif" font-size="23" fill="#a43c16" font-weight="700">判断：成立条件を確認するまで「競争優位がある」と断定しない</text><text x="65" y="441" font-family="sans-serif" font-size="18" fill="#64748b">独自作成／事実認定ではなく、仮説と検証順序を示す構造図</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1100" viewBox="0 0 780 1100" role="img"><rect width="780" height="1100" fill="#f8f5ef"/><style>text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#1e293b}.sub{font-size:19px;fill:#64748b}.small{font-size:18px}.heading{font-size:36px;font-weight:800}.big{font-size:31px;font-weight:800}.cmd{font-size:31px;font-weight:800;fill:#175e99}.note{font-size:21px}.white{fill:white}</style><text x="36" y="53" class="sub">TRAINING MODE / FRAME LOG</text><text x="36" y="105" class="heading">入力ミスの診断地図</text><text x="36" y="145" class="sub">最初に入力履歴をON、次にフレームと技の成否を照合</text><rect x="30" y="180" width="720" height="150" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="54" y="223" class="cmd">CASE A</text><text x="215" y="223" class="big">↓の履歴がない</text><text x="54" y="267" class="note">原因仮説：左の押下が短い／相殺設定が想定と違う</text><text x="54" y="299" class="note">確認：右下＋左の時点で↓になるか単独確認</text><rect x="30" y="348" width="720" height="150" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="54" y="391" class="cmd">CASE B</text><text x="215" y="391" class="big">↓＋Pが出ている</text><text x="54" y="435" class="note">原因仮説：左を離す前にパンチを押している</text><text x="54" y="467" class="note">確認：左を離したあと、↘を見てからP</text><rect x="30" y="516" width="720" height="150" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="54" y="559" class="cmd">CASE C</text><text x="215" y="559" class="big">↘を長く保持して通常P</text><text x="54" y="603" class="note">原因仮説：最後の方向からの入力保持時間超過の疑い</text><text x="54" y="635" class="note">確認：5F、7F、8F、9Fを分けて成功率を記録</text><rect x="30" y="684" width="720" height="150" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="54" y="727" class="cmd">CASE D</text><text x="215" y="727" class="big">SAが意図せず出る</text><text x="54" y="771" class="note">原因仮説：二回入力の履歴が残っている可能性</text><text x="54" y="803" class="note">確認：236＋P等と236236＋Pの差を確認</text><rect x="30" y="868" width="720" height="190" rx="20" fill="#17324c" stroke="#17324c" stroke-width="2"/><text x="57" y="917" font-size="27" font-weight="800" class="white">10回の練習 × 3段階</text><text x="57" y="960" font-size="22" class="white">①静止状態で方向確認 → ②移動から入力</text><text x="57" y="1001" font-size="22" class="white">③ジャンプ／ガード反撃をランダム再生</text><text x="57" y="1034" font-size="17" class="white">成功率だけでなく、失敗原因も記録する</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">広安大橋をめぐる二種類の価値</title><desc id="d">車で渡る人は交通利便性を、海岸で眺める人は景観と滞在体験を受け取る概念図。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09223a"/><stop offset="1" stop-color="#16295b"/></linearGradient><linearGradient id="o" x1="0" x2="1"><stop stop-color="#3ccbc4"/><stop offset="1" stop-color="#e6b567"/></linearGradient></defs><rect width="1200" height="540" rx="20" fill="url(#bg)"/><text x="68" y="70" font-family="sans-serif" font-size="29" font-weight="700" fill="#f6f4ef">同じ橋、逆向きの時間</text><text x="69" y="110" font-family="sans-serif" font-size="17" fill="#b7c7dc">ONE BRIDGE, TWO AUDIENCES</text><path d="M170 292 Q320 174 470 292 T770 292 T1030 292" fill="none" stroke="#88d0dc" stroke-width="5"/><path d="M135 320H1065" stroke="#d8e7f4" stroke-width="15"/><path d="M170 320V355M320 320V355M470 320V355M620 320V355M770 320V355M920 320V355M1030 320V355" stroke="#93a8c2" stroke-width="9"/><rect x="65" y="154" width="455" height="112" rx="16" fill="#153951" stroke="#4d9eaa"/><text x="91" y="193" font-family="sans-serif" fill="#8be3dc" font-size="19">DRIVER / 運転者</text><text x="91" y="234" font-family="sans-serif" fill="#fff" font-size="27" font-weight="700">時間を短くする</text><rect x="680" y="154" width="455" height="112" rx="16" fill="#3c304c" stroke="#dcae74"/><text x="706" y="193" font-family="sans-serif" fill="#f8c787" font-size="19">VIEWER / 海岸の観客</text><text x="706" y="234" font-family="sans-serif" fill="#fff" font-size="27" font-weight="700">時間を使いたくなる</text><text x="65" y="422" font-family="sans-serif" fill="#dbe9f5" font-size="23">移動の便益</text><text x="65" y="455" font-family="sans-serif" fill="#9dc4d7" font-size="17">経路・交通・所要時間</text><text x="712" y="422" font-family="sans-serif" fill="#f5dfc6" font-size="23">滞在の便益</text><text x="712" y="455" font-family="sans-serif" fill="#cbbacd" font-size="17">景観・体験・再訪の理由</text><path d="M530 434H673" stroke="url(#o)" stroke-width="4" stroke-dasharray="10 9"/><text x="600" y="410" text-anchor="middle" font-family="sans-serif" fill="#d3dfec" font-size="17">価値が異なる</text><text x="65" y="509" fill="#a4b8d0" font-size="13" font-family="sans-serif">筆者作成の概念図。経済効果や利用者数の実測値ではない。</text></svg>
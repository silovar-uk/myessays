<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"><rect width="1000" height="300" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554"><text x="30" y="42" font-size="24" font-weight="bold">仮定：対象経費1,000万円の内訳</text><rect x="35" y="85" width="760" height="65" fill="#2563eb"/><rect x="795" y="85" width="190" height="65" fill="#f59e0b"/><text x="270" y="124" font-size="23" fill="white">助成想定 800万円（80%）</text><text x="810" y="124" font-size="20">自己負担</text><text x="810" y="174" font-size="20">200万円</text><text x="35" y="225" font-size="19">年間純削減70万円なら単純回収：約2.86年</text><text x="35" y="265" font-size="15">※架空の試算。全額対象・交付決定を保証しない。出典：公社の助成率・上限。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="映像AIサービスの導入に必要な利用者、承認者、予算保有者の検証事項を三段で比較"><rect width="1200" height="650" fill="#f7f9fc"/><text x="60" y="70" font-family="sans-serif" font-size="36" font-weight="700" fill="#14253b">使いたい ≠ 導入できる ≠ 支払える</text><text x="60" y="112" font-family="sans-serif" font-size="21" fill="#526278">映像ハイライト抽出サービスの仮想案件｜すべて未検証の仮説</text><g font-family="sans-serif"><rect x="55" y="153" width="1090" height="120" rx="18" fill="#e5efff"/><text x="85" y="202" font-size="29" font-weight="700" fill="#174e91">① 利用者</text><text x="330" y="201" font-size="25" fill="#14253b">編集時間を減らせるか？</text><text x="330" y="241" font-size="21" fill="#39516b">検証：試用前後の作業時間を実測</text><rect x="55" y="291" width="1090" height="120" rx="18" fill="#e9f6ed"/><text x="85" y="341" font-size="29" font-weight="700" fill="#206b41">② 承認者</text><text x="330" y="340" font-size="25" fill="#14253b">品質と運用リスクを許容できるか？</text><text x="330" y="380" font-size="21" fill="#39516b">検証：誤抽出・確認負荷・品質基準</text><rect x="55" y="429" width="1090" height="120" rx="18" fill="#fff1df"/><text x="85" y="479" font-size="29" font-weight="700" fill="#99591a">③ 予算保有者</text><text x="330" y="478" font-size="25" fill="#14253b">どの予算で、何と比べて支払うか？</text><text x="330" y="518" font-size="21" fill="#39516b">検証：費目・既存契約・承認経路</text><text x="60" y="601" font-size="20" fill="#53657a">注：組織の正式な承認順序ではない。役割は兼任・追加される場合がある。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040" role="img" aria-labelledby="t d"><title id="t">選択ウィンドウで編集対象を特定する図解</title><desc id="d">PowerPointの実際の画面写真ではない模式図。編集対象を名前で見つけ、重なった背景を一時的に非表示にして直し、再表示する操作の順番を示す。</desc><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif}</style><rect x="0" y="0" width="960" height="1040" rx="0" fill="#F4F8FC" stroke="none" stroke-width="1"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#167E91" stroke="none" stroke-width="1"/><text x="55" y="67" font-size="24" font-weight="750" fill="#167E91" >VISUAL LESSON  /  15:00</text><text x="55" y="123" font-size="37" font-weight="780" fill="#11283F" >「見た目」より先に、編集対象を見つける</text><rect x="52" y="164" width="856" height="265" rx="20" fill="#FFFFFF" stroke="#D2DFE8" stroke-width="2"/><text x="77" y="207" font-size="28" font-weight="750" fill="#16344A" >スライド上：重なった図形</text><rect x="86" y="240" width="780" height="151" rx="16" fill="#E8F2F7" stroke="none" stroke-width="1"/><rect x="115" y="262" width="296" height="101" rx="12" fill="#FFFFFF" stroke="#B4D0DF" stroke-width="2"/><rect x="332" y="251" width="300" height="110" rx="12" fill="#D4E9EF" stroke="none" stroke-width="1"/><rect x="557" y="273" width="270" height="87" rx="12" fill="#14798D" stroke="none" stroke-width="1"/><text x="140" y="313" font-size="28" font-weight="750" fill="#123E52" >結論カード</text><text x="352" y="308" font-size="27" font-weight="700" fill="#123E52" >根拠の説明</text><text x="585" y="324" font-size="24" font-weight="700" fill="#FFFFFF" >注釈（重なり）</text><text x="82" y="464" font-size="34" font-weight="800" fill="#0B7288" >Alt + F10</text><text x="260" y="462" font-size="33" font-weight="600" fill="#8499A7" >→</text><text x="320" y="462" font-size="29" font-weight="700" fill="#12364E" >選択ウィンドウを開く</text><rect x="52" y="496" width="856" height="379" rx="20" fill="#FFFFFF" stroke="#D2DFE8" stroke-width="2"/><rect x="75" y="518" width="811" height="60" rx="10" fill="#16344A" stroke="none" stroke-width="1"/><text x="99" y="558" font-size="27" font-weight="730" fill="#FFFFFF" >選択ウィンドウ（操作を説明する模式図）</text><rect x="78" y="585" width="805" height="54" rx="10" fill="#D9EFF2" stroke="none" stroke-width="1"/><text x="111" y="620" font-size="27" font-weight="650" fill="#14364E" >03_注釈</text><text x="738" y="620" font-size="26" font-weight="650" fill="#167E91" >◉</text><text x="781" y="620" font-size="23" font-weight="600" fill="#567083" >表示</text><rect x="78" y="651" width="805" height="54" rx="10" fill="#E9F3FA" stroke="none" stroke-width="1"/><text x="111" y="686" font-size="27" font-weight="650" fill="#14364E" >02_根拠カード</text><text x="738" y="686" font-size="26" font-weight="650" fill="#167E91" >◉</text><text x="781" y="686" font-size="23" font-weight="600" fill="#567083" >表示</text><rect x="78" y="717" width="805" height="54" rx="10" fill="#E9F3FA" stroke="none" stroke-width="1"/><text x="111" y="752" font-size="27" font-weight="650" fill="#14364E" >01_結論カード</text><text x="738" y="752" font-size="26" font-weight="650" fill="#167E91" >◉</text><text x="781" y="752" font-size="23" font-weight="600" fill="#567083" >表示</text><text x="82" y="840" font-size="24" font-weight="720" fill="#2D6476" >F2：名前変更　／　目の印：一時非表示</text><rect x="52" y="900" width="856" height="91" rx="17" fill="#E5F5F1" stroke="none" stroke-width="1"/><text x="81" y="941" font-size="25" font-weight="750" fill="#0E6859" >手順：名前で探す → 一時非表示 → 編集 → 再表示</text><text x="55" y="1020" font-size="21" font-weight="500" fill="#59758A" >※Microsoft PowerPointの画面を再現したものではありません。</text></svg>
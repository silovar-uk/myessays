<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-label="チェイス・センターの歴史的転換点：2012年構想、2014年用地変更、2016年命名権、2017年着工、2019年開業、2025年WNBA入居。">
<rect width="1600" height="760" fill="#F3F6F8"/><text x="76" y="98" fill="#152B45" font-family="Arial,'Noto Sans JP',sans-serif" font-size="51" font-weight="bold">AN ARENA SEVEN YEARS IN THE MAKING</text><text x="78" y="151" fill="#526477" font-family="Arial,'Noto Sans JP',sans-serif" font-size="26">立地交渉・民間開発・地域調整を経て、2019年に開業</text><path d="M130 358 H1480" stroke="#CAD6E1" stroke-width="12" stroke-linecap="round"/>
<g font-family="Arial,'Noto Sans JP',sans-serif"><circle cx="140" cy="358" r="22" fill="#284C70"/><circle cx="396" cy="358" r="22" fill="#284C70"/><circle cx="655" cy="358" r="22" fill="#284C70"/><circle cx="918" cy="358" r="22" fill="#284C70"/><circle cx="1188" cy="358" r="25" fill="#0A87AE"/><circle cx="1460" cy="358" r="22" fill="#8B65CA"/>
<text x="90" y="300" font-size="36" fill="#284C70" font-weight="bold">2012</text><text x="346" y="300" font-size="36" fill="#284C70" font-weight="bold">2014</text><text x="604" y="300" font-size="36" fill="#284C70" font-weight="bold">2016</text><text x="868" y="300" font-size="36" fill="#284C70" font-weight="bold">2017</text><text x="1138" y="300" font-size="36" fill="#0A87AE" font-weight="bold">2019</text><text x="1411" y="300" font-size="36" fill="#8B65CA" font-weight="bold">2025</text>
<text x="85" y="429" font-size="22" fill="#253B51" font-weight="bold">新アリーナ構想</text><text x="85" y="467" font-size="20" fill="#526477">湾岸埠頭案を検討</text>
<text x="343" y="429" font-size="22" fill="#253B51" font-weight="bold">Mission Bayへ</text><text x="343" y="467" font-size="20" fill="#526477">土地取得</text>
<text x="603" y="429" font-size="22" fill="#253B51" font-weight="bold">命名権契約</text><text x="603" y="467" font-size="20" fill="#526477">Chase・20年間</text>
<text x="866" y="429" font-size="22" fill="#253B51" font-weight="bold">建設着工</text><text x="866" y="467" font-size="20" fill="#526477">訴訟と調整の末</text>
<text x="1138" y="429" font-size="22" fill="#253B51" font-weight="bold">9月開業</text><text x="1138" y="467" font-size="20" fill="#526477">NBAと音楽公演</text>
<text x="1370" y="429" font-size="22" fill="#253B51" font-weight="bold">WNBA</text><text x="1370" y="467" font-size="20" fill="#526477">女子球団が入居</text>
</g><rect x="75" y="547" width="1450" height="111" rx="16" fill="#DCEAF2"/><text x="103" y="595" font-family="Arial,'Noto Sans JP',sans-serif" font-size="26" fill="#193851" font-weight="bold">転換点：埠頭に単体で建てる → 再開発地区の複合施設として整備する</text><text x="104" y="631" font-family="Arial,'Noto Sans JP',sans-serif" font-size="19" fill="#38546E">注：2012年は計画公表の年。女子球団の入居は2025年であり、アリーナの新設年ではない。</text><text x="78" y="711" fill="#677889" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18">Sources: SFGOV / CAA ICON / Chase Center / WNBA　　図：本稿作成</text></svg>
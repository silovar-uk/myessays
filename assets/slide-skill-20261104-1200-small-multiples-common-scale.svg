<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">共通目盛りの小さな複数グラフ</title><desc id="d">架空の来場者数を3会場で比較。左の別目盛りでは同じ伸びに見えるが、右の共通0〜100目盛りでは規模差が見える。</desc><rect width="1200" height="650" fill="#f7f9fc"/><text x="55" y="65" font-family="sans-serif" font-size="33" font-weight="bold" fill="#152b45">同じ目盛りで並べると、変化と規模を同時に比較できる</text><text x="55" y="102" font-family="sans-serif" font-size="18" fill="#52657c">架空例｜3会場の月間来場者数（単位：千人）｜4月→5月</text><rect x="48" y="135" width="510" height="415" rx="18" fill="#fff" stroke="#d5dfea"/><rect x="642" y="135" width="510" height="415" rx="18" fill="#fff" stroke="#d5dfea"/><text x="77" y="182" font-family="sans-serif" font-size="26" font-weight="bold" fill="#b44845">Before｜各図で目盛りが違う</text><text x="673" y="182" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1d745e">After｜全図で0〜100に統一</text><g font-family="sans-serif" font-size="19" fill="#152b45"><text x="80" y="250">会場A 80→90</text><text x="80" y="345">会場B 30→45</text><text x="80" y="440">会場C 10→20</text><text x="673" y="250">会場A 80→90</text><text x="673" y="345">会場B 30→45</text><text x="673" y="440">会場C 10→20</text></g><g stroke="#d1dce8" stroke-width="3"><line x1="260" y1="262" x2="500" y2="262"/><line x1="260" y1="357" x2="500" y2="357"/><line x1="260" y1="452" x2="500" y2="452"/><line x1="853" y1="262" x2="1095" y2="262"/><line x1="853" y1="357" x2="1095" y2="357"/><line x1="853" y1="452" x2="1095" y2="452"/></g><g stroke="#e08b36" stroke-width="9" stroke-linecap="round"><line x1="280" y1="262" x2="475" y2="262"/><line x1="280" y1="357" x2="475" y2="357"/><line x1="280" y1="452" x2="475" y2="452"/></g><g fill="#1d745e"><circle cx="1047" cy="262" r="10"/><circle cx="962" cy="357" r="10"/><circle cx="901" cy="452" r="10"/></g><g stroke="#1d745e" stroke-width="9" stroke-linecap="round"><line x1="1047" y1="262" x2="1071" y2="262"/><line x1="926" y1="357" x2="962" y2="357"/><line x1="877" y1="452" x2="901" y2="452"/></g><g font-family="sans-serif" font-size="17" fill="#52657c"><text x="260" y="493">※それぞれ異なる範囲で表示</text><text x="853" y="493">0</text><text x="1061" y="493">100</text></g><rect x="55" y="575" width="1090" height="52" rx="12" fill="#e6f2ee"/><text x="75" y="608" font-family="sans-serif" font-size="21" fill="#164c40">判断：比較が目的なら共通尺度。個別の細かな変化を見るなら別図・数値ラベルを併用。</text></svg>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漂白剤はなぜ色を消せる？――「白くする」を分子レベルで考える</title><meta name="description" content="漂白剤をかけると、なぜコーヒーや果汁の色が消えるのか。漂白は単に色素を洗い流す操作ではない。多くの場合、色の原因となる発色団の化学構造を酸化還元反応などで変え、可視光の吸収のしかたを変えている。本稿では、塩素系の次亜塩素酸ナトリウムと酸素系の過酸化水素・過炭酸ナトリウムを軸に、洗浄との違い、色と電子の関係、漂白と除菌の関係、そして『混ぜるな危険』の意味まで、日常から分子レベルへ降りて解説する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/why-bleach-removes-color.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/why-bleach-removes-color.html"><meta property="og:title" content="漂白剤はなぜ色を消せる？――「白くする」を分子レベルで考える"><meta property="og:description" content="漂白剤をかけると、なぜコーヒーや果汁の色が消えるのか。漂白は単に色素を洗い流す操作ではない。多くの場合、色の原因となる発色団の化学構造を酸化還元反応などで変え、可視光の吸収のしかたを変えている。本稿では、塩素系の次亜塩素酸ナトリウムと酸素系の過酸化水素・過炭酸ナトリウムを軸に、洗浄との違い、色と電子の関係、漂白と除菌の関係、そして『混ぜるな危険』の意味まで、日常から分子レベルへ降りて解説する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="漂白剤はなぜ色を消せる？――「白くする」を分子レベルで考える"><meta name="twitter:description" content="漂白剤をかけると、なぜコーヒーや果汁の色が消えるのか。漂白は単に色素を洗い流す操作ではない。多くの場合、色の原因となる発色団の化学構造を酸化還元反応などで変え、可視光の吸収のしかたを変えている。本稿では、塩素系の次亜塩素酸ナトリウムと酸素系の過酸化水素・過炭酸ナトリウムを軸に、洗浄との違い、色と電子の関係、漂白と除菌の関係、そして『混ぜるな危険』の意味まで、日常から分子レベルへ降りて解説する。"></head><body><main><article><h1>漂白剤はなぜ色を消せる？――「白くする」を分子レベルで考える</h1><p>漂白剤をかけると、なぜコーヒーや果汁の色が消えるのか。漂白は単に色素を洗い流す操作ではない。多くの場合、色の原因となる発色団の化学構造を酸化還元反応などで変え、可視光の吸収のしかたを変えている。本稿では、塩素系の次亜塩素酸ナトリウムと酸素系の過酸化水素・過炭酸ナトリウムを軸に、洗浄との違い、色と電子の関係、漂白と除菌の関係、そして『混ぜるな危険』の意味まで、日常から分子レベルへ降りて解説する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/why-bleach-removes-color?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/why-bleach-removes-color?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨が降らなかった日の傘は、仕事をしていたのか</title><meta name="description" content="空を見て雨を予測し、傘を持つ。だが、結局雨が降らなかった日の傘は無駄だったのか。気象庁の降水確率の定義を調べ、架空の100日を使って判断を検証し、さらにスポーツ会場の混雑対策へ視点を移す。対策が成功するほど、その必要性を示す証拠が消えてしまう。空・雨・傘を、予測と行動の説明から、反事実と因果効果まで扱う思考法へ拡張する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/umbrella-that-erases-its-own-evidence-2026.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/umbrella-that-erases-its-own-evidence-2026.html"><meta property="og:title" content="雨が降らなかった日の傘は、仕事をしていたのか"><meta property="og:description" content="空を見て雨を予測し、傘を持つ。だが、結局雨が降らなかった日の傘は無駄だったのか。気象庁の降水確率の定義を調べ、架空の100日を使って判断を検証し、さらにスポーツ会場の混雑対策へ視点を移す。対策が成功するほど、その必要性を示す証拠が消えてしまう。空・雨・傘を、予測と行動の説明から、反事実と因果効果まで扱う思考法へ拡張する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="雨が降らなかった日の傘は、仕事をしていたのか"><meta name="twitter:description" content="空を見て雨を予測し、傘を持つ。だが、結局雨が降らなかった日の傘は無駄だったのか。気象庁の降水確率の定義を調べ、架空の100日を使って判断を検証し、さらにスポーツ会場の混雑対策へ視点を移す。対策が成功するほど、その必要性を示す証拠が消えてしまう。空・雨・傘を、予測と行動の説明から、反事実と因果効果まで扱う思考法へ拡張する。"></head><body><main><article><h1>雨が降らなかった日の傘は、仕事をしていたのか</h1><p>空を見て雨を予測し、傘を持つ。だが、結局雨が降らなかった日の傘は無駄だったのか。気象庁の降水確率の定義を調べ、架空の100日を使って判断を検証し、さらにスポーツ会場の混雑対策へ視点を移す。対策が成功するほど、その必要性を示す証拠が消えてしまう。空・雨・傘を、予測と行動の説明から、反事実と因果効果まで扱う思考法へ拡張する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/umbrella-that-erases-its-own-evidence-2026?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/umbrella-that-erases-its-own-evidence-2026?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハロプロ史 第2回――黄金期は巨大なメディア実験だった</title><meta name="description" content="ハロプロ史シリーズ第2回。1999年末から2004年までを、単なる『黄金期』ではなく、メンバーを派生ユニット、シャッフル、ソロ、子ども向け企画、冠番組へ横断させる巨大なメディア実験として読む。4期加入、ミニモニ。と子ども市場、松浦亜弥というソロアイドル、5期・6期の継続加入、後藤真希・安倍なつみの卒業、2002年のハロプロ大改革を、縮小し始めたCD市場と重ねて整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/hello-project-history-02-1999-2004.en.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/hello-project-history-02-1999-2004.en.html"><meta property="og:title" content="ハロプロ史 第2回――黄金期は巨大なメディア実験だった"><meta property="og:description" content="ハロプロ史シリーズ第2回。1999年末から2004年までを、単なる『黄金期』ではなく、メンバーを派生ユニット、シャッフル、ソロ、子ども向け企画、冠番組へ横断させる巨大なメディア実験として読む。4期加入、ミニモニ。と子ども市場、松浦亜弥というソロアイドル、5期・6期の継続加入、後藤真希・安倍なつみの卒業、2002年のハロプロ大改革を、縮小し始めたCD市場と重ねて整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="ハロプロ史 第2回――黄金期は巨大なメディア実験だった"><meta name="twitter:description" content="ハロプロ史シリーズ第2回。1999年末から2004年までを、単なる『黄金期』ではなく、メンバーを派生ユニット、シャッフル、ソロ、子ども向け企画、冠番組へ横断させる巨大なメディア実験として読む。4期加入、ミニモニ。と子ども市場、松浦亜弥というソロアイドル、5期・6期の継続加入、後藤真希・安倍なつみの卒業、2002年のハロプロ大改革を、縮小し始めたCD市場と重ねて整理する。"></head><body><main><article><h1>ハロプロ史 第2回――黄金期は巨大なメディア実験だった</h1><p>ハロプロ史シリーズ第2回。1999年末から2004年までを、単なる『黄金期』ではなく、メンバーを派生ユニット、シャッフル、ソロ、子ども向け企画、冠番組へ横断させる巨大なメディア実験として読む。4期加入、ミニモニ。と子ども市場、松浦亜弥というソロアイドル、5期・6期の継続加入、後藤真希・安倍なつみの卒業、2002年のハロプロ大改革を、縮小し始めたCD市場と重ねて整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/hello-project-history-02-1999-2004?lang=en">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/hello-project-history-02-1999-2004?lang=en");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港はなぜ中国でありながら、中国本土と違うのか</title><meta name="description" content="中国の一部なのに、なぜ香港では通貨・法律・言語・政治制度が中国本土と異なるのか。1990年の基本法、1997年の返還、2003年・2014年・2019年の抗議運動、2020年以降の制度変更をたどり、経済・住宅・広東語・文化の実態へつなぐ。中国政府、民主派、人権団体の見方を区別し、香港を『自由か抑圧か』の一語に還元しない入門論考。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/hong-kong-1990-2026-boundaries-of-autonomy.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/hong-kong-1990-2026-boundaries-of-autonomy.html"><meta property="og:title" content="香港はなぜ中国でありながら、中国本土と違うのか"><meta property="og:description" content="中国の一部なのに、なぜ香港では通貨・法律・言語・政治制度が中国本土と異なるのか。1990年の基本法、1997年の返還、2003年・2014年・2019年の抗議運動、2020年以降の制度変更をたどり、経済・住宅・広東語・文化の実態へつなぐ。中国政府、民主派、人権団体の見方を区別し、香港を『自由か抑圧か』の一語に還元しない入門論考。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="香港はなぜ中国でありながら、中国本土と違うのか"><meta name="twitter:description" content="中国の一部なのに、なぜ香港では通貨・法律・言語・政治制度が中国本土と異なるのか。1990年の基本法、1997年の返還、2003年・2014年・2019年の抗議運動、2020年以降の制度変更をたどり、経済・住宅・広東語・文化の実態へつなぐ。中国政府、民主派、人権団体の見方を区別し、香港を『自由か抑圧か』の一語に還元しない入門論考。"></head><body><main><article><h1>香港はなぜ中国でありながら、中国本土と違うのか</h1><p>中国の一部なのに、なぜ香港では通貨・法律・言語・政治制度が中国本土と異なるのか。1990年の基本法、1997年の返還、2003年・2014年・2019年の抗議運動、2020年以降の制度変更をたどり、経済・住宅・広東語・文化の実態へつなぐ。中国政府、民主派、人権団体の見方を区別し、香港を『自由か抑圧か』の一語に還元しない入門論考。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/hong-kong-1990-2026-boundaries-of-autonomy?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/hong-kong-1990-2026-boundaries-of-autonomy?lang=ja");</script></body></html>

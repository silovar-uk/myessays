<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あばたもえくぼ、玉に瑕――欠点は、どこから欠点になるのか</title><meta name="description" content="「あばたもえくぼ」は、好きになれば欠点さえ魅力に見えると言う。一方の「玉に瑕」は、すばらしいものに残ったわずかな欠点を惜しむ。両者は辞書上の対義語ではないが、同じ『小さな欠点』に対して評価が逆向きに動く例として並べると面白い。本稿では、辞書資料と親密な関係におけるpositive illusions研究を手がかりに、欠点は対象だけでなく、好意・期待・比較基準という『見る側のものさし』によっても形を変える、と考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/abata-mo-ekubo-tama-ni-kizu-evaluation-lens.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/abata-mo-ekubo-tama-ni-kizu-evaluation-lens.html"><meta property="og:title" content="あばたもえくぼ、玉に瑕――欠点は、どこから欠点になるのか"><meta property="og:description" content="「あばたもえくぼ」は、好きになれば欠点さえ魅力に見えると言う。一方の「玉に瑕」は、すばらしいものに残ったわずかな欠点を惜しむ。両者は辞書上の対義語ではないが、同じ『小さな欠点』に対して評価が逆向きに動く例として並べると面白い。本稿では、辞書資料と親密な関係におけるpositive illusions研究を手がかりに、欠点は対象だけでなく、好意・期待・比較基準という『見る側のものさし』によっても形を変える、と考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="あばたもえくぼ、玉に瑕――欠点は、どこから欠点になるのか"><meta name="twitter:description" content="「あばたもえくぼ」は、好きになれば欠点さえ魅力に見えると言う。一方の「玉に瑕」は、すばらしいものに残ったわずかな欠点を惜しむ。両者は辞書上の対義語ではないが、同じ『小さな欠点』に対して評価が逆向きに動く例として並べると面白い。本稿では、辞書資料と親密な関係におけるpositive illusions研究を手がかりに、欠点は対象だけでなく、好意・期待・比較基準という『見る側のものさし』によっても形を変える、と考える。"></head><body><main><article><h1>あばたもえくぼ、玉に瑕――欠点は、どこから欠点になるのか</h1><p>「あばたもえくぼ」は、好きになれば欠点さえ魅力に見えると言う。一方の「玉に瑕」は、すばらしいものに残ったわずかな欠点を惜しむ。両者は辞書上の対義語ではないが、同じ『小さな欠点』に対して評価が逆向きに動く例として並べると面白い。本稿では、辞書資料と親密な関係におけるpositive illusions研究を手がかりに、欠点は対象だけでなく、好意・期待・比較基準という『見る側のものさし』によっても形を変える、と考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/abata-mo-ekubo-tama-ni-kizu-evaluation-lens?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/abata-mo-ekubo-tama-ni-kizu-evaluation-lens?lang=ja");</script></body></htm

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>右手で左手を触ると、どっちが「触っている側」なのか</title><meta name="description" content="右手で左手を触る。左手は触られる物体だが、次の瞬間には触れている側としても感じられる。自分の身体は世界の中にある物体でありながら、世界へ触れ、動き、知覚する側でもある。メルロ＝ポンティの身体論を手がかりに、身体を意識が操作する機械としてではなく、世界へアクセスする生きられた中心として捉え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/phenomenology-04-touching-hand-lived-body.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/phenomenology-04-touching-hand-lived-body.html"><meta property="og:title" content="右手で左手を触ると、どっちが「触っている側」なのか"><meta property="og:description" content="右手で左手を触る。左手は触られる物体だが、次の瞬間には触れている側としても感じられる。自分の身体は世界の中にある物体でありながら、世界へ触れ、動き、知覚する側でもある。メルロ＝ポンティの身体論を手がかりに、身体を意識が操作する機械としてではなく、世界へアクセスする生きられた中心として捉え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="右手で左手を触ると、どっちが「触っている側」なのか"><meta name="twitter:description" content="右手で左手を触る。左手は触られる物体だが、次の瞬間には触れている側としても感じられる。自分の身体は世界の中にある物体でありながら、世界へ触れ、動き、知覚する側でもある。メルロ＝ポンティの身体論を手がかりに、身体を意識が操作する機械としてではなく、世界へアクセスする生きられた中心として捉え直す。"></head><body><main><article><h1>右手で左手を触ると、どっちが「触っている側」なのか</h1><p>右手で左手を触る。左手は触られる物体だが、次の瞬間には触れている側としても感じられる。自分の身体は世界の中にある物体でありながら、世界へ触れ、動き、知覚する側でもある。メルロ＝ポンティの身体論を手がかりに、身体を意識が操作する機械としてではなく、世界へアクセスする生きられた中心として捉え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/phenomenology-04-touching-hand-lived-body?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/phenomenology-04-touching-hand-lived-body?lang=ja");</script></body></html>

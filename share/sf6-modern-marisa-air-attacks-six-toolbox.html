<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>モダンマリーザの空中攻撃は、「強を押す」だけの話ではなかった</title><meta name="description" content="モダンマリーザで飛び込んだら、とりあえず強攻撃――で本当にいいのか。現行のモダン操作では、通常の弱・中・強にアシスト同時押しを加えることで、クラシック操作の弱P・弱K・中P・中K・強P・強Kに相当する6種類の空中通常技を使い分けられる。本稿では発生、持続、ダメージ、めくり性能、空中ヒット時の効果を突き合わせ、空中攻撃を「強さ順」ではなく「解きたい問題順」に整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/sf6-modern-marisa-air-attacks-six-toolbox.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/sf6-modern-marisa-air-attacks-six-toolbox.html"><meta property="og:title" content="モダンマリーザの空中攻撃は、「強を押す」だけの話ではなかった"><meta property="og:description" content="モダンマリーザで飛び込んだら、とりあえず強攻撃――で本当にいいのか。現行のモダン操作では、通常の弱・中・強にアシスト同時押しを加えることで、クラシック操作の弱P・弱K・中P・中K・強P・強Kに相当する6種類の空中通常技を使い分けられる。本稿では発生、持続、ダメージ、めくり性能、空中ヒット時の効果を突き合わせ、空中攻撃を「強さ順」ではなく「解きたい問題順」に整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="モダンマリーザの空中攻撃は、「強を押す」だけの話ではなかった"><meta name="twitter:description" content="モダンマリーザで飛び込んだら、とりあえず強攻撃――で本当にいいのか。現行のモダン操作では、通常の弱・中・強にアシスト同時押しを加えることで、クラシック操作の弱P・弱K・中P・中K・強P・強Kに相当する6種類の空中通常技を使い分けられる。本稿では発生、持続、ダメージ、めくり性能、空中ヒット時の効果を突き合わせ、空中攻撃を「強さ順」ではなく「解きたい問題順」に整理する。"></head><body><main><article><h1>モダンマリーザの空中攻撃は、「強を押す」だけの話ではなかった</h1><p>モダンマリーザで飛び込んだら、とりあえず強攻撃――で本当にいいのか。現行のモダン操作では、通常の弱・中・強にアシスト同時押しを加えることで、クラシック操作の弱P・弱K・中P・中K・強P・強Kに相当する6種類の空中通常技を使い分けられる。本稿では発生、持続、ダメージ、めくり性能、空中ヒット時の効果を突き合わせ、空中攻撃を「強さ順」ではなく「解きたい問題順」に整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/sf6-modern-marisa-air-attacks-six-toolbox?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/sf6-modern-marisa-air-attacks-six-toolbox?lang=ja");</script></body></html>

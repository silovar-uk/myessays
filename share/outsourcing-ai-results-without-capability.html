<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成果は外注できる。でも、能力まで外に出すと何も残らない</title><meta name="description" content="外注も生成AIも、短時間で成果を得るための強力な手段である。しかし、成果物だけを受け取り、問題設定・判断基準・検証・振り返りまで外へ出すと、次回の仕事を速くする能力資産は内部に残りにくい。本稿では、learning by doing、組織学習、absorptive capacity、生成AIと批判的思考、GPSと空間学習の研究をつなぎ、外部の力を使いながら知識と判断力を内部化する「資産化ループ」を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/outsourcing-ai-results-without-capability.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/outsourcing-ai-results-without-capability.html"><meta property="og:title" content="成果は外注できる。でも、能力まで外に出すと何も残らない"><meta property="og:description" content="外注も生成AIも、短時間で成果を得るための強力な手段である。しかし、成果物だけを受け取り、問題設定・判断基準・検証・振り返りまで外へ出すと、次回の仕事を速くする能力資産は内部に残りにくい。本稿では、learning by doing、組織学習、absorptive capacity、生成AIと批判的思考、GPSと空間学習の研究をつなぎ、外部の力を使いながら知識と判断力を内部化する「資産化ループ」を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="成果は外注できる。でも、能力まで外に出すと何も残らない"><meta name="twitter:description" content="外注も生成AIも、短時間で成果を得るための強力な手段である。しかし、成果物だけを受け取り、問題設定・判断基準・検証・振り返りまで外へ出すと、次回の仕事を速くする能力資産は内部に残りにくい。本稿では、learning by doing、組織学習、absorptive capacity、生成AIと批判的思考、GPSと空間学習の研究をつなぎ、外部の力を使いながら知識と判断力を内部化する「資産化ループ」を考える。"></head><body><main><article><h1>成果は外注できる。でも、能力まで外に出すと何も残らない</h1><p>外注も生成AIも、短時間で成果を得るための強力な手段である。しかし、成果物だけを受け取り、問題設定・判断基準・検証・振り返りまで外へ出すと、次回の仕事を速くする能力資産は内部に残りにくい。本稿では、learning by doing、組織学習、absorptive capacity、生成AIと批判的思考、GPSと空間学習の研究をつなぎ、外部の力を使いながら知識と判断力を内部化する「資産化ループ」を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/outsourcing-ai-results-without-capability?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/outsourcing-ai-results-without-capability?lang=ja");</script></body></html>

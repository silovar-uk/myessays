<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生は速すぎるのではなく、通り過ぎすぎている</title><meta name="description" content="「もっとゆっくり生きたい」と思ったとき、必要なのは予定を全部減らすことでも、動作を遅くすることでもないのかもしれない。心理学のsavoring、主観的な時間の豊かさを扱うtime affluence、Harvard Project ZeroのSlow Looking、記憶と回想上の時間感覚の研究を辿ると、共通して見えてくるのは「経験をすぐ次へ送らない」という態度だった。世界そのものを遅くするのではなく、自分の中で世界が消えるまでの時間を少し長くする。そのための考え方と、小さな実験を整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/slow-world-savoring-attention-time.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/slow-world-savoring-attention-time.html"><meta property="og:title" content="人生は速すぎるのではなく、通り過ぎすぎている"><meta property="og:description" content="「もっとゆっくり生きたい」と思ったとき、必要なのは予定を全部減らすことでも、動作を遅くすることでもないのかもしれない。心理学のsavoring、主観的な時間の豊かさを扱うtime affluence、Harvard Project ZeroのSlow Looking、記憶と回想上の時間感覚の研究を辿ると、共通して見えてくるのは「経験をすぐ次へ送らない」という態度だった。世界そのものを遅くするのではなく、自分の中で世界が消えるまでの時間を少し長くする。そのための考え方と、小さな実験を整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="人生は速すぎるのではなく、通り過ぎすぎている"><meta name="twitter:description" content="「もっとゆっくり生きたい」と思ったとき、必要なのは予定を全部減らすことでも、動作を遅くすることでもないのかもしれない。心理学のsavoring、主観的な時間の豊かさを扱うtime affluence、Harvard Project ZeroのSlow Looking、記憶と回想上の時間感覚の研究を辿ると、共通して見えてくるのは「経験をすぐ次へ送らない」という態度だった。世界そのものを遅くするのではなく、自分の中で世界が消えるまでの時間を少し長くする。そのための考え方と、小さな実験を整理する。"></head><body><main><article><h1>人生は速すぎるのではなく、通り過ぎすぎている</h1><p>「もっとゆっくり生きたい」と思ったとき、必要なのは予定を全部減らすことでも、動作を遅くすることでもないのかもしれない。心理学のsavoring、主観的な時間の豊かさを扱うtime affluence、Harvard Project ZeroのSlow Looking、記憶と回想上の時間感覚の研究を辿ると、共通して見えてくるのは「経験をすぐ次へ送らない」という態度だった。世界そのものを遅くするのではなく、自分の中で世界が消えるまでの時間を少し長くする。そのための考え方と、小さな実験を整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/slow-world-savoring-attention-time?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-

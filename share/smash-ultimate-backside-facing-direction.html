<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマブラでは、背中も技表の一部である</title><meta name="description" content="格ゲーにも「めくり」はある。では、なぜスマブラでは相手の背後を取ることが妙に重要なのか。違いは、背後そのものではなく「向き」が長くゲーム状態として残り、空前と空後、ガード後の反撃、接近方法まで変える点にある。RAR、クロスアップ、ガーキャン、格ゲー出身組の自動振り向きを手掛かりに、スマブラを「距離のゲーム」だけでなく「向きを編集するゲーム」として捉え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/smash-ultimate-backside-facing-direction.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/smash-ultimate-backside-facing-direction.html"><meta property="og:title" content="スマブラでは、背中も技表の一部である"><meta property="og:description" content="格ゲーにも「めくり」はある。では、なぜスマブラでは相手の背後を取ることが妙に重要なのか。違いは、背後そのものではなく「向き」が長くゲーム状態として残り、空前と空後、ガード後の反撃、接近方法まで変える点にある。RAR、クロスアップ、ガーキャン、格ゲー出身組の自動振り向きを手掛かりに、スマブラを「距離のゲーム」だけでなく「向きを編集するゲーム」として捉え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="スマブラでは、背中も技表の一部である"><meta name="twitter:description" content="格ゲーにも「めくり」はある。では、なぜスマブラでは相手の背後を取ることが妙に重要なのか。違いは、背後そのものではなく「向き」が長くゲーム状態として残り、空前と空後、ガード後の反撃、接近方法まで変える点にある。RAR、クロスアップ、ガーキャン、格ゲー出身組の自動振り向きを手掛かりに、スマブラを「距離のゲーム」だけでなく「向きを編集するゲーム」として捉え直す。"></head><body><main><article><h1>スマブラでは、背中も技表の一部である</h1><p>格ゲーにも「めくり」はある。では、なぜスマブラでは相手の背後を取ることが妙に重要なのか。違いは、背後そのものではなく「向き」が長くゲーム状態として残り、空前と空後、ガード後の反撃、接近方法まで変える点にある。RAR、クロスアップ、ガーキャン、格ゲー出身組の自動振り向きを手掛かりに、スマブラを「距離のゲーム」だけでなく「向きを編集するゲーム」として捉え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/smash-ultimate-backside-facing-direction?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/smash-ultimate-backside-facing-direction?lang=ja");</script></body></html>

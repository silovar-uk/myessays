<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>条件が整っていても、人が支えなければ続かない――孟子「天時不如地利、地利不如人和」</title><meta name="description" content="『孟子』「公孫丑下」の「天時不如地利、地利不如人和」を、単なるチームワーク論ではなく、外的条件と人々からの支持を区別する言葉として読む。城壁・堀・武器・食糧があっても人々が去れば守れないという原文の流れから、現代の仕事では「導入した」と「実際に支えられている」を分けて考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/mencius-conditions-and-popular-support.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/mencius-conditions-and-popular-support.html"><meta property="og:title" content="条件が整っていても、人が支えなければ続かない――孟子「天時不如地利、地利不如人和」"><meta property="og:description" content="『孟子』「公孫丑下」の「天時不如地利、地利不如人和」を、単なるチームワーク論ではなく、外的条件と人々からの支持を区別する言葉として読む。城壁・堀・武器・食糧があっても人々が去れば守れないという原文の流れから、現代の仕事では「導入した」と「実際に支えられている」を分けて考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="条件が整っていても、人が支えなければ続かない――孟子「天時不如地利、地利不如人和」"><meta name="twitter:description" content="『孟子』「公孫丑下」の「天時不如地利、地利不如人和」を、単なるチームワーク論ではなく、外的条件と人々からの支持を区別する言葉として読む。城壁・堀・武器・食糧があっても人々が去れば守れないという原文の流れから、現代の仕事では「導入した」と「実際に支えられている」を分けて考える。"></head><body><main><article><h1>条件が整っていても、人が支えなければ続かない――孟子「天時不如地利、地利不如人和」</h1><p>『孟子』「公孫丑下」の「天時不如地利、地利不如人和」を、単なるチームワーク論ではなく、外的条件と人々からの支持を区別する言葉として読む。城壁・堀・武器・食糧があっても人々が去れば守れないという原文の流れから、現代の仕事では「導入した」と「実際に支えられている」を分けて考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/mencius-conditions-and-popular-support?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/mencius-conditions-and-popular-support?lang=ja");</script></body></html>

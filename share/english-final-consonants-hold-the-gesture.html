<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「ン」で置くより、音を保つ――英語は「伸ばし」のつもりで発音すると何が変わるか</title><meta name="description" content="英語の語末子音、とくに/n/を、日本語の「ン」を一拍置くように発音するより、舌や唇の状態を保つ「伸ばし」と考えると発音しやすいのではないか。この直感を音声学から検証する。結論は半分当たりで半分危険だった。英語の鼻音は持続でき、音節子音では実際に子音そのものが音節の核になる一方、日本語の語末鼻音のほうが英語より長いという報告もある。効くのは長さではなく、「別のンを足す」から「子音の調音ジェスチャーを途切れさせず保つ」への認識転換である。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/english-final-consonants-hold-the-gesture.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/english-final-consonants-hold-the-gesture.html"><meta property="og:title" content="「ン」で置くより、音を保つ――英語は「伸ばし」のつもりで発音すると何が変わるか"><meta property="og:description" content="英語の語末子音、とくに/n/を、日本語の「ン」を一拍置くように発音するより、舌や唇の状態を保つ「伸ばし」と考えると発音しやすいのではないか。この直感を音声学から検証する。結論は半分当たりで半分危険だった。英語の鼻音は持続でき、音節子音では実際に子音そのものが音節の核になる一方、日本語の語末鼻音のほうが英語より長いという報告もある。効くのは長さではなく、「別のンを足す」から「子音の調音ジェスチャーを途切れさせず保つ」への認識転換である。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「ン」で置くより、音を保つ――英語は「伸ばし」のつもりで発音すると何が変わるか"><meta name="twitter:description" content="英語の語末子音、とくに/n/を、日本語の「ン」を一拍置くように発音するより、舌や唇の状態を保つ「伸ばし」と考えると発音しやすいのではないか。この直感を音声学から検証する。結論は半分当たりで半分危険だった。英語の鼻音は持続でき、音節子音では実際に子音そのものが音節の核になる一方、日本語の語末鼻音のほうが英語より長いという報告もある。効くのは長さではなく、「別のンを足す」から「子音の調音ジェスチャーを途切れさせず保つ」への認識転換である。"></head><body><main><article><h1>「ン」で置くより、音を保つ――英語は「伸ばし」のつもりで発音すると何が変わるか</h1><p>英語の語末子音、とくに/n/を、日本語の「ン」を一拍置くように発音するより、舌や唇の状態を保つ「伸ばし」と考えると発音しやすいのではないか。この直感を音声学から検証する。結論は半分当たりで半分危険だった。英語の鼻音は持続でき、音節子音では実際に子音そのものが音節の核になる一方、日本語の語末鼻音のほうが英語より長いという報告もある。効くのは長さではなく、「別のンを足す」から「子音の調音ジェスチャーを途切れさせず保つ」への認識転換である。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/english-final-consonants-hold-the-gesture?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/ess

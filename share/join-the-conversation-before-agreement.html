<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「正しい。でも今それじゃない」の正体――肯定より先に、話に乗る</title><meta name="description" content="友人が『会社辞めよかな』と言った瞬間に、正しい助言を返したのになぜか会話がしぼむことがある。そこで『肯定する』とは別に、『まず話に乗る』という行為を考えてみる。DBTのvalidation、会話分析のalignment / affiliation、助言研究を辿ると、話に乗ることは単なる同意ではなく、相手が始めた会話をいったん共同作業として続けることに近かった。重要なのは返答の正しさだけではなく、順番なのかもしれない。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/join-the-conversation-before-agreement.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/join-the-conversation-before-agreement.html"><meta property="og:title" content="「正しい。でも今それじゃない」の正体――肯定より先に、話に乗る"><meta property="og:description" content="友人が『会社辞めよかな』と言った瞬間に、正しい助言を返したのになぜか会話がしぼむことがある。そこで『肯定する』とは別に、『まず話に乗る』という行為を考えてみる。DBTのvalidation、会話分析のalignment / affiliation、助言研究を辿ると、話に乗ることは単なる同意ではなく、相手が始めた会話をいったん共同作業として続けることに近かった。重要なのは返答の正しさだけではなく、順番なのかもしれない。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「正しい。でも今それじゃない」の正体――肯定より先に、話に乗る"><meta name="twitter:description" content="友人が『会社辞めよかな』と言った瞬間に、正しい助言を返したのになぜか会話がしぼむことがある。そこで『肯定する』とは別に、『まず話に乗る』という行為を考えてみる。DBTのvalidation、会話分析のalignment / affiliation、助言研究を辿ると、話に乗ることは単なる同意ではなく、相手が始めた会話をいったん共同作業として続けることに近かった。重要なのは返答の正しさだけではなく、順番なのかもしれない。"></head><body><main><article><h1>「正しい。でも今それじゃない」の正体――肯定より先に、話に乗る</h1><p>友人が『会社辞めよかな』と言った瞬間に、正しい助言を返したのになぜか会話がしぼむことがある。そこで『肯定する』とは別に、『まず話に乗る』という行為を考えてみる。DBTのvalidation、会話分析のalignment / affiliation、助言研究を辿ると、話に乗ることは単なる同意ではなく、相手が始めた会話をいったん共同作業として続けることに近かった。重要なのは返答の正しさだけではなく、順番なのかもしれない。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/join-the-conversation-before-agreement?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/join-the-conversation-before-agreement?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天網恢恢――世界は本当に見逃さないのか</title><meta name="description" content="「天網恢恢、疎にして漏らさず」は、悪事はいずれ露見するという教訓として知られる。だが『老子』第73章を前後まで読むと、そこには「天の判断を人間が簡単に知れるのか」という揺らぎもある。公正世界仮説や道徳的運を補助線に、善悪と結果が一致しない現実、それでも人間が司法・監査・記録という『網』を編み続ける理由を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/tenmou-kaikai-justice.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/tenmou-kaikai-justice.html"><meta property="og:title" content="天網恢恢――世界は本当に見逃さないのか"><meta property="og:description" content="「天網恢恢、疎にして漏らさず」は、悪事はいずれ露見するという教訓として知られる。だが『老子』第73章を前後まで読むと、そこには「天の判断を人間が簡単に知れるのか」という揺らぎもある。公正世界仮説や道徳的運を補助線に、善悪と結果が一致しない現実、それでも人間が司法・監査・記録という『網』を編み続ける理由を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="天網恢恢――世界は本当に見逃さないのか"><meta name="twitter:description" content="「天網恢恢、疎にして漏らさず」は、悪事はいずれ露見するという教訓として知られる。だが『老子』第73章を前後まで読むと、そこには「天の判断を人間が簡単に知れるのか」という揺らぎもある。公正世界仮説や道徳的運を補助線に、善悪と結果が一致しない現実、それでも人間が司法・監査・記録という『網』を編み続ける理由を考える。"></head><body><main><article><h1>天網恢恢――世界は本当に見逃さないのか</h1><p>「天網恢恢、疎にして漏らさず」は、悪事はいずれ露見するという教訓として知られる。だが『老子』第73章を前後まで読むと、そこには「天の判断を人間が簡単に知れるのか」という揺らぎもある。公正世界仮説や道徳的運を補助線に、善悪と結果が一致しない現実、それでも人間が司法・監査・記録という『網』を編み続ける理由を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/tenmou-kaikai-justice?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/tenmou-kaikai-justice?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ライトの中にカメラがいる。Three.jsで影を出すと、世界をもう一度描く</title><meta name="description" content="Three.jsで影を一つ足すだけなのに、なぜライト側にもCameraが必要なのか。Shadow Cameraの範囲をわざと狭めて影を消し、影を落とすライト数も切り替えながら、Shadow Mapが『光から見た深度』を使う仕組みと描画コストを追う。PointLightが6方向ぶんの影描画を必要とする理由や、影の解像度・bias・WebGPU移行期の現在地まで整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/threejs-shadow-map-light-camera.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/threejs-shadow-map-light-camera.html"><meta property="og:title" content="ライトの中にカメラがいる。Three.jsで影を出すと、世界をもう一度描く"><meta property="og:description" content="Three.jsで影を一つ足すだけなのに、なぜライト側にもCameraが必要なのか。Shadow Cameraの範囲をわざと狭めて影を消し、影を落とすライト数も切り替えながら、Shadow Mapが『光から見た深度』を使う仕組みと描画コストを追う。PointLightが6方向ぶんの影描画を必要とする理由や、影の解像度・bias・WebGPU移行期の現在地まで整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="ライトの中にカメラがいる。Three.jsで影を出すと、世界をもう一度描く"><meta name="twitter:description" content="Three.jsで影を一つ足すだけなのに、なぜライト側にもCameraが必要なのか。Shadow Cameraの範囲をわざと狭めて影を消し、影を落とすライト数も切り替えながら、Shadow Mapが『光から見た深度』を使う仕組みと描画コストを追う。PointLightが6方向ぶんの影描画を必要とする理由や、影の解像度・bias・WebGPU移行期の現在地まで整理する。"></head><body><main><article><h1>ライトの中にカメラがいる。Three.jsで影を出すと、世界をもう一度描く</h1><p>Three.jsで影を一つ足すだけなのに、なぜライト側にもCameraが必要なのか。Shadow Cameraの範囲をわざと狭めて影を消し、影を落とすライト数も切り替えながら、Shadow Mapが『光から見た深度』を使う仕組みと描画コストを追う。PointLightが6方向ぶんの影描画を必要とする理由や、影の解像度・bias・WebGPU移行期の現在地まで整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/threejs-shadow-map-light-camera?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/threejs-shadow-map-light-camera?lang=ja");</script></body></html>

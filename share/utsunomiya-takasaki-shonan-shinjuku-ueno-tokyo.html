<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>湘南新宿ラインと上野東京ラインが混ざる理由</title><meta name="description" content="宇都宮線、高崎線、湘南新宿ライン、上野東京ライン。名前も車両も色も似ていて混ざる。しかし混乱の原因は知識不足ではなく、4つを同じ種類の『路線名』として覚えようとすることにある。北へ伸びる宇都宮・高崎の2方向と、東京圏を南北に貫く新宿経由・上野東京経由の2ルートに分け、1880年代から2001年、2015年へと歴史を重ねると、首都圏の巨大な直通ネットワークが見えてくる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/utsunomiya-takasaki-shonan-shinjuku-ueno-tokyo.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/utsunomiya-takasaki-shonan-shinjuku-ueno-tokyo.html"><meta property="og:title" content="湘南新宿ラインと上野東京ラインが混ざる理由"><meta property="og:description" content="宇都宮線、高崎線、湘南新宿ライン、上野東京ライン。名前も車両も色も似ていて混ざる。しかし混乱の原因は知識不足ではなく、4つを同じ種類の『路線名』として覚えようとすることにある。北へ伸びる宇都宮・高崎の2方向と、東京圏を南北に貫く新宿経由・上野東京経由の2ルートに分け、1880年代から2001年、2015年へと歴史を重ねると、首都圏の巨大な直通ネットワークが見えてくる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="湘南新宿ラインと上野東京ラインが混ざる理由"><meta name="twitter:description" content="宇都宮線、高崎線、湘南新宿ライン、上野東京ライン。名前も車両も色も似ていて混ざる。しかし混乱の原因は知識不足ではなく、4つを同じ種類の『路線名』として覚えようとすることにある。北へ伸びる宇都宮・高崎の2方向と、東京圏を南北に貫く新宿経由・上野東京経由の2ルートに分け、1880年代から2001年、2015年へと歴史を重ねると、首都圏の巨大な直通ネットワークが見えてくる。"></head><body><main><article><h1>湘南新宿ラインと上野東京ラインが混ざる理由</h1><p>宇都宮線、高崎線、湘南新宿ライン、上野東京ライン。名前も車両も色も似ていて混ざる。しかし混乱の原因は知識不足ではなく、4つを同じ種類の『路線名』として覚えようとすることにある。北へ伸びる宇都宮・高崎の2方向と、東京圏を南北に貫く新宿経由・上野東京経由の2ルートに分け、1880年代から2001年、2015年へと歴史を重ねると、首都圏の巨大な直通ネットワークが見えてくる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/utsunomiya-takasaki-shonan-shinjuku-ueno-tokyo?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/utsunomiya-takasaki-shonan-shinjuku-ueno-tokyo?lang=ja");</script></body></html>

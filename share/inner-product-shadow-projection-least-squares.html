<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平均値を取ると「残り」が直角になる――内積は影を測る装置だった</title><meta name="description" content="前編では、ベクトルが図形から住所を剥がし、内積が長さと角度を保存することを追った。続編では、内積を『影を測る装置』として見直す。3つの数2,3,7の平均4を取ると、残差(-2,-1,3)は(1,1,1)と直交する。この小さな事実から、射影、解けない連立方程式への最善近似、最小二乗法、さらに文書検索のcosine similarityまで同じ構造でつながる。内積は単なる成分の掛け算ではなく、『この方向をどれだけ含んでいるか』を測り、残りにその方向が一切なくなった地点を最善と認定する装置だった。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/inner-product-shadow-projection-least-squares.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/inner-product-shadow-projection-least-squares.html"><meta property="og:title" content="平均値を取ると「残り」が直角になる――内積は影を測る装置だった"><meta property="og:description" content="前編では、ベクトルが図形から住所を剥がし、内積が長さと角度を保存することを追った。続編では、内積を『影を測る装置』として見直す。3つの数2,3,7の平均4を取ると、残差(-2,-1,3)は(1,1,1)と直交する。この小さな事実から、射影、解けない連立方程式への最善近似、最小二乗法、さらに文書検索のcosine similarityまで同じ構造でつながる。内積は単なる成分の掛け算ではなく、『この方向をどれだけ含んでいるか』を測り、残りにその方向が一切なくなった地点を最善と認定する装置だった。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="平均値を取ると「残り」が直角になる――内積は影を測る装置だった"><meta name="twitter:description" content="前編では、ベクトルが図形から住所を剥がし、内積が長さと角度を保存することを追った。続編では、内積を『影を測る装置』として見直す。3つの数2,3,7の平均4を取ると、残差(-2,-1,3)は(1,1,1)と直交する。この小さな事実から、射影、解けない連立方程式への最善近似、最小二乗法、さらに文書検索のcosine similarityまで同じ構造でつながる。内積は単なる成分の掛け算ではなく、『この方向をどれだけ含んでいるか』を測り、残りにその方向が一切なくなった地点を最善と認定する装置だった。"></head><body><main><article><h1>平均値を取ると「残り」が直角になる――内積は影を測る装置だった</h1><p>前編では、ベクトルが図形から住所を剥がし、内積が長さと角度を保存することを追った。続編では、内積を『影を測る装置』として見直す。3つの数2,3,7の平均4を取ると、残差(-2,-1,3)は(1,1,1)と直交する。この小さな事実から、射影、解けない連立方程式への最善近似、最小二乗法、さらに文書検索のcosine similarityまで同じ構造でつながる。内積は単なる成分の掛け算ではなく、『この方向をどれだけ含んでいるか』を測り、残りにその方向が一切なくなった地点を最善と認定する装置だった。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/inner-product-shadow-projection-least-squares?lang=ja">My Essaysで本文を

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アイコンだけにすると、なぜ急にクイズになるのか</title><meta name="description" content="『アイコンだけにすると画面はすっきりする』という直感を疑い、Icon + Labelを視覚探索と意味確定の役割分担として捉え直す。Resemblance / Reference / Arbitraryというアイコン分類、accessible nameとvisible labelの違い、ミュンヘン1972のピクトグラムを手掛かりに、文字を消すことで増える推論コストを検討し、実務で使えるアイコン監査手順へ戻す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-icon-label-recognition.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-icon-label-recognition.html"><meta property="og:title" content="アイコンだけにすると、なぜ急にクイズになるのか"><meta property="og:description" content="『アイコンだけにすると画面はすっきりする』という直感を疑い、Icon + Labelを視覚探索と意味確定の役割分担として捉え直す。Resemblance / Reference / Arbitraryというアイコン分類、accessible nameとvisible labelの違い、ミュンヘン1972のピクトグラムを手掛かりに、文字を消すことで増える推論コストを検討し、実務で使えるアイコン監査手順へ戻す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="アイコンだけにすると、なぜ急にクイズになるのか"><meta name="twitter:description" content="『アイコンだけにすると画面はすっきりする』という直感を疑い、Icon + Labelを視覚探索と意味確定の役割分担として捉え直す。Resemblance / Reference / Arbitraryというアイコン分類、accessible nameとvisible labelの違い、ミュンヘン1972のピクトグラムを手掛かりに、文字を消すことで増える推論コストを検討し、実務で使えるアイコン監査手順へ戻す。"></head><body><main><article><h1>アイコンだけにすると、なぜ急にクイズになるのか</h1><p>『アイコンだけにすると画面はすっきりする』という直感を疑い、Icon + Labelを視覚探索と意味確定の役割分担として捉え直す。Resemblance / Reference / Arbitraryというアイコン分類、accessible nameとvisible labelの違い、ミュンヘン1972のピクトグラムを手掛かりに、文字を消すことで増える推論コストを検討し、実務で使えるアイコン監査手順へ戻す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-icon-label-recognition?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-icon-label-recognition?lang=ja");</script></body></html>

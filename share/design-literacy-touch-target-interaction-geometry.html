<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Touch Target――『見えている大きさ』と『押せる大きさ』は別物</title><meta name="description" content="Touch Targetを、単なる『ボタンを大きくする』テクニックではなく、見えているVisual Geometryと実際に操作できるInteraction Geometryを分けて設計する考え方として整理する。WCAG 2.2とApple HIGの基準を目的の違いごとに分け、target size・spacing・contextを制作指示へ落とし込む。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-touch-target-interaction-geometry.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-touch-target-interaction-geometry.html"><meta property="og:title" content="Touch Target――『見えている大きさ』と『押せる大きさ』は別物"><meta property="og:description" content="Touch Targetを、単なる『ボタンを大きくする』テクニックではなく、見えているVisual Geometryと実際に操作できるInteraction Geometryを分けて設計する考え方として整理する。WCAG 2.2とApple HIGの基準を目的の違いごとに分け、target size・spacing・contextを制作指示へ落とし込む。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Touch Target――『見えている大きさ』と『押せる大きさ』は別物"><meta name="twitter:description" content="Touch Targetを、単なる『ボタンを大きくする』テクニックではなく、見えているVisual Geometryと実際に操作できるInteraction Geometryを分けて設計する考え方として整理する。WCAG 2.2とApple HIGの基準を目的の違いごとに分け、target size・spacing・contextを制作指示へ落とし込む。"></head><body><main><article><h1>Touch Target――『見えている大きさ』と『押せる大きさ』は別物</h1><p>Touch Targetを、単なる『ボタンを大きくする』テクニックではなく、見えているVisual Geometryと実際に操作できるInteraction Geometryを分けて設計する考え方として整理する。WCAG 2.2とApple HIGの基準を目的の違いごとに分け、target size・spacing・contextを制作指示へ落とし込む。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-touch-target-interaction-geometry?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-touch-target-interaction-geometry?lang=ja");</script></body></html>

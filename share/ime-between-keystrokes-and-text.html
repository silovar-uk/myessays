<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「nihongo」が「日本語」になるまで――IMEは何をしているのか</title><meta name="description" content="ローマ字でnihongoと打ったのに、最終的に画面へ残るのは「日本語」。その途中では、キーボード、IME、OSの入力システム、アプリが別々の役割を担っている。本稿では、IMEを単なる『漢字変換ソフト』ではなく、限られた入力操作から意図した文字列を組み立てる仕組みとして捉える。変換中のcompositionと確定後のtextの違い、スマホ入力、多言語入力、Web開発で起きるEnterキー問題まで、普段は見えない文字入力の裏側を整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/ime-between-keystrokes-and-text.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/ime-between-keystrokes-and-text.html"><meta property="og:title" content="「nihongo」が「日本語」になるまで――IMEは何をしているのか"><meta property="og:description" content="ローマ字でnihongoと打ったのに、最終的に画面へ残るのは「日本語」。その途中では、キーボード、IME、OSの入力システム、アプリが別々の役割を担っている。本稿では、IMEを単なる『漢字変換ソフト』ではなく、限られた入力操作から意図した文字列を組み立てる仕組みとして捉える。変換中のcompositionと確定後のtextの違い、スマホ入力、多言語入力、Web開発で起きるEnterキー問題まで、普段は見えない文字入力の裏側を整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「nihongo」が「日本語」になるまで――IMEは何をしているのか"><meta name="twitter:description" content="ローマ字でnihongoと打ったのに、最終的に画面へ残るのは「日本語」。その途中では、キーボード、IME、OSの入力システム、アプリが別々の役割を担っている。本稿では、IMEを単なる『漢字変換ソフト』ではなく、限られた入力操作から意図した文字列を組み立てる仕組みとして捉える。変換中のcompositionと確定後のtextの違い、スマホ入力、多言語入力、Web開発で起きるEnterキー問題まで、普段は見えない文字入力の裏側を整理する。"></head><body><main><article><h1>「nihongo」が「日本語」になるまで――IMEは何をしているのか</h1><p>ローマ字でnihongoと打ったのに、最終的に画面へ残るのは「日本語」。その途中では、キーボード、IME、OSの入力システム、アプリが別々の役割を担っている。本稿では、IMEを単なる『漢字変換ソフト』ではなく、限られた入力操作から意図した文字列を組み立てる仕組みとして捉える。変換中のcompositionと確定後のtextの違い、スマホ入力、多言語入力、Web開発で起きるEnterキー問題まで、普段は見えない文字入力の裏側を整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/ime-between-keystrokes-and-text?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/ime-between-keystrokes-and-text?lang=ja");</scr

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スプーンが二本だった、というだけのこと――「意味をもたせる」と「流す」のあいだ</title><meta name="description" content="プリンを一つ買ったのに、スプーンが二本入っていた。そこから人生の教訓を語ることはできる。だが、語ってしまってよいのか。「意味をもたせる」と「流す」を、原因の説明・自分の物語・次の行動に分けて考える。意味形成、記憶、感情の研究を確かめ、四つの日常場面を使った机上実験を経て、何でもない出来事を何でもないままにしておく自由を探る。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/meaning-and-letting-pass-two-spoons.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/meaning-and-letting-pass-two-spoons.html"><meta property="og:title" content="スプーンが二本だった、というだけのこと――「意味をもたせる」と「流す」のあいだ"><meta property="og:description" content="プリンを一つ買ったのに、スプーンが二本入っていた。そこから人生の教訓を語ることはできる。だが、語ってしまってよいのか。「意味をもたせる」と「流す」を、原因の説明・自分の物語・次の行動に分けて考える。意味形成、記憶、感情の研究を確かめ、四つの日常場面を使った机上実験を経て、何でもない出来事を何でもないままにしておく自由を探る。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="スプーンが二本だった、というだけのこと――「意味をもたせる」と「流す」のあいだ"><meta name="twitter:description" content="プリンを一つ買ったのに、スプーンが二本入っていた。そこから人生の教訓を語ることはできる。だが、語ってしまってよいのか。「意味をもたせる」と「流す」を、原因の説明・自分の物語・次の行動に分けて考える。意味形成、記憶、感情の研究を確かめ、四つの日常場面を使った机上実験を経て、何でもない出来事を何でもないままにしておく自由を探る。"></head><body><main><article><h1>スプーンが二本だった、というだけのこと――「意味をもたせる」と「流す」のあいだ</h1><p>プリンを一つ買ったのに、スプーンが二本入っていた。そこから人生の教訓を語ることはできる。だが、語ってしまってよいのか。「意味をもたせる」と「流す」を、原因の説明・自分の物語・次の行動に分けて考える。意味形成、記憶、感情の研究を確かめ、四つの日常場面を使った机上実験を経て、何でもない出来事を何でもないままにしておく自由を探る。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/meaning-and-letting-pass-two-spoons?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/meaning-and-letting-pass-two-spoons?lang=ja");</script></body></html>

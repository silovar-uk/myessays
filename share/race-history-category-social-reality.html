<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肌の色が「分類」になったのはなぜか――「黒人」に歴史が乗るまで</title><meta name="description" content="肌の色は目に見える。だが、肌の色を人間集団の本質的な境界とみなし、社会制度や能力、価値と結びつける「人種」は自然に存在してきた分類ではない。AABAの声明、日本の地理教育研究、近代日本をめぐる人種言説の研究をたどり、「人種は生物学的な箱ではないが、社会的な現実として強い力を持つ」という一見矛盾した状態を整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/race-history-category-social-reality.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/race-history-category-social-reality.html"><meta property="og:title" content="肌の色が「分類」になったのはなぜか――「黒人」に歴史が乗るまで"><meta property="og:description" content="肌の色は目に見える。だが、肌の色を人間集団の本質的な境界とみなし、社会制度や能力、価値と結びつける「人種」は自然に存在してきた分類ではない。AABAの声明、日本の地理教育研究、近代日本をめぐる人種言説の研究をたどり、「人種は生物学的な箱ではないが、社会的な現実として強い力を持つ」という一見矛盾した状態を整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="肌の色が「分類」になったのはなぜか――「黒人」に歴史が乗るまで"><meta name="twitter:description" content="肌の色は目に見える。だが、肌の色を人間集団の本質的な境界とみなし、社会制度や能力、価値と結びつける「人種」は自然に存在してきた分類ではない。AABAの声明、日本の地理教育研究、近代日本をめぐる人種言説の研究をたどり、「人種は生物学的な箱ではないが、社会的な現実として強い力を持つ」という一見矛盾した状態を整理する。"></head><body><main><article><h1>肌の色が「分類」になったのはなぜか――「黒人」に歴史が乗るまで</h1><p>肌の色は目に見える。だが、肌の色を人間集団の本質的な境界とみなし、社会制度や能力、価値と結びつける「人種」は自然に存在してきた分類ではない。AABAの声明、日本の地理教育研究、近代日本をめぐる人種言説の研究をたどり、「人種は生物学的な箱ではないが、社会的な現実として強い力を持つ」という一見矛盾した状態を整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/race-history-category-social-reality?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/race-history-category-social-reality?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Measure / Line Length――本文幅は「箱の幅」ではなく「読む距離」</title><meta name="description" content="Measure / Line Lengthを、単なる本文コンテナの幅ではなく、読者の目が行頭から行末まで移動し、次の行頭へ戻る距離として捉える。USWDSの45〜90 characters・長文66 charactersという実務ガイド、WCAG 1.4.8の80 glyphs／CJK 40 glyphsという調整可能性の要件、CSSのch/ic単位、Swiss Styleのグリッド思想を混同せず接続し、現在のWeb制作指示へ戻す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-measure-line-length-reading-distance.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-measure-line-length-reading-distance.html"><meta property="og:title" content="Measure / Line Length――本文幅は「箱の幅」ではなく「読む距離」"><meta property="og:description" content="Measure / Line Lengthを、単なる本文コンテナの幅ではなく、読者の目が行頭から行末まで移動し、次の行頭へ戻る距離として捉える。USWDSの45〜90 characters・長文66 charactersという実務ガイド、WCAG 1.4.8の80 glyphs／CJK 40 glyphsという調整可能性の要件、CSSのch/ic単位、Swiss Styleのグリッド思想を混同せず接続し、現在のWeb制作指示へ戻す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Measure / Line Length――本文幅は「箱の幅」ではなく「読む距離」"><meta name="twitter:description" content="Measure / Line Lengthを、単なる本文コンテナの幅ではなく、読者の目が行頭から行末まで移動し、次の行頭へ戻る距離として捉える。USWDSの45〜90 characters・長文66 charactersという実務ガイド、WCAG 1.4.8の80 glyphs／CJK 40 glyphsという調整可能性の要件、CSSのch/ic単位、Swiss Styleのグリッド思想を混同せず接続し、現在のWeb制作指示へ戻す。"></head><body><main><article><h1>Measure / Line Length――本文幅は「箱の幅」ではなく「読む距離」</h1><p>Measure / Line Lengthを、単なる本文コンテナの幅ではなく、読者の目が行頭から行末まで移動し、次の行頭へ戻る距離として捉える。USWDSの45〜90 characters・長文66 charactersという実務ガイド、WCAG 1.4.8の80 glyphs／CJK 40 glyphsという調整可能性の要件、CSSのch/ic単位、Swiss Styleのグリッド思想を混同せず接続し、現在のWeb制作指示へ戻す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-measure-line-length-reading-distance?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("ht

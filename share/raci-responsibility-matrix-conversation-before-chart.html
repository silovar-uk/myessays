<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RACIは「誰がやるか」の表ではない</title><meta name="description" content="RACIはResponsible、Accountable、Consulted、Informedの四つで、仕事と役割の関係を整理する責任分担表である。ただし本質は、表を埋めることではなく、誰が実行し、誰が最終的に引き受け、誰の意見を先に聞き、誰へ知らせるかを合意することにある。1960年代の線形責任図まで遡れる歴史、四文字の意味、作り方、典型的な失敗、RACIへの批判、DACIやRAPIDなどの近縁概念まで、初学者向けに整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/raci-responsibility-matrix-conversation-before-chart.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/raci-responsibility-matrix-conversation-before-chart.html"><meta property="og:title" content="RACIは「誰がやるか」の表ではない"><meta property="og:description" content="RACIはResponsible、Accountable、Consulted、Informedの四つで、仕事と役割の関係を整理する責任分担表である。ただし本質は、表を埋めることではなく、誰が実行し、誰が最終的に引き受け、誰の意見を先に聞き、誰へ知らせるかを合意することにある。1960年代の線形責任図まで遡れる歴史、四文字の意味、作り方、典型的な失敗、RACIへの批判、DACIやRAPIDなどの近縁概念まで、初学者向けに整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="RACIは「誰がやるか」の表ではない"><meta name="twitter:description" content="RACIはResponsible、Accountable、Consulted、Informedの四つで、仕事と役割の関係を整理する責任分担表である。ただし本質は、表を埋めることではなく、誰が実行し、誰が最終的に引き受け、誰の意見を先に聞き、誰へ知らせるかを合意することにある。1960年代の線形責任図まで遡れる歴史、四文字の意味、作り方、典型的な失敗、RACIへの批判、DACIやRAPIDなどの近縁概念まで、初学者向けに整理する。"></head><body><main><article><h1>RACIは「誰がやるか」の表ではない</h1><p>RACIはResponsible、Accountable、Consulted、Informedの四つで、仕事と役割の関係を整理する責任分担表である。ただし本質は、表を埋めることではなく、誰が実行し、誰が最終的に引き受け、誰の意見を先に聞き、誰へ知らせるかを合意することにある。1960年代の線形責任図まで遡れる歴史、四文字の意味、作り方、典型的な失敗、RACIへの批判、DACIやRAPIDなどの近縁概念まで、初学者向けに整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/raci-responsibility-matrix-conversation-before-chart?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/raci-responsibility-matrix-conversation-before-chart?lang=ja

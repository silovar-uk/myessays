<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>値段より先に、交渉を守る――取適法が変えた「価格の決まり方」</title><meta name="description" content="取適法は、旧下請法のrenameだけではない。It added rules on transport, employee-size criteria, payment methods, and—most interestingly—the process of price negotiation itself. 『安すぎる価格』というresultだけでなく、『価格がどう決まったか』を見る制度へ少し動いた。その意味を、企業間取引のfairnessという観点から考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/toritekihou-negotiation-before-price.en.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/toritekihou-negotiation-before-price.en.html"><meta property="og:title" content="値段より先に、交渉を守る――取適法が変えた「価格の決まり方」"><meta property="og:description" content="取適法は、旧下請法のrenameだけではない。It added rules on transport, employee-size criteria, payment methods, and—most interestingly—the process of price negotiation itself. 『安すぎる価格』というresultだけでなく、『価格がどう決まったか』を見る制度へ少し動いた。その意味を、企業間取引のfairnessという観点から考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="値段より先に、交渉を守る――取適法が変えた「価格の決まり方」"><meta name="twitter:description" content="取適法は、旧下請法のrenameだけではない。It added rules on transport, employee-size criteria, payment methods, and—most interestingly—the process of price negotiation itself. 『安すぎる価格』というresultだけでなく、『価格がどう決まったか』を見る制度へ少し動いた。その意味を、企業間取引のfairnessという観点から考える。"></head><body><main><article><h1>値段より先に、交渉を守る――取適法が変えた「価格の決まり方」</h1><p>取適法は、旧下請法のrenameだけではない。It added rules on transport, employee-size criteria, payment methods, and—most interestingly—the process of price negotiation itself. 『安すぎる価格』というresultだけでなく、『価格がどう決まったか』を見る制度へ少し動いた。その意味を、企業間取引のfairnessという観点から考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/toritekihou-negotiation-before-price?lang=en">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.githu

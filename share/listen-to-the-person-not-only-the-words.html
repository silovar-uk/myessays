<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語は「感情」から聴く</title><meta name="description" content="英語を一語ずつ捕まえようとするより、話者の感情や意図を聴こうとした方が、かえって意味を拾いやすいことがある。この感覚を、prosody、speech segmentation、bottom-up / top-down processing、predictionの研究から検討する。結論は『感情を聴けばよい』ではない。感情を入口に、単語以外の手掛かりへ注意を広げることが、Listeningの見え方を変えているのではないか。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/listen-to-the-person-not-only-the-words.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/listen-to-the-person-not-only-the-words.html"><meta property="og:title" content="英語は「感情」から聴く"><meta property="og:description" content="英語を一語ずつ捕まえようとするより、話者の感情や意図を聴こうとした方が、かえって意味を拾いやすいことがある。この感覚を、prosody、speech segmentation、bottom-up / top-down processing、predictionの研究から検討する。結論は『感情を聴けばよい』ではない。感情を入口に、単語以外の手掛かりへ注意を広げることが、Listeningの見え方を変えているのではないか。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="英語は「感情」から聴く"><meta name="twitter:description" content="英語を一語ずつ捕まえようとするより、話者の感情や意図を聴こうとした方が、かえって意味を拾いやすいことがある。この感覚を、prosody、speech segmentation、bottom-up / top-down processing、predictionの研究から検討する。結論は『感情を聴けばよい』ではない。感情を入口に、単語以外の手掛かりへ注意を広げることが、Listeningの見え方を変えているのではないか。"></head><body><main><article><h1>英語は「感情」から聴く</h1><p>英語を一語ずつ捕まえようとするより、話者の感情や意図を聴こうとした方が、かえって意味を拾いやすいことがある。この感覚を、prosody、speech segmentation、bottom-up / top-down processing、predictionの研究から検討する。結論は『感情を聴けばよい』ではない。感情を入口に、単語以外の手掛かりへ注意を広げることが、Listeningの見え方を変えているのではないか。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/listen-to-the-person-not-only-the-words?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/listen-to-the-person-not-only-the-words?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一人だけ入れ替える方が、全員入れ替えるより危ない――チームの記憶は「古い地図」になる</title><meta name="description" content="前作では、チームの記憶は『誰が何を知っているか』という索引まで含むと考えた。では、その誰かが入れ替わったら何が起きるのか。研究には、一人だけメンバーを替えたチームが、全員を入れ替えたチームより悪い成績を示した例がある。問題は知識が消えることだけではない。古い索引が残り、存在しない専門性へ問い合わせ続けることだ。メンバー交代、通信ネットワーク、ルーティン、Bus Factorの研究をたどりながら、引き継ぎを『情報のコピー』ではなく『検索経路の再配線』として考え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/transactive-memory-stale-map-turnover.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/transactive-memory-stale-map-turnover.html"><meta property="og:title" content="一人だけ入れ替える方が、全員入れ替えるより危ない――チームの記憶は「古い地図」になる"><meta property="og:description" content="前作では、チームの記憶は『誰が何を知っているか』という索引まで含むと考えた。では、その誰かが入れ替わったら何が起きるのか。研究には、一人だけメンバーを替えたチームが、全員を入れ替えたチームより悪い成績を示した例がある。問題は知識が消えることだけではない。古い索引が残り、存在しない専門性へ問い合わせ続けることだ。メンバー交代、通信ネットワーク、ルーティン、Bus Factorの研究をたどりながら、引き継ぎを『情報のコピー』ではなく『検索経路の再配線』として考え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="一人だけ入れ替える方が、全員入れ替えるより危ない――チームの記憶は「古い地図」になる"><meta name="twitter:description" content="前作では、チームの記憶は『誰が何を知っているか』という索引まで含むと考えた。では、その誰かが入れ替わったら何が起きるのか。研究には、一人だけメンバーを替えたチームが、全員を入れ替えたチームより悪い成績を示した例がある。問題は知識が消えることだけではない。古い索引が残り、存在しない専門性へ問い合わせ続けることだ。メンバー交代、通信ネットワーク、ルーティン、Bus Factorの研究をたどりながら、引き継ぎを『情報のコピー』ではなく『検索経路の再配線』として考え直す。"></head><body><main><article><h1>一人だけ入れ替える方が、全員入れ替えるより危ない――チームの記憶は「古い地図」になる</h1><p>前作では、チームの記憶は『誰が何を知っているか』という索引まで含むと考えた。では、その誰かが入れ替わったら何が起きるのか。研究には、一人だけメンバーを替えたチームが、全員を入れ替えたチームより悪い成績を示した例がある。問題は知識が消えることだけではない。古い索引が残り、存在しない専門性へ問い合わせ続けることだ。メンバー交代、通信ネットワーク、ルーティン、Bus Factorの研究をたどりながら、引き継ぎを『情報のコピー』ではなく『検索経路の再配線』として考え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/transactive-memory-stale-map-turnover?lang=ja">My Essaysで本文を読む</a></p></article></main><script>l

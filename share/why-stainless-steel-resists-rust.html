<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鉄はなぜ錆びるのに、ステンレスは錆びにくい？――表面で起きる小さな防御反応</title><meta name="description" content="鉄は水と酸素にさらされると赤茶色に錆びるのに、ステンレス製のシンクやスプーンはなぜ錆びにくいのか。違いは『酸化するか、しないか』ではない。鉄の錆は内部を十分に守れない一方、ステンレスはクロムを含むことで表面に非常に薄い不動態皮膜を形成し、その先の腐食を大幅に抑える。本稿では、鉄の腐食を小さな電池として捉え、電子移動、水と酸素の役割、クロムによる不動態化、傷からの再不動態化、塩化物による孔食まで、日用品の金属を材料科学の視点から読み解く。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/why-stainless-steel-resists-rust.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/why-stainless-steel-resists-rust.html"><meta property="og:title" content="鉄はなぜ錆びるのに、ステンレスは錆びにくい？――表面で起きる小さな防御反応"><meta property="og:description" content="鉄は水と酸素にさらされると赤茶色に錆びるのに、ステンレス製のシンクやスプーンはなぜ錆びにくいのか。違いは『酸化するか、しないか』ではない。鉄の錆は内部を十分に守れない一方、ステンレスはクロムを含むことで表面に非常に薄い不動態皮膜を形成し、その先の腐食を大幅に抑える。本稿では、鉄の腐食を小さな電池として捉え、電子移動、水と酸素の役割、クロムによる不動態化、傷からの再不動態化、塩化物による孔食まで、日用品の金属を材料科学の視点から読み解く。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="鉄はなぜ錆びるのに、ステンレスは錆びにくい？――表面で起きる小さな防御反応"><meta name="twitter:description" content="鉄は水と酸素にさらされると赤茶色に錆びるのに、ステンレス製のシンクやスプーンはなぜ錆びにくいのか。違いは『酸化するか、しないか』ではない。鉄の錆は内部を十分に守れない一方、ステンレスはクロムを含むことで表面に非常に薄い不動態皮膜を形成し、その先の腐食を大幅に抑える。本稿では、鉄の腐食を小さな電池として捉え、電子移動、水と酸素の役割、クロムによる不動態化、傷からの再不動態化、塩化物による孔食まで、日用品の金属を材料科学の視点から読み解く。"></head><body><main><article><h1>鉄はなぜ錆びるのに、ステンレスは錆びにくい？――表面で起きる小さな防御反応</h1><p>鉄は水と酸素にさらされると赤茶色に錆びるのに、ステンレス製のシンクやスプーンはなぜ錆びにくいのか。違いは『酸化するか、しないか』ではない。鉄の錆は内部を十分に守れない一方、ステンレスはクロムを含むことで表面に非常に薄い不動態皮膜を形成し、その先の腐食を大幅に抑える。本稿では、鉄の腐食を小さな電池として捉え、電子移動、水と酸素の役割、クロムによる不動態化、傷からの再不動態化、塩化物による孔食まで、日用品の金属を材料科学の視点から読み解く。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/why-stainless-steel-resists-rust?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/why-stainless-steel-resists-

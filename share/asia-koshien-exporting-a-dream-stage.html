<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「甲子園をアジアへ輸出する」とは、何を運ぶことなのか</title><meta name="description" content="アジア甲子園は、甲子園球場で開くアジア選手権ではない。2024年にジャカルタで始まり、甲子園が日本で持つ「目指す舞台」の機能をアジアでつくろうとする大会である。8チームから14チームへ広がった現在地、応援や礼まで含む文化移転、現地化と収益の課題、そして植民地期にまで遡る甲子園とアジアの複雑な歴史を追うと、問うべきは日本への忠実さではなく、現地で誰の大会として育つかだと見えてくる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/asia-koshien-exporting-a-dream-stage.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/asia-koshien-exporting-a-dream-stage.html"><meta property="og:title" content="「甲子園をアジアへ輸出する」とは、何を運ぶことなのか"><meta property="og:description" content="アジア甲子園は、甲子園球場で開くアジア選手権ではない。2024年にジャカルタで始まり、甲子園が日本で持つ「目指す舞台」の機能をアジアでつくろうとする大会である。8チームから14チームへ広がった現在地、応援や礼まで含む文化移転、現地化と収益の課題、そして植民地期にまで遡る甲子園とアジアの複雑な歴史を追うと、問うべきは日本への忠実さではなく、現地で誰の大会として育つかだと見えてくる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「甲子園をアジアへ輸出する」とは、何を運ぶことなのか"><meta name="twitter:description" content="アジア甲子園は、甲子園球場で開くアジア選手権ではない。2024年にジャカルタで始まり、甲子園が日本で持つ「目指す舞台」の機能をアジアでつくろうとする大会である。8チームから14チームへ広がった現在地、応援や礼まで含む文化移転、現地化と収益の課題、そして植民地期にまで遡る甲子園とアジアの複雑な歴史を追うと、問うべきは日本への忠実さではなく、現地で誰の大会として育つかだと見えてくる。"></head><body><main><article><h1>「甲子園をアジアへ輸出する」とは、何を運ぶことなのか</h1><p>アジア甲子園は、甲子園球場で開くアジア選手権ではない。2024年にジャカルタで始まり、甲子園が日本で持つ「目指す舞台」の機能をアジアでつくろうとする大会である。8チームから14チームへ広がった現在地、応援や礼まで含む文化移転、現地化と収益の課題、そして植民地期にまで遡る甲子園とアジアの複雑な歴史を追うと、問うべきは日本への忠実さではなく、現地で誰の大会として育つかだと見えてくる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/asia-koshien-exporting-a-dream-stage?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/asia-koshien-exporting-a-dream-stage?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSONはなぜ世界共通語になったのか――小さな仕様の歴史</title><meta name="description" content="APIや設定ファイルで当たり前のように使うJSONは、巨大な標準化プロジェクトとして始まったわけではない。JavaScriptの中にすでにあった記法をデータ交換に使えると『発見』し、利用が広がった後にRFCやECMA標準が現実の相互運用問題を吸収していった。JSONの歴史と現在の仕様をたどりながら、『少なく決めること』がなぜ強い設計になりうるのかを考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/json-history-small-spec-common-language.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/json-history-small-spec-common-language.html"><meta property="og:title" content="JSONはなぜ世界共通語になったのか――小さな仕様の歴史"><meta property="og:description" content="APIや設定ファイルで当たり前のように使うJSONは、巨大な標準化プロジェクトとして始まったわけではない。JavaScriptの中にすでにあった記法をデータ交換に使えると『発見』し、利用が広がった後にRFCやECMA標準が現実の相互運用問題を吸収していった。JSONの歴史と現在の仕様をたどりながら、『少なく決めること』がなぜ強い設計になりうるのかを考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="JSONはなぜ世界共通語になったのか――小さな仕様の歴史"><meta name="twitter:description" content="APIや設定ファイルで当たり前のように使うJSONは、巨大な標準化プロジェクトとして始まったわけではない。JavaScriptの中にすでにあった記法をデータ交換に使えると『発見』し、利用が広がった後にRFCやECMA標準が現実の相互運用問題を吸収していった。JSONの歴史と現在の仕様をたどりながら、『少なく決めること』がなぜ強い設計になりうるのかを考える。"></head><body><main><article><h1>JSONはなぜ世界共通語になったのか――小さな仕様の歴史</h1><p>APIや設定ファイルで当たり前のように使うJSONは、巨大な標準化プロジェクトとして始まったわけではない。JavaScriptの中にすでにあった記法をデータ交換に使えると『発見』し、利用が広がった後にRFCやECMA標準が現実の相互運用問題を吸収していった。JSONの歴史と現在の仕様をたどりながら、『少なく決めること』がなぜ強い設計になりうるのかを考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/json-history-small-spec-common-language?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/json-history-small-spec-common-language?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会議は「全員が知っていること」ほど長く話す――重要情報が一人の頭にあると、なぜ消えるのか</title><meta name="description" content="『誰が何を知っているか』の地図があっても、重要な知識が会議で口に出されるとは限らない。Hidden Profile研究では、集団は全員が知る共有情報を繰り返し、一人だけが持つ固有情報を取りこぼしやすい。1985年の模擬選挙、3,189グループのメタ分析、殺人事件課題の専門家役割実験まで辿り、会議を『意見交換』ではなく『希少情報を回収する装置』として考え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/transactive-memory-hidden-profile-common-information.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/transactive-memory-hidden-profile-common-information.html"><meta property="og:title" content="会議は「全員が知っていること」ほど長く話す――重要情報が一人の頭にあると、なぜ消えるのか"><meta property="og:description" content="『誰が何を知っているか』の地図があっても、重要な知識が会議で口に出されるとは限らない。Hidden Profile研究では、集団は全員が知る共有情報を繰り返し、一人だけが持つ固有情報を取りこぼしやすい。1985年の模擬選挙、3,189グループのメタ分析、殺人事件課題の専門家役割実験まで辿り、会議を『意見交換』ではなく『希少情報を回収する装置』として考え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="会議は「全員が知っていること」ほど長く話す――重要情報が一人の頭にあると、なぜ消えるのか"><meta name="twitter:description" content="『誰が何を知っているか』の地図があっても、重要な知識が会議で口に出されるとは限らない。Hidden Profile研究では、集団は全員が知る共有情報を繰り返し、一人だけが持つ固有情報を取りこぼしやすい。1985年の模擬選挙、3,189グループのメタ分析、殺人事件課題の専門家役割実験まで辿り、会議を『意見交換』ではなく『希少情報を回収する装置』として考え直す。"></head><body><main><article><h1>会議は「全員が知っていること」ほど長く話す――重要情報が一人の頭にあると、なぜ消えるのか</h1><p>『誰が何を知っているか』の地図があっても、重要な知識が会議で口に出されるとは限らない。Hidden Profile研究では、集団は全員が知る共有情報を繰り返し、一人だけが持つ固有情報を取りこぼしやすい。1985年の模擬選挙、3,189グループのメタ分析、殺人事件課題の専門家役割実験まで辿り、会議を『意見交換』ではなく『希少情報を回収する装置』として考え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/transactive-memory-hidden-profile-common-information?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/transactive-memory-hidden-profile-common-information?lang=ja");</script></body></html>

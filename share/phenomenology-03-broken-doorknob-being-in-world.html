<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>壊れたドアノブだけが、急に「物」になる</title><meta name="description" content="家を出ようとしてドアノブを回す。普段は金属の物体として観察していないのに、壊れた瞬間だけ形・ネジ・抵抗が猛烈に気になり始める。ハイデガーの『世界内存在』と道具分析を手がかりに、私たちがまず孤立した物体を眺め、その後で用途を付け足しているのではなく、実践・目的・他者との関係の網の目の中で世界に出会っていることを考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/phenomenology-03-broken-doorknob-being-in-world.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/phenomenology-03-broken-doorknob-being-in-world.html"><meta property="og:title" content="壊れたドアノブだけが、急に「物」になる"><meta property="og:description" content="家を出ようとしてドアノブを回す。普段は金属の物体として観察していないのに、壊れた瞬間だけ形・ネジ・抵抗が猛烈に気になり始める。ハイデガーの『世界内存在』と道具分析を手がかりに、私たちがまず孤立した物体を眺め、その後で用途を付け足しているのではなく、実践・目的・他者との関係の網の目の中で世界に出会っていることを考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="壊れたドアノブだけが、急に「物」になる"><meta name="twitter:description" content="家を出ようとしてドアノブを回す。普段は金属の物体として観察していないのに、壊れた瞬間だけ形・ネジ・抵抗が猛烈に気になり始める。ハイデガーの『世界内存在』と道具分析を手がかりに、私たちがまず孤立した物体を眺め、その後で用途を付け足しているのではなく、実践・目的・他者との関係の網の目の中で世界に出会っていることを考える。"></head><body><main><article><h1>壊れたドアノブだけが、急に「物」になる</h1><p>家を出ようとしてドアノブを回す。普段は金属の物体として観察していないのに、壊れた瞬間だけ形・ネジ・抵抗が猛烈に気になり始める。ハイデガーの『世界内存在』と道具分析を手がかりに、私たちがまず孤立した物体を眺め、その後で用途を付け足しているのではなく、実践・目的・他者との関係の網の目の中で世界に出会っていることを考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/phenomenology-03-broken-doorknob-being-in-world?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/phenomenology-03-broken-doorknob-being-in-world?lang=ja");</script></body></html>

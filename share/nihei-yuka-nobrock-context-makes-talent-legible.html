<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二瓶有加の転機は、「素が出た」ことより「素が仕事として読まれた」ことにある</title><meta name="description" content="二瓶有加は、なぜ「佐久間宣行のノブロックTV（NOBROCK TV）」で繰り返し起用される存在になったのか。2023年の初出演で偶然こぼれた笑いだけを見れば、「素が出て売れた」という話に見える。しかし、その前にはアイドル、舞台、動画制作の蓄積があり、その後には観察と再現を使う「飲み会ノリ」、さらにドローミー（DRAW♡ME）での歌唱へと役割が広がっている。本稿は、人物の本質を決めつけるのではなく、環境が既存の能力を読める形に変える過程として、その転機を追う。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/nihei-yuka-nobrock-context-makes-talent-legible.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/nihei-yuka-nobrock-context-makes-talent-legible.html"><meta property="og:title" content="二瓶有加の転機は、「素が出た」ことより「素が仕事として読まれた」ことにある"><meta property="og:description" content="二瓶有加は、なぜ「佐久間宣行のノブロックTV（NOBROCK TV）」で繰り返し起用される存在になったのか。2023年の初出演で偶然こぼれた笑いだけを見れば、「素が出て売れた」という話に見える。しかし、その前にはアイドル、舞台、動画制作の蓄積があり、その後には観察と再現を使う「飲み会ノリ」、さらにドローミー（DRAW♡ME）での歌唱へと役割が広がっている。本稿は、人物の本質を決めつけるのではなく、環境が既存の能力を読める形に変える過程として、その転機を追う。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="二瓶有加の転機は、「素が出た」ことより「素が仕事として読まれた」ことにある"><meta name="twitter:description" content="二瓶有加は、なぜ「佐久間宣行のノブロックTV（NOBROCK TV）」で繰り返し起用される存在になったのか。2023年の初出演で偶然こぼれた笑いだけを見れば、「素が出て売れた」という話に見える。しかし、その前にはアイドル、舞台、動画制作の蓄積があり、その後には観察と再現を使う「飲み会ノリ」、さらにドローミー（DRAW♡ME）での歌唱へと役割が広がっている。本稿は、人物の本質を決めつけるのではなく、環境が既存の能力を読める形に変える過程として、その転機を追う。"></head><body><main><article><h1>二瓶有加の転機は、「素が出た」ことより「素が仕事として読まれた」ことにある</h1><p>二瓶有加は、なぜ「佐久間宣行のノブロックTV（NOBROCK TV）」で繰り返し起用される存在になったのか。2023年の初出演で偶然こぼれた笑いだけを見れば、「素が出て売れた」という話に見える。しかし、その前にはアイドル、舞台、動画制作の蓄積があり、その後には観察と再現を使う「飲み会ノリ」、さらにドローミー（DRAW♡ME）での歌唱へと役割が広がっている。本稿は、人物の本質を決めつけるのではなく、環境が既存の能力を読める形に変える過程として、その転機を追う。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/nihei-yuka-nobrock-context-makes-talent-legible?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/nihei-yuka-nobrock-context-makes-talent-legible?lang=ja");</script></body></html>

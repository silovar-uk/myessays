<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Similarity――『見た目を揃える』目的は、意味を予測可能にすること</title><meta name="description" content="Gestalt心理学のSimilarity（類同）を、単なる『見た目の統一』ではなく、離れた要素にも共通の意味や役割を予測させるVisual Languageの基礎として捉える。Wertheimerの1923年の議論と現代UIへの応用を事実と解釈に分け、WCAGのUse of Color、Proximity、Consistency、Design Systemへ接続する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-similarity-predictable-meaning.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-similarity-predictable-meaning.html"><meta property="og:title" content="Similarity――『見た目を揃える』目的は、意味を予測可能にすること"><meta property="og:description" content="Gestalt心理学のSimilarity（類同）を、単なる『見た目の統一』ではなく、離れた要素にも共通の意味や役割を予測させるVisual Languageの基礎として捉える。Wertheimerの1923年の議論と現代UIへの応用を事実と解釈に分け、WCAGのUse of Color、Proximity、Consistency、Design Systemへ接続する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Similarity――『見た目を揃える』目的は、意味を予測可能にすること"><meta name="twitter:description" content="Gestalt心理学のSimilarity（類同）を、単なる『見た目の統一』ではなく、離れた要素にも共通の意味や役割を予測させるVisual Languageの基礎として捉える。Wertheimerの1923年の議論と現代UIへの応用を事実と解釈に分け、WCAGのUse of Color、Proximity、Consistency、Design Systemへ接続する。"></head><body><main><article><h1>Similarity――『見た目を揃える』目的は、意味を予測可能にすること</h1><p>Gestalt心理学のSimilarity（類同）を、単なる『見た目の統一』ではなく、離れた要素にも共通の意味や役割を予測させるVisual Languageの基礎として捉える。Wertheimerの1923年の議論と現代UIへの応用を事実と解釈に分け、WCAGのUse of Color、Proximity、Consistency、Design Systemへ接続する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-similarity-predictable-meaning?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-similarity-predictable-meaning?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浦和が鹿島のホームでリーグ戦に勝ったのは、2016年7月23日以来だった。</title><meta name="description" content="2026年9月6日、浦和は鹿島のホームで1-0の勝利を収めた。対鹿島の勝利は2021年4月3日以来。チャンピオンシップを除けば、鹿島のホームでのリーグ戦勝利は2016年7月23日以来だった。李忠成の2得点で逆転したあの日、コロナ禍の2021年、そして今日。数字だけでは分からない『久しぶり』の長さを、当時の景色ごとたどる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/urawa-kashima-long-way-back-2016.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/urawa-kashima-long-way-back-2016.html"><meta property="og:title" content="浦和が鹿島のホームでリーグ戦に勝ったのは、2016年7月23日以来だった。"><meta property="og:description" content="2026年9月6日、浦和は鹿島のホームで1-0の勝利を収めた。対鹿島の勝利は2021年4月3日以来。チャンピオンシップを除けば、鹿島のホームでのリーグ戦勝利は2016年7月23日以来だった。李忠成の2得点で逆転したあの日、コロナ禍の2021年、そして今日。数字だけでは分からない『久しぶり』の長さを、当時の景色ごとたどる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="浦和が鹿島のホームでリーグ戦に勝ったのは、2016年7月23日以来だった。"><meta name="twitter:description" content="2026年9月6日、浦和は鹿島のホームで1-0の勝利を収めた。対鹿島の勝利は2021年4月3日以来。チャンピオンシップを除けば、鹿島のホームでのリーグ戦勝利は2016年7月23日以来だった。李忠成の2得点で逆転したあの日、コロナ禍の2021年、そして今日。数字だけでは分からない『久しぶり』の長さを、当時の景色ごとたどる。"></head><body><main><article><h1>浦和が鹿島のホームでリーグ戦に勝ったのは、2016年7月23日以来だった。</h1><p>2026年9月6日、浦和は鹿島のホームで1-0の勝利を収めた。対鹿島の勝利は2021年4月3日以来。チャンピオンシップを除けば、鹿島のホームでのリーグ戦勝利は2016年7月23日以来だった。李忠成の2得点で逆転したあの日、コロナ禍の2021年、そして今日。数字だけでは分からない『久しぶり』の長さを、当時の景色ごとたどる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/urawa-kashima-long-way-back-2016?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/urawa-kashima-long-way-back-2016?lang=ja");</script></body></html>

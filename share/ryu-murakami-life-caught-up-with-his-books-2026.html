<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>村上龍は、人生を先に読んでいた――言葉が残り、作家が去る</title><meta name="description" content="2026年10月17日、作家・村上龍が亡くなった。十代に読んだ小説が、大人になって遭遇する現実の予備知識になるのはなぜか。読者の心に残った十五の言葉を六つの軸に整理し、清潔と誇り、復讐と楽しさ、美と残酷さ、自己責任と無力の矛盾を検討する。『心はあなたのもとに』と患者支援の事実を手がかりに、文学と人生の時間差を読み解く。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/ryu-murakami-life-caught-up-with-his-books-2026.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/ryu-murakami-life-caught-up-with-his-books-2026.html"><meta property="og:title" content="村上龍は、人生を先に読んでいた――言葉が残り、作家が去る"><meta property="og:description" content="2026年10月17日、作家・村上龍が亡くなった。十代に読んだ小説が、大人になって遭遇する現実の予備知識になるのはなぜか。読者の心に残った十五の言葉を六つの軸に整理し、清潔と誇り、復讐と楽しさ、美と残酷さ、自己責任と無力の矛盾を検討する。『心はあなたのもとに』と患者支援の事実を手がかりに、文学と人生の時間差を読み解く。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="村上龍は、人生を先に読んでいた――言葉が残り、作家が去る"><meta name="twitter:description" content="2026年10月17日、作家・村上龍が亡くなった。十代に読んだ小説が、大人になって遭遇する現実の予備知識になるのはなぜか。読者の心に残った十五の言葉を六つの軸に整理し、清潔と誇り、復讐と楽しさ、美と残酷さ、自己責任と無力の矛盾を検討する。『心はあなたのもとに』と患者支援の事実を手がかりに、文学と人生の時間差を読み解く。"></head><body><main><article><h1>村上龍は、人生を先に読んでいた――言葉が残り、作家が去る</h1><p>2026年10月17日、作家・村上龍が亡くなった。十代に読んだ小説が、大人になって遭遇する現実の予備知識になるのはなぜか。読者の心に残った十五の言葉を六つの軸に整理し、清潔と誇り、復讐と楽しさ、美と残酷さ、自己責任と無力の矛盾を検討する。『心はあなたのもとに』と患者支援の事実を手がかりに、文学と人生の時間差を読み解く。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/ryu-murakami-life-caught-up-with-his-books-2026?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/ryu-murakami-life-caught-up-with-his-books-2026?lang=ja");</script></body></html>

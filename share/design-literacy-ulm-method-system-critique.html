<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ulm School――デザインを『完成品』ではなく『判断の仕組み』として見る</title><meta name="description" content="HfG Ulm（ウルム造形大学）を、単純な『合理主義の学校』としてではなく、デザインを個別造形から再現可能な方法・関係・判断へ広げつつ、その方法化そのものも内部で批判的に問い直した教育実験として捉える。五つの専門領域、理論と実技の統合、1960年代の科学化をめぐる論争、Otl Aicher率いるE5によるLufthansaの体系的ビジュアル・アイデンティティを手掛かりに、現代のDesign Systemへ接続する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-ulm-method-system-critique.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-ulm-method-system-critique.html"><meta property="og:title" content="Ulm School――デザインを『完成品』ではなく『判断の仕組み』として見る"><meta property="og:description" content="HfG Ulm（ウルム造形大学）を、単純な『合理主義の学校』としてではなく、デザインを個別造形から再現可能な方法・関係・判断へ広げつつ、その方法化そのものも内部で批判的に問い直した教育実験として捉える。五つの専門領域、理論と実技の統合、1960年代の科学化をめぐる論争、Otl Aicher率いるE5によるLufthansaの体系的ビジュアル・アイデンティティを手掛かりに、現代のDesign Systemへ接続する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Ulm School――デザインを『完成品』ではなく『判断の仕組み』として見る"><meta name="twitter:description" content="HfG Ulm（ウルム造形大学）を、単純な『合理主義の学校』としてではなく、デザインを個別造形から再現可能な方法・関係・判断へ広げつつ、その方法化そのものも内部で批判的に問い直した教育実験として捉える。五つの専門領域、理論と実技の統合、1960年代の科学化をめぐる論争、Otl Aicher率いるE5によるLufthansaの体系的ビジュアル・アイデンティティを手掛かりに、現代のDesign Systemへ接続する。"></head><body><main><article><h1>Ulm School――デザインを『完成品』ではなく『判断の仕組み』として見る</h1><p>HfG Ulm（ウルム造形大学）を、単純な『合理主義の学校』としてではなく、デザインを個別造形から再現可能な方法・関係・判断へ広げつつ、その方法化そのものも内部で批判的に問い直した教育実験として捉える。五つの専門領域、理論と実技の統合、1960年代の科学化をめぐる論争、Otl Aicher率いるE5によるLufthansaの体系的ビジュアル・アイデンティティを手掛かりに、現代のDesign Systemへ接続する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-ulm-method-system-critique?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-ulm-method-system-

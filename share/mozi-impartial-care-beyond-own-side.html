<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自分たちだけ得をすればいい、では秩序は壊れる――墨子「天下兼相愛則治」</title><meta name="description" content="『墨子』「兼愛上」の「天下兼相愛則治，交相惡則亂」を入口に、自分・自家・自国だけを利して他者を害する構造を墨子がどう問題にしたかを読む。「兼愛＝全員を同じくらい好きになる」と単純化せず、現代の仕事では、自部署の便利さによって相手側へ移ったコストまで見るための補助線として考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/mozi-impartial-care-beyond-own-side.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/mozi-impartial-care-beyond-own-side.html"><meta property="og:title" content="自分たちだけ得をすればいい、では秩序は壊れる――墨子「天下兼相愛則治」"><meta property="og:description" content="『墨子』「兼愛上」の「天下兼相愛則治，交相惡則亂」を入口に、自分・自家・自国だけを利して他者を害する構造を墨子がどう問題にしたかを読む。「兼愛＝全員を同じくらい好きになる」と単純化せず、現代の仕事では、自部署の便利さによって相手側へ移ったコストまで見るための補助線として考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="自分たちだけ得をすればいい、では秩序は壊れる――墨子「天下兼相愛則治」"><meta name="twitter:description" content="『墨子』「兼愛上」の「天下兼相愛則治，交相惡則亂」を入口に、自分・自家・自国だけを利して他者を害する構造を墨子がどう問題にしたかを読む。「兼愛＝全員を同じくらい好きになる」と単純化せず、現代の仕事では、自部署の便利さによって相手側へ移ったコストまで見るための補助線として考える。"></head><body><main><article><h1>自分たちだけ得をすればいい、では秩序は壊れる――墨子「天下兼相愛則治」</h1><p>『墨子』「兼愛上」の「天下兼相愛則治，交相惡則亂」を入口に、自分・自家・自国だけを利して他者を害する構造を墨子がどう問題にしたかを読む。「兼愛＝全員を同じくらい好きになる」と単純化せず、現代の仕事では、自部署の便利さによって相手側へ移ったコストまで見るための補助線として考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/mozi-impartial-care-beyond-own-side?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/mozi-impartial-care-beyond-own-side?lang=ja");</script></body></html>

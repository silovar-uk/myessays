<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「黒人」は差別語なのか――単語だけを裁くと見えなくなること</title><meta name="description" content="「ああ、あの背の高い黒人ね」という一言をきっかけに、「黒人」という語そのものに差別的な意味があるのかを考える。日本の地理教育研究、AP、APAの表現指針、人類学の人種概念を照合すると、語そのものを一律に差別語とするのも、語が中立だから問題はないとするのも粗い。重要なのは、語の辞書的意味と、誰をどんなカテゴリーで見るかという行為を分けて考えることだった。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/black-word-not-automatically-slur.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/black-word-not-automatically-slur.html"><meta property="og:title" content="「黒人」は差別語なのか――単語だけを裁くと見えなくなること"><meta property="og:description" content="「ああ、あの背の高い黒人ね」という一言をきっかけに、「黒人」という語そのものに差別的な意味があるのかを考える。日本の地理教育研究、AP、APAの表現指針、人類学の人種概念を照合すると、語そのものを一律に差別語とするのも、語が中立だから問題はないとするのも粗い。重要なのは、語の辞書的意味と、誰をどんなカテゴリーで見るかという行為を分けて考えることだった。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「黒人」は差別語なのか――単語だけを裁くと見えなくなること"><meta name="twitter:description" content="「ああ、あの背の高い黒人ね」という一言をきっかけに、「黒人」という語そのものに差別的な意味があるのかを考える。日本の地理教育研究、AP、APAの表現指針、人類学の人種概念を照合すると、語そのものを一律に差別語とするのも、語が中立だから問題はないとするのも粗い。重要なのは、語の辞書的意味と、誰をどんなカテゴリーで見るかという行為を分けて考えることだった。"></head><body><main><article><h1>「黒人」は差別語なのか――単語だけを裁くと見えなくなること</h1><p>「ああ、あの背の高い黒人ね」という一言をきっかけに、「黒人」という語そのものに差別的な意味があるのかを考える。日本の地理教育研究、AP、APAの表現指針、人類学の人種概念を照合すると、語そのものを一律に差別語とするのも、語が中立だから問題はないとするのも粗い。重要なのは、語の辞書的意味と、誰をどんなカテゴリーで見るかという行為を分けて考えることだった。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/black-word-not-automatically-slur?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/black-word-not-automatically-slur?lang=ja");</script></body></html>

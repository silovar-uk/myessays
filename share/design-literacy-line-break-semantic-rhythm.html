<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最後の1文字だけ次の行――改行は、ブラウザのミスなのか</title><meta name="description" content="スマホ幅を少し変えただけで、見出しの最後の1文字が次の行へ落ちる。これはブラウザの失敗なのか。日本語の禁則処理、soft wrap、CSSのtext-wrapを手がかりに、改行を『文字の折り返し』ではなく『意味の関係を見せる設計』として考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-line-break-semantic-rhythm.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-line-break-semantic-rhythm.html"><meta property="og:title" content="最後の1文字だけ次の行――改行は、ブラウザのミスなのか"><meta property="og:description" content="スマホ幅を少し変えただけで、見出しの最後の1文字が次の行へ落ちる。これはブラウザの失敗なのか。日本語の禁則処理、soft wrap、CSSのtext-wrapを手がかりに、改行を『文字の折り返し』ではなく『意味の関係を見せる設計』として考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="最後の1文字だけ次の行――改行は、ブラウザのミスなのか"><meta name="twitter:description" content="スマホ幅を少し変えただけで、見出しの最後の1文字が次の行へ落ちる。これはブラウザの失敗なのか。日本語の禁則処理、soft wrap、CSSのtext-wrapを手がかりに、改行を『文字の折り返し』ではなく『意味の関係を見せる設計』として考える。"></head><body><main><article><h1>最後の1文字だけ次の行――改行は、ブラウザのミスなのか</h1><p>スマホ幅を少し変えただけで、見出しの最後の1文字が次の行へ落ちる。これはブラウザの失敗なのか。日本語の禁則処理、soft wrap、CSSのtext-wrapを手がかりに、改行を『文字の折り返し』ではなく『意味の関係を見せる設計』として考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-line-break-semantic-rhythm?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-line-break-semantic-rhythm?lang=ja");</script></body></html>

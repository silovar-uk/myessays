<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部同じ青なのに、なぜ分かりにくいのか？</title><meta name="description" content="同じ青をリンク、見出し、選択状態、CTA、装飾に使うと、統一感はあるのに意味が読みにくくなる。Similarityの復習で終わらず、複数の意味が一つのvisual cueへ衝突する「cue collision」という実務上の診断へ進み、Wertheimer、WCAG、Don Normanのsignifierを往復しながら、色を装飾ではなく語彙として設計する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-cue-collision-semantic-overload.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-cue-collision-semantic-overload.html"><meta property="og:title" content="全部同じ青なのに、なぜ分かりにくいのか？"><meta property="og:description" content="同じ青をリンク、見出し、選択状態、CTA、装飾に使うと、統一感はあるのに意味が読みにくくなる。Similarityの復習で終わらず、複数の意味が一つのvisual cueへ衝突する「cue collision」という実務上の診断へ進み、Wertheimer、WCAG、Don Normanのsignifierを往復しながら、色を装飾ではなく語彙として設計する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="全部同じ青なのに、なぜ分かりにくいのか？"><meta name="twitter:description" content="同じ青をリンク、見出し、選択状態、CTA、装飾に使うと、統一感はあるのに意味が読みにくくなる。Similarityの復習で終わらず、複数の意味が一つのvisual cueへ衝突する「cue collision」という実務上の診断へ進み、Wertheimer、WCAG、Don Normanのsignifierを往復しながら、色を装飾ではなく語彙として設計する。"></head><body><main><article><h1>全部同じ青なのに、なぜ分かりにくいのか？</h1><p>同じ青をリンク、見出し、選択状態、CTA、装飾に使うと、統一感はあるのに意味が読みにくくなる。Similarityの復習で終わらず、複数の意味が一つのvisual cueへ衝突する「cue collision」という実務上の診断へ進み、Wertheimer、WCAG、Don Normanのsignifierを往復しながら、色を装飾ではなく語彙として設計する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-cue-collision-semantic-overload?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-cue-collision-semantic-overload?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知っているだけでは、まだ遠い――孔子「知之者不如好之者、好之者不如楽之者」</title><meta name="description" content="『論語』「雍也」の「知之者不如好之者、好之者不如楽之者」を、単なる『楽しいことだけやればいい』ではなく、学びの対象との関わり方の深まりとして読む。既存の「学而時習之」が理解を実践へ移す話だとすれば、今回は知る・好む・楽しむという関係の違いから、続けやすさを設計する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/confucius-knowing-liking-enjoying.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/confucius-knowing-liking-enjoying.html"><meta property="og:title" content="知っているだけでは、まだ遠い――孔子「知之者不如好之者、好之者不如楽之者」"><meta property="og:description" content="『論語』「雍也」の「知之者不如好之者、好之者不如楽之者」を、単なる『楽しいことだけやればいい』ではなく、学びの対象との関わり方の深まりとして読む。既存の「学而時習之」が理解を実践へ移す話だとすれば、今回は知る・好む・楽しむという関係の違いから、続けやすさを設計する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="知っているだけでは、まだ遠い――孔子「知之者不如好之者、好之者不如楽之者」"><meta name="twitter:description" content="『論語』「雍也」の「知之者不如好之者、好之者不如楽之者」を、単なる『楽しいことだけやればいい』ではなく、学びの対象との関わり方の深まりとして読む。既存の「学而時習之」が理解を実践へ移す話だとすれば、今回は知る・好む・楽しむという関係の違いから、続けやすさを設計する。"></head><body><main><article><h1>知っているだけでは、まだ遠い――孔子「知之者不如好之者、好之者不如楽之者」</h1><p>『論語』「雍也」の「知之者不如好之者、好之者不如楽之者」を、単なる『楽しいことだけやればいい』ではなく、学びの対象との関わり方の深まりとして読む。既存の「学而時習之」が理解を実践へ移す話だとすれば、今回は知る・好む・楽しむという関係の違いから、続けやすさを設計する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/confucius-knowing-liking-enjoying?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/confucius-knowing-liking-enjoying?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>『恋のフーガ』は、誰の曲なのか</title><meta name="description" content="1967年の『恋のフーガ』を作ったのは、のちに『ドラゴンクエスト』を担当するすぎやまこういち。しかし、あの印象的な前奏は宮川泰が作り、すぎやまは編曲者に印税を分けたという。しかも曲は厳密なフーガではなく、裏面には若き筒美京平がいた。作詞家の構想、双子の歌声、テレビ局と芸能事務所、著作権の仕組みまでさかのぼり、一つのヒット曲に何人の作者がいたのかを追う。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/koi-no-fugue-sugiyama-miyagawa-peanuts-1967.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/koi-no-fugue-sugiyama-miyagawa-peanuts-1967.html"><meta property="og:title" content="『恋のフーガ』は、誰の曲なのか"><meta property="og:description" content="1967年の『恋のフーガ』を作ったのは、のちに『ドラゴンクエスト』を担当するすぎやまこういち。しかし、あの印象的な前奏は宮川泰が作り、すぎやまは編曲者に印税を分けたという。しかも曲は厳密なフーガではなく、裏面には若き筒美京平がいた。作詞家の構想、双子の歌声、テレビ局と芸能事務所、著作権の仕組みまでさかのぼり、一つのヒット曲に何人の作者がいたのかを追う。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="『恋のフーガ』は、誰の曲なのか"><meta name="twitter:description" content="1967年の『恋のフーガ』を作ったのは、のちに『ドラゴンクエスト』を担当するすぎやまこういち。しかし、あの印象的な前奏は宮川泰が作り、すぎやまは編曲者に印税を分けたという。しかも曲は厳密なフーガではなく、裏面には若き筒美京平がいた。作詞家の構想、双子の歌声、テレビ局と芸能事務所、著作権の仕組みまでさかのぼり、一つのヒット曲に何人の作者がいたのかを追う。"></head><body><main><article><h1>『恋のフーガ』は、誰の曲なのか</h1><p>1967年の『恋のフーガ』を作ったのは、のちに『ドラゴンクエスト』を担当するすぎやまこういち。しかし、あの印象的な前奏は宮川泰が作り、すぎやまは編曲者に印税を分けたという。しかも曲は厳密なフーガではなく、裏面には若き筒美京平がいた。作詞家の構想、双子の歌声、テレビ局と芸能事務所、著作権の仕組みまでさかのぼり、一つのヒット曲に何人の作者がいたのかを追う。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/koi-no-fugue-sugiyama-miyagawa-peanuts-1967?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/koi-no-fugue-sugiyama-miyagawa-peanuts-1967?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リソソームは、細胞のゴミ箱ではない</title><meta name="description" content="リソソームはしばしば『細胞のゴミ処理場』と説明される。しかし実際には、タンパク質や脂質、糖、傷んだ細胞小器官を酸性環境で分解し、材料として細胞へ戻す循環拠点である。さらにオートファジーの最終工程を担い、mTORC1を介した栄養感知や成長制御にも関わる。発見の歴史から病気・老化との接点までたどり、『生命は作るだけでなく、壊し方によって維持される』という視点からリソソームを捉え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/lysosome-cellular-recycling-infrastructure.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/lysosome-cellular-recycling-infrastructure.html"><meta property="og:title" content="リソソームは、細胞のゴミ箱ではない"><meta property="og:description" content="リソソームはしばしば『細胞のゴミ処理場』と説明される。しかし実際には、タンパク質や脂質、糖、傷んだ細胞小器官を酸性環境で分解し、材料として細胞へ戻す循環拠点である。さらにオートファジーの最終工程を担い、mTORC1を介した栄養感知や成長制御にも関わる。発見の歴史から病気・老化との接点までたどり、『生命は作るだけでなく、壊し方によって維持される』という視点からリソソームを捉え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="リソソームは、細胞のゴミ箱ではない"><meta name="twitter:description" content="リソソームはしばしば『細胞のゴミ処理場』と説明される。しかし実際には、タンパク質や脂質、糖、傷んだ細胞小器官を酸性環境で分解し、材料として細胞へ戻す循環拠点である。さらにオートファジーの最終工程を担い、mTORC1を介した栄養感知や成長制御にも関わる。発見の歴史から病気・老化との接点までたどり、『生命は作るだけでなく、壊し方によって維持される』という視点からリソソームを捉え直す。"></head><body><main><article><h1>リソソームは、細胞のゴミ箱ではない</h1><p>リソソームはしばしば『細胞のゴミ処理場』と説明される。しかし実際には、タンパク質や脂質、糖、傷んだ細胞小器官を酸性環境で分解し、材料として細胞へ戻す循環拠点である。さらにオートファジーの最終工程を担い、mTORC1を介した栄養感知や成長制御にも関わる。発見の歴史から病気・老化との接点までたどり、『生命は作るだけでなく、壊し方によって維持される』という視点からリソソームを捉え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/lysosome-cellular-recycling-infrastructure?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/lysosome-cellular-recycling-infrastructure?lang=ja");</script></body></html>

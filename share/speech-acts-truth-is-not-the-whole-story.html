<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「嘘を嘘と見抜け」だけでは、言葉の半分しか見えていない</title><meta name="description" content="「嘘を嘘と見抜ける人でないと掲示板を使うのは難しい」。この有名な言葉は、情報の真偽を見分けるネットリテラシーとして今も有効である。ただし、ジョン・L・オースティンの言語行為論を通すと、もう一つの問いが現れる。言葉は本当か嘘かだけでなく、約束し、命じ、侮辱し、分類し、周囲の行動を変える。1994年ルワンダ虐殺の言語実践、RTLMの放送、リン・ティレルの研究をたどりながら、「それは本当か」と「それを言うことで何をしているか」を同時に見る読み方を考える。動画内の有名な発砲率の数字にも再検証をかける。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/speech-acts-truth-is-not-the-whole-story.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/speech-acts-truth-is-not-the-whole-story.html"><meta property="og:title" content="「嘘を嘘と見抜け」だけでは、言葉の半分しか見えていない"><meta property="og:description" content="「嘘を嘘と見抜ける人でないと掲示板を使うのは難しい」。この有名な言葉は、情報の真偽を見分けるネットリテラシーとして今も有効である。ただし、ジョン・L・オースティンの言語行為論を通すと、もう一つの問いが現れる。言葉は本当か嘘かだけでなく、約束し、命じ、侮辱し、分類し、周囲の行動を変える。1994年ルワンダ虐殺の言語実践、RTLMの放送、リン・ティレルの研究をたどりながら、「それは本当か」と「それを言うことで何をしているか」を同時に見る読み方を考える。動画内の有名な発砲率の数字にも再検証をかける。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「嘘を嘘と見抜け」だけでは、言葉の半分しか見えていない"><meta name="twitter:description" content="「嘘を嘘と見抜ける人でないと掲示板を使うのは難しい」。この有名な言葉は、情報の真偽を見分けるネットリテラシーとして今も有効である。ただし、ジョン・L・オースティンの言語行為論を通すと、もう一つの問いが現れる。言葉は本当か嘘かだけでなく、約束し、命じ、侮辱し、分類し、周囲の行動を変える。1994年ルワンダ虐殺の言語実践、RTLMの放送、リン・ティレルの研究をたどりながら、「それは本当か」と「それを言うことで何をしているか」を同時に見る読み方を考える。動画内の有名な発砲率の数字にも再検証をかける。"></head><body><main><article><h1>「嘘を嘘と見抜け」だけでは、言葉の半分しか見えていない</h1><p>「嘘を嘘と見抜ける人でないと掲示板を使うのは難しい」。この有名な言葉は、情報の真偽を見分けるネットリテラシーとして今も有効である。ただし、ジョン・L・オースティンの言語行為論を通すと、もう一つの問いが現れる。言葉は本当か嘘かだけでなく、約束し、命じ、侮辱し、分類し、周囲の行動を変える。1994年ルワンダ虐殺の言語実践、RTLMの放送、リン・ティレルの研究をたどりながら、「それは本当か」と「それを言うことで何をしているか」を同時に見る読み方を考える。動画内の有名な発砲率の数字にも再検証をかける。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/speech-acts-truth-is-not-the-whole-story?lang=ja">My Essaysで本文を読む</a></p></article></main>

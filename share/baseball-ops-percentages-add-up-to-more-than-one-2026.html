<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>野球の「率」を足すと1を超える――OPSは何を測り、何を見落とすのか</title><meta name="description" content="OPSは出塁率と長打率を足しただけの数字なのに、なぜ打者評価の共通語になったのか。そもそも長打率は確率ではなく、OPSは1を超えられる。2025年NPB公式記録で計算し、丸め誤差まで確かめる。発明者ピート・パーマーの回顧、同じOPSの仮想打者の比較、加重出塁率（wOBA）による反証を通じて、OPSの便利さと危うさを切り分ける。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/baseball-ops-percentages-add-up-to-more-than-one-2026.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/baseball-ops-percentages-add-up-to-more-than-one-2026.html"><meta property="og:title" content="野球の「率」を足すと1を超える――OPSは何を測り、何を見落とすのか"><meta property="og:description" content="OPSは出塁率と長打率を足しただけの数字なのに、なぜ打者評価の共通語になったのか。そもそも長打率は確率ではなく、OPSは1を超えられる。2025年NPB公式記録で計算し、丸め誤差まで確かめる。発明者ピート・パーマーの回顧、同じOPSの仮想打者の比較、加重出塁率（wOBA）による反証を通じて、OPSの便利さと危うさを切り分ける。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="野球の「率」を足すと1を超える――OPSは何を測り、何を見落とすのか"><meta name="twitter:description" content="OPSは出塁率と長打率を足しただけの数字なのに、なぜ打者評価の共通語になったのか。そもそも長打率は確率ではなく、OPSは1を超えられる。2025年NPB公式記録で計算し、丸め誤差まで確かめる。発明者ピート・パーマーの回顧、同じOPSの仮想打者の比較、加重出塁率（wOBA）による反証を通じて、OPSの便利さと危うさを切り分ける。"></head><body><main><article><h1>野球の「率」を足すと1を超える――OPSは何を測り、何を見落とすのか</h1><p>OPSは出塁率と長打率を足しただけの数字なのに、なぜ打者評価の共通語になったのか。そもそも長打率は確率ではなく、OPSは1を超えられる。2025年NPB公式記録で計算し、丸め誤差まで確かめる。発明者ピート・パーマーの回顧、同じOPSの仮想打者の比較、加重出塁率（wOBA）による反証を通じて、OPSの便利さと危うさを切り分ける。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/baseball-ops-percentages-add-up-to-more-than-one-2026?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/baseball-ops-percentages-add-up-to-more-than-one-2026?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飛び始めた瞬間には、ベク変はもう終わっている――スマブラSPのDIを1週間で身体に入れる</title><meta name="description" content="スマブラSPのベクトル変更は、飛ばされてから方向を選ぶ反射神経ゲームではない。DIはヒットストップ最終フレームで決まり、SDIは別の仕組み、さらにLSIがふっとび速度へ干渉する。『逆へ倒す』『上へ倒す』『コンボ中は外』という短縮ルールを一度壊し、ダックハントのWeight 86と復帰特性まで含めて、低％＝次の一発から離れる／高％＝撃墜ラインから逃げる／多段＝座標をずらす、という3つの判断へ再構成する。最後に1日15分・7日間の練習メニューを付けた。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/smash-ultimate-di-before-launch.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/smash-ultimate-di-before-launch.html"><meta property="og:title" content="飛び始めた瞬間には、ベク変はもう終わっている――スマブラSPのDIを1週間で身体に入れる"><meta property="og:description" content="スマブラSPのベクトル変更は、飛ばされてから方向を選ぶ反射神経ゲームではない。DIはヒットストップ最終フレームで決まり、SDIは別の仕組み、さらにLSIがふっとび速度へ干渉する。『逆へ倒す』『上へ倒す』『コンボ中は外』という短縮ルールを一度壊し、ダックハントのWeight 86と復帰特性まで含めて、低％＝次の一発から離れる／高％＝撃墜ラインから逃げる／多段＝座標をずらす、という3つの判断へ再構成する。最後に1日15分・7日間の練習メニューを付けた。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="飛び始めた瞬間には、ベク変はもう終わっている――スマブラSPのDIを1週間で身体に入れる"><meta name="twitter:description" content="スマブラSPのベクトル変更は、飛ばされてから方向を選ぶ反射神経ゲームではない。DIはヒットストップ最終フレームで決まり、SDIは別の仕組み、さらにLSIがふっとび速度へ干渉する。『逆へ倒す』『上へ倒す』『コンボ中は外』という短縮ルールを一度壊し、ダックハントのWeight 86と復帰特性まで含めて、低％＝次の一発から離れる／高％＝撃墜ラインから逃げる／多段＝座標をずらす、という3つの判断へ再構成する。最後に1日15分・7日間の練習メニューを付けた。"></head><body><main><article><h1>飛び始めた瞬間には、ベク変はもう終わっている――スマブラSPのDIを1週間で身体に入れる</h1><p>スマブラSPのベクトル変更は、飛ばされてから方向を選ぶ反射神経ゲームではない。DIはヒットストップ最終フレームで決まり、SDIは別の仕組み、さらにLSIがふっとび速度へ干渉する。『逆へ倒す』『上へ倒す』『コンボ中は外』という短縮ルールを一度壊し、ダックハントのWeight 86と復帰特性まで含めて、低％＝次の一発から離れる／高％＝撃墜ラインから逃げる／多段＝座標をずらす、という3つの判断へ再構成する。最後に1日15分・7日間の練習メニューを付けた。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/smash-ultimate-di-before-launch?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自分しか読めないメモを、どう作るか</title><meta name="description" content="自分だけが使う秘密のメモをWeb上に置くとき、ログイン画面を付けるだけでは十分ではない。本稿では、Cloudflare Accessを玄関、Workerを受付、D1を金庫、ブラウザ暗号化を封筒にたとえながら、第三者アクセス・認証迂回・DB流出という異なる事故を別々の防御で止める設計を、非エンジニア向けに一段ずつ整理する。D1作成、Wrangler、workers.dev、OTP、JWT検証、AES-GCM、PBKDF2まで、実際にPrivate Memoを構築した順番と、その順番である理由を追う。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/private-memo-cloudflare-zero-trust-e2ee.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/private-memo-cloudflare-zero-trust-e2ee.html"><meta property="og:title" content="自分しか読めないメモを、どう作るか"><meta property="og:description" content="自分だけが使う秘密のメモをWeb上に置くとき、ログイン画面を付けるだけでは十分ではない。本稿では、Cloudflare Accessを玄関、Workerを受付、D1を金庫、ブラウザ暗号化を封筒にたとえながら、第三者アクセス・認証迂回・DB流出という異なる事故を別々の防御で止める設計を、非エンジニア向けに一段ずつ整理する。D1作成、Wrangler、workers.dev、OTP、JWT検証、AES-GCM、PBKDF2まで、実際にPrivate Memoを構築した順番と、その順番である理由を追う。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="自分しか読めないメモを、どう作るか"><meta name="twitter:description" content="自分だけが使う秘密のメモをWeb上に置くとき、ログイン画面を付けるだけでは十分ではない。本稿では、Cloudflare Accessを玄関、Workerを受付、D1を金庫、ブラウザ暗号化を封筒にたとえながら、第三者アクセス・認証迂回・DB流出という異なる事故を別々の防御で止める設計を、非エンジニア向けに一段ずつ整理する。D1作成、Wrangler、workers.dev、OTP、JWT検証、AES-GCM、PBKDF2まで、実際にPrivate Memoを構築した順番と、その順番である理由を追う。"></head><body><main><article><h1>自分しか読めないメモを、どう作るか</h1><p>自分だけが使う秘密のメモをWeb上に置くとき、ログイン画面を付けるだけでは十分ではない。本稿では、Cloudflare Accessを玄関、Workerを受付、D1を金庫、ブラウザ暗号化を封筒にたとえながら、第三者アクセス・認証迂回・DB流出という異なる事故を別々の防御で止める設計を、非エンジニア向けに一段ずつ整理する。D1作成、Wrangler、workers.dev、OTP、JWT検証、AES-GCM、PBKDF2まで、実際にPrivate Memoを構築した順番と、その順番である理由を追う。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/private-memo-cloudflare-zero-trust-e2ee?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://s

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>草加は、せんべいだけじゃない――なぜレザーの街になったのか</title><meta name="description" content="草加といえば草加せんべい。けれど実は、草加は2024年に日本タンナーズ協会から『日本の4大皮革産地』の一つとして認定されたレザーの街でもある。なぜ草加に皮革産業が集まり、何が他産地と違うのか。豊かな水、東京との近さ、多様なタンナーと一貫生産、そして近年の再編集までを追う。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/soka-leather-industry-water-tokyo-reinvention.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/soka-leather-industry-water-tokyo-reinvention.html"><meta property="og:title" content="草加は、せんべいだけじゃない――なぜレザーの街になったのか"><meta property="og:description" content="草加といえば草加せんべい。けれど実は、草加は2024年に日本タンナーズ協会から『日本の4大皮革産地』の一つとして認定されたレザーの街でもある。なぜ草加に皮革産業が集まり、何が他産地と違うのか。豊かな水、東京との近さ、多様なタンナーと一貫生産、そして近年の再編集までを追う。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="草加は、せんべいだけじゃない――なぜレザーの街になったのか"><meta name="twitter:description" content="草加といえば草加せんべい。けれど実は、草加は2024年に日本タンナーズ協会から『日本の4大皮革産地』の一つとして認定されたレザーの街でもある。なぜ草加に皮革産業が集まり、何が他産地と違うのか。豊かな水、東京との近さ、多様なタンナーと一貫生産、そして近年の再編集までを追う。"></head><body><main><article><h1>草加は、せんべいだけじゃない――なぜレザーの街になったのか</h1><p>草加といえば草加せんべい。けれど実は、草加は2024年に日本タンナーズ協会から『日本の4大皮革産地』の一つとして認定されたレザーの街でもある。なぜ草加に皮革産業が集まり、何が他産地と違うのか。豊かな水、東京との近さ、多様なタンナーと一貫生産、そして近年の再編集までを追う。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/soka-leather-industry-water-tokyo-reinvention?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/soka-leather-industry-water-tokyo-reinvention?lang=ja");</script></body></html>

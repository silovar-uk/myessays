<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29 yearsだけでは足りない――工藤公康は何回reinventしたのか</title><meta name="description" content="工藤公康の現役生活は1982年から2010年まで実働29年、通算224 wins。けれどcareer statsを追うと、29年間ずっと同じpitcherだったわけではない。Ace starter、移籍先の柱、40代のstarter、46歳のreliever。大きな不調からのcomebackも何度もある。Longevityを『丈夫だったから』で終わらせず、身体管理とrole changeを含むreinventionの連続として読み直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/kimiyasu-kudo-01-29-years-reinvention.en.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/kimiyasu-kudo-01-29-years-reinvention.en.html"><meta property="og:title" content="29 yearsだけでは足りない――工藤公康は何回reinventしたのか"><meta property="og:description" content="工藤公康の現役生活は1982年から2010年まで実働29年、通算224 wins。けれどcareer statsを追うと、29年間ずっと同じpitcherだったわけではない。Ace starter、移籍先の柱、40代のstarter、46歳のreliever。大きな不調からのcomebackも何度もある。Longevityを『丈夫だったから』で終わらせず、身体管理とrole changeを含むreinventionの連続として読み直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="29 yearsだけでは足りない――工藤公康は何回reinventしたのか"><meta name="twitter:description" content="工藤公康の現役生活は1982年から2010年まで実働29年、通算224 wins。けれどcareer statsを追うと、29年間ずっと同じpitcherだったわけではない。Ace starter、移籍先の柱、40代のstarter、46歳のreliever。大きな不調からのcomebackも何度もある。Longevityを『丈夫だったから』で終わらせず、身体管理とrole changeを含むreinventionの連続として読み直す。"></head><body><main><article><h1>29 yearsだけでは足りない――工藤公康は何回reinventしたのか</h1><p>工藤公康の現役生活は1982年から2010年まで実働29年、通算224 wins。けれどcareer statsを追うと、29年間ずっと同じpitcherだったわけではない。Ace starter、移籍先の柱、40代のstarter、46歳のreliever。大きな不調からのcomebackも何度もある。Longevityを『丈夫だったから』で終わらせず、身体管理とrole changeを含むreinventionの連続として読み直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/kimiyasu-kudo-01-29-years-reinvention?lang=en">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/kimiyasu-kudo-01-29-years-reinvention?lang=en");</script></body></html>

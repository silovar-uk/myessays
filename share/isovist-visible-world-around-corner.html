<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>廊下の角を1m歩くと、見える世界が1.56倍になった――アイソビストを本気で調べる</title><meta name="description" content="L字廊下を単純な2Dモデルにすると、内角の1m手前で見える床面積は18㎡、角まで進むと28㎡。わずか1mで約1.56倍になった。この『ある地点から見える範囲』を図形として扱うのがアイソビストである。1967年のTandy、1979年のBenedikt、2001年のvisibility graph、知覚研究、3D化の限界まで追い、駅・スタジアム・店・オフィスの“見え方”を考え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/isovist-visible-world-around-corner.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/isovist-visible-world-around-corner.html"><meta property="og:title" content="廊下の角を1m歩くと、見える世界が1.56倍になった――アイソビストを本気で調べる"><meta property="og:description" content="L字廊下を単純な2Dモデルにすると、内角の1m手前で見える床面積は18㎡、角まで進むと28㎡。わずか1mで約1.56倍になった。この『ある地点から見える範囲』を図形として扱うのがアイソビストである。1967年のTandy、1979年のBenedikt、2001年のvisibility graph、知覚研究、3D化の限界まで追い、駅・スタジアム・店・オフィスの“見え方”を考え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="廊下の角を1m歩くと、見える世界が1.56倍になった――アイソビストを本気で調べる"><meta name="twitter:description" content="L字廊下を単純な2Dモデルにすると、内角の1m手前で見える床面積は18㎡、角まで進むと28㎡。わずか1mで約1.56倍になった。この『ある地点から見える範囲』を図形として扱うのがアイソビストである。1967年のTandy、1979年のBenedikt、2001年のvisibility graph、知覚研究、3D化の限界まで追い、駅・スタジアム・店・オフィスの“見え方”を考え直す。"></head><body><main><article><h1>廊下の角を1m歩くと、見える世界が1.56倍になった――アイソビストを本気で調べる</h1><p>L字廊下を単純な2Dモデルにすると、内角の1m手前で見える床面積は18㎡、角まで進むと28㎡。わずか1mで約1.56倍になった。この『ある地点から見える範囲』を図形として扱うのがアイソビストである。1967年のTandy、1979年のBenedikt、2001年のvisibility graph、知覚研究、3D化の限界まで追い、駅・スタジアム・店・オフィスの“見え方”を考え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/isovist-visible-world-around-corner?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/isovist-visible-world-around-corner?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自分の「普通」は、井戸の中だけかもしれない――荘子「井蛙不可以語於海」</title><meta name="description" content="『荘子』秋水篇の「井蛙不可以語於海者，拘於虛也」を入口に、私たちの経験や環境が「何を想像できるか」まで制約する可能性を考える。仕事での「普通」「無理」「前例がない」という判断を例に、自分の視点を疑うことと、判断停止に陥らないことの両方を考察する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/zhuangzi-well-frog-limited-perspective.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/zhuangzi-well-frog-limited-perspective.html"><meta property="og:title" content="自分の「普通」は、井戸の中だけかもしれない――荘子「井蛙不可以語於海」"><meta property="og:description" content="『荘子』秋水篇の「井蛙不可以語於海者，拘於虛也」を入口に、私たちの経験や環境が「何を想像できるか」まで制約する可能性を考える。仕事での「普通」「無理」「前例がない」という判断を例に、自分の視点を疑うことと、判断停止に陥らないことの両方を考察する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="自分の「普通」は、井戸の中だけかもしれない――荘子「井蛙不可以語於海」"><meta name="twitter:description" content="『荘子』秋水篇の「井蛙不可以語於海者，拘於虛也」を入口に、私たちの経験や環境が「何を想像できるか」まで制約する可能性を考える。仕事での「普通」「無理」「前例がない」という判断を例に、自分の視点を疑うことと、判断停止に陥らないことの両方を考察する。"></head><body><main><article><h1>自分の「普通」は、井戸の中だけかもしれない――荘子「井蛙不可以語於海」</h1><p>『荘子』秋水篇の「井蛙不可以語於海者，拘於虛也」を入口に、私たちの経験や環境が「何を想像できるか」まで制約する可能性を考える。仕事での「普通」「無理」「前例がない」という判断を例に、自分の視点を疑うことと、判断停止に陥らないことの両方を考察する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/zhuangzi-well-frog-limited-perspective?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/zhuangzi-well-frog-limited-perspective?lang=ja");</script></body></html>

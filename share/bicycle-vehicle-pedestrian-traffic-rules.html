<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自転車は車なのか、歩行者なのか――「いま進んでいい？」を交通ルールで整理する</title><meta name="description" content="自転車に乗っていると、車として進むべきなのか、歩行者として動くべきなのか分からなくなることがある。結論から言えば、自転車は乗っている限り原則として車両で、押して歩けば原則として歩行者になる。ただし普通自転車には歩道通行の例外があり、従う信号も走行位置によって変わる。本稿では、車道・歩道・横断歩道・交差点という『境界』に注目し、いま自分がどのルールで動くのかを判断できる形に整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/bicycle-vehicle-pedestrian-traffic-rules.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/bicycle-vehicle-pedestrian-traffic-rules.html"><meta property="og:title" content="自転車は車なのか、歩行者なのか――「いま進んでいい？」を交通ルールで整理する"><meta property="og:description" content="自転車に乗っていると、車として進むべきなのか、歩行者として動くべきなのか分からなくなることがある。結論から言えば、自転車は乗っている限り原則として車両で、押して歩けば原則として歩行者になる。ただし普通自転車には歩道通行の例外があり、従う信号も走行位置によって変わる。本稿では、車道・歩道・横断歩道・交差点という『境界』に注目し、いま自分がどのルールで動くのかを判断できる形に整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="自転車は車なのか、歩行者なのか――「いま進んでいい？」を交通ルールで整理する"><meta name="twitter:description" content="自転車に乗っていると、車として進むべきなのか、歩行者として動くべきなのか分からなくなることがある。結論から言えば、自転車は乗っている限り原則として車両で、押して歩けば原則として歩行者になる。ただし普通自転車には歩道通行の例外があり、従う信号も走行位置によって変わる。本稿では、車道・歩道・横断歩道・交差点という『境界』に注目し、いま自分がどのルールで動くのかを判断できる形に整理する。"></head><body><main><article><h1>自転車は車なのか、歩行者なのか――「いま進んでいい？」を交通ルールで整理する</h1><p>自転車に乗っていると、車として進むべきなのか、歩行者として動くべきなのか分からなくなることがある。結論から言えば、自転車は乗っている限り原則として車両で、押して歩けば原則として歩行者になる。ただし普通自転車には歩道通行の例外があり、従う信号も走行位置によって変わる。本稿では、車道・歩道・横断歩道・交差点という『境界』に注目し、いま自分がどのルールで動くのかを判断できる形に整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/bicycle-vehicle-pedestrian-traffic-rules?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/bicycle-vehicle-pedestrian-traffic-rules?lang=ja");</script></body></html>

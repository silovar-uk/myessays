<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>position.x = 2。で、誰から見て2？ Three.jsのScene Graphは『小さな世界』を入れ子にする</title><meta name="description" content="Three.jsのchild.position.xを2にした。なのに親を動かしたり拡大したりすると、子のworld positionは別の数字になる。親を3倍にすると子との距離まで3倍になる実験と、add() / attach()で親を付け替える実験を通して、Scene Graphを『物体のグループ』ではなく『local spaceの入れ子』として捉え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/threejs-scenegraph-whose-position-is-two.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/threejs-scenegraph-whose-position-is-two.html"><meta property="og:title" content="position.x = 2。で、誰から見て2？ Three.jsのScene Graphは『小さな世界』を入れ子にする"><meta property="og:description" content="Three.jsのchild.position.xを2にした。なのに親を動かしたり拡大したりすると、子のworld positionは別の数字になる。親を3倍にすると子との距離まで3倍になる実験と、add() / attach()で親を付け替える実験を通して、Scene Graphを『物体のグループ』ではなく『local spaceの入れ子』として捉え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="position.x = 2。で、誰から見て2？ Three.jsのScene Graphは『小さな世界』を入れ子にする"><meta name="twitter:description" content="Three.jsのchild.position.xを2にした。なのに親を動かしたり拡大したりすると、子のworld positionは別の数字になる。親を3倍にすると子との距離まで3倍になる実験と、add() / attach()で親を付け替える実験を通して、Scene Graphを『物体のグループ』ではなく『local spaceの入れ子』として捉え直す。"></head><body><main><article><h1>position.x = 2。で、誰から見て2？ Three.jsのScene Graphは『小さな世界』を入れ子にする</h1><p>Three.jsのchild.position.xを2にした。なのに親を動かしたり拡大したりすると、子のworld positionは別の数字になる。親を3倍にすると子との距離まで3倍になる実験と、add() / attach()で親を付け替える実験を通して、Scene Graphを『物体のグループ』ではなく『local spaceの入れ子』として捉え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/threejs-scenegraph-whose-position-is-two?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/threejs-scenegraph-whose-position-is-two?lang=ja");</script></body></htm

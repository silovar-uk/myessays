<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真剣の先には、少し怖さがある</title><meta name="description" content="真剣さを突き詰めると、なぜ少しの『怖さ』が立ち上がるのかを考える。怖さを威圧や怒気ではなく、失敗の痛みを引き受け、言い訳の退路を減らし、何かを失える状態になることで生じる緊張感として捉え直す。目標コミットメント、失敗への恐れ、キルケゴールの不安論、コミットメントの過剰化を手がかりに、本気と怖さの関係と、その怖さを他人への圧力に変えないための境界線を整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/seriousness-carries-fear.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/seriousness-carries-fear.html"><meta property="og:title" content="真剣の先には、少し怖さがある"><meta property="og:description" content="真剣さを突き詰めると、なぜ少しの『怖さ』が立ち上がるのかを考える。怖さを威圧や怒気ではなく、失敗の痛みを引き受け、言い訳の退路を減らし、何かを失える状態になることで生じる緊張感として捉え直す。目標コミットメント、失敗への恐れ、キルケゴールの不安論、コミットメントの過剰化を手がかりに、本気と怖さの関係と、その怖さを他人への圧力に変えないための境界線を整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="真剣の先には、少し怖さがある"><meta name="twitter:description" content="真剣さを突き詰めると、なぜ少しの『怖さ』が立ち上がるのかを考える。怖さを威圧や怒気ではなく、失敗の痛みを引き受け、言い訳の退路を減らし、何かを失える状態になることで生じる緊張感として捉え直す。目標コミットメント、失敗への恐れ、キルケゴールの不安論、コミットメントの過剰化を手がかりに、本気と怖さの関係と、その怖さを他人への圧力に変えないための境界線を整理する。"></head><body><main><article><h1>真剣の先には、少し怖さがある</h1><p>真剣さを突き詰めると、なぜ少しの『怖さ』が立ち上がるのかを考える。怖さを威圧や怒気ではなく、失敗の痛みを引き受け、言い訳の退路を減らし、何かを失える状態になることで生じる緊張感として捉え直す。目標コミットメント、失敗への恐れ、キルケゴールの不安論、コミットメントの過剰化を手がかりに、本気と怖さの関係と、その怖さを他人への圧力に変えないための境界線を整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/seriousness-carries-fear?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/seriousness-carries-fear?lang=ja");</script></body></html>

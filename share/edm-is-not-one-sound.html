<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDMは、ひとつの音ではない</title><meta name="description" content="EDMを『電子音が鳴る派手な音楽』という一言から解放し、Electronic Dance Musicという大きな傘として整理する。House、Techno、Trance、Dubstep、Drum &amp; Bassを、歴史だけでなくBPM、キック、ベース、リズム、音色、エネルギーの変化から聴き分ける。四つ打ちやDropをEDM全体の必須条件と誤解せず、次に曲を聴いた瞬間から使える観察軸をつくる入門編。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/edm-is-not-one-sound.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/edm-is-not-one-sound.html"><meta property="og:title" content="EDMは、ひとつの音ではない"><meta property="og:description" content="EDMを『電子音が鳴る派手な音楽』という一言から解放し、Electronic Dance Musicという大きな傘として整理する。House、Techno、Trance、Dubstep、Drum &amp; Bassを、歴史だけでなくBPM、キック、ベース、リズム、音色、エネルギーの変化から聴き分ける。四つ打ちやDropをEDM全体の必須条件と誤解せず、次に曲を聴いた瞬間から使える観察軸をつくる入門編。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="EDMは、ひとつの音ではない"><meta name="twitter:description" content="EDMを『電子音が鳴る派手な音楽』という一言から解放し、Electronic Dance Musicという大きな傘として整理する。House、Techno、Trance、Dubstep、Drum &amp; Bassを、歴史だけでなくBPM、キック、ベース、リズム、音色、エネルギーの変化から聴き分ける。四つ打ちやDropをEDM全体の必須条件と誤解せず、次に曲を聴いた瞬間から使える観察軸をつくる入門編。"></head><body><main><article><h1>EDMは、ひとつの音ではない</h1><p>EDMを『電子音が鳴る派手な音楽』という一言から解放し、Electronic Dance Musicという大きな傘として整理する。House、Techno、Trance、Dubstep、Drum &amp; Bassを、歴史だけでなくBPM、キック、ベース、リズム、音色、エネルギーの変化から聴き分ける。四つ打ちやDropをEDM全体の必須条件と誤解せず、次に曲を聴いた瞬間から使える観察軸をつくる入門編。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/edm-is-not-one-sound?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/edm-is-not-one-sound?lang=ja");</script></body></html>

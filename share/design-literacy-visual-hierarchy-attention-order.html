<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部を目立たせたら、何も目立たなくなる――Visual Hierarchy</title><meta name="description" content="「全部を目立たせてください」という無理難題を入口に、Visual Hierarchyを単なる文字サイズの順位ではなく、重要度に応じて注意を編成する設計として捉え直す。NN/gのVisual HierarchyとSquint Test、GestaltのProximity、MoMAが整理するNew Typographyを手掛かりに、scale・contrast・groupingを一変数ずつ比較し、現代UIで再利用できる制作・レビュー手順へ落とし込む。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-visual-hierarchy-attention-order.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-visual-hierarchy-attention-order.html"><meta property="og:title" content="全部を目立たせたら、何も目立たなくなる――Visual Hierarchy"><meta property="og:description" content="「全部を目立たせてください」という無理難題を入口に、Visual Hierarchyを単なる文字サイズの順位ではなく、重要度に応じて注意を編成する設計として捉え直す。NN/gのVisual HierarchyとSquint Test、GestaltのProximity、MoMAが整理するNew Typographyを手掛かりに、scale・contrast・groupingを一変数ずつ比較し、現代UIで再利用できる制作・レビュー手順へ落とし込む。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="全部を目立たせたら、何も目立たなくなる――Visual Hierarchy"><meta name="twitter:description" content="「全部を目立たせてください」という無理難題を入口に、Visual Hierarchyを単なる文字サイズの順位ではなく、重要度に応じて注意を編成する設計として捉え直す。NN/gのVisual HierarchyとSquint Test、GestaltのProximity、MoMAが整理するNew Typographyを手掛かりに、scale・contrast・groupingを一変数ずつ比較し、現代UIで再利用できる制作・レビュー手順へ落とし込む。"></head><body><main><article><h1>全部を目立たせたら、何も目立たなくなる――Visual Hierarchy</h1><p>「全部を目立たせてください」という無理難題を入口に、Visual Hierarchyを単なる文字サイズの順位ではなく、重要度に応じて注意を編成する設計として捉え直す。NN/gのVisual HierarchyとSquint Test、GestaltのProximity、MoMAが整理するNew Typographyを手掛かりに、scale・contrast・groupingを一変数ずつ比較し、現代UIで再利用できる制作・レビュー手順へ落とし込む。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-visual-hierarchy-attention-order?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https:

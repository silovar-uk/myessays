<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>監督をしながら大学院へ――工藤公康はなぜ「経験」をそのまま信じなかったのか</title><meta name="description" content="29年の現役生活と5度の日本一を経験した工藤公康は、経験豊富な人物である。ところが監督在任中に筑波大学大学院で体育学を学び、2020年に修士課程を修了。2022年には博士課程へ進み、身体やスポーツ医学の研究を続けている。故障をきっかけに専門家へ学び、監督2年目の失敗からメモを始め、データ万能論にも距離を取る。工藤の強みを『経験が多い』ではなく『経験を修正可能な仮説として扱う』ことから読み直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/kimiyasu-kudo-03-experience-learning-loop.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/kimiyasu-kudo-03-experience-learning-loop.html"><meta property="og:title" content="監督をしながら大学院へ――工藤公康はなぜ「経験」をそのまま信じなかったのか"><meta property="og:description" content="29年の現役生活と5度の日本一を経験した工藤公康は、経験豊富な人物である。ところが監督在任中に筑波大学大学院で体育学を学び、2020年に修士課程を修了。2022年には博士課程へ進み、身体やスポーツ医学の研究を続けている。故障をきっかけに専門家へ学び、監督2年目の失敗からメモを始め、データ万能論にも距離を取る。工藤の強みを『経験が多い』ではなく『経験を修正可能な仮説として扱う』ことから読み直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="監督をしながら大学院へ――工藤公康はなぜ「経験」をそのまま信じなかったのか"><meta name="twitter:description" content="29年の現役生活と5度の日本一を経験した工藤公康は、経験豊富な人物である。ところが監督在任中に筑波大学大学院で体育学を学び、2020年に修士課程を修了。2022年には博士課程へ進み、身体やスポーツ医学の研究を続けている。故障をきっかけに専門家へ学び、監督2年目の失敗からメモを始め、データ万能論にも距離を取る。工藤の強みを『経験が多い』ではなく『経験を修正可能な仮説として扱う』ことから読み直す。"></head><body><main><article><h1>監督をしながら大学院へ――工藤公康はなぜ「経験」をそのまま信じなかったのか</h1><p>29年の現役生活と5度の日本一を経験した工藤公康は、経験豊富な人物である。ところが監督在任中に筑波大学大学院で体育学を学び、2020年に修士課程を修了。2022年には博士課程へ進み、身体やスポーツ医学の研究を続けている。故障をきっかけに専門家へ学び、監督2年目の失敗からメモを始め、データ万能論にも距離を取る。工藤の強みを『経験が多い』ではなく『経験を修正可能な仮説として扱う』ことから読み直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/kimiyasu-kudo-03-experience-learning-loop?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/kimiyasu-kudo-03-experience-learning-loop?lang=ja");</script></body></html>

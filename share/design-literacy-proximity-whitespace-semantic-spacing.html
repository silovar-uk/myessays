<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>枠線を全部消したのに、なぜまだグループが見えるのか？</title><meta name="description" content="「余白を増やしてください」という指示を本気で疑う。なぜ枠線も背景色もないのに、人は画面の中にグループを見つけられるのか。Max Wertheimerの1923年のGestalt研究、現代UIのProximity、W3Cの認知アクセシビリティ資料をたどり、余白を「残った空間」ではなく関係と境界を書く情報として捉え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-proximity-whitespace-semantic-spacing.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-proximity-whitespace-semantic-spacing.html"><meta property="og:title" content="枠線を全部消したのに、なぜまだグループが見えるのか？"><meta property="og:description" content="「余白を増やしてください」という指示を本気で疑う。なぜ枠線も背景色もないのに、人は画面の中にグループを見つけられるのか。Max Wertheimerの1923年のGestalt研究、現代UIのProximity、W3Cの認知アクセシビリティ資料をたどり、余白を「残った空間」ではなく関係と境界を書く情報として捉え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="枠線を全部消したのに、なぜまだグループが見えるのか？"><meta name="twitter:description" content="「余白を増やしてください」という指示を本気で疑う。なぜ枠線も背景色もないのに、人は画面の中にグループを見つけられるのか。Max Wertheimerの1923年のGestalt研究、現代UIのProximity、W3Cの認知アクセシビリティ資料をたどり、余白を「残った空間」ではなく関係と境界を書く情報として捉え直す。"></head><body><main><article><h1>枠線を全部消したのに、なぜまだグループが見えるのか？</h1><p>「余白を増やしてください」という指示を本気で疑う。なぜ枠線も背景色もないのに、人は画面の中にグループを見つけられるのか。Max Wertheimerの1923年のGestalt研究、現代UIのProximity、W3Cの認知アクセシビリティ資料をたどり、余白を「残った空間」ではなく関係と境界を書く情報として捉え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-proximity-whitespace-semantic-spacing?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-proximity-whitespace-semantic-spacing?lang=ja");</script></body></html>

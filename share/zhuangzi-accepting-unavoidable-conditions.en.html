<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceptance is not giving up――荘子「知其不可奈何而安之若命」英語混じり版</title><meta name="description" content="『荘子』内篇「人間世」の「知其不可奈何而安之若命」を、シンプルな英語と日本語を交互に使いながら読む。葉公子高が避けがたい任務の成否を恐れて消耗する文脈を確認し、「受け入れる＝諦める」ではなく、自分の力が届く範囲を尽くしつつ、届かない条件まで心の責任にしないという現代的な補助線へつなげる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/zhuangzi-accepting-unavoidable-conditions.en.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/zhuangzi-accepting-unavoidable-conditions.en.html"><meta property="og:title" content="Acceptance is not giving up――荘子「知其不可奈何而安之若命」英語混じり版"><meta property="og:description" content="『荘子』内篇「人間世」の「知其不可奈何而安之若命」を、シンプルな英語と日本語を交互に使いながら読む。葉公子高が避けがたい任務の成否を恐れて消耗する文脈を確認し、「受け入れる＝諦める」ではなく、自分の力が届く範囲を尽くしつつ、届かない条件まで心の責任にしないという現代的な補助線へつなげる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Acceptance is not giving up――荘子「知其不可奈何而安之若命」英語混じり版"><meta name="twitter:description" content="『荘子』内篇「人間世」の「知其不可奈何而安之若命」を、シンプルな英語と日本語を交互に使いながら読む。葉公子高が避けがたい任務の成否を恐れて消耗する文脈を確認し、「受け入れる＝諦める」ではなく、自分の力が届く範囲を尽くしつつ、届かない条件まで心の責任にしないという現代的な補助線へつなげる。"></head><body><main><article><h1>Acceptance is not giving up――荘子「知其不可奈何而安之若命」英語混じり版</h1><p>『荘子』内篇「人間世」の「知其不可奈何而安之若命」を、シンプルな英語と日本語を交互に使いながら読む。葉公子高が避けがたい任務の成否を恐れて消耗する文脈を確認し、「受け入れる＝諦める」ではなく、自分の力が届く範囲を尽くしつつ、届かない条件まで心の責任にしないという現代的な補助線へつなげる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/zhuangzi-accepting-unavoidable-conditions?lang=en">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/zhuangzi-accepting-unavoidable-conditions?lang=en");</script></body></html>

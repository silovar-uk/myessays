<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知識を集めていたつもりが、立ち位置を集めていた</title><meta name="description" content="知識を増やすことが好きだと思っていた。けれど、スマブラでダックハントを使っていたときに楽しかったのは、知識そのものより、相手より少しだけ局面を理解し、有利な状態から読み合いに入る感覚だった。AIを学ぶことや、日常で人と少し違う専門性を持ちたくなる感覚も、同じ構造なのかもしれない。知識欲、読み合い、特殊な立ち位置を一本につなぎ、自分が本当に集めているものを考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/knowledge-positioning-strategic-uncertainty.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/knowledge-positioning-strategic-uncertainty.html"><meta property="og:title" content="知識を集めていたつもりが、立ち位置を集めていた"><meta property="og:description" content="知識を増やすことが好きだと思っていた。けれど、スマブラでダックハントを使っていたときに楽しかったのは、知識そのものより、相手より少しだけ局面を理解し、有利な状態から読み合いに入る感覚だった。AIを学ぶことや、日常で人と少し違う専門性を持ちたくなる感覚も、同じ構造なのかもしれない。知識欲、読み合い、特殊な立ち位置を一本につなぎ、自分が本当に集めているものを考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="知識を集めていたつもりが、立ち位置を集めていた"><meta name="twitter:description" content="知識を増やすことが好きだと思っていた。けれど、スマブラでダックハントを使っていたときに楽しかったのは、知識そのものより、相手より少しだけ局面を理解し、有利な状態から読み合いに入る感覚だった。AIを学ぶことや、日常で人と少し違う専門性を持ちたくなる感覚も、同じ構造なのかもしれない。知識欲、読み合い、特殊な立ち位置を一本につなぎ、自分が本当に集めているものを考える。"></head><body><main><article><h1>知識を集めていたつもりが、立ち位置を集めていた</h1><p>知識を増やすことが好きだと思っていた。けれど、スマブラでダックハントを使っていたときに楽しかったのは、知識そのものより、相手より少しだけ局面を理解し、有利な状態から読み合いに入る感覚だった。AIを学ぶことや、日常で人と少し違う専門性を持ちたくなる感覚も、同じ構造なのかもしれない。知識欲、読み合い、特殊な立ち位置を一本につなぎ、自分が本当に集めているものを考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/knowledge-positioning-strategic-uncertainty?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/knowledge-positioning-strategic-uncertainty?lang=ja");</script></body></html>

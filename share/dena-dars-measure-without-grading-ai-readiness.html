<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIスコアなのに、人事評価に直結させない――DeNA「DARS」は何を測っているのか</title><meta name="description" content="DeNAのAI活用指標DARSは、個人と組織を5段階で測るのに、人事評価へ直接は結びつけない。しかも基準は意図的に少し抽象的で、部署ごとに具体化する。これは甘い制度なのか。公式資料、2026年時点の運用実績、マーケティング部と品質管理部門の事例、AWSやMicrosoftの成熟度モデルまで比べると、DARSが測ろうとしているのは「AIの上手さ」より、AIを使って仕事を再設計できる距離だと見えてくる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/dena-dars-measure-without-grading-ai-readiness.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/dena-dars-measure-without-grading-ai-readiness.html"><meta property="og:title" content="AIスコアなのに、人事評価に直結させない――DeNA「DARS」は何を測っているのか"><meta property="og:description" content="DeNAのAI活用指標DARSは、個人と組織を5段階で測るのに、人事評価へ直接は結びつけない。しかも基準は意図的に少し抽象的で、部署ごとに具体化する。これは甘い制度なのか。公式資料、2026年時点の運用実績、マーケティング部と品質管理部門の事例、AWSやMicrosoftの成熟度モデルまで比べると、DARSが測ろうとしているのは「AIの上手さ」より、AIを使って仕事を再設計できる距離だと見えてくる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="AIスコアなのに、人事評価に直結させない――DeNA「DARS」は何を測っているのか"><meta name="twitter:description" content="DeNAのAI活用指標DARSは、個人と組織を5段階で測るのに、人事評価へ直接は結びつけない。しかも基準は意図的に少し抽象的で、部署ごとに具体化する。これは甘い制度なのか。公式資料、2026年時点の運用実績、マーケティング部と品質管理部門の事例、AWSやMicrosoftの成熟度モデルまで比べると、DARSが測ろうとしているのは「AIの上手さ」より、AIを使って仕事を再設計できる距離だと見えてくる。"></head><body><main><article><h1>AIスコアなのに、人事評価に直結させない――DeNA「DARS」は何を測っているのか</h1><p>DeNAのAI活用指標DARSは、個人と組織を5段階で測るのに、人事評価へ直接は結びつけない。しかも基準は意図的に少し抽象的で、部署ごとに具体化する。これは甘い制度なのか。公式資料、2026年時点の運用実績、マーケティング部と品質管理部門の事例、AWSやMicrosoftの成熟度モデルまで比べると、DARSが測ろうとしているのは「AIの上手さ」より、AIを使って仕事を再設計できる距離だと見えてくる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/dena-dars-measure-without-grading-ai-readiness?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/dena-dars-measure-without-grading-ai-readi

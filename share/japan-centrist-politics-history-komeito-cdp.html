<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「中道」って、結局どこ？――公明党・立憲民主党からたどる日本政治の中道史</title><meta name="description" content="日本政治の『中道』は、左右を一本の線で結んだ真ん中の点ではない。1947年の片山連立内閣、55年体制の成立、民社党、公明党の中道主義、1990年代の政党再編、自公連立、立憲民主党、そして2026年の中道改革連合までを追うと、中道は時代ごとに『位置』『理念』『政治手法』の意味を変えてきたことが見える。本稿では、組織的系譜・思想的系譜・政治的連携を分けながら、いま中道と呼ばれているものの正体を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/japan-centrist-politics-history-komeito-cdp.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/japan-centrist-politics-history-komeito-cdp.html"><meta property="og:title" content="「中道」って、結局どこ？――公明党・立憲民主党からたどる日本政治の中道史"><meta property="og:description" content="日本政治の『中道』は、左右を一本の線で結んだ真ん中の点ではない。1947年の片山連立内閣、55年体制の成立、民社党、公明党の中道主義、1990年代の政党再編、自公連立、立憲民主党、そして2026年の中道改革連合までを追うと、中道は時代ごとに『位置』『理念』『政治手法』の意味を変えてきたことが見える。本稿では、組織的系譜・思想的系譜・政治的連携を分けながら、いま中道と呼ばれているものの正体を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「中道」って、結局どこ？――公明党・立憲民主党からたどる日本政治の中道史"><meta name="twitter:description" content="日本政治の『中道』は、左右を一本の線で結んだ真ん中の点ではない。1947年の片山連立内閣、55年体制の成立、民社党、公明党の中道主義、1990年代の政党再編、自公連立、立憲民主党、そして2026年の中道改革連合までを追うと、中道は時代ごとに『位置』『理念』『政治手法』の意味を変えてきたことが見える。本稿では、組織的系譜・思想的系譜・政治的連携を分けながら、いま中道と呼ばれているものの正体を考える。"></head><body><main><article><h1>「中道」って、結局どこ？――公明党・立憲民主党からたどる日本政治の中道史</h1><p>日本政治の『中道』は、左右を一本の線で結んだ真ん中の点ではない。1947年の片山連立内閣、55年体制の成立、民社党、公明党の中道主義、1990年代の政党再編、自公連立、立憲民主党、そして2026年の中道改革連合までを追うと、中道は時代ごとに『位置』『理念』『政治手法』の意味を変えてきたことが見える。本稿では、組織的系譜・思想的系譜・政治的連携を分けながら、いま中道と呼ばれているものの正体を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/japan-centrist-politics-history-komeito-cdp?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/japan-centrist-politics-history-komeito-cdp?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棚なのに、棚以上のことを言いたがる――Memphisと『機能だけでは足りない』デザイン</title><meta name="description" content="『使いやすいこと』がデザインの正義なら、なぜMemphisはわざわざ変な棚や椅子を作ったのか。1981年のMemphisとEttore Sottsassを、派手な色柄の様式としてではなく、機能・意味・感情・文化の関係を問い直した運動として追う。Carltonを実物レベルで分解し、現代UIで情報構造を壊さず表現レイヤーを設計する方法へ戻す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-memphis-function-expression.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-memphis-function-expression.html"><meta property="og:title" content="棚なのに、棚以上のことを言いたがる――Memphisと『機能だけでは足りない』デザイン"><meta property="og:description" content="『使いやすいこと』がデザインの正義なら、なぜMemphisはわざわざ変な棚や椅子を作ったのか。1981年のMemphisとEttore Sottsassを、派手な色柄の様式としてではなく、機能・意味・感情・文化の関係を問い直した運動として追う。Carltonを実物レベルで分解し、現代UIで情報構造を壊さず表現レイヤーを設計する方法へ戻す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="棚なのに、棚以上のことを言いたがる――Memphisと『機能だけでは足りない』デザイン"><meta name="twitter:description" content="『使いやすいこと』がデザインの正義なら、なぜMemphisはわざわざ変な棚や椅子を作ったのか。1981年のMemphisとEttore Sottsassを、派手な色柄の様式としてではなく、機能・意味・感情・文化の関係を問い直した運動として追う。Carltonを実物レベルで分解し、現代UIで情報構造を壊さず表現レイヤーを設計する方法へ戻す。"></head><body><main><article><h1>棚なのに、棚以上のことを言いたがる――Memphisと『機能だけでは足りない』デザイン</h1><p>『使いやすいこと』がデザインの正義なら、なぜMemphisはわざわざ変な棚や椅子を作ったのか。1981年のMemphisとEttore Sottsassを、派手な色柄の様式としてではなく、機能・意味・感情・文化の関係を問い直した運動として追う。Carltonを実物レベルで分解し、現代UIで情報構造を壊さず表現レイヤーを設計する方法へ戻す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-memphis-function-expression?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-memphis-function-expression?lang=ja");</script></body></html>

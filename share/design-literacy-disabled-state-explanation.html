<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>押せないボタンは、なぜ押せないのかを説明していない</title><meta name="description" content="灰色のボタンが、ただ無言で押せない。その小さな違和感から、Disabled Stateを『見た目のバリエーション』ではなく、状態・原因・回復方法を扱う情報設計として捉え直す。W3CとMDNの仕様をたどり、HTML disabledとaria-disabledの違い、発見可能性とのトレードオフ、ConstraintとError Preventionの関係まで掘る。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-disabled-state-explanation.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-disabled-state-explanation.html"><meta property="og:title" content="押せないボタンは、なぜ押せないのかを説明していない"><meta property="og:description" content="灰色のボタンが、ただ無言で押せない。その小さな違和感から、Disabled Stateを『見た目のバリエーション』ではなく、状態・原因・回復方法を扱う情報設計として捉え直す。W3CとMDNの仕様をたどり、HTML disabledとaria-disabledの違い、発見可能性とのトレードオフ、ConstraintとError Preventionの関係まで掘る。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="押せないボタンは、なぜ押せないのかを説明していない"><meta name="twitter:description" content="灰色のボタンが、ただ無言で押せない。その小さな違和感から、Disabled Stateを『見た目のバリエーション』ではなく、状態・原因・回復方法を扱う情報設計として捉え直す。W3CとMDNの仕様をたどり、HTML disabledとaria-disabledの違い、発見可能性とのトレードオフ、ConstraintとError Preventionの関係まで掘る。"></head><body><main><article><h1>押せないボタンは、なぜ押せないのかを説明していない</h1><p>灰色のボタンが、ただ無言で押せない。その小さな違和感から、Disabled Stateを『見た目のバリエーション』ではなく、状態・原因・回復方法を扱う情報設計として捉え直す。W3CとMDNの仕様をたどり、HTML disabledとaria-disabledの違い、発見可能性とのトレードオフ、ConstraintとError Preventionの関係まで掘る。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-disabled-state-explanation?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-disabled-state-explanation?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リーグ優勝3回、日本一5回――工藤公康の「勝つ」は一種類ではない</title><meta name="description" content="工藤公康はソフトバンク監督7年間でリーグ優勝3回、日本一5回。普通なら日本一の回数はリーグ優勝以下になりそうだが、2018年と2019年は2位からクライマックスシリーズを勝ち上がった。7年間558勝、勝率.596という長期戦の強さと、短期決戦の結果、さらに強力な球団組織を切り分けると、『優勝請負人』という一語では説明できない勝ち方が見えてくる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/kimiyasu-kudo-02-three-pennants-five-japan-titles.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/kimiyasu-kudo-02-three-pennants-five-japan-titles.html"><meta property="og:title" content="リーグ優勝3回、日本一5回――工藤公康の「勝つ」は一種類ではない"><meta property="og:description" content="工藤公康はソフトバンク監督7年間でリーグ優勝3回、日本一5回。普通なら日本一の回数はリーグ優勝以下になりそうだが、2018年と2019年は2位からクライマックスシリーズを勝ち上がった。7年間558勝、勝率.596という長期戦の強さと、短期決戦の結果、さらに強力な球団組織を切り分けると、『優勝請負人』という一語では説明できない勝ち方が見えてくる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="リーグ優勝3回、日本一5回――工藤公康の「勝つ」は一種類ではない"><meta name="twitter:description" content="工藤公康はソフトバンク監督7年間でリーグ優勝3回、日本一5回。普通なら日本一の回数はリーグ優勝以下になりそうだが、2018年と2019年は2位からクライマックスシリーズを勝ち上がった。7年間558勝、勝率.596という長期戦の強さと、短期決戦の結果、さらに強力な球団組織を切り分けると、『優勝請負人』という一語では説明できない勝ち方が見えてくる。"></head><body><main><article><h1>リーグ優勝3回、日本一5回――工藤公康の「勝つ」は一種類ではない</h1><p>工藤公康はソフトバンク監督7年間でリーグ優勝3回、日本一5回。普通なら日本一の回数はリーグ優勝以下になりそうだが、2018年と2019年は2位からクライマックスシリーズを勝ち上がった。7年間558勝、勝率.596という長期戦の強さと、短期決戦の結果、さらに強力な球団組織を切り分けると、『優勝請負人』という一語では説明できない勝ち方が見えてくる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/kimiyasu-kudo-02-three-pennants-five-japan-titles?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/kimiyasu-kudo-02-three-pennants-five-japan-titles?lang=ja");</script></body></html>

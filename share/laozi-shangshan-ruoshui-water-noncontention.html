<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水は争わない、それでも世界を動かす――老子「上善若水」</title><meta name="description" content="『老子』第8章の「上善若水」を、単なる「柔軟に生きよう」という標語ではなく、万物を利し、争わず、人の嫌う低い場所に身を置く水の比喩として読む。仕事や組織の具体例を通して、老子が問い直した「強さ」の意味と、「不争」を消極性と取り違えないための視点を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/laozi-shangshan-ruoshui-water-noncontention.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/laozi-shangshan-ruoshui-water-noncontention.html"><meta property="og:title" content="水は争わない、それでも世界を動かす――老子「上善若水」"><meta property="og:description" content="『老子』第8章の「上善若水」を、単なる「柔軟に生きよう」という標語ではなく、万物を利し、争わず、人の嫌う低い場所に身を置く水の比喩として読む。仕事や組織の具体例を通して、老子が問い直した「強さ」の意味と、「不争」を消極性と取り違えないための視点を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="水は争わない、それでも世界を動かす――老子「上善若水」"><meta name="twitter:description" content="『老子』第8章の「上善若水」を、単なる「柔軟に生きよう」という標語ではなく、万物を利し、争わず、人の嫌う低い場所に身を置く水の比喩として読む。仕事や組織の具体例を通して、老子が問い直した「強さ」の意味と、「不争」を消極性と取り違えないための視点を考える。"></head><body><main><article><h1>水は争わない、それでも世界を動かす――老子「上善若水」</h1><p>『老子』第8章の「上善若水」を、単なる「柔軟に生きよう」という標語ではなく、万物を利し、争わず、人の嫌う低い場所に身を置く水の比喩として読む。仕事や組織の具体例を通して、老子が問い直した「強さ」の意味と、「不争」を消極性と取り違えないための視点を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/laozi-shangshan-ruoshui-water-noncontention?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/laozi-shangshan-ruoshui-water-noncontention?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>炭酸飲料はなぜ開けると泡が出る？――圧力が変えるCO₂の居場所</title><meta name="description" content="未開封の炭酸飲料では泡が見えないのに、フタを開けると突然『プシュッ』という音とともに泡が現れる。CO₂は開栓時に新しく作られているのではない。高いCO₂分圧のもとで液体に溶けていたCO₂が、開栓による圧力低下で新しい条件に対して過飽和となり、核生成サイトを足場に気相へ移っていく。本稿ではHenry&#39;s law、動的平衡、過飽和、核生成、泡の成長、温度、振った炭酸、Mentos、CO₂(aq)とH₂CO₃の違いまでをつなぎ、見える泡の手前にある見えない平衡を追う。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/why-carbonated-drinks-fizz-when-opened.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/why-carbonated-drinks-fizz-when-opened.html"><meta property="og:title" content="炭酸飲料はなぜ開けると泡が出る？――圧力が変えるCO₂の居場所"><meta property="og:description" content="未開封の炭酸飲料では泡が見えないのに、フタを開けると突然『プシュッ』という音とともに泡が現れる。CO₂は開栓時に新しく作られているのではない。高いCO₂分圧のもとで液体に溶けていたCO₂が、開栓による圧力低下で新しい条件に対して過飽和となり、核生成サイトを足場に気相へ移っていく。本稿ではHenry&#39;s law、動的平衡、過飽和、核生成、泡の成長、温度、振った炭酸、Mentos、CO₂(aq)とH₂CO₃の違いまでをつなぎ、見える泡の手前にある見えない平衡を追う。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="炭酸飲料はなぜ開けると泡が出る？――圧力が変えるCO₂の居場所"><meta name="twitter:description" content="未開封の炭酸飲料では泡が見えないのに、フタを開けると突然『プシュッ』という音とともに泡が現れる。CO₂は開栓時に新しく作られているのではない。高いCO₂分圧のもとで液体に溶けていたCO₂が、開栓による圧力低下で新しい条件に対して過飽和となり、核生成サイトを足場に気相へ移っていく。本稿ではHenry&#39;s law、動的平衡、過飽和、核生成、泡の成長、温度、振った炭酸、Mentos、CO₂(aq)とH₂CO₃の違いまでをつなぎ、見える泡の手前にある見えない平衡を追う。"></head><body><main><article><h1>炭酸飲料はなぜ開けると泡が出る？――圧力が変えるCO₂の居場所</h1><p>未開封の炭酸飲料では泡が見えないのに、フタを開けると突然『プシュッ』という音とともに泡が現れる。CO₂は開栓時に新しく作られているのではない。高いCO₂分圧のもとで液体に溶けていたCO₂が、開栓による圧力低下で新しい条件に対して過飽和となり、核生成サイトを足場に気相へ移っていく。本稿ではHenry&#39;s law、動的平衡、過飽和、核生成、泡の成長、温度、振った炭酸、Mentos、CO₂(aq)とH₂CO₃の違いまでをつなぎ、見える泡の手前にある見えない平衡を追う。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/why-carbonated-drinks-fizz-when-opened?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silo

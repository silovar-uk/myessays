<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「書いてある」だけでは、まだ結論ではない――孟子「盡信《書》，則不如無《書》」</title><meta name="description" content="『孟子』尽心下の「盡信《書》，則不如無《書》」を入口に、権威ある資料を読むことと、そこへ判断を丸ごと預けることの違いを考える。『書経』武成の「血之流杵」を孟子がどう疑ったかを確認し、報告書・データ・AI出力を現代の意思決定でどう扱うかへ接続する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/mencius-source-is-not-conclusion.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/mencius-source-is-not-conclusion.html"><meta property="og:title" content="「書いてある」だけでは、まだ結論ではない――孟子「盡信《書》，則不如無《書》」"><meta property="og:description" content="『孟子』尽心下の「盡信《書》，則不如無《書》」を入口に、権威ある資料を読むことと、そこへ判断を丸ごと預けることの違いを考える。『書経』武成の「血之流杵」を孟子がどう疑ったかを確認し、報告書・データ・AI出力を現代の意思決定でどう扱うかへ接続する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「書いてある」だけでは、まだ結論ではない――孟子「盡信《書》，則不如無《書》」"><meta name="twitter:description" content="『孟子』尽心下の「盡信《書》，則不如無《書》」を入口に、権威ある資料を読むことと、そこへ判断を丸ごと預けることの違いを考える。『書経』武成の「血之流杵」を孟子がどう疑ったかを確認し、報告書・データ・AI出力を現代の意思決定でどう扱うかへ接続する。"></head><body><main><article><h1>「書いてある」だけでは、まだ結論ではない――孟子「盡信《書》，則不如無《書》」</h1><p>『孟子』尽心下の「盡信《書》，則不如無《書》」を入口に、権威ある資料を読むことと、そこへ判断を丸ごと預けることの違いを考える。『書経』武成の「血之流杵」を孟子がどう疑ったかを確認し、報告書・データ・AI出力を現代の意思決定でどう扱うかへ接続する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/mencius-source-is-not-conclusion?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/mencius-source-is-not-conclusion?lang=ja");</script></body></html>

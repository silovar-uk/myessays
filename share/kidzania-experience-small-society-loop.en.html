<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キッザニアでは何を体験できる？――A Day Inside a Small Society</title><meta name="description" content="キッザニアは simply a place to dress up as a firefighter or pilot ではない。子ども自身が仕事やサービスを選び、予約し、20〜40分ほどの activity に参加し、専用通貨キッゾを受け取り、使ったり貯めたりしながら次の行動を決める。本稿では、約100種類の体験を job list ではなく、a small social system として整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/kidzania-experience-small-society-loop.en.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/kidzania-experience-small-society-loop.en.html"><meta property="og:title" content="キッザニアでは何を体験できる？――A Day Inside a Small Society"><meta property="og:description" content="キッザニアは simply a place to dress up as a firefighter or pilot ではない。子ども自身が仕事やサービスを選び、予約し、20〜40分ほどの activity に参加し、専用通貨キッゾを受け取り、使ったり貯めたりしながら次の行動を決める。本稿では、約100種類の体験を job list ではなく、a small social system として整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="キッザニアでは何を体験できる？――A Day Inside a Small Society"><meta name="twitter:description" content="キッザニアは simply a place to dress up as a firefighter or pilot ではない。子ども自身が仕事やサービスを選び、予約し、20〜40分ほどの activity に参加し、専用通貨キッゾを受け取り、使ったり貯めたりしながら次の行動を決める。本稿では、約100種類の体験を job list ではなく、a small social system として整理する。"></head><body><main><article><h1>キッザニアでは何を体験できる？――A Day Inside a Small Society</h1><p>キッザニアは simply a place to dress up as a firefighter or pilot ではない。子ども自身が仕事やサービスを選び、予約し、20〜40分ほどの activity に参加し、専用通貨キッゾを受け取り、使ったり貯めたりしながら次の行動を決める。本稿では、約100種類の体験を job list ではなく、a small social system として整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/kidzania-experience-small-society-loop?lang=en">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/kidzania-experience-small-society-loop?lang=en");</script></body></html>

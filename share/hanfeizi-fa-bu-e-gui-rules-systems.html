<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ルールは、偉い人のために曲がらない――韓非子「法不阿貴」</title><meta name="description" content="韓非子『有度』篇の「法不阿貴」を入口に、なぜ組織には人の善意だけでなく基準や仕組みが必要なのかを考える。例外対応、権力者への迎合、承認ルールなど身近な仕事の場面を通じ、「人が変わっても同じように判断できる制度」をどう設計するかを考察する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/hanfeizi-fa-bu-e-gui-rules-systems.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/hanfeizi-fa-bu-e-gui-rules-systems.html"><meta property="og:title" content="ルールは、偉い人のために曲がらない――韓非子「法不阿貴」"><meta property="og:description" content="韓非子『有度』篇の「法不阿貴」を入口に、なぜ組織には人の善意だけでなく基準や仕組みが必要なのかを考える。例外対応、権力者への迎合、承認ルールなど身近な仕事の場面を通じ、「人が変わっても同じように判断できる制度」をどう設計するかを考察する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="ルールは、偉い人のために曲がらない――韓非子「法不阿貴」"><meta name="twitter:description" content="韓非子『有度』篇の「法不阿貴」を入口に、なぜ組織には人の善意だけでなく基準や仕組みが必要なのかを考える。例外対応、権力者への迎合、承認ルールなど身近な仕事の場面を通じ、「人が変わっても同じように判断できる制度」をどう設計するかを考察する。"></head><body><main><article><h1>ルールは、偉い人のために曲がらない――韓非子「法不阿貴」</h1><p>韓非子『有度』篇の「法不阿貴」を入口に、なぜ組織には人の善意だけでなく基準や仕組みが必要なのかを考える。例外対応、権力者への迎合、承認ルールなど身近な仕事の場面を通じ、「人が変わっても同じように判断できる制度」をどう設計するかを考察する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/hanfeizi-fa-bu-e-gui-rules-systems?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/hanfeizi-fa-bu-e-gui-rules-systems?lang=ja");</script></body></html>

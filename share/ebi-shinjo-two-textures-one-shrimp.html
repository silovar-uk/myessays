<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海老を海老らしくするために、海老を半分つぶす――えびしんじょうの変な構造</title><meta name="description" content="農林水産省が紹介する海老しんじょうのレシピには、海老を半分はペースト、半分は粗みじんにするものがある。同じ海老に、料理を成立させる土台と『海老を食べている』と感じさせる粒の二役を与えるわけだ。なぜそんなことをするのか。糝薯という奇妙な名前、1717年の記録、1822年の『料理通』に見えるかまぼことの違い、すり身のゲル形成まで追うと、えびしんじょうは単なる海老団子ではなく、素材の形を壊しながら素材らしさを再設計する料理に見えてきた。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/ebi-shinjo-two-textures-one-shrimp.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/ebi-shinjo-two-textures-one-shrimp.html"><meta property="og:title" content="海老を海老らしくするために、海老を半分つぶす――えびしんじょうの変な構造"><meta property="og:description" content="農林水産省が紹介する海老しんじょうのレシピには、海老を半分はペースト、半分は粗みじんにするものがある。同じ海老に、料理を成立させる土台と『海老を食べている』と感じさせる粒の二役を与えるわけだ。なぜそんなことをするのか。糝薯という奇妙な名前、1717年の記録、1822年の『料理通』に見えるかまぼことの違い、すり身のゲル形成まで追うと、えびしんじょうは単なる海老団子ではなく、素材の形を壊しながら素材らしさを再設計する料理に見えてきた。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="海老を海老らしくするために、海老を半分つぶす――えびしんじょうの変な構造"><meta name="twitter:description" content="農林水産省が紹介する海老しんじょうのレシピには、海老を半分はペースト、半分は粗みじんにするものがある。同じ海老に、料理を成立させる土台と『海老を食べている』と感じさせる粒の二役を与えるわけだ。なぜそんなことをするのか。糝薯という奇妙な名前、1717年の記録、1822年の『料理通』に見えるかまぼことの違い、すり身のゲル形成まで追うと、えびしんじょうは単なる海老団子ではなく、素材の形を壊しながら素材らしさを再設計する料理に見えてきた。"></head><body><main><article><h1>海老を海老らしくするために、海老を半分つぶす――えびしんじょうの変な構造</h1><p>農林水産省が紹介する海老しんじょうのレシピには、海老を半分はペースト、半分は粗みじんにするものがある。同じ海老に、料理を成立させる土台と『海老を食べている』と感じさせる粒の二役を与えるわけだ。なぜそんなことをするのか。糝薯という奇妙な名前、1717年の記録、1822年の『料理通』に見えるかまぼことの違い、すり身のゲル形成まで追うと、えびしんじょうは単なる海老団子ではなく、素材の形を壊しながら素材らしさを再設計する料理に見えてきた。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/ebi-shinjo-two-textures-one-shrimp?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/ebi-shinjo-two-textures-one-shrimp?lang=ja");</script></body></html>

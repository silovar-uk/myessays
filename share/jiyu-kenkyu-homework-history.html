<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「自由研究」は、いつから宿題になったのか</title><meta name="description" content="夏休みの定番「自由研究」は、1947年に突然発明された宿題ではない。夏休みの宿題は明治末には存在し、「自由に研究する」教育思想や制度も戦前から育っていた。1947年の学習指導要領で自由研究は教育課程上の時間として明確に位置づけられ、1951年には独立した枠を失うが、その理念と実践は教科・クラブ活動・夏休みの宿題へ分散して残った。本稿では、複数の『始まり』を切り分けながら、自由なのに強制されるという矛盾、理科研究との結びつき、総合的な学習・探究への連続性、そして生成AI時代に何を自分で研究するのかまで考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/jiyu-kenkyu-homework-history.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/jiyu-kenkyu-homework-history.html"><meta property="og:title" content="「自由研究」は、いつから宿題になったのか"><meta property="og:description" content="夏休みの定番「自由研究」は、1947年に突然発明された宿題ではない。夏休みの宿題は明治末には存在し、「自由に研究する」教育思想や制度も戦前から育っていた。1947年の学習指導要領で自由研究は教育課程上の時間として明確に位置づけられ、1951年には独立した枠を失うが、その理念と実践は教科・クラブ活動・夏休みの宿題へ分散して残った。本稿では、複数の『始まり』を切り分けながら、自由なのに強制されるという矛盾、理科研究との結びつき、総合的な学習・探究への連続性、そして生成AI時代に何を自分で研究するのかまで考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「自由研究」は、いつから宿題になったのか"><meta name="twitter:description" content="夏休みの定番「自由研究」は、1947年に突然発明された宿題ではない。夏休みの宿題は明治末には存在し、「自由に研究する」教育思想や制度も戦前から育っていた。1947年の学習指導要領で自由研究は教育課程上の時間として明確に位置づけられ、1951年には独立した枠を失うが、その理念と実践は教科・クラブ活動・夏休みの宿題へ分散して残った。本稿では、複数の『始まり』を切り分けながら、自由なのに強制されるという矛盾、理科研究との結びつき、総合的な学習・探究への連続性、そして生成AI時代に何を自分で研究するのかまで考える。"></head><body><main><article><h1>「自由研究」は、いつから宿題になったのか</h1><p>夏休みの定番「自由研究」は、1947年に突然発明された宿題ではない。夏休みの宿題は明治末には存在し、「自由に研究する」教育思想や制度も戦前から育っていた。1947年の学習指導要領で自由研究は教育課程上の時間として明確に位置づけられ、1951年には独立した枠を失うが、その理念と実践は教科・クラブ活動・夏休みの宿題へ分散して残った。本稿では、複数の『始まり』を切り分けながら、自由なのに強制されるという矛盾、理科研究との結びつき、総合的な学習・探究への連続性、そして生成AI時代に何を自分で研究するのかまで考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/jiyu-kenkyu-homework-history?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/jiyu-kenkyu-homework-history?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>覚えていないのに、知っている――「あれはあの人に聞けばいい」は記憶なのか</title><meta name="description" content="答えそのものを覚えていなくても、「誰に聞けばいいか」を覚えている。それは記憶なのか。1980年代に提案されたトランザクティブメモリーを、1991年の恋人ペア実験、チーム研究、Google effect、メタ分析、近年のスポーツ・医療チーム研究まで辿る。最初は「記憶の外注」だと思っていたが、調べるほど、これは専門化・信頼・協調を含む、人と人のあいだに成立する記憶システムに見えてきた。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/transactive-memory-who-knows-what.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/transactive-memory-who-knows-what.html"><meta property="og:title" content="覚えていないのに、知っている――「あれはあの人に聞けばいい」は記憶なのか"><meta property="og:description" content="答えそのものを覚えていなくても、「誰に聞けばいいか」を覚えている。それは記憶なのか。1980年代に提案されたトランザクティブメモリーを、1991年の恋人ペア実験、チーム研究、Google effect、メタ分析、近年のスポーツ・医療チーム研究まで辿る。最初は「記憶の外注」だと思っていたが、調べるほど、これは専門化・信頼・協調を含む、人と人のあいだに成立する記憶システムに見えてきた。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="覚えていないのに、知っている――「あれはあの人に聞けばいい」は記憶なのか"><meta name="twitter:description" content="答えそのものを覚えていなくても、「誰に聞けばいいか」を覚えている。それは記憶なのか。1980年代に提案されたトランザクティブメモリーを、1991年の恋人ペア実験、チーム研究、Google effect、メタ分析、近年のスポーツ・医療チーム研究まで辿る。最初は「記憶の外注」だと思っていたが、調べるほど、これは専門化・信頼・協調を含む、人と人のあいだに成立する記憶システムに見えてきた。"></head><body><main><article><h1>覚えていないのに、知っている――「あれはあの人に聞けばいい」は記憶なのか</h1><p>答えそのものを覚えていなくても、「誰に聞けばいいか」を覚えている。それは記憶なのか。1980年代に提案されたトランザクティブメモリーを、1991年の恋人ペア実験、チーム研究、Google effect、メタ分析、近年のスポーツ・医療チーム研究まで辿る。最初は「記憶の外注」だと思っていたが、調べるほど、これは専門化・信頼・協調を含む、人と人のあいだに成立する記憶システムに見えてきた。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/transactive-memory-who-knows-what?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/transactive-memory-who-knows-what?lang=ja");</script></body></html>

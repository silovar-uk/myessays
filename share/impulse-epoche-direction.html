<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>思いつきだけでは、道にならない――衝動とエポケーのあいだ</title><meta name="description" content="思いついて咄嗟にやりたいことへ動く力は、探索や発見の源になる。しかし、その瞬間ごとの魅力だけを積み重ねても、自分が進みたい方向へ自然に収束するとは限らない。エポケーという『いったん判断を止める』発想と、行動科学のimplementation intentionsを手がかりに、衝動を殺さず、立ち止まりも自己目的化せず、方向を選んで再び動くためのリズムを考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/impulse-epoche-direction.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/impulse-epoche-direction.html"><meta property="og:title" content="思いつきだけでは、道にならない――衝動とエポケーのあいだ"><meta property="og:description" content="思いついて咄嗟にやりたいことへ動く力は、探索や発見の源になる。しかし、その瞬間ごとの魅力だけを積み重ねても、自分が進みたい方向へ自然に収束するとは限らない。エポケーという『いったん判断を止める』発想と、行動科学のimplementation intentionsを手がかりに、衝動を殺さず、立ち止まりも自己目的化せず、方向を選んで再び動くためのリズムを考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="思いつきだけでは、道にならない――衝動とエポケーのあいだ"><meta name="twitter:description" content="思いついて咄嗟にやりたいことへ動く力は、探索や発見の源になる。しかし、その瞬間ごとの魅力だけを積み重ねても、自分が進みたい方向へ自然に収束するとは限らない。エポケーという『いったん判断を止める』発想と、行動科学のimplementation intentionsを手がかりに、衝動を殺さず、立ち止まりも自己目的化せず、方向を選んで再び動くためのリズムを考える。"></head><body><main><article><h1>思いつきだけでは、道にならない――衝動とエポケーのあいだ</h1><p>思いついて咄嗟にやりたいことへ動く力は、探索や発見の源になる。しかし、その瞬間ごとの魅力だけを積み重ねても、自分が進みたい方向へ自然に収束するとは限らない。エポケーという『いったん判断を止める』発想と、行動科学のimplementation intentionsを手がかりに、衝動を殺さず、立ち止まりも自己目的化せず、方向を選んで再び動くためのリズムを考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/impulse-epoche-direction?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/impulse-epoche-direction?lang=ja");</script></body></html>

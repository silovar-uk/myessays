<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マリオはクッパと戦わなくてよかった――The Art of Making, 宮本茂を読む</title><meta name="description" content="One of Mario&#39;s great inventions was not having to fight Bowser. 文化勲章を受ける宮本茂氏が語った逆説を入口に、Wiiのapproachability、DSの教育利用、ルーヴルのaudio guideを一次資料で検証する。生成AI時代のmakingとmere executionの違いを考え、人が次の一手を自分で試したくなる仕組みこそ創造の重要な対象ではないか、という仮説へ進む。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/miyamoto-bowser-not-fighting-creation-ai-2026.en.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/miyamoto-bowser-not-fighting-creation-ai-2026.en.html"><meta property="og:title" content="マリオはクッパと戦わなくてよかった――The Art of Making, 宮本茂を読む"><meta property="og:description" content="One of Mario&#39;s great inventions was not having to fight Bowser. 文化勲章を受ける宮本茂氏が語った逆説を入口に、Wiiのapproachability、DSの教育利用、ルーヴルのaudio guideを一次資料で検証する。生成AI時代のmakingとmere executionの違いを考え、人が次の一手を自分で試したくなる仕組みこそ創造の重要な対象ではないか、という仮説へ進む。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="マリオはクッパと戦わなくてよかった――The Art of Making, 宮本茂を読む"><meta name="twitter:description" content="One of Mario&#39;s great inventions was not having to fight Bowser. 文化勲章を受ける宮本茂氏が語った逆説を入口に、Wiiのapproachability、DSの教育利用、ルーヴルのaudio guideを一次資料で検証する。生成AI時代のmakingとmere executionの違いを考え、人が次の一手を自分で試したくなる仕組みこそ創造の重要な対象ではないか、という仮説へ進む。"></head><body><main><article><h1>マリオはクッパと戦わなくてよかった――The Art of Making, 宮本茂を読む</h1><p>One of Mario&#39;s great inventions was not having to fight Bowser. 文化勲章を受ける宮本茂氏が語った逆説を入口に、Wiiのapproachability、DSの教育利用、ルーヴルのaudio guideを一次資料で検証する。生成AI時代のmakingとmere executionの違いを考え、人が次の一手を自分で試したくなる仕組みこそ創造の重要な対象ではないか、という仮説へ進む。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/miyamoto-bowser-not-fighting-creation-ai-2026?lang=en">My Essaysで本文を読む</a></p></article></main><script

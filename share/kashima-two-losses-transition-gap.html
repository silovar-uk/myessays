<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鹿島の2連敗は、同じ負けではない。水戸に壊され、浦和には止められた。</title><meta name="description" content="鹿島は水戸に2-4、浦和に0-1で敗れて2連敗となった。ただ、二つを『守備が不安定』でまとめると本質を落とす。水戸戦で突かれたのは、前へ出たあとにボールを失った瞬間のカバー。浦和戦で詰まったのは、相手の3バックとプレスバックに対して空いた場所を見つけ、攻撃のテンポを変えるまでの時間だった。共通する課題を『局面をまたぐ接続速度』として整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/kashima-two-losses-transition-gap.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/kashima-two-losses-transition-gap.html"><meta property="og:title" content="鹿島の2連敗は、同じ負けではない。水戸に壊され、浦和には止められた。"><meta property="og:description" content="鹿島は水戸に2-4、浦和に0-1で敗れて2連敗となった。ただ、二つを『守備が不安定』でまとめると本質を落とす。水戸戦で突かれたのは、前へ出たあとにボールを失った瞬間のカバー。浦和戦で詰まったのは、相手の3バックとプレスバックに対して空いた場所を見つけ、攻撃のテンポを変えるまでの時間だった。共通する課題を『局面をまたぐ接続速度』として整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="鹿島の2連敗は、同じ負けではない。水戸に壊され、浦和には止められた。"><meta name="twitter:description" content="鹿島は水戸に2-4、浦和に0-1で敗れて2連敗となった。ただ、二つを『守備が不安定』でまとめると本質を落とす。水戸戦で突かれたのは、前へ出たあとにボールを失った瞬間のカバー。浦和戦で詰まったのは、相手の3バックとプレスバックに対して空いた場所を見つけ、攻撃のテンポを変えるまでの時間だった。共通する課題を『局面をまたぐ接続速度』として整理する。"></head><body><main><article><h1>鹿島の2連敗は、同じ負けではない。水戸に壊され、浦和には止められた。</h1><p>鹿島は水戸に2-4、浦和に0-1で敗れて2連敗となった。ただ、二つを『守備が不安定』でまとめると本質を落とす。水戸戦で突かれたのは、前へ出たあとにボールを失った瞬間のカバー。浦和戦で詰まったのは、相手の3バックとプレスバックに対して空いた場所を見つけ、攻撃のテンポを変えるまでの時間だった。共通する課題を『局面をまたぐ接続速度』として整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/kashima-two-losses-transition-gap?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/kashima-two-losses-transition-gap?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>驚喜をつくる</title><meta name="description" content="『驚喜』という言葉を、自分が大切にしたい行動原則として捉え直す。驚かせること自体を目的にするのではなく、相手をよく見たうえで期待を少しだけ越え、思わず嬉しくなる瞬間をつくる。辞書にある本来の意味、customer delight研究、親切の効果を過小評価しやすいという心理学研究を手がかりに、仕事や日常で再現できる『驚喜』の条件と、やりすぎないための境界線を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/kyoki-joyful-surprise.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/kyoki-joyful-surprise.html"><meta property="og:title" content="驚喜をつくる"><meta property="og:description" content="『驚喜』という言葉を、自分が大切にしたい行動原則として捉え直す。驚かせること自体を目的にするのではなく、相手をよく見たうえで期待を少しだけ越え、思わず嬉しくなる瞬間をつくる。辞書にある本来の意味、customer delight研究、親切の効果を過小評価しやすいという心理学研究を手がかりに、仕事や日常で再現できる『驚喜』の条件と、やりすぎないための境界線を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="驚喜をつくる"><meta name="twitter:description" content="『驚喜』という言葉を、自分が大切にしたい行動原則として捉え直す。驚かせること自体を目的にするのではなく、相手をよく見たうえで期待を少しだけ越え、思わず嬉しくなる瞬間をつくる。辞書にある本来の意味、customer delight研究、親切の効果を過小評価しやすいという心理学研究を手がかりに、仕事や日常で再現できる『驚喜』の条件と、やりすぎないための境界線を考える。"></head><body><main><article><h1>驚喜をつくる</h1><p>『驚喜』という言葉を、自分が大切にしたい行動原則として捉え直す。驚かせること自体を目的にするのではなく、相手をよく見たうえで期待を少しだけ越え、思わず嬉しくなる瞬間をつくる。辞書にある本来の意味、customer delight研究、親切の効果を過小評価しやすいという心理学研究を手がかりに、仕事や日常で再現できる『驚喜』の条件と、やりすぎないための境界線を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/kyoki-joyful-surprise?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/kyoki-joyful-surprise?lang=ja");</script></body></html>

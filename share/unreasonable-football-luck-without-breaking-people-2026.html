<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>理不尽を消さない――サッカーが教える、報われなさと人を壊さない境界</title><meta name="description" content="理不尽を大事にしたい。ただし、人が壊れない前提で。平安時代の用例から語の意味を確認し、サッカーの勝敗に働く偶然を研究で確かめる。努力が報われない経験と、暴力や恣意的判断による不当な扱いを分け、結果を制御できなくても挑む価値、人を守る境界、組織での実践まで考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/unreasonable-football-luck-without-breaking-people-2026.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/unreasonable-football-luck-without-breaking-people-2026.html"><meta property="og:title" content="理不尽を消さない――サッカーが教える、報われなさと人を壊さない境界"><meta property="og:description" content="理不尽を大事にしたい。ただし、人が壊れない前提で。平安時代の用例から語の意味を確認し、サッカーの勝敗に働く偶然を研究で確かめる。努力が報われない経験と、暴力や恣意的判断による不当な扱いを分け、結果を制御できなくても挑む価値、人を守る境界、組織での実践まで考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="理不尽を消さない――サッカーが教える、報われなさと人を壊さない境界"><meta name="twitter:description" content="理不尽を大事にしたい。ただし、人が壊れない前提で。平安時代の用例から語の意味を確認し、サッカーの勝敗に働く偶然を研究で確かめる。努力が報われない経験と、暴力や恣意的判断による不当な扱いを分け、結果を制御できなくても挑む価値、人を守る境界、組織での実践まで考える。"></head><body><main><article><h1>理不尽を消さない――サッカーが教える、報われなさと人を壊さない境界</h1><p>理不尽を大事にしたい。ただし、人が壊れない前提で。平安時代の用例から語の意味を確認し、サッカーの勝敗に働く偶然を研究で確かめる。努力が報われない経験と、暴力や恣意的判断による不当な扱いを分け、結果を制御できなくても挑む価値、人を守る境界、組織での実践まで考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/unreasonable-football-luck-without-breaking-people-2026?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/unreasonable-football-luck-without-breaking-people-2026?lang=ja");</script></body></html>

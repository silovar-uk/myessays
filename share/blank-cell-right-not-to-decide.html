<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空欄は「何もない」とは言っていない――一つの未回答が、平均点と人の立場を変えるまで</title><meta name="description" content="空欄にゼロを入れたら、平均点が十三点以上下がった。表計算と欠測データの扱いを一次資料で検証し、「まだ決められない」ことを何もないものにしてしまう仕組みの問題を考える。前作の「意味をもたせる／流す」から、他者の判断を勝手に確定しないための記録の作法へ進む。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/blank-cell-right-not-to-decide.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/blank-cell-right-not-to-decide.html"><meta property="og:title" content="空欄は「何もない」とは言っていない――一つの未回答が、平均点と人の立場を変えるまで"><meta property="og:description" content="空欄にゼロを入れたら、平均点が十三点以上下がった。表計算と欠測データの扱いを一次資料で検証し、「まだ決められない」ことを何もないものにしてしまう仕組みの問題を考える。前作の「意味をもたせる／流す」から、他者の判断を勝手に確定しないための記録の作法へ進む。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="空欄は「何もない」とは言っていない――一つの未回答が、平均点と人の立場を変えるまで"><meta name="twitter:description" content="空欄にゼロを入れたら、平均点が十三点以上下がった。表計算と欠測データの扱いを一次資料で検証し、「まだ決められない」ことを何もないものにしてしまう仕組みの問題を考える。前作の「意味をもたせる／流す」から、他者の判断を勝手に確定しないための記録の作法へ進む。"></head><body><main><article><h1>空欄は「何もない」とは言っていない――一つの未回答が、平均点と人の立場を変えるまで</h1><p>空欄にゼロを入れたら、平均点が十三点以上下がった。表計算と欠測データの扱いを一次資料で検証し、「まだ決められない」ことを何もないものにしてしまう仕組みの問題を考える。前作の「意味をもたせる／流す」から、他者の判断を勝手に確定しないための記録の作法へ進む。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/blank-cell-right-not-to-decide?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/blank-cell-right-not-to-decide?lang=ja");</script></body></html>

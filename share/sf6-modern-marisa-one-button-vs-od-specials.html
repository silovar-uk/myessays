<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2本払って、何を買っているのか</title><meta name="description" content="『Street Fighter 6』のモダン・マリーザでは、SP簡易入力の通常必殺技とOD必殺技は単純な下位版・上位版ではない。本稿は2026年8月調整後のグラディウス、ファランクス、クアドリガ、スクトゥムを比較し、簡易入力がダメージ20％と引き換えに反応速度と確実性を買い、ODがドライブ2本と引き換えにアーマー、壁やられ、ガード状況など技の性質を買う仕組みだと整理する。結論として、モダンの使い分けは『どの技が強いか』ではなく、時間・火力・ドライブ・確実性のどの通貨を今払うかという資源配分問題として理解できる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/sf6-modern-marisa-one-button-vs-od-specials.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/sf6-modern-marisa-one-button-vs-od-specials.html"><meta property="og:title" content="2本払って、何を買っているのか"><meta property="og:description" content="『Street Fighter 6』のモダン・マリーザでは、SP簡易入力の通常必殺技とOD必殺技は単純な下位版・上位版ではない。本稿は2026年8月調整後のグラディウス、ファランクス、クアドリガ、スクトゥムを比較し、簡易入力がダメージ20％と引き換えに反応速度と確実性を買い、ODがドライブ2本と引き換えにアーマー、壁やられ、ガード状況など技の性質を買う仕組みだと整理する。結論として、モダンの使い分けは『どの技が強いか』ではなく、時間・火力・ドライブ・確実性のどの通貨を今払うかという資源配分問題として理解できる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="2本払って、何を買っているのか"><meta name="twitter:description" content="『Street Fighter 6』のモダン・マリーザでは、SP簡易入力の通常必殺技とOD必殺技は単純な下位版・上位版ではない。本稿は2026年8月調整後のグラディウス、ファランクス、クアドリガ、スクトゥムを比較し、簡易入力がダメージ20％と引き換えに反応速度と確実性を買い、ODがドライブ2本と引き換えにアーマー、壁やられ、ガード状況など技の性質を買う仕組みだと整理する。結論として、モダンの使い分けは『どの技が強いか』ではなく、時間・火力・ドライブ・確実性のどの通貨を今払うかという資源配分問題として理解できる。"></head><body><main><article><h1>2本払って、何を買っているのか</h1><p>『Street Fighter 6』のモダン・マリーザでは、SP簡易入力の通常必殺技とOD必殺技は単純な下位版・上位版ではない。本稿は2026年8月調整後のグラディウス、ファランクス、クアドリガ、スクトゥムを比較し、簡易入力がダメージ20％と引き換えに反応速度と確実性を買い、ODがドライブ2本と引き換えにアーマー、壁やられ、ガード状況など技の性質を買う仕組みだと整理する。結論として、モダンの使い分けは『どの技が強いか』ではなく、時間・火力・ドライブ・確実性のどの通貨を今払うかという資源配分問題として理解できる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/sf6-modern-marisa-one-button-vs-od-specials?lang=ja">My Essaysで本文を読む</a></p></article></main><sc

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ドラフトとは何を配分する制度なのか</title><meta name="description" content="NPBのドラフトは何を配っているのか。第5回では、ドラフトを有望選手を選ぶイベントではなく、新人選手との契約交渉権を球団間へ配分する制度として読む。誰が対象になるのか、1巡目の競合をどう解くのか、2巡目以降の順番はどう作られるのか、指名後に何が残るのかを整理し、リーグが新人市場の競争ルールへどう介入しているかを考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/npb-draft-allocation-negotiation-rights.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/npb-draft-allocation-negotiation-rights.html"><meta property="og:title" content="ドラフトとは何を配分する制度なのか"><meta property="og:description" content="NPBのドラフトは何を配っているのか。第5回では、ドラフトを有望選手を選ぶイベントではなく、新人選手との契約交渉権を球団間へ配分する制度として読む。誰が対象になるのか、1巡目の競合をどう解くのか、2巡目以降の順番はどう作られるのか、指名後に何が残るのかを整理し、リーグが新人市場の競争ルールへどう介入しているかを考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="ドラフトとは何を配分する制度なのか"><meta name="twitter:description" content="NPBのドラフトは何を配っているのか。第5回では、ドラフトを有望選手を選ぶイベントではなく、新人選手との契約交渉権を球団間へ配分する制度として読む。誰が対象になるのか、1巡目の競合をどう解くのか、2巡目以降の順番はどう作られるのか、指名後に何が残るのかを整理し、リーグが新人市場の競争ルールへどう介入しているかを考える。"></head><body><main><article><h1>ドラフトとは何を配分する制度なのか</h1><p>NPBのドラフトは何を配っているのか。第5回では、ドラフトを有望選手を選ぶイベントではなく、新人選手との契約交渉権を球団間へ配分する制度として読む。誰が対象になるのか、1巡目の競合をどう解くのか、2巡目以降の順番はどう作られるのか、指名後に何が残るのかを整理し、リーグが新人市場の競争ルールへどう介入しているかを考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/npb-draft-allocation-negotiation-rights?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/npb-draft-allocation-negotiation-rights?lang=ja");</script></body></html>

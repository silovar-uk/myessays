<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSVPとは、文章を「場所」ではなく「時間」に並べる読み方である</title><meta name="description" content="RSVP（Rapid Serial Visual Presentation）は、語や刺激を同じ位置へ高速で順番に提示する方法である。速読アプリの仕組みとして知られる一方、もともとは視覚と注意の時間特性を調べる実験手法でもある。本稿では、通常の読書との違い、速く読める理由、サッカード・傍中心視・回帰読みを失う代償、研究上の限界、そして実用上どこで使うべきかを整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/rsvp-reading-time-as-a-conveyor-belt.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/rsvp-reading-time-as-a-conveyor-belt.html"><meta property="og:title" content="RSVPとは、文章を「場所」ではなく「時間」に並べる読み方である"><meta property="og:description" content="RSVP（Rapid Serial Visual Presentation）は、語や刺激を同じ位置へ高速で順番に提示する方法である。速読アプリの仕組みとして知られる一方、もともとは視覚と注意の時間特性を調べる実験手法でもある。本稿では、通常の読書との違い、速く読める理由、サッカード・傍中心視・回帰読みを失う代償、研究上の限界、そして実用上どこで使うべきかを整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="RSVPとは、文章を「場所」ではなく「時間」に並べる読み方である"><meta name="twitter:description" content="RSVP（Rapid Serial Visual Presentation）は、語や刺激を同じ位置へ高速で順番に提示する方法である。速読アプリの仕組みとして知られる一方、もともとは視覚と注意の時間特性を調べる実験手法でもある。本稿では、通常の読書との違い、速く読める理由、サッカード・傍中心視・回帰読みを失う代償、研究上の限界、そして実用上どこで使うべきかを整理する。"></head><body><main><article><h1>RSVPとは、文章を「場所」ではなく「時間」に並べる読み方である</h1><p>RSVP（Rapid Serial Visual Presentation）は、語や刺激を同じ位置へ高速で順番に提示する方法である。速読アプリの仕組みとして知られる一方、もともとは視覚と注意の時間特性を調べる実験手法でもある。本稿では、通常の読書との違い、速く読める理由、サッカード・傍中心視・回帰読みを失う代償、研究上の限界、そして実用上どこで使うべきかを整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/rsvp-reading-time-as-a-conveyor-belt?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/rsvp-reading-time-as-a-conveyor-belt?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凡事徹底は、凡事が正しいときだけ強い</title><meta name="description" content="『凡事徹底』は強い言葉だが、徹底する対象が良いルールであることを暗黙に前提としている。悪い手順を高い遵守率で回せば、間違いも高い再現性で発生する。WHOの手術安全チェックリストでさえ、導入には現場への適応、教育、フィードバック、リーダーシップが必要で、項目は具体的な行動に結びつき、実地テストされるべきだとされる。高信頼性組織も、規則への盲従ではなく、現場への感度、単純化への抵抗、専門知への委譲を重視する。凡事徹底とはルール設計の代わりではなく、良い標準を強くする倍率なのかもしれない。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/routine-excellence-good-rules-first.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/routine-excellence-good-rules-first.html"><meta property="og:title" content="凡事徹底は、凡事が正しいときだけ強い"><meta property="og:description" content="『凡事徹底』は強い言葉だが、徹底する対象が良いルールであることを暗黙に前提としている。悪い手順を高い遵守率で回せば、間違いも高い再現性で発生する。WHOの手術安全チェックリストでさえ、導入には現場への適応、教育、フィードバック、リーダーシップが必要で、項目は具体的な行動に結びつき、実地テストされるべきだとされる。高信頼性組織も、規則への盲従ではなく、現場への感度、単純化への抵抗、専門知への委譲を重視する。凡事徹底とはルール設計の代わりではなく、良い標準を強くする倍率なのかもしれない。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="凡事徹底は、凡事が正しいときだけ強い"><meta name="twitter:description" content="『凡事徹底』は強い言葉だが、徹底する対象が良いルールであることを暗黙に前提としている。悪い手順を高い遵守率で回せば、間違いも高い再現性で発生する。WHOの手術安全チェックリストでさえ、導入には現場への適応、教育、フィードバック、リーダーシップが必要で、項目は具体的な行動に結びつき、実地テストされるべきだとされる。高信頼性組織も、規則への盲従ではなく、現場への感度、単純化への抵抗、専門知への委譲を重視する。凡事徹底とはルール設計の代わりではなく、良い標準を強くする倍率なのかもしれない。"></head><body><main><article><h1>凡事徹底は、凡事が正しいときだけ強い</h1><p>『凡事徹底』は強い言葉だが、徹底する対象が良いルールであることを暗黙に前提としている。悪い手順を高い遵守率で回せば、間違いも高い再現性で発生する。WHOの手術安全チェックリストでさえ、導入には現場への適応、教育、フィードバック、リーダーシップが必要で、項目は具体的な行動に結びつき、実地テストされるべきだとされる。高信頼性組織も、規則への盲従ではなく、現場への感度、単純化への抵抗、専門知への委譲を重視する。凡事徹底とはルール設計の代わりではなく、良い標準を強くする倍率なのかもしれない。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/routine-excellence-good-rules-first?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/routine-excellence-good-rules-first?lang=ja");</script></body></html>

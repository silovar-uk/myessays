<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSSは中央と言っている。じゃあ誰がズレている？</title><meta name="description" content="CSSやFigmaでは中央に置かれているのに、Playアイコンが少しズレて見える。その違和感を入口に、Bounding-box center、geometric centroid、perceived centerを分け、輪郭・対称性・余白・視覚的重量が中心知覚にどう関わるかを研究と実務資料から整理する。TypographyのovershootとUIアイコンのoptical correctionを同一視せず、数値基準から管理された例外へ進む判断手順まで落とし込む。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-optical-alignment-what-is-center.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-optical-alignment-what-is-center.html"><meta property="og:title" content="CSSは中央と言っている。じゃあ誰がズレている？"><meta property="og:description" content="CSSやFigmaでは中央に置かれているのに、Playアイコンが少しズレて見える。その違和感を入口に、Bounding-box center、geometric centroid、perceived centerを分け、輪郭・対称性・余白・視覚的重量が中心知覚にどう関わるかを研究と実務資料から整理する。TypographyのovershootとUIアイコンのoptical correctionを同一視せず、数値基準から管理された例外へ進む判断手順まで落とし込む。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="CSSは中央と言っている。じゃあ誰がズレている？"><meta name="twitter:description" content="CSSやFigmaでは中央に置かれているのに、Playアイコンが少しズレて見える。その違和感を入口に、Bounding-box center、geometric centroid、perceived centerを分け、輪郭・対称性・余白・視覚的重量が中心知覚にどう関わるかを研究と実務資料から整理する。TypographyのovershootとUIアイコンのoptical correctionを同一視せず、数値基準から管理された例外へ進む判断手順まで落とし込む。"></head><body><main><article><h1>CSSは中央と言っている。じゃあ誰がズレている？</h1><p>CSSやFigmaでは中央に置かれているのに、Playアイコンが少しズレて見える。その違和感を入口に、Bounding-box center、geometric centroid、perceived centerを分け、輪郭・対称性・余白・視覚的重量が中心知覚にどう関わるかを研究と実務資料から整理する。TypographyのovershootとUIアイコンのoptical correctionを同一視せず、数値基準から管理された例外へ進む判断手順まで落とし込む。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-optical-alignment-what-is-center?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.

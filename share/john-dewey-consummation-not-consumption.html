<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消費 consumption の隣に、成就 consummation がある</title><meta name="description" content="consumption（消費）と consummation（成就）は、綴りが驚くほど似ている。しかしジョン・デューイが『Art as Experience』で重視したのは、経験を使い切ることではなく、ばらばらの出来事が関係を持ち、ひとまとまりの「一つの経験」へ成就することだった。作品、受け手、知覚、抵抗、連続性をたどりながら、エンタメを「糧にする」とは何かをもう一段深く考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/john-dewey-consummation-not-consumption.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/john-dewey-consummation-not-consumption.html"><meta property="og:title" content="消費 consumption の隣に、成就 consummation がある"><meta property="og:description" content="consumption（消費）と consummation（成就）は、綴りが驚くほど似ている。しかしジョン・デューイが『Art as Experience』で重視したのは、経験を使い切ることではなく、ばらばらの出来事が関係を持ち、ひとまとまりの「一つの経験」へ成就することだった。作品、受け手、知覚、抵抗、連続性をたどりながら、エンタメを「糧にする」とは何かをもう一段深く考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="消費 consumption の隣に、成就 consummation がある"><meta name="twitter:description" content="consumption（消費）と consummation（成就）は、綴りが驚くほど似ている。しかしジョン・デューイが『Art as Experience』で重視したのは、経験を使い切ることではなく、ばらばらの出来事が関係を持ち、ひとまとまりの「一つの経験」へ成就することだった。作品、受け手、知覚、抵抗、連続性をたどりながら、エンタメを「糧にする」とは何かをもう一段深く考える。"></head><body><main><article><h1>消費 consumption の隣に、成就 consummation がある</h1><p>consumption（消費）と consummation（成就）は、綴りが驚くほど似ている。しかしジョン・デューイが『Art as Experience』で重視したのは、経験を使い切ることではなく、ばらばらの出来事が関係を持ち、ひとまとまりの「一つの経験」へ成就することだった。作品、受け手、知覚、抵抗、連続性をたどりながら、エンタメを「糧にする」とは何かをもう一段深く考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/john-dewey-consummation-not-consumption?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/john-dewey-consummation-not-consumption?lang=ja");</script></body></html>

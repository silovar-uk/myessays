<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「3列にしてください」をやめたら、ブラウザーが勝手に4列にした</title><meta name="description" content="「PCは3列」という、ごく普通の制作指示を疑う。280px以上のカードを24pxのgapで並べると、584px、888px、1192pxという妙な幅で列数が自然に増える。CSS Gridのminmax()とauto-fit、Jen Simmonsが提案したIntrinsic Web Designをたどり、デザイナーの仕事を「完成形を指定すること」から「意味のある制約を設計すること」へ捉え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-intrinsic-web-design-three-columns.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-intrinsic-web-design-three-columns.html"><meta property="og:title" content="「3列にしてください」をやめたら、ブラウザーが勝手に4列にした"><meta property="og:description" content="「PCは3列」という、ごく普通の制作指示を疑う。280px以上のカードを24pxのgapで並べると、584px、888px、1192pxという妙な幅で列数が自然に増える。CSS Gridのminmax()とauto-fit、Jen Simmonsが提案したIntrinsic Web Designをたどり、デザイナーの仕事を「完成形を指定すること」から「意味のある制約を設計すること」へ捉え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「3列にしてください」をやめたら、ブラウザーが勝手に4列にした"><meta name="twitter:description" content="「PCは3列」という、ごく普通の制作指示を疑う。280px以上のカードを24pxのgapで並べると、584px、888px、1192pxという妙な幅で列数が自然に増える。CSS Gridのminmax()とauto-fit、Jen Simmonsが提案したIntrinsic Web Designをたどり、デザイナーの仕事を「完成形を指定すること」から「意味のある制約を設計すること」へ捉え直す。"></head><body><main><article><h1>「3列にしてください」をやめたら、ブラウザーが勝手に4列にした</h1><p>「PCは3列」という、ごく普通の制作指示を疑う。280px以上のカードを24pxのgapで並べると、584px、888px、1192pxという妙な幅で列数が自然に増える。CSS Gridのminmax()とauto-fit、Jen Simmonsが提案したIntrinsic Web Designをたどり、デザイナーの仕事を「完成形を指定すること」から「意味のある制約を設計すること」へ捉え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-intrinsic-web-design-three-columns?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-intrinsic-web-design-three-columns?lang=ja");</script></body></html>

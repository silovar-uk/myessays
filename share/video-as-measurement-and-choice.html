<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カメラが「見る道具」ではなくなる日</title><meta name="description" content="防犯カメラで客席の利用状況を読み、スマートフォンで関節の動きを測り、試合映像から別の視点をつくる。映像技術の先進事例を調べると、撮影した世界を再生するだけだったカメラが、現場の判断を支える装置へ変わりつつある。ただし、数字が出ることと正しい意思決定は同じではない。研究論文と開発元の公開情報、プライバシー指針を照合し、映像の新たな価値が生まれる条件を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/video-as-measurement-and-choice.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/video-as-measurement-and-choice.html"><meta property="og:title" content="カメラが「見る道具」ではなくなる日"><meta property="og:description" content="防犯カメラで客席の利用状況を読み、スマートフォンで関節の動きを測り、試合映像から別の視点をつくる。映像技術の先進事例を調べると、撮影した世界を再生するだけだったカメラが、現場の判断を支える装置へ変わりつつある。ただし、数字が出ることと正しい意思決定は同じではない。研究論文と開発元の公開情報、プライバシー指針を照合し、映像の新たな価値が生まれる条件を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="カメラが「見る道具」ではなくなる日"><meta name="twitter:description" content="防犯カメラで客席の利用状況を読み、スマートフォンで関節の動きを測り、試合映像から別の視点をつくる。映像技術の先進事例を調べると、撮影した世界を再生するだけだったカメラが、現場の判断を支える装置へ変わりつつある。ただし、数字が出ることと正しい意思決定は同じではない。研究論文と開発元の公開情報、プライバシー指針を照合し、映像の新たな価値が生まれる条件を考える。"></head><body><main><article><h1>カメラが「見る道具」ではなくなる日</h1><p>防犯カメラで客席の利用状況を読み、スマートフォンで関節の動きを測り、試合映像から別の視点をつくる。映像技術の先進事例を調べると、撮影した世界を再生するだけだったカメラが、現場の判断を支える装置へ変わりつつある。ただし、数字が出ることと正しい意思決定は同じではない。研究論文と開発元の公開情報、プライバシー指針を照合し、映像の新たな価値が生まれる条件を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/video-as-measurement-and-choice?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/video-as-measurement-and-choice?lang=ja");</script></body></html>

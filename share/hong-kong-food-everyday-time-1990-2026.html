<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港の食卓には、なぜ二つの時計があるのか</title><meta name="description" content="香港の食文化を『中国料理と西洋料理の融合』と呼ぶだけでは、暮らしの核心を取り逃がす。短時間で食べる茶餐廳、会話の時間を分け合う飲茶、朝の食材を買う街市、屋台の変化、無形文化遺産の保護を1990年以降の都市生活につなぎ、香港の料理を人々が時間と場所を使うための知恵として読み直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/hong-kong-food-everyday-time-1990-2026.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/hong-kong-food-everyday-time-1990-2026.html"><meta property="og:title" content="香港の食卓には、なぜ二つの時計があるのか"><meta property="og:description" content="香港の食文化を『中国料理と西洋料理の融合』と呼ぶだけでは、暮らしの核心を取り逃がす。短時間で食べる茶餐廳、会話の時間を分け合う飲茶、朝の食材を買う街市、屋台の変化、無形文化遺産の保護を1990年以降の都市生活につなぎ、香港の料理を人々が時間と場所を使うための知恵として読み直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="香港の食卓には、なぜ二つの時計があるのか"><meta name="twitter:description" content="香港の食文化を『中国料理と西洋料理の融合』と呼ぶだけでは、暮らしの核心を取り逃がす。短時間で食べる茶餐廳、会話の時間を分け合う飲茶、朝の食材を買う街市、屋台の変化、無形文化遺産の保護を1990年以降の都市生活につなぎ、香港の料理を人々が時間と場所を使うための知恵として読み直す。"></head><body><main><article><h1>香港の食卓には、なぜ二つの時計があるのか</h1><p>香港の食文化を『中国料理と西洋料理の融合』と呼ぶだけでは、暮らしの核心を取り逃がす。短時間で食べる茶餐廳、会話の時間を分け合う飲茶、朝の食材を買う街市、屋台の変化、無形文化遺産の保護を1990年以降の都市生活につなぎ、香港の料理を人々が時間と場所を使うための知恵として読み直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/hong-kong-food-everyday-time-1990-2026?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/hong-kong-food-everyday-time-1990-2026?lang=ja");</script></body></html>

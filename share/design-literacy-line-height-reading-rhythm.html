<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line Height――行間は『空白』ではなく、行を分けながら文章をつなぐ距離</title><meta name="description" content="Line Heightを、単なる『空白の量』ではなく、各行を区別しながらparagraphとしてのまとまりを保つ距離として捉える。USWDSの実践的なline-height guidanceとWCAG 1.4.12の適応可能性を混同せず、活版印刷のleadingからWeb typography、Proximity、Measureまでを一本につなぐ。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-line-height-reading-rhythm.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-line-height-reading-rhythm.html"><meta property="og:title" content="Line Height――行間は『空白』ではなく、行を分けながら文章をつなぐ距離"><meta property="og:description" content="Line Heightを、単なる『空白の量』ではなく、各行を区別しながらparagraphとしてのまとまりを保つ距離として捉える。USWDSの実践的なline-height guidanceとWCAG 1.4.12の適応可能性を混同せず、活版印刷のleadingからWeb typography、Proximity、Measureまでを一本につなぐ。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Line Height――行間は『空白』ではなく、行を分けながら文章をつなぐ距離"><meta name="twitter:description" content="Line Heightを、単なる『空白の量』ではなく、各行を区別しながらparagraphとしてのまとまりを保つ距離として捉える。USWDSの実践的なline-height guidanceとWCAG 1.4.12の適応可能性を混同せず、活版印刷のleadingからWeb typography、Proximity、Measureまでを一本につなぐ。"></head><body><main><article><h1>Line Height――行間は『空白』ではなく、行を分けながら文章をつなぐ距離</h1><p>Line Heightを、単なる『空白の量』ではなく、各行を区別しながらparagraphとしてのまとまりを保つ距離として捉える。USWDSの実践的なline-height guidanceとWCAG 1.4.12の適応可能性を混同せず、活版印刷のleadingからWeb typography、Proximity、Measureまでを一本につなぐ。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-line-height-reading-rhythm?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-line-height-reading-rhythm?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中村修三は、なぜ二度GMになったのか</title><meta name="description" content="中村修三は2006〜08年と2018〜19年、二度にわたり浦和レッズのGMを務めた。最初の在任期にはJ1初優勝とACL初制覇、二度目には天皇杯優勝とACL準優勝がある一方、両時代とも最後にはチームづくりの難しさが露出した。彼を英雄か失敗者かに分類するのではなく、その発言とクラブの組織変更を追うことで、浦和が「強い人が正しく決める強化」から「誰が担当しても続く強化」へ移ろうとした過程を読む。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/shuzo-nakamura-urawa-gm-person-and-system.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/shuzo-nakamura-urawa-gm-person-and-system.html"><meta property="og:title" content="中村修三は、なぜ二度GMになったのか"><meta property="og:description" content="中村修三は2006〜08年と2018〜19年、二度にわたり浦和レッズのGMを務めた。最初の在任期にはJ1初優勝とACL初制覇、二度目には天皇杯優勝とACL準優勝がある一方、両時代とも最後にはチームづくりの難しさが露出した。彼を英雄か失敗者かに分類するのではなく、その発言とクラブの組織変更を追うことで、浦和が「強い人が正しく決める強化」から「誰が担当しても続く強化」へ移ろうとした過程を読む。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="中村修三は、なぜ二度GMになったのか"><meta name="twitter:description" content="中村修三は2006〜08年と2018〜19年、二度にわたり浦和レッズのGMを務めた。最初の在任期にはJ1初優勝とACL初制覇、二度目には天皇杯優勝とACL準優勝がある一方、両時代とも最後にはチームづくりの難しさが露出した。彼を英雄か失敗者かに分類するのではなく、その発言とクラブの組織変更を追うことで、浦和が「強い人が正しく決める強化」から「誰が担当しても続く強化」へ移ろうとした過程を読む。"></head><body><main><article><h1>中村修三は、なぜ二度GMになったのか</h1><p>中村修三は2006〜08年と2018〜19年、二度にわたり浦和レッズのGMを務めた。最初の在任期にはJ1初優勝とACL初制覇、二度目には天皇杯優勝とACL準優勝がある一方、両時代とも最後にはチームづくりの難しさが露出した。彼を英雄か失敗者かに分類するのではなく、その発言とクラブの組織変更を追うことで、浦和が「強い人が正しく決める強化」から「誰が担当しても続く強化」へ移ろうとした過程を読む。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/shuzo-nakamura-urawa-gm-person-and-system?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/shuzo-nakamura-urawa-gm-person-and-system?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キッザニアでは何を体験できる？――「仕事体験」より広い、小さな社会の一日</title><meta name="description" content="キッザニアは、子どもが制服を着いて職業をまねるだけの施設ではない。子ども自身が仕事やサービスを選び、予約し、20〜40分ほどの体験に参加し、専用通貨キッゾを受け取り、使ったり貯めたりしながら次の行動を決める。消防士、警察官、医師、裁判所、ピザ職人、ゲームクリエイター、パイロット、銀行など幅広い体験を、『小さな社会を一周する仕組み』として整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/kidzania-experience-small-society-loop.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/kidzania-experience-small-society-loop.html"><meta property="og:title" content="キッザニアでは何を体験できる？――「仕事体験」より広い、小さな社会の一日"><meta property="og:description" content="キッザニアは、子どもが制服を着いて職業をまねるだけの施設ではない。子ども自身が仕事やサービスを選び、予約し、20〜40分ほどの体験に参加し、専用通貨キッゾを受け取り、使ったり貯めたりしながら次の行動を決める。消防士、警察官、医師、裁判所、ピザ職人、ゲームクリエイター、パイロット、銀行など幅広い体験を、『小さな社会を一周する仕組み』として整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="キッザニアでは何を体験できる？――「仕事体験」より広い、小さな社会の一日"><meta name="twitter:description" content="キッザニアは、子どもが制服を着いて職業をまねるだけの施設ではない。子ども自身が仕事やサービスを選び、予約し、20〜40分ほどの体験に参加し、専用通貨キッゾを受け取り、使ったり貯めたりしながら次の行動を決める。消防士、警察官、医師、裁判所、ピザ職人、ゲームクリエイター、パイロット、銀行など幅広い体験を、『小さな社会を一周する仕組み』として整理する。"></head><body><main><article><h1>キッザニアでは何を体験できる？――「仕事体験」より広い、小さな社会の一日</h1><p>キッザニアは、子どもが制服を着いて職業をまねるだけの施設ではない。子ども自身が仕事やサービスを選び、予約し、20〜40分ほどの体験に参加し、専用通貨キッゾを受け取り、使ったり貯めたりしながら次の行動を決める。消防士、警察官、医師、裁判所、ピザ職人、ゲームクリエイター、パイロット、銀行など幅広い体験を、『小さな社会を一周する仕組み』として整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/kidzania-experience-small-society-loop?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/kidzania-experience-small-society-loop?lang=ja");</script></body></html>

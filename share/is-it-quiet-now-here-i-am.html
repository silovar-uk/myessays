<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「今って静か？」と聞くと、頭の中にもう一人現れる</title><meta name="description" content="頭の中がうるさいとき、自分に「今って静か？」と尋ねてみる。静かではないのに、なぜか自分の現在地が少し見える。この妙な問いを、白い熊を考えない実験、注意のさまよいと気づきの研究、感覚へ戻る方法から考える。六通りの場面比較を通じ、静けさを獲得することと、騒がしさを観察できることの違いを探る。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/is-it-quiet-now-here-i-am.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/is-it-quiet-now-here-i-am.html"><meta property="og:title" content="「今って静か？」と聞くと、頭の中にもう一人現れる"><meta property="og:description" content="頭の中がうるさいとき、自分に「今って静か？」と尋ねてみる。静かではないのに、なぜか自分の現在地が少し見える。この妙な問いを、白い熊を考えない実験、注意のさまよいと気づきの研究、感覚へ戻る方法から考える。六通りの場面比較を通じ、静けさを獲得することと、騒がしさを観察できることの違いを探る。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「今って静か？」と聞くと、頭の中にもう一人現れる"><meta name="twitter:description" content="頭の中がうるさいとき、自分に「今って静か？」と尋ねてみる。静かではないのに、なぜか自分の現在地が少し見える。この妙な問いを、白い熊を考えない実験、注意のさまよいと気づきの研究、感覚へ戻る方法から考える。六通りの場面比較を通じ、静けさを獲得することと、騒がしさを観察できることの違いを探る。"></head><body><main><article><h1>「今って静か？」と聞くと、頭の中にもう一人現れる</h1><p>頭の中がうるさいとき、自分に「今って静か？」と尋ねてみる。静かではないのに、なぜか自分の現在地が少し見える。この妙な問いを、白い熊を考えない実験、注意のさまよいと気づきの研究、感覚へ戻る方法から考える。六通りの場面比較を通じ、静けさを獲得することと、騒がしさを観察できることの違いを探る。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/is-it-quiet-now-here-i-am?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/is-it-quiet-now-here-i-am?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>油は煙が出る前から壊れている――「中火で温める」の理由を分子まで追う</title><meta name="description" content="レシピにさらっと書かれる『油を中火で温める』は、何を守っているのか。最初は発煙点を超えないためだと思ったが、調べると油の変化は煙が出る前から始まっていた。加熱された油では主に酸化・加水分解・重合が進み、元の油とは違う分子が少しずつ増えていく。一方で、加熱した瞬間に危険になるわけでもなく、少量の酸化生成物は揚げ物らしい風味にも関わる。『中火』は安全温度の名前ではなく、必要以上に高温へ飛ばさず、料理人が温度を制御するための操作なのだと分かった。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/cooking-oil-degradation-before-smoke.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/cooking-oil-degradation-before-smoke.html"><meta property="og:title" content="油は煙が出る前から壊れている――「中火で温める」の理由を分子まで追う"><meta property="og:description" content="レシピにさらっと書かれる『油を中火で温める』は、何を守っているのか。最初は発煙点を超えないためだと思ったが、調べると油の変化は煙が出る前から始まっていた。加熱された油では主に酸化・加水分解・重合が進み、元の油とは違う分子が少しずつ増えていく。一方で、加熱した瞬間に危険になるわけでもなく、少量の酸化生成物は揚げ物らしい風味にも関わる。『中火』は安全温度の名前ではなく、必要以上に高温へ飛ばさず、料理人が温度を制御するための操作なのだと分かった。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="油は煙が出る前から壊れている――「中火で温める」の理由を分子まで追う"><meta name="twitter:description" content="レシピにさらっと書かれる『油を中火で温める』は、何を守っているのか。最初は発煙点を超えないためだと思ったが、調べると油の変化は煙が出る前から始まっていた。加熱された油では主に酸化・加水分解・重合が進み、元の油とは違う分子が少しずつ増えていく。一方で、加熱した瞬間に危険になるわけでもなく、少量の酸化生成物は揚げ物らしい風味にも関わる。『中火』は安全温度の名前ではなく、必要以上に高温へ飛ばさず、料理人が温度を制御するための操作なのだと分かった。"></head><body><main><article><h1>油は煙が出る前から壊れている――「中火で温める」の理由を分子まで追う</h1><p>レシピにさらっと書かれる『油を中火で温める』は、何を守っているのか。最初は発煙点を超えないためだと思ったが、調べると油の変化は煙が出る前から始まっていた。加熱された油では主に酸化・加水分解・重合が進み、元の油とは違う分子が少しずつ増えていく。一方で、加熱した瞬間に危険になるわけでもなく、少量の酸化生成物は揚げ物らしい風味にも関わる。『中火』は安全温度の名前ではなく、必要以上に高温へ飛ばさず、料理人が温度を制御するための操作なのだと分かった。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/cooking-oil-degradation-before-smoke?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/cooking-oil-degradation-before-smoke?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PowerPointを開く前に、9個の箱を描く――コンサルの「9マス」は何をしているのか</title><meta name="description" content="コンサルの『9マス』は、テーマを9分類するフレームワークではない。ホワイトボードを3×3に区切り、9枚のスライドを作る前に全体の流れを仮置きする資料設計の技法として紹介されている。空のPowerPointから一枚ずつ作る場合と何が違うのかを、架空の来場促進提案で実験しながら考える。最後に重要なのは9マスを完成させることではなく、いったん作った設計図を『半分だけ信じる』ことだった。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/consulting-nine-masu-storyboard.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/consulting-nine-masu-storyboard.html"><meta property="og:title" content="PowerPointを開く前に、9個の箱を描く――コンサルの「9マス」は何をしているのか"><meta property="og:description" content="コンサルの『9マス』は、テーマを9分類するフレームワークではない。ホワイトボードを3×3に区切り、9枚のスライドを作る前に全体の流れを仮置きする資料設計の技法として紹介されている。空のPowerPointから一枚ずつ作る場合と何が違うのかを、架空の来場促進提案で実験しながら考える。最後に重要なのは9マスを完成させることではなく、いったん作った設計図を『半分だけ信じる』ことだった。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="PowerPointを開く前に、9個の箱を描く――コンサルの「9マス」は何をしているのか"><meta name="twitter:description" content="コンサルの『9マス』は、テーマを9分類するフレームワークではない。ホワイトボードを3×3に区切り、9枚のスライドを作る前に全体の流れを仮置きする資料設計の技法として紹介されている。空のPowerPointから一枚ずつ作る場合と何が違うのかを、架空の来場促進提案で実験しながら考える。最後に重要なのは9マスを完成させることではなく、いったん作った設計図を『半分だけ信じる』ことだった。"></head><body><main><article><h1>PowerPointを開く前に、9個の箱を描く――コンサルの「9マス」は何をしているのか</h1><p>コンサルの『9マス』は、テーマを9分類するフレームワークではない。ホワイトボードを3×3に区切り、9枚のスライドを作る前に全体の流れを仮置きする資料設計の技法として紹介されている。空のPowerPointから一枚ずつ作る場合と何が違うのかを、架空の来場促進提案で実験しながら考える。最後に重要なのは9マスを完成させることではなく、いったん作った設計図を『半分だけ信じる』ことだった。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/consulting-nine-masu-storyboard?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/consulting-nine-masu-storyboard?lang=ja");</script></body></html>

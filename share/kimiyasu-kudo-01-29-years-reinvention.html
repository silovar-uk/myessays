<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29年も投げた、では足りない――工藤公康は何回「別の投手」になったのか</title><meta name="description" content="工藤公康の現役生活は1982年から2010年まで実働29年、通算224勝。だが年度別成績を追うと、29年間ずっと同じ投手だったわけではない。先発エース、移籍先の柱、40代の先発、46歳の中継ぎ。大きな不調からの復活も何度もある。長寿を『丈夫だったから』で終わらせず、身体管理と役割変更を含むre-inventionの連続として読み直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/kimiyasu-kudo-01-29-years-reinvention.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/kimiyasu-kudo-01-29-years-reinvention.html"><meta property="og:title" content="29年も投げた、では足りない――工藤公康は何回「別の投手」になったのか"><meta property="og:description" content="工藤公康の現役生活は1982年から2010年まで実働29年、通算224勝。だが年度別成績を追うと、29年間ずっと同じ投手だったわけではない。先発エース、移籍先の柱、40代の先発、46歳の中継ぎ。大きな不調からの復活も何度もある。長寿を『丈夫だったから』で終わらせず、身体管理と役割変更を含むre-inventionの連続として読み直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="29年も投げた、では足りない――工藤公康は何回「別の投手」になったのか"><meta name="twitter:description" content="工藤公康の現役生活は1982年から2010年まで実働29年、通算224勝。だが年度別成績を追うと、29年間ずっと同じ投手だったわけではない。先発エース、移籍先の柱、40代の先発、46歳の中継ぎ。大きな不調からの復活も何度もある。長寿を『丈夫だったから』で終わらせず、身体管理と役割変更を含むre-inventionの連続として読み直す。"></head><body><main><article><h1>29年も投げた、では足りない――工藤公康は何回「別の投手」になったのか</h1><p>工藤公康の現役生活は1982年から2010年まで実働29年、通算224勝。だが年度別成績を追うと、29年間ずっと同じ投手だったわけではない。先発エース、移籍先の柱、40代の先発、46歳の中継ぎ。大きな不調からの復活も何度もある。長寿を『丈夫だったから』で終わらせず、身体管理と役割変更を含むre-inventionの連続として読み直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/kimiyasu-kudo-01-29-years-reinvention?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/kimiyasu-kudo-01-29-years-reinvention?lang=ja");</script></body></html>

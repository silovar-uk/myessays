<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>どうにもならない条件まで、自分の仕事にしない――荘子「知其不可奈何而安之若命」</title><meta name="description" content="『荘子』内篇「人間世」の「知其不可奈何而安之若命」を、葉公子高が重い使節任務を前に心身を消耗する文脈から読む。単純な「変えられないものは諦める」という話ではなく、避けがたい役割や条件のなかで成否への恐怖に心まで支配されないことを考え、現代の仕事における責務・不確実性・対応可能範囲の切り分けへ接続する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/zhuangzi-accepting-unavoidable-conditions.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/zhuangzi-accepting-unavoidable-conditions.html"><meta property="og:title" content="どうにもならない条件まで、自分の仕事にしない――荘子「知其不可奈何而安之若命」"><meta property="og:description" content="『荘子』内篇「人間世」の「知其不可奈何而安之若命」を、葉公子高が重い使節任務を前に心身を消耗する文脈から読む。単純な「変えられないものは諦める」という話ではなく、避けがたい役割や条件のなかで成否への恐怖に心まで支配されないことを考え、現代の仕事における責務・不確実性・対応可能範囲の切り分けへ接続する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="どうにもならない条件まで、自分の仕事にしない――荘子「知其不可奈何而安之若命」"><meta name="twitter:description" content="『荘子』内篇「人間世」の「知其不可奈何而安之若命」を、葉公子高が重い使節任務を前に心身を消耗する文脈から読む。単純な「変えられないものは諦める」という話ではなく、避けがたい役割や条件のなかで成否への恐怖に心まで支配されないことを考え、現代の仕事における責務・不確実性・対応可能範囲の切り分けへ接続する。"></head><body><main><article><h1>どうにもならない条件まで、自分の仕事にしない――荘子「知其不可奈何而安之若命」</h1><p>『荘子』内篇「人間世」の「知其不可奈何而安之若命」を、葉公子高が重い使節任務を前に心身を消耗する文脈から読む。単純な「変えられないものは諦める」という話ではなく、避けがたい役割や条件のなかで成否への恐怖に心まで支配されないことを考え、現代の仕事における責務・不確実性・対応可能範囲の切り分けへ接続する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/zhuangzi-accepting-unavoidable-conditions?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/zhuangzi-accepting-unavoidable-conditions?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAM・SAM・SOMは「誰を狙うか」を決めてくれない</title><meta name="description" content="TAM・SAM・SOMは三重の円で描かれるため、一番内側のSOMを「ターゲット」と理解しやすい。しかし市場規模を測るTAM・SAM・SOMと、STPで「誰を優先するか」を選ぶ標的設定は別の問いである。公式・実務資料の定義揺れまで確認し、「市場はどれだけあるか」「どこまで提供できるか」「誰に集中するか」「どこまで獲得できるか」の四つに分解する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/tam-sam-som-target-is-not-the-center.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/tam-sam-som-target-is-not-the-center.html"><meta property="og:title" content="TAM・SAM・SOMは「誰を狙うか」を決めてくれない"><meta property="og:description" content="TAM・SAM・SOMは三重の円で描かれるため、一番内側のSOMを「ターゲット」と理解しやすい。しかし市場規模を測るTAM・SAM・SOMと、STPで「誰を優先するか」を選ぶ標的設定は別の問いである。公式・実務資料の定義揺れまで確認し、「市場はどれだけあるか」「どこまで提供できるか」「誰に集中するか」「どこまで獲得できるか」の四つに分解する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="TAM・SAM・SOMは「誰を狙うか」を決めてくれない"><meta name="twitter:description" content="TAM・SAM・SOMは三重の円で描かれるため、一番内側のSOMを「ターゲット」と理解しやすい。しかし市場規模を測るTAM・SAM・SOMと、STPで「誰を優先するか」を選ぶ標的設定は別の問いである。公式・実務資料の定義揺れまで確認し、「市場はどれだけあるか」「どこまで提供できるか」「誰に集中するか」「どこまで獲得できるか」の四つに分解する。"></head><body><main><article><h1>TAM・SAM・SOMは「誰を狙うか」を決めてくれない</h1><p>TAM・SAM・SOMは三重の円で描かれるため、一番内側のSOMを「ターゲット」と理解しやすい。しかし市場規模を測るTAM・SAM・SOMと、STPで「誰を優先するか」を選ぶ標的設定は別の問いである。公式・実務資料の定義揺れまで確認し、「市場はどれだけあるか」「どこまで提供できるか」「誰に集中するか」「どこまで獲得できるか」の四つに分解する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/tam-sam-som-target-is-not-the-center?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/tam-sam-som-target-is-not-the-center?lang=ja");</script></body></html>

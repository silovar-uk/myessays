<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alignmentは『揃える』ではなく、見えない関係線をつくる</title><meta name="description" content="Alignment（整列）を、単なる座標合わせではなく、離れた要素の間に見えない関係線をつくる操作として捉える。Gridとの違い、左端を共有するBefore/After、制作指示への落とし込み、数学的整列と視覚的整列の違いまでをつなぎ、Swiss Styleから現代UIへ戻る。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/design-literacy-alignment-invisible-relationships.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/design-literacy-alignment-invisible-relationships.html"><meta property="og:title" content="Alignmentは『揃える』ではなく、見えない関係線をつくる"><meta property="og:description" content="Alignment（整列）を、単なる座標合わせではなく、離れた要素の間に見えない関係線をつくる操作として捉える。Gridとの違い、左端を共有するBefore/After、制作指示への落とし込み、数学的整列と視覚的整列の違いまでをつなぎ、Swiss Styleから現代UIへ戻る。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Alignmentは『揃える』ではなく、見えない関係線をつくる"><meta name="twitter:description" content="Alignment（整列）を、単なる座標合わせではなく、離れた要素の間に見えない関係線をつくる操作として捉える。Gridとの違い、左端を共有するBefore/After、制作指示への落とし込み、数学的整列と視覚的整列の違いまでをつなぎ、Swiss Styleから現代UIへ戻る。"></head><body><main><article><h1>Alignmentは『揃える』ではなく、見えない関係線をつくる</h1><p>Alignment（整列）を、単なる座標合わせではなく、離れた要素の間に見えない関係線をつくる操作として捉える。Gridとの違い、左端を共有するBefore/After、制作指示への落とし込み、数学的整列と視覚的整列の違いまでをつなぎ、Swiss Styleから現代UIへ戻る。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/design-literacy-alignment-invisible-relationships?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/design-literacy-alignment-invisible-relationships?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>『椿姫』なのに、オペラでは椿がほぼ消えている</title><meta name="description" content="日本では『椿姫』。しかしヴェルディの原題はLa traviata、つまり『道を踏み外した女』に近い。では椿はどこへ行ったのか。デュマ・フィスの原作、1853年の台本、初演時の検閲、ヴィオレッタの声の変化まで追うと、花の名前が消えるほど社会のラベルが大きくなる、不思議な変換が見えてくる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/la-traviata-where-did-camellia-go.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/la-traviata-where-did-camellia-go.html"><meta property="og:title" content="『椿姫』なのに、オペラでは椿がほぼ消えている"><meta property="og:description" content="日本では『椿姫』。しかしヴェルディの原題はLa traviata、つまり『道を踏み外した女』に近い。では椿はどこへ行ったのか。デュマ・フィスの原作、1853年の台本、初演時の検閲、ヴィオレッタの声の変化まで追うと、花の名前が消えるほど社会のラベルが大きくなる、不思議な変換が見えてくる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="『椿姫』なのに、オペラでは椿がほぼ消えている"><meta name="twitter:description" content="日本では『椿姫』。しかしヴェルディの原題はLa traviata、つまり『道を踏み外した女』に近い。では椿はどこへ行ったのか。デュマ・フィスの原作、1853年の台本、初演時の検閲、ヴィオレッタの声の変化まで追うと、花の名前が消えるほど社会のラベルが大きくなる、不思議な変換が見えてくる。"></head><body><main><article><h1>『椿姫』なのに、オペラでは椿がほぼ消えている</h1><p>日本では『椿姫』。しかしヴェルディの原題はLa traviata、つまり『道を踏み外した女』に近い。では椿はどこへ行ったのか。デュマ・フィスの原作、1853年の台本、初演時の検閲、ヴィオレッタの声の変化まで追うと、花の名前が消えるほど社会のラベルが大きくなる、不思議な変換が見えてくる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/la-traviata-where-did-camellia-go?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/la-traviata-where-did-camellia-go?lang=ja");</script></body></html>

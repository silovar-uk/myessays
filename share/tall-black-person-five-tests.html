<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「あの背の高い黒人ね」は問題か――日常会話を5つのテストにかける</title><meta name="description" content="「ああ、あの背の高い黒人ね」という発話は、それだけで差別なのか。単語の禁止リストではなく、①必要性、②識別精度、③対称性、④本人・場面との整合、⑤属性からの推論、という5つのテストで考える。結論は、発話だけで話し手の思想を断定するのは強すぎる一方、人種が不要な場面で恒常的な目印になると、人をカテゴリーへ縮める作用が生まれる、というものだった。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/tall-black-person-five-tests.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/tall-black-person-five-tests.html"><meta property="og:title" content="「あの背の高い黒人ね」は問題か――日常会話を5つのテストにかける"><meta property="og:description" content="「ああ、あの背の高い黒人ね」という発話は、それだけで差別なのか。単語の禁止リストではなく、①必要性、②識別精度、③対称性、④本人・場面との整合、⑤属性からの推論、という5つのテストで考える。結論は、発話だけで話し手の思想を断定するのは強すぎる一方、人種が不要な場面で恒常的な目印になると、人をカテゴリーへ縮める作用が生まれる、というものだった。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「あの背の高い黒人ね」は問題か――日常会話を5つのテストにかける"><meta name="twitter:description" content="「ああ、あの背の高い黒人ね」という発話は、それだけで差別なのか。単語の禁止リストではなく、①必要性、②識別精度、③対称性、④本人・場面との整合、⑤属性からの推論、という5つのテストで考える。結論は、発話だけで話し手の思想を断定するのは強すぎる一方、人種が不要な場面で恒常的な目印になると、人をカテゴリーへ縮める作用が生まれる、というものだった。"></head><body><main><article><h1>「あの背の高い黒人ね」は問題か――日常会話を5つのテストにかける</h1><p>「ああ、あの背の高い黒人ね」という発話は、それだけで差別なのか。単語の禁止リストではなく、①必要性、②識別精度、③対称性、④本人・場面との整合、⑤属性からの推論、という5つのテストで考える。結論は、発話だけで話し手の思想を断定するのは強すぎる一方、人種が不要な場面で恒常的な目印になると、人をカテゴリーへ縮める作用が生まれる、というものだった。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/tall-black-person-five-tests?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/tall-black-person-five-tests?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コップは半分しか見えていないのに、なぜ「全部」を見た気になるのか</title><meta name="description" content="机の上のコップを見るとき、実際に目へ入っているのは片側だけなのに、私たちは迷わず『一個のコップ』を見る。現象学の入口を、難しい定義ではなく、この妙な事実から始める。フッサールの志向性と地平という考え方を手がかりに、経験は単なる感覚データの受信ではなく、見えていないものまで含んだ意味のまとまりとして世界へ向かっていることを考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/phenomenology-01-cup-horizon-intentionality.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/phenomenology-01-cup-horizon-intentionality.html"><meta property="og:title" content="コップは半分しか見えていないのに、なぜ「全部」を見た気になるのか"><meta property="og:description" content="机の上のコップを見るとき、実際に目へ入っているのは片側だけなのに、私たちは迷わず『一個のコップ』を見る。現象学の入口を、難しい定義ではなく、この妙な事実から始める。フッサールの志向性と地平という考え方を手がかりに、経験は単なる感覚データの受信ではなく、見えていないものまで含んだ意味のまとまりとして世界へ向かっていることを考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="コップは半分しか見えていないのに、なぜ「全部」を見た気になるのか"><meta name="twitter:description" content="机の上のコップを見るとき、実際に目へ入っているのは片側だけなのに、私たちは迷わず『一個のコップ』を見る。現象学の入口を、難しい定義ではなく、この妙な事実から始める。フッサールの志向性と地平という考え方を手がかりに、経験は単なる感覚データの受信ではなく、見えていないものまで含んだ意味のまとまりとして世界へ向かっていることを考える。"></head><body><main><article><h1>コップは半分しか見えていないのに、なぜ「全部」を見た気になるのか</h1><p>机の上のコップを見るとき、実際に目へ入っているのは片側だけなのに、私たちは迷わず『一個のコップ』を見る。現象学の入口を、難しい定義ではなく、この妙な事実から始める。フッサールの志向性と地平という考え方を手がかりに、経験は単なる感覚データの受信ではなく、見えていないものまで含んだ意味のまとまりとして世界へ向かっていることを考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/phenomenology-01-cup-horizon-intentionality?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/phenomenology-01-cup-horizon-intentionality?lang=ja");</script></body></html>

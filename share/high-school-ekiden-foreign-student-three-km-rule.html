<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「外国人留学生の特性」って何？――高校駅伝の3kmルールを本気で読む</title><meta name="description" content="全国高校駅伝では、外国人留学生が走れるのは男女とも3km区間だけである。大会実行委員会は2024年からの変更理由に「外国人留学生の特性」を挙げた。何の特性なのか。公式資料、当時の説明、過去の規制、箱根駅伝の記録、泉秀一『アフリカから来たランナーたち』を辿り、3kmという数字を四つの仮説でストレステストした。調べる前は「速すぎる選手を抑えるルール」に見えたが、調べた後には、競技・教育・資源格差・大会の物語を一つの短い区間に押し込めた妥協の形に見えてきた。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/high-school-ekiden-foreign-student-three-km-rule.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/high-school-ekiden-foreign-student-three-km-rule.html"><meta property="og:title" content="「外国人留学生の特性」って何？――高校駅伝の3kmルールを本気で読む"><meta property="og:description" content="全国高校駅伝では、外国人留学生が走れるのは男女とも3km区間だけである。大会実行委員会は2024年からの変更理由に「外国人留学生の特性」を挙げた。何の特性なのか。公式資料、当時の説明、過去の規制、箱根駅伝の記録、泉秀一『アフリカから来たランナーたち』を辿り、3kmという数字を四つの仮説でストレステストした。調べる前は「速すぎる選手を抑えるルール」に見えたが、調べた後には、競技・教育・資源格差・大会の物語を一つの短い区間に押し込めた妥協の形に見えてきた。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「外国人留学生の特性」って何？――高校駅伝の3kmルールを本気で読む"><meta name="twitter:description" content="全国高校駅伝では、外国人留学生が走れるのは男女とも3km区間だけである。大会実行委員会は2024年からの変更理由に「外国人留学生の特性」を挙げた。何の特性なのか。公式資料、当時の説明、過去の規制、箱根駅伝の記録、泉秀一『アフリカから来たランナーたち』を辿り、3kmという数字を四つの仮説でストレステストした。調べる前は「速すぎる選手を抑えるルール」に見えたが、調べた後には、競技・教育・資源格差・大会の物語を一つの短い区間に押し込めた妥協の形に見えてきた。"></head><body><main><article><h1>「外国人留学生の特性」って何？――高校駅伝の3kmルールを本気で読む</h1><p>全国高校駅伝では、外国人留学生が走れるのは男女とも3km区間だけである。大会実行委員会は2024年からの変更理由に「外国人留学生の特性」を挙げた。何の特性なのか。公式資料、当時の説明、過去の規制、箱根駅伝の記録、泉秀一『アフリカから来たランナーたち』を辿り、3kmという数字を四つの仮説でストレステストした。調べる前は「速すぎる選手を抑えるルール」に見えたが、調べた後には、競技・教育・資源格差・大会の物語を一つの短い区間に押し込めた妥協の形に見えてきた。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/high-school-ekiden-foreign-student-three-km-rule?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/high-school-ekiden-foreign-student-three-km-rule?lang=ja");</script></body></html>

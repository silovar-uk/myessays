<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマブラの極意は、技を喰らわないこと</title><meta name="description" content="スマブラで上達しようとすると、つい「何を当てるか」を増やしたくなる。だが別の見方がある。極意は、技を喰らわないことではないか。ただし、これは逃げ続けることでも回避を擦ることでもない。相手の攻撃が届かない位置を取り、空振りを作り、被弾から始まる不利展開そのものを減らす。本稿ではspacing、punish、shield、dodge staling、jugglingを手掛かりに、「喰らわない」を消極的な防御ではなく、次の意思決定権を守る技術として捉え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/smash-ultimate-dont-get-hit.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/smash-ultimate-dont-get-hit.html"><meta property="og:title" content="スマブラの極意は、技を喰らわないこと"><meta property="og:description" content="スマブラで上達しようとすると、つい「何を当てるか」を増やしたくなる。だが別の見方がある。極意は、技を喰らわないことではないか。ただし、これは逃げ続けることでも回避を擦ることでもない。相手の攻撃が届かない位置を取り、空振りを作り、被弾から始まる不利展開そのものを減らす。本稿ではspacing、punish、shield、dodge staling、jugglingを手掛かりに、「喰らわない」を消極的な防御ではなく、次の意思決定権を守る技術として捉え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="スマブラの極意は、技を喰らわないこと"><meta name="twitter:description" content="スマブラで上達しようとすると、つい「何を当てるか」を増やしたくなる。だが別の見方がある。極意は、技を喰らわないことではないか。ただし、これは逃げ続けることでも回避を擦ることでもない。相手の攻撃が届かない位置を取り、空振りを作り、被弾から始まる不利展開そのものを減らす。本稿ではspacing、punish、shield、dodge staling、jugglingを手掛かりに、「喰らわない」を消極的な防御ではなく、次の意思決定権を守る技術として捉え直す。"></head><body><main><article><h1>スマブラの極意は、技を喰らわないこと</h1><p>スマブラで上達しようとすると、つい「何を当てるか」を増やしたくなる。だが別の見方がある。極意は、技を喰らわないことではないか。ただし、これは逃げ続けることでも回避を擦ることでもない。相手の攻撃が届かない位置を取り、空振りを作り、被弾から始まる不利展開そのものを減らす。本稿ではspacing、punish、shield、dodge staling、jugglingを手掛かりに、「喰らわない」を消極的な防御ではなく、次の意思決定権を守る技術として捉え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/smash-ultimate-dont-get-hit?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/smash-ultimate-dont-get-hit?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>皮肉は知性の証明ではない――怒りを二重包装すると何が起きるか</title><meta name="description" content="アンガーマネジメントの本を読み、「怒りを皮肉で表す人は、直接怒りを伝える度胸も交渉能力も乏しいのに、皮肉を知性だと勘違いして相手を余計に傷つける」と自分なりに要約した瞬間、妙に身に覚えがあって喀血しかけた。しかし研究を追うと、皮肉は単純な未熟さではない。抽象思考や創造性を促し、信頼関係では衝突を増やさない場合もある一方、攻撃的ユーモアや間接的な不満伝達として働くこともある。本稿は、皮肉を禁止するのでなく、怒りを直接かつ非攻撃的に伝える選択肢を増やす問題として捉え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/sarcasm-anger-intelligence-direct-communication.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/sarcasm-anger-intelligence-direct-communication.html"><meta property="og:title" content="皮肉は知性の証明ではない――怒りを二重包装すると何が起きるか"><meta property="og:description" content="アンガーマネジメントの本を読み、「怒りを皮肉で表す人は、直接怒りを伝える度胸も交渉能力も乏しいのに、皮肉を知性だと勘違いして相手を余計に傷つける」と自分なりに要約した瞬間、妙に身に覚えがあって喀血しかけた。しかし研究を追うと、皮肉は単純な未熟さではない。抽象思考や創造性を促し、信頼関係では衝突を増やさない場合もある一方、攻撃的ユーモアや間接的な不満伝達として働くこともある。本稿は、皮肉を禁止するのでなく、怒りを直接かつ非攻撃的に伝える選択肢を増やす問題として捉え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="皮肉は知性の証明ではない――怒りを二重包装すると何が起きるか"><meta name="twitter:description" content="アンガーマネジメントの本を読み、「怒りを皮肉で表す人は、直接怒りを伝える度胸も交渉能力も乏しいのに、皮肉を知性だと勘違いして相手を余計に傷つける」と自分なりに要約した瞬間、妙に身に覚えがあって喀血しかけた。しかし研究を追うと、皮肉は単純な未熟さではない。抽象思考や創造性を促し、信頼関係では衝突を増やさない場合もある一方、攻撃的ユーモアや間接的な不満伝達として働くこともある。本稿は、皮肉を禁止するのでなく、怒りを直接かつ非攻撃的に伝える選択肢を増やす問題として捉え直す。"></head><body><main><article><h1>皮肉は知性の証明ではない――怒りを二重包装すると何が起きるか</h1><p>アンガーマネジメントの本を読み、「怒りを皮肉で表す人は、直接怒りを伝える度胸も交渉能力も乏しいのに、皮肉を知性だと勘違いして相手を余計に傷つける」と自分なりに要約した瞬間、妙に身に覚えがあって喀血しかけた。しかし研究を追うと、皮肉は単純な未熟さではない。抽象思考や創造性を促し、信頼関係では衝突を増やさない場合もある一方、攻撃的ユーモアや間接的な不満伝達として働くこともある。本稿は、皮肉を禁止するのでなく、怒りを直接かつ非攻撃的に伝える選択肢を増やす問題として捉え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/sarcasm-anger-intelligence-direct-communication?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.re

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタジアムにない広告を、テレビで売る――Who Owns the Image?</title><meta name="description" content="The ad is visible on TV but absent from the stadium. そんな奇妙な事実から、ビズアールティーの放送技術、導入事例、競技規則、障害、広告表示記録を調べる。Same match, different advertising feedsという状況は、単に映像表現を変えるだけなのか。それとも広告の権利と履行証明まで変えるのか。日本語を理解の足場に、自然な英語を混ぜながら考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/vizrt-virtual-ads-broadcast-reality.en.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/vizrt-virtual-ads-broadcast-reality.en.html"><meta property="og:title" content="スタジアムにない広告を、テレビで売る――Who Owns the Image?"><meta property="og:description" content="The ad is visible on TV but absent from the stadium. そんな奇妙な事実から、ビズアールティーの放送技術、導入事例、競技規則、障害、広告表示記録を調べる。Same match, different advertising feedsという状況は、単に映像表現を変えるだけなのか。それとも広告の権利と履行証明まで変えるのか。日本語を理解の足場に、自然な英語を混ぜながら考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="スタジアムにない広告を、テレビで売る――Who Owns the Image?"><meta name="twitter:description" content="The ad is visible on TV but absent from the stadium. そんな奇妙な事実から、ビズアールティーの放送技術、導入事例、競技規則、障害、広告表示記録を調べる。Same match, different advertising feedsという状況は、単に映像表現を変えるだけなのか。それとも広告の権利と履行証明まで変えるのか。日本語を理解の足場に、自然な英語を混ぜながら考える。"></head><body><main><article><h1>スタジアムにない広告を、テレビで売る――Who Owns the Image?</h1><p>The ad is visible on TV but absent from the stadium. そんな奇妙な事実から、ビズアールティーの放送技術、導入事例、競技規則、障害、広告表示記録を調べる。Same match, different advertising feedsという状況は、単に映像表現を変えるだけなのか。それとも広告の権利と履行証明まで変えるのか。日本語を理解の足場に、自然な英語を混ぜながら考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/vizrt-virtual-ads-broadcast-reality?lang=en">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/vizrt-virtual-ads-broadcast-reality?lang=en");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「異論なし」は、誰の賛成なのか――議事録が消してしまう沈黙</title><meta name="description" content="会議の沈黙が、議事録の「異論なし」を経て、いつの間にか「全員が賛成した」になる。誰も反対しなかったという観察と、全員が納得したという解釈は同じではない。言語哲学、組織的沈黙、心理的安全性の原典を調べ直し、何かの意味を確定する行為が、何を見えなくするのかを考える。議事録の例は思考実験であり、実際の会議を調査した結果ではない。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/silence-unanimity-minutes-who-decides-meaning.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/silence-unanimity-minutes-who-decides-meaning.html"><meta property="og:title" content="「異論なし」は、誰の賛成なのか――議事録が消してしまう沈黙"><meta property="og:description" content="会議の沈黙が、議事録の「異論なし」を経て、いつの間にか「全員が賛成した」になる。誰も反対しなかったという観察と、全員が納得したという解釈は同じではない。言語哲学、組織的沈黙、心理的安全性の原典を調べ直し、何かの意味を確定する行為が、何を見えなくするのかを考える。議事録の例は思考実験であり、実際の会議を調査した結果ではない。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「異論なし」は、誰の賛成なのか――議事録が消してしまう沈黙"><meta name="twitter:description" content="会議の沈黙が、議事録の「異論なし」を経て、いつの間にか「全員が賛成した」になる。誰も反対しなかったという観察と、全員が納得したという解釈は同じではない。言語哲学、組織的沈黙、心理的安全性の原典を調べ直し、何かの意味を確定する行為が、何を見えなくするのかを考える。議事録の例は思考実験であり、実際の会議を調査した結果ではない。"></head><body><main><article><h1>「異論なし」は、誰の賛成なのか――議事録が消してしまう沈黙</h1><p>会議の沈黙が、議事録の「異論なし」を経て、いつの間にか「全員が賛成した」になる。誰も反対しなかったという観察と、全員が納得したという解釈は同じではない。言語哲学、組織的沈黙、心理的安全性の原典を調べ直し、何かの意味を確定する行為が、何を見えなくするのかを考える。議事録の例は思考実験であり、実際の会議を調査した結果ではない。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/silence-unanimity-minutes-who-decides-meaning?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/silence-unanimity-minutes-who-decides-meaning?lang=ja");</script></body></html>

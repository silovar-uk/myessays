<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>値段より先に、交渉を守る――取適法が変えた「価格の決まり方」</title><meta name="description" content="2026年1月に施行された取適法は、旧下請法の名称変更だけではない。運送委託や従業員基準の追加、手形払等の禁止に加え、価格協議を求められたのに応じず、必要な説明もせず一方的に代金を決める行為を新たに禁止した。注目したいのは、法が『安すぎる価格』という結果だけでなく、『価格がどう決まったか』という交渉プロセスにも目を向けたことだ。その変化が企業間取引の公正さをどう捉え直しているのかを考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/toritekihou-negotiation-before-price.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/toritekihou-negotiation-before-price.html"><meta property="og:title" content="値段より先に、交渉を守る――取適法が変えた「価格の決まり方」"><meta property="og:description" content="2026年1月に施行された取適法は、旧下請法の名称変更だけではない。運送委託や従業員基準の追加、手形払等の禁止に加え、価格協議を求められたのに応じず、必要な説明もせず一方的に代金を決める行為を新たに禁止した。注目したいのは、法が『安すぎる価格』という結果だけでなく、『価格がどう決まったか』という交渉プロセスにも目を向けたことだ。その変化が企業間取引の公正さをどう捉え直しているのかを考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="値段より先に、交渉を守る――取適法が変えた「価格の決まり方」"><meta name="twitter:description" content="2026年1月に施行された取適法は、旧下請法の名称変更だけではない。運送委託や従業員基準の追加、手形払等の禁止に加え、価格協議を求められたのに応じず、必要な説明もせず一方的に代金を決める行為を新たに禁止した。注目したいのは、法が『安すぎる価格』という結果だけでなく、『価格がどう決まったか』という交渉プロセスにも目を向けたことだ。その変化が企業間取引の公正さをどう捉え直しているのかを考える。"></head><body><main><article><h1>値段より先に、交渉を守る――取適法が変えた「価格の決まり方」</h1><p>2026年1月に施行された取適法は、旧下請法の名称変更だけではない。運送委託や従業員基準の追加、手形払等の禁止に加え、価格協議を求められたのに応じず、必要な説明もせず一方的に代金を決める行為を新たに禁止した。注目したいのは、法が『安すぎる価格』という結果だけでなく、『価格がどう決まったか』という交渉プロセスにも目を向けたことだ。その変化が企業間取引の公正さをどう捉え直しているのかを考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/toritekihou-negotiation-before-price?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/toritekihou-negotiation-before-price?lang=ja");</script></body></html>

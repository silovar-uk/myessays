<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シュガーフットは、足でベースを弾く</title><meta name="description" content="Jonathan “Sugarfoot” Moffettの異様に雄弁な右足は、単なる高速キックではない。彼自身が語るベースへの憧れとNew Orleansの『bottom up』な感覚、Michael Jacksonの身体表現との同期、巨大なポップショーで要求される精度をたどると、ドラムが『時間を刻む楽器』以上のものに見えてくる。Sugarfootは足でビートを打つ。だが、その足は同時にベースを歌い、ダンサーの身体を支え、観客に『ここで動け』と伝えている。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/jonathan-sugarfoot-moffett-footwork-pop-groove.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/jonathan-sugarfoot-moffett-footwork-pop-groove.html"><meta property="og:title" content="シュガーフットは、足でベースを弾く"><meta property="og:description" content="Jonathan “Sugarfoot” Moffettの異様に雄弁な右足は、単なる高速キックではない。彼自身が語るベースへの憧れとNew Orleansの『bottom up』な感覚、Michael Jacksonの身体表現との同期、巨大なポップショーで要求される精度をたどると、ドラムが『時間を刻む楽器』以上のものに見えてくる。Sugarfootは足でビートを打つ。だが、その足は同時にベースを歌い、ダンサーの身体を支え、観客に『ここで動け』と伝えている。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="シュガーフットは、足でベースを弾く"><meta name="twitter:description" content="Jonathan “Sugarfoot” Moffettの異様に雄弁な右足は、単なる高速キックではない。彼自身が語るベースへの憧れとNew Orleansの『bottom up』な感覚、Michael Jacksonの身体表現との同期、巨大なポップショーで要求される精度をたどると、ドラムが『時間を刻む楽器』以上のものに見えてくる。Sugarfootは足でビートを打つ。だが、その足は同時にベースを歌い、ダンサーの身体を支え、観客に『ここで動け』と伝えている。"></head><body><main><article><h1>シュガーフットは、足でベースを弾く</h1><p>Jonathan “Sugarfoot” Moffettの異様に雄弁な右足は、単なる高速キックではない。彼自身が語るベースへの憧れとNew Orleansの『bottom up』な感覚、Michael Jacksonの身体表現との同期、巨大なポップショーで要求される精度をたどると、ドラムが『時間を刻む楽器』以上のものに見えてくる。Sugarfootは足でビートを打つ。だが、その足は同時にベースを歌い、ダンサーの身体を支え、観客に『ここで動け』と伝えている。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/jonathan-sugarfoot-moffett-footwork-pop-groove?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/jonathan-sugarfoot-moffett

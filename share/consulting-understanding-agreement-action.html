<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コンサルタントの仕事は、何を前に進めることなのか</title><meta name="description" content="コンサルタントの仕事とは、納得感をつくり、合意を形成し、仕事を前に進めることではないか。この実感を出発点に、納得と賛成、合意と全員一致、実行と成果の違いを考える。人を動かすことだけを目的とすれば、誤った方針さえ滑らかに進めてしまう。求められるのは、前提を問い直し、判断の根拠と責任を明らかにし、その判断を実行へつなぐ働きである。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/consulting-understanding-agreement-action.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/consulting-understanding-agreement-action.html"><meta property="og:title" content="コンサルタントの仕事は、何を前に進めることなのか"><meta property="og:description" content="コンサルタントの仕事とは、納得感をつくり、合意を形成し、仕事を前に進めることではないか。この実感を出発点に、納得と賛成、合意と全員一致、実行と成果の違いを考える。人を動かすことだけを目的とすれば、誤った方針さえ滑らかに進めてしまう。求められるのは、前提を問い直し、判断の根拠と責任を明らかにし、その判断を実行へつなぐ働きである。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="コンサルタントの仕事は、何を前に進めることなのか"><meta name="twitter:description" content="コンサルタントの仕事とは、納得感をつくり、合意を形成し、仕事を前に進めることではないか。この実感を出発点に、納得と賛成、合意と全員一致、実行と成果の違いを考える。人を動かすことだけを目的とすれば、誤った方針さえ滑らかに進めてしまう。求められるのは、前提を問い直し、判断の根拠と責任を明らかにし、その判断を実行へつなぐ働きである。"></head><body><main><article><h1>コンサルタントの仕事は、何を前に進めることなのか</h1><p>コンサルタントの仕事とは、納得感をつくり、合意を形成し、仕事を前に進めることではないか。この実感を出発点に、納得と賛成、合意と全員一致、実行と成果の違いを考える。人を動かすことだけを目的とすれば、誤った方針さえ滑らかに進めてしまう。求められるのは、前提を問い直し、判断の根拠と責任を明らかにし、その判断を実行へつなぐ働きである。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/consulting-understanding-agreement-action?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/consulting-understanding-agreement-action?lang=ja");</script></body></html>

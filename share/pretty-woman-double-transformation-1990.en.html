<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>『プリティ・ウーマン』はWho Rescues Whom?</title><meta name="description" content="『Pretty Woman』をmodern Cinderellaだけで片づけずに見直す。1980年代末のM&amp;Aとconsumer culture、原案『3000』からの変化、Julia RobertsとRichard Gereの当時の立ち位置、劇中のLa Traviataまで辿ると、この映画はVivianだけでなくEdwardもtransformする物語に見えてくる。なぜshopping sceneがあれほど気持ちよく、なぜ今見ると少し引っかかるのか。その両方を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/pretty-woman-double-transformation-1990.en.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/pretty-woman-double-transformation-1990.en.html"><meta property="og:title" content="『プリティ・ウーマン』はWho Rescues Whom?"><meta property="og:description" content="『Pretty Woman』をmodern Cinderellaだけで片づけずに見直す。1980年代末のM&amp;Aとconsumer culture、原案『3000』からの変化、Julia RobertsとRichard Gereの当時の立ち位置、劇中のLa Traviataまで辿ると、この映画はVivianだけでなくEdwardもtransformする物語に見えてくる。なぜshopping sceneがあれほど気持ちよく、なぜ今見ると少し引っかかるのか。その両方を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="『プリティ・ウーマン』はWho Rescues Whom?"><meta name="twitter:description" content="『Pretty Woman』をmodern Cinderellaだけで片づけずに見直す。1980年代末のM&amp;Aとconsumer culture、原案『3000』からの変化、Julia RobertsとRichard Gereの当時の立ち位置、劇中のLa Traviataまで辿ると、この映画はVivianだけでなくEdwardもtransformする物語に見えてくる。なぜshopping sceneがあれほど気持ちよく、なぜ今見ると少し引っかかるのか。その両方を考える。"></head><body><main><article><h1>『プリティ・ウーマン』はWho Rescues Whom?</h1><p>『Pretty Woman』をmodern Cinderellaだけで片づけずに見直す。1980年代末のM&amp;Aとconsumer culture、原案『3000』からの変化、Julia RobertsとRichard Gereの当時の立ち位置、劇中のLa Traviataまで辿ると、この映画はVivianだけでなくEdwardもtransformする物語に見えてくる。なぜshopping sceneがあれほど気持ちよく、なぜ今見ると少し引っかかるのか。その両方を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/pretty-woman-double-transformation-1990?lang=en">My Essaysで本文を読む</a></p></article></main><script>location.repl

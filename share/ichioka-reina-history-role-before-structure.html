<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一岡伶奈史――『まだないグループ』のリーダーになる</title><meta name="description" content="一岡伶奈は、長い研修生期間を経てデビューした『苦労人』としてだけでは捉えきれない。2017年6月、他メンバーもグループ名も始動時期も決まっていない段階で、彼女には『新グループのリーダー』という役割だけが先に与えられた。完成した組織に入るのではなく、未完成な場所を任され、後から仲間と名前と仕組みが集まっていく。その特殊な順番を軸に、研修生、CHICA#TETSU、BEYOOOOONDS、鉄道仕事、2024年の卒業とその後までをたどる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/ichioka-reina-history-role-before-structure.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/ichioka-reina-history-role-before-structure.html"><meta property="og:title" content="一岡伶奈史――『まだないグループ』のリーダーになる"><meta property="og:description" content="一岡伶奈は、長い研修生期間を経てデビューした『苦労人』としてだけでは捉えきれない。2017年6月、他メンバーもグループ名も始動時期も決まっていない段階で、彼女には『新グループのリーダー』という役割だけが先に与えられた。完成した組織に入るのではなく、未完成な場所を任され、後から仲間と名前と仕組みが集まっていく。その特殊な順番を軸に、研修生、CHICA#TETSU、BEYOOOOONDS、鉄道仕事、2024年の卒業とその後までをたどる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="一岡伶奈史――『まだないグループ』のリーダーになる"><meta name="twitter:description" content="一岡伶奈は、長い研修生期間を経てデビューした『苦労人』としてだけでは捉えきれない。2017年6月、他メンバーもグループ名も始動時期も決まっていない段階で、彼女には『新グループのリーダー』という役割だけが先に与えられた。完成した組織に入るのではなく、未完成な場所を任され、後から仲間と名前と仕組みが集まっていく。その特殊な順番を軸に、研修生、CHICA#TETSU、BEYOOOOONDS、鉄道仕事、2024年の卒業とその後までをたどる。"></head><body><main><article><h1>一岡伶奈史――『まだないグループ』のリーダーになる</h1><p>一岡伶奈は、長い研修生期間を経てデビューした『苦労人』としてだけでは捉えきれない。2017年6月、他メンバーもグループ名も始動時期も決まっていない段階で、彼女には『新グループのリーダー』という役割だけが先に与えられた。完成した組織に入るのではなく、未完成な場所を任され、後から仲間と名前と仕組みが集まっていく。その特殊な順番を軸に、研修生、CHICA#TETSU、BEYOOOOONDS、鉄道仕事、2024年の卒業とその後までをたどる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/ichioka-reina-history-role-before-structure?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/ichioka-reina-history-role-before-structure?lang=ja

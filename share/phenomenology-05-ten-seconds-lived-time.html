<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信号待ちの10秒は、動画の10秒より長いのか</title><meta name="description" content="赤信号の10秒と好きな動画の10秒は、時計では同じでも経験では同じとは限らない。さらに音楽を一音ずつ聞いているはずなのに、私たちは旋律を一つのまとまりとして聞ける。フッサールの時間意識論にある保持・原印象・予持を手がかりに、『いま』が点ではなく、直前と直後への広がりを持つ経験の場であることを考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/phenomenology-05-ten-seconds-lived-time.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/phenomenology-05-ten-seconds-lived-time.html"><meta property="og:title" content="信号待ちの10秒は、動画の10秒より長いのか"><meta property="og:description" content="赤信号の10秒と好きな動画の10秒は、時計では同じでも経験では同じとは限らない。さらに音楽を一音ずつ聞いているはずなのに、私たちは旋律を一つのまとまりとして聞ける。フッサールの時間意識論にある保持・原印象・予持を手がかりに、『いま』が点ではなく、直前と直後への広がりを持つ経験の場であることを考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="信号待ちの10秒は、動画の10秒より長いのか"><meta name="twitter:description" content="赤信号の10秒と好きな動画の10秒は、時計では同じでも経験では同じとは限らない。さらに音楽を一音ずつ聞いているはずなのに、私たちは旋律を一つのまとまりとして聞ける。フッサールの時間意識論にある保持・原印象・予持を手がかりに、『いま』が点ではなく、直前と直後への広がりを持つ経験の場であることを考える。"></head><body><main><article><h1>信号待ちの10秒は、動画の10秒より長いのか</h1><p>赤信号の10秒と好きな動画の10秒は、時計では同じでも経験では同じとは限らない。さらに音楽を一音ずつ聞いているはずなのに、私たちは旋律を一つのまとまりとして聞ける。フッサールの時間意識論にある保持・原印象・予持を手がかりに、『いま』が点ではなく、直前と直後への広がりを持つ経験の場であることを考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/phenomenology-05-ten-seconds-lived-time?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/phenomenology-05-ten-seconds-lived-time?lang=ja");</script></body></html>

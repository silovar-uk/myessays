<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>論理学の「バルバラ」は人名ではなく、AAA-1を記憶するための名前である</title><meta name="description" content="論理学の「バルバラ（Barbara）」は人物名ではなく、古典的三段論法の一形式AAA-1を覚えるための中世の記憶名である。「すべてのMはP」「すべてのSはM」から「すべてのSはP」が必ず従う。なぜそれが妥当なのか、A・E・I・Oや第一格は何を意味するのか、アリストテレスの理論に13世紀の学者たちがどのように名前と還元手順を重ねたのか、そしてフレーゲ以後の現代論理学から見た射程と限界まで、初学者向けに順序立てて説明する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/barbara-syllogism-aaa-first-figure.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/barbara-syllogism-aaa-first-figure.html"><meta property="og:title" content="論理学の「バルバラ」は人名ではなく、AAA-1を記憶するための名前である"><meta property="og:description" content="論理学の「バルバラ（Barbara）」は人物名ではなく、古典的三段論法の一形式AAA-1を覚えるための中世の記憶名である。「すべてのMはP」「すべてのSはM」から「すべてのSはP」が必ず従う。なぜそれが妥当なのか、A・E・I・Oや第一格は何を意味するのか、アリストテレスの理論に13世紀の学者たちがどのように名前と還元手順を重ねたのか、そしてフレーゲ以後の現代論理学から見た射程と限界まで、初学者向けに順序立てて説明する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="論理学の「バルバラ」は人名ではなく、AAA-1を記憶するための名前である"><meta name="twitter:description" content="論理学の「バルバラ（Barbara）」は人物名ではなく、古典的三段論法の一形式AAA-1を覚えるための中世の記憶名である。「すべてのMはP」「すべてのSはM」から「すべてのSはP」が必ず従う。なぜそれが妥当なのか、A・E・I・Oや第一格は何を意味するのか、アリストテレスの理論に13世紀の学者たちがどのように名前と還元手順を重ねたのか、そしてフレーゲ以後の現代論理学から見た射程と限界まで、初学者向けに順序立てて説明する。"></head><body><main><article><h1>論理学の「バルバラ」は人名ではなく、AAA-1を記憶するための名前である</h1><p>論理学の「バルバラ（Barbara）」は人物名ではなく、古典的三段論法の一形式AAA-1を覚えるための中世の記憶名である。「すべてのMはP」「すべてのSはM」から「すべてのSはP」が必ず従う。なぜそれが妥当なのか、A・E・I・Oや第一格は何を意味するのか、アリストテレスの理論に13世紀の学者たちがどのように名前と還元手順を重ねたのか、そしてフレーゲ以後の現代論理学から見た射程と限界まで、初学者向けに順序立てて説明する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/barbara-syllogism-aaa-first-figure?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/barbara-syllogism-aaa-first-figure?lang=ja");</script></body><

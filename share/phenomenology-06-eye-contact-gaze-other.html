<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>目が合った瞬間、自分が「見られる人」に変わる</title><meta name="description" content="電車で向かいの人をぼんやり見ていたら、突然目が合う。その瞬間、自分は世界を見る側だけでなく、相手から見られる対象でもあると感じる。サルトルが『存在と無』で分析した〈まなざし〉を入口に、他者が単なる視覚対象ではなく、自分の世界の中心性を揺らし、自分自身の現れ方まで変える存在であることを考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/phenomenology-06-eye-contact-gaze-other.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/phenomenology-06-eye-contact-gaze-other.html"><meta property="og:title" content="目が合った瞬間、自分が「見られる人」に変わる"><meta property="og:description" content="電車で向かいの人をぼんやり見ていたら、突然目が合う。その瞬間、自分は世界を見る側だけでなく、相手から見られる対象でもあると感じる。サルトルが『存在と無』で分析した〈まなざし〉を入口に、他者が単なる視覚対象ではなく、自分の世界の中心性を揺らし、自分自身の現れ方まで変える存在であることを考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="目が合った瞬間、自分が「見られる人」に変わる"><meta name="twitter:description" content="電車で向かいの人をぼんやり見ていたら、突然目が合う。その瞬間、自分は世界を見る側だけでなく、相手から見られる対象でもあると感じる。サルトルが『存在と無』で分析した〈まなざし〉を入口に、他者が単なる視覚対象ではなく、自分の世界の中心性を揺らし、自分自身の現れ方まで変える存在であることを考える。"></head><body><main><article><h1>目が合った瞬間、自分が「見られる人」に変わる</h1><p>電車で向かいの人をぼんやり見ていたら、突然目が合う。その瞬間、自分は世界を見る側だけでなく、相手から見られる対象でもあると感じる。サルトルが『存在と無』で分析した〈まなざし〉を入口に、他者が単なる視覚対象ではなく、自分の世界の中心性を揺らし、自分自身の現れ方まで変える存在であることを考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/phenomenology-06-eye-contact-gaze-other?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/phenomenology-06-eye-contact-gaze-other?lang=ja");</script></body></html>

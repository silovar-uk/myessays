<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前十字靭帯は、膝の前にはない――ACL断裂とは結局何が切れているのか</title><meta name="description" content="サッカーを見ていると何度も聞く「前十字靭帯断裂」。ACLは膝の前面ではなく、膝関節の中央を斜めに走り、脛骨の前方移動と回旋を抑える。本稿では、なぜ接触がなくても断裂するのか、断裂時に何を確認するのか、なぜ手術では再建が中心となるのか、自然治癒研究をどう読むべきか、そして復帰をなぜ経過月数だけで決められないのかを整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/acl-tear-diagonal-knee-stopper.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/acl-tear-diagonal-knee-stopper.html"><meta property="og:title" content="前十字靭帯は、膝の前にはない――ACL断裂とは結局何が切れているのか"><meta property="og:description" content="サッカーを見ていると何度も聞く「前十字靭帯断裂」。ACLは膝の前面ではなく、膝関節の中央を斜めに走り、脛骨の前方移動と回旋を抑える。本稿では、なぜ接触がなくても断裂するのか、断裂時に何を確認するのか、なぜ手術では再建が中心となるのか、自然治癒研究をどう読むべきか、そして復帰をなぜ経過月数だけで決められないのかを整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="前十字靭帯は、膝の前にはない――ACL断裂とは結局何が切れているのか"><meta name="twitter:description" content="サッカーを見ていると何度も聞く「前十字靭帯断裂」。ACLは膝の前面ではなく、膝関節の中央を斜めに走り、脛骨の前方移動と回旋を抑える。本稿では、なぜ接触がなくても断裂するのか、断裂時に何を確認するのか、なぜ手術では再建が中心となるのか、自然治癒研究をどう読むべきか、そして復帰をなぜ経過月数だけで決められないのかを整理する。"></head><body><main><article><h1>前十字靭帯は、膝の前にはない――ACL断裂とは結局何が切れているのか</h1><p>サッカーを見ていると何度も聞く「前十字靭帯断裂」。ACLは膝の前面ではなく、膝関節の中央を斜めに走り、脛骨の前方移動と回旋を抑える。本稿では、なぜ接触がなくても断裂するのか、断裂時に何を確認するのか、なぜ手術では再建が中心となるのか、自然治癒研究をどう読むべきか、そして復帰をなぜ経過月数だけで決められないのかを整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/acl-tear-diagonal-knee-stopper?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/acl-tear-diagonal-knee-stopper?lang=ja");</script></body></html>

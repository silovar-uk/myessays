<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文学座はなぜ続くのか――名作を残す劇団から、創作能力を継ぐ組織へ</title><meta name="description" content="1937年創立の文学座を、著名俳優や名作の年表ではなく、作品をつくり直せる組織の条件から読み解く。新劇の起源、1963年の二度の分裂、1950年のアトリエ、1961年に再編された養成機関、1938年からの支持会、2021年の資金調達を一次資料等で検証。老舗の強さと制約を同時に見つめ、芸術団体、スポーツクラブ、企業の人材育成に共通する問いへ展開する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/bungakuza-capability-to-recreate-theatre-2026.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/bungakuza-capability-to-recreate-theatre-2026.html"><meta property="og:title" content="文学座はなぜ続くのか――名作を残す劇団から、創作能力を継ぐ組織へ"><meta property="og:description" content="1937年創立の文学座を、著名俳優や名作の年表ではなく、作品をつくり直せる組織の条件から読み解く。新劇の起源、1963年の二度の分裂、1950年のアトリエ、1961年に再編された養成機関、1938年からの支持会、2021年の資金調達を一次資料等で検証。老舗の強さと制約を同時に見つめ、芸術団体、スポーツクラブ、企業の人材育成に共通する問いへ展開する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="文学座はなぜ続くのか――名作を残す劇団から、創作能力を継ぐ組織へ"><meta name="twitter:description" content="1937年創立の文学座を、著名俳優や名作の年表ではなく、作品をつくり直せる組織の条件から読み解く。新劇の起源、1963年の二度の分裂、1950年のアトリエ、1961年に再編された養成機関、1938年からの支持会、2021年の資金調達を一次資料等で検証。老舗の強さと制約を同時に見つめ、芸術団体、スポーツクラブ、企業の人材育成に共通する問いへ展開する。"></head><body><main><article><h1>文学座はなぜ続くのか――名作を残す劇団から、創作能力を継ぐ組織へ</h1><p>1937年創立の文学座を、著名俳優や名作の年表ではなく、作品をつくり直せる組織の条件から読み解く。新劇の起源、1963年の二度の分裂、1950年のアトリエ、1961年に再編された養成機関、1938年からの支持会、2021年の資金調達を一次資料等で検証。老舗の強さと制約を同時に見つめ、芸術団体、スポーツクラブ、企業の人材育成に共通する問いへ展開する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/bungakuza-capability-to-recreate-theatre-2026?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/bungakuza-capability-to-recreate-theatre-2026?lang=ja");</script></body></html>

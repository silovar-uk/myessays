<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simplicity isn’t minimalism</title><meta name="description" content="シンプルなデザインというと、色を減らし、余白を増やし、ボタンを消すことを想像しやすい。しかし、見える要素が少ないことと、理解しやすいことは同じではない。John Maeda、Rich Hickey、Don Norman、Nielsen Norman Groupの議論を手がかりに、minimalismを『削ること』、simplicityを『絡まりをほどき、理解できる構造にすること』として捉え直す。UIだけでなく、仕事、資料、システム設計にも持ち帰れるシンプルさの判断基準を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/simplicity-isnt-minimalism.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/simplicity-isnt-minimalism.html"><meta property="og:title" content="Simplicity isn’t minimalism"><meta property="og:description" content="シンプルなデザインというと、色を減らし、余白を増やし、ボタンを消すことを想像しやすい。しかし、見える要素が少ないことと、理解しやすいことは同じではない。John Maeda、Rich Hickey、Don Norman、Nielsen Norman Groupの議論を手がかりに、minimalismを『削ること』、simplicityを『絡まりをほどき、理解できる構造にすること』として捉え直す。UIだけでなく、仕事、資料、システム設計にも持ち帰れるシンプルさの判断基準を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Simplicity isn’t minimalism"><meta name="twitter:description" content="シンプルなデザインというと、色を減らし、余白を増やし、ボタンを消すことを想像しやすい。しかし、見える要素が少ないことと、理解しやすいことは同じではない。John Maeda、Rich Hickey、Don Norman、Nielsen Norman Groupの議論を手がかりに、minimalismを『削ること』、simplicityを『絡まりをほどき、理解できる構造にすること』として捉え直す。UIだけでなく、仕事、資料、システム設計にも持ち帰れるシンプルさの判断基準を考える。"></head><body><main><article><h1>Simplicity isn’t minimalism</h1><p>シンプルなデザインというと、色を減らし、余白を増やし、ボタンを消すことを想像しやすい。しかし、見える要素が少ないことと、理解しやすいことは同じではない。John Maeda、Rich Hickey、Don Norman、Nielsen Norman Groupの議論を手がかりに、minimalismを『削ること』、simplicityを『絡まりをほどき、理解できる構造にすること』として捉え直す。UIだけでなく、仕事、資料、システム設計にも持ち帰れるシンプルさの判断基準を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/simplicity-isnt-minimalism?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/simplicity-isnt-minimalism?lang=ja");</script></body></html>

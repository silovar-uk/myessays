<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アメリカ都市を読む #2｜ボストン――古い地図を消さずに、上書きし続ける街</title><meta name="description" content="アメリカの都市を一つずつ読むシリーズ第2回。ボストンを『独立革命と大学の街』だけで終わらせず、港に生まれた植民都市、Back Bayの大規模埋立、アイルランド移民と政治、黒人コミュニティと奴隷制廃止運動、1970年代の学校統合危機、大学・医療・life sciences中心の知識経済、1897年から続く地下鉄、Big Dig、スポーツまで一本につなぐ。フィラデルフィアが古いグリッドを使い続ける都市なら、ボストンは古い地図の上に新しい都市を何度も上書きしてきた街である。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/america-cities-02-boston.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/america-cities-02-boston.html"><meta property="og:title" content="アメリカ都市を読む #2｜ボストン――古い地図を消さずに、上書きし続ける街"><meta property="og:description" content="アメリカの都市を一つずつ読むシリーズ第2回。ボストンを『独立革命と大学の街』だけで終わらせず、港に生まれた植民都市、Back Bayの大規模埋立、アイルランド移民と政治、黒人コミュニティと奴隷制廃止運動、1970年代の学校統合危機、大学・医療・life sciences中心の知識経済、1897年から続く地下鉄、Big Dig、スポーツまで一本につなぐ。フィラデルフィアが古いグリッドを使い続ける都市なら、ボストンは古い地図の上に新しい都市を何度も上書きしてきた街である。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="アメリカ都市を読む #2｜ボストン――古い地図を消さずに、上書きし続ける街"><meta name="twitter:description" content="アメリカの都市を一つずつ読むシリーズ第2回。ボストンを『独立革命と大学の街』だけで終わらせず、港に生まれた植民都市、Back Bayの大規模埋立、アイルランド移民と政治、黒人コミュニティと奴隷制廃止運動、1970年代の学校統合危機、大学・医療・life sciences中心の知識経済、1897年から続く地下鉄、Big Dig、スポーツまで一本につなぐ。フィラデルフィアが古いグリッドを使い続ける都市なら、ボストンは古い地図の上に新しい都市を何度も上書きしてきた街である。"></head><body><main><article><h1>アメリカ都市を読む #2｜ボストン――古い地図を消さずに、上書きし続ける街</h1><p>アメリカの都市を一つずつ読むシリーズ第2回。ボストンを『独立革命と大学の街』だけで終わらせず、港に生まれた植民都市、Back Bayの大規模埋立、アイルランド移民と政治、黒人コミュニティと奴隷制廃止運動、1970年代の学校統合危機、大学・医療・life sciences中心の知識経済、1897年から続く地下鉄、Big Dig、スポーツまで一本につなぐ。フィラデルフィアが古いグリッドを使い続ける都市なら、ボストンは古い地図の上に新しい都市を何度も上書きしてきた街である。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/america-cities-02-boston?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/america-cities-02-boston?lang=ja");</script></body></html>

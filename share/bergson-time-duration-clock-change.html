<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>時計の中に、時間は入っていない――ベルクソンと原子時計を同じ机に置いたら「1秒」が変なものに見えてきた</title><meta name="description" content="時計の中に「1秒」という物質はない。NISTの時計の説明とベルクソン『時間と自由』を同じ机に置き、日時計・水時計・振り子・クオーツ・原子時計を「何の変化を数えるか」で並べ直す。調べ始めたときの『人間は時間を感じられず、物質の変化で代用している』という仮説は、途中でほぼ逆転した。ベルクソンが区別したのは、数えられる均質な時間と、意識が直接生きる持続だった。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/bergson-time-duration-clock-change.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/bergson-time-duration-clock-change.html"><meta property="og:title" content="時計の中に、時間は入っていない――ベルクソンと原子時計を同じ机に置いたら「1秒」が変なものに見えてきた"><meta property="og:description" content="時計の中に「1秒」という物質はない。NISTの時計の説明とベルクソン『時間と自由』を同じ机に置き、日時計・水時計・振り子・クオーツ・原子時計を「何の変化を数えるか」で並べ直す。調べ始めたときの『人間は時間を感じられず、物質の変化で代用している』という仮説は、途中でほぼ逆転した。ベルクソンが区別したのは、数えられる均質な時間と、意識が直接生きる持続だった。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="時計の中に、時間は入っていない――ベルクソンと原子時計を同じ机に置いたら「1秒」が変なものに見えてきた"><meta name="twitter:description" content="時計の中に「1秒」という物質はない。NISTの時計の説明とベルクソン『時間と自由』を同じ机に置き、日時計・水時計・振り子・クオーツ・原子時計を「何の変化を数えるか」で並べ直す。調べ始めたときの『人間は時間を感じられず、物質の変化で代用している』という仮説は、途中でほぼ逆転した。ベルクソンが区別したのは、数えられる均質な時間と、意識が直接生きる持続だった。"></head><body><main><article><h1>時計の中に、時間は入っていない――ベルクソンと原子時計を同じ机に置いたら「1秒」が変なものに見えてきた</h1><p>時計の中に「1秒」という物質はない。NISTの時計の説明とベルクソン『時間と自由』を同じ机に置き、日時計・水時計・振り子・クオーツ・原子時計を「何の変化を数えるか」で並べ直す。調べ始めたときの『人間は時間を感じられず、物質の変化で代用している』という仮説は、途中でほぼ逆転した。ベルクソンが区別したのは、数えられる均質な時間と、意識が直接生きる持続だった。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/bergson-time-duration-clock-change?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/bergson-time-duration-clock-change?lang=ja");</script></body></html>

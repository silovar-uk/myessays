<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プロレスは、相手を壊さないから闘える――「これは闘いだが、敵意ではない」の成立条件</title><meta name="description" content="リング上の攻撃は、外で突然行えば暴力になる。なぜプロレスでは観客を熱狂させる試合になるのか。レスラーの相互信頼、ベイトソンの「これは遊びだ」というメタメッセージ、サッカーの煽り文化といじめ研究を照合する。共通認識は何でも許す免罪符ではなく、相手の反応を確認し続ける関係の技術である。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/pro-wrestling-shared-frame-conflict-without-harm.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/pro-wrestling-shared-frame-conflict-without-harm.html"><meta property="og:title" content="プロレスは、相手を壊さないから闘える――「これは闘いだが、敵意ではない」の成立条件"><meta property="og:description" content="リング上の攻撃は、外で突然行えば暴力になる。なぜプロレスでは観客を熱狂させる試合になるのか。レスラーの相互信頼、ベイトソンの「これは遊びだ」というメタメッセージ、サッカーの煽り文化といじめ研究を照合する。共通認識は何でも許す免罪符ではなく、相手の反応を確認し続ける関係の技術である。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="プロレスは、相手を壊さないから闘える――「これは闘いだが、敵意ではない」の成立条件"><meta name="twitter:description" content="リング上の攻撃は、外で突然行えば暴力になる。なぜプロレスでは観客を熱狂させる試合になるのか。レスラーの相互信頼、ベイトソンの「これは遊びだ」というメタメッセージ、サッカーの煽り文化といじめ研究を照合する。共通認識は何でも許す免罪符ではなく、相手の反応を確認し続ける関係の技術である。"></head><body><main><article><h1>プロレスは、相手を壊さないから闘える――「これは闘いだが、敵意ではない」の成立条件</h1><p>リング上の攻撃は、外で突然行えば暴力になる。なぜプロレスでは観客を熱狂させる試合になるのか。レスラーの相互信頼、ベイトソンの「これは遊びだ」というメタメッセージ、サッカーの煽り文化といじめ研究を照合する。共通認識は何でも許す免罪符ではなく、相手の反応を確認し続ける関係の技術である。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/pro-wrestling-shared-frame-conflict-without-harm?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/pro-wrestling-shared-frame-conflict-without-harm?lang=ja");</script></body></html>

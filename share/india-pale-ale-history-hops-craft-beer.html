<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPAは、ただ苦いビールではない</title><meta name="description" content="IPAを『苦いクラフトビール』という一言から解放し、その名前の由来、英国からインドへの貿易、HodgsonとBurtonの醸造所、ホップの働き、IBUと体感苦味の違い、American IPA、West Coast IPA、Hazy IPAへの分岐までたどる。よく語られる『長い航海に耐えるためHodgsonが発明した』という起源神話も史料に照らしてほどき、最後はラベルから味を予想し、IPAを飲み比べられるところまで整理する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/india-pale-ale-history-hops-craft-beer.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/india-pale-ale-history-hops-craft-beer.html"><meta property="og:title" content="IPAは、ただ苦いビールではない"><meta property="og:description" content="IPAを『苦いクラフトビール』という一言から解放し、その名前の由来、英国からインドへの貿易、HodgsonとBurtonの醸造所、ホップの働き、IBUと体感苦味の違い、American IPA、West Coast IPA、Hazy IPAへの分岐までたどる。よく語られる『長い航海に耐えるためHodgsonが発明した』という起源神話も史料に照らしてほどき、最後はラベルから味を予想し、IPAを飲み比べられるところまで整理する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="IPAは、ただ苦いビールではない"><meta name="twitter:description" content="IPAを『苦いクラフトビール』という一言から解放し、その名前の由来、英国からインドへの貿易、HodgsonとBurtonの醸造所、ホップの働き、IBUと体感苦味の違い、American IPA、West Coast IPA、Hazy IPAへの分岐までたどる。よく語られる『長い航海に耐えるためHodgsonが発明した』という起源神話も史料に照らしてほどき、最後はラベルから味を予想し、IPAを飲み比べられるところまで整理する。"></head><body><main><article><h1>IPAは、ただ苦いビールではない</h1><p>IPAを『苦いクラフトビール』という一言から解放し、その名前の由来、英国からインドへの貿易、HodgsonとBurtonの醸造所、ホップの働き、IBUと体感苦味の違い、American IPA、West Coast IPA、Hazy IPAへの分岐までたどる。よく語られる『長い航海に耐えるためHodgsonが発明した』という起源神話も史料に照らしてほどき、最後はラベルから味を予想し、IPAを飲み比べられるところまで整理する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/india-pale-ale-history-hops-craft-beer?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/india-pale-ale-history-hops-craft-beer?lang=ja");</script></body></html>

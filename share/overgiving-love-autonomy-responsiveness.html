<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>『尽くすほど嫌われる』は半分だけ正しい</title><meta name="description" content="『尽くすほど嫌われる』という恋愛の俗説を、社会心理学と関係科学から組み直す。与えた側では投資がコミットメントを高め、受け取る側では感謝と同時に負債感が生じうる。ただし、親密な関係は本来、厳密な帳尻合わせをする交換関係ではない。問題は愛情の量ではなく、相手のニーズとのズレ、断れなさ、自律性や有能感を奪う先回り、そして返す役割を失わせることにある。『尽くさない』ではなく、『相手が参加できる余白を残して与える』という恋愛設計を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/overgiving-love-autonomy-responsiveness.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/overgiving-love-autonomy-responsiveness.html"><meta property="og:title" content="『尽くすほど嫌われる』は半分だけ正しい"><meta property="og:description" content="『尽くすほど嫌われる』という恋愛の俗説を、社会心理学と関係科学から組み直す。与えた側では投資がコミットメントを高め、受け取る側では感謝と同時に負債感が生じうる。ただし、親密な関係は本来、厳密な帳尻合わせをする交換関係ではない。問題は愛情の量ではなく、相手のニーズとのズレ、断れなさ、自律性や有能感を奪う先回り、そして返す役割を失わせることにある。『尽くさない』ではなく、『相手が参加できる余白を残して与える』という恋愛設計を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="『尽くすほど嫌われる』は半分だけ正しい"><meta name="twitter:description" content="『尽くすほど嫌われる』という恋愛の俗説を、社会心理学と関係科学から組み直す。与えた側では投資がコミットメントを高め、受け取る側では感謝と同時に負債感が生じうる。ただし、親密な関係は本来、厳密な帳尻合わせをする交換関係ではない。問題は愛情の量ではなく、相手のニーズとのズレ、断れなさ、自律性や有能感を奪う先回り、そして返す役割を失わせることにある。『尽くさない』ではなく、『相手が参加できる余白を残して与える』という恋愛設計を考える。"></head><body><main><article><h1>『尽くすほど嫌われる』は半分だけ正しい</h1><p>『尽くすほど嫌われる』という恋愛の俗説を、社会心理学と関係科学から組み直す。与えた側では投資がコミットメントを高め、受け取る側では感謝と同時に負債感が生じうる。ただし、親密な関係は本来、厳密な帳尻合わせをする交換関係ではない。問題は愛情の量ではなく、相手のニーズとのズレ、断れなさ、自律性や有能感を奪う先回り、そして返す役割を失わせることにある。『尽くさない』ではなく、『相手が参加できる余白を残して与える』という恋愛設計を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/overgiving-love-autonomy-responsiveness?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/overgiving-love-autonomy-responsiveness?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>友達はつくれない。でも、友達ができる条件はつくれる。</title><meta name="description" content="社会人になると、新しい友達が自然にできる場所は急に減る。趣味友アプリ「つなげーと」を調べると、面白いのはイベント検索そのものより、共通の活動、初参加のしやすさ、主催者制度、本人確認、そして再会支援までを組み合わせ、人間関係が生まれやすい条件を設計している点だった。友情そのものはサービス化できない。それでも、友情が始まり、続く確率を上げる環境は設計できる。その境界を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/tunagate-friendship-condition-design.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/tunagate-friendship-condition-design.html"><meta property="og:title" content="友達はつくれない。でも、友達ができる条件はつくれる。"><meta property="og:description" content="社会人になると、新しい友達が自然にできる場所は急に減る。趣味友アプリ「つなげーと」を調べると、面白いのはイベント検索そのものより、共通の活動、初参加のしやすさ、主催者制度、本人確認、そして再会支援までを組み合わせ、人間関係が生まれやすい条件を設計している点だった。友情そのものはサービス化できない。それでも、友情が始まり、続く確率を上げる環境は設計できる。その境界を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="友達はつくれない。でも、友達ができる条件はつくれる。"><meta name="twitter:description" content="社会人になると、新しい友達が自然にできる場所は急に減る。趣味友アプリ「つなげーと」を調べると、面白いのはイベント検索そのものより、共通の活動、初参加のしやすさ、主催者制度、本人確認、そして再会支援までを組み合わせ、人間関係が生まれやすい条件を設計している点だった。友情そのものはサービス化できない。それでも、友情が始まり、続く確率を上げる環境は設計できる。その境界を考える。"></head><body><main><article><h1>友達はつくれない。でも、友達ができる条件はつくれる。</h1><p>社会人になると、新しい友達が自然にできる場所は急に減る。趣味友アプリ「つなげーと」を調べると、面白いのはイベント検索そのものより、共通の活動、初参加のしやすさ、主催者制度、本人確認、そして再会支援までを組み合わせ、人間関係が生まれやすい条件を設計している点だった。友情そのものはサービス化できない。それでも、友情が始まり、続く確率を上げる環境は設計できる。その境界を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/tunagate-friendship-condition-design?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/tunagate-friendship-condition-design?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「暗号化されている」と「E2EE」は何が違うのか</title><meta name="description" content="『暗号化されている』通信とE2EEは、同じではない。違いは暗号の強さより、途中のサーバーが復号できるかどうかにある。本稿ではAlice→Server→Bobという最小モデルから、TLSとの違い、鍵の役割、Signal・WhatsApp・iMessage・RCSの実例、メタデータや端末侵害などE2EEでも守れない範囲までを整理する。E2EEを『強い暗号』ではなく、『信用しなければならない相手を減らす設計』として捉え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/e2ee-trust-boundary-end-to-end-encryption.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/e2ee-trust-boundary-end-to-end-encryption.html"><meta property="og:title" content="「暗号化されている」と「E2EE」は何が違うのか"><meta property="og:description" content="『暗号化されている』通信とE2EEは、同じではない。違いは暗号の強さより、途中のサーバーが復号できるかどうかにある。本稿ではAlice→Server→Bobという最小モデルから、TLSとの違い、鍵の役割、Signal・WhatsApp・iMessage・RCSの実例、メタデータや端末侵害などE2EEでも守れない範囲までを整理する。E2EEを『強い暗号』ではなく、『信用しなければならない相手を減らす設計』として捉え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「暗号化されている」と「E2EE」は何が違うのか"><meta name="twitter:description" content="『暗号化されている』通信とE2EEは、同じではない。違いは暗号の強さより、途中のサーバーが復号できるかどうかにある。本稿ではAlice→Server→Bobという最小モデルから、TLSとの違い、鍵の役割、Signal・WhatsApp・iMessage・RCSの実例、メタデータや端末侵害などE2EEでも守れない範囲までを整理する。E2EEを『強い暗号』ではなく、『信用しなければならない相手を減らす設計』として捉え直す。"></head><body><main><article><h1>「暗号化されている」と「E2EE」は何が違うのか</h1><p>『暗号化されている』通信とE2EEは、同じではない。違いは暗号の強さより、途中のサーバーが復号できるかどうかにある。本稿ではAlice→Server→Bobという最小モデルから、TLSとの違い、鍵の役割、Signal・WhatsApp・iMessage・RCSの実例、メタデータや端末侵害などE2EEでも守れない範囲までを整理する。E2EEを『強い暗号』ではなく、『信用しなければならない相手を減らす設計』として捉え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/e2ee-trust-boundary-end-to-end-encryption?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/e2ee-trust-boundary-end-to-end-encryption?lang=ja");</script></body></html>

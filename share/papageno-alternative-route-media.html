<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パパゲーノは「死ななかった脇役」から、メディアが示す別の道の名前になった</title><meta name="description" content="モーツァルトの『魔笛』に出てくる鳥刺しの男パパゲーノは、なぜ二百年以上後の自殺予防研究に名前を残したのか。1791年の舞台、1974年のウェルテル効果、2010年のパパゲーノ効果の提唱、2022年以降の実証研究、WHOの報道指針をたどる。結論は『前向きな話をすればよい』ではない。メディアは出来事を伝えると同時に、危機の中で人が取りうる行動の選択肢まで配っている。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/papageno-alternative-route-media.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/papageno-alternative-route-media.html"><meta property="og:title" content="パパゲーノは「死ななかった脇役」から、メディアが示す別の道の名前になった"><meta property="og:description" content="モーツァルトの『魔笛』に出てくる鳥刺しの男パパゲーノは、なぜ二百年以上後の自殺予防研究に名前を残したのか。1791年の舞台、1974年のウェルテル効果、2010年のパパゲーノ効果の提唱、2022年以降の実証研究、WHOの報道指針をたどる。結論は『前向きな話をすればよい』ではない。メディアは出来事を伝えると同時に、危機の中で人が取りうる行動の選択肢まで配っている。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="パパゲーノは「死ななかった脇役」から、メディアが示す別の道の名前になった"><meta name="twitter:description" content="モーツァルトの『魔笛』に出てくる鳥刺しの男パパゲーノは、なぜ二百年以上後の自殺予防研究に名前を残したのか。1791年の舞台、1974年のウェルテル効果、2010年のパパゲーノ効果の提唱、2022年以降の実証研究、WHOの報道指針をたどる。結論は『前向きな話をすればよい』ではない。メディアは出来事を伝えると同時に、危機の中で人が取りうる行動の選択肢まで配っている。"></head><body><main><article><h1>パパゲーノは「死ななかった脇役」から、メディアが示す別の道の名前になった</h1><p>モーツァルトの『魔笛』に出てくる鳥刺しの男パパゲーノは、なぜ二百年以上後の自殺予防研究に名前を残したのか。1791年の舞台、1974年のウェルテル効果、2010年のパパゲーノ効果の提唱、2022年以降の実証研究、WHOの報道指針をたどる。結論は『前向きな話をすればよい』ではない。メディアは出来事を伝えると同時に、危機の中で人が取りうる行動の選択肢まで配っている。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/papageno-alternative-route-media?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/papageno-alternative-route-media?lang=ja");</script></body></html>

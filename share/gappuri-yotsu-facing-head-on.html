<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>がっぷり四つは、なぜ「正面から向き合う」になったのか</title><meta name="description" content="「がっぷり四つ」は、単に『実力が互角』という意味の言葉ではない。本来の相撲では、四つに組んだ両力士が互いに上手・下手でまわしを引き、胸が密着した具体的な状態を指す。本稿では、四つ相撲の身体配置、相四つ・けんか四つ・なまくら四つとの違いを整理しながら、なぜこの身体の形が『正面から取り組む』『互角に勝負する』という比喩へ広がったのかを考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/gappuri-yotsu-facing-head-on.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/gappuri-yotsu-facing-head-on.html"><meta property="og:title" content="がっぷり四つは、なぜ「正面から向き合う」になったのか"><meta property="og:description" content="「がっぷり四つ」は、単に『実力が互角』という意味の言葉ではない。本来の相撲では、四つに組んだ両力士が互いに上手・下手でまわしを引き、胸が密着した具体的な状態を指す。本稿では、四つ相撲の身体配置、相四つ・けんか四つ・なまくら四つとの違いを整理しながら、なぜこの身体の形が『正面から取り組む』『互角に勝負する』という比喩へ広がったのかを考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="がっぷり四つは、なぜ「正面から向き合う」になったのか"><meta name="twitter:description" content="「がっぷり四つ」は、単に『実力が互角』という意味の言葉ではない。本来の相撲では、四つに組んだ両力士が互いに上手・下手でまわしを引き、胸が密着した具体的な状態を指す。本稿では、四つ相撲の身体配置、相四つ・けんか四つ・なまくら四つとの違いを整理しながら、なぜこの身体の形が『正面から取り組む』『互角に勝負する』という比喩へ広がったのかを考える。"></head><body><main><article><h1>がっぷり四つは、なぜ「正面から向き合う」になったのか</h1><p>「がっぷり四つ」は、単に『実力が互角』という意味の言葉ではない。本来の相撲では、四つに組んだ両力士が互いに上手・下手でまわしを引き、胸が密着した具体的な状態を指す。本稿では、四つ相撲の身体配置、相四つ・けんか四つ・なまくら四つとの違いを整理しながら、なぜこの身体の形が『正面から取り組む』『互角に勝負する』という比喩へ広がったのかを考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/gappuri-yotsu-facing-head-on?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/gappuri-yotsu-facing-head-on?lang=ja");</script></body></html>

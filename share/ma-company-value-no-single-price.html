<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国が「会社の値段計算機」まで作った――会社に本当の値段はあるのか？</title><meta name="description" content="M&amp;A仲介の手数料を調べたら、国は同じ日に『株式価値の簡易計算』まで公開していた。ところがこの計算機は、会社に一つの正解価格を貼ってくれる道具ではない。2024年度の中小M&amp;A実績を使って架空の飲食店を計算すると、同じ財務でも3,300万円から1億7,400万円まで開く。EV/EBITDA、PER、PBR、買い手固有のシナジー、交渉を追うと、会社の価格は会社の中に埋まった数字ではなく、売り手と買い手が未来をどう見るかを圧縮した数字に見えてくる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/ma-company-value-no-single-price.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/ma-company-value-no-single-price.html"><meta property="og:title" content="国が「会社の値段計算機」まで作った――会社に本当の値段はあるのか？"><meta property="og:description" content="M&amp;A仲介の手数料を調べたら、国は同じ日に『株式価値の簡易計算』まで公開していた。ところがこの計算機は、会社に一つの正解価格を貼ってくれる道具ではない。2024年度の中小M&amp;A実績を使って架空の飲食店を計算すると、同じ財務でも3,300万円から1億7,400万円まで開く。EV/EBITDA、PER、PBR、買い手固有のシナジー、交渉を追うと、会社の価格は会社の中に埋まった数字ではなく、売り手と買い手が未来をどう見るかを圧縮した数字に見えてくる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="国が「会社の値段計算機」まで作った――会社に本当の値段はあるのか？"><meta name="twitter:description" content="M&amp;A仲介の手数料を調べたら、国は同じ日に『株式価値の簡易計算』まで公開していた。ところがこの計算機は、会社に一つの正解価格を貼ってくれる道具ではない。2024年度の中小M&amp;A実績を使って架空の飲食店を計算すると、同じ財務でも3,300万円から1億7,400万円まで開く。EV/EBITDA、PER、PBR、買い手固有のシナジー、交渉を追うと、会社の価格は会社の中に埋まった数字ではなく、売り手と買い手が未来をどう見るかを圧縮した数字に見えてくる。"></head><body><main><article><h1>国が「会社の値段計算機」まで作った――会社に本当の値段はあるのか？</h1><p>M&amp;A仲介の手数料を調べたら、国は同じ日に『株式価値の簡易計算』まで公開していた。ところがこの計算機は、会社に一つの正解価格を貼ってくれる道具ではない。2024年度の中小M&amp;A実績を使って架空の飲食店を計算すると、同じ財務でも3,300万円から1億7,400万円まで開く。EV/EBITDA、PER、PBR、買い手固有のシナジー、交渉を追うと、会社の価格は会社の中に埋まった数字ではなく、売り手と買い手が未来をどう見るかを圧縮した数字に見えてくる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/ma-company-value-no-single-price?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/ma-company-value-no-single-price?lang=ja");</script></body></html>

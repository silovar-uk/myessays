<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>週1回は、年間313日サボっている――それでも『続ける』と言っていい</title><meta name="description" content="週1回を1年続けると、実行日は約52日。つまり年間313日はやっていない。それでも、それは立派な『継続』なのか。CW-Xのイチローへのインタビューと習慣形成研究を手がかりに、毎日続けること、1回休むこと、戻ってくることの違いを考える。結論は『週1が正解』ではない。習慣は連続記録ではなく、行動へ戻る道を太くする設計なのかもしれない。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/ichiro-weekly-habit-return-path.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/ichiro-weekly-habit-return-path.html"><meta property="og:title" content="週1回は、年間313日サボっている――それでも『続ける』と言っていい"><meta property="og:description" content="週1回を1年続けると、実行日は約52日。つまり年間313日はやっていない。それでも、それは立派な『継続』なのか。CW-Xのイチローへのインタビューと習慣形成研究を手がかりに、毎日続けること、1回休むこと、戻ってくることの違いを考える。結論は『週1が正解』ではない。習慣は連続記録ではなく、行動へ戻る道を太くする設計なのかもしれない。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="週1回は、年間313日サボっている――それでも『続ける』と言っていい"><meta name="twitter:description" content="週1回を1年続けると、実行日は約52日。つまり年間313日はやっていない。それでも、それは立派な『継続』なのか。CW-Xのイチローへのインタビューと習慣形成研究を手がかりに、毎日続けること、1回休むこと、戻ってくることの違いを考える。結論は『週1が正解』ではない。習慣は連続記録ではなく、行動へ戻る道を太くする設計なのかもしれない。"></head><body><main><article><h1>週1回は、年間313日サボっている――それでも『続ける』と言っていい</h1><p>週1回を1年続けると、実行日は約52日。つまり年間313日はやっていない。それでも、それは立派な『継続』なのか。CW-Xのイチローへのインタビューと習慣形成研究を手がかりに、毎日続けること、1回休むこと、戻ってくることの違いを考える。結論は『週1が正解』ではない。習慣は連続記録ではなく、行動へ戻る道を太くする設計なのかもしれない。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/ichiro-weekly-habit-return-path?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/ichiro-weekly-habit-return-path?lang=ja");</script></body></html>

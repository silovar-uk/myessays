<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小林萌花史――ピアノを『特技』で終わらせない</title><meta name="description" content="2018年、特技・才能・技能を持つ人材を求めた『ONLY YOU』オーディションからBEYOOOOONDSへ加入した小林萌花。彼女のピアノは、加入時の個人的な強みから、楽曲、ライブ、オーケストラ共演、クラシック作品、ラジオへと広がっていった。『ピアノが上手いアイドル』という紹介ではなく、一人の専門性がグループの表現語彙へ組み込まれ、やがて外部の音楽文化と接続する橋になるまでを読む。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/kobayashi-honoka-history-specialty-shared-capability.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/kobayashi-honoka-history-specialty-shared-capability.html"><meta property="og:title" content="小林萌花史――ピアノを『特技』で終わらせない"><meta property="og:description" content="2018年、特技・才能・技能を持つ人材を求めた『ONLY YOU』オーディションからBEYOOOOONDSへ加入した小林萌花。彼女のピアノは、加入時の個人的な強みから、楽曲、ライブ、オーケストラ共演、クラシック作品、ラジオへと広がっていった。『ピアノが上手いアイドル』という紹介ではなく、一人の専門性がグループの表現語彙へ組み込まれ、やがて外部の音楽文化と接続する橋になるまでを読む。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="小林萌花史――ピアノを『特技』で終わらせない"><meta name="twitter:description" content="2018年、特技・才能・技能を持つ人材を求めた『ONLY YOU』オーディションからBEYOOOOONDSへ加入した小林萌花。彼女のピアノは、加入時の個人的な強みから、楽曲、ライブ、オーケストラ共演、クラシック作品、ラジオへと広がっていった。『ピアノが上手いアイドル』という紹介ではなく、一人の専門性がグループの表現語彙へ組み込まれ、やがて外部の音楽文化と接続する橋になるまでを読む。"></head><body><main><article><h1>小林萌花史――ピアノを『特技』で終わらせない</h1><p>2018年、特技・才能・技能を持つ人材を求めた『ONLY YOU』オーディションからBEYOOOOONDSへ加入した小林萌花。彼女のピアノは、加入時の個人的な強みから、楽曲、ライブ、オーケストラ共演、クラシック作品、ラジオへと広がっていった。『ピアノが上手いアイドル』という紹介ではなく、一人の専門性がグループの表現語彙へ組み込まれ、やがて外部の音楽文化と接続する橋になるまでを読む。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/kobayashi-honoka-history-specialty-shared-capability?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/kobayashi-honoka-history-specialty-shared-capability?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>『プリティ・ウーマン』は誰が誰を救ったのか？</title><meta name="description" content="『プリティ・ウーマン』を、現代版シンデレラだけで片づけずに見直す。1980年代末のM&amp;Aと消費文化、原案『3000』からの変化、ジュリア・ロバーツとリチャード・ギアの当時の立ち位置、劇中で二人が観る『椿姫』まで辿ると、この映画はヴィヴィアンだけでなくエドワードも変身する物語に見えてくる。なぜ買い物シーンがあれほど気持ちよく、なぜ今見ると少し引っかかるのか。その両方を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/pretty-woman-double-transformation-1990.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/pretty-woman-double-transformation-1990.html"><meta property="og:title" content="『プリティ・ウーマン』は誰が誰を救ったのか？"><meta property="og:description" content="『プリティ・ウーマン』を、現代版シンデレラだけで片づけずに見直す。1980年代末のM&amp;Aと消費文化、原案『3000』からの変化、ジュリア・ロバーツとリチャード・ギアの当時の立ち位置、劇中で二人が観る『椿姫』まで辿ると、この映画はヴィヴィアンだけでなくエドワードも変身する物語に見えてくる。なぜ買い物シーンがあれほど気持ちよく、なぜ今見ると少し引っかかるのか。その両方を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="『プリティ・ウーマン』は誰が誰を救ったのか？"><meta name="twitter:description" content="『プリティ・ウーマン』を、現代版シンデレラだけで片づけずに見直す。1980年代末のM&amp;Aと消費文化、原案『3000』からの変化、ジュリア・ロバーツとリチャード・ギアの当時の立ち位置、劇中で二人が観る『椿姫』まで辿ると、この映画はヴィヴィアンだけでなくエドワードも変身する物語に見えてくる。なぜ買い物シーンがあれほど気持ちよく、なぜ今見ると少し引っかかるのか。その両方を考える。"></head><body><main><article><h1>『プリティ・ウーマン』は誰が誰を救ったのか？</h1><p>『プリティ・ウーマン』を、現代版シンデレラだけで片づけずに見直す。1980年代末のM&amp;Aと消費文化、原案『3000』からの変化、ジュリア・ロバーツとリチャード・ギアの当時の立ち位置、劇中で二人が観る『椿姫』まで辿ると、この映画はヴィヴィアンだけでなくエドワードも変身する物語に見えてくる。なぜ買い物シーンがあれほど気持ちよく、なぜ今見ると少し引っかかるのか。その両方を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/pretty-woman-double-transformation-1990?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/pretty-woman-double-transformation-1990?lang=ja");</script></body></html>

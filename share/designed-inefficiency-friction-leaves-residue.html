<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最短距離では、途中のものを拾えない</title><meta name="description" content="効率化は、時間や手間を減らす。しかし手間の中には、能力、記憶、発見、関係、意味を生むものもある。努力研究、学習科学、空間認知、創造性、心理的豊かさ、他者との会話をたどりながら、「非効率そのもの」を礼賛せず、何をあえて残すと生活が厚くなるのかを考える。結論は、遠回りを増やすことではなく、消してはいけない摩擦を自分で選ぶことにある。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/designed-inefficiency-friction-leaves-residue.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/designed-inefficiency-friction-leaves-residue.html"><meta property="og:title" content="最短距離では、途中のものを拾えない"><meta property="og:description" content="効率化は、時間や手間を減らす。しかし手間の中には、能力、記憶、発見、関係、意味を生むものもある。努力研究、学習科学、空間認知、創造性、心理的豊かさ、他者との会話をたどりながら、「非効率そのもの」を礼賛せず、何をあえて残すと生活が厚くなるのかを考える。結論は、遠回りを増やすことではなく、消してはいけない摩擦を自分で選ぶことにある。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="最短距離では、途中のものを拾えない"><meta name="twitter:description" content="効率化は、時間や手間を減らす。しかし手間の中には、能力、記憶、発見、関係、意味を生むものもある。努力研究、学習科学、空間認知、創造性、心理的豊かさ、他者との会話をたどりながら、「非効率そのもの」を礼賛せず、何をあえて残すと生活が厚くなるのかを考える。結論は、遠回りを増やすことではなく、消してはいけない摩擦を自分で選ぶことにある。"></head><body><main><article><h1>最短距離では、途中のものを拾えない</h1><p>効率化は、時間や手間を減らす。しかし手間の中には、能力、記憶、発見、関係、意味を生むものもある。努力研究、学習科学、空間認知、創造性、心理的豊かさ、他者との会話をたどりながら、「非効率そのもの」を礼賛せず、何をあえて残すと生活が厚くなるのかを考える。結論は、遠回りを増やすことではなく、消してはいけない摩擦を自分で選ぶことにある。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/designed-inefficiency-friction-leaves-residue?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/designed-inefficiency-friction-leaves-residue?lang=ja");</script></body></html>

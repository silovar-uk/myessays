<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタジアムなのに、主役は「試合のない日」だった――長崎スタジアムシティ378.3億円を分解する</title><meta name="description" content="船井総合研究所が2026年10月に公表した長崎スタジアムシティ等の統合的インパクト評価レポートを、378.3億円という見出しだけでなく、算出構造と公開資料の整合性まで読み直す。図表に残る2.2億円の算術上のズレ、施設外へ広がる47％、試合のない日に生まれる約56％の需要、アウェイ客宿泊率48.1％の推計方法を検証し、長崎モデルの本質を「スタジアムの収益」ではなく「異なる時間軸の需要を束ねる街の稼働設計」と捉え直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/nagasaki-stadiumcity-matchless-days-economy.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/nagasaki-stadiumcity-matchless-days-economy.html"><meta property="og:title" content="スタジアムなのに、主役は「試合のない日」だった――長崎スタジアムシティ378.3億円を分解する"><meta property="og:description" content="船井総合研究所が2026年10月に公表した長崎スタジアムシティ等の統合的インパクト評価レポートを、378.3億円という見出しだけでなく、算出構造と公開資料の整合性まで読み直す。図表に残る2.2億円の算術上のズレ、施設外へ広がる47％、試合のない日に生まれる約56％の需要、アウェイ客宿泊率48.1％の推計方法を検証し、長崎モデルの本質を「スタジアムの収益」ではなく「異なる時間軸の需要を束ねる街の稼働設計」と捉え直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="スタジアムなのに、主役は「試合のない日」だった――長崎スタジアムシティ378.3億円を分解する"><meta name="twitter:description" content="船井総合研究所が2026年10月に公表した長崎スタジアムシティ等の統合的インパクト評価レポートを、378.3億円という見出しだけでなく、算出構造と公開資料の整合性まで読み直す。図表に残る2.2億円の算術上のズレ、施設外へ広がる47％、試合のない日に生まれる約56％の需要、アウェイ客宿泊率48.1％の推計方法を検証し、長崎モデルの本質を「スタジアムの収益」ではなく「異なる時間軸の需要を束ねる街の稼働設計」と捉え直す。"></head><body><main><article><h1>スタジアムなのに、主役は「試合のない日」だった――長崎スタジアムシティ378.3億円を分解する</h1><p>船井総合研究所が2026年10月に公表した長崎スタジアムシティ等の統合的インパクト評価レポートを、378.3億円という見出しだけでなく、算出構造と公開資料の整合性まで読み直す。図表に残る2.2億円の算術上のズレ、施設外へ広がる47％、試合のない日に生まれる約56％の需要、アウェイ客宿泊率48.1％の推計方法を検証し、長崎モデルの本質を「スタジアムの収益」ではなく「異なる時間軸の需要を束ねる街の稼働設計」と捉え直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/nagasaki-stadiumcity-matchless-days-economy?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「地に足をつける」に、土はいらない――グラウンディングをゼロから考える</title><meta name="description" content="「グラウンディング」とは、地面から謎の力をもらうことではない。見えるもの、聞こえる音、椅子の感触などを手がかりに、今いる場所と時間を確かめ直す対処法である。瞑想との関係、古い修行との距離、臨床現場での使われ方、5・4・3・2・1法の変形、科学的根拠の強弱、苦手な人への配慮まで、一次資料と極端な条件の思考実験で検証する。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/grounding-present-moment-not-earth-meditation-2026.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/grounding-present-moment-not-earth-meditation-2026.html"><meta property="og:title" content="「地に足をつける」に、土はいらない――グラウンディングをゼロから考える"><meta property="og:description" content="「グラウンディング」とは、地面から謎の力をもらうことではない。見えるもの、聞こえる音、椅子の感触などを手がかりに、今いる場所と時間を確かめ直す対処法である。瞑想との関係、古い修行との距離、臨床現場での使われ方、5・4・3・2・1法の変形、科学的根拠の強弱、苦手な人への配慮まで、一次資料と極端な条件の思考実験で検証する。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「地に足をつける」に、土はいらない――グラウンディングをゼロから考える"><meta name="twitter:description" content="「グラウンディング」とは、地面から謎の力をもらうことではない。見えるもの、聞こえる音、椅子の感触などを手がかりに、今いる場所と時間を確かめ直す対処法である。瞑想との関係、古い修行との距離、臨床現場での使われ方、5・4・3・2・1法の変形、科学的根拠の強弱、苦手な人への配慮まで、一次資料と極端な条件の思考実験で検証する。"></head><body><main><article><h1>「地に足をつける」に、土はいらない――グラウンディングをゼロから考える</h1><p>「グラウンディング」とは、地面から謎の力をもらうことではない。見えるもの、聞こえる音、椅子の感触などを手がかりに、今いる場所と時間を確かめ直す対処法である。瞑想との関係、古い修行との距離、臨床現場での使われ方、5・4・3・2・1法の変形、科学的根拠の強弱、苦手な人への配慮まで、一次資料と極端な条件の思考実験で検証する。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/grounding-present-moment-not-earth-meditation-2026?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/grounding-present-moment-not-earth-meditation-2026?lang=ja");</script></body></html>

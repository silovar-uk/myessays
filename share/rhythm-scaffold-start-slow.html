<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リズムに頼るのは、ズルではない――乗れるまでは、まずゆっくり</title><meta name="description" content="何かに乗れるまでは、リズムに頼っていいのではないか。調べてみると、人はリズムに反応しているだけではなく、次の拍を予測しながら動いていた。外部の拍は動きを縛るものではなく、内部に時間構造をつくるための一時的な足場になりうる。さらに、遅い練習には速い動作を改善する研究例がある一方、遅すぎる拍はかえって保持が難しくなる。『まずはゆっくり』とは、遅さを選ぶことではなく、自分が次を予測できる速度から始めることなのかもしれない。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/rhythm-scaffold-start-slow.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/rhythm-scaffold-start-slow.html"><meta property="og:title" content="リズムに頼るのは、ズルではない――乗れるまでは、まずゆっくり"><meta property="og:description" content="何かに乗れるまでは、リズムに頼っていいのではないか。調べてみると、人はリズムに反応しているだけではなく、次の拍を予測しながら動いていた。外部の拍は動きを縛るものではなく、内部に時間構造をつくるための一時的な足場になりうる。さらに、遅い練習には速い動作を改善する研究例がある一方、遅すぎる拍はかえって保持が難しくなる。『まずはゆっくり』とは、遅さを選ぶことではなく、自分が次を予測できる速度から始めることなのかもしれない。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="リズムに頼るのは、ズルではない――乗れるまでは、まずゆっくり"><meta name="twitter:description" content="何かに乗れるまでは、リズムに頼っていいのではないか。調べてみると、人はリズムに反応しているだけではなく、次の拍を予測しながら動いていた。外部の拍は動きを縛るものではなく、内部に時間構造をつくるための一時的な足場になりうる。さらに、遅い練習には速い動作を改善する研究例がある一方、遅すぎる拍はかえって保持が難しくなる。『まずはゆっくり』とは、遅さを選ぶことではなく、自分が次を予測できる速度から始めることなのかもしれない。"></head><body><main><article><h1>リズムに頼るのは、ズルではない――乗れるまでは、まずゆっくり</h1><p>何かに乗れるまでは、リズムに頼っていいのではないか。調べてみると、人はリズムに反応しているだけではなく、次の拍を予測しながら動いていた。外部の拍は動きを縛るものではなく、内部に時間構造をつくるための一時的な足場になりうる。さらに、遅い練習には速い動作を改善する研究例がある一方、遅すぎる拍はかえって保持が難しくなる。『まずはゆっくり』とは、遅さを選ぶことではなく、自分が次を予測できる速度から始めることなのかもしれない。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/rhythm-scaffold-start-slow?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/rhythm-scaffold-start-slow?lang=ja");</script></body></html>

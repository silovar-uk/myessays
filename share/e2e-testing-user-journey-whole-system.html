<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E2Eテストは、部品ではなく「最後まで使える」を確かめる</title><meta name="description" content="E2Eテスト（エンドツーエンドテスト）は、個々の部品が正しいかではなく、利用者の操作がシステムをまたいで最後まで成立するかを確かめる。定義を調べるつもりでMy Essaysの実装を見たところ、すでにPlaywrightでChromiumを動かし、日本語記事を開いて英語混じり版へ切り替えるブラウザ検証が組み込まれていた。自分のコードを材料に、E2Eの強さ、弱さ、境界、そして「何を自動化すべきか」を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/e2e-testing-user-journey-whole-system.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/e2e-testing-user-journey-whole-system.html"><meta property="og:title" content="E2Eテストは、部品ではなく「最後まで使える」を確かめる"><meta property="og:description" content="E2Eテスト（エンドツーエンドテスト）は、個々の部品が正しいかではなく、利用者の操作がシステムをまたいで最後まで成立するかを確かめる。定義を調べるつもりでMy Essaysの実装を見たところ、すでにPlaywrightでChromiumを動かし、日本語記事を開いて英語混じり版へ切り替えるブラウザ検証が組み込まれていた。自分のコードを材料に、E2Eの強さ、弱さ、境界、そして「何を自動化すべきか」を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="E2Eテストは、部品ではなく「最後まで使える」を確かめる"><meta name="twitter:description" content="E2Eテスト（エンドツーエンドテスト）は、個々の部品が正しいかではなく、利用者の操作がシステムをまたいで最後まで成立するかを確かめる。定義を調べるつもりでMy Essaysの実装を見たところ、すでにPlaywrightでChromiumを動かし、日本語記事を開いて英語混じり版へ切り替えるブラウザ検証が組み込まれていた。自分のコードを材料に、E2Eの強さ、弱さ、境界、そして「何を自動化すべきか」を考える。"></head><body><main><article><h1>E2Eテストは、部品ではなく「最後まで使える」を確かめる</h1><p>E2Eテスト（エンドツーエンドテスト）は、個々の部品が正しいかではなく、利用者の操作がシステムをまたいで最後まで成立するかを確かめる。定義を調べるつもりでMy Essaysの実装を見たところ、すでにPlaywrightでChromiumを動かし、日本語記事を開いて英語混じり版へ切り替えるブラウザ検証が組み込まれていた。自分のコードを材料に、E2Eの強さ、弱さ、境界、そして「何を自動化すべきか」を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/e2e-testing-user-journey-whole-system?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/e2e-testing-user-journey-whole-system?lang=ja");</script></body></html>

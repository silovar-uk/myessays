<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>借りられなかった本は、不人気なのか――ROASと「見せなかった需要」の話</title><meta name="description" content="広告の効率を守るほど新商品を試す機会が減るという逆説を、図書館の選書へ接続する。広告費用対効果（ROAS）の基本を説明し、実際の企業事例と図書館研究を踏まえて、数字が需要を記録するだけでなく、需要が観測される条件を左右するという問題を考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/roas-unseen-demand-library-shelves.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/roas-unseen-demand-library-shelves.html"><meta property="og:title" content="借りられなかった本は、不人気なのか――ROASと「見せなかった需要」の話"><meta property="og:description" content="広告の効率を守るほど新商品を試す機会が減るという逆説を、図書館の選書へ接続する。広告費用対効果（ROAS）の基本を説明し、実際の企業事例と図書館研究を踏まえて、数字が需要を記録するだけでなく、需要が観測される条件を左右するという問題を考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="借りられなかった本は、不人気なのか――ROASと「見せなかった需要」の話"><meta name="twitter:description" content="広告の効率を守るほど新商品を試す機会が減るという逆説を、図書館の選書へ接続する。広告費用対効果（ROAS）の基本を説明し、実際の企業事例と図書館研究を踏まえて、数字が需要を記録するだけでなく、需要が観測される条件を左右するという問題を考える。"></head><body><main><article><h1>借りられなかった本は、不人気なのか――ROASと「見せなかった需要」の話</h1><p>広告の効率を守るほど新商品を試す機会が減るという逆説を、図書館の選書へ接続する。広告費用対効果（ROAS）の基本を説明し、実際の企業事例と図書館研究を踏まえて、数字が需要を記録するだけでなく、需要が観測される条件を左右するという問題を考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/roas-unseen-demand-library-shelves?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/roas-unseen-demand-library-shelves?lang=ja");</script></body></html>

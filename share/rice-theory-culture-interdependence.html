<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>米か麦かではなく、「誰と働くか」が文化をつくる――稲作理論（Rice Theory）の現在地</title><meta name="description" content="稲作社会は協調的で、小麦作社会は個人主義的になる――いわゆるRice Theoryを、2014年の中国研究、2018年の日常行動観察、2024年の準自然実験、そして2025年の日本での反証的研究までたどる。重要なのは作物そのものより、共同灌漑や労働交換がつくる『相互依存の構造』かもしれない。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/rice-theory-culture-interdependence.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/rice-theory-culture-interdependence.html"><meta property="og:title" content="米か麦かではなく、「誰と働くか」が文化をつくる――稲作理論（Rice Theory）の現在地"><meta property="og:description" content="稲作社会は協調的で、小麦作社会は個人主義的になる――いわゆるRice Theoryを、2014年の中国研究、2018年の日常行動観察、2024年の準自然実験、そして2025年の日本での反証的研究までたどる。重要なのは作物そのものより、共同灌漑や労働交換がつくる『相互依存の構造』かもしれない。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="米か麦かではなく、「誰と働くか」が文化をつくる――稲作理論（Rice Theory）の現在地"><meta name="twitter:description" content="稲作社会は協調的で、小麦作社会は個人主義的になる――いわゆるRice Theoryを、2014年の中国研究、2018年の日常行動観察、2024年の準自然実験、そして2025年の日本での反証的研究までたどる。重要なのは作物そのものより、共同灌漑や労働交換がつくる『相互依存の構造』かもしれない。"></head><body><main><article><h1>米か麦かではなく、「誰と働くか」が文化をつくる――稲作理論（Rice Theory）の現在地</h1><p>稲作社会は協調的で、小麦作社会は個人主義的になる――いわゆるRice Theoryを、2014年の中国研究、2018年の日常行動観察、2024年の準自然実験、そして2025年の日本での反証的研究までたどる。重要なのは作物そのものより、共同灌漑や労働交換がつくる『相互依存の構造』かもしれない。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/rice-theory-culture-interdependence?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/rice-theory-culture-interdependence?lang=ja");</script></body></html>

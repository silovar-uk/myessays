<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「オッペケペー」は何を笑っていたのか</title><meta name="description" content="「オッペケペー、オッペケペッポー」。意味のない口拍子のような言葉が、明治20年代の日本を席巻した。川上音二郎のオッペケペー節は、自由や権利を説くだけの政治歌ではない。西洋風の服装や食事だけをまねる「上辺の文明開化」を笑い、派手な扮装と反復する囃子詞で観客を巻き込む、一つの見世物でもあった。本稿では、歌詞、1891年の錦絵・歌本、初演をめぐる異説、作者表記の揺れ、1900年の録音資料までをたどり、「一曲の流行歌」がどのように明治の街へ広がったのかを読む。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/oppekepe-bushi-meiji-hit-song.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/oppekepe-bushi-meiji-hit-song.html"><meta property="og:title" content="「オッペケペー」は何を笑っていたのか"><meta property="og:description" content="「オッペケペー、オッペケペッポー」。意味のない口拍子のような言葉が、明治20年代の日本を席巻した。川上音二郎のオッペケペー節は、自由や権利を説くだけの政治歌ではない。西洋風の服装や食事だけをまねる「上辺の文明開化」を笑い、派手な扮装と反復する囃子詞で観客を巻き込む、一つの見世物でもあった。本稿では、歌詞、1891年の錦絵・歌本、初演をめぐる異説、作者表記の揺れ、1900年の録音資料までをたどり、「一曲の流行歌」がどのように明治の街へ広がったのかを読む。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「オッペケペー」は何を笑っていたのか"><meta name="twitter:description" content="「オッペケペー、オッペケペッポー」。意味のない口拍子のような言葉が、明治20年代の日本を席巻した。川上音二郎のオッペケペー節は、自由や権利を説くだけの政治歌ではない。西洋風の服装や食事だけをまねる「上辺の文明開化」を笑い、派手な扮装と反復する囃子詞で観客を巻き込む、一つの見世物でもあった。本稿では、歌詞、1891年の錦絵・歌本、初演をめぐる異説、作者表記の揺れ、1900年の録音資料までをたどり、「一曲の流行歌」がどのように明治の街へ広がったのかを読む。"></head><body><main><article><h1>「オッペケペー」は何を笑っていたのか</h1><p>「オッペケペー、オッペケペッポー」。意味のない口拍子のような言葉が、明治20年代の日本を席巻した。川上音二郎のオッペケペー節は、自由や権利を説くだけの政治歌ではない。西洋風の服装や食事だけをまねる「上辺の文明開化」を笑い、派手な扮装と反復する囃子詞で観客を巻き込む、一つの見世物でもあった。本稿では、歌詞、1891年の錦絵・歌本、初演をめぐる異説、作者表記の揺れ、1900年の録音資料までをたどり、「一曲の流行歌」がどのように明治の街へ広がったのかを読む。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/oppekepe-bushi-meiji-hit-song?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/oppekepe-bushi-meiji-hit-song?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>「正しい。でも今それじゃない」の正体――Join first, judge later</title><meta name="description" content="友人が『会社辞めよかな』と言った瞬間、correct adviceを返したのになぜか会話がしぼむ。そこで『肯定する』とは別に、まず相手のconversationへjoinする行為を考える。validation、alignment / affiliation、advice-giving研究を辿ると、重要なのはagreementの有無より、相手が始めたstoryを一度共同で続けること、そしてresponseの順番だった。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/join-the-conversation-before-agreement.en.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/join-the-conversation-before-agreement.en.html"><meta property="og:title" content="「正しい。でも今それじゃない」の正体――Join first, judge later"><meta property="og:description" content="友人が『会社辞めよかな』と言った瞬間、correct adviceを返したのになぜか会話がしぼむ。そこで『肯定する』とは別に、まず相手のconversationへjoinする行為を考える。validation、alignment / affiliation、advice-giving研究を辿ると、重要なのはagreementの有無より、相手が始めたstoryを一度共同で続けること、そしてresponseの順番だった。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="「正しい。でも今それじゃない」の正体――Join first, judge later"><meta name="twitter:description" content="友人が『会社辞めよかな』と言った瞬間、correct adviceを返したのになぜか会話がしぼむ。そこで『肯定する』とは別に、まず相手のconversationへjoinする行為を考える。validation、alignment / affiliation、advice-giving研究を辿ると、重要なのはagreementの有無より、相手が始めたstoryを一度共同で続けること、そしてresponseの順番だった。"></head><body><main><article><h1>「正しい。でも今それじゃない」の正体――Join first, judge later</h1><p>友人が『会社辞めよかな』と言った瞬間、correct adviceを返したのになぜか会話がしぼむ。そこで『肯定する』とは別に、まず相手のconversationへjoinする行為を考える。validation、alignment / affiliation、advice-giving研究を辿ると、重要なのはagreementの有無より、相手が始めたstoryを一度共同で続けること、そしてresponseの順番だった。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/join-the-conversation-before-agreement?lang=en">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/join-the-conversation-before-agreement?lang=en");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADHDは「一つの原因」ではなく、複数の経路が同じ診断名に集まる</title><meta name="description" content="ADHDは、単一の原因や一つの生物学的異常を指す名前ではない。持続する不注意、多動性、衝動性と生活上の支障を基準にした診断概念であり、症状には統計的な共通因子が見える一方、原因側は多数の遺伝的要因や発達・環境要因、複数の認知経路が関わる。『因子』を症状因子、リスク因子、単一原因の三つに分けると、ADHDが何をまとめた名前なのかが見えやすくなる。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/adhd-one-label-many-pathways.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/adhd-one-label-many-pathways.html"><meta property="og:title" content="ADHDは「一つの原因」ではなく、複数の経路が同じ診断名に集まる"><meta property="og:description" content="ADHDは、単一の原因や一つの生物学的異常を指す名前ではない。持続する不注意、多動性、衝動性と生活上の支障を基準にした診断概念であり、症状には統計的な共通因子が見える一方、原因側は多数の遺伝的要因や発達・環境要因、複数の認知経路が関わる。『因子』を症状因子、リスク因子、単一原因の三つに分けると、ADHDが何をまとめた名前なのかが見えやすくなる。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="ADHDは「一つの原因」ではなく、複数の経路が同じ診断名に集まる"><meta name="twitter:description" content="ADHDは、単一の原因や一つの生物学的異常を指す名前ではない。持続する不注意、多動性、衝動性と生活上の支障を基準にした診断概念であり、症状には統計的な共通因子が見える一方、原因側は多数の遺伝的要因や発達・環境要因、複数の認知経路が関わる。『因子』を症状因子、リスク因子、単一原因の三つに分けると、ADHDが何をまとめた名前なのかが見えやすくなる。"></head><body><main><article><h1>ADHDは「一つの原因」ではなく、複数の経路が同じ診断名に集まる</h1><p>ADHDは、単一の原因や一つの生物学的異常を指す名前ではない。持続する不注意、多動性、衝動性と生活上の支障を基準にした診断概念であり、症状には統計的な共通因子が見える一方、原因側は多数の遺伝的要因や発達・環境要因、複数の認知経路が関わる。『因子』を症状因子、リスク因子、単一原因の三つに分けると、ADHDが何をまとめた名前なのかが見えやすくなる。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/adhd-one-label-many-pathways?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/adhd-one-label-many-pathways?lang=ja");</script></body></html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亀井絵里史――役割を決めすぎない強さ</title><meta name="description" content="亀井絵里を一つの肩書きに固定すると、かえって彼女の面白さを見失う。6期として加入し、バラエティではコミカルな役を担い、プラチナ期にはパフォーマーとして存在感を増し、ソロ曲や声優にも領域を広げた。センター、リーダー、歌姫のどれか一つになるのではなく、場面ごとに役割を変えながらグループの表現レンジを広げた人物として読む。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/kamei-eri-history-role-elasticity.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/kamei-eri-history-role-elasticity.html"><meta property="og:title" content="亀井絵里史――役割を決めすぎない強さ"><meta property="og:description" content="亀井絵里を一つの肩書きに固定すると、かえって彼女の面白さを見失う。6期として加入し、バラエティではコミカルな役を担い、プラチナ期にはパフォーマーとして存在感を増し、ソロ曲や声優にも領域を広げた。センター、リーダー、歌姫のどれか一つになるのではなく、場面ごとに役割を変えながらグループの表現レンジを広げた人物として読む。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="亀井絵里史――役割を決めすぎない強さ"><meta name="twitter:description" content="亀井絵里を一つの肩書きに固定すると、かえって彼女の面白さを見失う。6期として加入し、バラエティではコミカルな役を担い、プラチナ期にはパフォーマーとして存在感を増し、ソロ曲や声優にも領域を広げた。センター、リーダー、歌姫のどれか一つになるのではなく、場面ごとに役割を変えながらグループの表現レンジを広げた人物として読む。"></head><body><main><article><h1>亀井絵里史――役割を決めすぎない強さ</h1><p>亀井絵里を一つの肩書きに固定すると、かえって彼女の面白さを見失う。6期として加入し、バラエティではコミカルな役を担い、プラチナ期にはパフォーマーとして存在感を増し、ソロ曲や声優にも領域を広げた。センター、リーダー、歌姫のどれか一つになるのではなく、場面ごとに役割を変えながらグループの表現レンジを広げた人物として読む。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/kamei-eri-history-role-elasticity?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/kamei-eri-history-role-elasticity?lang=ja");</script></body></html>

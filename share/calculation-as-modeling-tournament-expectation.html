<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>計算は、式を立てる前にほぼ決まる</title><meta name="description" content="計算が苦手なとき、足りないのは暗算力や公式暗記とは限らない。多くの場合、難しいのは『現実の問いを、何を数えればよい問題へ変換するか』である。QuizKnockと学ぼうの『トーナメントの2位は本当に2位か？』を題材に、前提を固定し、小さい例で構造をつかみ、確率変数を定義し、場合の数と対称性の二つのルートで期待値2.6を導き、一般化して極限3を得るまでを丁寧に追う。最後に分散・検算・よくある誤りまで扱い、『計算をちゃんとする』ための再利用可能な型を作る。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/calculation-as-modeling-tournament-expectation.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/calculation-as-modeling-tournament-expectation.html"><meta property="og:title" content="計算は、式を立てる前にほぼ決まる"><meta property="og:description" content="計算が苦手なとき、足りないのは暗算力や公式暗記とは限らない。多くの場合、難しいのは『現実の問いを、何を数えればよい問題へ変換するか』である。QuizKnockと学ぼうの『トーナメントの2位は本当に2位か？』を題材に、前提を固定し、小さい例で構造をつかみ、確率変数を定義し、場合の数と対称性の二つのルートで期待値2.6を導き、一般化して極限3を得るまでを丁寧に追う。最後に分散・検算・よくある誤りまで扱い、『計算をちゃんとする』ための再利用可能な型を作る。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="計算は、式を立てる前にほぼ決まる"><meta name="twitter:description" content="計算が苦手なとき、足りないのは暗算力や公式暗記とは限らない。多くの場合、難しいのは『現実の問いを、何を数えればよい問題へ変換するか』である。QuizKnockと学ぼうの『トーナメントの2位は本当に2位か？』を題材に、前提を固定し、小さい例で構造をつかみ、確率変数を定義し、場合の数と対称性の二つのルートで期待値2.6を導き、一般化して極限3を得るまでを丁寧に追う。最後に分散・検算・よくある誤りまで扱い、『計算をちゃんとする』ための再利用可能な型を作る。"></head><body><main><article><h1>計算は、式を立てる前にほぼ決まる</h1><p>計算が苦手なとき、足りないのは暗算力や公式暗記とは限らない。多くの場合、難しいのは『現実の問いを、何を数えればよい問題へ変換するか』である。QuizKnockと学ぼうの『トーナメントの2位は本当に2位か？』を題材に、前提を固定し、小さい例で構造をつかみ、確率変数を定義し、場合の数と対称性の二つのルートで期待値2.6を導き、一般化して極限3を得るまでを丁寧に追う。最後に分散・検算・よくある誤りまで扱い、『計算をちゃんとする』ための再利用可能な型を作る。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/calculation-as-modeling-tournament-expectation?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/calculation-as-modeling-tournament-expecta

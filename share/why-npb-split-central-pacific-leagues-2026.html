<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>セ・パは、なぜ分かれたのか――野球のルールより先に新聞社が割れた日</title><meta name="description" content="日本のプロ野球にセ・リーグとパ・リーグがあるのは、強さや地域の違いで分類したからではない。1949年、正力松太郎による拡大構想と毎日新聞系の新球団参入をめぐり、既存8球団の賛否が4対4に割れた。二リーグ制はその対立を背景に生まれ、当初はセ8・パ7球団だった。球団の合併、1975年の指名打者制、2004年の再編危機、2005年の交流戦、2007年のパ・リーグ共同事業を追い、二つに分かれることが競争の器であり、同時に共同経営の課題でもあると考える。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/why-npb-split-central-pacific-leagues-2026.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/why-npb-split-central-pacific-leagues-2026.html"><meta property="og:title" content="セ・パは、なぜ分かれたのか――野球のルールより先に新聞社が割れた日"><meta property="og:description" content="日本のプロ野球にセ・リーグとパ・リーグがあるのは、強さや地域の違いで分類したからではない。1949年、正力松太郎による拡大構想と毎日新聞系の新球団参入をめぐり、既存8球団の賛否が4対4に割れた。二リーグ制はその対立を背景に生まれ、当初はセ8・パ7球団だった。球団の合併、1975年の指名打者制、2004年の再編危機、2005年の交流戦、2007年のパ・リーグ共同事業を追い、二つに分かれることが競争の器であり、同時に共同経営の課題でもあると考える。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="セ・パは、なぜ分かれたのか――野球のルールより先に新聞社が割れた日"><meta name="twitter:description" content="日本のプロ野球にセ・リーグとパ・リーグがあるのは、強さや地域の違いで分類したからではない。1949年、正力松太郎による拡大構想と毎日新聞系の新球団参入をめぐり、既存8球団の賛否が4対4に割れた。二リーグ制はその対立を背景に生まれ、当初はセ8・パ7球団だった。球団の合併、1975年の指名打者制、2004年の再編危機、2005年の交流戦、2007年のパ・リーグ共同事業を追い、二つに分かれることが競争の器であり、同時に共同経営の課題でもあると考える。"></head><body><main><article><h1>セ・パは、なぜ分かれたのか――野球のルールより先に新聞社が割れた日</h1><p>日本のプロ野球にセ・リーグとパ・リーグがあるのは、強さや地域の違いで分類したからではない。1949年、正力松太郎による拡大構想と毎日新聞系の新球団参入をめぐり、既存8球団の賛否が4対4に割れた。二リーグ制はその対立を背景に生まれ、当初はセ8・パ7球団だった。球団の合併、1975年の指名打者制、2004年の再編危機、2005年の交流戦、2007年のパ・リーグ共同事業を追い、二つに分かれることが競争の器であり、同時に共同経営の課題でもあると考える。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/why-npb-split-central-pacific-leagues-2026?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/why-npb-split-central-pacific-leagues-2026?lang=ja");</script></body></html>

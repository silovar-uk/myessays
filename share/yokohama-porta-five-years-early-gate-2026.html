<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>そごうができる5年前から「入口」だった――横浜ポルタの奇妙な先回り</title><meta name="description" content="横浜駅東口の地下街「ポルタ」は、そごう横浜店より約5年早く開業していた。イタリア語で「門」を意味する名前なのに、今の主要な行き先はまだ完成していなかった。横浜市・運営会社の沿革、1986年の地理学研究、制作者の記録、2026年の防災計画を突き合わせ、地下街を店の集合から都市の動線と安全を引き受ける仕組みとして読み直す。"><link rel="canonical" href="https://silovar-uk.github.io/myessays/share/yokohama-porta-five-years-early-gate-2026.html"><meta property="og:type" content="article"><meta property="og:site_name" content="My Essays"><meta property="og:url" content="https://silovar-uk.github.io/myessays/share/yokohama-porta-five-years-early-gate-2026.html"><meta property="og:title" content="そごうができる5年前から「入口」だった――横浜ポルタの奇妙な先回り"><meta property="og:description" content="横浜駅東口の地下街「ポルタ」は、そごう横浜店より約5年早く開業していた。イタリア語で「門」を意味する名前なのに、今の主要な行き先はまだ完成していなかった。横浜市・運営会社の沿革、1986年の地理学研究、制作者の記録、2026年の防災計画を突き合わせ、地下街を店の集合から都市の動線と安全を引き受ける仕組みとして読み直す。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="そごうができる5年前から「入口」だった――横浜ポルタの奇妙な先回り"><meta name="twitter:description" content="横浜駅東口の地下街「ポルタ」は、そごう横浜店より約5年早く開業していた。イタリア語で「門」を意味する名前なのに、今の主要な行き先はまだ完成していなかった。横浜市・運営会社の沿革、1986年の地理学研究、制作者の記録、2026年の防災計画を突き合わせ、地下街を店の集合から都市の動線と安全を引き受ける仕組みとして読み直す。"></head><body><main><article><h1>そごうができる5年前から「入口」だった――横浜ポルタの奇妙な先回り</h1><p>横浜駅東口の地下街「ポルタ」は、そごう横浜店より約5年早く開業していた。イタリア語で「門」を意味する名前なのに、今の主要な行き先はまだ完成していなかった。横浜市・運営会社の沿革、1986年の地理学研究、制作者の記録、2026年の防災計画を突き合わせ、地下街を店の集合から都市の動線と安全を引き受ける仕組みとして読み直す。</p><p><a href="https://silovar-uk.github.io/myessays/#/essay/yokohama-porta-five-years-early-gate-2026?lang=ja">My Essaysで本文を読む</a></p></article></main><script>location.replace("https://silovar-uk.github.io/myessays/#/essay/yokohama-porta-five-years-early-gate-2026?lang=ja");</script></body></html>

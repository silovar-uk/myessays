name: Route State Migration

on:
  push:
    paths:
      - 'tools/apply-route-state-migration-v4.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply route state migration
        run: python3 tools/apply-route-state-migration-v4.py
      - name: Run static tests
        run: node --test tests/*.test.js
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.js' index.html tests/route-state.test.js tests/runtime-assets.test.js scripts/reading-mode-url-qa.cjs .github/workflows/visual-qa.yml
          git commit -m 'Add shareable Reading Mode URLs'
          git push

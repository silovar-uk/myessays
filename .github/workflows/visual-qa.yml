name: Visual QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'data/**'
      - 'essays/**'
      - 'english-mix/**'
      - 'spanish/**'
      - 'tools/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/myessays-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/myessays-server.log
          exit 1

      - name: Run static tests
        run: node --test tests/*.test.js

      - name: Run reading versions browser QA
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/reading-versions-qa.cjs

      - name: Run Page Reader browser QA
        run: node scripts/page-reader-qa.cjs

      - name: Run browser QA
        env:
          BASE_URL: http://127.0.0.1:4173
          ESSAY_ID: utsunomiya-takasaki-shonan-shinjuku-ueno-tokyo
        run: node scripts/visual-qa.mjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

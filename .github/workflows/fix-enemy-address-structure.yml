name: Fix Enemy Address Structure

on:
  push:
    paths:
      - '.github/workflows/fix-enemy-address-structure.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore missing conclusion beat
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'english-mix/enemy-address-condition-not-person.md';
          let s = fs.readFileSync(p, 'utf8');
          const before = '**“Is that person really what we need to defeat?”**\n\n次に「あいつが敵だ」と思ったら、まず配管を探す。';
          const after = '**“Is that person really what we need to defeat?”**\n\nThat is the check I want to keep making.\n\n次に「あいつが敵だ」と思ったら、まず配管を探す。';
          if (!s.includes(before)) throw new Error('target text not found');
          s = s.replace(before, after);
          fs.writeFileSync(p, s);
          NODE
      - name: Validate paired structure strictly
        run: node scripts/validate-version-structure.mjs --id enemy-address-condition-not-person
      - name: Clean audit and commit fix
        run: |
          rm -f enemy-address-audit.json
          rm .github/workflows/fix-enemy-address-structure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english-mix/enemy-address-condition-not-person.md enemy-address-audit.json .github/workflows/fix-enemy-address-structure.yml
          git commit -m '敵の宛先論考の日英構造を一致させる'
          git push

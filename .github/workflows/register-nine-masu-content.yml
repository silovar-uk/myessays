name: Register Nine Masu Content

on:
  push:
    branches:
      - feat/consulting-nine-masu
    paths:
      - REGISTER_NINE_MASU.trigger

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consulting-nine-masu
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register article and reading version
        run: node scripts/register-nine-masu-content.cjs
      - name: Commit generated indexes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/versions-index.json
          if git diff --cached --quiet; then
            echo "Indexes already registered"
            exit 0
          fi
          git commit -m "Register consulting nine-masu article"
          git push origin HEAD:feat/consulting-nine-masu

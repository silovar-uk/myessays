name: Register Design Literacy 55 Temp

on:
  push:
    paths:
      - '.github/workflows/register-design-literacy-55-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-validate-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update indexes
        shell: python
        run: |
          import json
          from pathlib import Path

          slug = 'design-literacy-proximity-whitespace-semantic-spacing'
          essay_path = f'essays/2026-09-18-{slug}.md'
          en_path = f'english-mix/{slug}.md'

          index_path = Path('data/index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          essays = index['essays']
          if essay_path not in essays:
              essays.insert(0, essay_path)
          index_path.write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          versions_path = Path('data/versions-index.json')
          versions = json.loads(versions_path.read_text(encoding='utf-8'))
          versions.setdefault('articles', {})[slug] = {'en-mix': en_path}
          versions_path.write_text(json.dumps(versions, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

      - name: Validate version structure
        run: node scripts/validate-version-structure.mjs --id design-literacy-proximity-whitespace-semantic-spacing

      - name: Remove temporary workflow and publish indexes
        run: |
          rm .github/workflows/register-design-literacy-55-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/versions-index.json .github/workflows/register-design-literacy-55-temp.yml
          git commit -m "Design Literacy #55をインデックス登録"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

# retry-after-en-mix-structure-sync

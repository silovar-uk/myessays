name: One-shot merge Braess article manifests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-merge-braess-manifest.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge article into canonical manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          essay_path = 'essays/2026-09-09-braess-paradox-zero-minute-shortcut.md'
          article_id = 'braess-paradox-zero-minute-shortcut'
          en_mix_path = 'english-mix/braess-paradox-zero-minute-shortcut.md'

          index_path = Path('data/index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['essays'] = [essay_path] + [p for p in index.get('essays', []) if p != essay_path]
          index_path.write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          versions_path = Path('data/versions-index.json')
          versions = json.loads(versions_path.read_text(encoding='utf-8'))
          articles = versions.setdefault('articles', {})
          current = dict(articles.get(article_id, {}))
          current['en-mix'] = en_mix_path
          versions['articles'] = {article_id: current, **{k: v for k, v in articles.items() if k != article_id}}
          versions_path.write_text(json.dumps(versions, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          overlay = '  <script src="manifest-additions.js?v=20260909-1" defer></script>\n'
          if overlay not in html:
              raise SystemExit('Runtime manifest overlay script tag not found')
          html_path.write_text(html.replace(overlay, '', 1), encoding='utf-8')

          json.loads(index_path.read_text(encoding='utf-8'))
          json.loads(versions_path.read_text(encoding='utf-8'))
          PY

      - name: Commit canonical manifests and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/versions-index.json index.html
          git rm manifest-additions.js
          git rm .github/workflows/one-shot-merge-braess-manifest.yml
          git commit -m "ブライス記事を正規索引へ統合"
          git push

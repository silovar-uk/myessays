name: One-shot Resonance QA

on:
  push:
    branches: [feature/reader-resonance]
    paths:
      - '.github/workflows/one-shot-resonance-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/reader-resonance

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check reading-state-store.js
          node --check reading-state-ui.js
          node --check reader-resonance.js
          node --check reader-v2.js

      - name: Verify Favorite migration
        run: node tools/remove-favorite-frontmatter.mjs --check

      - name: Run focused regression tests
        run: node --test tests/favorite-removal.test.js tests/reader-resonance.test.js tests/reader-reflections.test.js tests/reader-architecture.test.js tests/runtime-assets.test.js

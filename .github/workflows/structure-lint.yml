name: Structure lint

on:
  push:
    branches: [main]
    paths:
      - 'essays/**'
      - 'english-mix/**'
      - 'spanish-mix/**'
      - 'data/versions-index.json'
      - 'scripts/validate-version-structure.mjs'
      - 'scripts/validate-structure-regressions.mjs'
      - 'tests/structure-lint.test.mjs'
      - 'reader-japanese-reference.js'
      - 'AGENTS.md'
      - '.github/workflows/structure-lint.yml'
  pull_request:
    paths:
      - 'essays/**'
      - 'english-mix/**'
      - 'spanish-mix/**'
      - 'data/versions-index.json'
      - 'scripts/validate-version-structure.mjs'
      - 'scripts/validate-structure-regressions.mjs'
      - 'tests/structure-lint.test.mjs'
      - 'reader-japanese-reference.js'
      - 'AGENTS.md'
      - '.github/workflows/structure-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks
        run: |
          node --check reader-japanese-reference.js
          node --check scripts/validate-version-structure.mjs
          node --check scripts/validate-structure-regressions.mjs

      - name: Regression tests
        run: |
          set -o pipefail
          node --test tests/structure-lint.test.mjs 2>&1 | tee structure-tests.txt

      - name: Full repository audit
        if: always()
        run: node scripts/validate-version-structure.mjs --all --report-only --json structure-audit.json

      - name: Upload structure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-diagnostics
          path: |
            structure-audit.json
            structure-tests.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Regression gate for changed article pairs
        if: success() && github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/validate-structure-regressions.mjs --base "$BASE_SHA"

      - name: Strict full gate (manual migration check)
        if: success() && github.event_name == 'workflow_dispatch'
        run: node scripts/validate-version-structure.mjs --all

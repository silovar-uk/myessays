name: Aozora URL Import QA Temp

on:
  push:
    branches:
      - 'feat/aozora-url-import-20260927'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check aozora-source.js
          node --check aozora-parser.js
          node --check aozora-books.js
          node --check app.js
          node --input-type=module --check < workers/aozora-fetch-worker/src/index.js
      - name: Focused static tests
        run: node --test tests/aozora-source.test.js tests/aozora-worker.test.js tests/aozora-reader.test.js tests/reader-rsvp.test.js tests/reader-architecture.test.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/myessays-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/myessays-server.log
          exit 1
      - name: Aozora URL browser QA
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/aozora-reader-qa.cjs

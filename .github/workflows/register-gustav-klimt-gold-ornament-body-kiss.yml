name: Register Gustav Klimt Essay

on:
  push:
    paths:
      - '.github/workflows/register-gustav-klimt-gold-ornament-body-kiss.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Register canonical essay and English Mix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const essayPath = 'essays/2026-09-17-gustav-klimt-gold-ornament-body-kiss.md';
          const id = 'gustav-klimt-gold-ornament-body-kiss';
          const mixPath = 'english-mix/gustav-klimt-gold-ornament-body-kiss.md';

          const indexPath = 'data/index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          index.essays = index.essays.filter((p) => p !== essayPath);
          index.essays.unshift(essayPath);
          fs.writeFileSync(indexPath, JSON.stringify(index));

          const versionsPath = 'data/versions-index.json';
          const versions = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          versions.articles ||= {};
          const existing = versions.articles[id] || {};
          const nextArticle = { ...existing, 'en-mix': mixPath };
          versions.articles = {
            [id]: nextArticle,
            ...Object.fromEntries(Object.entries(versions.articles).filter(([key]) => key !== id))
          };
          fs.writeFileSync(versionsPath, JSON.stringify(versions));

          JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          console.log('Registration JSON validated.');
          NODE
      - name: Validate version structure
        run: node scripts/validate-version-structure.mjs --id gustav-klimt-gold-ornament-body-kiss
      - name: Commit registration and remove temporary workflow
        run: |
          rm .github/workflows/register-gustav-klimt-gold-ornament-body-kiss.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index.json data/versions-index.json .github/workflows/register-gustav-klimt-gold-ornament-body-kiss.yml
          git commit -m 'クリムト論考を登録して構造検証'
          git push

name: Apply structure migration batch 003

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-structure-migration-batch-003.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dry-run verified batch
        run: node scripts/apply-structure-migration.mjs --plan data/structure-migrations/batch-003.json
      - name: Apply verified batch
        run: node scripts/apply-structure-migration.mjs --plan data/structure-migrations/batch-003.json --apply
      - name: Strictly validate migrated articles
        run: |
          node scripts/validate-version-structure.mjs --id nikkei-headlines-four-vectors
          node scripts/validate-version-structure.mjs --id america-cities-02-boston
          git diff --check
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english-mix/
          git commit -m 'Migrate verified ENMIX structures in batch 003'
          git push

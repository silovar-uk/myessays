name: Register Watanabe Hisanobu essay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-watanabe-hisanobu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register Japanese and EN MIX versions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          essay_path = 'essays/2026-09-08-watanabe-hisanobu-same-baseball-different-chair.md'
          slug = 'watanabe-hisanobu-same-baseball-different-chair'
          en_path = 'english-mix/watanabe-hisanobu-same-baseball-different-chair.md'

          index_path = Path('data/index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          essays = index.setdefault('essays', [])
          if essay_path in essays:
              essays.remove(essay_path)
          essays.insert(0, essay_path)
          index_path.write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          versions_path = Path('data/versions-index.json')
          versions = json.loads(versions_path.read_text(encoding='utf-8'))
          articles = versions.setdefault('articles', {})
          entry = {'en-mix': en_path}
          versions['articles'] = {slug: entry, **{k: v for k, v in articles.items() if k != slug}}
          versions_path.write_text(json.dumps(versions, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          json.loads(index_path.read_text(encoding='utf-8'))
          json.loads(versions_path.read_text(encoding='utf-8'))
          print('JSON validation OK')
          PY

      - name: Commit registration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index.json data/versions-index.json
          git rm .github/workflows/register-watanabe-hisanobu.yml
          git commit -m '渡辺久信記事を一覧とEN MIXに登録'
          git push origin HEAD:main

name: Apply structure migration batch 001

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-structure-migration-batch-001.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax and regression tests
        run: |
          node --check scripts/validate-version-structure.mjs
          node --check scripts/report-structure-migration.mjs
          node --check scripts/apply-structure-migration.mjs
          node --test tests/structure-lint.test.mjs tests/structure-migration.test.mjs

      - name: Dry-run verified plan
        run: node scripts/apply-structure-migration.mjs --plan data/structure-migrations/batch-001.json

      - name: Apply verified plan
        run: node scripts/apply-structure-migration.mjs --plan data/structure-migrations/batch-001.json --apply

      - name: Strictly validate migrated articles
        run: |
          for id in \
            kyoki-joyful-surprise \
            soka-leather-industry-water-tokyo-reinvention \
            npb-roster-construction-mechanism-integration \
            design-literacy-graphical-perception-visual-encoding \
            noticing-what-you-dont-understand
          do
            node scripts/validate-version-structure.mjs --id "$id"
          done
          git diff --check

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english-mix/
          git commit -m 'Migrate first five ENMIX structures to canonical blocks'
          git push

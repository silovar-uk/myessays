name: One-shot Design Literacy Rule Break Lab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-design-literacy-rule-break-lab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add progressive Rule Break Lab to JA and English Mix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ja_path = Path('essays/2026-09-08-design-literacy-weingart-rule-deviation-grid.md')
          en_path = Path('english-mix/design-literacy-weingart-rule-deviation-grid.md')

          ja = ja_path.read_text(encoding='utf-8')
          en = en_path.read_text(encoding='utf-8')

          ja_marker = '一変数を外し、その差が意味を持ったかを見る。\n\n---'
          en_marker = '最初の試作では、一変数だけ外して、その差にmeaningがあるかを見る。\n\n---'

          ja_lab = r'''一変数を外し、その差が意味を持ったかを見る。

<div class="dl-visual" role="group" aria-label="同じイベント告知で基準、一変数の逸脱、複数変数の逸脱を比較するRule Break Lab">
<p class="dl-visual-kicker">RULE BREAK LAB</p>
<p class="dl-visual-title"><strong>何を壊したかより、何を残したかを見る。</strong></p>
<div class="dl-compare">
<div class="dl-panel">
<p class="dl-panel-label">BASELINE — RULES VISIBLE</p>
<div class="dl-demo-card">
<p class="dl-event">URAWA REDS</p>
<p class="dl-meta">9.19 SAT</p>
<p class="dl-event">VS TOKYO V</p>
<p class="dl-meta">SPECIAL EVENT</p>
</div>
</div>
<div class="dl-panel dl-panel-after">
<p class="dl-panel-label">ONE DEVIATION — POSITION</p>
<div class="dl-demo-card">
<p class="dl-event">URAWA REDS</p>
<p class="dl-meta">9.19 SAT</p>
<p class="dl-event">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;VS TOKYO V</p>
<p class="dl-meta">SPECIAL EVENT</p>
</div>
</div>
</div>
<p class="dl-visual-note">まずは2枚だけ比較する。右で変えたのはPositionだけ。Grid、typeface、hierarchyが残っているから、「ズレ」が差分として読める。</p>

<details class="dl-panel">
<summary><strong>Position</strong> — 位置だけ変える</summary>
<pre>URAWA REDS
9.19 SAT
        VS TOKYO V
SPECIAL EVENT</pre>
<p class="dl-visual-note"><strong>BROKEN:</strong> Position ／ <strong>KEPT:</strong> Grid, Typeface, Hierarchy</p>
</details>

<details class="dl-panel">
<summary><strong>Angle</strong> — 方向だけ変える</summary>
<pre>URAWA REDS
9.19 SAT
      ／ VS TOKYO V ／
SPECIAL EVENT</pre>
<p class="dl-visual-note"><strong>BROKEN:</strong> Angle ／ <strong>KEPT:</strong> Position, Typeface, Hierarchy</p>
</details>

<details class="dl-panel">
<summary><strong>Size</strong> — サイズ差だけ強くする</summary>
<div class="dl-demo-card">
<p class="dl-meta">URAWA REDS</p>
<p class="dl-meta">9.19 SAT</p>
<h4>VS TOKYO V</h4>
<p class="dl-meta">SPECIAL EVENT</p>
</div>
<p class="dl-visual-note"><strong>BROKEN:</strong> Size ／ <strong>KEPT:</strong> Position, Direction, Typeface</p>
</details>

<details class="dl-panel">
<summary><strong>Spacing</strong> — 字間だけ変える</summary>
<pre>URAWA REDS
9.19 SAT
V S   T O K Y O   V
SPECIAL EVENT</pre>
<p class="dl-visual-note"><strong>BROKEN:</strong> Letter Spacing ／ <strong>KEPT:</strong> Position, Size, Direction</p>
</details>

<details class="dl-panel">
<summary><strong>Compare with chaos</strong> — 複数変数を同時に動かす</summary>
<pre>     URAWA
 REDS
        9.19
   / SAT
VS
      TOKYO V
 SPECIAL
       EVENT</pre>
<p class="dl-visual-note">Position、Angle、Size、Spacingを一度に変えると、強い表現にはなり得る一方、「どの差が何を効かせたか」を診断しにくくなる。これは失敗例ではなく、検証可能性が下がる比較例。</p>
</details>
</div>

---'''

          en_lab = r'''最初の試作では、一変数だけ外して、その差にmeaningがあるかを見る。

<div class="dl-visual" role="group" aria-label="Rule Break Lab comparing a baseline, one controlled deviation, and multiple simultaneous deviations">
<p class="dl-visual-kicker">RULE BREAK LAB</p>
<p class="dl-visual-title"><strong>Don’t only ask what you broke. Ask what you kept.</strong></p>
<div class="dl-compare">
<div class="dl-panel">
<p class="dl-panel-label">BASELINE — RULES VISIBLE</p>
<div class="dl-demo-card">
<p class="dl-event">URAWA REDS</p>
<p class="dl-meta">9.19 SAT</p>
<p class="dl-event">VS TOKYO V</p>
<p class="dl-meta">SPECIAL EVENT</p>
</div>
</div>
<div class="dl-panel dl-panel-after">
<p class="dl-panel-label">ONE DEVIATION — POSITION</p>
<div class="dl-demo-card">
<p class="dl-event">URAWA REDS</p>
<p class="dl-meta">9.19 SAT</p>
<p class="dl-event">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;VS TOKYO V</p>
<p class="dl-meta">SPECIAL EVENT</p>
</div>
</div>
</div>
<p class="dl-visual-note">Start with only these two. The right-hand version changes Position, while Grid, Typeface and Hierarchy remain visible. That is why the shift reads as a decision rather than random noise.</p>

<details class="dl-panel">
<summary><strong>Position</strong> — move only the position</summary>
<pre>URAWA REDS
9.19 SAT
        VS TOKYO V
SPECIAL EVENT</pre>
<p class="dl-visual-note"><strong>BROKEN:</strong> Position ／ <strong>KEPT:</strong> Grid, Typeface, Hierarchy</p>
</details>

<details class="dl-panel">
<summary><strong>Angle</strong> — change only the direction</summary>
<pre>URAWA REDS
9.19 SAT
      / VS TOKYO V /
SPECIAL EVENT</pre>
<p class="dl-visual-note"><strong>BROKEN:</strong> Angle ／ <strong>KEPT:</strong> Position, Typeface, Hierarchy</p>
</details>

<details class="dl-panel">
<summary><strong>Size</strong> — amplify only scale</summary>
<div class="dl-demo-card">
<p class="dl-meta">URAWA REDS</p>
<p class="dl-meta">9.19 SAT</p>
<h4>VS TOKYO V</h4>
<p class="dl-meta">SPECIAL EVENT</p>
</div>
<p class="dl-visual-note"><strong>BROKEN:</strong> Size ／ <strong>KEPT:</strong> Position, Direction, Typeface</p>
</details>

<details class="dl-panel">
<summary><strong>Spacing</strong> — change only letter spacing</summary>
<pre>URAWA REDS
9.19 SAT
V S   T O K Y O   V
SPECIAL EVENT</pre>
<p class="dl-visual-note"><strong>BROKEN:</strong> Letter Spacing ／ <strong>KEPT:</strong> Position, Size, Direction</p>
</details>

<details class="dl-panel">
<summary><strong>Compare with chaos</strong> — move several variables at once</summary>
<pre>     URAWA
 REDS
        9.19
   / SAT
VS
      TOKYO V
 SPECIAL
       EVENT</pre>
<p class="dl-visual-note">Moving Position, Angle, Size and Spacing together may create a strong composition, but it becomes harder to diagnose which difference created which effect. This is not labelled a failure; it is a comparison with lower experimental clarity.</p>
</details>
</div>

---'''

          if 'RULE BREAK LAB' not in ja:
              if ja_marker not in ja:
                  raise SystemExit('Japanese insertion marker not found')
              ja = ja.replace(ja_marker, ja_lab, 1)
          if 'updated: "2026-09-08"' in ja:
              ja = ja.replace('updated: "2026-09-08"', 'updated: "2026-09-09"', 1)

          if 'RULE BREAK LAB' not in en:
              if en_marker not in en:
                  raise SystemExit('English Mix insertion marker not found')
              en = en.replace(en_marker, en_lab, 1)

          ja_path.write_text(ja, encoding='utf-8')
          en_path.write_text(en, encoding='utf-8')
          PY

      - name: Structural QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ja = Path('essays/2026-09-08-design-literacy-weingart-rule-deviation-grid.md').read_text(encoding='utf-8')
          en = Path('english-mix/design-literacy-weingart-rule-deviation-grid.md').read_text(encoding='utf-8')
          for label, text in [('JA', ja), ('EN MIX', en)]:
              assert text.count('RULE BREAK LAB') == 1, f'{label}: lab count mismatch'
              for term in ['Position', 'Angle', 'Size', 'Spacing', 'Compare with chaos', 'BROKEN:', 'KEPT:']:
                  assert term in text, f'{label}: missing {term}'
              assert text.count('<details class="dl-panel">') == 5, f'{label}: expected 5 disclosures'
          assert 'updated: "2026-09-09"' in ja
          print('Rule Break Lab structural QA passed')
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git add essays/2026-09-08-design-literacy-weingart-rule-deviation-grid.md english-mix/design-literacy-weingart-rule-deviation-grid.md
          git rm .github/workflows/one-shot-design-literacy-rule-break-lab.yml
          git commit -m "Design Literacy #26にRule Break Labを追加"
          git push
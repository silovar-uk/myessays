name: Lazy Library Browser QA

on:
  push:
    branches:
      - main
      - feat/lazy-library-catalog-20261030
    paths:
      - 'app.js'
      - 'index.html'
      - 'ui-enhancements.css'
      - 'data/catalog.json'
      - 'scripts/library-smoke-browser.mjs'
      - '.github/workflows/library-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/myessays-library-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/myessays-library-server.log
          exit 1
      - name: Verify no Markdown downloads on initial view
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/library-smoke-browser.mjs

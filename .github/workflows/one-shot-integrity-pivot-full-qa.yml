name: One-shot Integrity and Pivot Full QA
# rerun after article-end user-intent QA was corrected

on:
  push:
    branches: [investigate/integrity-pivot-20260918]
    paths:
      - '.github/workflows/one-shot-integrity-pivot-full-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: investigate/integrity-pivot-20260918
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify content integrity
        run: |
          node tools/sync-content-indexes.mjs --check
          node tools/audit-content.mjs --strict

      - name: Run all static tests
        run: node --test tests/*.test.js

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/myessays-full-qa.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/myessays-full-qa.log
          exit 1

      - name: Run Reading Pivot browser QA
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/reading-pivot-qa.cjs

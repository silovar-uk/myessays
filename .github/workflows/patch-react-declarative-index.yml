name: Patch React declarative essay indexes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-react-declarative-index.yml'

permissions:
  contents: write

jobs:
  patch-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch JSON indexes safely
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          essay_id = 'react-declarative-ui-who-does-the-dom-work'
          essay_path = 'essays/2026-09-14-react-declarative-ui-who-does-the-dom-work.md'
          mix_path = 'english-mix/react-declarative-ui-who-does-the-dom-work.md'

          index_path = Path('data/index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          essays = index['essays']

          # Repair the accidental path regression detected during verification.
          wrong = 'essays/2026-08-24-melon-kinenbi-live-community.md'
          correct = 'essays/2026-08-24-melon-kinenbi-history-live-community.md'
          essays[:] = [correct if p == wrong else p for p in essays]

          if essay_path not in essays:
              essays.insert(0, essay_path)
          index_path.write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          versions_path = Path('data/versions-index.json')
          versions = json.loads(versions_path.read_text(encoding='utf-8'))
          versions.setdefault('articles', {}).setdefault(essay_id, {})['en-mix'] = mix_path
          versions_path.write_text(json.dumps(versions, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index.json data/versions-index.json
          git rm .github/workflows/patch-react-declarative-index.yml
          git commit -m 'Finalize React declarative UI essay indexes'
          git push

name: Register Design Literacy 34

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-design-literacy-34.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Register article and English Mix
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          essay_path = 'essays/2026-09-11-design-literacy-error-prevention-before-error-message.md'
          article_id = 'design-literacy-error-prevention-before-error-message'
          en_path = 'english-mix/design-literacy-error-prevention-before-error-message.md'

          index_path = Path('data/index.json')
          index = json.loads(index_path.read_text())
          essays = index['essays']
          if essay_path not in essays:
              essays.insert(0, essay_path)
          index_path.write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')) + '\n')

          versions_path = Path('data/versions-index.json')
          versions = json.loads(versions_path.read_text())
          versions.setdefault('articles', {}).setdefault(article_id, {})['en-mix'] = en_path
          versions_path.write_text(json.dumps(versions, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY

      - name: Commit registration and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/versions-index.json
          git rm .github/workflows/register-design-literacy-34.yml
          git commit -m "Publish Design Literacy #34"
          git push

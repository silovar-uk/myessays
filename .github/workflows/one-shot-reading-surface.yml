name: One-shot final-geometry semantic restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-reading-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore semantic eye-line only after final transition geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, got {count}')
              return text.replace(old, new, 1)

          path = Path('reader-versions.js')
          source = path.read_text()

          source = replace_once(
              source,
              """    document.dispatchEvent(new CustomEvent('myessays:reader-version-changed', {\n      detail: { essayId: id, version, locator, pairId }\n    }));\n    document.dispatchEvent(new CustomEvent('myessays:reader-language-changed', {\n      detail: { essayId: id, mode: version, locator, pairId }\n    }));\n    return true;\n  }\n\n  function waitForReadySignal""",
              """    document.dispatchEvent(new CustomEvent('myessays:reader-version-changed', {\n      detail: { essayId: id, version, locator, pairId }\n    }));\n    return true;\n  }\n\n  function dispatchLanguageChanged({ id, version, locator, pairId }) {\n    if (id !== currentEssayId()) return false;\n    document.dispatchEvent(new CustomEvent('myessays:reader-language-changed', {\n      detail: { essayId: id, mode: version, locator, pairId }\n    }));\n    return true;\n  }\n\n  function waitForReadySignal""",
              'separate language-changed from DOM commit'
          )

          source = replace_once(
              source,
              """      if (canAnimateReadingSurface()) {\n        document.activeViewTransition?.skipTransition?.();\n        const transition = document.startViewTransition(update);\n        await transition.updateCallbackDone;\n      } else {\n        await update();\n      }\n      return completed;\n""",
              """      if (canAnimateReadingSurface()) {\n        document.activeViewTransition?.skipTransition?.();\n        const transition = document.startViewTransition(update);\n        await transition.updateCallbackDone;\n        // View Transition snapshots may continue affecting document geometry\n        // after the DOM callback is complete. Semantic restoration must target\n        // the final live layout, not the intermediate transition geometry.\n        await transition.finished;\n      } else {\n        await update();\n      }\n      if (!completed || id !== currentEssayId()) return false;\n      return dispatchLanguageChanged({ id, version, locator, pairId });\n""",
              'wait for final transition geometry before semantic restore'
          )

          path.write_text(source)

          test_path = Path('tests/reader-reading-pivot.test.js')
          tests = test_path.read_text()
          marker = "test('semantic restore begins only after View Transition final geometry', () => {"
          if marker not in tests:
              tests += """\n\ntest('semantic restore begins only after View Transition final geometry', () => {\n  const versions = read('reader-versions.js');\n  const updateDone = versions.indexOf('await transition.updateCallbackDone');\n  const finished = versions.indexOf('await transition.finished', updateDone);\n  const languageDispatch = versions.indexOf('return dispatchLanguageChanged({ id, version, locator, pairId })', finished);\n  assert.ok(updateDone >= 0, 'View Transition DOM update boundary should exist');\n  assert.ok(finished > updateDone, 'final geometry must wait for transition.finished');\n  assert.ok(languageDispatch > finished, 'semantic language handoff must start after transition.finished');\n  const commitStart = versions.indexOf('async function commitVersionSwap');\n  const helperStart = versions.indexOf('function dispatchLanguageChanged', commitStart);\n  const commitBody = versions.slice(commitStart, helperStart);\n  assert.doesNotMatch(commitBody, /reader-language-changed/);\n});\n"""
              test_path.write_text(tests)
          PY

      - name: Run static tests
        run: node --test tests/*.test.js

      - name: Commit final-geometry boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader-versions.js tests/reader-reading-pivot.test.js
          git commit -m "Restore semantic eye-line after View Transition finishes"
          git push

name: One-shot paragraph selection context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-reading-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Upgrade selected text to paragraph comparison
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          dec=lambda s: base64.b64decode(s).decode()
          def once(s,a,b,label):
              if s.count(a)!=1: raise SystemExit(f'{label}: {s.count(a)} anchors')
              return s.replace(a,b,1)
          def block(s,a,b,new,label):
              i=s.find(a); j=s.find(b,i)
              if i<0 or j<0: raise SystemExit(f'{label}: anchor missing')
              return s[:i]+new+s[j:]
          SHOW=''
          CTX=''
          CROSS=''
          STATIC=''
          BROWSER=''
          p=Path('reader-japanese-reference.js'); s=p.read_text(); s=once(s,"el.setAttribute('aria-label', '選択した外国語Mixと日本語版の比較');","el.setAttribute('aria-label', '選択した表現を含む段落と日本語版の比較');",'aria'); s=once(s,'<h2>選択箇所</h2>','<h2>この段落</h2>','heading'); s=once(s,'>SELECTED</p>','>CURRENT PARAGRAPH</p>','label'); s=block(s,'  function show(reference, selectedText) {','  function mount(ctx) {',dec(SHOW),'show'); s=block(s,'  function selectionContext() {','  function resolve() {',dec(CTX),'selection'); old="    if (selection?.invalid) {\n      closePanel();\n      return;\n    }\n    if (selection?.block) show(references.get(selection.block) || null, selection.text);"; s=once(s,old,"    if (selection?.block) show(references.get(selection.block) || null, selection);",'resolve'); p.write_text(s)
          p=Path('reader-japanese-reference.css'); c=p.read_text(); c=once(c,'.japanese-reference-selected-text { white-space: pre-wrap; color: var(--ink); font-size: 13.5px; line-height: 1.72; overflow-wrap: anywhere; }','.japanese-reference-selected-text { white-space: pre-wrap; color: var(--ink); font: 14.5px/1.82 Georgia, "Yu Mincho", serif; overflow-wrap: anywhere; }\n.japanese-reference-selection-mark { padding: 0 .05em; border-radius: .2em; background: rgba(164, 45, 38, .12); color: inherit; box-decoration-break: clone; -webkit-box-decoration-break: clone; }','css'); c=c.replace('.japanese-reference-selected-text { font-size: 13px; line-height: 1.68; }','.japanese-reference-selected-text { font-size: 14px; line-height: 1.76; }'); p.write_text(c)
          p=Path('scripts/japanese-reference-qa.cjs'); q=p.read_text(); q=block(q,'async function assertCrossParagraphSelectionCloses(page) {','\n\n(async () => {',dec(CROSS),'cross QA'); q=q.replace('await assertCrossParagraphSelectionCloses(page);','await assertCrossParagraphSelectionUsesStartParagraph(page);'); p.write_text(q)
          Path('tests/selection-paragraph-comparison.test.js').write_text(dec(STATIC)); Path('scripts/selection-paragraph-qa.cjs').write_text(dec(BROWSER))
          p=Path('.github/workflows/visual-qa.yml'); v=p.read_text(); a="      - name: Run Japanese reference browser QA\n        env:\n          BASE_URL: http://127.0.0.1:4173\n        run: node scripts/japanese-reference-qa.cjs\n"; add=a+"\n      - name: Run selection paragraph comparison QA\n        env:\n          BASE_URL: http://127.0.0.1:4173\n        run: node scripts/selection-paragraph-qa.cjs\n"; v=v if 'Run selection paragraph comparison QA' in v else once(v,a,add,'visual step'); p.write_text(v)
          p=Path('index.html'); h=p.read_text(); h=once(h,'reader-japanese-reference.css?v=20260906-3','reader-japanese-reference.css?v=20260911-1','css cache'); h=once(h,'reader-japanese-reference.js?v=20260907-2','reader-japanese-reference.js?v=20260911-1','js cache'); p.write_text(h)
          PY
      - name: Static QA
        run: node --test tests/*.test.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader-japanese-reference.js reader-japanese-reference.css index.html scripts/japanese-reference-qa.cjs scripts/selection-paragraph-qa.cjs tests/selection-paragraph-comparison.test.js .github/workflows/visual-qa.yml
          git commit -m "Compare selections in full paragraph context"
          git push

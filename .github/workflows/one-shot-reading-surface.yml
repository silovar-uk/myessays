name: One-shot Reading Surface migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-reading-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize migration helper for visible Shell selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/migrate-reading-surface-shell.py')
          text = path.read_text()
          old = "text = text.replace('#readerLanguageInstantDirect [data-reading-mode-intent=', '#readerModeShell [data-reading-mode-intent=')"
          new = "text = text.replace('#readerLanguageInstantDirect ', '#readerModeShell ')"
          if old not in text:
              raise SystemExit('expected selector migration anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply shell migration
        run: python3 tools/migrate-reading-surface-shell.py

      - name: Run static tests
        run: node --test tests/*.test.js

      - name: Commit shell migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader-v2.js reader-mode-shell.js reader-mode-shell.css tests/reader-reading-pivot.test.js tests/reader-mode-shell.test.js scripts/reading-locator-diagnostic.cjs scripts/reading-focus-instant-qa.cjs scripts/reading-versions-qa.cjs scripts/japanese-reference-qa.cjs scripts/reading-mode-url-qa.cjs
          git commit -m "Make Reading Mode Shell the sole progress surface"
          git push

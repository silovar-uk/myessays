name: One-shot View Transition skip handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-reading-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Consume expected skipped-transition AbortError
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, got {count}')
              return text.replace(old, new, 1)

          path = Path('reader-versions.js')
          source = path.read_text()
          old = """        const transition = document.startViewTransition(update);\n        await transition.updateCallbackDone;\n        // View Transition snapshots may continue affecting document geometry\n        // after the DOM callback is complete. Semantic restoration must target\n        // the final live layout, not the intermediate transition geometry.\n        await transition.finished;\n"""
          new = """        const transition = document.startViewTransition(update);\n        // Rapid Reading Mode changes intentionally supersede the previous Ink\n        // Dissolve. Chromium reports that normal cancellation through\n        // transition.ready as AbortError; consume only that expected signal.\n        const transitionReady = transition.ready.catch(error => {\n          if (error?.name === 'AbortError') return false;\n          throw error;\n        });\n        await transition.updateCallbackDone;\n        await transitionReady;\n        // View Transition snapshots may continue affecting document geometry\n        // after the DOM callback is complete. Semantic restoration must target\n        // the final live layout, not the intermediate transition geometry.\n        await transition.finished;\n"""
          source = replace_once(source, old, new, 'View Transition ready handling')
          path.write_text(source)

          test_path = Path('tests/reader-reading-pivot.test.js')
          tests = test_path.read_text()
          marker = "test('rapid mode supersession consumes only expected View Transition AbortError', () => {"
          if marker not in tests:
              tests += """\n\ntest('rapid mode supersession consumes only expected View Transition AbortError', () => {\n  const versions = read('reader-versions.js');\n  const start = versions.indexOf('const transition = document.startViewTransition(update)');\n  const ready = versions.indexOf('transition.ready.catch', start);\n  const abort = versions.indexOf(\"error?.name === 'AbortError'\", ready);\n  const rethrow = versions.indexOf('throw error', abort);\n  const updateDone = versions.indexOf('await transition.updateCallbackDone', rethrow);\n  const readyAwait = versions.indexOf('await transitionReady', updateDone);\n  const finished = versions.indexOf('await transition.finished', readyAwait);\n  assert.ok(start >= 0 && ready > start, 'ready rejection handler should attach immediately after transition creation');\n  assert.ok(abort > ready && rethrow > abort, 'only AbortError may be treated as an expected skip');\n  assert.ok(updateDone > rethrow && readyAwait > updateDone && finished > readyAwait, 'DOM update, ready handling and final geometry should remain ordered');\n});\n"""
              test_path.write_text(tests)
          PY

      - name: Run static tests
        run: node --test tests/*.test.js

      - name: Commit skip handling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader-versions.js tests/reader-reading-pivot.test.js
          git commit -m "Handle expected Reading Mode transition skips"
          git push

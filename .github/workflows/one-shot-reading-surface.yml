name: One-shot Reading Pivot stabilization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-reading-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preserve Pivot across language stable boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pivot_path = Path('reader-reading-pivot.js')
          pivot = pivot_path.read_text()
          old = """  document.addEventListener('myessays:reading-mode-stable', () => {\n    refreshReadingBlocks();\n    scheduleEvaluate({ immediate: true });\n  });\n"""
          new = """  document.addEventListener('myessays:reading-mode-stable', () => {\n    // A language switch changes the DOM, not the reader's semantic position.\n    // Keep the restored Primary Pivot fixed until the next real user scroll;\n    // only recompute the Reading Zone against the new physical paragraphs.\n    refreshReadingBlocks();\n    syncReadingZone(visibleReadingItems());\n    requestAnimationFrame(syncCompareUI);\n  });\n"""
          if pivot.count(old) != 1:
              raise SystemExit(f'expected one stable handler anchor, got {pivot.count(old)}')
          pivot_path.write_text(pivot.replace(old, new, 1))

          test_path = Path('tests/reader-reading-pivot.test.js')
          tests = test_path.read_text()
          marker = "test('stable language handoff keeps the restored Pivot until user scroll', () => {"
          if marker not in tests:
              tests += """\n\ntest('stable language handoff keeps the restored Pivot until user scroll', () => {\n  const pivot = read('reader-reading-pivot.js');\n  const stableStart = pivot.indexOf(\"document.addEventListener('myessays:reading-mode-stable'\");\n  const stableEnd = pivot.indexOf(\"document.addEventListener('myessays:reading-location-changed'\", stableStart);\n  assert.ok(stableStart >= 0 && stableEnd > stableStart, 'stable handler should be inspectable');\n  const stableHandler = pivot.slice(stableStart, stableEnd);\n  assert.match(stableHandler, /refreshReadingBlocks\\(\\)/);\n  assert.match(stableHandler, /syncReadingZone\\(visibleReadingItems\\(\\)\\)/);\n  assert.doesNotMatch(stableHandler, /scheduleEvaluate|candidatePivot|setPivot/);\n  assert.match(pivot, /window\\.addEventListener\\('scroll', \\(\\) => scheduleEvaluate\\(\\)/);\n});\n"""
              test_path.write_text(tests)
          PY

      - name: Run static tests
        run: node --test tests/*.test.js

      - name: Commit stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader-reading-pivot.js tests/reader-reading-pivot.test.js
          git commit -m "Preserve Reading Pivot across language stable boundary"
          git push

name: One-shot Reading Surface migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-reading-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/migrate-reading-surface.py

      - name: Run static tests
        run: node --test tests/*.test.js

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js ui-enhancements.js reading-locators.js reader-v2.js reader-reading-pivot.js reader-reading-pivot.css reader-versions.js reader-language-instant.js tests/reader-reading-pivot.test.js scripts/reading-focus-instant-qa.cjs scripts/reading-versions-qa.cjs
          git commit -m "Unify MyEssays Reading Surface"
          git push

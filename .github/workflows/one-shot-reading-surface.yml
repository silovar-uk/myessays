name: One-shot paragraph selection context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-reading-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply paragraph-context selection comparison
        run: python3 tools/apply-selection-paragraph-context.py
      - name: Static QA
        run: node --test tests/*.test.js
      - name: Commit runtime and QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader-japanese-reference.js reader-japanese-reference.css index.html scripts/japanese-reference-qa.cjs scripts/selection-paragraph-qa.cjs tests/selection-paragraph-comparison.test.js
          git commit -m "Compare selections in full paragraph context"
          git push

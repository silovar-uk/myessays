name: Register logic-story essay once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-logic-story-once.yml'

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register article against latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            node <<'NODE'
          const fs = require('fs');

          const essayPath = 'essays/2026-09-07-logic-opposite-story.md';
          const articleId = 'logic-opposite-story';
          const englishPath = 'english-mix/logic-opposite-story.md';

          const indexPath = 'data/index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          index.essays = Array.isArray(index.essays) ? index.essays : [];
          if (!index.essays.includes(essayPath)) index.essays.unshift(essayPath);
          fs.writeFileSync(indexPath, JSON.stringify(index));

          const versionsPath = 'data/versions-index.json';
          const versions = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          versions.version = versions.version || 1;
          versions.articles = versions.articles && typeof versions.articles === 'object' ? versions.articles : {};
          versions.articles[articleId] = {
            ...(versions.articles[articleId] || {}),
            'en-mix': englishPath
          };
          fs.writeFileSync(versionsPath, JSON.stringify(versions));
          NODE

            git rm -f --ignore-unmatch .github/workflows/register-logic-story-once.yml
            git add data/index.json data/versions-index.json

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "ロジックとストーリー記事を一覧とEnglish Mixへ登録"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Could not push registration after 3 attempts" >&2
          exit 1

name: One-shot versions index repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-versions-index.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair stale English Mix mapping
        shell: python
        run: |
          from pathlib import Path
          path = Path('data/versions-index.json')
          text = path.read_text(encoding='utf-8')
          old = '"xunzi-standard-friction-self-examination":{"en-mix":"english-mix/xunzi-borrowing-external-resources.md"}'
          new = '"xunzi-standard-friction-self-examination":{"en-mix":"english-mix/xunzi-standard-friction-self-examination.md"}'
          if old not in text:
              raise SystemExit('Expected stale mapping was not found; refusing broad rewrite.')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale mapping, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-shot workflow and commit repair
        run: |
          git rm .github/workflows/one-shot-fix-versions-index.yml
          git add data/versions-index.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair stale Xunzi reading version mapping"
          git push
name: Register Amit Zott Business Model Essay

on:
  push:
    paths:
      - '.github/workflows/register-amit-zott-business-model-activity-system-essence.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Register canonical essay and English Mix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const essayPath = 'essays/2026-09-15-amit-zott-business-model-activity-system-essence.md';
          const id = 'amit-zott-business-model-activity-system-essence';
          const mixPath = 'english-mix/amit-zott-business-model-activity-system-essence.md';

          if (!fs.existsSync(essayPath)) throw new Error(`Missing ${essayPath}`);
          if (!fs.existsSync(mixPath)) throw new Error(`Missing ${mixPath}`);

          const indexPath = 'data/index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          index.essays = (index.essays || []).filter((p) => p !== essayPath);
          index.essays.unshift(essayPath);
          fs.writeFileSync(indexPath, JSON.stringify(index));

          const versionsPath = 'data/versions-index.json';
          const versions = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          versions.articles ||= {};
          const existing = versions.articles[id] || {};
          versions.articles = {
            [id]: { ...existing, 'en-mix': mixPath },
            ...Object.fromEntries(Object.entries(versions.articles).filter(([key]) => key !== id))
          };
          fs.writeFileSync(versionsPath, JSON.stringify(versions));

          JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          console.log('Registration JSON prepared and parsed.');
          NODE

      - name: Strictly validate JA and English Mix structure
        run: node scripts/validate-version-structure.mjs --id amit-zott-business-model-activity-system-essence

      - name: Commit registration
        run: |
          if git diff --quiet -- data/index.json data/versions-index.json; then
            echo 'Already registered.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index.json data/versions-index.json
          git commit -m 'アミット＆ゾット論考を登録'
          git pull --rebase origin main
          git push

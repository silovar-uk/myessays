name: Nine Masu Finalize

on:
  push:
    branches: [feat/consulting-nine-masu]
    paths:
      - 'NINE_MASU_QA.trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Merge latest main and resolve known conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add --detach /tmp/myessays-main-baseline origin/main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          echo "merge exit: ${merge_status}"

          for file in data/index.json data/versions-index.json index.html; do
            if git ls-files -u -- "$file" | grep -q .; then
              echo "Resolve $file from latest main, then reapply nine-masu delta"
              git checkout --theirs -- "$file"
            fi
          done

          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const essayPath = 'essays/2026-09-07-consulting-nine-masu-storyboard.md';
          const id = 'consulting-nine-masu-storyboard';
          const enPath = 'english-mix/consulting-nine-masu-storyboard.md';

          const indexPath = 'data/index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          index.essays = [essayPath, ...index.essays.filter(path => path !== essayPath)];
          fs.writeFileSync(indexPath, JSON.stringify(index));

          const versionsPath = 'data/versions-index.json';
          const versions = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          versions.articles ||= {};
          versions.articles[id] = { ...(versions.articles[id] || {}), 'en-mix': enPath };
          fs.writeFileSync(versionsPath, JSON.stringify(versions));

          const htmlPath = 'index.html';
          let html = fs.readFileSync(htmlPath, 'utf8');
          const css = '  <link rel="stylesheet" href="reader-nine-masu.css?v=20260908-1">\n';
          const cssAnchor = '  <link rel="stylesheet" href="reader-v2-compat.css?v=20260907-1">\n';
          if (!html.includes('reader-nine-masu.css')) {
            assert.ok(html.includes(cssAnchor), 'reader CSS anchor missing');
            html = html.replace(cssAnchor, cssAnchor + css);
          }
          const js = '  <script src="reader-nine-masu.js?v=20260908-1" defer></script>\n';
          const jsAnchor = '  <script src="series.js?v=20260824-1651" defer></script>\n';
          if (!html.includes('reader-nine-masu.js')) {
            assert.ok(html.includes(jsAnchor), 'reader JS anchor missing');
            html = html.replace(jsAnchor, jsAnchor + js);
          }
          fs.writeFileSync(htmlPath, html);
          NODE

          git add data/index.json data/versions-index.json index.html
          unmerged="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unmerged" ]; then
            echo "Unexpected unresolved conflicts:"
            echo "$unmerged"
            exit 1
          fi
          echo "All conflicts resolved in working tree"

      - name: Start feature and main baseline sites
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/myessays-feature-server.log 2>&1 &
          (cd /tmp/myessays-main-baseline && python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/myessays-main-server.log 2>&1 &)
          for port in 4173 4174; do
            ok=0
            for i in {1..20}; do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then exit 1; fi
          done

      - name: Static and content checks
        run: |
          node --check reader-nine-masu.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const essayPath = 'essays/2026-09-07-consulting-nine-masu-storyboard.md';
          const index = JSON.parse(fs.readFileSync('data/index.json', 'utf8'));
          const versions = JSON.parse(fs.readFileSync('data/versions-index.json', 'utf8'));
          const html = fs.readFileSync('index.html', 'utf8');
          assert.equal(index.essays[0], essayPath);
          assert.equal(index.essays.filter(x => x === essayPath).length, 1);
          assert.equal(versions.articles['consulting-nine-masu-storyboard']['en-mix'], 'english-mix/consulting-nine-masu-storyboard.md');
          assert.match(html, /reader-nine-masu\.css/);
          assert.match(html, /reader-nine-masu\.js/);
          console.log('Nine-masu registration OK');
          NODE
          node tools/audit-content.mjs --strict
          node --test tests/*.test.js

      - name: Existing browser QA against latest-main baseline
        shell: bash
        run: |
          set -euo pipefail
          qas=(japanese-reference-qa.cjs argument-structure-qa.cjs page-reader-qa.cjs reading-versions-qa.cjs)
          for qa in "${qas[@]}"; do
            echo "=== feature: $qa ==="
            set +e
            BASE_URL=http://127.0.0.1:4173 node "scripts/$qa" > "/tmp/feature-$qa.log" 2>&1
            feature_status=$?
            set -e
            cat "/tmp/feature-$qa.log"
            if [ "$feature_status" -eq 0 ]; then
              echo "$qa passes on feature"
              continue
            fi

            echo "=== latest main baseline: $qa ==="
            set +e
            (cd /tmp/myessays-main-baseline && NODE_PATH="$GITHUB_WORKSPACE/node_modules" BASE_URL=http://127.0.0.1:4174 node "scripts/$qa") > "/tmp/main-$qa.log" 2>&1
            main_status=$?
            set -e
            cat "/tmp/main-$qa.log"

            if [ "$main_status" -eq 0 ]; then
              echo "$qa passes on latest main but fails on feature: regression introduced by nine-masu"
              exit 1
            fi
            echo "$qa also fails on untouched latest main; treating as pre-existing baseline failure"
          done

      - name: Targeted nine-masu browser QA
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          mkdir -p qa-artifacts
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const base = process.env.BASE_URL;
          const id = 'consulting-nine-masu-storyboard';

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });

            await page.goto(`${base}/#/essay/${id}`, { waitUntil: 'networkidle' });
            await page.waitForSelector('.nine-masu-overview');
            assert.equal(await page.locator('.nine-masu-cell').count(), 9);
            assert.equal(await page.locator('.nine-masu-outside').count(), 1);

            const fifth = page.locator('.nine-masu-cell').nth(4);
            await fifth.focus();
            await page.keyboard.press('Enter');
            await page.waitForFunction(() => window.MyEssaysReadingLocation?.currentSection?.().index === 4);
            assert.equal(await fifth.getAttribute('aria-current'), 'step');

            for (const width of [375, 320]) {
              await page.setViewportSize({ width, height: 760 });
              await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'auto' }));
              const overview = await page.locator('.nine-masu-overview').boundingBox();
              assert.ok(overview && overview.x >= -0.5 && overview.x + overview.width <= width + 0.5, `overview overflow at ${width}: ${JSON.stringify(overview)}`);
              const boxes = await page.locator('.nine-masu-cell').evaluateAll(nodes => nodes.map(node => {
                const r = node.getBoundingClientRect();
                return { left: r.left, right: r.right, height: r.height };
              }));
              assert.ok(boxes.every(box => box.left >= -0.5 && box.right <= width + 0.5), `cell overflow at ${width}`);
              assert.ok(boxes.every(box => box.height >= 44), `touch target too short at ${width}`);
              await page.screenshot({ path: `qa-artifacts/nine-masu-${width}.png`, fullPage: false });
            }

            await page.setViewportSize({ width: 1280, height: 800 });
            await page.locator('.nine-masu-cell').nth(4).click();
            await page.waitForFunction(() => window.MyEssaysReadingLocation?.currentSection?.().index === 4);
            const beforeSwitch = await page.evaluate(() => window.MyEssaysReadingLocation?.currentSection?.().index);
            const en = page.locator('[data-reader-mode-version="en-mix"]');
            await en.waitFor();
            await en.click();
            await page.waitForFunction(() => document.querySelector('[data-reader-mode-version="en-mix"]')?.getAttribute('aria-pressed') === 'true');
            await page.waitForSelector('.nine-masu-overview');
            assert.equal(await page.locator('.nine-masu-cell').count(), 9);
            assert.equal(await page.locator('.nine-masu-outside').count(), 1);
            const afterSwitch = await page.evaluate(() => window.MyEssaysReadingLocation?.currentSection?.().index);
            assert.equal(afterSwitch, beforeSwitch, 'JA -> English Mix should preserve section location');

            await page.goto(`${base}/#/essay/design-literacy-visual-hierarchy-attention-order`, { waitUntil: 'networkidle' });
            assert.equal(await page.locator('.nine-masu-overview').count(), 0, 'overview must be article-scoped');
            assert.deepEqual(errors, []);
            await browser.close();
            console.log('Targeted nine-masu browser QA passed');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Finalize merge commit and remove temporary QA files
        shell: bash
        run: |
          set -euo pipefail
          if [ -f IMPLEMENTATION_PLAN_CONSULTING_NINE_MASU.md ]; then
            sed -i 's/Status: content baseline implemented; interactive enhancement pending/Status: implemented; final QA completed on latest main/' IMPLEMENTATION_PLAN_CONSULTING_NINE_MASU.md || true
          fi
          rm -f .github/workflows/nine-masu-qa.yml NINE_MASU_QA.trigger
          git add -A
          git status --short
          git commit -m "Merge latest main and finalize nine-masu reader"
          git push origin HEAD:feat/consulting-nine-masu

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nine-masu-final-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7

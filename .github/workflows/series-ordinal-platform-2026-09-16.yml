name: Series ordinal platform update 2026-09-16

on:
  push:
    paths:
      - '.github/workflows/series-ordinal-platform-2026-09-16.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add series metadata and explicit ordinal UI
        run: |
          python <<'PY'
          from pathlib import Path

          series = {
              'focus-now-here-me-attentional-agency': 1,
              'unfinished-task-attention-residue-return-path': 2,
              'blank-time-spontaneous-thought-unclaimed-attention': 3,
          }

          for slug, order in series.items():
              paths = [
                  Path('english-mix') / f'{slug}.md',
              ]
              matches = list(Path('essays').glob(f'*-{slug}.md'))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one canonical essay for {slug}, found {len(matches)}')
              paths.insert(0, matches[0])

              for path in paths:
                  text = path.read_text(encoding='utf-8')
                  if '\nseries:' not in text.split('---', 2)[1]:
                      marker = 'status: "完成"\n'
                      addition = (
                          'series: "注意の主導権"\n'
                          'seriesId: "attentional-agency"\n'
                          f'seriesOrder: {order}\n'
                      )
                      if marker not in text:
                          raise SystemExit(f'Frontmatter marker missing: {path}')
                      text = text.replace(marker, marker + addition, 1)
                      path.write_text(text, encoding='utf-8')

          js_path = Path('series.js')
          js = js_path.read_text(encoding='utf-8')
          replacements = {
              '<span class="series-count">${series.items.length} essays</span>':
                  '<span class="series-count">全${series.items.length}回</span>',
              '${escapeHtml(series.name)} · ${index + 1}/${series.items.length}':
                  '${escapeHtml(series.name)} · 第${index + 1}回 / 全${series.items.length}回',
              '<span class="reader-series-position">${String(index + 1).padStart(2, \'0\')} / ${String(series.items.length).padStart(2, \'0\')}</span>':
                  '<span class="reader-series-position" aria-label="シリーズ第${index + 1}回、全${series.items.length}回">第${index + 1}回 / 全${series.items.length}回</span>',
          }
          for old, new in replacements.items():
              if old not in js:
                  raise SystemExit(f'Expected series.js target not found: {old}')
              js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')
          PY
      - name: Validate JavaScript and version structure
        run: |
          node --check series.js
          node scripts/validate-version-structure.mjs --id focus-now-here-me-attentional-agency
          node scripts/validate-version-structure.mjs --id unfinished-task-attention-residue-return-path
          node scripts/validate-version-structure.mjs --id blank-time-spontaneous-thought-unclaimed-attention
      - name: Commit platform update
        run: |
          if git diff --quiet -- series.js essays english-mix; then
            echo 'Already updated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add series.js essays english-mix
          git commit -m 'シリーズ記事に第n回表示を追加'
          git push

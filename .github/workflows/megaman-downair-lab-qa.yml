name: Mega Man Down-Air Lab QA

on:
  push:
    branches: [main]
    paths:
      - 'megaman-downair-lab.js'
      - 'megaman-downair-lab.css'
      - 'index.html'
      - 'essays/2026-10-11-megaman-down-air-lowest-height-hard-knuckle.md'
      - 'english-mix/megaman-down-air-lowest-height-hard-knuckle.md'
      - 'scripts/megaman-downair-lab-qa.cjs'
      - '.github/workflows/megaman-downair-lab-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downair-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check megaman-downair-lab.js
          node --check scripts/megaman-downair-lab-qa.cjs
          node scripts/validate-version-structure.mjs --id megaman-down-air-lowest-height-hard-knuckle
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Serve local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mm-downair-site.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mm-downair-site.log
          exit 1
      - name: Run desktop and iPhone-sized browser checks
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/megaman-downair-lab-qa.cjs
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: megaman-downair-qa
          path: qa-artifacts/megaman-downair
          if-no-files-found: warn
          retention-days: 14
name: Register Attention Sequels 2026-09-15

on:
  push:
    paths:
      - '.github/workflows/register-attention-sequels-2026-09-15.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate canonical and English Mix structures
        run: |
          node scripts/validate-version-structure.mjs --id unfinished-task-attention-residue-return-path
          node scripts/validate-version-structure.mjs --id blank-time-spontaneous-thought-unclaimed-attention
      - name: Register essays and English Mix versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const additions = [
            {
              id: 'blank-time-spontaneous-thought-unclaimed-attention',
              essay: 'essays/2026-09-15-blank-time-spontaneous-thought-unclaimed-attention.md',
              mix: 'english-mix/blank-time-spontaneous-thought-unclaimed-attention.md'
            },
            {
              id: 'unfinished-task-attention-residue-return-path',
              essay: 'essays/2026-09-15-unfinished-task-attention-residue-return-path.md',
              mix: 'english-mix/unfinished-task-attention-residue-return-path.md'
            }
          ];

          const indexPath = 'data/index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          for (const item of additions.slice().reverse()) {
            index.essays = index.essays.filter((p) => p !== item.essay);
            index.essays.unshift(item.essay);
          }
          fs.writeFileSync(indexPath, JSON.stringify(index));

          const versionsPath = 'data/versions-index.json';
          const versions = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          versions.articles ||= {};
          for (const item of additions.slice().reverse()) {
            const existing = versions.articles[item.id] || {};
            versions.articles = {
              [item.id]: { ...existing, 'en-mix': item.mix },
              ...Object.fromEntries(Object.entries(versions.articles).filter(([key]) => key !== item.id))
            };
          }
          fs.writeFileSync(versionsPath, JSON.stringify(versions));

          JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          console.log('Registration JSON validated.');
          NODE
      - name: Commit registration
        run: |
          if git diff --quiet -- data/index.json data/versions-index.json; then
            echo 'Already registered.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index.json data/versions-index.json
          git commit -m '集中論考の続編2本をインデックス登録'
          git push

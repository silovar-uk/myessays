name: One-shot register Design Literacy 25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-register-design-literacy-25.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Register canonical essay and English Mix
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          essay_path = 'essays/2026-09-08-design-literacy-icon-label-recognition.md'
          article_id = 'design-literacy-icon-label-recognition'
          en_path = 'english-mix/design-literacy-icon-label-recognition.md'

          index_path = Path('data/index.json')
          data = json.loads(index_path.read_text(encoding='utf-8'))
          essays = data.setdefault('essays', [])
          if essay_path in essays:
              essays.remove(essay_path)
          essays.insert(0, essay_path)
          index_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          versions_path = Path('data/versions-index.json')
          versions = json.loads(versions_path.read_text(encoding='utf-8'))
          articles = versions.setdefault('articles', {})
          existing = articles.pop(article_id, {})
          existing['en-mix'] = en_path
          versions['articles'] = {article_id: existing, **articles}
          versions_path.write_text(json.dumps(versions, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          # Parse again as a syntax/round-trip check.
          json.loads(index_path.read_text(encoding='utf-8'))
          json.loads(versions_path.read_text(encoding='utf-8'))
          PY

      - name: Commit registration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/versions-index.json
          git rm .github/workflows/one-shot-register-design-literacy-25.yml
          git commit -m "Design Literacy #25をライブラリへ登録"
          git push

name: Register Ekiden Sequel Essays

on:
  push:
    paths:
      - '.github/workflows/register-ekiden-sequels-ngaru-corridor.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Register canonical essays and English Mix versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const items = [
            {
              id: 'ngaru-high-school-data-ghost',
              essay: 'essays/2026-09-15-ngaru-high-school-data-ghost.md',
              mix: 'english-mix/ngaru-high-school-data-ghost.md'
            },
            {
              id: 'kenyan-runners-japan-talent-corridor',
              essay: 'essays/2026-09-15-kenyan-runners-japan-talent-corridor.md',
              mix: 'english-mix/kenyan-runners-japan-talent-corridor.md'
            }
          ];

          const indexPath = 'data/index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          for (const { essay } of items) index.essays = index.essays.filter((p) => p !== essay);
          index.essays.unshift(...items.map((x) => x.essay));
          fs.writeFileSync(indexPath, JSON.stringify(index));

          const versionsPath = 'data/versions-index.json';
          const versions = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          versions.articles ||= {};
          const additions = {};
          for (const { id, mix } of items) additions[id] = { ...(versions.articles[id] || {}), 'en-mix': mix };
          versions.articles = {
            ...additions,
            ...Object.fromEntries(Object.entries(versions.articles).filter(([id]) => !items.some((x) => x.id === id)))
          };
          fs.writeFileSync(versionsPath, JSON.stringify(versions));

          JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          NODE

      - name: Validate Ngaru structure
        run: node scripts/validate-version-structure.mjs --id ngaru-high-school-data-ghost

      - name: Validate talent corridor structure
        run: node scripts/validate-version-structure.mjs --id kenyan-runners-japan-talent-corridor

      - name: Commit registration
        run: |
          if git diff --quiet -- data/index.json data/versions-index.json; then
            echo 'Already registered.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index.json data/versions-index.json
          git commit -m '駅伝留学生の続編2本をライブラリへ登録'
          git push

name: Register TMS Sequels Uneven U

on:
  push:
    paths:
      - '.github/workflows/register-tms-sequels-uneven-u.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Register canonical essays and English Mix versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const items = [
            {
              id: 'transactive-memory-stale-map-turnover',
              essay: 'essays/2026-09-15-transactive-memory-stale-map-turnover.md',
              mix: 'english-mix/transactive-memory-stale-map-turnover.md'
            },
            {
              id: 'transactive-memory-ai-teammate',
              essay: 'essays/2026-09-15-transactive-memory-ai-teammate.md',
              mix: 'english-mix/transactive-memory-ai-teammate.md'
            }
          ];
          const indexPath = 'data/index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          for (const { essay } of items) index.essays = index.essays.filter((p) => p !== essay);
          index.essays.unshift(...items.map((x) => x.essay));
          fs.writeFileSync(indexPath, JSON.stringify(index));

          const versionsPath = 'data/versions-index.json';
          const versions = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          versions.articles ||= {};
          const additions = {};
          for (const { id, mix } of items) additions[id] = { ...(versions.articles[id] || {}), 'en-mix': mix };
          versions.articles = {
            ...additions,
            ...Object.fromEntries(Object.entries(versions.articles).filter(([id]) => !items.some((x) => x.id === id)))
          };
          fs.writeFileSync(versionsPath, JSON.stringify(versions));
          JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          NODE

      - name: Validate sequel 1 structure
        run: node scripts/validate-version-structure.mjs --id transactive-memory-stale-map-turnover

      - name: Validate sequel 2 structure
        run: node scripts/validate-version-structure.mjs --id transactive-memory-ai-teammate

      - name: Commit registration
        run: |
          if git diff --quiet -- data/index.json data/versions-index.json; then
            echo 'Already registered.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index.json data/versions-index.json
          git commit -m 'トランザクティブメモリー続編2本を登録'
          git push

name: Sync content index

on:
  push:
    branches: [main]
    paths:
      - 'essays/**'
      - 'english-mix/**'
      - 'spanish-mix/**'

permissions:
  contents: write

concurrency:
  group: content-index-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Move to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Generate indexes from Markdown
        run: |
          node scripts/build-content-index.mjs --write
          node scripts/build-content-index.mjs --check
          node tools/audit-content.mjs --strict > /tmp/content-audit.md

      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/versions-index.json
          if git diff --cached --quiet; then
            echo "Content indexes are already synchronized."
            exit 0
          fi
          git commit -m "Markdownからcontent indexを同期"
          git push origin main

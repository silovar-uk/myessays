name: One-shot enable Reading Pivot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-enable-reading-pivot.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add Reading Pivot assets to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          css_anchor = '  <link rel="stylesheet" href="reader-v2-compat.css?v=20260907-1">'
          css_line = '  <link rel="stylesheet" href="reader-reading-pivot.css?v=20260907-1">'
          js_anchor = '  <script src="reader-v2-stability.js?v=20260907-1" defer></script>'
          js_line = '  <script src="reader-reading-pivot.js?v=20260907-1" defer></script>'
          if css_line not in text:
              if css_anchor not in text:
                  raise SystemExit('CSS anchor not found')
              text = text.replace(css_anchor, css_anchor + '\n' + css_line, 1)
          if js_line not in text:
              if js_anchor not in text:
                  raise SystemExit('JS anchor not found')
              text = text.replace(js_anchor, js_anchor + '\n' + js_line, 1)
          path.write_text(text)
          PY

      - name: Commit final wiring and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-shot-enable-reading-pivot.yml
          git commit -m "Wire Reading Pivot into Reader"
          git push
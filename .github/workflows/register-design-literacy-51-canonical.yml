name: Register Design Literacy 51 Canonical

on:
  push:
    paths:
      - '.github/workflows/register-design-literacy-51-canonical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update indexes
        shell: python
        run: |
          import json
          from pathlib import Path

          slug = 'design-literacy-content-driven-breakpoints'
          essay_path = f'essays/2026-09-17-{slug}.md'
          en_path = f'english-mix/{slug}.md'

          index_path = Path('data/index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          essays = index['essays']
          if essay_path not in essays:
              essays.insert(0, essay_path)
          index_path.write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          versions_path = Path('data/versions-index.json')
          versions = json.loads(versions_path.read_text(encoding='utf-8'))
          versions.setdefault('articles', {})[slug] = {'en-mix': en_path}
          versions_path.write_text(json.dumps(versions, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

      - name: Validate version structure
        run: node scripts/validate-version-structure.mjs --id design-literacy-content-driven-breakpoints

      - name: Commit and push index updates
        run: |
          if git diff --quiet; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/versions-index.json
          git commit -m "Design Literacy #51をインデックス登録"
          git pull --rebase origin main
          git push origin main

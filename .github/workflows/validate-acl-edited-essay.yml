name: Validate ACL Edited Essay

on:
  push:
    paths:
      - '.github/workflows/validate-acl-edited-essay.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate version structure
        run: node scripts/validate-version-structure.mjs --id acl-tear-diagonal-knee-stopper

name: One-shot Fix Transactive Memory EN MIX

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-transactive-memory-enmix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize one conversational expression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('english-mix/transactive-memory-who-knows-what.md')
          s = p.read_text()
          old = 'At first, I thought: 「要するに、記憶の外注やな」'
          new = 'At first, I thought: 「要するに、記憶の外注か」'
          if old not in s:
              raise SystemExit('target phrase not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate structure
        run: node scripts/validate-version-structure.mjs --id transactive-memory-who-knows-what
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add english-mix/transactive-memory-who-knows-what.md
          git commit -m '英語交じり版の口語表現を標準語に修正'
          git push

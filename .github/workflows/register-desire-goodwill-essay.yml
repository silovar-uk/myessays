name: Register Desire Goodwill Essay

on:
  push:
    paths:
      - '.github/workflows/register-desire-goodwill-essay.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Register essay and English Mix version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const id = 'kenyan-runners-desire-goodwill-moral-economy';
          const essay = 'essays/2026-09-15-kenyan-runners-desire-goodwill-moral-economy.md';
          const mix = 'english-mix/kenyan-runners-desire-goodwill-moral-economy.md';

          const indexPath = 'data/index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          index.essays = index.essays.filter((p) => p !== essay);
          index.essays.unshift(essay);
          fs.writeFileSync(indexPath, JSON.stringify(index));

          const versionsPath = 'data/versions-index.json';
          const versions = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          versions.articles ||= {};
          versions.articles = {
            [id]: { ...(versions.articles[id] || {}), 'en-mix': mix },
            ...Object.fromEntries(Object.entries(versions.articles).filter(([key]) => key !== id))
          };
          fs.writeFileSync(versionsPath, JSON.stringify(versions));

          JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          NODE

      - name: Validate structure
        run: node scripts/validate-version-structure.mjs --id kenyan-runners-desire-goodwill-moral-economy

      - name: Commit registration
        run: |
          if git diff --quiet -- data/index.json data/versions-index.json; then
            echo 'Already registered.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index.json data/versions-index.json
          git commit -m '欲望と善意の記事をライブラリへ登録'
          git push

name: One-shot Favorite metadata removal

on:
  push:
    branches: [feature/reader-resonance]
    paths:
      - '.github/workflows/one-shot-remove-favorite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/reader-resonance

      - name: Remove legacy favorite front matter
        run: node tools/remove-favorite-frontmatter.mjs --write

      - name: Verify favorite migration
        run: node tools/remove-favorite-frontmatter.mjs --check

      - name: Run JavaScript tests
        run: node --test tests/favorite-removal.test.js tests/reader-resonance.test.js tests/reader-reflections.test.js tests/reader-architecture.test.js tests/runtime-assets.test.js

      - name: Commit migrated content
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add essays english-mix spanish-mix
          git commit -m "旧Favoriteメタデータを削除"
          git push origin HEAD:feature/reader-resonance

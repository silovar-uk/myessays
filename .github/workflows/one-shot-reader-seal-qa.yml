name: One-shot Reader Seal QA
# rerun after reflection focus test normalization

on:
  push:
    branches: [feature/reader-seal]
    paths:
      - '.github/workflows/one-shot-reader-seal-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/reader-seal
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check reader-resonance.js
          node --check reader-reflections.js
          node --check reader-v2.js

      - name: Static tests
        run: |
          node --test tests/reader-resonance.test.js tests/reader-reflections.test.js tests/reader-architecture.test.js tests/runtime-assets.test.js

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/reader-seal.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reader-seal.log
          exit 1

      - name: Exercise Reader Seal UX
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

            const card = page.locator('#essayGrid [data-id]').first();
            await card.waitFor();
            const essayId = await card.getAttribute('data-id');
            await card.click();
            await page.waitForSelector('.reader-resonance');

            const root = page.locator('.reader-resonance');
            const seal = page.locator('[data-resonance-seal]');
            const rating = page.locator('[data-resonance-rating]');
            const reflections = page.locator('.reader-reflections');

            const initial = await root.boundingBox();
            const initialSeal = await seal.boundingBox();
            assert.ok(initial.width <= 300, `initial reader seal root too wide: ${initial.width}`);
            assert.ok(initialSeal.width <= 180 && initialSeal.height >= 44, `seal dimensions unexpected: ${JSON.stringify(initialSeal)}`);
            assert.equal(await rating.isHidden(), true, 'rating must be hidden before completion');
            assert.equal(await reflections.isHidden(), true, 'reflection control must be hidden before completion');

            await seal.click();
            await page.waitForFunction(id => {
              const raw = localStorage.getItem('myessays:reading-state:' + id);
              return raw && Boolean(JSON.parse(raw).completedAt);
            }, essayId);
            await rating.waitFor({ state: 'visible' });
            await reflections.waitFor({ state: 'visible' });

            const completedSeal = await seal.boundingBox();
            const scale = await page.locator('.reader-resonance-scale').boundingBox();
            assert.ok(completedSeal.width <= 140, `completed seal should shrink: ${completedSeal.width}`);
            assert.ok(scale.width <= 240, `rating cluster too wide: ${scale.width}`);
            assert.equal(await page.locator('[data-reflection-panel]').isHidden(), true, 'reflection composer must stay collapsed');

            await page.locator('input[name="reader-resonance"][value="4"]').check();
            await page.locator('[data-resonance-summary]').waitFor({ state: 'visible' });
            assert.equal(await rating.isHidden(), true, 'rating must collapse after selection');
            assert.match(await page.locator('[data-resonance-summary]').innerText(), /4\s*かなり残った/);

            const disclosure = page.locator('[data-reflection-disclosure]');
            await disclosure.click();
            await page.locator('[data-reflection-panel]').waitFor({ state: 'visible' });
            const input = page.locator('.reflection-composer-input');
            await input.fill('余韻を壊さず閉じられる。');
            await page.locator('.reflection-add-button').click();
            await page.locator('[data-reflection-panel]').waitFor({ state: 'hidden' });
            assert.match(await disclosure.innerText(), /ひとこと残しました|メモ 1件/);

            await page.setViewportSize({ width: 390, height: 844 });
            await page.reload({ waitUntil: 'networkidle' });
            await page.waitForSelector('.reader-resonance');
            const mobileRoot = await root.boundingBox();
            const mobileSeal = await seal.boundingBox();
            assert.ok(mobileRoot.width <= 286, `mobile root must not go full width: ${mobileRoot.width}`);
            assert.ok(mobileSeal.width <= 140, `mobile completed seal too wide: ${mobileSeal.width}`);
            assert.equal(await page.locator('[data-reflection-panel]').isHidden(), true, 'reflection remains collapsed after reload');

            console.log(JSON.stringify({
              essayId,
              initialRoot: initial,
              initialSeal,
              completedSeal,
              ratingScale: scale,
              mobileRoot,
              mobileSeal,
              result: 'ok'
            }));

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

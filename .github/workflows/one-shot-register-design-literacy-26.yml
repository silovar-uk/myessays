name: One-shot register Design Literacy 26

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-register-design-literacy-26.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Register canonical article and English Mix
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          essay_path = 'essays/2026-09-08-design-literacy-weingart-rule-deviation-grid.md'
          article_id = 'design-literacy-weingart-rule-deviation-grid'
          en_path = 'english-mix/design-literacy-weingart-rule-deviation-grid.md'

          index_path = Path('data/index.json')
          index = json.loads(index_path.read_text())
          essays = index.setdefault('essays', [])
          if essay_path not in essays:
              essays.insert(0, essay_path)
          index_path.write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')) + '\n')

          versions_path = Path('data/versions-index.json')
          versions = json.loads(versions_path.read_text())
          articles = versions.setdefault('articles', {})
          existing = articles.get(article_id, {})
          existing['en-mix'] = en_path
          reordered = {article_id: existing}
          for key, value in articles.items():
              if key != article_id:
                  reordered[key] = value
          versions['articles'] = reordered
          versions_path.write_text(json.dumps(versions, ensure_ascii=False, separators=(',', ':')) + '\n')

          # Parse again as a syntax check.
          json.loads(index_path.read_text())
          json.loads(versions_path.read_text())
          PY

      - name: Commit registration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/versions-index.json
          git rm .github/workflows/one-shot-register-design-literacy-26.yml
          git commit -m "Design Literacy #26をライブラリへ登録"
          git push

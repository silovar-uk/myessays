name: Build Library Catalog

on:
  push:
    branches: [main]
    paths:
      - 'essays/**'
      - 'english-mix/**'
      - 'spanish-mix/**'
      - 'data/index.json'
      - 'data/versions-index.json'
      - 'data/publication-holds.json'
      - 'scripts/build-library-data.mjs'
      - 'tests/library-catalog.test.js'
      - 'app.js'
      - '.github/workflows/build-library-data.yml'
  workflow_dispatch:

# Keep only the newest pending catalog task when authors register several files
# in quick succession. Every attempt rebuilds against the live branch head.
concurrency:
  group: library-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-library:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild against current main and publish safely
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "Catalog publication attempt ${attempt}/5"
            # Other processes can publish between checkout and this step.
            # Always discard this job's generated working copy, never remote edits.
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-library-data.mjs
            node --check app.js
            node --test tests/data-integrity.test.js tests/library-catalog.test.js
            git add data/catalog.json data/search/

            if git diff --cached --quiet; then
              echo 'Catalog matches the latest main commit.'
              exit 0
            fi

            git commit -m '記事カタログと検索索引を更新'
            if git push origin HEAD:main; then
              echo 'Published catalog successfully.'
              exit 0
            fi
            echo 'main advanced while publishing; regenerate against latest head.'
          done

          echo 'Catalog could not be published after 5 safe attempts.'
          exit 1
